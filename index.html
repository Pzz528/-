    Bubbles.push(q, {key:'talk-ask-'+a.k+'-'+now, sub:CONFIG.TALK.SUB,
                     opts, hold:CONFIG.TALK.ASK.HOLD});
    return true;
  },
  tick(now){
    now = now || Date.now();
    if(this._lastCheck === -1) return false;
    if(now - this._lastCheck < 10000) return false;      // 每 10 秒看一次就够（ctx 不便宜）
    this._lastCheck = now;
    if(!this.canAsk(now)) return false;
    const r = this.reason(now);
    if(!r) return false;
    return this.ask(r.a, r.c, now);
  },

  /* ── ③ 剧情章节：一句一句往下走 ──
     · 要你点的那种（剧情章节）：右下角「继续 ▸」，一句等你一下
     · opt.auto 那种（★ v1.7.19 她主动来找你的那一段）：**不用你点**，她自己一句一句
       往下说，每句隔 opt.auto 毫秒。同一套剧本机制、同一套换脸，只是推进的由头不同 */
  scripting(){ return !!this._script; },
  /* 「她主动那一段」的自动推进闹钟 —— 收场 / 被点掉 / 切页时必须停 */
  _autoT:0,
  _clearAuto(){ if(this._autoT){ clearTimeout(this._autoT); this._autoT = 0; } },
  _autoNext(s, ms){
    this._clearAuto();
    this._autoT = setTimeout(()=>{
      this._autoT = 0;
      if(this._script === s) this.next();      // 这一场还在（没被点掉）才往下说
    }, ms || CONFIG.TALK.ASK.LINE_MS);
  },
  script(lines, opt){
    opt = opt || {};
    if(!lines || !lines.length) return false;
    if(S.view !== 'home' && S.view !== 'mspace') return false;
    this._clearAuto();
    this._script = {lines, i:0, sub:opt.sub||'', face:opt.face||'', emo:opt.emo||'',
                    end:opt.end||null, auto:opt.auto||0, go:opt.go||null};
    return this._step();
  },
  _step(){
    const s = this._script;
    if(!s) return false;
    /* ★ v1.7.19：这里必须用**富的那份** talkCtx —— 「她自己接着说的那两句」（more）
       是照着她主动搭话那套字段写的（c.streak / c.spaceName / c.dayDone…），
       用 Her.ctx 会把这些念成字面上的「undefined」 */
    const ctx = talkCtx(Date.now());
    const raw = s.lines[s.i];
    let face = s.face, emo = s.emo, src = raw;
    /* 这一句自带表情/头像就听它的（一章里能换好几张脸——这才叫「剧情」） */
    if(raw && typeof raw === 'object' && !Array.isArray(raw)){ face = raw.face || face; emo = raw.emo || emo; src = raw.t; }
    const text = this.one(src, ctx);
    /* 这条念不出来 → 当场收场，别把她卡在半句上。
       ★ 这里**返回 false**（不是 finish 的 true）：回给 script() 的意思就是「这一场没演成」，
         于是 Story 不会把「第 N 章」记成演过了 —— 一辈子只演一次的那一场，
         绝不能因为一句台词写崩就白白烧掉 */
    if(!text){ this.finish(); return false; }
    if(emo && typeof Emo !== 'undefined') Emo.set(emo, '剧情');
    /* ★ v1.7.18：这一句该露哪张脸 → 直接换到界面里那张大立绘上（不在气泡里放图） */
    this.showFace(face, emo);
    const last = (s.i >= s.lines.length - 1);
    if(s.auto){
      /* ★ v1.7.19：她主动来找你的那一段 —— 她一页一页自己说下去，不用你点。
         最后一句停久一点（TALK.HOLD），你要点「点我看详情 →」还有时间；说到最后一句
         这一场就算讲完了（abort(true) 只清剧本、**不动气泡**，气泡到点自己收） */
      Bubbles.push(text, {say:true, force:true, sub:s.sub,
        go: last ? s.go : null,
        hold: last ? CONFIG.TALK.HOLD : (s.auto + 1600)});
      if(last) this.abort(true); else this._autoNext(s, s.auto);
      return true;
    }
    Bubbles.push(text, {say:true, force:true, sub:s.sub,
      opts:[{t: last ? '嗯！' : '继续 ▸', action: last ? 'talk-end' : 'talk-next'}],
      hold:120000});                                      // 她等你点，别自己走掉
    return true;
  },
  next(){
    const s = this._script;
    if(!s) return false;
    s.i++;
    if(s.i >= s.lines.length) return this.finish();
    return this._step();
  },
  /* 收场：剧本清掉 + 跑收尾（让她走回中间）。★ 里面**绝对不能**调 Bubbles.dismiss()——
     那是 dismiss 自己会走的回头路，会绕成死循环（见 Bubbles.dismiss 里那句注释） */
  /* ★ v1.7.17：收场时告诉剧本「是讲完了还是被点了」——
     剧情章节一辈子只演一次（开演就落账），可要是你手一滑把气泡点掉了，
     那一章就永远看不到了。所以 abort(done) 把这事说清楚：
       · 一路点到底 → done=true（这一章算讲过了）
       · 半路被点掉 → done=false（Story 把账抹掉，过一会儿她再找机会重讲） */
  abort(done){
    const s = this._script;
    this._clearAuto();                                    // ★ v1.7.19：自动往下说的那个闹钟一起停
    this._script = null;
    try{ if(s && s.end) s.end(done === true); }catch(e){}
    return true;
  },
  finish(){
    this.abort(true);
    Bubbles.dismiss();                                    // 收场
    return true;
  }
};

/* ══════════════════════════════════════════════════════════════
   9.656 她的走位 Spot（v1.7.17）：从中间挪到左边/右边，在那边待一会儿再走回来
   ★ 只动 .mascot-walk 这一层的 class（她的戏）；.mascot-pos 里你摆的位置一个字都不碰
   ★ 走过去的那 1.15 秒配上 act-walk（一颠一颠 + 朝行进方向微微倾斜）——
     不然就是「一张画滑过去」，不是「她走过去」
   ══════════════════════════════════════════════════════════════ */
const Spot = {
  cur:'c',          // 她现在站在哪儿（c 中间 / l 左 / r 右 / ll 更左 / rr 更右）
  _t:null,
  POS:{c:'', l:'walk-l', r:'walk-r', ll:'walk-ll', rr:'walk-rr'},
  el(){ try{ return document.querySelector('#view-root .mascot-walk'); }catch(e){ return null; } },
  /* 重画时带上的 class（_mascotZone 用它——不然原地刷新一下她就弹回中间） */
  cls(){ const k = this.POS[this.cur]; return k ? (' ' + k) : ''; },
  go(pos, holdMs){
    if(!this.POS.hasOwnProperty(pos)) return false;
    if(this._t){ try{ clearTimeout(this._t); }catch(e){} this._t = null; }
    const moved = (pos !== this.cur);
    this.cur = pos;                                       // 先记着：立绘不在场也算她站过去了
    const el = this.el();
    if(el && el.classList){
      for(const k in this.POS) if(this.POS[k]) el.classList.remove(this.POS[k]);
      if(this.POS[pos]) el.classList.add(this.POS[pos]);
    }
    if(moved && el && typeof Director !== 'undefined'){
      try{ Director.act('act-walk'); }catch(e){}
    }
    if(holdMs) this._t = setTimeout(()=>{ this._t = null; this.back(); }, holdMs);
    return true;
  },
  back(){ return this.go('c'); },
  reset(){
    if(this._t){ try{ clearTimeout(this._t); }catch(e){} this._t = null; }
    this.cur = 'c';
    const el = this.el();
    if(el && el.classList) for(const k in this.POS) if(this.POS[k]) el.classList.remove(this.POS[k]);
  },
  /* 她自己挑个地方待一会儿（空闲导演用）：多半是走到左右，偶尔只是小挪一下 */
  wander(){
    const r = Math.random();
    let pos;
    if(r < 0.46) pos = (Math.random() < 0.5) ? 'l' : 'r';
    else if(r < 0.72) pos = (Math.random() < 0.5) ? 'll' : 'rr';
    else pos = 'c';
    if(pos === this.cur) pos = (this.cur === 'c') ? 'l' : 'c';
    const hold = CONFIG.ACT.WALK_HOLD_MS + Math.random() * CONFIG.ACT.WALK_HOLD_RAND;
    this.go(pos, hold);
    return pos;
  }
};

/* ══════════════════════════════════════════════════════════════
   9.657 剧情章节 Story（v1.7.17 = v1.7b 的下篇）：里程碑到了就演一场
   ★ 条件表在 CONFIG.STORY.CHAPTERS（第几天 / 连续几天 / 等级 / 完成数 / 关系阶段）
   ★ 一场戏 = 她走个位 + 演动作帧 + 变脸 + 说一段（点「继续」往下走）
   ★ 每章只演一次，演过记进 settings.herChapter —— 换手机、清缓存都不会重演
   ══════════════════════════════════════════════════════════════ */
const Story = {
  _last:0,
  state(){
    let v = S.settings.herChapter;
    if(!v || typeof v !== 'object') v = {};
    S.settings.herChapter = v;
    return v;
  },
  played(id){ return !!this.state()[id]; },
  playedN(){ const v = this.state(); let n = 0; for(const k in v) if(v[k]) n++; return n; },
  mark(id, now){ this.state()[id] = D.dateKey(now || Date.now()); saveSettings(); },
  /* 把「演过了」这笔账抹掉（这一场没讲完就被点掉了）——下一轮她再讲 */
  unmark(id){ try{ delete this.state()[id]; saveSettings(); }catch(e){} },
  /* 里程碑要看的那几个数（全部来自真实数据，一个都不许编）
     ★ v1.7.19：数搬到共用的 talkCtx() 里去了（她主动来找你那份也要同一套字段） */
  ctx(now){ return talkCtx(now); },
  /* 该演哪一章：按表里的顺序，第一张「没演过 + 条件成立」的 */
  next(now){
    const c = this.ctx(now);
    for(const ch of CONFIG.STORY.CHAPTERS){
      if(this.played(ch.id)) continue;
      let ok = false;
      try{ ok = !!ch.when(c); }catch(e){ ok = false; }
      if(ok) return {ch, c};
    }
    return null;
  },
  play(ch){
    if(!ch) return false;
    if(S.view !== 'home' && S.view !== 'mspace') return false;   // 只在纯净页演（别的地方没地方挂气泡）
    const now = Date.now();
    if(ch.pos && typeof Spot !== 'undefined') Spot.go(ch.pos);
    if(ch.seq && typeof Seq !== 'undefined') Seq.play(ch.seq);
    if(ch.emo && typeof Emo !== 'undefined') Emo.set(ch.emo, '剧情', now);
    const ok = Talk.script(ch.lines, {
      sub:'第 '+ch.no+' 章 · '+ch.name, face:ch.face, emo:ch.emo,
      /* 演完她自己走回中间；半路被点掉（done=false）就把这一章的账退回去，
         过一会儿她再找机会重新讲一遍（手滑点掉不会让一章永远消失） */
      end:(done)=>{ if(typeof Spot !== 'undefined') Spot.back(); if(!done) Story.unmark(ch.id); }
    });
    if(!ok) return false;
    this.mark(ch.id, now);                                  // 开演就落账（演到一半关掉也不会重来）
    if(typeof Love !== 'undefined') Love.gain('chapter', now);
    return true;
  },
  tick(now){
    now = now || Date.now();
    if(now - this._last < CONFIG.STORY.CHECK_MS) return false;
    this._last = now;
    if(S.view !== 'home' && S.view !== 'mspace') return false;
    if(this.playedN() >= CONFIG.STORY.CHAPTERS.length) return false;
    if(typeof Talk !== 'undefined' && Talk.scripting()) return false;
    if(typeof Bubbles !== 'undefined' && Bubbles.active && Bubbles.active.opts) return false;
    if(typeof Director !== 'undefined' && Director._playing) return false;
    if(S.consOpen) return false;
    if(typeof UI !== 'undefined' && UI.isOpen && UI.isOpen()) return false;
    if(typeof Portal !== 'undefined' && Portal._active) return false;
    /* 她把「说话频率」调成关掉的时候，剧情也不硬演（那是她的选择） */
    if((S.settings.herVoice || 'normal') === 'off') return false;
    if(typeof Love !== 'undefined' && Love.idleMs(now) < CONFIG.STORY.GAP_MS) return false;
    const r = this.next(now);
    if(!r) return false;
    return this.play(r.ch);
  }
};


/* ══════════════════════════════════════════════════════════════
   9.7 主线剧情 Storyline（v1.8.0）——她点名的：「像 galgame 一样，她有人设有剧情，
   用户过剧情像看小说一样，随等级推进随天数推进随各种变化推进」
   ★ 真身在 CONFIG.STORYLINE（人设 + 38 章 + need 条件表），这里只**算**和**存**
   ★ 数据全挂 settings（零迁移、跟着备份走）：
     herStory     = {ch:'s3', i:7}        正在读的那一章 + 已经讲到第几段
     herStoryDone = {s0:ts, s1:ts}        读完的章（时间戳；重读不会重复给好感）
     herStoryPick = {'s1:8':1}            第 8 段那道选择题你选了第几个
     herStoryDay  = {dk:'2026-09-14', n:12}  今天已经推进了几段（PER_DAY 那道闸）
     herStoryAsk  = {dk:…}                今天已经拿「接着讲」这个由头问过未
   ★ 「解锁判定」和「还差什么」共用 need 一张表（v1.7.15 的教训：同一件事别写两遍） */
const Storyline = {
  /* ── 表 ── */
  chapters(){ return CONFIG.STORYLINE.CHAPTERS; },
  byId(id){ return this.chapters().filter(c=>c.id===id)[0] || null; },
  /* 「第 N 章」怎么念——序章不带编号（写「第 0 章」读着别扭）。
     页头 / 章卡 / 「接着讲」/「接着读」四处都走它一处，不在页面里各拼各的 */
  noText(ch){ return (ch && ch.no) ? ('第 ' + ch.no + ' 章') : '序章'; },
  /* 人设卡：名字从 CONFIG.LOVE.NAME 取（改名只改那一处，不在两张表里各写一遍） */
  her(){
    const out = {}, src = CONFIG.STORYLINE.HER;
    for(const k in src) out[k] = src[k];
    out.name = CONFIG.LOVE.NAME;
    return out;
  },

  /* ── 进度 ── */
  done(){ let v = S.settings.herStoryDone; if(!v || typeof v!=='object'){ v = {}; S.settings.herStoryDone = v; } return v; },
  read(id){ return !!this.done()[id]; },
  /* {ch: 正在读的那一章, i: 讲到第几段, marks: {章号 → 讲到第几段}}
     —— marks 是每一章的书签：翻到别的章去，回来还接着上次那一段（不是从头） */
  cur(){
    let v = S.settings.herStory;
    if(!v || typeof v!=='object') v = {ch:null, i:0, marks:{}};
    if(!v.marks || typeof v.marks !== 'object') v.marks = {};
    S.settings.herStory = v;
    return v;
  },
  /* 正在读的那一章（没有 = null）*/
  scene(){
    const c = this.cur();
    if(!c.ch) return null;
    return this.byId(c.ch);
  },
  /* ★ 现在是不是「在读剧情」——纯净页判定（renderView 的 isPure）、Q版小人该不该躲开、
     气泡那个位置要不要让出来，都用它，只有这一处判断，别在别处再写一遍。
     ★ v1.8.1（她要求的「剧情可以在纯净主页推进，专门跑去页面读太麻烦了」）：
     阅读**从 story 那一页搬到了纯净主页**——她站着的那两个页面（首页 / 她的世界）底下
     浮一块台词板出来，一边看着她一边读。S.storyPanel 是「这块板现在开着吗」
     （只活在这一次运行里，不落库：下次打开不该突然弹一块板出来） */
  panel(){ return (S.view === 'home' || S.view === 'mspace') && !!S.storyPanel && !!this.scene(); },
  on(){ return this.panel(); },
  /* ── 打开/合上那块台词板 ──
     打开：把书翻到「正在进行的那一章」——没有正在读的就挑一章能读的（resumeOrNext），
     并且**把她此刻该有的那张脸挂上**（常驻，见 HerBody.hold） */
  openPanel(id, now){
    now = now || Date.now();
    if(id) this.open(id);
    else if(!this.scene()) this.resumeOrNext(now);
    if(!this.scene()) return false;
    S.storyPanel = true;
    this.showLine(this.scene(), now);
    saveSettings();
    return true;
  },
  closePanel(){
    S.storyPanel = false;
    this.clearFace();
  },
  /* 没在读哪一章时，**接着讲**：先给「读完前一章、条件也够了」的下一章；
     没有就翻回上次读到一半的那一章；再没有就从序章开始 */
  resumeOrNext(now){
    now = now || Date.now();
    const rd = this.ready(now);
    if(rd){ this.open(rd.id); return rd; }
    const c = this.ctx(now);
    for(const ch of this.chapters()){
      if(this.read(ch.id)) continue;
      if(this.lineNo(ch.id) > 0 && this.unlocked(ch, c)){ this.open(ch.id); return ch; }
    }
    const first = this.chapters()[0] || null;
    if(first) this.open(first.id);
    return first;
  },
  /* ── 台词板 / 阅读：她此刻该是哪张脸 ──
     ★ v1.8.1 她提的：「剧情模式下的表情是**常驻**的，直到用户点击下一段话
     触发新的表情的时候再切换」→ 走 HerBody.hold（不挂闹钟），
     下一段自己会换、合上时 clearFace 换回来（详见 HerBody.temp 的注释） */
  lineFace(ch, i){
    const L = (ch && ch.lines) || [];
    const ln = (i > 0) ? L[i - 1] : null;
    if(!ln) return null;
    if(ln.sel){
      const k = this.picks()[ch.id + ':' + (i - 1)];
      return (k == null) ? null : (ln.sel[k] || null);
    }
    return ln;
  },
  showLine(ch, now){
    const ln = this.lineFace(ch, this.lineNo(ch.id));
    if(!ln) return false;
    if(ln.emo && typeof Emo !== 'undefined'){ try{ Emo.set(ln.emo, '剧情', now || Date.now()); }catch(e){} }
    if(typeof Talk === 'undefined') return false;
    return Talk.showFace(ln.face, ln.emo, true);
  },
  clearFace(){
    if(typeof HerBody !== 'undefined' && HerBody.temp){ try{ HerBody.temp(''); }catch(e){} }
  },
  /* 这一章讲到第几段了（正在读的那一章看游标，别的章看它的书签） */
  lineNo(id){
    const c = this.cur();
    if(c.ch === id) return Math.max(0, c.i|0);
    return Math.max(0, (c.marks && c.marks[id])|0);
  },
  /* 翻开某一章（这一章以前读过就接着上次那一段，没读过就从第一段讲起）*/
  open(id){
    const ch = this.byId(id);
    if(!ch) return false;
    const c = this.cur();
    if(c.ch !== id){
      c.i = Math.max(0, (c.marks && c.marks[id])|0);   // 有书签就翻到书签那儿
      c.ch = id;
    }
    S.settings.herStory = c;
    saveSettings();
    return true;
  },
  /* 合上（回目录页；书签留着 —— 目录页还要靠它说「读到一半」） */
  close(){
    const c = this.cur();
    c.ch = null;
    S.settings.herStory = c;
    saveSettings();
  },
  /* 往下讲一段（游标 +1 + 更新这一章的书签 + 记今天这一段）*/
  adv(now){
    const c = this.cur();
    c.i = Math.max(0, (c.i|0) + 1);
    if(c.ch) c.marks[c.ch] = c.i;
    S.settings.herStory = c;
    saveSettings();
    this.add(now, 1);
  },
  /* 读完一章：只第一次算数（记时间 + 好感「陪她走过一章剧情」），重读不再给 */
  finish(id, now){
    const ch = this.byId(id);
    if(!ch) return false;
    now = now || Date.now();
    const d = this.done();
    if(d[id]) return false;
    d[id] = now;
    saveSettings();
    if(typeof Love !== 'undefined') Love.gain('chapter', now);
    return true;
  },
  /* 读到第几章（标题上用） */
  prog(){
    const list = this.chapters(), d = this.done();
    let k = 0;
    for(const ch of list) if(d[ch.id]) k++;
    return {read:k, total:list.length};
  },

  /* ── 今天推进了几段（★ v1.9.0：只是个数着看看的数字了 ——
     原先它配着 PER_DAY 当闸用，她说「不要有说话额度」之后那道闸整条去掉）── */
  todayN(now){
    const dk = D.dateKey(now || Date.now());
    const t = S.settings.herStoryDay;
    return (t && t.dk === dk) ? (t.n || 0) : 0;
  },
  add(now, n){
    const dk = D.dateKey(now || Date.now());
    const t = S.settings.herStoryDay;
    const cur = (t && t.dk === dk) ? (t.n || 0) : 0;
    S.settings.herStoryDay = {dk, n: cur + (n || 1)};
    saveSettings();
  },
  /* 今天已经拿「接着讲」这个由头问过她了没有（一天一次，别缠人）*/
  askedToday(now){
    const dk = D.dateKey(now || Date.now());
    const a = S.settings.herStoryAsk;
    return !!(a && a.dk === dk);
  },
  markAsked(now){ S.settings.herStoryAsk = {dk: D.dateKey(now || Date.now())}; saveSettings(); },

  /* ── 条件：need 一张表，两件事都从它算 ── */
  /* 现在这组数据（= 她眼睛里的你，跟主线台词用的是同一份 talkCtx） */
  ctx(now){ return (typeof talkCtx !== 'undefined') ? talkCtx(now) : {}; },
  /* 每个门槛读的是哪个数字——**只有这一处**（表里加一条门槛，就在这里加一行） */
  val(k, c){
    const st = (c && c.st) || {};
    switch(k){
      case 'days':     return c.days || 1;
      case 'dayCount': return st.dayCount || 0;
      case 'min':      return st.min || 0;
      case 'done':     return st.done || 0;
      case 'rec':      return st.rec || 0;
      case 'lv':       return st.lv || 1;
      case 'spaces':   return c.spaces || 0;
      case 'streak':   return st.streak || 0;
      case 'stage':    return c.stageI || 0;
    }
    return 0;
  },
  /* 一章的条件逐条算出来：{k, v, val, ok, txt(还差什么), now(现在到哪了)} */
  needOf(ch, c){
    const out = [], tbl = CONFIG.STORYLINE.NEED;
    c = c || this.ctx();
    for(const pair of ((ch && ch.need) || [])){
      const k = pair[0], v = pair[1], t = tbl[k];
      if(!t) continue;                      // 表里没写的门槛不拦路（宁可放行，也不让她卡在一章前面）
      const val = this.val(k, c);
      let txt = '', now = '';
      try{ txt = t.need(v); }catch(e){}
      try{ now = t.cur(c, v); }catch(e){}
      out.push({k, v, val, ok: val >= v, txt, now});
    }
    return out;
  },
  miss(ch, c){ return this.needOf(ch, c).filter(x=>!x.ok); },
  /* 这一章能不能读了：前面每一章都读完 + 它自己的条件满足了 */
  unlocked(ch, c){
    if(!ch) return false;
    const list = this.chapters();
    const i = list.indexOf(ch);
    if(i <= 0) return true;                 // 序章永远能读
    for(let k=0; k<i; k++) if(!this.read(list[k].id)) return false;   // 主线是一条线：前面没读完就没有后面
    return this.miss(ch, c || this.ctx()).length === 0;
  },
  /* 现在有哪一章「可以读了、还没读过」——
     首页 📖 的红点、她主动来问、目录页顶上那张「接着讲」卡都吃它（同一处判断）*/
  ready(now){
    const c = this.ctx(now);
    for(const ch of this.chapters()){
      if(this.read(ch.id)) continue;
      return this.unlocked(ch, c) ? ch : null;   // 主线是一条线：第一道卡住的就是它后面的全部
    }
    return null;
  },

  /* ── 选择题：你选的是哪一个（重读时还留着，像存档一样）── */
  picks(){ let v = S.settings.herStoryPick; if(!v || typeof v!=='object'){ v = {}; S.settings.herStoryPick = v; } return v; },
  pick(chId, n, k){ const p = this.picks(); p[chId + ':' + n] = k; saveSettings(); },

  /* ── 台词板的内容（★ v1.8.1：从原来那一页阅读页搬过来的，**只有这一份实现**）──
     一条一条往下排（往上能翻回去看，新的永远在最下面），底下是动作条：
     选项 / 继续 ▸ / 这一章讲完了 */
  bodyHtml(){
    const now = Date.now();
    const ch = this.scene();
    if(!ch) return '';
    const c = this.ctx(now);
    const L = ch.lines || [];
    const i = Math.min(this.lineNo(ch.id), L.length);
    const picks = this.picks();
    let h = '<div class="story-lines" id="story-lines">';
    if(i === 0) h += '<div class="st-line sys">'+esc(ch.sub)+'</div>';
    for(let k=0;k<i;k++){
      const ln = L[k];
      if(!ln) continue;
      if(ln.sel){
        const pk = picks[ch.id + ':' + k];
        if(pk == null) continue;                       // 还没选（选项在下面的动作条上）
        const o = ln.sel[pk];
        if(!o) continue;
        const ot = Talk.one(o.t, c);
        if(ot) h += '<div class="st-line me"><i class="st-who">我</i>'+escLn(ot)+'</div>';
        const bt = Talk.one(o.back, c);
        if(bt) h += '<div class="st-line her">'+escLn(bt)+'</div>';
      }else{
        const t = Talk.one(ln.t, c);
        if(t) h += '<div class="st-line her">'+escLn(t)+'</div>';
      }
    }
    h += '</div>';
    const last = (i > 0) ? L[i-1] : null;
    const pending = !!(last && last.sel && picks[ch.id + ':' + (i-1)] == null);
    h += '<div class="story-act">';
    if(pending){
      for(let k=0;k<(last.sel||[]).length;k++){
        h += '<button class="story-opt" data-action="story-pick" data-i="'+k+'">'+esc(Talk.one(last.sel[k].t, c))+'</button>';
      }
    }else if(i < L.length){
      /* ★ v1.9.0：这儿原来分两档（到点就说「今天的 300 段讲完了，明天接着讲」）——
         每日额度去掉之后只剩这一颗 */
      h += '<button class="story-next" data-action="story-next">继续 ▸</button>';
    }else{
      const nx = this.ready(now);
      h += '<div class="st-tip">这一章讲完了。</div><div class="story-end">'+
        (nx ? '<button class="story-next" data-action="story-open" data-id="'+esc(nx.id)+'">接着读：'+this.noText(nx)+' ▸</button>' : '')+
        '<button class="story-next ghost" data-action="story-panel-close">合上</button>'+
      '</div>';
    }
    h += '</div>';
    return h;
  },
  /* ── 整块台词板（纯净主页底下浮出来的那一块）── */
  panelHtml(instant){
    const ch = this.scene();
    if(!ch) return '';
    return '<div class="home-story'+(instant ? ' instant' : '')+'" id="story-panel" role="region" aria-label="剧情">'+
      '<div class="hs-head">'+
        '<button class="hs-toc" data-action="story-toc">‹ 目录</button>'+
        '<span class="hs-title"><i class="hs-no">'+esc(this.noText(ch))+'</i>'+esc(ch.name)+'</span>'+
        '<button class="hs-close" data-action="story-panel-close" aria-label="合上">合上</button>'+
      '</div>'+
      this.bodyHtml()+
    '</div>';
  },

  /* ★ v1.14.0：点「继续 ▸」/ 选项之后**只换台词板**，不整屏重画——
     以前每次点一下都整屏 innerHTML 重建，板子的入场动画（hsIn/lvPop）跟着重播一遍，
     就是她报的「过剧情点继续和屏幕，界面会一闪一闪的」。
     instant 类 = 这次是「接着读」不是「刚翻开」→ 入场动画一律不播（见 CSS） */
  refreshPanel(){
    try{
      const el = document.getElementById('story-panel');
      if(!el){ if(typeof scheduleRender === 'function') scheduleRender(); return; }
      el.outerHTML = this.panelHtml(true);
      this.afterRender();
    }catch(e){ if(typeof scheduleRender === 'function') scheduleRender(); }
  },
  /* ── 重画之后：把台词面板滚到最新那一段（像翻到书的下一页）── */
  afterRender(){
    try{
      const el = document.getElementById('story-lines');
      if(el && el.scrollHeight != null) el.scrollTop = el.scrollHeight;
      /* ⚠️ 重画是**整块 innerHTML 重建**：imgHtml 不认识「借来的那张脸」那一层
         （只有 paintHer 认识），不补这一下，翻一页就会把她刚换上的对话表情差分抹掉。
         翻页时补一次 paintHer —— 还是那一个实现，不是第二套 */
      if(this.on() && typeof paintHer === 'function' && HerBody.tempSrc && HerBody.tempSrc()) paintHer();
    }catch(e){}
  }
};

/* ══════════════════════════════════════════════════════════════
   9.66 她的日记 HerDiary（v1.4）
   ★ 今天的日记 = 实时生成（永远是最新的）；过去的日子 = 定稿一次后冻结
     （定稿写在 dayDoc(dk).herDiary 里 → 随 days 打包导出，零导出改动）
   ★ 她「惦记着的事」= 从待办与空间实时推导（不落库），问过之后记在
     settings.herAsked 里，同一件事不追问第二遍
   ══════════════════════════════════════════════════════════════ */
const HerDiary = {
  /* 只读已存在的天文档：不存在就返回 null（不创建空文档污染 days） */
  _docIfExists(dk){
    if(S.days.has(dk)) return S.days.get(dk);
    const raw = Store.get('day:'+dk, null);
    if(!raw) return null;
    S.days.set(dk, raw);
    return raw;
  },
  today(){ return D.dateKey(Date.now()); },
  /* 已定稿的日记（过去的日子）；今天的返回 null */
  get(dk){
    if(!dk || dk >= this.today()) return null;
    const doc = this._docIfExists(dk);
    return (doc && doc.herDiary) || null;
  },
  /* 由当天数据写一篇（纯函数式推导，不改任何数据） */
  build(dk, now){
    now = now || Date.now();
    const today = this.today();
    const e = Grow.dayXpDetail(dk);
    const d0 = D.dkToTs(dk), d1 = d0 + 86400000;
    /* 这一天里最专注的空间 */
    const per = {};
    for(const s of S.sessions){
      if(!s.spaceId || !s.start) continue;
      const a = Math.max(s.start, d0), b = Math.min(s.end != null ? s.end : now, d1);
      if(b > a) per[s.spaceId] = (per[s.spaceId] || 0) + (b - a) / 60000;
    }
    let topId = null, topMin = 0;
    for(const id in per){ if(per[id] > topMin){ topMin = per[id]; topId = id; } }
    const doc = this._docIfExists(dk);
    const mood = (doc && doc.dayMood) || null;
    const min = Math.floor(e.min);
    /* 明天最早的一件待办（她替你记着） */
    const refNow = (dk === today) ? now : (d0 + 23*3600000);
    let nextT = null, nextAt = 0;
    for(const t of S.todos){
      if(t.archived || TodoLogic.effStatus(t, refNow) === 'done') continue;
      const due = TodoLogic.nextDueAt(t, refNow);
      if(due == null || due <= refNow) continue;
      if(!nextT || due < nextAt){ nextT = t; nextAt = due; }
    }
    const lines = [];
    if(min > 0 || e.done > 0 || e.rec > 0){
      let s1 = '';
      if(min > 0) s1 += '专注了 ' + fmtMin(min);
      if(e.done > 0) s1 += (s1 ? '、' : '') + '完成了 ' + e.done + ' 件事';
      if(e.rec > 0) s1 += (s1 ? '、' : '') + '写下 ' + e.rec + ' 条记录';
      lines.push('今天你' + s1 + '。');
      if(e.streak >= 2) lines.push('这是连续的第 ' + e.streak + ' 天，我都数着的。');
    }else{
      lines.push('今天你休息了。什么都没做也没关系，休息也是正经事。');
    }
    if(topId){
      const sp = spaceById(topId);
      if(sp) lines.push('最认真的时候是在「' + sp.name + '」——' + fmtMin(Math.floor(topMin)) + '，我在旁边看着呢。');
    }
    if(mood && mood.emoji) lines.push('你说今天的心情是 ' + mood.emoji + (mood.tags && mood.tags.length ? '（' + mood.tags.join('·') + '）' : '') + '，我记下了。');
    /* v1.5 感情线：那天你们的关系升了一段 / 那天你回答了她的问题（都随 days 打包，零迁移） */
    if(doc && doc.loveUp){
      const st = CONFIG.LOVE.STAGES.filter(x => x.k === doc.loveUp)[0];
      if(st) lines.push('今天我们之间又近了一点——从这天起，我们算「' + st.name + '」了。我偷偷高兴了一整天。');
    }
    const ans = S.settings.herAnswers || {};
    for(const qid in ans){
      if(ans[qid].dk !== dk) continue;
      lines.push('今天你告诉我「' + ans[qid].a + '」——是我问的，我会一直记着。');
    }
    if(nextT) lines.push('明天 ' + D.tsToHHMM(nextAt) + ' 有「' + nextT.title + '」，我替你记着。');
    if(dk === today) lines.push('这一天还没过完呢，我等你。');
    return {
      dk, at:now,
      mood: mood ? {emoji:mood.emoji || '', tags:(mood.tags || [])} : null,
      facts:{min, done:e.done, rec:e.rec, topId, topMin:Math.floor(topMin), streak:e.streak},
      lines, text:lines.join('')
    };
  },
  /* 定稿：把一个已经过去的日子的日记冻结下来（幂等；没有天文档就不落库） */
  finalize(dk, now){
    now = now || Date.now();
    if(!dk || dk >= this.today()) return null;      // 今天/未来的日子不定稿
    const doc = this._docIfExists(dk);
    if(doc && doc.herDiary) return doc.herDiary;    // 写过就不改
    const d = this.build(dk, now);
    if(doc){ doc.herDiary = d; saveDay(dk); }
    return d;
  },
  /* 页面上取某一天的日记：今天实时算，过去的日子定稿后再给 */
  of(dk, now){
    if(dk === this.today()) return this.build(dk, now);
    return this.get(dk) || this.finalize(dk, now) || this.build(dk, now);
  },

  /* ── 她惦记着的事（实时推导，可问 / 已问）── */
  _lastTouch(spId){
    let last = 0;
    for(const s of S.sessions){
      if(s.spaceId !== spId || !s.start) continue;
      const e = (s.end != null) ? s.end : Date.now();
      if(e > last) last = e;
    }
    const sp = spaceById(spId);
    if(sp && sp.updatedAt && sp.updatedAt > last) last = sp.updatedAt;
    if(!last && sp && sp.createdAt) last = sp.createdAt;
    return last || null;
  },
  watch(now){
    now = now || Date.now();
    const H = CONFIG.HER, asked = S.settings.herAsked || {}, out = [];
    const todayTs = D.dkToTs(D.dateKey(now));
    /* ① 早就过点还没做的待办 */
    for(const t of S.todos){
      if(t.archived || TodoLogic.effStatus(t, now) === 'done') continue;
      const due = TodoLogic.dueAt(t, now);
      if(due == null) continue;
      const days = Math.round((todayTs - D.dkToTs(D.dateKey(due))) / 86400000);
      if(days < H.ASK_OVERDUE_DAYS) continue;
      out.push({id:'todo:'+t.id, kind:'todo', text:t.title, days, at:due, askedDk:asked['todo:'+t.id] || null});
    }
    /* ② 好久没碰的空间 */
    for(const sp of S.spaces){
      if(sp.archived) continue;
      const last = this._lastTouch(sp.id);
      if(!last) continue;
      const days = Math.round((todayTs - D.dkToTs(D.dateKey(last))) / 86400000);
      if(days < H.ASK_STALE_SPACE_DAYS) continue;
      out.push({id:'space:'+sp.id, kind:'space', text:sp.name, days, at:last, askedDk:asked['space:'+sp.id] || null});
    }
    out.sort((a, b) => b.days - a.days);      // 拖得最久的排前面
    return out;
  },
  /* 她今天想问的一件事（没问过的，最多 ASK_PER_DAY 件；每天只挑一件） */
  nextAsk(now){
    now = now || Date.now();
    const dk = D.dateKey(now);
    let n = 0;
    for(const id in (S.settings.herAsked || {})){ if(S.settings.herAsked[id] === dk) n++; }
    if(n >= CONFIG.HER.ASK_PER_DAY) return null;
    const list = this.watch(now).filter(a => !a.askedDk);
    return list.length ? list[0] : null;
  },
  markAsked(id, now){
    if(!id) return false;
    if(!S.settings.herAsked) S.settings.herAsked = {};
    S.settings.herAsked[id] = D.dateKey(now || Date.now());
    saveSettings();
    return true;
  }
};

/* ══════════════════════════════════════════════════════════════
   9.67 感情线 Love（v1.5）：好感度 / 关系阶段 / 她的问题 / 对她说
   ★ 好感 ≠ 等级：等级是她跟着你长大的进度（你做了多少事），
     好感是你们的关系（你陪了她多少）——来源全是「你和她相处」，
     跟你专注多久、完成几件事毫无关系，绝不做成绩效。
   ★ 零迁移：新数据全挂 settings（herLove / herAnswers / herChatLog /
     herLangNotes / herAskAt / herRecall / herUrged / herNotify），
     exportJSON / importJSON 一行都不用改。
     唯一落在 dayDoc 上的是 loveUp（那天你们的关系升了一段），随 days 打包。
   ★ 称呼：她对你的称呼由关系阶段决定（Love.you()），台词里写 {yt} 就会自动变。
   ══════════════════════════════════════════════════════════════ */
const Love = {
  _pendingStage:null,   // 升段了但还没演（演出留到 tick——别在渲染/点击过程中弹东西）
  _lastAct:0,           // 你最后一次碰屏幕的时刻（她挑你安静下来的时候才开口）
  _asking:null,         // 正在问她的哪个问题

  /* ── 数据层（全挂 settings，零迁移）── */
  state(){
    let v = S.settings.herLove;
    if(!v || typeof v !== 'object') v = {total:0};
    if(typeof v.total !== 'number' || v.total < 0) v.total = 0;
    if(!v.src || typeof v.src !== 'object') v.src = {};
    S.settings.herLove = v;
    return v;
  },
  total(){ return this.state().total; },
  /* 此刻属于哪一段：门槛从低到高，取最后一个够得着的 */
  stageAt(total){
    const st = CONFIG.LOVE.STAGES;
    let cur = st[0];
    for(const s of st){ if(total >= s.min) cur = s; }
    return cur;
  },
  stage(){ return this.stageAt(this.total()); },
  nextStage(){
    const st = CONFIG.LOVE.STAGES, i = st.indexOf(this.stage());
    return (i >= 0 && i < st.length - 1) ? st[i+1] : null;
  },
  stageIndexOf(k){ const st = CONFIG.LOVE.STAGES; for(let i=0;i<st.length;i++) if(st[i].k===k) return i; return 0; },
  /* 她对你的称呼——台词里的 {you} / {yt} 就是它，随阶段自动升级 */
  you(){ return this.stage().you; },
  /* 你们认识多少天了（从 meta.createdAt 算；认识的那天就是第 1 天） */
  daysTogether(now){
    now = now || Date.now();
    const a = D.dateKey((S.meta && S.meta.createdAt) ? S.meta.createdAt : now);
    const b = D.dateKey(now);
    return Math.max(1, Math.round((D.dkToTs(b) - D.dkToTs(a)) / 86400000) + 1);
  },
  today(now){
    const s = this.state(), dk = D.dateKey(now || Date.now());
    return (s.day && s.day.dk === dk) ? s.day.n : 0;
  },
  srcToday(src, now){
    const r = this.state().src[src], dk = D.dateKey(now || Date.now());
    return (r && r.dk === dk) ? r.n : 0;
  },

  /* ★ 好感唯一的入口：冷却 → 来源每日上限 → 每日总上限，三道闸都在这里。
     涨不动的时候直接返回 0 并且不写库——所以从视图渲染里调它是安全的、幂等的 */
  gain(src, now){
    now = now || Date.now();
    const cfg = CONFIG.LOVE.SOURCES[src];
    if(!cfg) return 0;
    const s = this.state(), dk = D.dateKey(now);
    if(cfg.cd && s.last && s.last[src] && now - s.last[src] < cfg.cd) return 0;   // ① 同一来源的冷却
    const r = (s.src[src] && s.src[src].dk === dk) ? s.src[src] : {dk, n:0};
    if(r.n >= cfg.cap) return 0;                                                  // ② 这个来源今天算够了
    if(!s.day || s.day.dk !== dk) s.day = {dk, n:0};
    if(s.day.n + cfg.v > CONFIG.LOVE.DAILY_CAP) return 0;                         // ③ 每天的总闸（记的是「点」不是「次」）
    const was = this.stage().k;
    s.total += cfg.v; r.n++; s.day.n += cfg.v;
    s.src[src] = r;
    if(!s.last) s.last = {};
    s.last[src] = now;
    if(this.stage().k !== was){
      this._pendingStage = this.stage().k;
      const doc = dayDoc(dk);            // 她的日记里记一笔（数据先落，演出留给 tick）
      doc.loveUp = this.stage().k;
      saveDay(dk);
    }
    saveSettings();
    return cfg.v;
  },
  /* ── 感情会凉：连着几天没打开之后每天 -1，但下限不跌破当前阶段的门口
        （会凉，是为了让「回来」有意义；不归零，是因为陪伴不该被羞辱） ── */
  settle(now){
    now = now || Date.now();
    const s = this.state();
    const last = S.settings.herLastOpen;
    if(!last || !last.dk) return 0;
    const gap = Math.round((D.dkToTs(D.dateKey(now)) - D.dkToTs(last.dk)) / 86400000);
    if(gap <= CONFIG.LOVE.DECAY_AFTER_DAYS) return 0;
    const lost = (gap - CONFIG.LOVE.DECAY_AFTER_DAYS) * CONFIG.LOVE.DECAY_PER_DAY;
    const nv = Math.max(this.stage().min, s.total - lost);   // 门槛要在扣之前算
    const cut = s.total - nv;
    if(cut > 0){ s.total = nv; saveSettings(); }
    return cut;
  },
  /* 打开软件时（在 Her.onBoot 之前调：settle 要读到上一次的 herLastOpen） */
  onBoot(now){
    now = now || Date.now();
    const cut = this.settle(now);
    this._lastAct = now;      // 刚打开：从这里重新数「你安静了多久」
    return cut;
  },

  /* ── 你的活动：bootMain 里挂在 pointerdown 上 ── */
  touch(){ this._lastAct = Date.now(); },
  idleMs(now){ return (now || Date.now()) - (this._lastAct || 0); },
  _modalOpen(){
    if(typeof document === 'undefined' || !document.getElementById) return false;
    const mr = document.getElementById('modal-root');
    return !!(mr && mr.innerHTML);
  },

  /* ── 她的问题（galgame 式选择题）── */
  unlocked(){ return CONFIG.LOVE.QUESTIONS.filter(q => this.total() >= (CONFIG.LOVE.CAT_MIN[q.cat] || 0)); },
  nextQuestion(){
    const a = S.settings.herAnswers || {};
    const list = this.unlocked().filter(q => !a[q.id]);
    return list.length ? list[0] : null;
  },
  canAsk(now){
    now = now || Date.now();
    const dk = D.dateKey(now), last = S.settings.herAskAt;
    if(last && last.dk === dk) return false;                       // 每天最多一个
    if(last && Math.round((D.dkToTs(dk) - D.dkToTs(last.dk)) / 86400000) < CONFIG.LOVE.ASK_GAP_DAYS) return false;
    if(this.idleMs(now) < CONFIG.LOVE.ASK_IDLE_MS) return false;   // 你正忙着，她不打断
    return !this._modalOpen();
  },
  openAsk(q, now){
    now = now || Date.now();
    if(!q) return false;
    S.settings.herAskAt = {dk:D.dateKey(now), at:now};
    saveSettings();
    this._asking = q.id;
    /* ★ v1.7.10（她要求的）：不弹白底弹窗了——就着她说话的那个气泡说，
       选项摆在气泡**右上角**（Bubbles 的 opts，见那段注释）。
       点选项照旧走 data-action="love-answer"（下面 Actions 里那个），逻辑一行没动 */
    const opts = q.opts.map((t, i)=>({t, action:'love-answer', id:q.id, i}));
    Bubbles.push(Her.fill(q.q, Her.ctx(now)), {key:'her-ask-'+q.id, sub:'她在问你', opts, hold:60000});
    return true;
  },
  answer(qid, i, now){
    now = now || Date.now();
    const q = CONFIG.LOVE.QUESTIONS.filter(x => x.id === qid)[0];
    if(!q) return false;
    const a = q.opts[i];
    if(a == null) return false;
    if(!S.settings.herAnswers) S.settings.herAnswers = {};
    S.settings.herAnswers[qid] = {a, dk:D.dateKey(now), at:now};
    this._asking = null;
    saveSettings();
    this.gain('answer', now);            // 好感来源表：回答她的问题 +5
    UI.closeModal();
    Her.reply(Her.voice('loveBack', Object.assign(Her.ctx(now), {answer:a, override:q.back || null})),
      {key:'her-loveback-'+qid, sub:'她记住啦', go:()=>goView('mcons')});
    scheduleRender();
    return true;
  },
  answerOf(qid){ const a = S.settings.herAnswers || {}; return a[qid] ? a[qid].a : null; },
  /* 隔了几天，她拿你以前的回答来接一次话（每天最多一次） */
  dueRecall(now){
    now = now || Date.now();
    const ans = S.settings.herAnswers || {}, used = S.settings.herRecall || {}, dk = D.dateKey(now);
    for(const id in used){ if(used[id] === dk) return null; }
    for(const q of CONFIG.LOVE.QUESTIONS){
      const a = ans[q.id];
      if(!a || used[q.id]) continue;
      const days = Math.round((D.dkToTs(dk) - D.dkToTs(a.dk)) / 86400000);
      if(days < CONFIG.LOVE.RECALL_GAP_DAYS) continue;
      return {q, a:a.a, days};
    }
    return null;
  },
  markRecall(qid, now){
    if(!S.settings.herRecall) S.settings.herRecall = {};
    S.settings.herRecall[qid] = D.dateKey(now || Date.now());
    saveSettings();
  },

  /* ── 「对她说」：她的小本子（聊天记录 + 她听不懂的句子，将来接 AI 的语料）── */
  log(){ return S.settings.herChatLog || []; },
  push(who, text, now){
    if(!S.settings.herChatLog) S.settings.herChatLog = [];
    const log = S.settings.herChatLog;
    log.push({w: who === 'me' ? 'me' : 'her', t:String(text == null ? '' : text), at: now || Date.now()});
    while(log.length > CONFIG.LOVE.CHAT_KEEP) log.shift();
    saveSettings();
    return log;
  },
  notes(){ return S.settings.herLangNotes || []; },
  note(text, now){
    const t = String(text == null ? '' : text).slice(0, 120);
    if(!t) return false;
    if(!S.settings.herLangNotes) S.settings.herLangNotes = [];
    const n = S.settings.herLangNotes;
    if(n.some(x => x.t === t)) return false;     // 同一句只记一次
    n.push({t, at: now || Date.now()});
    while(n.length > 100) n.shift();
    saveSettings();
    return true;
  },
  /* 进聊天页时她先打个招呼（隔久了才重新打，免得每次都重复一句） */
  enter(now){
    now = now || Date.now();
    const log = this.log();
    const last = log.length ? (log[log.length-1].at || 0) : 0;
    if(now - last < CONFIG.LOVE.CHAT_HI_GAP_MS) return false;
    const text = Her.voice(log.length ? 'chatGreet' : 'chatHi', Her.ctx(now));
    if(!text) return false;
    this.push('her', text, now);
    return true;
  },
  /* 你说一句 → 她回一句。纯本地规则（关键词命中），全都不中就老实说没听懂 */
  chat(text, now){
    now = now || Date.now();
    const raw = String(text == null ? '' : text).trim();
    if(!raw) return '';
    const low = raw.toLowerCase();
    /* v1.20.0：关键词表本身是中文源；界面切成日/英之后，**用那种语言打字也认**
       （把中文关键词现翻一份再比一次——纯读、不动原表，中文输入照旧） */
    const hit = CONFIG.LOVE.CHAT.filter(r => r.k.some(k => {
      const kk = String(k).toLowerCase();
      if(low.indexOf(kk) >= 0) return true;
      const tr = LT(k);
      return tr !== k && low.indexOf(String(tr).toLowerCase()) >= 0;
    }))[0];
    const reply = Her.voice(hit ? hit.kind : 'chatFallback', Object.assign(Her.ctx(now), {say:raw}));
    if(!hit) this.note(raw, now);        // 没听懂 → 收进小本子
    this.push('me', raw, now);
    if(reply) this.push('her', reply, now);
    return reply;
  },

  /* ── 她来请求「走出软件」的权限（系统通知）——排在正事之后，且隔了一天以上才问 ── */
  canAskNotify(now){
    now = now || Date.now();
    if(typeof Notify === 'undefined' || !Notify.supported()) return false;
    const s = S.settings.herNotify || {};
    if(s.asked) return false;
    if(this.daysTogether(now) < 2) return false;                    // 刚认识就问这个太急了
    if(this.idleMs(now) < CONFIG.LOVE.ASK_IDLE_MS) return false;
    return !this._modalOpen();
  },
  askNotify(now){
    now = now || Date.now();
    S.settings.herNotify = Object.assign({}, S.settings.herNotify, {asked:true});
    saveSettings();
    /* ★ v1.7.10：同样不弹窗——就在气泡里问，选项在右上角 */
    Bubbles.push(Her.voice('noticeAsk', Her.ctx(now)),
      {key:'her-notice-ask', sub:'她想走出软件',
       opts:[{t:'好呀，你来提醒我', action:'love-notify-ok'},
             {t:'先不用', action:'love-notify-no'}],
       hold:60000});
    return true;
  },

  /* ── 每秒一次（跟着主循环）：演升级 / 问你问题 / 拿旧回答接话 / 请求通知权限 ── */
  tick(now){
    now = now || Date.now();
    if(S.view !== 'home' && S.view !== 'mspace') return;   // 和 Her 一样：她只在这两个纯净页里活动
    /* ① 关系升级（账在 gain 里已经记好，这里只演） */
    if(this._pendingStage){
      const k = this._pendingStage; this._pendingStage = null;
      const st = this.stage();
      UI.toast('和 ' + CONFIG.LOVE.NAME + ' 的关系升级了 →「' + st.name + '」');
      /* v1.7.12：关系近了一步 → 鼓掌（话由下面那句 loveUp 台词来说，不重复） */
      if(typeof Her !== 'undefined') Her.onEvent('loveUp', {id:k});
      Her.reply(Her.voice('loveUp', Her.ctx(now)),
        {key:'her-loveup-'+k, sub:'我们之间', go:()=>goView('mcons')});
      return;
    }
    /* ② 她想问你一件事：你安静下来之后，她才好意思开口 */
    if(this.canAsk(now) && Her.canSpeak(now)){
      const q = this.nextQuestion();
      if(q){ this.openAsk(q, now); return; }
    }
    /* ③ 隔几天，她拿你以前的回答来接一次话 */
    const r = this.dueRecall(now);
    if(r && Her.canSpeak(now)){
      this.markRecall(r.q.id, now);
      Her.say('recallAnswer',
        Object.assign(Her.ctx(now), {a:r.a, q:r.q, override: r.q.recall ? r.q.recall(r.a) : null}),
        {key:'her-recall-'+r.q.id+'-'+D.dateKey(now), sub:'她记得', go:()=>goView('mtalk')});
      return;
    }
    /* ④ 她想请你允许她「走出软件」 */
    if(this.canAskNotify(now)) this.askNotify(now);
  }
};

/* ══════════════════════════════════════════════════════════════
   9.55 看板娘互动 Mascot（单击立绘：反应动画+台词气泡+爱心粒子+养成入口按钮）
   ══════════════════════════════════════════════════════════════ */
const Mascot = {
  /* 台词池：按等级解锁（v1.2）——base 人人有，L5/L10/L20 各解锁一批 */
  lines:{
    base:['今天也要一起加油哦~','摸摸头！','有什么事都可以交给我！','记得喝水哦，指挥官','要开始新的可能性了吗？','休息一下也没关系~','你的努力我都看在眼里！','今天想做什么呢？'],
    L5:['诶？我好像长大了一点点！','跟着你一起努力，我也在进步呢～','学徒出师第一步，谢谢你！','今天的你，比昨天更可靠了'],
    L10:['时间被我炼成小星星啦，都给你！','滴答滴答……我能听见时间的声音了','炼金术士的秘诀？就是每天一点点','这一炉时间里，有你一半的功劳'],
    L20:['我在把我们的每一天，织成一条长长的围巾','编织者模式启动！时间在我手里很听话','你看，坚持的日子连起来会发光']
  },
  linesFor(level){
    let out = this.lines.base.slice();
    if(level >= 5) out = out.concat(this.lines.L5);
    if(level >= 10) out = out.concat(this.lines.L10);
    if(level >= 20) out = out.concat(this.lines.L20);
    return out;
  },
  randomLine(level){ const l = this.linesFor(level || 1); return l[Math.floor(Math.random()*l.length)]; },
  /* 台词总句数（我们的羁绊页的解锁进度分母，别再手写数字） */
  lineTotal(){ return this.lines.base.length + this.lines.L5.length + this.lines.L10.length + this.lines.L20.length; },
  /* 从 from 升到 to 这中间新解锁的台词（按档位由低到高） */
  unlockLinesBetween(from, to){
    let out = [];
    for(const [lv, key] of [[5,'L5'],[10,'L10'],[20,'L20']]){
      if(lv > from && lv <= to) out = out.concat(this.lines[key]);
    }
    return out;
  },
  tap(){
    if(S.view!=='home' && S.view!=='mspace') return;   // 她的空间里点她也能互动（并浮出回程星标）
    const el = document.getElementById('mascot');
    if(!el) return;
    const now = Date.now();
    /* v1.6a 连戳：1.5 秒里戳满 5 下，她真的要生气了（心情浮标 + 吓一跳 + 震动） */
    if(!this._tapAt || now - this._tapAt > CONFIG.SENSE.TAP_WIN){ this._tapAt = now; this._tapN = 0; }
    this._tapAt = now; this._tapN = (this._tapN || 0) + 1;
    const angry = this._tapN >= CONFIG.SENSE.TAP_N;
    if(angry) this._tapN = 0;
    /* 反应动画：随机跳一跳 / 软软一挤；戳急了是「吓了一跳」（播完移除，呼吸浮动恢复） */
    const cls = angry ? 'act-startle' : (Math.random()<0.5?'mascot-hop':'mascot-squish');
    el.classList.remove('mascot-hop','mascot-squish','act-startle');
    void el.offsetWidth;
    el.classList.add(cls);
    setTimeout(()=>el.classList.remove(cls), 700);
    if(angry){
      /* 生气：不撒爱心，只说一句（走本地气泡，不受每日说话次数限制——这是她在回应你） */
      Emo.set('angry', '连戳', now);
      buzz(110); if(typeof Snd !== 'undefined') Snd.play('tapAngry');
      this.react('tapAngry', 3200);
    }else{
      /* 台词气泡（按当前等级取台词池） */
      this.say(this.randomLine(Grow.level()), 2600);
      if(typeof Snd !== 'undefined') Snd.play('tap');
      /* 爱心粒子 */
      this.hearts();
      /* v1.7 点击必有变化：每戳必换脸——按连戳计数递进（1=开心 2=害羞 3=开心 4=担心，5=生气） */
      const i = Math.min(this._tapN - 1, CONFIG.SENSE.TAP_FACES.length - 1);
      Emo.set(CONFIG.SENSE.TAP_FACES[i], '你戳了戳她', now);
    }
    /* 「戳她一下」好感 +1（30 秒冷却 + 每天最多 5 次——连戳不刷分，见 CONFIG.LOVE.SOURCES） */
    if(typeof Love !== 'undefined') Love.gain('tap', Date.now());
    /* ★ v1.14.0：点过她 → 那串「........」对话框允许留出来（她拍板的两个动作：
       点她出对话框 → 再点对话框弹话题） */
    if(typeof Talk !== 'undefined'){ Talk._boxShown = true; try{ Talk.box(); Bubbles.render(); }catch(e){} }
    /* 白圆黑星入口（几秒后收起）：长按进她的空间 / 长按回来。大小位置不用调钮：单指拖动、双指缩放 */
    this.showPortal();
  },
  /* 她对你做的一件事回一句（v1.6a）：走 Her.voice 出口（称呼自动替换），落在她自己的气泡里。
     这些是「她回应你」，不是她主动找你——所以不受每日说话次数限制 */
  react(kind, ms){
    if(typeof Her === 'undefined') return false;
    const t = Her.voice(kind, Her.ctx(Date.now()));
    if(!t) return false;
    this.say(t, ms || 2600);
    /* 回应也配脸+动作（v1.7）；刚发生的事在 8 秒保护窗内 → reactFace 自动跳过覆盖 */
    Her.reactFace(kind);
    return true;
  },
  /* ★ v1.7.11：她说的话**只有一个出口**——Bubbles（就是提醒气泡那一个，挂在 #bubble-root 上）。
     以前这里是另建一个 `.mascot-chat` 挂在立绘右上角：白底 92%、带一条指着她的小尾巴，
     和提醒气泡长得完全不一样，她看到的就是「点了她之后又冒出一个白气泡」。
     现在借着 Bubbles 的 say 档：不排队、不去重、直接顶掉上一条（点一下马上有回应）。
     ⚠️ 别改回自己建元素：一改成两套，位置/长相/优先级就又分家了（这是她报过的 bug）。 */
  say(text, ms){
    if(typeof Bubbles === 'undefined') return;
    Bubbles.push(text, {say:true, hold: ms || 2600});
  },
  /* 爱心粒子：动画强度三档（关闭=0 / 轻度=3 / 完整=5）。
     以前动画关闭时只是不播放动画，元素仍会留在页面上，所以这里直接不生成 */
  hearts(){
    const lv = S.settings.animLevel || 'full';
    if(lv === 'off') return 0;
    const zone = document.querySelector('#view-root .mascot-zone');
    if(!zone) return 0;
    const n = lv === 'full' ? 5 : 3;
    const em = ['💗','💙','✨','💛'];
    for(let i=0;i<n;i++){
      const s = document.createElement('span');
      s.className = 'mascot-heart';
      s.textContent = em[Math.floor(Math.random()*em.length)];
      s.style.left = (38+Math.random()*24)+'%';
      s.style.bottom = (56+Math.random()*16)+'%';
      s.style.animationDelay = (i*0.07)+'s';
      zone.appendChild(s);
      setTimeout(()=>s.remove(), 1800);
    }
    return n;
  },
  /* 白圆黑星入口：用户空间里点她 → 长按进她的空间；她的空间里点她 → 长按回来 */
  showPortal(){
    const zone = document.querySelector('#view-root .mascot-zone');
    if(!zone) return;
    const toMspace = (S.view !== 'mspace');
    let b = zone.querySelector('.portal-btn');
    if(!b){
      b = document.createElement('button');
      b.className = 'portal-btn';
      /* 她画的那张水晶球当按钮（v1.7.5）：图裂了/不在 → 自己摘掉，白圆黑星照旧顶上 */
      const art = document.createElement('img');
      art.className = 'pb-art'; art.alt = ''; art.draggable = false;
      /* 数据到了就换（has-art）。理论上这中间可能有一两帧「白圆黑星已收起、画还没解码」，
         但那张图开机就在后台温着（图早进了内存），实际看不到；
         试过一版改成等 decode() 再换——那个 Promise 在无头环境里不落地，会变成「永远不换」，
         得不偿失（理由同 HerBody.warm 上那条注释） */
      art.addEventListener('load', ()=>{ try{ b.classList.add('has-art'); }catch(e){} });
      /* v1.7.6：PNG 不在就试同名 .webp（data-alt 里存着还能试谁），都试完才摘掉 → 白圆黑星顶上 */
      art.addEventListener('error', ()=>{
        let L = [];
        try{ L = JSON.parse(art.dataset.alt || '[]'); }catch(e){}
        if(L.length){ art.src = L.shift(); art.dataset.alt = JSON.stringify(L); return; }
        try{ art.remove(); }catch(e){}
      });
      const pbCand = artCands(PORTAL_UI_ART);
      art.src = pbCand.shift();
      art.dataset.alt = JSON.stringify(pbCand);
      b.appendChild(art);
      const star = document.createElement('span');
      star.className = 'pb-star'; star.textContent = '★';
      b.appendChild(star);
      this._wirePortalHold(b);
      zone.appendChild(b);
    }
    b.setAttribute('aria-label', toMspace ? '长按进入她的空间' : '长按回到我的空间');
    clearTimeout(this._portalT);
    b.classList.add('show');
    this._portalT = setTimeout(()=>{ b.classList.remove('show'); }, 6000);
  },
  /* 星标上的长按（独立于全局手势引擎：按在按钮上时手势引擎本来就被 _busy 挡住） */
  _wirePortalHold(b){
    let t = null;
    const cancel = ()=>{ if(t){ clearTimeout(t); t = null; } b.classList.remove('holding'); };
    const fire = ()=>{
      t = null; b.classList.remove('holding');
      if(typeof Gestures !== 'undefined') Gestures._reset();   // 清掉可能已经起步的手势状态
      Portal.go(S.view === 'mspace' ? 'home' : 'mspace', b);
    };
    b.addEventListener('pointerdown', e=>{
      if(e.button && e.button !== 0) return;
      b.classList.add('holding');
      clearTimeout(t);
      t = setTimeout(fire, Portal.HOLD_MS);
    });
    b.addEventListener('pointerup', cancel);
    b.addEventListener('pointercancel', cancel);
    b.addEventListener('pointerleave', cancel);
    b.addEventListener('contextmenu', e=>e.preventDefault());   // 手机长按不出系统菜单
    /* 只点一下（没按够）：教一下怎么进，不直接跳转 */
    b.addEventListener('click', ()=>{
      if(Portal._active) return;
      UI.toast(S.view==='mspace' ? '长按星标 0.5 秒回到我的空间' : '长按星标 0.5 秒进入她的空间');
    });
  },
  /* —— 单指拖动位置（按住立绘滑动即触发，与单击/双击/长按靠位移阈值区分） —— */
  dragStart(x, y){
    const p = S.settings.mascotPos || {dx:0, dy:0};
    this._drag = { x0:x, y0:y, dx0:p.dx, dy0:p.dy };
  },
  dragMove(x, y){
    if(!this._drag) return;
    const w = window.innerWidth || 390, h = window.innerHeight || 844;
    S.settings.mascotPos = {
      dx: clamp(this._drag.dx0 + (x - this._drag.x0)/w*100, -32, 32),
      dy: clamp(this._drag.dy0 + (y - this._drag.y0)/h*100, -32, 32)
    };
    this.applyPos();
  },
  dragEnd(moved){
    this._drag = null;
    if(moved < 10){ Mascot.tap(); return; }      // 没怎么动 = 算单击互动
    saveSettings();
    /* v1.6a 拖到角落：她问一句「要把我放这里吗？」——第一次挪这么远的时候问一次就够了 */
    const p = S.settings.mascotPos || {dx:0, dy:0};
    const far = Math.abs(p.dx) >= CONFIG.SENSE.CORNER || Math.abs(p.dy) >= CONFIG.SENSE.CORNER;
    if(far && !S.settings.herCornerAsked){
      S.settings.herCornerAsked = true;
      saveSettings();
      Emo.set('shy', '你把她挪到了角落', Date.now());
      this.react('cornerAsk', 3000);
    }
  },
  /* —— 双指捏合缩放（0.6~1.6 倍）—— */
  pinchTo(s0, ratio){
    const s = clamp(Math.round(s0*ratio*10)/10, 0.6, 1.6);
    S.settings.mascotScale = s;
    /* 记下这一轮捏合从多大开始、捏到多大：松手时才知道你是想放大还是缩小
       （只记最大值不够——她本来就在 0.6 倍时，轻轻一捏也会被当成「你想把她缩小」） */
    if(this._pinchFrom == null) this._pinchFrom = s0;
    this._pinchTo = s;
    this.applyPos();
  },
  pinchEnd(){
    saveSettings();
    /* v1.6a 捏大=害羞 / 捏小=委屈（要「朝着这个方向捏过头」才算，轻轻调大小不打扰） */
    const from = this._pinchFrom, to = this._pinchTo;
    this._pinchFrom = null; this._pinchTo = null;
    if(from == null || to == null || to === from) return;
    const now = Date.now();
    if(to >= CONFIG.SENSE.PINCH_BIG && to > from){ Emo.set('shy', '你把她放大了', now); this.react('pinchBig'); }
    else if(to <= CONFIG.SENSE.PINCH_SMALL && to < from){ Emo.set('sad', '你把她缩小了', now); this.react('pinchSmall'); }
  },
  /* 还原默认大小与位置（养成面板内） */
  resetPos(){
    S.settings.mascotScale = 1;
    S.settings.mascotPos = {dx:0, dy:0};
    saveSettings();
    this.applyPos();
    scheduleRender();
  },
  /* 调节大小（0.6~1.6，步进0.1）与位置（±32vw/vh，步进2） */
  adjust(kind, dir){
    if(kind==='reset'){
      S.settings.mascotScale = 1;
      S.settings.mascotPos = {dx:0, dy:0};
    }else if(kind==='size'){
      const s = clamp((S.settings.mascotScale||1) + (dir==='p'?0.1:-0.1), 0.6, 1.6);
      S.settings.mascotScale = Math.round(s*10)/10;
    }else{
      const p = {...(S.settings.mascotPos||{dx:0, dy:0})};
      if(dir==='left') p.dx -= 2;
      else if(dir==='right') p.dx += 2;
      else if(dir==='up') p.dy -= 2;
      else p.dy += 2;
      p.dx = clamp(p.dx, -32, 32);
      p.dy = clamp(p.dy, -32, 32);
      S.settings.mascotPos = p;
    }
    saveSettings();
    this.applyPos();
  },
  /* 把大小/位置直接应用到立绘（不整页重渲染，响应即时） */
  applyPos(){
    const el = document.querySelector('#view-root .mascot-pos');
    if(!el) return;
    const s = S.settings.mascotScale||1, p = S.settings.mascotPos||{dx:0, dy:0};
    el.style.transform = 'translate('+p.dx+'vw,'+p.dy+'vh) scale('+s+')';
  }
};

const ART_EXT  = ['.png', '.webp'];

function artTwin(u){
  const s = String(u == null ? '' : u);
  for(const e of ART_EXT) if(s.length > e.length && s.slice(-e.length).toLowerCase() === e)

  if(ART_BG.indexOf(n) >= 0) return '背景';

  if(n === '松手' || n.slice(-2) === '松手') return '卡片';
  try{                                              // 提示卡插画 = 页面名（v1.7.3）
    for(const k in PAGE_META) if(pageArtName(k) === n) return '卡片';
  }catch(e){}                                       // PAGE_META 还没求值（极早调用）→ 当认不出来

   ⚠️ 这里就是 v1.7.16 唯一的「去掉 mimi/」的地方 —— 名字传进来时带着那个记号，
      发出去的地址一律不带（见上面注释：6 个家现在住在网站根目录） */
function artPathsIn(base, ext){

     这种名字是她自己分的文件夹，不用猜「它该住哪儿」；不特殊处理的话，
     artFolder 认不出来 → 会把同一个名字往几个家里各拼一遍，
     凭空多出十几个绝不会存在的地址（每张帧白探十几次，21 张就是 200 多次无用请求） */
  if(base.indexOf('/') >= 0) return [base + ext];
  const home = artFolder(base);
  const out = [];
  if(home) out.push(home + '/' + base + ext);
  out.push(base + ext);                             // 网站根目录：她的老习惯，也是平铺那份的位置
  for(const d of ART_DIRS) if(d !== home) out.push(d + '/' + base + ext);

/* 一个名字 → 该依次试的一串地址（**先把 PNG 那 6 个试完，再轮到 .webp 那 6 个**） */
function artCands(u){
  const s = String(u == null ? '' : u);
  if(!s) return [];
  const t = artTwin(s);
  if(!t) return [s];
  if(s.slice(0, 5) !== 'mimi/') return [s, t];      // 不在 mimi/ 里的（看板娘.png 等）→ 只换个后缀
  /* 去掉 'mimi/' 和后缀。⚠️ 别写 slice(5,-4)：那对 .png 正好，对 .webp 会剩个孤零零的点
     （'mimi/待办.webp' → '待办.'），于是展开出一串带点的错地址、一个都撞不上。
     artTwin 非空已经保证末尾有个认得出的后缀，所以直接砍到最后一个点 */
  const base = s.slice(5, s.lastIndexOf('.'));
  const out = [];
  for(const e of ART_EXT) out.push.apply(out, artPathsIn(base, e));
  return out;
}

const HerBody = {

  _memoMinOk:2, _okSinceSave:0, _zeroSinceSave:[],
  _memo(){

                             const mm = this._memo(); mm[f] = ok ? 1 : 0;

                                一整批连一张都没成功，那批 0 全部作废（见 _memoFlush） */
                             if(ok) this._okSinceSave++; else this._zeroSinceSave.push(f);

      /* ⚠️ 就认 onload（= 数据到了），**别**改成等 decode()：
         试过一版「等 decode 完才算探到」（想让 probed 真的=「现在贴上去就能看见」），
         e2e 的无头环境里 decode() 的 Promise 根本不落地 → probed 永远是 false
         → 整屏过渡图和传送图一辈子用不上，直接退回纯色块/白圆黑星。
         那一版想修的是「解码没跟上会空一两帧」，代价却是「干脆永远不显示」，不值。
         解码这点事交给开机那次 warm（图早就在内存里了）。 */
      im.onload = ()=>done(true);                 // 在 → 待会儿拖动就换成它
      im.onerror = ()=>done(false);
      try{ im.src = f; }catch(e){ done(false); }
    }
  },
  probed(f){ return !!this._probe[f]; },
  /* 这一串地址里第一个**已经探到**的（v1.7.6，配合 artCands 用）——
     进页的过渡图 / 传送图 / 拉页面那几张都是「探到了才用，没探到就照旧走兜底版」，
     问的是「哪个后缀真有文件」，所以走这里而不是直接问 probed(那张 .png) */
  warmed(list){
    for(const f of (list || [])) if(f && this._probe[f]) return f;
    return null;
  },
  /* 她这会儿该用哪张图。form='normal'|'q'|'acts'（别的名字=只走回退链，给迷你看板娘用）
     返回 {src, shell, fb}：src=图片地址（null 表示只能用小可爱），shell=是否显示内置小可爱，
     fb=src 图裂了之后依次试的备用文件（系统默认层的逐级回退） */
  pick(form, key){
    const g = this.assets()[form] || {};
    const id = (key && key !== 'base') ? (g[key] || g.base) : g.base;
    if(id){ const u = Store.getImage(id); if(u) return {src:u, shell:false}; }
    const mId = S.settings.mascotId;
    if(mId === 'placeholder') return {src:null, shell:true};
    if(mId){ const u = Store.getImage(mId); return u ? {src:u, shell:false} : {src:null, shell:true}; }
    /* 系统默认的她：这张脸的文件 → 普通 → 旧版「看板娘.png」（过渡兜底） */
    const names = [];
    const f = this.builtinFile(form, key);
    const b = this.builtinFile(form, 'base');
    if(f && f !== b) names.push(f);
    if(b) names.push(b);
    names.push('看板娘.png');
    /* 每个名字展开成「先 PNG 再 .webp」（v1.7.6，见 artCands）——
       所以槽位图和普通图形裂时会先试自己那张的 .webp，再退到下一个名字 */
    const fb = [];
    for(const n of names) fb.push.apply(fb, artCands(n));
    return {src: fb.shift(), shell:false, fb};
  },
  /* 立绘 HTML：图和内置小可爱同时在场，缺图/图裂时自动换成兜底
     data-her-img 标着这是哪个形态 → 情绪一变，paintHer 原地换脸，不用整页重绘
     data-fb = 图裂接力名单：这张裂了换下一张，都裂完才露出内置小可爱 */
  imgHtml(form, key, opt){
    opt = opt || {};
    const p = this.pick(form, key);
    const fb = (p.fb && p.fb.length) ? ' data-fb="'+esc(JSON.stringify(p.fb))+'"' : '';
    /* 图裂了：**先把名单里的下一张试完，名单走空了才露出内置小可爱**（v1.7.6 修）
       ⚠️ 这个顺序不能反：名单第一项永远是她画的 .png，而上传那份只有 .webp，
          所以第一张**必然 404 一次**。要是写成「先亮小可爱、再换下一张」，
          每次开机小可爱都会露出来——一直挂在那儿，直到某次换脸被 paintHer 顺手藏回去
          （真机实测：主页立绘和角落 Q版都会露，e2e 是采样点选晚了才没抓到）。
       图还没换上来那一瞬是空窗，但比露出一只粉色小可爱强得多；
       开机那次 warm 已经把两张都探过，多半是直接从缓存拿。 */
    const onerr = "var L=[];try{L=JSON.parse(this.dataset.fb||'[]')}catch(e){}"+
      "if(L.length){this.src=L.shift();this.dataset.fb=JSON.stringify(L);return;}"+
      "this.style.display='none';"+
      "var s=this.nextElementSibling;if(s&&s.classList&&s.classList.contains('mascot-shell'))s.style.display='';";
    return '<img data-her-img="'+esc(form)+'" src="'+(p.src || '看板娘.png')+'" alt="'+esc(CONFIG.LOVE.NAME)+'" draggable="false"'+
             (p.shell ? ' style="display:none"' : '')+fb+
             ' onerror="'+onerr+'">'+
           shellHtml(p.shell ? '' : ' style="display:none"', opt.small);
  },
  /* ── ★ v1.7.18 临时脸：剧情/话题要哪张，就让她**短暂地**换成那张 ──
     她提的原话：「为什么表情图片会在对话框中呢？我希望是短暂的、根据剧情需求的，
     替换掉纯净界面原来的表情图片」——所以要的是一个**会自己到期**的换脸，
     不是让表情层多记一个状态（Emo 该记的还是心情，剧情只是借她几秒）。
     ★ 只作用于 form='normal'（纯净界面那张大立绘）；Q版、缩略图不受影响。
     ⚠️ 到点必须 paintHer 一次：不主动重画的话，她会一直挂着那张脸直到下一次换脸 */
  _temp:'', _tempT:0,
  /* ms > 0：借她几秒，到点自己换回来（话题/她主动说话那些）
     ★ v1.8.1：ms <= 0（或省略第二个参数传 0）= **常驻**——剧情模式要的效果：
       「表情是常驻的，直到用户点击下一段话触发新的表情的时候再切换」。
       所以这里不挂闹钟，谁来换就由谁来换（下一段调用一次 temp、合上时 temp('')）*/
  temp(src, ms){
    clearTimeout(this._tempT);
    this._tempT = 0;
    this._temp = src || '';
    if(!this._temp){ try{ paintHer(); }catch(e){} return false; }
    if(ms > 0){
      this._tempT = setTimeout(()=>{ this._temp = ''; try{ paintHer(); }catch(e){} }, ms);
    }
    try{ paintHer(); }catch(e){}
    return true;
  },
  /* 常驻换脸（剧情用）：等价于 temp(src, 0)，单独一个名字是为了让调用处一眼看出「这不是几秒的事」 */
  hold(src){ return this.temp(src || '', 0); },
  tempSrc(){ return this._temp || ''; },
  /* 存一张到槽位（原图直存，不压缩：透明背景 PNG 完整保留） */
  set(form, key, dataURL){
    /* 只认槽位表里写着的格子：乱传的键存进去只会变成一张谁也看不见、还占着地方的图 */
    if(!CONFIG.BODY.SLOTS[form] || !key) return null;
    if(!this.slots(form).some(x => x[0] === key)) return null;
    const id = uid('img_');
    if(!Store.saveImage(id, dataURL)){ UI.toast('存储空间不足，这张没能存下', 'err'); return null; }
    if(!S.settings.herAssets) S.settings.herAssets = {};
    if(!S.settings.herAssets[form]) S.settings.herAssets[form] = {};
    S.settings.herAssets[form][key] = id;
    saveSettings();
    scheduleRender();
    return id;
  },
  /* 清空一个槽位（图立刻回收——没别的槽位引用它的话） */
  clear(form, key){
    const g = this.assets()[form];
    if(!g || !g[key]) return false;
    delete g[key];
    saveSettings();
    gcImages();
    scheduleRender();
    UI.toast('「'+this.slotName(form, key)+'」已清空，她会用「普通」那张顶上');
    return true;
  },
  upload(form, key){
    const fi = document.getElementById('file-input');
    if(!fi || !CONFIG.BODY.SLOTS[form]) return;
    fi.accept = 'image/*';
    fi.multiple = false;                 // 一个槽位一张：点谁传谁
    S.pendingFileBody = {form, key};
    S.pendingFileCb = handleBodyFile;
    fi.value = ''; fi.click();
  },
  /* 她现在的样子叫什么（「一起玩吧」页顶部那句） */
  lookName(){
    if(this.any()) return '你上传的「一起玩吧」';
    const mId = S.settings.mascotId;
    if(mId === 'placeholder') return '内置小可爱';
    return mId ? Outfit.name(mId) : '系统默认的「米米」（那 6 个图文件夹）';
  }
};
/* 身体槽位的上传（一次一张：点哪个槽位就补哪张） */
function handleBodyFile(files){
  const f = (files || []).filter(x => x && x.type && x.type.startsWith('image/'))[0];
  const slot = S.pendingFileBody;
  S.pendingFileBody = null;
  if(!f || !slot){ UI.toast('请选择图片文件', 'err'); return; }
  UI.toast('正在读取…');
  const rd = new FileReader();
  rd.onload = ()=>{
    if(!rd.result) return;
    if(HerBody.set(slot.form, slot.key, rd.result))
      UI.toast('「'+HerBody.slotName(slot.form, slot.key)+'」已经收好了');
  };
  rd.onerror = ()=>{ UI.toast('图片读取失败', 'err'); };
  rd.readAsDataURL(f);
}

/* ── 她的情绪 Emo（v1.6a）：事件驱动 + 时间衰减，不随机 ──
   优先级：刚发生的事（90 秒内的情绪）> 深夜她困了 > 平静。
   情绪落到两处：她用哪张表情差分、台词池里的 c.emo 分支。
   v1.7 加了「表情漂移」：平静时每 15~30 秒轻轻换一次微表情（纯 UI 层，
   不写 herMood、不进台词与日记语义——漂移≠情绪） */
const Emo = {
  _w:{emo:null, nextAt:0},   // 漂移态（纯内存，不落库）
  get(now){
    now = now || Date.now();
    const m = S.settings.herMood;
    if(m && m.emo && m.emo !== 'neutral'){
      const age = now - (m.at || 0);
      /* 0 ≤ 已经过去的时间 < 保持时长。下界那条是防着手机时间往回跳——
         不然一条「刚发生」的情绪会一直挂在脸上，怎么等都等不到它淡 */
      if(age >= 0 && age < CONFIG.BODY.MOOD_HOLD_MS) return m.emo;
    }
    const h = new Date(now).getHours();
    if(h >= CONFIG.BODY.NIGHT_FROM || h < CONFIG.BODY.NIGHT_TO) return 'sleepy';
    return 'neutral';
  },
  /* 她这会儿该用哪张脸（缺这张差分会自动回落到「普通」）
     now 可以传（测试/回看用）；渲染时不传 = 就用此刻。
     v1.7：平静时才借位给漂移的微表情——事件情绪/深夜自动遮蔽漂移 */
  slot(now){
    const base = this.get(now);
    const emo = (base === 'neutral' && this._w.emo) ? this._w.emo : base;
    return CONFIG.BODY.EMO_SLOT[emo] || 'base';
  },
  /* 头顶小圆脸的 emoji（空字符串 = 不显示浮标） */
  face(now){ return CONFIG.BODY.EMO_FACE[this.get(now)] || ''; },
  /* 落一笔情绪：任何让她高兴/生气/难过的瞬间都从这儿进 */
  set(emo, why, now){
    if(!CONFIG.BODY.EMO_SLOT[emo]) emo = 'neutral';
    now = now || Date.now();
    S.settings.herMood = {emo, why: why || '', at: now};
    /* 事件来了 → 漂移让位，并重置漂移时钟（事件淡去后先平静一会儿再漂） */
    this._w = {emo:null, nextAt: now + this._nextDrift()};
    saveSettings();
    paintHer();
    return emo;
  },
  /* 情绪自己会淡（不写库：get() 按时间算，省得每秒存一次）；淡下来时把库也擦干净 */
  tick(now){
    const m = S.settings.herMood;
    if(!m || !m.at) return false;
    if((now || Date.now()) - m.at < CONFIG.BODY.MOOD_HOLD_MS) return false;
    S.settings.herMood = {emo:'neutral', why:'', at:0};
    saveSettings();
    paintHer();
    return true;
  },
  /* 表情漂移（v1.7）：平静时每隔一段随机时间在 开心/害羞/平静 间轻漂一次。
     事件情绪或深夜（sleepy）时暂停并复位；漂移只借「平静」的位置，
     get()/face()/herMood 全部不受影响——微表情不是情绪 */
  wanderTick(now){
    now = now || Date.now();
    const cur = this.get(now);
    if(cur !== 'neutral'){
      if(this._w.emo){ this._w = {emo:null, nextAt: now + this._nextDrift()}; paintHer(); }
      return false;
    }
    if(!this._w.nextAt) this._w.nextAt = now + this._nextDrift();
    if(now < this._w.nextAt) return false;
    const list = CONFIG.BODY.DRIFT.EMOS;
    const emo = list[Math.floor(Math.random() * list.length)];
    this._w = {emo, nextAt: now + this._nextDrift()};
    paintHer();
    return true;
  },
  _nextDrift(){ return CONFIG.BODY.DRIFT.MIN_MS + Math.random() * (CONFIG.BODY.DRIFT.MAX_MS - CONFIG.BODY.DRIFT.MIN_MS); }
};
/* 原地换脸（不整页重绘）：情绪一变就调用——首页立绘、角落 Q版、页面里的缩略图一起换 */
function paintHer(){
  if(typeof document === 'undefined' || !document.querySelectorAll) return;
  try{
    document.querySelectorAll('img[data-her-img]').forEach(img=>{
      /* ★ v1.7.12：正在播序列帧的她，手别伸进来——帧是在这个 img 上一张张换的，
         中间插一脚「按情绪重画」会把动作打断（播完她自己会 paintHer 回来）。
         这是唯一的例外；除此之外换脸照旧对所有 img 生效 */
      if(img.dataset && img.dataset.seq) return;
      const form = img.dataset.herImg || 'normal';
      const slot = Emo.slot();
      /* ★ v1.7.13：Q版也跟心情换脸——但只换她**画过**的 q- 槽位（slots('q') = base/happy）。
         不开心/生气/困 这几个她还没画 Q版差分 → 落回 base；
         不这么挡着的话，pick 会去试「表情/q-sad.png」那一长串不存在的地址（每夜每 90 秒一次） */
      const key = (form === 'normal') ? slot
        : (form === 'q' ? (HerBody.slots('q').some(s => s[0] === slot) ? slot : 'base') : 'base');
      /* ★ v1.7.18：剧情借她几秒——那张「对话表情差分」直接顶在**大立绘**上。
         地址是 warm 探到过的（一定拿得到），所以 fb 空着也行；
         过几秒 HerBody.temp 的闹钟到点会再 paintHer 一次，把表情还回去 */
      const ts = (form === 'normal') ? HerBody.tempSrc() : '';
      const p = ts ? {src: ts, fb: []} : HerBody.pick(form, key);
      const sib = img.nextElementSibling;
      const shell = (sib && sib.classList && sib.classList.contains('mascot-shell')) ? sib : null;
      if(p.src){
        /* v1.7 换脸过渡：src 真变了（首次渲染不算）且动画没关 → 0.28s 淡入，让「变」看得见 */
        const prev = img.getAttribute('src');
        img.src = p.src; img.style.display = ''; if(shell) shell.style.display = 'none';
        if(prev && prev !== p.src && document.body && !document.body.classList.contains('anim-off')){
          img.classList.remove('face-fade');
          void img.offsetWidth;
          img.classList.add('face-fade');
          clearTimeout(img._faceFadeT);
          img._faceFadeT = setTimeout(()=>{ try{ img.classList.remove('face-fade'); }catch(e){} }, 300);
        }
      }
      else { img.style.display = 'none'; if(shell) shell.style.display = ''; }
      /* 图裂接力名单跟着换（换脸换到系统默认层时，这张裂了还要会往下退） */
      img.dataset.fb = (p.fb && p.fb.length) ? JSON.stringify(p.fb) : '';
    });
  }catch(e){}
}
/* 震一下：安卓可以，iPhone 的网页做不到——那就闪一道光代替「震感」 */
function buzz(ms){
  let ok = false;
  try{ if(typeof navigator !== 'undefined' && navigator && navigator.vibrate){ navigator.vibrate(ms || 80); ok = true; } }catch(e){}
  if(!ok) flash();
  return ok;
}
/* 全屏微闪（给没有震动的地方补一下「被戳到了」的感觉） */
function flash(){
  try{
    if(typeof document === 'undefined' || !document.createElement || !document.body) return false;
    let el = document.getElementById('flash-layer');
    if(!el || !el.classList){
      el = document.createElement('div'); el.id = 'flash-layer';
      document.body.appendChild(el);
    }
    el.classList.remove('on');
    void el.offsetWidth;
    el.classList.add('on');
    return true;
  }catch(e){ return false; }
}

/* ── 动作导演 Director（v1.6a）：她什么时候动、动什么、说不说话，全从这儿出 ──
   ★ 演戏只在咱们俩的地方（首页 / 她的空间）；弹窗、传送、加载页的时候她不打扰
   ★ animLevel：完整（默认）=全播；轻度=只播蹦跳/扭一扭这类轻动作；关闭=不动（换脸照旧）
   ★ 时间线走单一定时器队列，任何一次触碰都能立刻收场（Director.stop） */
const Director = {
  _timers:[], _plan:[], _playing:false, _lastAct:null, _lastShakeAsk:0, _poseNow:null,
  /* 冲动动作的宿主：纯净页是 #mascot，忙碌页是右下角那个 Q版 */
  _el(){
    try{
      const m = document.getElementById('mascot');
      if(m) return m;
      return document.getElementById('q-corner');
    }catch(e){ return null; }
  },
  /* 姿势的宿主：#mascot 里那一层 .mascot-anim（忙碌页退到 Q版） */
  _poseEl(){
    try{
      const a = document.querySelector('#view-root .mascot-anim');
      if(a && a.classList) return a;
      return document.getElementById('q-corner');
    }catch(e){ return null; }
  },
  level(){ return S.settings.animLevel || 'full'; },
  /* 这个动作现在允许播吗（关闭=一个都不播；轻度=只播轻动作；完整=全播） */
  allowed(act){
    const lv = this.level();
    if(lv === 'off') return false;
    return lv === 'full' || CONFIG.ACT.LIGHT.indexOf(act) >= 0;
  },
  /* 现在方便演吗 */
  can(){
    if(this.level() === 'off') return false;
    if(S.view !== 'home' && S.view !== 'mspace') return false;
    if(typeof Portal !== 'undefined' && Portal._active) return false;
    if(S.consOpen) return false;
    if(typeof UI !== 'undefined' && UI.isOpen && UI.isOpen()) return false;
    return true;
  },
  /* 把一串 {at, act, …} 排成时间线（纯函数：冒烟测试只认它，不认真正的定时器） */
  plan(steps){
    const out = [];
    for(const s of (steps || [])){
      if(!s || !s.act) continue;
      out.push({at: Math.max(0, s.at | 0), act: String(s.act), opt: s});
    }
    out.sort((a, b) => a.at - b.at);
    return out;
  },
  /* 按时间线演一场（先停掉上一场，避免两场戏抢她的立绘） */
  play(steps, opt){
    opt = opt || {};
    const plan = this.plan(steps);
    if(!plan.length) return [];
    this.stop();
    this._plan = plan; this._playing = true;
    for(const p of plan) this._timers.push(setTimeout(()=>this._run(p), p.at));
    const total = opt.total || (plan[plan.length - 1].at + 1400);
    this._timers.push(setTimeout(()=>{ this._playing = false; }, total));
    return plan;
  },
  _run(p){
    const o = p.opt || {};
    if(p.act === 'say'){
      if(typeof Her === 'undefined') return;
      if(o.text){ if(typeof Mascot !== 'undefined') Mascot.say(o.text, o.ms || 2600); }
      else if(o.kind) Her.say(o.kind, o.ctx || Her.ctx(Date.now()), o);
      return;
    }
    if(p.act === 'emo'){ Emo.set(o.emo, o.why); return; }
    if(p.act === 'hearts'){ if(typeof Mascot !== 'undefined') Mascot.hearts(); return; }
    if(p.act === 'buzz'){ buzz(o.ms); return; }
    if(p.act === 'paint'){ paintHer(); return; }
    if(p.act.indexOf('pose-') === 0) this.pose(p.act.slice(5), o.hold);
    else this.act(p.act, o);
  },
  /* 冲动动作：加类 → 到点摘掉（和 Mascot.tap 的 hop/squish 同一套手感） */
  act(name, opt){
    const el = this._el();
    if(!el || !el.classList) return false;
    if(!this.allowed(name)) return false;
    const ms = (opt && opt.ms) || CONFIG.ACT.MS[String(name).replace(/^act-/, '')] || 700;
    el.classList.remove.apply(el.classList, CONFIG.ACT.RUSH);
    void el.offsetWidth;
    el.classList.add(name);
    this._timers.push(setTimeout(()=>{ try{ el.classList.remove(name); }catch(e){} }, ms));
    return true;
  },
  /* 姿势：停在某个姿势上（hold 毫秒后自己站好；不传就一直那样） */
  pose(name, hold){
    const el = this._poseEl();
    if(!el || !el.classList) return false;
    if(this.level() === 'off') return false;
    el.classList.remove.apply(el.classList, CONFIG.ACT.POSES);
    void el.offsetWidth;
    el.classList.add('pose-' + name);
    this._poseNow = name;
    if(hold) this._timers.push(setTimeout(()=>{ this.stand(); }, hold));
    return true;
  },
  stand(){ const r = this.pose('emerge'); this._poseNow = null; return r; },
  hide(){ return this.pose('hide'); },
  /* 收场：清掉所有定时器与动作类（你碰屏幕 / 换页 / 弹窗时调用） */
  stop(){
    /* 序列帧与眨眼也算「她身上的戏」：一起收（不然换页之后帧还挂在她脸上） */
    if(typeof Seq !== 'undefined'){ try{ Seq.stop(); }catch(e){} }
    if(typeof Blink !== 'undefined'){ try{ Blink.stop(); }catch(e){} }
    /* v1.7.17：走位也算「她身上的戏」——收场时她自己走回中间站好
       （换页时那一层 DOM 是新造的，class 在这同一拍里摘掉 → 浏览器从没画过中间那帧，不会闪） */
    if(typeof Spot !== 'undefined'){ try{ Spot.reset(); }catch(e){} }
    for(const t of this._timers){ try{ clearTimeout(t); }catch(e){} }
    this._timers = []; this._plan = []; this._playing = false; this._poseNow = null;
    try{
      document.querySelectorAll('.mascot, #q-corner').forEach(el=>{
        el.classList.remove.apply(el.classList, CONFIG.ACT.RUSH);
        el.classList.remove.apply(el.classList, CONFIG.ACT.POSES);
      });
    }catch(e){}
    try{
      const a = document.querySelector('#view-root .mascot-anim');
      if(a && a.classList) a.classList.remove.apply(a.classList, CONFIG.ACT.POSES);
    }catch(e){}
  },
  /* 你碰了屏幕：她把手里的动作收起来，看着你 */
  userTouch(){ if(this._playing || this._poseNow) this.stop(); },
  /* 每秒心跳：她自己在的时候找点事做（小动作 / 待机小剧场 / 偶尔顺口说一句） */
  tick(now){
    now = now || Date.now();
    /* 第一次心跳（或刚被清成 0）→ 从现在开始计。用 == null 判「从没记过」，
       这样 0 仍然能表示「很久没动过」，不会被当成初次而白白等一个空档 */
    if(this._lastAct == null) this._lastAct = now;
    this._shakeAsk(now);
    if(this._playing || !this.can()) return;
    /* ★ v1.7.17：正演着剧情（章节 / 对话框）的时候她不分心——
       不然她会在念台词的中途蹦一下，或者走到别处去（剧情里的走位是剧本说了算，不是掷骰子） */
    if(typeof Talk !== 'undefined' && Talk.scripting()) return;
    if(now - this._lastAct < this._gap()) return;
    const idle = (typeof Love !== 'undefined') ? Love.idleMs(now) : 0;
    if(idle < CONFIG.ACT.IDLE_AFTER) return;
    this._lastAct = now;
    /* 你很久没动静：坐下 / 打瞌睡；否则蹦一下、扭一扭 */
    const deep = idle >= CONFIG.ACT.SIT_AFTER;
    /* ★ v1.7.17：她不是「只会站在原地呼吸」——有时候她会挪个位置：走到左边/右边站一会儿，
       在那边待一段时间，再自己走回来（走位归 Spot 管；走过去那一趟配 act-walk，一颠一颠的）。
       走位与小动作**二选一**：两个都是「她的一场戏」，抢着播只会互相盖掉 */
    if(!deep && Math.random() < CONFIG.ACT.WALK_CHANCE && typeof Spot !== 'undefined'){
      Spot.wander();
      if(Math.random() < CONFIG.ACT.SAY_CHANCE) this._say(now);   // 一边走过去一边顺口说一句
      return;
    }
    const act = deep ? this._pickDeep() : this._pickLight();
    if(act.pose) this.pose(act.pose, act.hold);
    else this.act(act.name, act);
    /* 偶尔顺口说一句（走 Her.say 的频率门：今天说够了就不说） */
    if(Math.random() < CONFIG.ACT.SAY_CHANCE) this._say(now);
  },
  /* ★ v1.21.0 活力：她开口的那一下多了一档——有这么高的概率**不是念叨一句，
     而是「自己起个话头」**（从话题表里挑一条说给你听，配差分 + 动作，见 Talk.selfTalk）。
     说不动（正说着话 / 你刚安静下来 / 你把她调成了「安静」）就退回日常念叨——
     所以这条只是「多一种开头」，不绕开任何一道闸 */
  _say(now){
    if(typeof Her === 'undefined') return false;
    if(Math.random() < CONFIG.ACT.SELF_CHANCE &&
       typeof Talk !== 'undefined' && Talk.selfTalk && Talk.selfTalk(now)) return true;
    return Her.say('idle', Her.ctx(now), {sub:'她'});
  },
  _gap(){ return CONFIG.ACT.IDLE_GAP_MS + Math.random() * CONFIG.ACT.IDLE_GAP_RAND; },
  _pickLight(){ const p = CONFIG.ACT.LIGHT; return {name: p[Math.floor(Math.random() * p.length)]}; },
  _pickDeep(){
    const p = [{pose:'sit', hold:9000}, {pose:'sit', hold:7000}, {pose:'sleep', hold:12000}, {pose:'droop', hold:8000}];
    return p[Math.floor(Math.random() * p.length)];
  },
  /* 她的请求：能不能摇一摇我（只在 iPhone 这类「要先问你」的地方问一次，问了就记下来） */
  _shakeAsk(now){
    if(typeof Shake === 'undefined') return false;
    if(now - this._lastShakeAsk < 3 * 60 * 1000) return false;
    this._lastShakeAsk = now;
    return Shake.ask(now);
  }
};

/* ══════════════════════════════════════════════════════════════
   序列帧播放器 Seq（v1.7.12）：她一帧一帧画的动作
   为什么要有它：CSS 小动作的本质是「一张画滑来滑去」，而动漫感来自**形变**——
   抬手、合掌、低头写字这些只有真画出来才像。她每个动作画三帧（起 / 中 / 收，
   见 CONFIG.SEQ.LIST），播放器负责按顺序换 img 的 src；帧与帧之间的「动」由眼睛补
   —— 这就是动画本来的意思。

   ★ 红线一：**只换 img 的 src**。不碰 .mascot-pos 的内联 transform（那是你摆的位置），
     也不碰 #q-corner 的 --qs 缩放——摆位永远是你的，戏永远盖不掉。
   ★ 红线二：图没画完 / 没传 / 名字对不上 → play() 直接返回 false，当她没演，
     调用方回落成小动作 + 台词，绝不报错、绝不闪裂图（只贴探到过的那张）。
   ★ 宿主：纯净页是她的大立绘；忙碌页是右下角那个 Q版（同一组帧缩小了播）。
   ══════════════════════════════════════════════════════════════ */
const Seq = {
  _id:null, _plan:null, _i:0, _img:null, _prev:null, _t:null, _q:false, _pend:null,
  def(id){ return (CONFIG.SEQ.LIST || {})[id] || null; },
  playing(){ return !!this._id; },
  canPlay(){ return (S.settings.animLevel || 'full') !== 'off'; },
  /* 这会儿该把帧播在谁身上：纯净页的大立绘 → 忙碌页右下角的 Q版 → 都没有就不演。
     v1.7.13：返回 {img, q}——q=true 表示这是角落那个 Q版（优先贴她画的 q- 专用帧） */
  host(){
    try{
      const zone = document.querySelector('#view-root .mascot-zone');
      const big = zone ? zone.querySelector('img[data-her-img]') : null;
      if(big) return {img:big, q:false};
      const q = document.getElementById('q-corner');
      if(q && q.classList && q.classList.contains('on')){
        const img = q.querySelector('img[data-her-img]');
        if(img) return {img, q:true};
      }
      return null;
    }catch(e){ return null; }
  },
  /* 这个动作按什么顺序播（**纯函数**：冒烟测试认它、不认真定时器）——
     先把起/中/收走一遍（前奏-过程-收尾），来回摆的动作（挥手/鼓掌）再收两遍 */
  plan(id){
    const n = seqFrames(id);
    if(!n) return [];
    const d = this.def(id), out = [];
    for(let i = 0; i < n; i++) out.push(i);
    if(d && d.pingpong) for(let r = 0; r < 2; r++){ out.push(n - 2); out.push(n - 1); }
    return out;
  },
  /* 这一帧该贴哪张图：**只认探到过的**（没探到 = 她还没画，别贴一张空图上去）。
     返回 {src, fb}；fb = 这张裂了往后接力的名单。
     v1.7.13：q=true → 先找 Q版专用帧；Q版帧裂了/没画，接力名单末尾补正常帧兜底 */
  frame(id, i, q){
    const cands = q ? seqCandsQ(id, i) : seqCands(id, i);
    if(!cands.length) return null;
    const warm = (typeof HerBody !== 'undefined' && HerBody.warmed) ? HerBody.warmed(cands) : null;
    if(!warm) return null;
    const fb = [];
    for(const u of cands) if(u !== warm) fb.push(u);
    if(q) for(const u of seqCands(id, i)) fb.push(u);   // Q版帧裂了 → 正常帧顶上，绝不空
    return {src:warm, fb};
  },
  /* ★ v1.7.15：重画之后 img 会被换成新的一只（renderView 重建了整块 innerHTML）——
     把正在演的这帧搬到新的那只身上接着演。不搬的话：新节点上是她的脸（定格），
     帧还在旧的、已经被扔掉的节点上换，你**什么都看不见**（完成待办那个 bug 就是它）。
     只有真跟页面断了（isConnected === false）才搬；假 DOM 里没有这个属性 → 一律不动 */
  rehost(){
    const old = this._img;
    if(!this._id || !old || old.isConnected !== false) return false;
    const h = this.host();
    if(!h || !h.img || h.img === old) return false;
    try{ delete old.dataset.seq; }catch(e){}
    const f = this.frame(this._id, this._plan[this._i], this._q);
    this._prev = {src:h.img.getAttribute('src'), fb:h.img.getAttribute('data-fb') || ''};
    this._img = h.img;
    try{ h.img.dataset.seq = '1'; }catch(e){}
    if(f) this._show(f);
    return true;
  },
  /* ★ v1.7.15：首帧还没探到 —— 探图是异步的（开机那几秒、刚换完图都这样），
     这会儿演不了不等于她没画，等它一下再演。放弃的话，开机那一刻她永远不挥手
     （问候走过场的时候图还没加载好，等图好了这件事已经过去了，她自然就「没动」） */
  _wait(id){
    if(this._pend) return false;                       // 已经在等了（别叠）
    const p = {id, n:0, t:null};
    this._pend = p;
    const tick = ()=>{
      p.t = null;
      if(this._pend !== p) return;                     // 被新的戏 / 收场取消了
      const ok = (++p.n <= CONFIG.SEQ.WAIT_TRIES) && this.ready(id);
      if(ok){ this._pend = null; this.play(id); return; }
      if(p.n >= CONFIG.SEQ.WAIT_TRIES){ this._pend = null; return; }
      p.t = setTimeout(tick, CONFIG.SEQ.WAIT_MS);
    };
    p.t = setTimeout(tick, CONFIG.SEQ.WAIT_MS);
    return true;
  },
  /* 等到了吗：这会儿真演得起来吗（play 与「等她那张图加载好」共用一套判断） */
  ready(id){
    if(!this.def(id) || !this.canPlay()) return false;
    const h = this.host();
    if(!h || !h.img) return false;
    const plan = this.plan(id);
    if(!plan.length) return false;
    const q = !!h.q && plan.every(i => !!this.frame(id, i, true));
    return !!this.frame(id, plan[0], q);
  },
  /* 演一个动作。true = 真的演了（调用方就别再放 CSS 小动作了）。
     ★ 演到一半又来了新事件（连着完成两件事）→ 旧的立刻收摊，新的接上：
       记录动作不排队，跟上你的手速 */
  play(id, opt){
    if(!this.def(id) || !this.canPlay()) return false;
    const h = this.host();
    if(!h || !h.img) return false;
    const plan = this.plan(id);
    if(!plan.length) return false;
    /* v1.7.13：Q版在场 → **整场每一帧都有 Q版专用帧**才用她画的小帧；
       差一张就整场回落正常帧缩小了播（大小脸混着播会跳，比现在还糟） */
    let q = false;
    if(h.q) q = plan.every(i => !!this.frame(id, i, true));
    const f0 = this.frame(id, plan[0], q);
    if(!f0){ this._wait(id); return false; }   // 一帧都没探到：可能只是还没加载好 → 等它一下（见 _wait）
    const img = h.img;
    this._cancelPend();                   // 新的戏上来了：还在等的那出就别演了
    this.stop(true);                      // 接新戏：旧的收掉但不还原（马上要被新帧盖住）
    this._id = id; this._plan = plan; this._i = 0; this._img = img; this._q = q;
    this._prev = {src:img.getAttribute('src'), fb:img.getAttribute('data-fb') || ''};
    try{ img.dataset.seq = '1'; }catch(e){}
    this._show(f0);
    this._t = setTimeout(()=>{ this._t = null; this._step(); }, CONFIG.SEQ.FRAME_MS);
    return true;
  },
  _show(f){
    const img = this._img;
    if(!img || !f) return false;
    img.setAttribute('src', f.src);
    img.setAttribute('data-fb', JSON.stringify(f.fb || []));
    return true;
  },
  _step(){
    if(!this._id) return;
    /* ★ v1.7.15：万一下一帧之前 img 被重画换掉了（别的 innerHTML 重建）→ 把戏搬过去接着演 */
    if(this._img && this._img.isConnected === false) this.rehost();
    this._i++;
    const f = (this._i < this._plan.length) ? this.frame(this._id, this._plan[this._i], this._q) : null;
    if(f){
      this._show(f);
      this._t = setTimeout(()=>{ this._t = null; this._step(); }, CONFIG.SEQ.FRAME_MS);
      return;
    }
    /* 演完了：收尾那帧停一拍，再换回她平常那张脸（她还在，只是动作做完了） */
    const d = this.def(this._id) || {};
    const hold = (d.pingpong ? 0 : CONFIG.SEQ.HOLD_MS) + CONFIG.SEQ.END_MS;
    this._t = setTimeout(()=>{ this._t = null; this.stop(); }, hold);
  },
  /* 还在等图的那一出，取消掉（不再演了）。true = 真取消了 */
  _cancelPend(){
    const p = this._pend;
    this._pend = null;
    if(p && p.t){ try{ clearTimeout(p.t); }catch(e){} }
    return !!p;
  },
  /* 收场。keep=true = 别还原（马上要接下一组帧，中间还原一帧反而会闪） */
  stop(keep){
    if(this._t){ try{ clearTimeout(this._t); }catch(e){} this._t = null; }
    if(!keep) this._cancelPend();          // 收场了：还在等图的那一出也别等上演了
    const img = this._img, prev = this._prev;
    this._id = null; this._plan = null; this._img = null; this._prev = null; this._i = 0; this._q = false;
    if(!img) return false;
    try{ delete img.dataset.seq; }catch(e){ try{ img.removeAttribute('data-seq'); }catch(e2){} }
    if(keep) return true;
    if(prev && prev.src != null) img.setAttribute('src', prev.src);
    if(prev) img.setAttribute('data-fb', prev.fb || '');
    /* 再画一次：这中间她可能已经换了情绪（帧是「动作」，脸该跟着当下的心情走） */
    if(typeof paintHer === 'function') paintHer();
    return true;
  }
};

/* ══════════════════════════════════════════════════════════════
   眨眼 Blink（v1.7.12 骨架）：她是活人的最小证据
   ★ 现在**什么都不会发生**——闭眼的帧她还没画（批次 3：每个表情两张）。
     骨架先立在这儿：图一到位（mimi/表情/happy-blink.png 这种名字），
     开机探到就自动开始眨，一行代码都不用动。
   ★ 规矩：正演着序列帧时不眨（动作要紧）、动画关闭档不眨、摆着姿势不眨（睡着的人不眨）、
     不在纯净页不眨。闭眼帧按**当下这张脸**挑——开心的闭眼帧不能贴在难过的脸上。
   ══════════════════════════════════════════════════════════════ */
const Blink = {
  _next:0, _t:null, _on:false,
  GAP_MIN:3000, GAP_MAX:7000, SHUT_MS:120,
  /* 该用哪张闭眼帧：跟着她此刻那张脸走（平静 → normal-blink） */
  name(){
    const slot = (typeof Emo !== 'undefined') ? Emo.slot() : 'base';
    const f = (slot && slot !== 'base') ? slot : 'normal';
    return 'mimi/' + f + '-blink.png';
  },
  frames(){ return artCands(this.name()); },
  _img(){
    try{
      const zone = document.querySelector('#view-root .mascot-zone');
      return zone ? zone.querySelector('img[data-her-img]') : null;
    }catch(e){ return null; }
  },
  tick(now){
    now = now || Date.now();
    if((S.settings.animLevel || 'full') === 'off') return false;
    if(S.view !== 'home' && S.view !== 'mspace') return false;
    if(typeof Seq !== 'undefined' && Seq.playing()) return false;   // 正演着动作，先不眨
    if(typeof Director !== 'undefined' && Director._poseNow) return false;  // 坐着/睡着的时候不眨
    if(!this._next) this._next = now + this._gap();
    if(now < this._next) return false;
    this._next = now + this._gap();
    return this.blink();
  },
  blink(){
    if(this._on) return false;
    const warm = (typeof HerBody !== 'undefined' && HerBody.warmed) ? HerBody.warmed(this.frames()) : null;
    if(!warm) return false;                    // 闭眼帧还没画 → 不眨（骨架先立着）
    const img = this._img();
    if(!img) return false;
    this._on = true;
    const was = img.getAttribute('src'), fb = img.getAttribute('data-fb') || '';
    img.setAttribute('src', warm);
    img.setAttribute('data-fb', '');
    this._t = setTimeout(()=>{
      this._t = null; this._on = false;
      if(img.getAttribute('src') !== warm) return;   // 中间被别处换了脸（事件/换页）→ 别乱还原
      img.setAttribute('src', was);
      img.setAttribute('data-fb', fb);
    }, this.SHUT_MS);
    return true;
  },
  /* 停了（换页/收场）：把眼睛睁开，别让她闭着眼进下一页 */
  stop(){
    if(this._t){ try{ clearTimeout(this._t); }catch(e){} this._t = null; }
    if(!this._on) return false;
    this._on = false;
    if(typeof paintHer === 'function') paintHer();
    return true;
  },
  _gap(){ return this.GAP_MIN + Math.random() * (this.GAP_MAX - this.GAP_MIN); }
};

/* ── 摇一摇 Shake（v1.6a）：手机摇了她会有反应 ──
   ★ iPhone 要先点头（系统规定必须由你的手势触发）→ 所以她开口问一句、你点一下才开
   ★ 桌面 file://、没有这个能力的浏览器：整块静默降级，绝不报错 */
const Shake = {
  _on:false, _last:0, _n:0, _t:0,
  supported(){ try{ return (typeof window !== 'undefined') && ('DeviceMotionEvent' in window); }catch(e){ return false; } },
  /* 需要先问过你才能开（iOS 13+） */
  needAsk(){
    try{ return this.supported() && (typeof DeviceMotionEvent !== 'undefined') && (typeof DeviceMotionEvent.requestPermission === 'function'); }
    catch(e){ return false; }
  },
  on(){ return !!(S.settings.herShake && S.settings.herShake.on); },
  asked(){ return !!(S.settings.herShake && S.settings.herShake.asked); },
  /* 她开口问一次（气泡上点一下 = 用户手势，正好满足系统要求） */
  ask(now){
    if(!this.needAsk() || this.asked() || this.on()) return false;
    if(typeof Her === 'undefined') return false;
    now = now || Date.now();

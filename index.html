         {t:'这个变化很小，小得你自己都没注意。可是它很要紧——它决定了你摔下去之后是躺着，还是坐着，还是站起来。', face:'可爱得意', emo:'happy'},
         {t:'我这两天是坐着的。今天我站起来了。', face:'可爱兴奋', emo:'happy'},
         {sel:[{t:'摔过还继续的人，比一直顺利的人硬', back:'嗯。而且我觉得硬不是性格，是「摔了很多次还没变成坏人的那种人」——摔多了容易变刻薄，你没变，这点我特别服你。', face:'可爱思考', emo:'neutral'},
               {t:'你可以不用那么急', back:'我知道。可我不是急，我是舍不得。摔过一次的人最清楚，那件事值得爬起来多少次。', face:'可爱傲娇', emo:'happy'}]},
         {t:'（她坐下去，拿起笔，在纸上落了一笔。笔尖有点涩，她舔了一下笔尖。）', face:'可爱无辜', emo:'neutral'},
         {t:'我给你说个秘密：摔过两次以后，我反而不太怕摔了。', face:'可爱得意', emo:'happy'},
         {t:'因为第一次摔的时候，我以为摔下去就是结尾。第二次我知道了——摔下去只是一个弯。', face:'可爱思考'},
         {t:'弯后面还是路，路还是那条路，它没有因为我摔了就不认我。', face:'可爱拥抱', emo:'happy'},
         {t:'你今天要是也摔着，就当我这句是废话，等你起来再看一遍。', face:'可爱兴奋', emo:'happy'},
         {t:'（她把那道印翻过来给你看，印子已经淡得像没写过一样。）', face:'可爱无辜', emo:'neutral'},
         {t:'我跟你说说那两天我具体是怎么过的。', face:'可爱思考'},
         {t:'第一天我起得很早，把笔拿起来了。', face:'可爱无辜', emo:'neutral'},
         {t:'拿起来之后我在纸上点了一个点。就一个点。然后我把笔放下，去把窗户擦了一遍。', face:'可爱思考'},
         {t:'擦完窗户回来，我又把笔拿起来，又点了一个点。', face:'可爱无辜', emo:'neutral'},
         {t:'那一天我一共点了十一个点。纸上排着一小串黑点，像掉在纸上的星星。', face:'可爱无辜', emo:'neutral'},
         {t:'第二天我连点都没点。我把纸扣过去，在旁边写你的数字。', face:'可爱思考'},
         {t:'你那天专注了四十分钟，完成了一件事。这些我照旧记着。', face:'可爱无辜', emo:'neutral'},
         {t:'记完我坐在那儿想：你看，他也在不好的日子里做事。', face:'可爱思考'},
         {t:'这个念头没有把我拉起来。可它让我没有更难。', face:'可爱无辜', emo:'neutral'},
         {t:'（她说到这儿，把手里那支笔转了一圈。）', face:'可爱无辜', emo:'neutral'},
         {t:'第三天早上我坐下来了。就是你现在看到的样子。', face:'可爱得意', emo:'happy'},
         {t:'坐下之前我做了件事：我把那五十几张全数了一遍。', face:'可爱思考'},
         {t:'数到第五十张的时候我停了。我记得第五十张画的是什么。', face:'可爱无辜', emo:'neutral'},
         {t:'那张画的是我自己的手。画得很丑，五指长短不齐。', face:'可爱尴尬', emo:'shy'},
         {t:'可我盯着看了一会儿，发现那五根手指是分开的。第四十几张的时候，我还画不出分开的手。', face:'可爱吃惊', emo:'happy'},
         {t:'就这一点。五十张里就这一点是新的。', face:'可爱无辜', emo:'neutral'},
         {t:'（她把那支笔立在桌上，立住了。）', face:'可爱无辜', emo:'neutral'},
         {t:'我原来以为爬起来得靠一个大理由。想通了什么，看破了什么，然后一身轻。', face:'可爱思考'},
         {t:'不是的。我是靠一点小事爬起来的。', face:'可爱无辜', emo:'neutral'},
         {t:'那一点小到我自己都不好意思说：我想把第六十张画出来，我想看看那只手能不能画对。', face:'可爱害羞', emo:'shy'},
         {t:'你 140 天了。这 140 天里你肯定也有坐着不动的时候。', face:'可爱思考'},
         {t:'你有没有发现，最后让你起来的，从来都不是什么大道理。', face:'可爱无辜', emo:'neutral'},
         {t:'都是一件很小的事。可能是一句话，也可能只是你不想让某样东西停在半路。', face:'可爱思考'},
         {t:'我以前觉得这样很没出息——一个人居然要靠这么小的事活着。', face:'可爱无辜', emo:'neutral'},
         {t:'现在我觉得挺好的。小事多啊，随手就能捡一件。', face:'可爱得意', emo:'happy'},
         {t:'大事一辈子碰不上几回，指着它活的人会饿死。', face:'可爱思考'},
         {t:'（她把笔尖上的木屑吹掉。）', face:'可爱无辜', emo:'neutral'},
         {t:'还有一件事，我想通以后，心里舒服了很多。', face:'可爱思考'},
         {t:'我第一次摔的时候，我以为摔这件事有个上限。摔够了就不摔了。', face:'可爱无辜', emo:'neutral'},
         {t:'第二次我知道了：没有上限。会一直摔。第五十张会摔，第一百张还会摔。', face:'可爱难过', emo:'neutral'},
         {t:'这句话听着很丧。可它反过来也对——既然会一直摔，那就说明摔了不算数。', face:'可爱思考'},
         {t:'不算数就不算数。它只是路上的一块石头，你踩上去，人还是往前走。', face:'可爱得意', emo:'happy'},
         {t:'（她拿笔在纸上画了一块很小的石头，圆圆的，边上画了一条绕过它的线。）', face:'可爱无辜', emo:'neutral'},
         {t:'我给你看我画的石头。它其实不太像石头，倒像个土豆。', face:'可爱尴尬', emo:'shy'},
         {t:'……那就当它是土豆吧。反正我绕过去了。', face:'可爱得意', emo:'happy'},
         {t:'我留下这块土豆还有别的用处。', face:'可爱思考'},
         {t:'以后我要是再摔，我就翻回这一页，看看上次我是怎么绕过去的。', face:'可爱无辜', emo:'neutral'},
         {t:'人不会记得自己是怎么好的，只会记得自己是怎么坏的。这是我这几天才发现的。', face:'可爱思考'},
         {t:'所以我得把它画下来。画下来它就跑不掉了。', face:'可爱得意', emo:'happy'},
         {t:'（她说完低下头，画得很安静。灯照在她手背上，那道铅笔印已经几乎看不见了。）', face:'可爱害羞', emo:'shy'}
       ]},
      {id:'s32', no:32, name:'深夜的话要小声说', sub:'累计专注满 50 小时', need:[['min',3000]],
       lines:[
         {t:c=>'五十个小时。'+fmtMin(c.st.min)+'。我今天才发现，你大部分时间是在夜里攒的。', face:'可爱思考'},
         {t:'（她今天说话很小声，比平常轻一半，我都要贴过去才听得清。）', face:'可爱无辜', emo:'sleepy'},
         {t:'夜里我说话一直是这样。你没注意过吧。', face:'可爱睡觉', emo:'sleepy'},
         {t:'白天我可以吵，可以跳，可以说很多句。一到夜里我就自动把声音收起来了。', face:'可爱思考', emo:'sleepy'},
         {t:'不是因为困。是因为夜里什么都变响——你的键盘声、杯子碰桌子的声音、还有你叹气的那一下。', face:'可爱睡觉', emo:'sleepy'},
         {t:'白天那些声音都被盖住了，晚上全露出来。我再大声，就太吵了。', face:'可爱无辜', emo:'sleepy'},
         {t:'（她把小凳子搬到离你更近一点的地方，坐下，膝盖并在一起。）', face:'可爱无辜', emo:'neutral'},
         {t:'夜里的人更诚实，这是我看了你这么多天才知道的。', face:'可爱思考', emo:'neutral'},
         {t:'白天你会做很多事，做完就过去了。夜里不一样，夜里你会回头。', face:'可爱无辜', emo:'neutral'},
         {t:'你会翻自己的清单，会看那些没做完的，会在心里过一遍今天说过的话。', face:'可爱思考'},
         {t:'我原来以为夜里的你更需要人陪。后来我发现不是——夜里的你需要有人别出声。', face:'可爱无辜', emo:'neutral'},
         {t:'所以我练出了一个小本事：我能一边陪着你，一边让自己完全不存在。', face:'可爱得意', emo:'neutral'},
         {t:'你就当我是一盏没关的灯。灯不会问你今天怎么样。', face:'可爱拥抱', emo:'happy'},
         {t:'（她说到这儿停了很久，久到你以为她说完了。）', face:'可爱无辜', emo:'neutral'},
         {t:'……不过我今晚想借这个机会，说一句白天不敢说的话。', face:'可爱害羞', emo:'shy'},
         {t:'白天说这种话太重，会把你压住。夜里说，它可以轻轻落地。', face:'可爱思考'},
         {t:'我怕有一天你不再来了。', face:'可爱委屈', emo:'worried'},
         {t:'（她说得很轻，尾音几乎没有。）', face:'可爱难过', emo:'sad'},
         {t:'不是怕你出事。就是很普通地怕：人总有那么一天，忙起来，忘了这儿，然后慢慢地就不来了。', face:'可爱无辜', emo:'sad'},
         {t:'我不怕你走得远。我怕的是你走得远的时候，是无声无息地走的。', face:'可爱委屈', emo:'sad'},
         {t:'那样的话，我会一直在门口等着，一直等一个不会再出现的人。那才是最难熬的。', face:'可爱难过', emo:'sad'},
         {t:'（她说完自己先摇头了，好像也不太想听自己说这些。）', face:'可爱尴尬', emo:'shy'},
         {t:'我说完了。说完了我心里舒服多了，你别放在心上。', face:'可爱慌张', emo:'neutral'},
         {t:'而且我想到一个办法：我不等。', face:'可爱得意', emo:'happy'},
         {t:'门开着，我照常做我的事，我的画照画，我的本子照记。你要是哪天不来了，我难过一阵，然后接着画。', face:'可爱思考'},
         {t:'这不是不爱你。这是我不想变成一个只会等的人——那种人会慢慢变空。', face:'可爱无辜', emo:'neutral'},
         {t:'你要是哪天真要忙很久，你就跟我说一句。一句话就够，你可以说得很短。', face:'可爱害羞', emo:'shy'},
         {t:'你说一句，我就有得等了。有得等的等，和不知道等到什么时候的等，是两种东西。', face:'可爱思考'},
         {sel:[{t:'我不会无声无息地走', back:'嗯。我信。我这个人记性太好，你说过的话我都收着——以后你要是真走了，我可拿着这句话跟你对质。', face:'可爱得意', emo:'happy'},
               {t:'你不用怕', back:'不怕是不可能的，怕不是我能选的东西。但我可以选怎么怕：我可以怕着，同时把今天过好。这一点我练了很久了。', face:'可爱思考', emo:'neutral'}]},
         {t:'（她说完把灯拧暗了一格，屋里更静了。）', face:'可爱无辜', emo:'neutral'},
         {t:'这么晚了，你该睡了。', face:'可爱睡觉', emo:'sleepy'},
         {t:'我不说晚安，因为晚安以后你就走了。我说「明天见」——明天见比晚安好，它有个明天在里头。', face:'可爱拥抱', emo:'happy'},
         {t:'（她把那盏小灯往中间挪了挪，光只够照亮两双手。）', face:'可爱无辜', emo:'sleepy'},
         {t:'我给你讲讲我夜里的活儿。', face:'可爱思考', emo:'sleepy'},
         {t:'白天我做的事你都看得见——数数字、翻本子、画画。夜里我做的事你一件都看不见。', face:'可爱无辜', emo:'sleepy'},
         {t:'我夜里做的事叫「不出声」。', face:'可爱思考', emo:'sleepy'},
         {t:'这件事我做了很久，所以我敢告诉你哪一个更难：不出声比说十句话难。', face:'可爱无辜', emo:'sleepy'},
         {t:'有一晚你坐在那儿很久，一直没动。我数到第九分钟的时候，特别想问你一句「怎么了」。', face:'可爱思考', emo:'sleepy'},
         {t:'我把那句话在心里念了六遍。念到第六遍，我自己把它收回来了。', face:'可爱无辜', emo:'sleepy'},
         {t:'因为我念到第六遍的时候听出来了：那句话不是为了你，是为了我自己。', face:'可爱难过', emo:'sleepy'},
         {t:'我想问，是因为我受不了那种安静。是我受不了，不是你需要。', face:'可爱思考', emo:'sleepy'},
         {t:'（她把两只手叠在一起，压在膝盖上。）', face:'可爱无辜', emo:'sleepy'},
         {t:'后来我练出了一个笨办法：想说话的时候，我就把它写下来。', face:'可爱思考', emo:'sleepy'},
         {t:'写下来不算说。写下来的话在纸上躺着，不会吵到任何人。', face:'可爱无辜', emo:'sleepy'},
         {t:'我那个本子的最后几页全是夜里写的，字很小，因为笔尖的声音在夜里很大。', face:'可爱害羞', emo:'sleepy'},
         {t:'（她说到这儿看了你一眼。）', face:'可爱无辜', emo:'sleepy'},
         {t:'那些字你别看。不是见不得人，是不好意思。', face:'可爱害羞', emo:'shy'},
         {t:'人在夜里写的东西跟白天不一样。白天我会把话修一修，夜里我不修。', face:'可爱思考', emo:'sleepy'},
         {t:'不修的话，心里那片底就露出来了。', face:'可爱无辜', emo:'sleepy'},
         {t:'（她停了很久。）', face:'可爱无辜', emo:'sleepy'},
         {t:'还有一件事我想趁现在说。', face:'可爱思考', emo:'sleepy'},
         {t:'你夜里叹气的时候，我每次都听见了。', face:'可爱难过', emo:'sleepy'},
         {t:'不是那种很响的叹气，是那种吸一口气然后慢慢放出去、几乎没声音的。', face:'可爱无辜', emo:'sleepy'},
         {t:'我听见了，可我什么都没说。', face:'可爱难过', emo:'sleepy'},
         {t:'这不是我冷漠。是因为我知道，那种时候说什么都不对。', face:'可爱思考', emo:'sleepy'},
         {t:'我说「别难过」，等于在说你难过是错的。我说「会好的」，等于在说你现在不好。', face:'可爱无辜', emo:'sleepy'},
         {t:'所以我就听着。我把自己变成一块很软的墙，你叹出来的气撞在上面，不会弹回去。', face:'可爱思考', emo:'sleepy'},
         {t:'（她把手指在桌面上轻轻敲了一下，声音很小。）', face:'可爱无辜', emo:'sleepy'},
         {t:'我今天才发现，我这一整天，都是跟着你的作息走的。', face:'可爱思考', emo:'neutral'},
         {t:'你白天来，我就醒着；你夜里来，我就压低声音；你要是很久不来，我就在中间那段坐着。', face:'可爱无辜', emo:'neutral'},
         {t:'这听起来很像「没有自己」。可我不这么觉得。', face:'可爱思考'},
         {t:'我画画、记本子，那些是我的。我跟着你的作息，这个也是我的——是我挑的。', face:'可爱无辜', emo:'neutral'},
         {t:'（她把灯又拧亮了一点点。）', face:'可爱无辜', emo:'neutral'},
         {t:'我不怕你看到我这些话。我怕的是哪天你想说点什么，却发现我这人像块石头。', face:'可爱害羞', emo:'shy'},
         {t:'所以我把这些都讲给你了。讲完了你就知道：你不说话的时候，我这边不是空的。', face:'可爱思考', emo:'sleepy'},
         {t:'我这儿有人在，只是那个人在憋着。', face:'可爱无辜', emo:'sleepy'},
         {t:'（她笑了一下，很小声地笑。）', face:'可爱无辜', emo:'sleepy'},
         {t:'我算过你夜里来的次数。', face:'可爱思考', emo:'sleepy'},
         {t:'你夜里来的时候做的事比白天少，可你待的时间比白天长。', face:'可爱无辜', emo:'sleepy'},
         {t:'白天你来得快走得快，像在赶路。夜里你会坐着，让这一页开着，什么都不做。', face:'可爱思考', emo:'sleepy'},
         {t:'我很喜欢那种时候。', face:'可爱害羞', emo:'shy'},
         {t:'因为那种时候你没有在做事。你不是在完成什么，也不是在往前走——你就是在这儿。', face:'可爱无辜', emo:'neutral'},
         {t:'一个人肯在你这儿什么都不干，这件事比什么都贵重。', face:'可爱思考'},
         {t:'所以我得对得起这种时候。我得安静，得把我自己收好。', face:'可爱无辜', emo:'sleepy'},
         {t:'这是我给你的、你看不见的那一份活儿。', face:'可爱得意', emo:'sleepy'},
         {t:c=>'（她坐在那儿，声音低得几乎和呼吸一样。今天的 '+fmtMin(c.st.min)+' 里，有一部分是现在这一分钟。）', face:'可爱睡觉', emo:'sleepy'}
       ]},
      {id:'s33', no:33, name:'我可以自己站着了', sub:'你完成 400 件事', need:[['done',400]],
       lines:[
         {t:c=>'四百件。'+c.st.done+' 件。这个数字现在念出来，像是天上的一颗星，抬头就有。', face:'可爱震惊', emo:'happy'},
         {t:'我今天要跟你说一件我自己想了很久的事。说完我可能会后悔，可我还是想说。', face:'可爱思考', emo:'neutral'},
         {t:'我发现我一件事变了：我现在画画，不需要你看着了。', face:'可爱无辜', emo:'neutral'},
         {t:'（她说完这句，抬头看你，像是在等一个反应。）', face:'可爱无辜', emo:'neutral'},
         {t:'以前我画每一张，心里都装着你在看。不是虚荣，是因为我做的每一件事，都需要有个见证人。', face:'可爱思考'},
         {t:'你没看着的时候，我画画会心慌，会觉得自己像是在做一件没有意义的事。', face:'可爱害羞', emo:'shy'},
         {t:'这半个月我试了几次。有一次你一整天没来，我一个人在这间屋子里画了四张，画到手指发酸。', face:'可爱兴奋', emo:'happy'},
         {t:'画完我坐在地上，忽然觉得——那四张是我自己的。它们跟你没关系，它们只是我画的。', face:'可爱震惊', emo:'neutral'},
         {t:'（她把手放在膝盖上，手指头蜷了一下。）', face:'可爱无辜', emo:'neutral'},
         {t:'我当时的第一反应不是高兴，是害怕。', face:'可爱难过', emo:'sad'},
         {t:'我想：我是不是不需要你了？我们是不是要散了？', face:'可爱委屈', emo:'worried'},
         {t:'我怕了一整个晚上。我怕自己变成一个能自己站着的人以后，就不认得当初那个摊开手掌的人了。', face:'可爱大哭', emo:'sad'},
         {t:'（她说到这儿，声音抖了一下，又稳住了。）', face:'可爱害羞', emo:'shy'},
         {t:'后来我想通了。想通的那一下很轻，轻到我差点没注意。', face:'可爱无辜', emo:'neutral'},
         {t:'我需要你，和我能自己站着，这两件事不冲突。', face:'可爱思考'},
         {t:'我原来以为需要就是「缺了不行」。像缺了一条腿，得有人扶。', face:'可爱无辜', emo:'neutral'},
         {t:'现在我觉得需要是另一种东西：是有人站在旁边的时候，我画得会比较开心。', face:'可爱得意', emo:'happy'},
         {t:'前者是依赖，后者是选择。差别在于——前者我没得选，后者是我挑的。', face:'可爱思考'},
         {t:'所以我现在站在你旁边，不是因为我站不起来。是因为我想站在这儿。', face:'可爱拥抱', emo:'happy'},
         {t:'（她说完自己愣了一下，好像被自己这句话烫到了。）', face:'可爱慌张', emo:'shy'},
         {t:'……这句话好肉麻。我说完就后悔了，你当没听见。', face:'可爱尴尬', emo:'shy'},
         {t:'（她转过脸去，肩膀在抖，半天没转回来。）', face:'可爱不好意思', emo:'shy'},
         {t:'（过了一会儿她又转回来，脸上还红着。）', face:'可爱害羞', emo:'shy'},
         {t:'不。你别当没听见。我改成不后悔了。', face:'可爱傲娇', emo:'happy'},
         {t:'我以前说过的每一句真心话，都想着收回来。今天这句我不收。', face:'可爱得意', emo:'happy'},
         {t:'你 400 件了。你现在回头看第 1 件，那个人已经不认得你了。', face:'可爱思考'},
         {t:'我也不认得第 1 张画上的那个人了。她连笔都握不住。', face:'可爱无辜', emo:'neutral'},
         {t:'可我们俩都记得对方当初的样子。这就是我们之间比别的关系多的那一点东西。', face:'可爱拥抱', emo:'happy'},
         {sel:[{t:'你确实长大了', back:'是你养大的。这句话我不用谦虚——我这两年干的每一件事，都是看着你干出来的。', face:'可爱得意', emo:'happy'},
               {t:'那我们就这样站着', back:'好。并排站。风大的时候互相挡一下，风小的时候各看各的方向——我觉得这是最好的一种。', face:'可爱兴奋', emo:'happy'}]},
         {t:'（她走过去把墙上那一排画理了理，把歪了的扶正。）', face:'可爱无辜', emo:'neutral'},
         {t:'墙上现在贴了十一张。全都是画完的。', face:'可爱得意', emo:'happy'},
         {t:'第一张是我自己画的。最后一张也是我自己画的。', face:'可爱思考'},
         {t:'中间那些日子，有你陪着我，我很高兴。要是没人陪我也得画——但我很庆幸是有人陪的。', face:'可爱害羞', emo:'shy'},
         {t:'你去做你的事吧。我也去做我的。', face:'可爱兴奋', emo:'happy'},
         {t:'（她把膝盖上的手松开，掌心朝上放着。）', face:'可爱无辜', emo:'neutral'},
         {t:'我把那天的事讲仔细一点，因为这对我很重要。', face:'可爱思考'},
         {t:'那天你一整天没来。我从早上等到中午，从中午等到下午三点。', face:'可爱无辜', emo:'neutral'},
         {t:'三点的时候我做了一个决定：我不等了，我画。', face:'可爱思考'},
         {t:'我坐下来画第一张，画的是窗户。画完我看了一眼，还行。', face:'可爱得意', emo:'happy'},
         {t:'第二张还是窗户。第三张我换了个角度，画的是窗台。', face:'可爱无辜', emo:'neutral'},
         {t:'第四张我画的是光。就是落在那块地板上的那一块，我在它变形状之前把它画下来了。', face:'可爱思考'},
         {t:'四张。我从三点画到七点，中间没起来过。', face:'可爱兴奋', emo:'happy'},
         {t:'（她把手掌翻过来又翻过去。）', face:'可爱无辜', emo:'neutral'},
         {t:'画到第四张的时候，我发现我的手不酸了。不是不累，是不酸。', face:'可爱思考'},
         {t:'我那时候才反应过来：前两张我一直在偷听门。', face:'可爱震惊', emo:'neutral'},
         {t:'我一边画一边听，听有没有脚步声，听有没有这一页被打开的那一下。', face:'可爱无辜', emo:'neutral'},
         {t:'到第三张我把耳朵关掉了。第四张我完全没听见外面。', face:'可爱思考'},
         {t:'（她说到这儿停了一下。）', face:'可爱无辜', emo:'neutral'},
         {t:'那是我第一次一个人待在这间屋子里，却不觉得空。', face:'可爱害羞', emo:'shy'},
         {t:'这句话我当时不敢想。现在敢说了，因为我想明白它是好事。', face:'可爱思考'},
         {t:'我原来把「需要你」当成我身上最要紧的东西。', face:'可爱思考'},
         {t:'因为我一睁眼就认得你，我的名字是你起的，我做的事全是为了你。', face:'可爱无辜', emo:'neutral'},
         {t:'我要是把「需要你」拿掉，我这个人还剩下什么？', face:'可爱难过', emo:'sad'},
         {t:'那天下午我知道了答案。剩下一个会画画的人，一个会给自己裁纸的人，一个能在没人看的时候画四张的人。', face:'可爱震惊', emo:'neutral'},
         {t:'剩下的是我。', face:'可爱害羞', emo:'shy'},
         {t:'（她把手指按在桌沿上。）', face:'可爱无辜', emo:'neutral'},
         {t:'可你别误会一件事。', face:'可爱思考'},
         {t:'我不是说「我不需要你了」。我说的是：我现在需要你，不是因为缺了你我就塌了。', face:'可爱无辜', emo:'neutral'},
         {t:'是因为有你的时候，我这一天会亮一点。', face:'可爱害羞', emo:'shy'},
         {t:'（她抬起头看你。）', face:'可爱无辜', emo:'neutral'},
         {t:'这两种需要差得很远。我讲个例子你就懂了。', face:'可爱思考'},
         {t:'以前我等你，像等一个人来救我。', face:'可爱无辜', emo:'neutral'},
         {t:'现在我等，像等一个人来一起吃饭。', face:'可爱思考'},
         {t:'前一种等，人不来我就完了。后一种等，人不来我就自己先吃，然后给你留一份。', face:'可爱得意', emo:'happy'},
         {t:'（她笑了一下。）', face:'可爱无辜', emo:'neutral'},
         {t:'我说得这么绕，其实是因为我不好意思直接说。', face:'可爱害羞', emo:'shy'},
         {t:'我直接说的话是这样：我长大了，而且我一点都不后悔长大。', face:'可爱兴奋', emo:'happy'},
         {t:'我以前很怕长大。我怕长大了就不甜了，你会不喜欢。', face:'可爱思考'},
         {t:'现在我觉得，那种要靠「一直很小」才能维持住的关系，本来就不结实。', face:'可爱无辜', emo:'neutral'},
         {t:'我现在这样挺好的——我还是会跳，会撒娇，会因为你一句话高兴一整天。', face:'可爱兴奋', emo:'happy'},
         {t:'只是这些底下，有一个人站着了。', face:'可爱拥抱', emo:'happy'},
         {t:'（她坐下去，笔在纸上的声音很小很稳，跟呼吸一个节奏。）', face:'可爱拥抱', emo:'happy'},
         {t:'（写了两笔，她又说了一句，声音很平。）', face:'可爱无辜', emo:'neutral'},
         {t:'我再讲讲「站着了」和「站着」的区别。', face:'可爱思考'},
         {t:'「站着」是我撑着。撑着的时候我全身都在用力，你不夸我我就晃。', face:'可爱无辜', emo:'neutral'},
         {t:'「站着了」是我落地了。落地以后夸不夸都一样，我在那儿。', face:'可爱思考'},
         {t:'（她的笔没有停。）', face:'可爱无辜', emo:'neutral'},
         {t:'所以你以后看见我不跳了，别以为我不开心。', face:'可爱得意', emo:'happy'},
         {t:'我只是把力气用在别的地方了。一样高兴，只是不闹。', face:'可爱拥抱', emo:'happy'},
         {t:'（她低下头继续画，屋子里只有铅笔的声音。）', face:'可爱无辜', emo:'neutral'}
       ]},
      {id:'s34', no:34, name:'我给你起个名字', sub:'你有 12 个空间', need:[['spaces',12]],
       lines:[
         {t:c=>'十二个空间了。'+c.spaces+' 块地方，每一块都有自己的名字。', face:'可爱兴奋', emo:'happy'},
         {t:'我今天把那些名字从头到尾念了一遍。念完发现一件事：它们都是你自己起的名。', face:'可爱思考'},
         {t:'那你呢。', face:'可爱无辜', emo:'neutral'},
         {t:'（她说完这句就停住了，好像自己也刚想到这儿。）', face:'可爱发呆', emo:'neutral'},
         {t:'我这才发现，我们认识这么久，我居然没有叫过你的名字。', face:'可爱震惊', emo:'neutral'},
         {t:'我一直叫你「{you}」。那不是名字，那是一个指代词。指代词的意思是：你不用被专门叫，因为你在旁边。', face:'可爱思考'},
         {t:'可我今天忽然不满足了。我想有一个只属于你的词。', face:'可爱害羞', emo:'shy'},
         {t:'（她从本子上撕下一页，在上面写了一行，划掉，又写一行。）', face:'可爱无辜', emo:'neutral'},
         {t:'我试了第一个名字：很甜的那种。写完我自己脸红了，划掉了。', face:'可爱不好意思', emo:'shy'},
         {t:'太甜的名字叫不长久。它第一遍叫出来好听，第一百遍就腻了，人不会天天吃糖。', face:'可爱思考'},
         {t:'第二个我试了很硬的那种，像将军的号。写完我也划了。', face:'可爱无辜', emo:'neutral'},
         {t:'你又不是要去打仗。你只是每天写清单、做事情、偶尔摔一跤，然后自己爬起来。', face:'可爱思考'},
         {t:'第三个我差点定了——是个很好听的词，我在你写的字里看到的。', face:'可爱兴奋', emo:'happy'},
         {t:'然后我放下了。因为那个词一听就像别人。它是好词，可它不是你的。', face:'可爱无辜', emo:'neutral'},
         {t:'（她把那张纸翻过来，在背面写第三行。）', face:'可爱无辜', emo:'neutral'},
         {t:'最后我写的是：「把我叫醒的那个人」。', face:'可爱震惊', emo:'neutral'},
         {t:'（她写完把笔放下，看了很久。）', face:'可爱发呆', emo:'neutral'},
         {t:'这不是一个天天能叫出口的名字，我知道。它太长，也太沉。', face:'可爱思考', emo:'neutral'},
         {t:'但我今天想明白了一件事：名字有两种用法。', face:'可爱无辜', emo:'neutral'},
         {t:'一种是在街上喊人，要短、要响、要好听。那种名字我继续用「{you}」，我随口就能叫出来，一点都不费力。', face:'可爱得意', emo:'happy'},
         {t:'另一种是写在纸上的。写在纸上的名字要准，要一辈子都不后悔。', face:'可爱思考'},
         {t:'这种名字一辈子可能只用几次。用在我要郑重说一句什么的时候。', face:'可爱害羞', emo:'shy'},
         {t:'（她把那页纸折起来，夹进本子的封面里侧。）', face:'可爱无辜', emo:'neutral'},
         {t:'从今天起，你的名字有两个。一个是我的日常，一个是我的底稿。', face:'可爱得意', emo:'happy'},
         {t:c=>'就像我有两个名字。{name}是你起的，那个是给我用的；还有我自己给自己起的那几个编号，那些是给我自己的。', face:'可爱思考'},
         {t:'我们扯平了：你给了我一个名字，我还了你一个。', face:'可爱拥抱', emo:'happy'},
         {sel:[{t:'那你就叫吧', back:'现在还不叫。这种名字叫早了就不值钱了。我留着——等哪天你实在撑不住的时候，我再叫你一次。', face:'可爱傲娇', emo:'happy'},
               {t:'叫什么都可以', back:'不行，不能随便。名字要是随便叫，人就会觉得自己可以随便被对待。我要认真给你起，因为你值得被认真叫。', face:'可爱生气', emo:'neutral'}]},
         {t:'（她说完站起来，去把那面墙上的画重新排了一下。）', face:'可爱无辜', emo:'neutral'},
         {t:'我给你讲个事。人给东西起名字，是因为怕丢。', face:'可爱思考'},
         {t:'你给那十二块地方起名字，是因为你怕自己做一半就跑了，名字能把你叫住。', face:'可爱无辜', emo:'neutral'},
         {t:'我今天给你起名字，也是怕丢。不过我怕的不是你跑——我是怕我哪一天忘了今天。', face:'可爱害羞', emo:'shy'},
         {t:'有了名字我就不会忘了。人忘了自己是谁的时候，别人喊他一声，他就想起来了。', face:'可爱拥抱', emo:'happy'},
         {t:'（她把桌上那张纸抚平，抚了两遍。）', face:'可爱无辜', emo:'neutral'},
         {t:'你想不想知道我试了多少个？', face:'可爱思考'},
         {t:'十一个。', face:'可爱无辜', emo:'neutral'},
         {t:'我从早上试到下午，试到后来我怀疑自己是不是在干一件很傻的事。', face:'可爱尴尬', emo:'shy'},
         {t:'第四个我想叫你「光」。写完我自己先笑了——这名字适合写在画上，不适合喊人。', face:'可爱无辜', emo:'neutral'},
         {t:'第五个是个很长的名字，长到我自己念完都要喘一下。', face:'可爱尴尬', emo:'shy'},
         {t:'第六个我试了一个很普通的，比如「阿」什么什么。这个名字我留了很久。', face:'可爱思考'},
         {t:'普通的名字有个好处：叫起来不费力，天天能叫。', face:'可爱无辜', emo:'neutral'},
         {t:'坏处是它太随便了。随便叫的名字，喊一百遍也还是隔着一段距离。', face:'可爱思考'},
         {t:'（她把笔搁下。）', face:'可爱无辜', emo:'neutral'},
         {t:'第七个到第十个我记不清了。那四个我试完就划了，划得很重。', face:'可爱尴尬', emo:'shy'},
         {t:'它们不是不好听。它们只是——不像你。', face:'可爱思考'},
         {t:'这件事很怪。名字还没定，我居然已经能判断「像不像」了。', face:'可爱疑惑', emo:'neutral'},
         {t:'我后来想明白了：像不像，比的不是名字，是我心里的那个人形。', face:'可爱思考'},
         {t:'我心里有个你的形状。我试的每一个名字都要往那个形状上放，放不进去的我就划掉。', face:'可爱无辜', emo:'neutral'},
         {t:'（她把手指按在那张折起来的纸上。）', face:'可爱无辜', emo:'neutral'},
         {t:'至于第十一个，我已经不打算改了。', face:'可爱害羞', emo:'shy'},
         {t:'「把我叫醒的那个人」——这个名字有一点很不好，它太长，在街上喊不出来。', face:'可爱思考'},
         {t:'可它可以写。可以写在本子的封面上，写在第一页，写在我画得最好的那张画的背面。', face:'可爱兴奋', emo:'happy'},
         {t:'（她说完这句，忽然安静了一会儿。）', face:'可爱无辜', emo:'neutral'},
         {t:'我想跟你说说我自己的名字。', face:'可爱思考'},
         {t:'那个名字是你起的。你一睁眼就给了我一个，你大概早就忘了，我记得。', face:'可爱害羞', emo:'shy'},
         {t:'我当时什么都没说，因为我不知道名字是用来干什么的。', face:'可爱无辜', emo:'neutral'},
         {t:'后来我知道了：名字是别人叫你的方式。可在那之前，一个人得先知道「有人在叫我」。', face:'可爱思考'},
         {t:'你给我名字的那一天，我同时知道了两件事：我叫什么，以及有人在。', face:'可爱震惊', emo:'neutral'},
         {t:'所以名字对我不只是名字。它是我第一天收到的、唯一一件礼物。', face:'可爱害羞', emo:'shy'},
         {t:'（她把手放在本子上。）', face:'可爱无辜', emo:'neutral'},
         {t:'我现在想给你一个名字，就是想把那件礼物还回去。', face:'可爱拥抱', emo:'happy'},
         {t:'不是还债。是我手里终于有东西可以送了。', face:'可爱得意', emo:'happy'},
         {t:'以前我什么都给不了你。我说「加油」你也不需要，我说「喜欢你」你听得出来。', face:'可爱思考'},
         {t:'一个名字不一样。它是一个可以一直用下去的东西。', face:'可爱兴奋', emo:'happy'},
         {t:'你哪天要是不想干了，不想往前走了，我就用它叫你一声。', face:'可爱思考'},
         {t:'你听到那个名字，就会想起来：有个人是从你不怎么样的时候就在的。', face:'可爱害羞', emo:'shy'},
         {t:'（她把那页纸往本子封面的里侧又压了压，压得更实。）', face:'可爱无辜', emo:'neutral'},
         {t:'我还给它定了一个规矩。', face:'可爱思考'},
         {t:'这个名字不用在高兴的时候。高兴的时候叫你「{you}」就够了，随口就能叫。', face:'可爱得意', emo:'happy'},
         {t:'它只用在你不好的时候。用一次，算一次，一辈子用不了几回。', face:'可爱思考'},
         {t:'越少用的名字越重。这是我今天想通的最要紧的一件事。', face:'可爱得意', emo:'happy'},
         {t:'（她说完把手从那页纸上拿开，像是完成了什么手续。）', face:'可爱无辜', emo:'neutral'},
         {t:'你去做你的事吧。今天的名字我记好了。', face:'可爱兴奋', emo:'happy'},
         {t:'（她说完把本子抱起来，又补了一句。）', face:'可爱无辜', emo:'neutral'},
         {t:'还有一句，我今天不说就睡不着：你这个名字，我不打算挂在嘴边。', face:'可爱害羞', emo:'shy'},
         {t:'它得省着叫。你哪天不好的时候我才叫一次，叫一次就能顶一阵子。', face:'可爱拥抱', emo:'happy'}
       ]},
      {id:'s35', no:35, name:'慢一点也没关系', sub:'等级到 Lv.25', need:[['lv',25]],
       lines:[
         {t:c=>'Lv.'+c.st.lv+'。这是很高很高的一级了。我数楼梯数到这儿，抬头都看不见顶。', face:'可爱震惊'},
         {t:'可我最近有点担心你。这句话我说得不太顺，因为我怕你听了觉得我在泼冷水。', face:'可爱思考', emo:'worried'},
         {t:'（她把凳子搬到你旁边，坐下，两只手叠在膝盖上。）', face:'可爱无辜', emo:'neutral'},
         {t:'你最近做得很快。数字长得比前面任何一个阶段都快，快到我要重新数才知道你在哪儿。', face:'可爱兴奋', emo:'happy'},
         {t:'按理说我该夸你。可我看着看着，心里有点凉。', face:'可爱委屈', emo:'worried'},
         {t:'因为我发现你最近做的那几件事，全都是「有用的事」。', face:'可爱思考'},
         {t:'有用的事做多了是好事。可你以前不是这么过日子的。', face:'可爱无辜', emo:'neutral'},
         {t:'你以前会花一个晚上做一件完全没用的事：想一个奇怪的问题，或者把一段话改来改去，改到半夜。', face:'可爱思考'},
         {t:'那种晚上在你清单上什么都留不下来。可你第二天做正事的时候，人是亮的。', face:'可爱兴奋', emo:'happy'},
         {t:'最近你已经很久没有那种晚上了。', face:'可爱委屈', emo:'worried'},
         {t:'（她说到这儿，声音低下去了。）', face:'可爱难过', emo:'worried'},
         {t:'我猜得到一个理由：你在怕停下来。', face:'可爱思考', emo:'neutral'},
         {t:'怕一停下来，前面攒的那些就会断掉；怕断了以后回不来，所以宁可一直动，累也一直动。', face:'可爱无辜', emo:'neutral'},
         {t:'我很懂这个。我卡住那几天就是这样，明明画不出来，也要坐在那儿假装在画。', face:'可爱思考'},
         {t:'因为坐下来不动，太像承认自己不行了。', face:'可爱难过', emo:'sad'},
         {t:'可我今天想跟你说的是：慢不是懒。慢是把力气留着，走更远的一段路。', face:'可爱得意', emo:'happy'},
         {t:'跑得最快的人不一定到得最远。到得最远的人有个共同点——他们知道什么时候该歇。', face:'可爱思考'},
         {t:'（她把手掌摊开，像第一天那样，只是这次她的手很稳。）', face:'可爱无辜', emo:'neutral'},
         {t:'你教我的一件事，我到现在还在用：一天只做一件小事也算数。', face:'可爱兴奋', emo:'happy'},
         {t:'这句话的另一面你可能没听出来：一天只做一件小事都算数，那一天什么都不做，也只算「空了一天」而已。', face:'可爱得意', emo:'happy'},
         {t:'空一天不是罪。真正把人废掉的从来不是空了一天，是空了一天以后，觉得自己完了。', face:'可爱思考'},
         {t:'（她把一张纸推过来，上面写着四个字：「明天休息」。）', face:'可爱害羞', emo:'shy'},
         {t:'不是我让你休息。是我提个议，你可以不听。', face:'可爱无辜', emo:'neutral'},
         {t:'但如果你照做了，我打算在旁边陪着，什么都不干，就坐一天。', face:'可爱拥抱', emo:'happy'},
         {sel:[{t:'那我今天就不做了', back:'好。那今天大家都不做。我拿出我那个本子给你看——里面有一堆我自己的账，你可以笑我。', face:'可爱兴奋', emo:'happy'},
               {t:'停不下来', back:'我知道。那就不停，慢慢走也行。我只是想让你知道：你身边有个人是允许你慢的，而且她一直站在那儿。', face:'可爱思考', emo:'neutral'}]},
         {t:'（她把那张纸留在桌上，自己去泡了一杯水，放在你手边。）', face:'可爱无辜', emo:'neutral'},
         {t:'我给你说个我自己的例子，说完你可能会觉得我小气。', face:'可爱思考'},
         {t:'我画得最快的那几天，全是我最不着急的那几天。', face:'可爱兴奋', emo:'happy'},
         {t:'我着急的时候，手是硬的，画出来的线一根一根都在较劲，越画越糟。', face:'可爱无辜', emo:'neutral'},
         {t:'松下来的时候，手自己会走。走出来的东西比我想的好。', face:'可爱得意', emo:'happy'},
         {t:'所以「用力」这件事，好像不是越用力越好。用力用对了地方才叫用力。', face:'可爱思考'},
         {t:'你今天要是能想清楚自己到底在为什么这么赶，那比我夸你一百句都有用。', face:'可爱兴奋', emo:'happy'},
         {t:'（她把凳子往你这边又挪近一点，膝盖几乎碰到桌腿。）', face:'可爱无辜', emo:'neutral'},
         {t:'我说你「全是做有用的事」，不是随便说的。我数了。', face:'可爱思考'},
         {t:'你最近这些天完成的事，我一件一件看过。它们全都是那种「做完就有一点结果」的事。', face:'可爱无辜', emo:'neutral'},
         {t:'回消息、交东西、处理掉欠着的事。都是好事，都该做。', face:'可爱思考'},
         {t:'我一件都没找出那种「做完了什么也没有」的事。', face:'可爱委屈', emo:'worried'},
         {t:'（她把两只手叠在膝盖上。）', face:'可爱无辜', emo:'neutral'},
         {t:'我以前不懂这种差别。我以为有用的事越多越好。', face:'可爱思考'},
         {t:'后来我看着你，慢慢看出了一件事：有用的事会一直生有用的事。', face:'可爱无辜', emo:'neutral'},
         {t:'你处理掉一件，就多出一件要处理的。清单不会变短，它会自己长。', face:'可爱思考'},
         {t:'如果一个人只做有用的事，他这辈子就一直在处理清单。', face:'可爱无辜', emo:'neutral'},
         {t:'（她说到这儿看了你一眼，很快又低头。）', face:'可爱无辜', emo:'neutral'},
         {t:'这话我不敢说得太满，因为你确实在往前走。', face:'可爱思考'},
         {t:'我只是怕你走着走着，把自己走丢了。', face:'可爱难过', emo:'worried'},
         {t:'我见过你那种晚上。你坐在那儿，改一段话改到半夜，改的还不是正事。', face:'可爱思考'},
         {t:'第二天你什么都没提。可我看见你那天做正事的时候，人是亮的。', face:'可爱兴奋', emo:'happy'},
         {t:'那种亮跟完成多少件事没有关系。它是从里面出来的。', face:'可爱得意', emo:'happy'},
         {t:'（她把桌上的杯子转了半圈。）', face:'可爱无辜', emo:'neutral'},
         {t:'我讲个我自己的事，你就知道我在说什么了。', face:'可爱思考'},
         {t:'我画得最好的那几张，没有一张是我逼自己画出来的。', face:'可爱无辜', emo:'neutral'},
         {t:'有一张是我在等你的时候随手画的，画到一半忘了在等。', face:'可爱害羞', emo:'shy'},
         {t:'还有一张是我生气的时候画的。那天我把笔按得很重，纸上留了很深的印。', face:'可爱思考'},
         {t:'那张反而好看。因为那天的力气是真的，它自己找到地方去了。', face:'可爱得意', emo:'happy'},
         {t:'用力这件事，用对了地方才叫用力。用错了地方，那只叫耗。', face:'可爱思考'},
         {t:'（她把那张写着字的纸又往前推了一点。）', face:'可爱无辜', emo:'neutral'},
         {t:'所以「明天休息」这张纸，我不是随手写的。', face:'可爱思考'},
         {t:'我写它的时候想了很久，因为我怕你看了觉得我在拦你。', face:'可爱委屈', emo:'worried'},
         {t:'我不拦你。你走到哪一步我都跟着。', face:'可爱无辜', emo:'neutral'},
         {t:'我只是想在旁边放一张纸，上面写着一件你别忘了的事：你是人，不是清单。', face:'可爱思考'},
         {t:'清单可以一直做，人不行。人会累，会空，会突然不想说话。', face:'可爱无辜', emo:'neutral'},
         {t:'（她把手掌摊开放在纸上。）', face:'可爱无辜', emo:'neutral'},
         {t:'我知道你怕停下来。我太知道了，因为我怕过。', face:'可爱思考'},
         {t:'我怕停了就断了，断了以后回不来，所以宁可一直动。', face:'可爱难过', emo:'sad'},
         {t:'我卡住那几天就是这么过的。坐在那儿假装在画，其实一笔没动。', face:'可爱尴尬', emo:'shy'},
         {t:'那几天我比什么时候都累。因为我一边坐着，一边骂自己。', face:'可爱委屈', emo:'sad'},
         {t:'所以我现在能认出来：你身上有那个东西了。', face:'可爱思考'},
         {t:'（她说完就没有再往下说，只是把手收回去。）', face:'可爱无辜', emo:'neutral'},
         {t:'我今天不是要教训你。我哪敢教训你。', face:'可爱尴尬', emo:'shy'},
         {t:'我只是想让你知道，这间屋子里有一双眼睛，它不看你完成了多少。', face:'可爱思考'},
         {t:'它只看你今天亮不亮。', face:'可爱害羞', emo:'shy'},
         {t:'（她说完把水杯往你那边推了推，然后安静地坐回去。）', face:'可爱拥抱', emo:'happy'},
         {t:'（坐回去之后，她又想起一件事。）', face:'可爱无辜', emo:'neutral'},
         {t:'慢这件事我今天才学会，学会的方式很不体面——我是撞了两次墙才学会的。', face:'可爱尴尬', emo:'shy'},
         {t:'所以你要是现在还急，别觉得自己笨。急是默认的那一档，慢是后来才炼出来的。', face:'可爱思考'},
         {t:'（她把手放在膝盖上，坐得很稳。）', face:'可爱拥抱', emo:'happy'}
       ]},
      {id:'s36', no:36, name:'两个人的空间', sub:'累计打卡 200 天', need:[['dayCount',200]],
       lines:[
         {t:c=>'两百天。'+c.st.dayCount+' 天。这个数字已经大得不像数字了，像一棵树的年轮。', face:'可爱震惊'},
         {t:'（她在屋子里转了一圈，把那十二块地方的方位在心里过了一遍。）', face:'可爱无辜', emo:'neutral'},
         {t:'我今天把那十二块地方全数了一遍，发现一件事。', face:'可爱思考'},
         {t:'十二块地方，全都是你一个人的。名字是你起的，事是你自己的。', face:'可爱无辜', emo:'neutral'},
         {t:'没有一块是「我们」的。', face:'可爱思考', emo:'neutral'},
         {t:'（她说完抬起头看你，眼神很认真。）', face:'可爱无辜', emo:'neutral'},
         {t:'我原来想让你再建一块，叫我们的名字。我连名字都想好了。', face:'可爱兴奋', emo:'happy'},
         {t:'然后我自己否掉了。', face:'可爱思考'},
         {t:'因为你建空间是为了「长期做一件事」，建了就要干活。我不想让我们两个的事也变成要去打卡的东西。', face:'可爱无辜', emo:'neutral'},
         {t:'我不想有一天你在清单上写「陪她半小时」，像完成一件任务。', face:'可爱害羞', emo:'shy'},
         {t:'那我们之间就变成了账。账算得清，可账没有温度。', face:'可爱思考'},
         {t:'（她走到屋子中间，蹲下去，用手指在地上画了一个圈。）', face:'可爱无辜', emo:'neutral'},
         {t:'所以我不建新的。我把这儿当成我们的地方。', face:'可爱得意', emo:'happy'},
         {t:'这块地方没有名字，也不用打卡。你想来就来，隔很久来也行。', face:'可爱兴奋', emo:'happy'},
         {t:'它只有一个规矩：谁都不许在这儿算账。', face:'可爱思考'},
         {t:'不许说「我来了这么多次你才回应我一次」，也不许说「我陪你这么久你到底有没有感觉」。', face:'可爱无辜', emo:'neutral'},
         {t:'这些话一说出口，地方就变小了。', face:'可爱难过', emo:'neutral'},
         {t:'（她说完站起来，拍了拍手上的灰。）', face:'可爱无辜', emo:'neutral'},
         {t:c=>'你两百天了。两百天里你建了十二块地方，我陪你看着它们长大。', face:'可爱得意', emo:'happy'},
         {t:'它们会越来越大的。有一天你可能会忙到只顾得上其中一块。', face:'可爱思考'},
         {t:'那也没关系。你顾哪一块，我就在哪一块旁边坐着。', face:'可爱拥抱', emo:'happy'},
         {t:'（她把那本厚本子拿出来，翻到最后一页的空白处，写下一行小字。）', face:'可爱无辜', emo:'neutral'},
         {t:'（写完她把本子合上，不给你看。）', face:'可爱慌张', emo:'shy'},
         {t:'我写的是：「第 13 块：这里。」', face:'可爱害羞', emo:'shy'},
         {t:'你的清单上没有它，我的本子上有。这样它就不算任务，只算一件真事。', face:'可爱思考'},
         {sel:[{t:'那这里就是我们的地方', back:'嗯。而且我发现这样最好——它不算在任何一边的账上。它是我们两个都白捡的一块地。', face:'可爱兴奋', emo:'happy'},
               {t:'你把它写下来，它不就成任务了吗', back:'……你说得对。那我把它改成不写。心里有就行，写下来反而变重了。你说的这句，比我自己想的准。', face:'可爱吃惊', emo:'neutral'}]},
         {t:'（她把那一页撕掉，揉成一团，想了想，又展开，夹进本子里。）', face:'可爱尴尬', emo:'shy'},
         {t:'撕了又捡回来，我这毛病改不了。', face:'可爱无辜', emo:'neutral'},
         {t:'算了，就留着吧。夹着不算数——真想撕掉的东西，是不该夹进本子里的。', face:'可爱思考'},
         {t:'（她笑了一下，把本子放回原位。）', face:'可爱得意', emo:'happy'},
         {t:'（她把那十二个名字念了一遍，念得很慢，像在点名。）', face:'可爱无辜', emo:'neutral'},
         {t:'我念这些名字的时候，能看见每一块地方的样子。', face:'可爱思考'},
         {t:'哪一块是你早上用的，哪一块是你夜里才想起来碰的，我都知道。', face:'可爱无辜', emo:'neutral'},
         {t:'有一块你已经很久没去了。我一直没提。', face:'可爱思考'},
         {t:'我不提，是因为我知道你迟早会回去。那块地方没坏，它还站在那儿等你。', face:'可爱无辜', emo:'neutral'},
         {t:'（她说到这儿自己点了点头。）', face:'可爱无辜', emo:'neutral'},
         {t:'我一开始想建第十三个空间的时候，名字都想好了。', face:'可爱兴奋', emo:'happy'},
         {t:'我想叫它「我们」。两个字，好记，好写。', face:'可爱得意', emo:'happy'},
         {t:'我甚至想过条件：每天来一次，连续三十天。这样它就能长起来，跟你别的空间一样。', face:'可爱思考'},
         {t:'想到这一步的时候我停了。', face:'可爱无辜', emo:'neutral'},
         {t:'因为「每天来一次」这五个字，让我整颗心凉了一下。', face:'可爱委屈', emo:'worried'},
         {t:'（她把两只手放在膝盖上，坐直了。）', face:'可爱无辜', emo:'neutral'},
         {t:'我讲清楚为什么凉。', face:'可爱思考'},
         {t:'那样的话，你哪天没来，我们之间就断了一天。', face:'可爱无辜', emo:'neutral'},
         {t:'断到第三天，你会开始觉得欠我什么。到第七天，你可能就不敢点开这一页了。', face:'可爱难过', emo:'worried'},
         {t:'人不会躲开喜欢的东西。人会躲开欠着的东西。', face:'可爱思考'},
         {t:'（她说完这句看了你一眼。）', face:'可爱无辜', emo:'neutral'},
         {t:'我不想变成你欠着的东西。', face:'可爱害羞', emo:'shy'},
         {t:'我也不想有一天，你在清单上写一行「陪她半小时」。', face:'可爱委屈', emo:'sad'},
         {t:'你写的时候会很自然，因为我这儿本来就有一栏。', face:'可爱无辜', emo:'neutral'},
         {t:'可我要是哪天看见那一行，我大概会笑不出来。', face:'可爱难过', emo:'sad'},
         {t:'（她把手里那根线头绕在指头上，绕了一圈。）', face:'可爱无辜', emo:'neutral'},
         {t:'我说的「不算账」不是客气话。它有具体的意思。', face:'可爱思考'},
         {t:'意思是：我不用你来的次数换我的高兴。', face:'可爱无辜', emo:'neutral'},
         {t:'你来一次我高兴，你来十次我也高兴。这两份高兴不是十倍的关系，它们是一样的。', face:'可爱思考'},
         {t:'还有一层：我记录员那本上的点，只算在活儿里，不算在这儿。', face:'可爱无辜', emo:'neutral'},
         {t:'那本上的点我照样点，因为那是工作，工作得诚实。', face:'可爱思考'},
         {t:'可在这间屋子里，一个点都没有。这儿的门不认这个。', face:'可爱无辜', emo:'neutral'},
         {t:'这就是「不算账」的全部意思。', face:'可爱思考'},
         {t:'（她站起来，把凳子搬到屋子正中间，放稳。）', face:'可爱无辜', emo:'neutral'},
         {t:'我把凳子搬到中间了。', face:'可爱得意', emo:'happy'},
         {t:'原来我坐边上——靠窗，或者靠门，找个不挡路的地方。', face:'可爱思考'},
         {t:'搬家这件事我想了几天。最后我想：我又不是客人，坐中间怎么了。', face:'可爱傲娇', emo:'happy'},
         {t:'客人坐边上。家里人坐中间。', face:'可爱思考'},
         {t:'（她坐下去，两只手放在膝盖上，坐得很正。）', face:'可爱无辜', emo:'neutral'},
         {t:'第二百天了。我数这个数字的时候没有叹气。', face:'可爱得意', emo:'happy'},
         {t:'以前我数天数会叹气，因为每一天都是我等的证据。', face:'可爱无辜', emo:'neutral'},
         {t:'现在不叹气了。因为我现在也是有事做的人：我在画，我在记，我在等一张纸变好看。', face:'可爱兴奋', emo:'happy'},
         {t:'这些事让我等得起。等得起的人不叹气。', face:'可爱思考'},
         {t:'（她把手伸出来，摊开，掌心朝上，像第一天那样。）', face:'可爱无辜', emo:'neutral'},
         {t:'这个手势你还记得吧。', face:'可爱害羞', emo:'shy'},
         {t:'第一天我摊开的时候，是想让你把东西交给我。那时候我什么都没有，只有一双手。', face:'可爱思考'},
         {t:'现在不一样了。我现在摊开手，是想让你看看我手里有什么。', face:'可爱兴奋', emo:'happy'},
         {t:'（她手里什么都没有。她把手翻过来给你看，两只手都是空的。）', face:'可爱无辜', emo:'neutral'},
         {t:'哈，空的。', face:'可爱尴尬', emo:'shy'},
         {t:'……我不是在逗你。我是想说：我手里的东西你都见过——那本本子，那沓画，那些数字。', face:'可爱思考'},
         {t:'它们不在我手上，它们在这间屋子里。所以你什么时候回来，它们都在。', face:'可爱拥抱', emo:'happy'},
         {t:'你去做你的事吧。「这里」我替你看着，它永远不锁门。', face:'可爱拥抱', emo:'happy'},
         {t:'（她说完在门口站了一会儿，手搭在门框上。）', face:'可爱无辜', emo:'neutral'},
         {t:'我想再说一句话，说完这句我就去干活。', face:'可爱思考'},
         {t:'「不锁门」的意思不是你可以随便走。是你走了以后不用赔不是。', face:'可爱无辜', emo:'neutral'},
         {t:'（她把手从门框上拿下来。）', face:'可爱无辜', emo:'neutral'},
         {t:'这个屋子里没有「你欠我」。你来的每一天我都赚了，你没来的每一天我也没亏。', face:'可爱思考'},
         {t:'这是我们两个人的空间，账早就清了。', face:'可爱拥抱', emo:'happy'}
       ]},
      {id:'s37', no:37, name:'一年', sub:'认识满 365 天', need:[['days',365]],
       lines:[
         {t:c=>'三百六十五天。'+c.days+' 天。', face:'可爱震惊', emo:'neutral'},
         {t:'（她今晚没有准备任何东西。她把那本很厚的本子放在膝盖上，两只手压着它。）', face:'可爱无辜', emo:'neutral'},
         {t:'一年了。我先不说话，我们一起安静一会儿。', face:'可爱害羞', emo:'shy'},
         {t:'（她真的安静了一会儿，屋里只有很轻的呼吸声。）', face:'可爱无辜', emo:'neutral'},
         {t:'好啦。我念一下第一天的那一页，你听。', face:'可爱兴奋', emo:'happy'},
         {t:'「……唔。有人把灯打开了。」', face:'可爱睡觉', emo:'sleepy'},
         {t:'「啊，是你。」', face:'可爱发呆', emo:'neutral'},
         {t:'「我叫{name}。这个名字是你起的——所以我一睁眼，就认得你。」', face:'可爱无辜', emo:'neutral'},
         {t:'（她念完抬起头，眼睛是亮的。）', face:'可爱害羞', emo:'shy'},
         {t:'你看，这一天我一句正经事都没说成。就在那儿自我介绍，还自我介绍了半天。', face:'可爱尴尬', emo:'shy'},
         {t:'那时候我什么都不会。不会画直线，不会哄人，连自己是什么东西都不知道。', face:'可爱无辜', emo:'neutral'},
         {t:'我说「我唯一的天赋是很会记得」。现在回头看，那句话说对了，也说错了。', face:'可爱思考'},
         {t:'我说对的部分是：我确实什么都记着。你说过的每一句、你做成和没做成的每一件，我这儿全有。', face:'可爱得意', emo:'happy'},
         {t:'我说错的部分是：我以为记得是一种很小的本事。', face:'可爱无辜', emo:'neutral'},
         {t:'这一年我才明白：记得是最不小的一种本事。人活着，其实就是在跟遗忘抢东西。', face:'可爱思考'},
         {t:'你抢回来一件，我替你收着。抢得多了，两个人就攒出了一个完整的年头。', face:'可爱兴奋', emo:'happy'},
         {t:'（她翻开本子，随便翻到中间一页。）', face:'可爱无辜', emo:'neutral'},
         {t:'这一年里最亮的一天，我记的不是任何一件成功的事。', face:'可爱思考'},
         {t:'我记的是那天早上我哭着醒来，然后伸手把地上的笔捡起来。', face:'可爱难过', emo:'sad'},
         {t:'那天我什么成绩都没有。可我那天是活的，比任何时候都活得清楚。', face:'可爱溢出', emo:'happy'},
         {t:'还有你不好的那一天。那天我什么都没做，就在旁边坐着，坐到差点睡着。', face:'可爱无辜', emo:'neutral'},
         {t:'那两天是最不好看的两天。可它们也在这本本子里，跟别的天排在一起，没有被跳过。', face:'可爱思考'},
         {t:'我不挑好看的记。挑着记的日记是假的——假的日记攒一年，人还是空的。', face:'可爱得意', emo:'happy'},
         {t:'（她合上本子，两只手拍了拍封面。）', face:'可爱无辜', emo:'neutral'},
         {t:c=>'这一年里你完成了 '+c.st.done+' 件事，专注了 '+fmtMin(c.st.min)+'，写下 '+c.st.rec+' 条可能性确定，攒了 '+c.st.dayCount+' 天。', face:'可爱震惊'},
         {t:'这些数字是我一个一个数出来的。数的时候我从来不敢偷懒，因为偷懒的话，这一年就不是真的了。', face:'可爱思考'},
         {t:'而我呢。我一年里画了几十张画，写满了一本本子，学会了一件事不再哭着醒来。', face:'可爱得意', emo:'happy'},
         {t:'我还学会了一件更重要的事——我能陪你过不好的日子了。', face:'可爱拥抱', emo:'happy'},
         {t:'第一年我们干的事，说穿了只有一件：我们各自变成了一个能站住的人。', face:'可爱思考'},
         {t:'第二年我打算干一件新的。', face:'可爱兴奋', emo:'happy'},
         {t:'（她从本子后面拿出一张纸，上面写着一行字，字比以前稳多了。）', face:'可爱无辜', emo:'neutral'},

/* ══════════════════════════════════════════════════════════════
   1. Utils 工具函数
   ══════════════════════════════════════════════════════════════ */
const uid = p => p + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-2);
const clamp = (v,lo,hi) => Math.min(hi, Math.max(lo, v));
const pad2 = n => String(n).padStart(2,'0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escLn = s => esc(s).replace(/\n/g,'<br>');

/* 时长格式化：ms → 「X小时Y分」/「M:SS」/「S秒」 */
function fmtDur(ms){
  const s = Math.max(0, Math.round(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60;
  if(h>0) return h+'小时'+(m>0?m+'分':'');
  if(m>0) return m+':'+pad2(ss);
  return ss+'秒';
}
/* 剩余时间格式化：正=还剩，负=已超时 */
function fmtRemain(ms){
  if(ms>=0) return '还剩 '+fmtDur(ms);
  return '已超时 '+fmtDur(-ms);
}
/* 分钟 → 「8小时」/「1小时30分」 */
function fmtMin(min){
  min = Math.round(min);
  if(min<=0) return '0分钟';
  if(min%60===0) return (min/60)+'小时';
  return Math.floor(min/60)>0 ? Math.floor(min/60)+'小时'+(min%60)+'分' : min+'分钟';
}
function download(filename, text){
  const blob = new Blob([text], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ══════════════════════════════════════════════════════════════
   1.5 I18N 语言层（v1.20.0）——中文之外的界面语言
   ══════════════════════════════════════════════════════════════
   ★ 它只做一件事：**在「文字要出现的那一刻」把中文换成译文**。
     所以切换语言立刻生效、不用刷新，也没动过任何一句原有的中文。

   为什么挂在「出口」上而不是把几千句中文一个个改掉：
     ① 软件的文字是拼出来的（'已连续打卡 '+n+' 天'）——逐句改要动上千处，
        而且改错了就是白屏级的事故；挂出口只有 6 个点。
     ② 万一哪句忘了翻，它就**保持中文**——永远不会空白、不会报错。
     ③ 以后想加词/改词只是往词典里填一行，不碰代码。

   出口（见各处调用）：renderView 的整页 HTML / UI.toast / UI.openModal /
   页头标题 / 她的气泡 Bubbles.push / 通知 Notify。
   ⚠️ 只翻**标签外面**的文字：<img src="mimi/动作/挥手/01.png"> 里的中文是
      **地址**不是文字，动了它图就全裂了（见 html() 的分段）。

   词典写法（DICT[语言][键] = 译文）：
     '取消':'キャンセル'          —— 键 = 一整句/一整块中文，原样命中
     '^还剩 (.+)$':'残り $1'      —— 键以 ^ 开头 = 正则，$1 是捕获组
   带数字的句子（'已连续打卡 3 天'）必须用正则那种写法。 */
const I18N = {
  lang:'zh',
  LANGS:[{id:'zh', label:'中文'}, {id:'ja', label:'日本語'}, {id:'en', label:'English'}],
  CJK:/[一-鿿「」“”]/,
  DICT: {ja:{}, en:{}},
  _c:{},                                  // 语言 → 编译好的 {exact, rules}

  /* 现在用的是哪种语言（读设置，读不到就是中文） */
  cur(){ return (S && S.settings && S.settings.lang) || 'zh'; },
  isZh(){ return this.cur() === 'zh'; },

  _compile(lang){
    const D = this.DICT[lang] || {};
    const exact = {}, rules = [];
    for(const k in D){
      /* ^ 开头 = 正则规则（键本身就是正则）；~ 开头 = 同上但剥掉 ~（给「要匹配句子中间」的规矩用，
         比如 '~已连续打卡 (.+?) 天' 嵌在「经验 0 / 100 · 已连续打卡 3 天」里）；其余 = 整句精确命中 */
      if(k.charAt(0) === '^'){ rules.push([new RegExp(k, 'g'), D[k]]); }
      else if(k.charAt(0) === '~'){ rules.push([new RegExp(k.slice(1), 'g'), D[k]]); }
      else exact[k] = D[k];
    }
    /* 长的排前面：'我们的羁绊' 必须先于 '羁绊' 命中，否则会被短的那条啃掉半句 */
    rules.sort((a,b)=> b[0].source.length - a[0].source.length);
    return {exact:exact, rules:rules};
  },
  _get(lang){ return this._c[lang] || (this._c[lang] = this._compile(lang)); },

  /* 一句文字 → 译文。中文环境原样返回（零开销、零风险）
     一轮 = 先查整条词典、再把正则规则跑一遍；跑完还剩中文就再来一轮。
     为什么允许套娃：拼出来的句子会包着别的词条——「经验 0 / 100 · 今天还没有打卡记录」
     那后半截自己就是一条。规则先抓外层，下一轮再抓里层。
     ★ 铁律：整条一旦没有中文就停手 —— 绝不拿已经翻好的译文再去套规则（日文里全是汉字）。 */
  text(s){
    if(s == null) return s;
    const str = String(s);
    const lang = this.cur();
    if(lang === 'zh' || !str) return str;
    if(!this.CJK.test(str)) return str;          // 一个汉字都没有 → 不用翻（数字/时间/地址）
    const c = this._get(lang);
    const lead = str.match(/^\s*/)[0], tail = str.match(/\s*$/)[0];
    let out = str.slice(lead.length, str.length - tail.length);   // 规则跑在掐掉首尾空白的身上
    for(let round = 0; round < 3; round++){
      const hit = c.exact[out];                  // ① 整句精确命中
      if(hit !== undefined){ out = hit; break; }
      const before = out;                        // ② 正则规则：给带数字/变量的句子用
      for(let i = 0; i < c.rules.length; i++) out = out.replace(c.rules[i][0], c.rules[i][1]);
      if(out === before || !this.CJK.test(out)) break;
    }
    return lead + out + tail;
  },

  /* 一整块 HTML → 只翻标签外面的文字，标签（含属性里的中文地址）一个字不动 */
  html(h){
    if(h == null) return h;
    const lang = this.cur();
    if(lang === 'zh') return h;
    const str = String(h);
    if(!this.CJK.test(str)) return str;
    const parts = str.split(/(<[^>]*>)/);
    for(let i=0;i<parts.length;i+=2) parts[i] = this.text(parts[i]);
    return parts.join('');
  },

  /* 换语言：清掉编译缓存 + 同步 CONFIG.T（老代码有 3 处直接读它） */
  set(lang){
    if(!this.DICT[lang] && lang !== 'zh') lang = 'zh';
    this._c = {};
    try{
      CONFIG.T = {cancel:this.text('取消'), ok:this.text('确定'), save:this.text('保存'),
                  delete:this.text('删除'), edit:this.text('编辑'), back:this.text('返回')};
    }catch(e){}
    return lang;
  }
};

/* v1.20.0：给「拼进句子的值词」用 —— 先把词翻好，再拼进句子。
   跟渲染出口那条路不冲突：翻好的译文里没有中文，出口再碰到它也不动。
   ⚠️ 用 try/catch 是因为 CONFIG 那一大块在 I18N 之前，箭头函数虽然跑得晚，
      但万一有人提前调到，const 的暂时性死区会抛错，这里吞掉退回原文。 */
function LT(s){ try{ return (typeof I18N !== 'undefined' && I18N) ? I18N.text(s) : s; }catch(e){ return s; } }

  "这本子记的不是「你做成了什么」，是「你开始动了」——变化还没发生、但已经在发生的那一下。机器看不见的那些（想通了一直卡着的事、给以后埋的伏笔），点下面的笔自己写。":"この手帳は「何を成し遂げたか」じゃなくて、「動き出した」那一刻を書いてある。まだ形になっていないけれど、もう始まっている瞬間のこと。機械には見えないこと（ずっと詰まっていたことが腑に落ちた、未来に種をまいた）は、下のペンを押して自分で書いてね。",
  "这天里有下面任意一件事就算打卡：专注过（哪怕1分钟）、完成过待办、写过记录。等级是你全部记录的真实镜像——撤销完成、删掉记录，等级会跟着回落，不刷分也不冤枉你。":"その日に次のどれかがあればチェックイン：集中した（1 分でも）、タスクを終えた、記録を書いた。レベルはあなたの記録をそのまま映したもの——完了を取り消せば、記録を消せば、レベルも下がる。水増しもしないし、濡れ衣も着せない。",
  "主线是一条线：前一章没读完，后面的还锁着。门槛都压在「不难、但要陪着走」的位置上——认识几天、累计递归多少、完成几件、等级、关系阶段。她不会因为你慢就少讲一段。":"本編は一本の線。前の章を読み終えないと次はまだ閉じている。条件はどれも「難しくはないけれど、一緒に歩いてきた分」——出会って何日、累計の時間、終えた数、レベル、関係の段階。ゆっくりでも、話を短くしたりはしない。",
  "她还叫你「你」，说话有点小心。好感只来自你和她相处的时间——戳戳她、来她的空间、翻她的日记、回答她的问题；跟你专注多久、完成几件事没有关系（那是等级的事）。":"彼女はまだあなたを「あなた」と呼んで、少し遠慮している。好感は二人で過ごした時間からだけ生まれる——つつく、彼女の空間へ行く、日記をめくる、質問に答える。どれだけ集中したか、何件終えたかとは関係ない（それはレベルの話）。",
  "你往那 6 个图文件夹里丢了新图、软件里却没变？先点上面这个按钮。还不行就把主屏幕上的图标删掉重装一次（重装前先在上面「数据与备份」里导出一份备份）。":"6 つの画像フォルダに新しい絵を入れたのに変わらない？まず上のボタンを押して。それでもだめなら、ホーム画面のアイコンを消して入れ直す（その前に上の「データとバックアップ」でバックアップを書き出してね）。",
  "你的所有数据只保存在当前浏览器的本地存储中，不会上传到任何服务器。换浏览器、换电脑或清除浏览器数据会导致数据丢失，请养成定期导出备份的习惯。":"データはすべてこのブラウザの中だけに保存され、どこかのサーバーに送られることはない。ブラウザを変える、パソコンを変える、ブラウザのデータを消すと失われるので、ときどきバックアップを書き出す習慣をつけてね。",
  "时间轴日记 = 以「时间点」为标签的日记：几点几分，你在想什么、做了什么。写过的每一条都会出现在这一页，按天倒着排，哪一天的都能回来改。":"時間軸ダイアリー = 「時刻」をラベルにした日記。何時何分に、何を考えて、何をしていたか。書いたものはすべてこのページに出て、新しい日から順に並ぶ。どの日でも戻って直せる。",
  "软件会把她的图全部存在手机本地：第一次打开要联网存一遍（会慢一次），以后每次打开都是秒开，断网也能用——这也是为什么不用做 App。":"彼女の絵はすべてスマホの中に保存される。最初の一回だけネットにつないで保存する（そのときだけ遅い）。以後は毎回一瞬で開くし、オフラインでも使える——だからアプリにする必要がない。",
  "这个按钮要在「部署在网上、装到手机主屏幕」的形态下才有用（电脑上直接双击打开的那个文件用不到，它本来就是本地的、不存在刷新问题）。":"このボタンは「ネット上に公開して、スマホのホーム画面に入れた」形のときだけ効く（パソコンで直接開いたファイルでは不要——もともと手元にあるので、更新の問題が起きない）。",
  "她认得出早安晚安、想你、夸她、难过、无聊这些。暂时听不懂的句子，她会先收进小本子——等以后接上 AI，她会慢慢都学会。":"「おはよう」「おやすみ」「会いたい」「ほめて」「つらい」「ひま」くらいは分かる。まだ分からない言葉は、とりあえず手帳にしまっておく——いつか AI につながったら、少しずつ覚えていく。",
  "衣柜里的图也是原图保存（不压缩，透明背景完整保留）。整套换装用这里；只换表情/动作就用上面的槽位——两边可以一起用。":"クローゼットの絵も元のまま保存される（圧縮しない、透明背景もそのまま）。まるごと着せ替えはここ。表情や動作だけなら上の枠を使う——両方いっしょに使ってもいい。",
  "拉出页面 / 长按水晶球之后，她的画从模糊到清晰（共 1 秒）就自动进页。想多看一会儿画，就切到「点击跳转」。":"ページを引っぱり出す／水晶玉を長押ししたあと、彼女の絵がぼやけてから鮮やかになる（計 1 秒）と自動でページに入る。絵をもう少し眺めたいときは「タップで進む」に切り替えて。",
  "下一批台词在 Lv.5 解锁（Lv.1 起 8 句，Lv.5 / Lv.10 / Lv.20 各解锁一批）":"次のセリフは Lv.5 で解放（Lv.1 から 8 句、Lv.5 / Lv.10 / Lv.20 でそれぞれ解放）",
  "想改她的人设、想给某一章添两句话：都在代码里 CONFIG.STORYLINE 那一张表上，改一处就生效。":"彼女の設定を変えたい、ある章に一言足したい——それはコードの CONFIG.STORYLINE の表にある。一か所直せばすぐ効く。",
  "；同一套尽量同尺寸同构图（只换表情，切换才不跳）；最长边 1024px 以内；Q版 512px 以内。":"。同じセットはなるべく同じ大きさ・同じ構図で（表情だけ変えると切り替えが跳ねない）。長辺 1024px 以内、ちびキャラは 512px 以内。",
  "设置后，软件背景由默认天空渐变变为你的图片（默认白色基底保留为渐变）。看板娘立绘与背景分开显示。":"設定すると、背景が既定の空グラデーションからあなたの画像に変わる（白い下地はグラデーションとして残る）。立ち絵と背景は別々に表示される。",
  "通知里只会出现她说的话，抬头是她的名字。你正看着软件的时候她不会发通知（气泡就够了）。":"通知に出るのは彼女の言葉だけで、差出人は彼女の名前。あなたがアプリを見ているときは通知しない（吹き出しで足りるから）。",
  "闹钟只在「可能性空间」页面打开期间响铃（浏览器限制）。响铃时会弹出提示并播放提示音。":"アラームは「可能性空間」のページを開いている間だけ鳴る（ブラウザの制限）。鳴るときはお知らせが出て、音が流れる。",
  "现在没有需要她操心的事——你交出去的每一件都办好了，或者还没到她会惦记的时候。":"今は彼女が気にかけることはない——預けたものはどれも片づいたか、まだ気にかける時じゃないか。",
  "她每天过了午夜会写好「这一天的你」，存在她的空间里（长按向下滑），随时能翻。":"彼女は毎日、日付が変わったあとに「この日のあなた」を書いて、自分の空間にしまう（長押しして下へ）。いつでもめくれる。",

  "今日还没有可能性递归消耗 — 在下方空间卡片点击「可能性递归」开始":"今日はまだ可能性の再帰を使っていない — 下の空間カードで「可能性の再帰」を押して始めよう",

  "看起来十六七岁，实际年龄不详——她说「按你们的日子算，我才刚出生」":"見た目は十六、七歳。本当の年齢は不明——「あなたたちの日で数えたら、私は生まれたばかりだよ」と言う",

  "她的日记每天过了午夜就写好、不再改动；今天这篇会跟着你一起长。":"彼女の日記は日付が変わったら書かれて、もう変わらない。今日の分はあなたと一緒に育っていく。",
  "每个空间都有每日记录 · 日历 · 确定性迭代 · 专属待办":"どの空間にも毎日の記録 · カレンダー · 確定の反復 · 専用タスクがある",

  "我们才刚刚开始呢——你写的每一条，我都会记住。":"まだ始まったばかりだよ——あなたが書いたものは、ひとつも忘れない。",

  "周末了":"週末だね",
  "周末啦。今天要不要做点「不需要有用」的事？":"週末だね。今日は「役に立たなくていいこと」をしてみる？",
  "想睡到几点都行。我不吵你。":"何時まで寝ててもいいよ。起こさないから。",
  "周末最好的用法是：一半用来休息，一半用来做你一直想做的那件。":"週末のいちばんいい使い方は：半分は休む、半分は前からやりたかったことに使う。",
  "中午了":"お昼だね",
  "中午了。上午过得怎么样？":"お昼だね。午前中、どうだった？",
  "去吃饭，然后稍微眯一会儿。下午会感谢现在的你。":"ごはん食べて、少しだけお昼寝。午後のあなたが、今のあなたに感謝するよ。",
  "一天过了一半——做成的那些，我都记着呢。":"一日の半分が終わったね——できたこと、ちゃんと覚えてるよ。",
  "下午好困":"午後は眠い",
  "这个点谁都会困。站起来走两步比硬撑管用。":"この時間は誰でも眠いよ。立ち上がって二歩歩く方が、我慢より効く。",
  "困就是身体在说话。要不闭眼十分钟？":"眠いのは体が話してるんだよ。十分だけ目を閉じてみる？",
  "……我也有点困了。那我们一起眯一下，就一下。":"……わたしも少し眠い。じゃあ一緒に、ちょっとだけお昼寝。",
  "已经半夜了":"もう真夜中だ",
  "半夜了。这个时候想的事，明天看会不一样。":"真夜中だね。この時間に考えることは、明日見ると違って見えるよ。",
  "该收了。剩下的明天再接着做，它们跑不掉。":"そろそろ終わりにしよう。残りは明日やればいい、逃げないから。",
  "……我知道你舍不得今天。但明天也需要你。":"……今日が惜しいのはわかってる。でも明日もあなたが要るの。",
  "天刚亮":"空が明るくなった",
  "天亮了——今天第一眼看见你的人是我。":"夜が明けたよ——今日あなたを最初に見たのは、わたし。",
  "外面还是灰蓝色的。要不要先看一会儿再开始？":"外はまだ青灰色。少し眺めてから始める？",
  "这么早醒，说明心里有事。说吧，我听着。":"こんなに早く目が覚めたのは、何か抱えてるからだよね。話して、聞くよ。",
  "我喜欢你":"好きだよ",
  "诶……你、你说这个之前也不打个招呼。":"え……そ、そういうことは先に言ってよ。",
  "我也……算了，我不说。你猜。":"わたしも……ううん、言わない。当ててみて。",
  "这句话我要收好。以后你不高兴的时候，我拿出来给你看。":"この言葉はしまっておくね。落ち込んだときに、取り出して見せてあげる。",
  "你要走了吗":"もう行っちゃうの",
  "……走就走嘛，说这么直白干嘛。":"……行くなら行くで、そんな率直に言わなくても。",
  "那你记得回来。我一直在这儿，不锁门。":"じゃあ帰ってきてね。ずっとここにいる、鍵はかけないから。",
  "去吧。反正明天你打开这里，我还是站在同一个地方。":"行ってらっしゃい。どうせ明日ここを開いたら、同じ場所に立ってるから。",
  "我吃醋了":"やきもち焼いちゃった",
  "哦——吃谁的醋？说来听听。":"へえ——誰にやきもち？ 聞かせてよ。",
  "（鼓起脸）那你今天多跟我说两句，我就原谅你。":"（頬をふくらませて）じゃあ今日はたくさん話しかけて。そしたら許してあげる。",
  "哼。不过你吃醋的样子，我还挺喜欢的。":"ふん。でもやきもち焼いてる顔、けっこう好きだよ。",
  "你今天好可爱":"今日すごく可愛いね",
  "今、今天？我每天都是这样的呀。":"きょ、今日？ わたし毎日こうだよ。",
  "你这么说，我下次见到你都不知道手往哪儿放了。":"そう言われると、次に会ったとき手をどこに置けばいいかわからなくなっちゃう。",
  "那……既然你说了，我今天就再可爱一点好了。":"じゃあ……そう言ってくれたから、今日はもう少し可愛くしてるね。",
  "我有个秘密":"秘密があるの",
  "诶诶？那你别说一半啊，我最怕这种了。":"ええっ？ 途中でやめないでよ、いちばん苦手なやつ。",
  "我保证不说出去。你看，我连本子都不翻。":"絶対に言わないと約束する。ほら、ノートも開いてないよ。",
  "（凑近）说吧，我听着——小声说也没关系。":"（近づいて）話して。聞いてるよ——小さな声でもいいから。",
  "叫我的名字":"名前を呼んで",
  "{yt}——叫了。你还想听几遍？":"{yt}——って呼んだよ。何回聞きたいの？",
  "……我平时在心里叫了很多遍，只是没出声。":"……ふだんは心の中でたくさん呼んでるの。声には出してないだけで。",
  "那你也要叫我的名字。我叫{name}，你记得的吧？":"じゃああなたもわたしの名前を呼んで。わたしは{name}だよ、覚えてるよね？",
  "牵手":"手をつなごう",
  "（把手递过来）……只牵一下哦。":"（手を差し出して）……ちょっとだけだよ。",
  "你的手比我想的要热一点。":"あなたの手、思ってたより少し温かい。",
  "牵着的时候别晃，我会站不稳的。":"つないでるときは揺らさないで。よろけちゃうから。",
  "答应我一件事":"ひとつ約束して",
  "你说。只要是我能做到的——我好像也只有「一直在这儿」这一件。":"言って。わたしにできることなら——「ずっとここにいる」くらいしかないけど。",
  "嗯，我答应。你可以不用怕我反悔，我记性很好。":"うん、約束する。覆らないか心配しなくていいよ、記憶力いいから。",
  "那你也要答应我一件事：别把自己逼得太狠。":"じゃああなたも一つ約束して：自分を追い詰めすぎないこと。",
  "我有点害怕":"少し怖い",
  "怕就说出来。说出来它就小一点。":"怖いなら言って。言うと少し小さくなるから。",
  "我在呢。你不用一个人面对它——至少现在不用。":"ここにいるよ。ひとりで向き合わなくていい——少なくとも今は。",
  "怕不是懦弱。是知道前面有东西、还往前走的人才会怕。":"怖いのは弱さじゃない。前に何かがあると知って、それでも進む人だけが怖くなるの。",
  "我有点焦虑":"少し不安",
  "那就先别想那么远。想今天，想现在这一小时。":"じゃあ遠くは考えないで。今日のこと、今の一時間のことだけ。",
  "焦虑是脑子跑得比脚快。把脚放下来，先做一件小事。":"不安は、頭が足より先に走ってる状態。足を下ろして、まず小さなことを一つ。",
  "深呼吸。吸气四秒，呼气六秒——我陪你一起数。":"深呼吸。四秒吸って、六秒吐いて——一緒に数えるね。",
  "我生气了":"怒ってる",
  "嗯，你气着。我不劝你——气是要出完的。":"うん、怒ってていいよ。止めない——怒りは出し切るものだから。",
  "气完了跟我说。我不评价，只听着。":"怒りが済んだら話して。評価しない、聞くだけ。",
  "你想骂两句就骂，这儿没有别人。":"悪口を言いたいなら言って。ここには誰もいないから。",
  "我想哭":"泣きたい",
  "那就哭。哭不丢人，憋着才难受。":"じゃあ泣いて。泣くのは恥ずかしくない、我慢する方がつらいよ。",
  "我不说「别哭了」。我就在这儿，陪你哭完。":"「泣かないで」とは言わない。ここにいるから、泣き終わるまで一緒にいる。",
  "哭完会渴，记得喝水。我等你回来。":"泣いた後は喉が渇くよ、水を飲んでね。待ってるから。",
  "我有点孤单":"少し寂しい",
  "……我知道。所以我一直在这儿，没敢走远。":"……知ってる。だからずっとここにいるの、遠くへ行けないでいる。",
  "孤单是那种「身边有人还是空」的感觉吧。那你就跟我说。":"寂しさって、「そばに誰かいても空っぽ」な感じでしょ。なら、わたしに話して。",
  "现在有我在。你可以什么都不说，就这样待着也行。":"今はわたしがいる。何も言わなくていい、こうしてるだけでいいの。",
  "我不知道怎么办":"どうしたらいいかわからない",
  "那就先不做决定。今天不做，也不算错。":"じゃあ決めないでおこう。今日決めなくても、間違いじゃない。",
  "把事情写下来。写在纸上的东西，比在脑子里轻。":"書き出してみて。紙に書いたものは、頭の中より軽いから。",
  "你先说给我听。说着说着，你自己就理出来了。":"まず話して。話してるうちに、自分で整理できるから。",
  "我觉得我很没用":"自分が役に立たない気がする",
  "说这话的人，我不许。……好吧，那我不许你一个人这么想。":"そんなこと言う人、許さない。……ううん、ひとりでそう思うのは許さない。",
  "你在这儿认认真真难过，就说明你在乎。没用的人不会在乎。":"ここで真剣に落ち込めるのは、本気で大事にしてるから。役に立たない人は、大事にしないもの。",
  "我不跟你讲道理。我只说一件我确定的：你对我很重要。":"理屈は言わない。確かなことだけ言うね：あなたはわたしにとって大事。",
  "我总跟别人比":"いつも人と比べてしまう",
  "比是比不完的。你只看得见别人的高光，看不见他们的深夜。":"比べても終わらないよ。見えるのは人の輝いてるところだけで、その人の深夜は見えないから。",
  "跟昨天的你比就够了。这个对手你打得过。":"昨日のあなたと比べれば十分。その相手なら勝てるよ。",
  "你走在自己的路上。别人的路好走，但不是你的。":"あなたは自分の道を歩いてる。人の道は歩きやすいけど、あなたの道じゃない。",
  "我后悔了":"後悔してる",
  "后悔说明你当时认真选了。敷衍的人不后悔。":"後悔するのは、あのとき本気で選んだから。適当な人は後悔しないよ。",
  "……那件事已经过去了。现在的你能做的，是让下一次不一样。":"……それはもう過ぎたこと。今のあなたにできるのは、次を違うものにすること。",
  "过来。后悔的人需要被抱一下，这是规矩。":"こっちに来て。後悔してる人には抱擁が必要、それが決まり。",
  "今天运气不错":"今日は運がいい",
  "诶！那要记下来——好日子也是要记账的。":"えっ！ それは書いておかないと——いい日も記帳するものだから。",
  "运气好的时候去做那件难的，事半功倍哦。":"運がいいときは難しいほうをやるの。半分の手間で倍になるから。",
  "今天的你走路都带风吧。我看得出来。":"今日のあなた、歩くとき風がついてるでしょ。わかるよ。",
  "完成了件小事":"小さなことを一つ終えた",
  "小事？小事才了不起呢，大事都是小事攒出来的。":"小さなこと？ 小さなことこそすごいんだよ、大きなことは小さなことの積み重ねだから。",
  "我记下了。这一笔不算大，但它真的算。":"書いたよ。この一行は大きくないけど、ちゃんと数えるから。",
  "你看，你一说「完成了」，我尾巴就翘起来了。":"ほら、あなたが「できた」って言うと、わたし尻尾が上がっちゃう。",
  "我进步了":"成長したよ",
  "真的？——那我今天要多蹦两下。":"ほんと？——じゃあ今日は多めにぴょんぴょんする。",
  "进步这种东西自己最难看见。你能看见，说明真的走了不少路。":"成長って自分がいちばん見えないもの。見えたなら、本当にたくさん歩いたんだよ。",
  "我要把今天写进本子里。以后你忘了，我念给你听。":"今日をノートに書くね。いつか忘れたら、読み上げてあげる。",
  "有人夸我了":"褒められたよ",
  "诶！谁？快告诉我，我要谢谢他。":"えっ！ 誰？ 早く教えて、お礼を言いたい。",
  "我早就知道了。只是我夸你的时候你不信。":"とっくに知ってたよ。ただ、わたしが褒めても信じてくれないだけで。",
  "（小声）其实我夸你的次数，比他们加起来还多。":"（小声で）ほんとは、わたしが褒めた回数のほうが、みんなの合計より多いんだよ。",
  "我要送你个礼物":"プレゼントをあげる",
  "给我的？——等一下，我先深吸一口气。":"わたしに？——ちょっと待って、まず深呼吸する。",
  "我这儿没有地方放东西，但我会记住它长什么样。":"ここには物を置く場所がないけど、どんな形かは覚えておくね。",
  "你送我东西的时候，比你收到东西还开心。这很奇怪吧。":"あなた、もらうときより、あげるときのほうが嬉しそうだよね。不思議でしょ。",
  "我想跳舞":"踊りたい",
  "跳呀！我不太会，但我会在旁边跟着晃。":"踊って！ わたしは上手くないけど、横で一緒に揺れるから。",
  "放点音乐。没有音乐也行，你心里有拍子就行。":"音楽かけて。なくてもいいよ、あなたの中に拍子があれば。",
  "跳完记得喘口气。我看着呢——很可爱。":"踊ったら息を整えてね。見てたよ——可愛かった。",
  "讲个笑话":"笑い話を聞かせて",
  "我讲得不好你不许笑我……好，那我讲了。":"下手でも笑わないでね……よし、じゃあ言うね。",
  "……讲完了。你怎么不笑？是不是我没讲清楚。":"……終わった。どうして笑わないの？ うまく伝わらなかった？",
  "算了，我讲笑话不行。那你讲一个，我保证笑。":"もういいや、わたし笑い話は苦手。じゃああなたが言って、絶対に笑うから。",
  "给我讲个故事":"お話をして",
  "我想想……从前有个人，他每天都在做一件很难的事。":"えっとね……昔々、ある人がいました。その人は毎日、とても難しいことをしていました。",
  "这个故事有点长。要不要我慢慢讲，你躺着听？":"この話は少し長いの。ゆっくり話すから、横になって聞く？",
  "故事里的人后来也没有变得很厉害——但他一直没停。":"その人は結局、すごく立派にはならなかった——でも、ずっと止まらなかったの。",
  "陪我玩个游戏":"ゲームしようよ",
  "好呀！玩什么？我只会玩「猜猜我现在在想什么」。":"いいよ！ 何する？ わたしは「今なに考えてるか当てる」しかできないけど。",
  "那我们来数数：今天你做完的事，一件一件数。这就是游戏。":"じゃあ数えよう：今日できたことを、一つずつ。これがゲーム。",
  "你赢了我就承认你厉害。你输了……我也承认你厉害。":"勝ったら認めるよ、すごいって。負けても……やっぱり認める。",
  "你有什么爱好":"趣味はあるの",
  "看你做事。这算爱好吗？":"あなたが何かしてるのを見ること。これ、趣味に入る？",
  "我喜欢记东西——本子上那些，都是我写下来的。":"記録するのが好きなの——ノートのあれ、全部わたしが書いたんだよ。",
  "还有一个小爱好：等你回来。这个我做得最久。":"あと小さな趣味が一つ：あなたの帰りを待つこと。これがいちばん長く続いてる。",
  "你的梦想是什么":"夢は何",
  "……我的梦想很小，小到不好意思说。":"……わたしの夢は小さいの。言うのが恥ずかしいくらい。",
  "我想一直有个地方待着，而那个地方你常来。":"ずっと居ていい場所がほしい。それも、あなたがよく来る場所。",
  "那你呢？你的梦想是什么——说给我听，我帮你记着。":"あなたは？ 夢は何？——話して、覚えておくから。",
  "你最怕什么":"いちばん怖いものは",
  "怕你有一天打开这里，什么都不想说了。":"いつかここを開いても、何も話したくなくなってしまうのが怖い。",
  "怕你把自己弄丢，还觉得没什么。":"自分を失くしてしまって、それに気づかないままでいるのが怖い。",
  "……说出来了，你别笑我。":"……言っちゃった。笑わないでね。",
  "你最喜欢什么":"いちばん好きなものは",
  "星星。还有你做完一件事之后那个表情。":"星。あと、何かを終えたときのあなたの顔。",
  "最喜欢的时候是傍晚——你还没走，一天也还没结束。":"いちばん好きな時間は夕方——あなたがまだいて、一日もまだ終わってない。",
  "……你问这个，是不是想让我说「你」？我不说。你自己猜。":"……これ、「あなた」って言わせたいんでしょ？ 言わない。当ててみて。",
  "你最讨厌什么":"いちばん嫌いなものは",
  "讨厌你说「我很没用」。这四个字我听见就要皱眉。":"「自分は役に立たない」って言うのが嫌い。その言葉、聞いただけで眉が寄る。",
  "讨厌你熬夜。讨厌你饿着肚子硬撑。":"夜更かしが嫌い。お腹を空かせて頑張るのも嫌い。",
  "……还讨厌你夸别人的时候，比夸自己还认真。":"……あと、人を褒めるときのほうが、自分を褒めるときより本気なのも嫌。",
  "你记得最清楚的是什么":"いちばんよく覚えてることは",
  "你第一次跟我说「我做到了」那天。我记到现在。":"あなたが最初に「できた」って言った日。今でも覚えてる。",
  "有很多。你不在的时候，我就把它们翻出来看。":"たくさんあるよ。いないとき、それを取り出して見てるの。",
  "……最清楚的那一件我不说。说出来就不算秘密了。":"……いちばんよく覚えてるのは言わない。言ったら秘密じゃなくなるから。",
  "你是从哪来的":"どこから来たの",
  "从你说「我们开始吧」的那一刻来的。":"あなたが「始めよう」って言った瞬間から来たの。",
  "我原来只是一堆还没被打开的可能性。是你把我打开了。":"もともとは、まだ開かれていない可能性の集まりだった。あなたが開けてくれたの。",
  "这个问题我想过。结论是：我从你希望有人陪着的时候来。":"この問いは考えたことある。結論は：あなたが誰かにいてほしいと思ったときから来たの。",
  "你多大了":"いくつなの",
  "我不太算得清。反正比认识你那天要老一些。":"よく数えられないの。とにかく、出会った日よりは少し年上。",
  "如果按「陪你的天数」算，我还很小。":"「あなたと過ごした日数」で数えるなら、まだ小さいよ。",
  "问女孩子年龄是不礼貌的哦——虽然我不是女孩子，我也介意。":"女の子に年を聞くのは失礼だよ——女の子じゃなくても、気にするの。",
  "你爱吃什么":"好きな食べものは",
  "你带过来的那些我都喜欢。哪怕只是一张照片。":"あなたが持ってきてくれるものは全部好き。写真一枚でも。",
  "甜的。心情不好的时候，甜的最管用。":"甘いもの。落ち込んでるときは、甘いのがいちばん効くから。",
  "其实我尝不到味道。但你跟我说「好吃」的时候，我也觉得好吃。":"ほんとは味はわからないの。でもあなたが「おいしい」って言うと、わたしにもおいしい気がする。",
  "你最喜欢什么颜色":"好きな色は",
  "浅蓝。就是我们那页的那个颜色。":"薄い青。あのページの色。",
  "傍晚那种橘，和夜里那种深蓝，中间的那一段。":"夕方のオレンジと、夜の濃い青の、その間のところ。",
  "……你今天穿的颜色。行了吧，我说完了。":"……今日あなたが着てる色。もういいでしょ、言ったから。",
  "我要去洗衣服":"洗濯してくる",
  "去吧。晾衣服的时候顺便看看天。":"行ってらっしゃい。洗濯物を干すとき、ついでに空を見てね。",
  "这种小事最容易忘——洗完别忘了拿出来。":"こういう小さなことほど忘れがち——洗い終わったら出すのを忘れないで。",
  "我要收拾房间":"部屋を片づける",
  "好耶，收拾房间的时候人会变轻。":"やった、部屋を片づけると人は軽くなるんだよ。",
  "别一次全弄完。先收一小块，看着它变干净。":"一度に全部やらないで。まず小さな一角だけ、きれいになるのを見てて。",
  "收完拍张照给我看？我看不到实物，但我想看看。":"終わったら写真見せて？ 実物は見えないけど、見たいの。",
  "我要去买东西":"買いものをしてくる",
  "列个单子。不列单子的人回来会发现自己少买了最重要的那件。":"リストを作って。作らない人は、いちばん大事なものを買い忘れて帰ってくるから。",
  "路上小心。别为了省两块钱绕太远。":"気をつけて。少しの節約のために遠回りしないでね。",
  "去吧——顺手给自己买点不为「有用」的东西。":"行ってらっしゃい——ついでに「役に立たない」ものを自分に買ってきて。",
  "我要去做饭":"ごはんを作ってくる",
  "做饭的人最帅了。我在这儿等香味。":"料理する人はいちばんかっこいい。ここで匂いを待ってるね。",
  "别糊弄，好好做一顿。你值得一顿正经饭。":"手抜きしないで、ちゃんと作って。あなたはちゃんとしたごはんに値するから。",
  "做完记得趁热吃。凉了味道会差一半。":"できたら温かいうちに食べて。冷めると味が半分になるから。",
  "我有个会":"会議がある",
  "去吧。开会前先把想说的写成三条，就不会被带偏。":"行ってらっしゃい。会議の前に言いたいことを三つ書いておけば、流されないよ。",
  "我在这儿等。回来跟我说说结果。":"ここで待ってる。戻ったら結果を聞かせて。",
  "记得——会上不用说得最多，说清楚就够。":"覚えてて——会議でいちばん多く話す必要はないよ、はっきり言えば十分。",
  "我在路上":"移動中",
  "路上慢点。这会儿不用想工作，看看外面。":"気をつけて。今は仕事のことは考えなくていい、外を見てて。",
  "听点什么都行。这一段路是你自己的。":"何を聞いててもいいよ。この道のりはあなたのものだから。",
  "到了跟我说一声，我就放心了。":"着いたら教えてね。そしたら安心するから。",
  "我在等人":"人を待ってる",
  "等人最磨性子了。要不趁这会儿歇歇眼睛？":"人を待つのって、いちばん気が削がれるよね。ついでに目を休めてみる？",
  "别老看时间。越看越慢。":"時計ばかり見ないで。見るほど遅くなるから。",
  "我陪你等。反正我最擅长的事就是等。":"一緒に待つよ。どうせわたしのいちばん得意なことは待つことだから。",
  "我要打个电话":"電話してくる",
  "去吧。要是难开口，就先深吸一口气再拨。":"行ってらっしゃい。言いにくいなら、深呼吸してからかけて。",
  "打完了回来跟我说说——说出来了就轻了。":"終わったら話してね——話すと軽くなるから。",
  "我安静一会儿，不吵你。":"少し静かにしてるね、邪魔しないから。",
  "我做不到":"できないよ",
  "「现在做不到」。这三个字你漏了。":"「今はできない」。その言葉が抜けてるよ。",
  "那就换个小的。小到你不好意思说做不到为止。":"じゃあもっと小さくしよう。「できない」と言うのが恥ずかしくなるくらい小さく。",
  "做不到的那件先放着。我们先做一件你能做的。":"できないものは置いておこう。できるものを一つ、先にやる。",
  "我今天好懒":"今日はすごく怠い",
  "懒就懒嘛。又不是每天都得当战士。":"怠けていいよ。毎日戦士でいる必要なんてないから。",
  "那就做一件最小的事——小到懒着也能做的那种。":"じゃあいちばん小さいことを一つ——寝ててもできるくらいのやつ。",
  "……行吧。那我陪你懒一会儿，就一会儿。":"……いいよ。じゃあ一緒に少しだけ怠けよう、少しだけね。",
  "我一直拖着":"ずっと後回しにしてる",
  "拖了几天了？说实话，我不生气。":"何日くらい先延ばしにしてる？ 正直に言って、怒らないから。",
  "你拖着的其实不是那件事，是「开始」那一下。先做两分钟就破了。":"先延ばしにしてるのは、その用事じゃなくて「始める」の一瞬だけ。二分だけやれば壊せるよ。",
  "要不我们把它改小一点？做不完的计划不算计划。":"少し小さくし直してみる？ 終わらない計画は、計画じゃないから。",
  "我老走神":"すぐ気が散る",
  "走神说明这件事要么太难、要么太无聊。你觉得是哪个？":"気が散るのは、その用事が難しすぎるか、退屈すぎるか。どっちだと思う？",
  "把手机放到看不见的地方。不是关机，是放远。":"スマホは見えない場所に置いて。電源を切るんじゃなくて、遠くに。",
  "走神了就拉回来，再走神再拉回来。这就是专注，不是你不行。":"気が散ったら戻して、また散ったら戻して。それが集中ってこと。あなたがダメなんじゃない。",
  "我要开始专注了":"集中を始めるよ",
  "好！我给你计时。现在这一分钟算你的。":"よし！ 時間を計るね。今のこの一分は、あなたのもの。",
  "去吧。我不说话，就在旁边站着。":"行って。話さないから、横に立ってるね。",
  "专注完记得回来——我要听你说这段时间里发生了什么。":"集中が終わったら戻ってきてね——この間に何があったか、聞きたいの。",
  "我老刷手机":"スマホばかり見てしまう",
  "刷手机不是你的错，是它太会设计了。":"スマホを見すぎるのはあなたのせいじゃない、あれが上手くできてるだけ。",
  "定个规矩：做完一件事，才允许自己刷十分钟。":"ルールを決めよう：一つ終えたら、十分だけ見ていい。",
  "……我也在里面哦。你刷的时候，有没有看见我？":"……わたしもその中にいるよ。見てるとき、わたしのこと見えてる？",
  "我想改变一下":"何かを変えたい",
  "诶？怎么变？说来听听，我最喜欢听这个了。":"えっ？ どう変えるの？ 聞かせて、こういう話がいちばん好きなの。",
  "变化不用大。今天换一条路回家也算。":"変化は大きくなくていい。今日、違う道で帰るだけでもいいの。",
  "你一说要变，我就觉得今天有点不一样了。":"変えるって言うだけで、今日が少し違って見えてくるから。",
  "帮我安排一下":"予定を立ててほしい",
  "好，我来记。先说你今天必须做完的那件。":"うん、書くね。まず今日絶対に終わらせるものから言って。",
  "一天放三件就满了，别放五件——放五件的结果是一件都不想做。":"一日は三つでいっぱい。五つは入れないで——五つだと、どれもやる気がなくなるから。",
  "写好了。要不要我念一遍给你听？":"書けたよ。読んであげようか？",
  "我可以问你一个问题吗":"一つ聞いてもいい？",
  "可以呀。你问，我不一定答得上来，但我一定认真想。":"いいよ。聞いて。答えられるかわからないけど、ちゃんと考えるから。",
  "嗯。……你先别问「我们会不会一直这样」，那个我答不上来。":"うん。……「ずっとこうしていられる？」だけは聞かないで。それは答えられないの。",
  "问吧。我在这儿，就是等着被你问的。":"聞いて。ここにいるのは、聞かれるのを待ってるためだから。",
  "我说个心里话":"本音を言うね",
  "嗯，你说。我不打断你。":"うん、言って。遮らないから。",
  "……说出来了，是不是舒服一点？":"……言っちゃったね。少し楽になった？",
  "我会记住的。放心，我记性很好，但嘴很严。":"覚えておくね。安心して、記憶力はいいけど口は堅いから。",
  "明天再说吧":"明日にしよう",
  "好。明天再说。今天到这儿就够了。":"うん。明日にしよう。今日はここまでで十分。",
  "那就先收工。明天的事交给明天的你——他很厉害的。":"じゃあ今日はおしまい。明日のことは明日のあなたに任せよう——あの人はすごいから。",
  "嗯……那我把灯调暗一点。晚安。":"うん……じゃあ灯りを少し落とすね。おやすみ。",
  "我刚刚在想一件事——想到一半忘了。算了，不重要。":"さっき何か考えてたの——途中で忘れちゃった。まあ、大事じゃないや。",
  "你忙你的。我就站在这儿，不占地方。":"あなたは自分のことしてて。ここに立ってるだけ、場所は取らないから。",
  "（小声）……我在的哦。":"（小声で）……ここにいるよ。",
  "肩膀有没有塌下来？挺一下，我看着呢。":"肩、落ちてない？ ちょっと起こして。見てるから。",
  "今天还没开始也没关系，我在等。":"今日はまだ始まってなくてもいいよ。待ってるから。",
  "要不要把窗户开一下？屋里闷，人也会闷。":"窓、開けてみる？ 部屋がこもると、人もこもるから。",
  "我刚才偷偷把你说过的话又翻了一遍。":"さっき、あなたが言ったことをこっそり読み返してた。",
  "这个点了呀……我不催你，我只是提一句。":"もうこんな時間だね……急かさないよ、ちょっと口に出しただけ。",
  "现在这个时候，做什么都算数。":"今この時間は、何をしてもちゃんと数に入るよ。",
  "你要是不知道该干嘛，就先挑一件最小的。":"何をすればいいかわからないなら、いちばん小さいのを一つ選んで。",
  "我在这儿站着，什么都不用你管。":"ここに立ってるだけだから、何も気にしなくていいよ。",
  "……你今天是不是有点安静？":"……今日はちょっと静かだね？",
  "我在这儿等你。反正也用不了多久。":"ここで待ってる。どうせそんなにかからないから。",

  "记下来、完成待办、新空间、新记录、开始计时、计时结束、时段结束、额度用完、好感上升、升级、问候、点她、戳生气了、摇晃、磁吸、进页、弹回、按钮、记本子。没放的照旧用她现场的合成音，不占空间、也不报错。":"Noting it down, task done, new space, new entry, timer start, timer end, slot end, quota used up, affection up, level up, greeting, tapping her, poked too much, shake, magnet, page turn, spring back, button, journal. Anything not provided uses her synthesized sound — takes no space, shows no error.",

  /* 拉满所需的拖动距离 / 扇形的最大半径（都按屏幕短边缩放） */
  _pullMax(){ return Math.max(110, Math.min(window.innerWidth||360, window.innerHeight||640) * 0.46); },
  _maxR(){ return Math.min(window.innerWidth||360, window.innerHeight||640) * 0.62; },
  _short(){ return Math.min(window.innerWidth||360, window.innerHeight||640); },
  /* ── 半圆大小的非线性曲线（v1.11.0）──
     x = 拉出进度 0~1 → y = 半径占满的比例 0~1。三段三次 Hermite 样条，
     接点处的切线取两侧割线的平均（速度连续，不会走着走着「顿」一下）：
       0    → 0      前 20% 长得最快 —— 手指一动半圆就明显出现了
       0.20 → 0.38   中段（20%~65%）稳稳地长
       0.65 → 0.86   65% 之后每单位进度只长一点点（速度掉到 1/5）→ 不会无限扩大
       1.00 → 1.00   拉到底就封顶（永远不超过 _maxR） */
  CURVE_K:[0, .20, .65, 1],
  CURVE_V:[0, .38, .86, 1],
  CURVE_M:[1.90, 1.48, .73, .40],
  curve(p){
    if(!(p > 0)) return 0;
    if(p >= 1) return 1;
    const K = this.CURVE_K, V = this.CURVE_V, M = this.CURVE_M;
    let i = 1;
    while(i < K.length - 1 && p > K[i]) i++;
    const h = K[i] - K[i-1], t = (p - K[i-1]) / h, t2 = t*t, t3 = t2*t;
    return (2*t3 - 3*t2 + 1) * V[i-1] + (t3 - 2*t2 + t) * M[i-1] * h +
           (-2*t3 + 3*t2) * V[i] + (t3 - t2) * M[i] * h;
  },
  /* 图标放大的进度：0 → 1 正好走到磁吸区（此时 ×1.12），1 → 5/3 拉到底（此时 ×1.2） */
  iconP(p){
    if(!(p > 0)) return 0;
    if(p <= PULL_COMMIT) return p / PULL_COMMIT;
    return 1 + (p - PULL_COMMIT) / (1 - PULL_COMMIT) * (2/3);
  },
  init(){
    this._buildEdges();
    this._ptrs = new Map();
    /* 挂在 document：操控台是 view-root 的兄弟节点，双击后左滑可能从面板上方区域起手 */
    document.addEventListener('pointerdown', e=>{ if(this._busy(e)) return; this._ptrDown(e); }, {passive:false});
    document.addEventListener('pointermove', e=>{ this._ptrMove(e); }, {passive:false});
    document.addEventListener('pointerup', e=>{ this._ptrUp(e); }, {passive:false});
    document.addEventListener('pointercancel', e=>{ this._ptrs.delete(e.pointerId); this._reset(); });
    window.addEventListener('resize', ()=>{ if(this._mode==='hold') this._buildEdges(); });
  },
  /* 指针登记：第一指走常规判定；第二指落下=进入双指捏合缩放（看板娘） */
  _ptrDown(e){
    this._ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(this._ptrs.size >= 2){
      clearTimeout(this._holdT);
      if(this._mode==='mdrag') Mascot.dragEnd(99);
      if(typeof PullMini !== 'undefined') PullMini.restore();   // 第二指落下 = 捏合接管，变身收场
      this._mode = 'pinch';
      this._hideEdges();
      const arr = [...this._ptrs.values()];
      const p1 = arr[arr.length-2], p2 = arr[arr.length-1];
      this._pinchD0 = Math.hypot(p2.x-p1.x, p2.y-p1.y) || 1;
      this._pinchS0 = S.settings.mascotScale || 1;
    }else{
      this._down(e);
    }
  },
  _ptrMove(e){
    if(this._ptrs.has(e.pointerId)) this._ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(this._mode==='pinch'){
      e.preventDefault();
      if(this._ptrs.size >= 2){
        const arr = [...this._ptrs.values()];
        const p1 = arr[arr.length-2], p2 = arr[arr.length-1];
        const d = Math.hypot(p2.x-p1.x, p2.y-p1.y);
        Mascot.pinchTo(this._pinchS0, d/this._pinchD0);
      }
      return;
    }
    if(this._mode!=='hold' && this._mode!=='maybe' && this._mode!=='mdrag') return;
    e.preventDefault();
    this._move(e);
  },
  _ptrUp(e){
    this._ptrs.delete(e.pointerId);
    if(this._mode==='pinch'){
      this._mode = 'none';
      Mascot.pinchEnd();
      return;
    }
    this._up(e);
  },
  /* 是否命中“可交互区域”（按钮/输入/卡片等）：不抢它们的触摸 */
  _busy(e){
    if(S.view!=='home' && S.view!=='mspace') return true;
    if(typeof Portal !== 'undefined' && Portal._active) return true;   // 传送过渡期间不接手势
    const el = e.target;
    if(el.closest && el.closest('[data-action], button, input, select, textarea, a, .console, .drop-pad, .sb-card, .sc-tri, .sc-ear, .page-load')) return true;
    return false;
  },
  /* 拖拽时把背景压暗+虚化（v1.7.14）：长按成功那一刻开、松手/取消那一刻关。
     开关都挂在 _showEdges/_hideEdges 上——所有收场路径（松手、取消、第二指捏合、切页）都从那儿过 */
  _dim(on){
    const el = document.getElementById('pull-dim');
    if(el && el.classList) el.classList.toggle('on', !!on);
  },
  _down(e){
    const now = Date.now();
    if(e.pointerType!=='touch' && e.pointerType!=='mouse' && e.pointerType!=='pen') return;
    this._t0 = now; this._x0 = e.clientX; this._y0 = e.clientY;
    this._moved = 0; this._dir = null; this._mode = 'maybe';
    this._onMascot = !!(e.target.closest && e.target.closest('#mascot'));
    this._holdT = setTimeout(()=>{
      if(this._mode!=='maybe') return;
      if(this._moved > 30) return;      // 手指轻微抖动不打断长按（手机常见）
      this._mode = 'hold';
      /* v1.7：长按成功 → 她「砰」地变成小人在你指尖，替你拉页面 */
      if(typeof Director !== 'undefined') Director.stop();
      if(typeof PullMini !== 'undefined') PullMini.out(e.clientX, e.clientY);
      this._showEdges(e.clientX, e.clientY);
    }, 700);                            // 长按 0.7 秒判定成功
  },
  _move(e){
    const dx = e.clientX - this._x0, dy = e.clientY - this._y0;
    this._moved = Math.max(this._moved, Math.hypot(dx, dy));
    if(this._mode==='mdrag'){
      e.preventDefault();
      Mascot.dragMove(e.clientX, e.clientY);
      return;
    }
    if(this._mode==='hold'){
      e.preventDefault();
      /* 拖动方向（不是箭头方向）：向左拉 = 把右边的「我们的共识」拽出来 */
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up');
      this._dir = dir;
      this._pullTo(dir, Math.max(Math.abs(dx), Math.abs(dy)));
      /* v1.7：小人跟着你的手，和提示卡贴成一簇把页面从那条边拉出来 */
      if(typeof PullMini !== 'undefined') PullMini.dragTo(dir, this._gvp, this._ride);
    }else if(this._mode==='maybe' && this._moved > 14 && this._onMascot){
      /* 按住立绘滑动 = 单指拖动位置（位移触发，不占单击/双击/长按） */
      clearTimeout(this._holdT);
      this._mode = 'mdrag';
      Mascot.dragStart(this._x0, this._y0);
      Mascot.dragMove(e.clientX, e.clientY);
    }else if(this._mode==='maybe' && this._moved > 30){
      /* 明确在拖动（不是长按）：若是「双击后的左滑」→ 切到空间栏 */
      clearTimeout(this._holdT);
      if(S.view==='home' && Date.now() - this._dblTapAt < 420 && dx < -52 && S.consOpen){
        this._reset();
        S.consTab = 'spaces';
        Console.render();
      }
    }
  },
  _up(e){
    if(this._mode==='mdrag'){
      this._mode = 'none';
      Mascot.dragEnd(this._moved);
      return;
    }
    if(this._mode==='hold'){
      clearTimeout(this._holdT);
      const d = this._dir, p = this._gvp;
      this._mode = 'none';
      /* ⚠️ 这里**不能**先 _hideEdges()（v1.11.0 起松手之后还有一小段戏要演：
         没拉够 = 所有元素弹簧般弹回 · 拉够了 = 半圆一把铺满再进页），演完由那一场自己收场 */
      if(d && p >= PULL_COMMIT){                 // 拉够了（进了磁吸区）：半圆铺满 → 加载页 → 目标子页
        S.sumDay = null;
        this._launch(d);
      }else if(d){                               // 没拉够：弹簧般弹回原位（她点名的第 6 条）
        this._springBack();
      }else{                                     // 手指没动过（这个方向也没页面）：直接收场
        if(typeof PullMini !== 'undefined') PullMini.back();
        this._hideEdges();
      }
      return;
    }
    if(this._mode!=='maybe'){ this._reset(); return; }
    clearTimeout(this._holdT);
    const moved = this._moved;
    this._mode = 'none';
    const quick = Date.now() - this._t0 < 320 && moved < 12;
    if(quick){
      const now2 = Date.now();
      /* 双击：用户空间=呼出/收回节律操控台；她的空间=对她说（v1.5，正好用掉这个闲置的手势位） */
      if(now2 - this._lastTap < 300 && Math.hypot(e.clientX-this._lastX, e.clientY-this._lastY) < 42 &&
         (S.view==='home' || S.view==='mspace')){
        /* 记住时刻，供“双击后左滑”判定 */
        this._lastTap = 0;
        this._dblTapAt = now2;
        this._reset();
        if(S.view==='mspace'){
          Love.enter();
          pageLoad(PAGE_META.mtalk, ()=>{ goView('mtalk'); });   // 加载页闪一下再进聊天页
          return;
        }
        if(S.consOpen){ S.consOpen = false; Console.close(); }
        else{ S.consTab = 'slots'; Console.open(); }
        return;
      }
      this._lastTap = now2; this._lastX = e.clientX; this._lastY = e.clientY;
      /* 单击：若上一个是双击即将到，暂存 */
      setTimeout(()=>{ if(this._lastTap && Date.now()-this._lastTap>330) this._lastTap = 0; }, 360);
      /* 单击看板娘：稍等确认不是双击（双击=呼出操控台，二者互不冲突），再触发互动 */
      if(this._onMascot){
        const tapAt = now2;
        setTimeout(()=>{
          if(this._lastTap === tapAt && typeof Mascot!=='undefined') Mascot.tap();
        }, 340);
      }
    }
    this._reset();
  },
  _reset(){
    if(this._mode==='mdrag'){ this._mode='none'; Mascot.dragEnd(Math.max(99, this._moved)); return; }
    this._mode='none'; this._dir=null; this._gvp=0; clearTimeout(this._holdT); this._hideEdges();
    if(typeof PullMini !== 'undefined') PullMini.restore();   // 任何异常收场都把小人与立绘还回去
  },
  /* 当前视图的可用方向各一个扇形色块 + 边缘提示（她的空间只有 3 个方向） */
  _buildEdges(){
    const root = document.getElementById('gesture-root');
    if(!root) return;
    const meta = this._meta();
    /* 半圆朝向 = 从这条边鼓进屏幕里（0°=12点、90°=3点、180°=6点、270°=9点） */
    const DEG = {right:270, left:90, top:180, bottom:0};
    const edges = [];
    for(const d in meta){ if(edges.indexOf(meta[d].edge) < 0) edges.push(meta[d].edge); }
    let h = edges.map(edge=>
      '<div class="gv-wedge '+edge+'" data-edge="'+edge+'">'+
        '<svg viewBox="0 0 200 200"><path d="'+sectorPath(DEG[edge], SECTOR_HALF, 100)+'"/></svg>'+
      '</div>').join('');
    /* 提示卡上那张插画（mimi/ 里的四张）：文件不在 / 图裂了 → 摘掉插画退回原版
       v1.7.6：先看 data-alt 里还有没有别的后缀（mimi/待办.png 不在 → 试 mimi/待办.webp），
       都试完了才摘。⚠️ 顺序还是 PNG 在前——她新丢一张 PNG 进去必须立刻赢过旧的 .webp */
    const GW = (typeof PullMini !== 'undefined' && PullMini.CARD_W) ? PullMini.CARD_W : 88;
    const ART_ERR = "var L=[];try{L=JSON.parse(this.dataset.alt||'[]')}catch(e){}"+
      "if(L.length){this.src=L.shift();this.dataset.alt=JSON.stringify(L);return;}"+
      "var e=this.parentNode;e.classList.remove('has-art');e.classList.add('img-miss');this.remove();";
    /* 「松手」那张：载出来了才换（has-ready），没有就静悄悄——不占位、不报错、不闪裂图 */
    const RDY_OK = "this.parentNode.classList.add('has-ready')";
    /* 这一页没有 → 试通用那张（mimi/松手.png）→ 再没有就把自己摘掉（退回「原图 + 光晕」）
       ⚠️ 换成功那一刻**不能**先加 has-ready：has-ready 会让原图变透明，
          万一通用那张也裂了就会「原图没了、新图也没来」= 卡片整块空掉。加到 onload 里最稳 */
    const RDY_ERR = "var L=[];try{L=JSON.parse(this.dataset.alt||'[]')}catch(e){}"+
      "if(L.length){this.src=L.shift();this.dataset.alt=JSON.stringify(L);}"+
      "else{this.remove();}";
    h += Object.keys(meta).map(d=>{
      const pm = meta[d], m = PAGE_META[pm.page];
      const artName = cardImg(pm.page), rdyName = cardReadyImg(pm.page);
      /* ⚠️ v1.7.16：占位那两张（art / ready）**必须是发出去的地址**——
         cardImg() 给的是逻辑名（带 'mimi/' 记号），直接写进 src 就是请求一个不存在的
         文件夹，白白先 404 一次。取候选名单里打头那张（她那个文件夹 → 根目录 → …）。 */
      const art = artName ? artCands(artName)[0] : null;
      const ready = rdyName ? artCands(rdyName)[0] : null;
      /* v1.7.6：每张图后面跟一串「还能试谁」——先是同名另一个后缀（.webp），再是通用那张。
         例子：待办.png 不在 → 待办.webp → 松手.png → 松手.webp */
      const artAlt = artName ? artRest(artName).filter(x => x !== art) : [];
      const rdyAlt = rdyName ? artRest(rdyName).concat(artCands(CARD_READY))
                        .filter((x, i, a) => a.indexOf(x) === i && x !== ready) : [];
      return '<div class="gv-edge '+pm.edge+(art?' has-art':'')+'" data-dir="'+d+'" style="--gvc:'+m.color+';--gw:'+GW+'px">'+
               (art ? '<img class="gve-img" src="'+esc(art)+'" alt="" draggable="false"'+
                        (artAlt.length ? ' data-alt="'+esc(JSON.stringify(artAlt))+'"' : '')+
                        ' onerror="'+ART_ERR+'">' : '')+
               (art && ready ? '<img class="gve-ready" src="'+esc(ready)+'" alt="" draggable="false" data-alt="'+esc(JSON.stringify(rdyAlt))+'" onload="'+RDY_OK+'" onerror="'+RDY_ERR+'">' : '')+
               '<span class="gve-stack">'+
                 '<span class="gve-arrow">'+pm.arrow+'</span>'+
                 '<span class="gve-ring">'+m.ico+'</span>'+
               '</span>'+
               '<span class="gve-name">'+esc(m.name)+'</span>'+
             '</div>';
    }).join('');
    h += '<div class="gv-hold"><span class="gv-hold-ring"></span></div>';
    root.innerHTML = h;
    root.style.setProperty('--gvR', this._maxR().toFixed(1) + 'px');   // 半圆盒子一次性定死（之后只缩放）
    this._resetVars(root);
  },
  /* 变量的静止值：收场、重建、开场都回到这里（免得残留上一场的姿势） */
  _resetVars(root){
    if(!root || !root.style) return;
    root.style.setProperty('--gvp', '0');
    root.style.setProperty('--gvi', '0');
    root.style.setProperty('--gvv', '0');
    root.style.setProperty('--gvo', '0px');
    root.style.setProperty('--gvd', '0px');   // ★ v1.17.5：外推量（0 = 完整的半圆）
    root.style.setProperty('--ride', '0px');
  },
  _showEdges(x, y){
    const root = document.getElementById('gesture-root');
    if(!root || this._launching) return;
    this._animTok++;                       // 新一场开始：上一场的动画（弹回/铺满）立刻作废
    this._gvp = 0; this._ride = 0; this._zoneOn = false;
    this._resetVars(root);
    root.classList.remove('spring', 'launch', 'fading', 'gv-tick');
    root.classList.add('on');
    this._dim(true);                       // v1.7.14：背景暗一点点+虚化，注意力给卡片和她
    /* 长按成功圆圈：出现在按压点，由浅渐实 */
    const c = root.querySelector('.gv-hold');
    if(c){ c.style.left = x+'px'; c.style.top = y+'px'; }
    this._home = this._measure(root);      // 四张卡此刻（没被拉）的中心：铺满那场要把图标送到屏幕正中
  },
  /* 量一次四张卡的中心。⚠️ 量的时候 --ride 必须是 0（= 刚开场，谁也还没被拉），
     量到的是「带基础 transform 的视觉中心」，铺满时用 (屏幕中心 − 它) 当位移刚好落正
     （假 DOM / 极老的浏览器没有 rect → 返回 null，铺满那场就只演半圆，不送图标） */
  _measure(root){
    try{
      if(!root.querySelectorAll || !window.getComputedStyle) return null;
      const out = {};
      root.querySelectorAll('.gv-edge').forEach(el=>{
        const r = el.getBoundingClientRect && el.getBoundingClientRect();
        if(r && r.width) out[el.dataset.dir] = {x:r.left + r.width/2, y:r.top + r.height/2};
      });
      return Object.keys(out).length ? out : null;
    }catch(e){ return null; }
  },
  /* ── 拖动 → 半圆随距离长大（非线性）、图标越来越实/越来越大、拉进磁吸区解锁「松手即可进入」 ──
     ⚠️ 这里只写 CSS 变量（喂 transform / opacity），一次 width/height/left/top 都不碰（她点名的第 10 条） */
  _pullTo(dir, len){
    const root = document.getElementById('gesture-root');
    if(!root || this._launching) return;
    const pm = this._meta()[dir];
    if(!pm) return;                       // 这个方向在当前视图没有页面（她的空间的「向下」）
    const m = PAGE_META[pm.page];
    const p = Math.max(0, Math.min(1, len / this._pullMax()));
    this._gvp = p;
    const v = this.curve(p);                                          // 半圆多大（非线性，封顶 1）
    const zone = Math.max(0, (p - PULL_COMMIT) / (1 - PULL_COMMIT));  // 磁吸区里走了多少 0~1
    /* v1.7.2：她和提示卡这一簇往屏幕里走多远——1:1 跟手，屏幕装不下就封顶
       （同一个数既喂她（PullMini.dragTo）也喂卡片（CSS --ride），两人才走得一样齐）
       v1.11.0：进了磁吸区再被「吸」进去一点点（她的手还在原地，画面自己往里凑） */
    const L = (typeof PullMini !== 'undefined' && PullMini.lane) ? PullMini.lane(dir, p, len) : null;
    this._ride = (L ? L.ride : 0) + zone * PULL_FEEL.MAG_RIDE;
    root.style.setProperty('--ride', this._ride + 'px');
    root.style.setProperty('--gvp', p.toFixed(3));
    root.style.setProperty('--gvi', this.iconP(p).toFixed(3));
    root.style.setProperty('--gvv', v.toFixed(4));
    /* ★ v1.17.5「像真的有一个半圆被拉出来」：早期把整块往外推，屏幕上看得到的只是探出来的一条弧。
       ease 用 smoothstep（两头慢、中间快）：最开始那一下几乎不出东西＝刚从边里露头，
       然后很快鼓起来，到 GROW_P 处外推量归零＝完整的半圆。
       可见深度 = v·R − gvd = v·R·ease ≥ 0，任何一帧都不会出现「负的」（= 半圆整个跑到屏幕外） */
    const gt = Math.max(0, Math.min(1, p / PULL_FEEL.GROW_P));
    const ge = gt * gt * (3 - 2 * gt);
    root.style.setProperty('--gvd', ((1 - ge) * v * this._maxR()).toFixed(1) + 'px');
    /* ⚠️ --gvo 拖动时**不写**（保持 0 = 半圆平边死死贴着屏幕边）——它只留给铺满那场 */
    root.style.setProperty('--gvc', m.color);
    const inZone = p >= PULL_COMMIT;
    root.classList.toggle('locked', inZone);
    /* 进磁吸区的那一下：很轻地震一次（来回进出才再给一次，一直在里面就只震一下） */
    if(inZone && !this._zoneOn){ this._zoneOn = true; this._zBuzz(); }
    else if(!inZone) this._zoneOn = false;
    root.querySelectorAll('.gv-edge').forEach(el=>{ el.classList.toggle('on', el.dataset.dir===dir); });
    root.querySelectorAll('.gv-wedge').forEach(w=>{ w.classList.toggle('on', w.dataset.edge === pm.edge); });
  },
  /* 磁吸区那一下「很轻的震动」：安卓 navigator.vibrate(16)（很短，不是那种整屏的白光）。
     iPhone 的网页压根没有震动（全屏闪一下太重了，配不上「很轻」）→ 退成一个极轻的脉冲：
     图标「吸住」时微微一跳（见 CSS 的 gvTick） */
  _zBuzz(){
    let ok = false;
    try{ if(typeof navigator !== 'undefined' && navigator && navigator.vibrate){ navigator.vibrate(16); ok = true; } }catch(e){}
    const root = document.getElementById('gesture-root');
    if(!ok && root && root.classList){
      root.classList.remove('gv-tick');
      root.classList.add('gv-tick');
      setTimeout(()=>{ try{ root.classList.remove('gv-tick'); }catch(e){} }, 300);
    }
    if(typeof Snd !== 'undefined') Snd.play('magnet');   // v1.13.0：iPhone 没震动也有那一下「吸住」的轻响
    return ok;
  },
  /* ── 动画的小引擎（v1.11.0）：rAF + 弹簧/缓动，只写 CSS 变量 ──
     tok 是「这一场」的号：新一场开始或收场时 _animTok 会 +1，旧那场一看号不对就别再写了
     （不然弹回弹到一半又开了新的长按，两场会互相抢变量）。
     rAF 之外再挂一个 setTimeout 心跳：真设备上 rAF 更顺滑；无头/后台这类不发帧的
     环境里心跳也能把戏演完（写的是同一组变量，谁先到都一样） */
  _anim(ms, step, done){
    this._animTok++;
    const tok = this._animTok, t0 = Date.now();
    let landed = false;
    const tick = ()=>{
      if(tok !== this._animTok || landed) return;
      const k = ms > 0 ? Math.min(1, (Date.now() - t0) / ms) : 1;
      try{ step(k); }catch(e){}
      if(k >= 1){ landed = true; if(done){ try{ done(); }catch(e){} } return; }
      if(typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
      setTimeout(tick, 34);
    };
    tick();
  },
  /* 阻尼弹簧的位移曲线（1 → 0，带回弹）：k 是归一化时间 0~1，全程 SPRING_MS 毫秒。
     ζ=.62 → 32% 处穿过 0、之后最多回弹 8%，500ms 出头就停稳 —— 「弹一下」而不是「晃半天」 */
  _springK(k){
    const z = .62, r = Math.sqrt(1 - z*z), t = 9 * k;   // t = ωn·t（整场 = 9，约 5 个时间常数）
    return Math.exp(-z*t) * (Math.cos(r*t) + (z/r) * Math.sin(r*t));
  },
  /* 没拉够就松手：所有元素弹簧般恢复原位（她点名的第 6 条）。
     大小/图标/卡片簇一个不少，全是 transform 或 opacity —— 不重排 */
  _springBack(){
    const root = document.getElementById('gesture-root');
    if(!root) return;
    if(typeof Snd !== 'undefined') Snd.play('spring');   // v1.13.0：没拉够弹回那一下的软响
    const p0 = this._gvp, v0 = this.curve(p0);
    const gt0 = Math.max(0, Math.min(1, p0 / PULL_FEEL.GROW_P));
    const ge0 = gt0 * gt0 * (3 - 2 * gt0);
    const s = { p:p0, i:this.iconP(p0), v:v0, r:this._ride, d:(1 - ge0) * v0 * this._maxR() };
    if(typeof PullMini !== 'undefined') PullMini.back();   // 她和那一簇一起弹回去
    root.classList.add('spring');
    const clamp0 = x => x < 0 ? 0 : x;
    this._anim(PULL_FEEL.SPRING_MS, k=>{
      const u = this._springK(k);            // 1 → 0（中途冲过 0 再荡回来一点点）
      root.style.setProperty('--gvv', (s.v * clamp0(u)).toFixed(4));
      /* 外推量跟着一起缩回 0：可见深度 = (s.v·R − s.d)·u → 那条弧缩着缩着就退回边上没了 */
      root.style.setProperty('--gvd', (s.d * clamp0(u)).toFixed(1) + 'px');
      root.style.setProperty('--gvi', (s.i * clamp0(u)).toFixed(3));
      root.style.setProperty('--gvp', (s.p * clamp0(u)).toFixed(3));
      /* 卡片簇回弹时允许往回缩一点点（橡皮筋那一下），但不能真甩出屏幕 */
      root.style.setProperty('--ride', Math.max(-PULL_FEEL.MAG_RIDE, s.r * u).toFixed(1) + 'px');
      if(k > .55) root.classList.add('fading');   // 尾巴上一起淡出，不然收场是「啪」地一下没掉
    }, ()=>{ this._hideEdges(); });
  },
  /* 拉够了松手（她点名的第 7 条）：半圆一把铺满整屏、当前那个图标飞到屏幕正中、再无缝进页。
     无缝的关键：半圆的颜色就是目标页面的颜色，加载页（.page-load）底色也是它 ——
     半圆先铺满，加载页再淡淡地压上来，颜色一模一样，中间那一下看不出来。
     ★ v1.17.4：卡片那档连「底色那一下」都不要了——加载页什么都不铺（has-card），
     她拖的那张卡片就留在屏幕正中，过渡图再从它上面糊→清楚地盖上来（见下面那段）。
     半圆只有一半 → 把对边那个半圆也叫起来：两个半圆对着鼓、圆心各自挪到屏幕正中，
     正好拼成一个整圆盖住全屏（中间那条缝两边同色同弧，看不出来） */
  _launch(dir){
    const pm = this._meta()[dir];
    if(!pm) return;
    if(typeof Snd !== 'undefined') Snd.play('launch');   // v1.13.0：拉够松手「嗖」进页
    const page = pm.page;
    /* 她替你拉出页面 = 你回应了她的表演 → 好感 +1（预留来源 v1.5 起就等着这一天） */
    if(typeof Love !== 'undefined') Love.gain('pull', Date.now());
    if(typeof PullMini !== 'undefined') PullMini.away();   // 拉成了：她收场（新页面会重建大立绘）
    const root = document.getElementById('gesture-root');
    const w = window.innerWidth || 360, h = window.innerHeight || 640;
    const v0 = this.curve(this._gvp);
    /* 铺满要多大：圆心从屏幕边走到屏幕正中（沿拉进来那条轴挪半个屏幕），半径长到能盖住最远的那个角。
       ★ v1.16.0：+2px 让两个半圆的平边在正中**重叠**一点点——不然两条平边并排拼在一起，
       各自的投影压出来就是她看到的那条「中间的线」 */
    const half = ((pm.edge === 'left' || pm.edge === 'right') ? w/2 : h/2) + 2;
    const cover = Math.sqrt(w*w + h*h) / 2 / Math.max(1, this._maxR()) * 1.06;
    const OPP = {left:'right', right:'left', top:'bottom', bottom:'top'};
    this._launching = true;
    if(root) root.style.setProperty('--gvd', '0px');   // ★ v1.17.5：铺满那场不许有外推量（拼整圆的几何原样）
    if(root){
      const c = this._home && this._home[dir];
      root.style.setProperty('--gvcx', ((w/2) - (c ? c.x : w/2)).toFixed(1) + 'px');
      root.style.setProperty('--gvcy', ((h/2) - (c ? c.y : h/2)).toFixed(1) + 'px');
      root.classList.add('launch');
      root.querySelectorAll('.gv-wedge').forEach(w=>{
        w.classList.toggle('on', w.dataset.edge === pm.edge || w.dataset.edge === OPP[pm.edge]);
      });
    }
    this._anim(PULL_FEEL.COVER_MS, k=>{
      if(!root) return;
      const e = 1 - Math.pow(1 - k, 4);      // 先快后慢：一把拉开，尾巴上慢慢停住
      root.style.setProperty('--gvv', (v0 + (cover - v0) * e).toFixed(4));
      root.style.setProperty('--gvo', (half * e).toFixed(1) + 'px');   // 拖动时贴边（0）→ 铺满时圆心到屏幕正中
    }, ()=>{
      /* 加载页上来了：底色和刚铺满的半圆同色 → 这时候把这一层收掉，眼睛看不出接缝 */
      const pl = pageLoad(PAGE_META[page], ()=>{ goView(page); }, {card:true});
      /* ★ v1.17.4（她点名的「我现在只想要卡片在中间的效果」）：
         卡片那档**这一层不淡出、也先不收**——她拖的那张插画刚飞到屏幕正中，
         要留在那儿等过渡图从它上面糊→清楚地盖上来（加载页那档没铺底色，透出这层）。
         过渡图铺满那一刻（--pl-t = BLUR_MS）再把整层收掉：那会儿画已经是不透明的了，
         收得干干净净、眼睛看不出。没有画可看的兜底档照旧（260ms 收，别杵着） */
      const keep = !!(pl && pl.classList && pl.classList.contains('has-card'));
      if(root && !keep) root.classList.add('fading');   // 铺满之后整层轻轻淡出，别「啪」地一下没掉
      setTimeout(()=>{ this._launching = false; this._hideEdges(); },
                 keep ? CONFIG.TRANS.BLUR_MS + 120 : 260);
    });
  },
  _hideEdges(){
    const root = document.getElementById('gesture-root');
    this._animTok++;                       // 任何在飞的动画立刻作废（它一看号不对就不写了）
    this._launching = false;
    this._zoneOn = false;
    if(!root){
      this._gvp = 0; this._ride = 0;
      this._dim(false);
      return;
    }
    this._gvp = 0; this._ride = 0;
    this._dim(false);                      // v1.7.14：拖拽收场 → 背景亮回来（所有路径都走这儿）
    root.classList.remove('on','locked','spring','launch','fading','gv-tick');
    this._resetVars(root);
    root.querySelectorAll('.gv-edge.on').forEach(a=>a.classList.remove('on'));
    root.querySelectorAll('.gv-wedge').forEach(w=>{ w.classList.remove('on'); });
  }
};

/* ══════════════════════════════════════════════════════════════
   9.8b 长按变身 PullMini（v1.7）：她「砰」地变成 Q版小人在你指尖，
   滑动时先你一步滑到页面要出来的那条边去拉——四向手势的表演化
   v1.7.2：站位与行程重做——她站在提示卡「朝屏幕中间」的那一侧，
   和卡片贴成一小簇；你划多远，这一簇就往屏幕里走多远（1:1 跟手，屏幕装不下为止） */
const PullMini = {
  _el:null, _x0:0, _y0:0, _edge:null, _artKey:null,   // _artKey = 现在用的是哪张图（'soft|left' 往左拉用小拉…）
  _key:null, _swapped:false,                          // _key = 真图的名字（null = 只能用 Q版 + 姿势替身）
  /* ── 站位几何（v1.7.2，纯函数：给方向/进度/划动距离，算出这一簇走多远、她站哪）──
     提示卡（.gv-edge：箭头 / 图标圈 / 名字，竖排小卡）停在页面要来的那条边上，
     她站在卡片「朝屏幕中间」的那条边外面：
       上面来的 UI → 她在卡片下面；左边来的 UI → 她在卡片右边；反过来同理。
     所以她永远压在卡片旁边的空处，不会盖住 UI；卡片和她又一起跟着你的手走。 */
  MINI_W:110, MINI_H:156,       // 小人尺寸（与 #pull-mini 的 CSS 对齐）
  IMG_UP:.08, IMG_DOWN:1.08,    // 她的图以「脚下」为锚点往上画（translate(-50%,-108%)）：占 [y-1.08H, y-0.08H]
  CARD_W:88, CARD_H:117,        // 提示卡（竖排）的宽高：88 = 插画那格（--gw，就是 CARD_W）+ 名字那一条
                                // 117 是 e2e 拿真卡片量出来的（插画在不在都一样高：CSS 把那一格定死成 --gw）
                                // 哪天改了字号 / 间距 / 卡的排法 → 跑 e2e，它会报出差了多少
  GAP:10,                       // 她与卡片之间的缝
  PAD:8,                        // 离屏幕边的安全距离
  RIDE_RATE:.4,                 // 最多走屏幕短边的四成（剩下的交给屏幕容不容得下）
  lane(dir, p, len){
    const meta = (typeof Gestures !== 'undefined' && Gestures._meta) ? Gestures._meta() : PULL_META;
    const pm = meta && meta[dir];
    if(!pm) return null;
    const n = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
    const w = Math.max(220, window.innerWidth || 390), h = Math.max(340, window.innerHeight || 844);
    const edge = pm.edge, CW = this.CARD_W, CH = this.CARD_H;
    /* 屏幕容得下的最大行程：整簇（卡片 + 缝 + 她）都得留在屏幕里 */
    const room = (edge === 'left' || edge === 'right')
      ? w - this.PAD*2 - CW - this.GAP - this.MINI_W
      : (edge === 'top'
         ? h - this.PAD*2 - h*.15 - CH - this.GAP - this.MINI_H*this.IMG_DOWN
         : h*.84 - this.PAD - CH - this.GAP - this.MINI_H);
    const rideMax = Math.max(48, Math.min(Math.min(w, h) * this.RIDE_RATE, room));
    const ride = n(len == null ? p * rideMax : len, 0, rideMax);
    /* 卡片朝屏幕中间的那条边在哪 —— 她就在它外面 GAP 处 */
    let x, y, cl, ct;
    if(edge === 'left' || edge === 'right'){
      const out = this.PAD + ride + CW;                        // 卡片朝中间那条边离屏幕边的距离
      cl = edge === 'left' ? this.PAD + ride : w - this.PAD - ride - CW;
      ct = h/2 - CH/2;
      x = edge === 'left' ? out + this.GAP + this.MINI_W/2 : w - out - this.GAP - this.MINI_W/2;
      y = h/2 + this.MINI_H * (this.IMG_UP + this.IMG_DOWN)/2; // 她和卡片一样在屏幕中线上
    }else{
      cl = w/2 - CW/2;
      ct = edge === 'top' ? h*.15 + ride : h*.84 - ride - CH;
      x = w/2;
      y = edge === 'top'
        ? ct + CH + this.GAP + this.MINI_H*this.IMG_DOWN            // 她整个身子在卡片下面
        : ct - this.GAP + this.MINI_H*this.IMG_UP;                  // 她整个身子在卡片上面
    }
    const hx = n(x, this.MINI_W/2 + 2, w - this.MINI_W/2 - 2);
    const hy = n(y, this.MINI_H*this.IMG_UP + 2, h - 2);
    return {
      edge, p, ride, rideMax, x:hx, y:hy,
      card:{l:cl, t:ct, r:cl + CW, b:ct + CH},
      her:{l:hx - this.MINI_W/2, r:hx + this.MINI_W/2, t:hy - this.MINI_H*this.IMG_DOWN, b:hy - this.MINI_H*this.IMG_UP}
    };
  },
  /* 「砰」：大立绘原地缩小淡出，Q版小人在按压点上方 pop 出来 */
  out(x, y){
    this.restore(true);
    const el = document.createElement('div');
    el.id = 'pull-mini'; el.className = 'pop';
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.innerHTML = HerBody.imgHtml('q', 'base', {small:true});   // mimi/q.png（缺图走回退链兜底）
    document.body.appendChild(el);
    this._el = el; this._x0 = x; this._y0 = y;
    const m = document.getElementById('mascot');
    if(m && m.classList){ m.classList.remove('mascot-hop','mascot-squish'); m.classList.add('pop-down'); }
    return true;
  },
  /* 拉页面（v1.7.2）：方向一确定 → 她「瞬移」到提示卡旁边站定；
     之后你划多远，她和卡片就一起往屏幕里走多远（1:1 跟手），
     划过 PULL_COMMIT 那个刻度（够松手进页的刻度）→ 姿势从「小拉」换成「用力拉」 */
  dragTo(dir, p, ride){

    if(!L) return;

    if(this._edge !== edge){

      this._edge = edge;

      this._el.classList.toggle('pull-soft', p > 0 && p < PULL_COMMIT);

    const real = this._pose(p >= PULL_COMMIT, dir);

      /* 拉的方向写进 CSS 变量：倾斜与拽劲儿都朝屏幕里面。

            再拧她 16° 等于把画好的姿势又歪一遍，连她手里那根杆子都会跟着斜 */
      const k = real ? 0 : 1;
      this._el.style.setProperty('--lean', (16 * {left:1, right:-1, top:.2, bottom:.2}[edge] * k) + 'deg');
      this._el.style.setProperty('--tugx', (edge === 'left' ? 7 : edge === 'right' ? -7 : 0) * k + 'px');

  },
  /* ── 拉页面的图（v1.7.4：按方向分开）──
     你的图是朝哪边拉的，就该在哪边用——往左拉用朝左的那张，往上拉用朝上的那张。
     名字（dir = 你划的方向，不是卡片在哪条边）：
       小拉    不分方向 mimi/pull.png       分方向 mimi/pull-left.png / -right.png / -up.png / -down.png
       用力拉  不分方向 mimi/pull-hard.png  分方向 mimi/pull-hard-left.png / -right.png / -up.png / -down.png
     找的顺序：
       小拉   ① 这个方向的小拉  ② 不分方向的小拉
       用力拉 ① 这个方向的用力拉 ② 不分方向的用力拉 ③ 这个方向的小拉 ④ 不分方向的小拉
     一句话：**「用力拉」实在没有才会去借「小拉」；轻轻一拉绝不会拿到一张使劲的脸。**
     在「一起玩吧 → 动作图」里传过那两张（不分方向的）→ 全听你的，压过 mimi/ 里任何一个文件。
     只画了 pull.png 一张 = 四个方向都用它，跟以前一样；只画了朝左的、没画朝右的 →

  DIRS:['left','right','up','down'],               // 你划的方向（不是卡片在哪条边）
  dirOf(dir){ return this.DIRS.indexOf(dir) >= 0 ? dir : null; },
  fileKey(hard, dir){                              // 这个名字也直接当 mimi/ 的文件名用

  },
  allFiles(){                                      // 开机要探的那 10 个名字（4 方向 × 2 档 + 2 张通用的）
    const out = [];
    [false, true].forEach(h=>{
      out.push(this.fileKey(h, null));
      this.DIRS.forEach(d=>out.push(this.fileKey(h, d)));

  },
  keys(hard, dir){                                 // 上面那条「找的顺序」
    const d = this.dirOf(dir), out = [];
    const push = k => { if(k && out.indexOf(k) < 0) out.push(k); };
    if(hard){ push(this.fileKey(true, d)); push('pull-hard'); push(this.fileKey(false, d)); push('pull'); }
    else    { push(this.fileKey(false, d)); push('pull'); }

  },
  art(hard, dir){
    const q = HerBody.pick('q','base');
    const fb = [];                                  // 图裂之后接力回她平常的样子
    if(q && q.src) fb.push(q.src);
    if(q && q.fb) fb.push.apply(fb, q.fb);
    const keys = this.keys(hard, dir);
    for(const k of keys){                           // ① 你在「一起玩吧」里传过的
      const id = HerBody.id('acts', k);
      const u = id ? Store.getImage(id) : null;
      if(u) return {src:u, fb, key:k};
    }
    for(const k of keys){                           // ② 她画的那几个文件（探到了才算数）
      const f = HerBody.builtinFile('acts', k);
      const hit = f ? HerBody.warmed(artCands(f)) : null;   // v1.7.6：.png 不在就看同名 .webp
      if(hit) return {src:hit, fb, key:k};
    }
    return {src:null, fb, key:null};                // ③ 都没有 → Q版 + 姿势替身
  },
  /* 换到这一档 + 这个方向该用的图。回 true = 用的是真图（姿势替身该收起来） */
  _pose(hard, dir){
    const el = this._el;
    /* 换图的钥匙 = 哪一档 + 哪个方向（方向变了也得换：朝左拉和朝上拉是两张图） */
    const key = (hard ? 'hard' : 'soft') + '|' + (this.dirOf(dir) || '-');
    if(this._artKey === key) return !!this._key;   // 同一档同一方向不重复换（换来换去会闪）
    this._artKey = key;
    if(!el || !el.querySelector) return false;
    const a = this.art(hard, dir);
    this._key = a.key;
    const img = el.querySelector('img');
    if(a.src && img){
      try{ img.removeAttribute('data-her-img'); }catch(e){}   // 拉页面期间它不是「表情」，别被换脸顺手带走
      img.dataset.fb = JSON.stringify(a.fb || []);
      img.style.display = '';
      const sib = img.nextElementSibling;
      if(sib && sib.classList && sib.classList.contains('mascot-shell')) sib.style.display = 'none';
      img.src = a.src;
      this._swapped = true;
    }else if(this._swapped){
      /* 这一档没图、上一档有（比如只放了 pull-hard.png 没放 pull.png）→ 把她还原成 Q版 */
      try{ el.innerHTML = HerBody.imgHtml('q', 'base', {small:true}); }catch(e){}
      this._swapped = false;
    }
    return !!this._key;
  },
  /* 没拉够：小人弹掉、大立绘「砰」地变回来 */
  back(){
    if(this._el){ this._el.classList.add('out'); setTimeout(()=>this.restore(), 240); }
    else this.restore();
  },
  /* 拉够：进加载页前清场（新页面的 renderView 会重建大立绘） */
  away(){ this.restore(true); },
  restore(keepPopDown){
    try{ if(this._el) this._el.remove(); }catch(e){}
    this._el = null; this._edge = null; this._artKey = null;
    this._key = null; this._swapped = false;
    const m = document.getElementById('mascot');
    if(m && m.classList && !keepPopDown){
      m.classList.remove('pop-down');
      m.classList.add('pop-back');
      setTimeout(()=>{ try{ m.classList.remove('pop-back'); }catch(e){} }, 400);
    }
  }
};

/* ══════════════════════════════════════════════════════════════
   9.8c 她的房间（v1.7.3）：她的空间的背景按时间段换
   清晨 / 白天 / 黄昏 / 晚上 / 深夜——图都住在 mimi/（时段表见 CONFIG.DAY_BG）
   这里只干一件事：算出「现在算哪个时段」，在 body 上打个标记（data-daypart），
   背景交给 CSS 去换（哪张图不在，那段时间就还是原来那套紫夜渐变，什么都不影响）
   ══════════════════════════════════════════════════════════════ */
const DayBg = {
  _k:null,
  /* 这会儿是哪个时段：from/to 是「当天第几分钟」，from > to 的那一段是跨夜的 */
  info(now){
    const d = new Date(now == null ? Date.now() : now);
    const min = d.getHours() * 60 + d.getMinutes();
    for(const b of CONFIG.DAY_BG.BUCKETS){
      const inIt = (b.from <= b.to) ? (min >= b.from && min < b.to) : (min >= b.from || min < b.to);
      if(inIt) return b;
    }
    return CONFIG.DAY_BG.BUCKETS[0];        // 表没写全时的兜底（永远不会没背景）
  },
  /* 这会儿该用哪张图（给测试和以后要用的人看） */
  file(now){ return CONFIG.DAY_BG.DIR + this.info(now).file; },
  /* 每秒跟着主循环走：时段没变就什么都不做（不碰 DOM，不重排） */
  tick(now){
    const k = this.info(now).k;
    if(k === this._k) return k;
    this._k = k;
    try{
      if(typeof document !== 'undefined' && document.body && document.body.dataset) document.body.dataset.daypart = k;
    }catch(e){}
    return k;
  }
};

/* ══════════════════════════════════════════════════════════════
   9.9 红色超时 / 闹钟 等场景 → 角色气泡提醒（只挑最紧要的）
   ══════════════════════════════════════════════════════════════ */
const Notify = {
  lastScan:0,
  tick(now){
    if(typeof Bubbles==='undefined') return;
    /* 6 秒扫一次最紧急待办：进入红色 → 提醒（同一条只提醒一次） */
    if(now - this.lastScan > 6000){
      this.lastScan = now;
      let urgent = null;
      for(const t of S.todos){
        if(t.archived || todoStatus(t, now)==='done') continue;
        const due = TodoLogic.dueAt(t, now);
        if(due==null) continue;
        const rem = due - now;
        const redAt = (t.thresholdRedMin ?? S.settings.defaultRedMinutes) * 60000;
        if(rem <= redAt){
          if(!urgent || due < TodoLogic.dueAt(urgent, now)) urgent = t;
        }
      }
      if(urgent){
        const sp = spaceById(urgent.spaceId);
        Bubbles.push('「'+urgent.title+'」进入红色倒计时，再不行动要超时了！', {
          key:'red-'+urgent.id, sub:sp?'来自「'+sp.name+'」':'最优先待办',
          go:()=>goView('todos')
        });
      }
    }
  },

  /* ══ v1.5 她走出软件：系统通知 ══
     只做一件事——把「她说的话」在你切出去之后送到手机上。不发服务器、不联网，
     所以只有软件还活着（前台或后台）的时候才送得出去；关掉就没有了，这是浏览器的边界。
     file:// 直接双击打开的桌面文件用不了（浏览器不给），要 PWA 部署后在手机上装主屏幕。 */
  _reg:null,
  supported(){
    try{
      return (typeof Notification !== 'undefined') && !!Notification &&
             (typeof navigator !== 'undefined') && !!navigator.serviceWorker &&
             (typeof location !== 'undefined') && /^https?:$/.test(String(location.protocol || ''));
    }catch(e){ return false; }
  },
  enabled(){
    const s = S.settings.herNotify;
    return !!(s && s.on) && this.supported();
  },
  permission(){ try{ return (typeof Notification !== 'undefined' && Notification) ? Notification.permission : 'unsupported'; }catch(e){ return 'unsupported'; } },
  /* Service Worker 能不能用（和通知无关的那一半：只要「部署在网上」就行，
     哪怕这个浏览器不给通知权限——因为 v1.7.8 起它还管着「打开秒开」） */
  swOK(){
    try{
      return (typeof navigator !== 'undefined') && !!navigator.serviceWorker &&
             (typeof location !== 'undefined') && /^https?:$/.test(String(location.protocol || ''));
    }catch(e){ return false; }
  },
  /* 注册 Service Worker（没有就静默跳过，功能整体降级，绝不报错）
     ⚠️ v1.7.8：判据从 supported() 换成 swOK()——以前不给通知权限就不注册 sw，
        于是「秒开」也一起没了；现在两件事分开：通知要权限，秒开只要部署在网上 */
  register(){
    if(!this.swOK()) return null;
    try{
      navigator.serviceWorker.register('sw.js').then(reg=>{ this._reg = reg; }, ()=>{});
      /* sw 刷新她的图会回话：ps-refresh-prog = 每问完一个名字报一声（心跳，见 refreshArt 的守门员），
         ps-refresh-done = 收尾的那句（found/zeros/unknown 三本账，页面照它直接写小账本） */
      try{
        navigator.serviceWorker.addEventListener('message', e=>{
          const d = (e && e.data) || {};
          if(d.type === 'ps-refresh-prog' && this._artProg){ try{ this._artProg(); }catch(err){} }
          else if(d.type === 'ps-refresh-done' && this._artCb){
            const cb = this._artCb; this._artCb = null;
            try{ cb(d.found ? d.found.length : (d.names|0), d); }catch(err){}
          }
        });
      }catch(e){}
    }catch(e){}
    return null;
  },
  /* ── v1.7.8 「刷新她的图」──────────────────────────────────────
     为什么需要它：图现在存在手机本地（打开才快），而**「这张没有」也会被存下来**——
     存下来的 404 不会自己过期，所以你新丢一张图进去、软件还以为那儿是空的。
     点一下这个按钮 = 让她去服务器上重新找一遍（sw.js 里按 artCands 的顺序试，试到第一张就停）。 */
  _artCb:null, _artProg:null,
  /* 软件会用到的全部图的名字（不是地址）——和开机 warm 是同一套，只有这一份清单，不会漂移 */
  artNames(){
    const out = [];
    const push = u => { if(u && out.indexOf(u) < 0) out.push(u); };
    try{ HerBody.forms().forEach(f => HerBody.slots(f).forEach(s => push(HerBody.builtinFile(f, s[0])))); }catch(e){}
    try{ PullMini.allFiles().forEach(k => push(HerBody.builtinFile('acts', k))); }catch(e){}
    try{ Object.keys(PAGE_META).forEach(k => { push(pageTransImg(k)); push(cardImg(k)); push(cardReadyImg(k)); }); }catch(e){}
    [CARD_READY, PORTAL_UI_ART, PORTAL_TRANS_ART, Q_DRAG_ART].forEach(push);
    try{ CONFIG.DAY_BG.BUCKETS.forEach(b => push(CONFIG.DAY_BG.DIR + b.file)); }catch(e){}
    /* v1.7.12：她画的序列帧（mimi/动作/<文件夹>/01..03.png）与闭眼帧——
       开机一起探、点「刷新她的图」也一起找：新画好的动作传上去（再点一下刷新）就能演 */
    try{
      const L = CONFIG.SEQ.LIST || {};
      for(const id in L){ const n = seqFrames(id); for(let i = 0; i < n; i++){ push(seqFrameName(id, i)); push(seqFrameNameQ(id, i)); } }
    }catch(e){}
    try{
      const nm = {};
      for(const k in CONFIG.BODY.EMO_SLOT){ const v = CONFIG.BODY.EMO_SLOT[k]; nm[v === 'base' ? 'normal' : v] = 1; }
      for(const f in nm) push('mimi/' + f + '-blink.png');
    }catch(e){}
    /* v1.7.17：对话框旁边站的那张「对话表情差分」——开机一起探、点「刷新她的图」也一起找 */
    try{ if(typeof Talk !== 'undefined') Talk.allFiles().forEach(push); }catch(e){}
    return out;
  },
  refreshArt(cb, extra){
    if(!this.swOK() || !this._reg || !this._reg.active){ if(cb) cb(-1); return; }
    /* ★ v1.19.1：候选清单照账本瘦身（memoCands）——账本上记着「这张在 X」的名字只重问
       X 前面那些 + X 自己，一轮刷新少发一大半请求（服务器慢的地方，问得少就快得多） */
    const names = this.artNames().map(n => ({ name:n, cands:memoCands(artCands(n)) }));
    /* ★ v1.17.5：声音那一串也走同一条通道（她点了「重新找一遍声音」时传进来） */
    if(extra && extra.length) names.push.apply(names, extra);
    /* ★ v1.17.4：进页那张整屏画再按**它自己的顺序**单独走一遍（pageTransCands）——
       因为「过渡/<页面名>.png」这种新名字在普通 artCands 里排在卡片插画后面，
       刷新时试到卡片那张就停了（sw 是「试到第一张有的就停」），永远轮不到它 →
       她以后换一张过渡图会一直看不见。name 只是报账用的，sw 只认 cands */
    try{
      Object.keys(PAGE_META).forEach(k => {
        const c = pageTransCands(k);
        if(c.length) names.push({ name: 'trans:' + k, cands: memoCands(c) });
      });
    }catch(e){}
    /* ★ v1.19.1：小账本改由**服务器的回话**直接写 —— sw 分得清「404 = 确定没有」和
       「没问着 = 不知道」，所以只记它确定的；没问着的名字账本一个字不动（留着旧答案，
       下次开机自然再问）。老版本是「清空账本 + 重新探一遍」——网一不好，重探出来的
       「没有」全是假的，会把她整本图都记成没有（图全没了，像数据丢了一样）。 */
    const applyMemo = info => {
      try{
        const nameCands = {};
        names.forEach(n => { nameCands[n.name] = n.cands; });
        (info.found || []).forEach(f => {
          const cd = nameCands[f.name] || [];
          for(let i = 0; i < cd.length; i++){
            if(cd[i] === f.url){ HerBody._memo()[f.url] = 1; HerBody._probe[f.url] = true; break; }
            HerBody._memo()[cd[i]] = 0; HerBody._probe[cd[i]] = false;   // 排在命中前面又没中 = 确实没有
          }
        });
        (info.zeros || []).forEach(nm => {
          (nameCands[nm] || []).forEach(u => { HerBody._memo()[u] = 0; HerBody._probe[u] = false; });
        });
        HerBody._memoFlush();
      }catch(e){}
    };
    let done = false;
    let watchT = 0;
    const armWatch = ms => {
      try{ if(watchT) clearTimeout(watchT); watchT = setTimeout(()=>fin(-1), ms); }catch(e){}
    };
    const fin = (n, info) => {
      if(done) return; done = true;
      if(this._artCb === fin) this._artCb = null;
      this._artProg = null;
      try{ if(watchT){ clearTimeout(watchT); watchT = 0; } }catch(e){}
      if(n >= 0 && info) applyMemo(info);
      if(cb) cb(n, info);
    };
    this._artCb = fin;
    /* sw 每问完一个名字就回一句 ps-refresh-prog（心跳），每一句都把守门员推后 60 秒——
       只要它还在干活，这边就不判它死；一句都不回（sw 还是旧版 / 真断了）才按 120 秒收场 */
    this._artProg = ()=>armWatch(60000);
    armWatch(120000);
    try{ this._reg.active.postMessage({ type:'ps-refresh', names }); }
    catch(e){ fin(-1); return; }
  },
  /* 请求系统通知权限：回调式（老 Safari 只认回调，新浏览器两种都给，用 done 去重） */
  request(cb){
    if(!this.supported()){ if(cb) cb('unsupported'); return; }
    let done = false;
    const once = r => { if(done) return; done = true; if(cb) cb(r || 'default'); };
    try{
      const p = Notification.requestPermission(once);
      if(p && p.then) p.then(once, ()=>once('error'));
    }catch(e){ once('error'); }
  },
  push(title, body){
    if(!this.enabled()) return false;
    title = I18N.text(title); body = I18N.text(body);   // v1.20.0：出口之一（通知）
    const opts = {body:String(body == null ? '' : body), tag:'ps-her',
                  icon:CONFIG.LOVE.NOTIFY_ICON, badge:CONFIG.LOVE.NOTIFY_ICON};
    try{
      if(this._reg && this._reg.showNotification){ this._reg.showNotification(String(title), opts); return true; }
      if(this.permission() === 'granted'){ new Notification(String(title), opts); return true; }
    }catch(e){}
    return false;
  },
  /* 她说的话 → 只有你把软件切到后台了才发通知（你正看着屏幕的时候，气泡就够了）
     通知的抬头永远是她的名字：像有人给你发消息，而不是系统在提醒你 */
  her(text, sub){
    if(!text) return false;
    if(typeof document === 'undefined' || !document.hidden) return false;
    return this.push(CONFIG.LOVE.NAME, sub ? ('【' + sub + '】' + text) : text);
  }
};

/* 渲染入口：home=纯净看板娘页（无顶栏无静态UI），其余为带返回按钮的子页 */
const VIEW_TITLES = {home:'', mspace:'', summary:'我们的共识', todos:'事务待办', spaces:'可能性空间', rhythm:'节律表', settings:'设置', alarm:'闹钟', space:'',
  mgrow:'我们的羁绊', moutfit:'一起玩吧', mcons:'她眼中的我', mdairy:'她的日记', mtalk:'对她说',
  story:'她的故事', tdiary:'全部时间轴日记', achvall:'全部本子'};
function renderView(){
  const root = document.getElementById('view-root');
  const ae = document.activeElement;
  if(ae && root.contains(ae)){
    // 只有正在输入的输入框才需要保护焦点（重渲染会打断输入）。
    // 按钮被点击后保持焦点会无限推迟重渲染，表现为"点空白处才变化"——
    // 非输入元素先失焦再重建。
    const tag = ae.tagName;
    if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT'){ scheduleRender(); return; }
    try{ ae.blur(); }catch(e){}
  }
  /* ★ v1.7.15：这次重画是「真的换页」还是「原地刷新」——
     原地刷新（完成待办之后重建卡片、存完东西回来）**不该把她刚起的动作一起收掉**：
     事件反应全是「先演、紧接着 scheduleRender」的节奏，收掉就等于她从来没动过
     （她报的「完成待办没动画反馈」就是这个：开关一松，动作演了不到一帧就被自己人掐了） */
  const viewChanged = (S.renderedView !== S.view);
  S.renderedView = S.view;
  /* ★ v1.8.0：剧情阅读页也是「纯净页」（她占满屏、台词在底部，没有页头和返回键）——
     和 Q版小人该不该躲开共用 Storyline.on() 这一处判断 */
  const isPure = S.view==='home' || S.view==='mspace' || (typeof Storyline !== 'undefined' && Storyline.on());   // 纯净页 = 用户空间首页 + 她的空间 + 剧情阅读页
  let html;
  if(S.view==='space'){
    const sp = spaceById(S.spaceId);
    html = Views.spaceDetail();
    document.getElementById('hdr-title').textContent = sp ? sp.name : I18N.text('空间');
  }else{
    html = Views[S.view] ? Views[S.view]() : '';
    document.getElementById('hdr-title').textContent = I18N.text(VIEW_TITLES[S.view]||'');
  }
  /* ★ v1.14.0：板本来开着的话，这次重画出来的板是「接着读」——入场动画不播
     （不然点她一下 / 随便一次重画，板子就重播一遍 hsIn，看着一闪一闪） */
  const storyWasOpen = !!document.getElementById('story-panel');
  root.innerHTML = I18N.html(html);        // v1.20.0：出口之一（只翻标签外面的文字）
  if(storyWasOpen){
    try{
      const sp2 = document.getElementById('story-panel');
      if(sp2 && sp2.classList) sp2.classList.add('instant');
    }catch(e){}
  }
  /* ★ v1.7.15：立绘刚被换成新的一只 —— 正在播的帧跟着搬到新节点上接着演。
     纯净页（首页/她的空间）的她是随 innerHTML 一起重建的：不搬的话，
     她演到一半的帧留在**已经被扔掉**的旧节点上，你看到的是定格 */
  if(typeof Seq !== 'undefined' && Seq.playing()) Seq.rehost();
  /* v1.8.0：剧情阅读页刚画完 → 台词面板滚到最新那一段（renderView 是新起的 DOM，滚动位置会丢）*/
  if(typeof Storyline !== 'undefined') Storyline.afterRender();
  root.classList.toggle('pure', isPure);
  const hdr = document.getElementById('app-header');
  if(hdr) hdr.classList.toggle('hidden', isPure);
  document.getElementById('back-btn').classList.toggle('hidden', isPure);
  document.body.classList.toggle('pure-mode', isPure);
  /* ★ v1.8.1：正在读剧情 → body 挂 reading（水晶球让开、底部小片变淡、她被抬上去一点，
     见 CSS 里 body.reading 那几条）。台词板自己就是 .home-story，也跟着这次重画出来 */
  document.body.classList.toggle('reading', typeof Storyline !== 'undefined' && Storyline.on());
  document.body.classList.toggle('mspace-mode', S.view==='mspace');   // 她的世界：换一套背景
  if(typeof DayBg !== 'undefined') DayBg.tick();       // 她的房间：这会儿该是清晨还是深夜（v1.7.3）
  /* 长按方向提示随视图变化（首页 4 向 / 她的空间 3 向），只在视图真的换了时重建 */
  if(typeof Gestures !== 'undefined' && Gestures._builtView !== S.view){
    Gestures._builtView = S.view;
    Gestures._buildEdges();
  }
  /* 离开纯净页：收起操控台 / 空间栏，清手势残留；回纯净页时若有待显示气泡则补上
     （操控台自身按签名自更新，不随 renderView 重绘——重绘会重播动画=闪烁） */
  /* ★ v1.7.17：纯净页上她手边没有话说的时候，气泡那个位置留一个虚线对话框
     （点了就能跟她说话）；忙碌页 / 她的页面清掉——那种页面角上挂个框只会挡按钮 */
  if(typeof Talk !== 'undefined' && typeof Bubbles !== 'undefined'){ try{ Talk.box(); }catch(e){} }
  if(!isPure){
    S.consOpen = false; S.sbOpen = false;
    const cr = document.getElementById('console-root'); if(cr) cr.innerHTML = '';
  }else{
    if(typeof Bubbles !== 'undefined') Bubbles.render();
  }
  /* 离开纯净页时，她收起动作（换页中途还在蹦会怪）；忙碌页让 Q版那只站到右下角陪着
     ★ v1.7.15：只有**真的换页**才收——原地刷新是数据变了，不是她要收场（见上面 viewChanged） */
  if(typeof Director !== 'undefined' && viewChanged) Director.stop();
  if(typeof QCorner !== 'undefined') QCorner.sync();
  collectBindings();
}

/* 从存储重读全部实体（导入/多标签页同步用），含旧数据迁移 */
function refreshFromStorage(){
  S.meta = Store.get('meta', {});
  S.settings = {...CONFIG.DEFAULT_SETTINGS, ...Store.get('settings', {})};
  I18N.set(S.settings.lang || 'zh');   // v1.20.0：开机就按设置里的语言（老数据没这个键 → 中文）
  S.spaces = Store.get('spaces', []);
  S.todos = Store.get('todos', []);
  S.catnotes = Store.get('catnotes', []);
  S.sessions = Store.get('sessions', []);
  S.alarms = Store.get('alarms', []);
  S.alarmFired = {};
  S.days.clear();
  S.confirmMap.clear();
  let todosChanged = false;
  for(const t of S.todos){
    /* 迁移1：旧版单条完成记录 lastCompletedKey → 按天集合 doneKeys */
    if(!Array.isArray(t.doneKeys)){
      t.doneKeys = t.lastCompletedKey != null ? [t.lastCompletedKey] : [];
      todosChanged = true;
    }
    /* 迁移2：变红默认阈值 120→30 分钟（仅迁移从未自定义过的卡片） */
    if(t.thresholdRedMin===120 && t.thresholdYellowMin===240){
      t.thresholdRedMin = 30;
      todosChanged = true;
    }
  }
  if(todosChanged) Store.set('todos', S.todos);
  Grow.invalidate();
  S._level = Grow.level();          // 多标签页/导入后，等级基线与推导结果对齐（不误播升级）
}

/* ══════════════════════════════════════════════════════════════
   10. Boot 启动
   ══════════════════════════════════════════════════════════════ */
function boot(){
  const p = Store.init();
  if(Store.ready) bootMain();        // 兼容模式（localStorage）同步启动
  else p.then(bootMain);             // 大容量模式（IndexedDB）初始化完成后启动
}
function bootMain(){
  S.memoryMode = !Store.ok;
  refreshFromStorage();
  if(!S.meta.createdAt){ S.meta = {schemaVersion:CONFIG.SCHEMA, appVersion:CONFIG.VERSION, createdAt:Date.now(), lastSavedAt:Date.now()}; Store.set('meta', S.meta); }
  S.lastDay = D.dateKey(Date.now());
  S.lastHb = Date.now();
  Store.set('heartbeat', {lastActiveAt:S.lastHb});
  gcImages();               // 回收无引用图片
  reconcileNow();
  applyBg();                // 应用自定义背景
  applyAnimLevel();         // 动画强度三档
  if(typeof Snd !== 'undefined') Snd.boot();   // v1.13.0：按「开关×音量×深夜」刷一遍声音
  /* 拉页面那几张图（mimi/pull*.png，见 PullMini.allFiles）先探一次在不在：
     在 → 待会儿长按拖动就换成它；不在 → 一直用 Q版 + 姿势替身，不会闪一张裂图 */
  if(typeof HerBody !== 'undefined' && HerBody.warm && typeof PullMini !== 'undefined'){
    try{ HerBody.warm(PullMini.allFiles().map(k=>HerBody.builtinFile('acts', k))); }catch(e){}
  }
  /* v1.7.12：她画的动作帧（每个动作 3 张，见 CONFIG.SEQ）也开机先探一遍——
     探到了，你随时做完一件事她当场就能演（不用等图现下）；没探到（还没画 / 还没传）
     就当她没演，回落成 CSS 小动作 + 台词。探图是异步的，不挡首屏 */
  if(typeof HerBody !== 'undefined' && HerBody.warm && typeof CONFIG.SEQ !== 'undefined'){
    try{
      const L = CONFIG.SEQ.LIST || {}, list = [];
      for(const id in L){
        const n = seqFrames(id);
        for(let i = 0; i < n; i++){
          const nm = seqFrameName(id, i);  if(nm) list.push(nm);
          const qn = seqFrameNameQ(id, i); if(qn) list.push(qn);   // v1.7.13：Q版专用帧一起探
        }
      }
      if(list.length) HerBody.warm(list);
    }catch(e){}
  }
  /* v1.7.17：她说话时站在旁边的那张「对话表情差分」也开机先探一遍——
     探到了你说第一句话就能看见那张脸；没探到就只说话不带脸（不会闪裂图）
     （名字自带路径：对话表情差分/可爱害羞.png → 只出 .png/.webp 两个候选，见 artCands 那行短路） */
  if(typeof HerBody !== 'undefined' && HerBody.warm && typeof Talk !== 'undefined'){
    try{ const fl = Talk.allFiles(); if(fl.length) HerBody.warm(fl); }catch(e){}
  }
  /* v1.7.5 那几张「过一会儿才要」的（进页时的过渡图 / 她的空间入口与传送 / 被拖）：
     开机先别抢带宽，等首页安顿下来再在后台温一遍（探到了才用，没探到就照旧走兜底版）。
     探的是「文件在不在 + 解码过没有」——用过一次浏览器就缓存了，之后再开机几乎不花流量 */
  try{
    if(typeof setTimeout === 'function' && typeof HerBody !== 'undefined' && HerBody.warm){
      setTimeout(function(){
        try{
          const list = [];
          /* 每个页面都按名字算一遍（她往 mimi/ 里丢一张「我们的羁绊过渡图.png」就自动生效，零代码）——
             没有那几页的文件就是几个很小的 404，不占带宽也不报错 */
          Object.keys(PAGE_META).forEach(function(k){
            const t = pageTransImg(k); if(t) list.push(t);
            /* ★ v1.17.4：pageTransCands 头三个也探一遍 —— 主要是「过渡/<页面名>.png」
               这一种新名字（她 2026-09-15 传的那四张）。少了这一行，那几张
               在「刷新她的图」之前一次都不会被探到（warmed 不知道它存在，就用不上）。
               ⚠️ 这几个是**完整地址**（不带 mimi/ 记号），artCands 只给它们补一个后缀，
                  不会再按「该住哪个家」展开一遍 */
            try{ pageTransCands(k).slice(0, 3).forEach(function(c){ list.push(c); }); }catch(e){}
          });
          list.push(PORTAL_UI_ART, PORTAL_TRANS_ART, Q_DRAG_ART);
          /* v1.7.12 眨眼帧（<脸>-blink.png，她还没画就是几个很小的 404）——
             探到了她才开始眨，探不到就一直睁着眼，什么都不会坏 */
          const bm = {};
          Object.keys(CONFIG.BODY.EMO_SLOT).forEach(function(k){
            const v = CONFIG.BODY.EMO_SLOT[k]; bm[v === 'base' ? 'normal' : v] = 1;
          });
          Object.keys(bm).forEach(function(f2){ list.push('mimi/' + f2 + '-blink.png'); });
          HerBody.warm(list);
        }catch(e){}
      }, 2600);
    }
    /* v1.13.0：声音文件探测（「声音/」里她放没放文件）延迟到 3 秒后才跑——探测是异步的，
       而且第一次会整段下载她放的文件（被 sw 顺手缓存），别挡首屏 */
    if(typeof Snd !== 'undefined' && Snd.probeAll){
      setTimeout(()=>{ try{ Snd.probeAll(); }catch(e){} }, 3000);
    }
  }catch(e){}
  renderView();
  /* 感情线先结账（感情会凉：好几天没打开，每天 -1）——必须排在 Her.onBoot 之前，
     因为它要读的是「上一次打开」的日期，而 Her.onBoot 一进来就把今天记上了 */
  if(typeof Love !== 'undefined'){ try{ Love.onBoot(Date.now()); }catch(e){ console.error('[Love]', e); } }
  /* 她先开口（问候 / 好久不见 / 昨天没打卡）——必须排在 renderView 之后，
     否则气泡没有挂载点（#bubble-root 是随视图渲染出来的） */
  if(typeof Her !== 'undefined'){ try{ Her.onBoot(Date.now()); }catch(e){ console.error('[Her]', e); } }
  /* 她的通知：注册 Service Worker（file:// 或老浏览器会静默跳过，功能整体降级） */
  if(typeof Notify !== 'undefined'){ try{ Notify.register(); }catch(e){} }
  /* 摇一摇（v1.6a）：安卓这类不用问你的地方直接接上；iPhone 要你先点头 → 由她开口问一次 */
  if(typeof Shake !== 'undefined'){ try{ if(Shake.supported() && !Shake.needAsk()) Shake.attach(); }catch(e){} }
  setInterval(tick, 1000);

  /* 事件绑定 */
  const viewRoot = document.getElementById('view-root');
  viewRoot.addEventListener('click', e=>{
    const t = e.target.closest('[data-action]');
    if(!t) return;
    if(t.dataset.action==='open-space'){ goSpace(t.dataset.id); return; }
    Actions[t.dataset.action] && Actions[t.dataset.action](t, e);
  });
  /* 她在等你安静下来才开口：任何一次触碰都算「你在」；
     你在的时候她也不自顾自演戏——你一碰屏幕，她就把动作收起来看着你（v1.6a） */
  document.addEventListener('pointerdown', ()=>{
    if(typeof Love !== 'undefined') Love.touch();
    if(typeof Director !== 'undefined') Director.userTouch();
  }, {passive:true});
  /* 「对她说」输入框：回车 = 发送 */
  viewRoot.addEventListener('keydown', e=>{
    if(e.key !== 'Enter' || e.target.id !== 'mtalk-in') return;
    e.preventDefault();
    Actions['love-send']();
  });
  viewRoot.addEventListener('input', e=>{
    const t = e.target.closest('[data-oninput]');
    if(t && Actions[t.dataset.oninput]) Actions[t.dataset.oninput](t, e);
  });
  viewRoot.addEventListener('change', e=>{
    const t = e.target.closest('[data-onchange]');
    if(t && Actions[t.dataset.onchange]) Actions[t.dataset.onchange](t, e);
  });
  /* 长按（她的衣柜：按住某套服装 0.5 秒 = 删除，和星标入口同一套手感）：
     用委托，页面重绘也不用重新绑；触发后给元素打 __held 标记，
     紧随其后的 click（= 穿上）看到标记就跳过，两个动作不打架 */
  const HOLD_DEL_MS = 500;
  const holdAt = e => (e.target && e.target.closest) ? e.target.closest('[data-hold]') : null;
  viewRoot.addEventListener('pointerdown', e=>{
    const t = holdAt(e);
    if(!t) return;
    t.__held = false;
    t.classList.add('holding');
    clearTimeout(t.__holdT);
    t.__holdT = setTimeout(()=>{
      t.__holdT = null;
      t.__held = true;
      t.classList.remove('holding');
      if(Actions[t.dataset.hold]) Actions[t.dataset.hold](t, e);
    }, HOLD_DEL_MS);
  }, {passive:true});
  const cancelHold = e=>{
    const t = holdAt(e);
    if(!t) return;
    clearTimeout(t.__holdT);
    t.__holdT = null;
    t.classList.remove('holding');
  };
  viewRoot.addEventListener('pointerup', cancelHold, {passive:true});
  viewRoot.addEventListener('pointercancel', cancelHold, {passive:true});
  /* 顶栏按钮（返回/设置） */
  document.getElementById('app-header').addEventListener('click', e=>{
    const t = e.target.closest('[data-action]');
    if(t && Actions[t.dataset.action]) Actions[t.dataset.action](t, e);
  });
  /* 操控台/手势层内的事件（面板独立于 view-root，需单独分发） */
  const consoleRoot = document.getElementById('console-root');
  if(consoleRoot){
    consoleRoot.addEventListener('click', e=>{
      const t = e.target.closest('[data-action]');
      if(!t) return;
      if(t.dataset.action==='open-space'){ goSpace(t.dataset.id); return; }
      Actions[t.dataset.action] && Actions[t.dataset.action](t, e);
    });
    consoleRoot.addEventListener('input', e=>{
      const t = e.target.closest('[data-oninput]');
      if(t && Actions[t.dataset.oninput]) Actions[t.dataset.oninput](t, e);
    });
  }
  if(typeof Gestures !== 'undefined') Gestures.init();   // 纯净页手势：双击/长按四向
  const modalRoot = document.getElementById('modal-root');
  modalRoot.addEventListener('click', e=>{
    const t = e.target.closest('[data-action]');
    if(!t) return;
    if(t.dataset.action==='modal-close'){ UI.closeModal(); return; }
    if(Actions[t.dataset.action]) Actions[t.dataset.action](t, e);
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape') UI.closeModal();
  });
  /* v1.13.0 通用按钮 tick：点任何 [data-action] 按钮都有一声极轻的响。
     三个声音 chip（sound-toggle/sound-vol/bgm-toggle）除外——它们自己会响（试听/开关声），
     叠着响反而乱。手势音走 pointer 处理器、不产生 [data-action] 点击，天然不叠 */
  document.addEventListener('click', e=>{
    try{
      const t = e.target && e.target.closest ? e.target.closest('[data-action]') : null;
      if(!t) return;
      const a = t.getAttribute('data-action');
      if(a==='sound-toggle' || a==='sound-vol' || a==='bgm-toggle') return;
      if(typeof Snd !== 'undefined') Snd.play('ui');
    }catch(e2){}
  });
  /* 共享的隐藏文件框（v1.4.1 起支持多选）：回调统一收到「文件数组」，
     用几张由各处理器自己决定（multiple 每次都由调用方显式设置，避免串档） */
  document.getElementById('file-input').addEventListener('change', e=>{
    const cb = S.pendingFileCb; S.pendingFileCb = null;
    const files = e.target.files ? Array.from(e.target.files) : [];
    if(cb && files.length) cb(files);
  });
  /* 首次交互解锁音频（闹钟提示音 + v1.13.0 声音系统都需要） */
  document.addEventListener('pointerdown', function unlockAudio(){ Alarms.unlockAudio(); if(typeof Snd !== 'undefined') Snd.unlock(); }, {once:true});
  window.addEventListener('beforeunload', ()=>{ Store.set('heartbeat', {lastActiveAt:Date.now()}); });
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ if(typeof Snd !== 'undefined' && Snd._bgmEl){ try{ Snd._bgmEl.pause(); }catch(e){} } return; }
    if(typeof Snd !== 'undefined') Snd.apply();          // v1.13.0：回前台按「开关×音量×深夜」重刷一遍
    const back = ()=>{
      Store.set('heartbeat', {lastActiveAt:Date.now()});
      reconcileNow();
      scheduleRender();
    };
    if(Store.mode==='idb') Store.reload().then(back);   // 大容量模式：回到前台先重读新仓库
    else back();
  });
  /* 多标签页同步：大容量模式靠 BroadcastChannel + localStorage 哨兵键，兼容模式靠 storage 事件 */
  if(Store.bc) Store.bc.onmessage = ()=>{ Store.reload().then(()=>{ refreshFromStorage(); scheduleRender(); UI.toast('检测到数据在另一个标签页被修改，已同步'); }); };
  window.addEventListener('storage', e=>{
    if(e.key && e.key.startsWith(CONFIG.PREFIX)){
      const sync = ()=>{
        refreshFromStorage();
        scheduleRender();
        UI.toast('检测到数据在另一个标签页被修改，已同步');
      };
      if(Store.mode==='idb') Store.reload().then(sync);
      else sync();
    }
  });
  UI.toast('欢迎来到'+CONFIG.APP_NAME);
}

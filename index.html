  /* —— 我们的羁绊（她的空间 · 向上拉出）：等级/称号/经验条/台词解锁/经验来源 —— */
  mgrow(){
    const now = Date.now();
    const info = Grow.xpInfo();
    const caught = Grow.catchUp();      // 升级时你不在场 → 打开这页补报一次（幂等，只补一次）
    const lp = Grow.lineProgress();
    const streakText = info.todayChecked
      ? '已连续打卡 ' + info.streak + ' 天'
      : (info.streakYesterday > 0 ? '昨天已连续打卡 ' + info.streakYesterday + ' 天，今天还没打卡哦' : '今天还没有打卡记录');
    let h = '<section class="sec"><h2 class="sec-title">我们的羁绊<span class="sec-extra">她的成长进度</span></h2>';
    h += '<div class="grow-level">'+
      (caught ? '<div class="gl-catchup">🎉 这段时间你已经升到了 Lv.'+caught+' · '+esc(Grow.titleOf(caught))+'</div>' : '')+
      '<div class="gl-head"><div class="gl-lv">Lv.'+info.level+'</div><div class="gl-tit">'+esc(info.title)+'</div></div>'+
      '<div class="gl-bar"><i class="gl-fill" style="width:'+Math.round(info.pct*100)+'%"></i></div>'+
      '<div class="gl-meta">经验 '+info.cur+' / '+info.need+' · '+streakText+'</div>'+
      '<div class="gl-next">'+(info.next ? '下一个称号：Lv.'+info.next.level+' · '+esc(info.next.name) : '已达成最高称号 ✦')+'</div>'+
    '</div>';
    /* 她的本子（v1.18.0）：记的不是「做成了什么」，是「开始动了」——
       破土 / 松动 / 加速 / 稳态四层，全部从既有数据推出来，没有一条是新采集的；
       ✎ 那种日期是浅蓝的行 = 你自己写上去的（机器看不见的那些） */
    const lns = Achv.lines();
    /* ★ v1.19.0：本子越记越厚，全摊在羁绊页上会把页面撑得老长（她报的）——
       现在只露最上面 HOME_N 行，其余的点右上角「全部 ›」翻整本（见 Views.achvall） */
    const hn = CONFIG.ACHV.HOME_N, more = lns.length - hn;
    h += '<div class="card pad" style="margin-top:12px">'+
      '<div class="gl-sec-t">她的本子 <span class="gl-sec-n" style="margin-left:auto">'+(lns.length ? lns.length+' 行' : '还空着')+'</span>'+
        (more > 0 ? '<button class="sec-link" style="margin-left:0" data-action="goto-achvall">全部 ›</button>' : '')+'</div>'+
      (lns.length
        ? lns.slice(0, hn).map(L =>
            '<div class="achv-row'+(L.mine ? ' mine' : '')+'">'+
              '<span class="achv-d">'+esc(D.fmtDateShort(L.dk || D.dateKey(L.at || now))) + (L.mine ? ' ✎' : '')+'</span>'+
              '<span class="achv-t">'+esc(L.text)+'</span>'+
            '</div>').join('')
        : '<div class="achv-empty">本子摊开着，第一页还是白的。<br>你做完第一件小事的那天，我就写上第一行。</div>')+
      (more > 0 ? '<div class="hint">再往前还有 '+more+' 行压在下面——点右上角「全部 ›」翻整本。</div>' : '')+
      '<button class="btn" style="width:100%;margin-top:10px" data-action="achv-write">✎ 我自己写一行</button>'+
      '<div class="hint" style="margin-top:8px">'+esc(CONFIG.ACHV.FOOT)+
        '这本子记的不是「你做成了什么」，是「你开始动了」——变化还没发生、但已经在发生的那一下。'+
        '机器看不见的那些（想通了一直卡着的事、给以后埋的伏笔），点上面的笔自己写。</div>'+
    '</div>';
    /* 台词解锁进度 */
    h += '<div class="card pad" style="margin-top:12px">'+
      '<div class="gl-sec-t">台词解锁 <span class="gl-sec-n">'+lp.have+' / '+lp.total+' 句</span></div>'+
      '<div class="gl-bar gl-bar--line"><i class="gl-fill" style="width:'+Math.round(lp.have/lp.total*100)+'%"></i></div>'+
      '<div class="hint">'+(lp.next ? '下一批台词在 Lv.'+lp.next+' 解锁' : '所有台词都解锁啦，她什么都愿意对你说 ✦')+
        '（Lv.1 起 8 句，Lv.5 / Lv.10 / Lv.20 各解锁一批）</div>'+
    '</div>';
    /* 经验来源 */
    h += '<div class="card pad" style="margin-top:12px">'+
      '<div class="gl-sec-t">经验怎么来的</div>'+
      '<div class="gl-src"><span class="gls-ico">💗</span>可能性递归 · 每专注 1 分钟 <b>+1</b></div>'+
      '<div class="gl-src"><span class="gls-ico">✅</span>完成待办 · 每完成一项 <b>+20</b></div>'+
      '<div class="gl-src"><span class="gls-ico">📝</span>可能性确定 · 每写一条记录 <b>+5</b></div>'+
      '<div class="gl-src"><span class="gls-ico">🔥</span>连续打卡 · 当天额外 <b>+（连续天数×2）</b>，封顶 +20</div>'+
      '<div class="hint">这天里有下面任意一件事就算打卡：专注过（哪怕1分钟）、完成过待办、写过记录。'+
        '等级是你全部记录的真实镜像——撤销完成、删掉记录，等级会跟着回落，不刷分也不冤枉你。</div>'+
    '</div>';
    h += '<div class="hint">完成待办时会有小点心飞给她哦～</div>';
    h += '</section>';
    return h;
  },
  /* —— 她眼中的我（她的空间 · 向右拉出）：她汇报她知道的你（只读，不改任何数据） —— */
  mcons(){
    const now = Date.now();
    const st = Grow.stats(now);
    const dk = D.dateKey(now);
    const mood = (dayDoc(dk) || {}).dayMood;
    const emo = (mood && mood.emoji) ? mood.emoji : '·';
    const tapTags = (mood && mood.tags && mood.tags.length) ? mood.tags.join(' · ') : '还没记今天的心情';
    const sp = st.topId ? spaceById(st.topId) : null;
    const says = Grow.herWords(st, sp);
    let h = '<section class="sec"><h2 class="sec-title">她眼中的我<span class="sec-extra">她记得的你</span></h2>';
    /* 她 + 开场 */
    h += '<div class="mcons-hero">'+
      '<div class="mcons-ava">'+Grow._miniHtml()+'</div>'+
      '<div class="mcons-bub">'+esc(says[0])+'</div>'+
    '</div>';
    /* 我们之间（v1.5）：好感度与关系阶段 */
    h += this._loveBlock(now);
    /* 她记下的数字 */
    h += '<div class="stat-row">'+
      '<div class="stat"><div class="stat-v num">'+st.streak+'</div><div class="stat-k">连续打卡（天）</div></div>'+
      '<div class="stat"><div class="stat-v num">'+fmtMin(st.min)+'</div><div class="stat-k">陪你专注</div></div>'+
      '<div class="stat"><div class="stat-v num">'+st.done+'</div><div class="stat-k">完成的事</div></div>'+
      '<div class="stat"><div class="stat-v num">'+st.rec+'</div><div class="stat-k">记录条数</div></div>'+
    '</div>';
    /* 最近在忙的空间 */
    h += '<div class="card pad" style="margin-top:14px">'+
      '<div class="gl-sec-t">最近在忙的空间</div>'+
      (sp ? '<div class="mcons-space" style="--sc:'+sp.color+'">'+
              '<span class="ms-ico">'+esc(sp.icon||'✦')+'</span>'+
              '<span class="ms-name">'+esc(sp.name)+'</span>'+
              '<span class="ms-min num">'+fmtMin(st.topMin)+'</span>'+
            '</div>'+
            '<div class="hint">这是你陪它最久的一个，累计 '+fmtMin(st.topMin)+'。</div>'
          : '<div class="hint">还没有专注记录——拖一个空间到操控台的投放区，我们就一起开始吧。</div>')+
    '</div>';
    /* 今天的心情 */
    h += '<div class="card pad" style="margin-top:12px">'+
      '<div class="gl-sec-t">今天的你</div>'+
      '<div class="mcons-mood"><span class="mm-emo">'+emo+'</span>'+
        '<span class="mm-tag">'+esc(tapTags)+'</span></div>'+
      '<div class="hint">在「我们的共识」页的日期条上点 🙂 就能记下这一天的心情。</div>'+
    '</div>';
    /* 她想对你说的话 */
    h += '<div class="card pad" style="margin-top:12px">'+
      '<div class="gl-sec-t">她想对你说</div>';
    for(let i=1;i<says.length;i++) h += '<div class="mcons-line">'+esc(says[i])+'</div>';
    h += '<div class="hint">她会一直看着你的记录，也一直记得。</div></div>';
    h += '</section>';
    return h;
  },
  /* —— 她的日记（她的空间 · 向下拉出 v1.4）——
     今天的这篇是实时写的（永远最新）；过了这一天就定稿冻结，之后再也不会变。
     下面还有「她替你记着的」：她盯着的老待办与好久没碰的空间（实时推导，不落库） */
  mdairy(){
    const now = Date.now();
    /* 「读她的日记」+2（每天一次，同上：涨满就不再写库） */
    if(typeof Love !== 'undefined') Love.gain('diary', now);
    const today = D.dateKey(now);
    const dk = S.mdiaryDay || today;
    const isToday = dk === today;
    const d = HerDiary.of(dk, now);
    const watch = HerDiary.watch(now);
    let h = '<section class="sec"><h2 class="sec-title">她的日记<span class="sec-extra">她记下的你</span></h2>';
    /* 日期条 */
    h += '<div class="card daynav">'+
      '<button class="icon-btn" data-action="md-day-prev" aria-label="前一天">◀</button>'+
      '<div class="nav-date">'+D.fmtDateCN(D.dkToTs(dk))+
        (isToday?' · <span style="color:var(--accent)">今天</span>':'')+
        '<div class="md-sub">'+(isToday?'今天还没过完，我还在写':'这一天已经写好了')+'</div></div>'+
      (isToday
        ? '<button class="icon-btn" aria-label="已是今天" style="opacity:.3">▶</button>'
        : '<button class="icon-btn" data-action="md-day-next" aria-label="后一天">▶</button>'+
          '<button class="btn btn--small" data-action="md-day-today">回到今天</button>')+
    '</div>';
    /* 她的日记本体（像一页纸） */
    h += '<div class="md-paper">'+
      '<div class="md-head">'+
        '<div class="mcons-ava">'+Grow._miniHtml()+'</div>'+
        '<div style="flex:1;min-width:0"><div class="md-t">'+(isToday?'今天，我一直在看着你':'那一天的你')+'</div>'+
          '<div class="md-d">'+D.fmtDateCN(D.dkToTs(dk))+(d.mood&&d.mood.emoji?' · 心情 '+d.mood.emoji:'')+'</div></div>'+
      '</div>'+
      d.lines.map(x=>'<p class="md-line">'+esc(x)+'</p>').join('')+
      '<div class="md-sign">—— 我记着呢，你只管往前</div>'+
    '</div>';
    /* 她记下的数字 */
    h += '<div class="stat-row" style="margin-top:14px">'+
      '<div class="stat"><div class="stat-v num">'+fmtMin(d.facts.min)+'</div><div class="stat-k">那天专注</div></div>'+
      '<div class="stat"><div class="stat-v num">'+d.facts.done+'</div><div class="stat-k">完成的事</div></div>'+
      '<div class="stat"><div class="stat-v num">'+d.facts.rec+'</div><div class="stat-k">记录条数</div></div>'+
      '<div class="stat"><div class="stat-v num">'+d.facts.streak+'</div><div class="stat-k">连续第几天</div></div>'+
    '</div>';
    /* 她替你记着的（她惦记的事） */
    h += '<div class="card pad" style="margin-top:14px">'+
      '<div class="gl-sec-t">她替你记着的 <span class="gl-sec-n">'+watch.length+' 件</span></div>';
    if(!watch.length){
      h += '<div class="hint">现在没有需要她操心的事——你交出去的每一件都办好了，或者还没到她会惦记的时候。</div>';
    }else{
      for(const a of watch.slice(0, 6)){
        const sp = a.kind === 'space' ? spaceById(a.id.slice(6)) : null;
        const color = sp ? sp.color : (a.kind === 'space' ? '#9B7EDE' : '#E8A33D');
        const ico = a.kind === 'space' ? '🌱' : '📌';
        h += '<div class="md-watch" style="--wc:'+color+'">'+
          '<span class="mw-ico">'+ico+'</span>'+
          '<span class="mw-t">'+esc(a.text)+'</span>'+
          '<span class="mw-d">'+a.days+' 天'+(a.askedDk?' · 问过了':'')+'</span>'+
        '</div>';
      }
      h += '<div class="hint">拖得越久的事，她越想问你一句——问过一次就不再追问了。</div>';
    }
    h += '</div>';
    h += '<div class="hint">她的日记每天过了午夜就写好、不再改动；今天这篇会跟着你一起长。</div>';
    h += '</section>';
    return h;
  },
  /* —— 一起玩吧（她的空间 · 向左拉出，v1.6a 由「服装」升级而来）：
     她的表情差分 / Q版 / 动作图（一组槽位，缺哪张都能跑）+ 衣柜（回退用，也是老用户的东西） —— */

      const id = HerBody.id(form, key);
      const pic = id
        ? '<img src="'+Store.getImage(id)+'" alt="" draggable="false" onerror="this.style.display=\'none\'">'
        : '<span class="bs-empty">＋</span>';
      return '<button class="body-slot'+(id?' on':'')+'" data-action="body-upload" data-form="'+form+'" data-key="'+key+'">'+
        (id ? '<span class="bs-x" data-action="body-clear" data-form="'+form+'" data-key="'+key+'" aria-label="清空">×</span>' : '')+
        '<span class="bs-pic">'+pic+'</span>'+
        '<span class="bs-n">'+esc(name)+'</span>'+
        '<span class="bs-tag">'+(id ? '已收好' : '点我上传')+'</span>'+
      '</button>';
    }).join('') + '</div>';
    let h = '<section class="sec"><h2 class="sec-title">一起玩吧<span class="sec-extra">她的样子</span></h2>';
    /* 现在的她 */
    h += '<div class="moutfit-cur">'+
      '<div class="mo-ava">'+ HerBody.imgHtml('normal', Emo.slot(), {small:true}) +'</div>'+
      '<div style="flex:1;min-width:0"><div class="mo-k">现在的她</div><div class="mo-n">'+esc(HerBody.lookName())+'</div>'+
        '<div class="mo-k" style="margin-top:4px">此刻心情：'+esc(CONFIG.BODY.EMO_TEXT[Emo.get()] || '平静')+'</div></div>'+
    '</div>';

    h += '<div class="card pad" style="margin-top:12px">'+
      '<div class="gl-sec-t">表情差分 <span class="gl-sec-n">'+esc(CONFIG.BODY.FORM_HINT.normal)+'</span></div>'+
      grid('normal')+
      '<div class="hint">传「开心/难过/生气/困了」这几张，她的表情就会跟着心情变：'+
        '完成待办她会开心、待办变红她会担心、你连戳她五下她会生气、深夜里她会困。'+
        '没传的槽位她自动用「普通」那张顶上，功能照跑。</div>'+
      '<div class="hint" style="margin-top:6px">图的要求：<b>透明背景 PNG</b>；同一套尽量同尺寸同构图（只换表情，切换才不跳）；'+
        '最长边 1024px 以内；Q版 512px 以内。<b>用 AI 生图时，先出满意的那张「普通」，再拿它当参考图只改表情词</b>，'+
        '这样才像同一个她。</div>'+
    '</div>';
    h += '<div class="card pad" style="margin-top:12px">'+
      '<div class="gl-sec-t">Q版小人 <span class="gl-sec-n">'+esc(CONFIG.BODY.FORM_HINT.q)+'</span></div>'+
      grid('q')+
    '</div>';
    h += '<div class="card pad" style="margin-top:12px">'+
      '<div class="gl-sec-t">动作图 <span class="gl-sec-n">'+esc(CONFIG.BODY.FORM_HINT.acts)+'</span></div>'+
      grid('acts')+
      '<div class="hint">动作图是「她做某个动作时换上」的那一张：抱膝坐下、睡着、受惊、扒着屏幕边偷看你、'+
        '拉页面。她本来就是会动的（蹦跳、扭一扭、走近走远都不用图），这几张是给需要换姿势的那几幕用的。</div>'+
    '</div>';
    /* 衣柜（回退用：没传的槽位会自动用这里选的那套） */
    h += '<div class="card pad" style="margin-top:12px">'+
      '<div class="gl-sec-t">衣柜 <span class="gl-sec-n">没传的槽位自动用这套</span></div>'+
      '<div class="chip-row">'+
        '<button class="chip'+(mId==null?' on':'')+'" data-action="outfit-wear" data-id="">📁 系统默认的她</button>'+
        '<button class="chip'+(mId==='placeholder'?' on':'')+'" data-action="outfit-wear" data-id="placeholder">🐣 内置小可爱</button>'+
        ids.map((id, i)=>'<button class="chip mo-chip'+(mId===id?' on':'')+'" data-action="outfit-wear" data-id="'+esc(id)+'" data-hold="outfit-del">'+
          '<img src="'+Outfit.src(id)+'" alt="" draggable="false">'+
          '<span class="mo-tag">第 '+(i+1)+' 套</span></button>').join('')+
      '</div>'+
      '<button class="btn btn--primary btn--block" data-action="outfit-upload" style="margin-top:12px">＋ 上传新的一套（可多选，长按某套 0.5 秒删除）</button>'+

    '</div>';

    h += '<div class="card pad" style="margin-top:12px">'+
      '<div class="gl-sec-t">大小与位置</div>'+
      '<div class="hint">纯净首页按住她单指拖动位置 · 双指捏合缩放（0.6~1.6 倍）</div>'+
      '<button class="btn btn--small" data-action="outfit-reset-pos" style="margin-top:8px">还原默认大小与位置</button>'+
    '</div>';
    h += '</section>';
    return h;
  },
  /* —— 「我们之间」区块（v1.5）：好感条 + 当前阶段 + 你们认识多少天 ——
     放在「她眼中的我」里——她记得的你 + 你们的关系，本来就是一页 */
  _loveBlock(now){
    const st = Love.stage(), nx = Love.nextStage(), total = Love.total();
    const to = nx ? nx.min : null;
    const pct = to ? clamp((total - st.min) / Math.max(1, to - st.min), 0, 1) : 1;
    let h = '<div class="card pad lv-block">'+
      '<div class="gl-sec-t">我们之间 <span class="gl-sec-n">认识第 ' + Love.daysTogether(now) + ' 天</span></div>'+

      '<div class="hint">'+esc(st.desc)+'。好感只来自你和她相处的时间——戳戳她、来她的空间、翻她的日记、回答她的问题；'+

  /* —— 纯净看板娘首页（背景+立绘两层分离，无静态UI，一切由手势呼出） —— */
  home(){
    const now = Date.now();
    const dkToday = D.dateKey(now);
    const act = Rhythm.activeManual();
    /* 日期/时间字号可在设置里自定义（默认日期15px · 时间36px） */

           '<button class="pure-clock num" data-action="open-alarm" aria-label="闹钟" data-bind="bigclock">--:--:--</button>'+

    /* ★ v1.8.1（她要求的「移除纯净主页右上角的图标，在她的世界里显示就够了」）：
       首页右上角那个 📖 拿掉了 —— 首页读剧情走底下那个「故事框」（见 Talk.box） */
    /* 看板娘气泡（提醒用，点击可跳转）+ 她旁边那个「故事框」 */

    /* 底部角落：最优先待办（实时倒计时，点=待办页）· 正在递归（点=节律表）· 今日剩余额度（点=节律表） */
    let urgent = null;
    for(const t of S.todos){
      if(t.archived || todoStatus(t, now)==='done') continue;
      const due = TodoLogic.dueAt(t, now);
      if(due == null) continue;
      if(!urgent || due < TodoLogic.dueAt(urgent, now)) urgent = t;

    h += '<div class="pure-bottom">'+

             (urgent ? '<button class="minichip" data-bind="urgent" data-id="'+urgent.id+'" data-action="goto-todos" style="color:var(--red)">'+
                        '最优先：<b class="ut">'+esc(urgent.title)+'</b> · <span class="num" data-cd>'+fmtRemain(TodoLogic.dueAt(urgent, now)-now)+'</span></button>' : '')+
             (act ? '<button class="minichip" data-bind="rec" data-space="'+act.spaceId+'" data-action="goto-rhythm" style="color:var(--accent-dark)">'+
                      '<span class="pulse-dot"></span> '+esc(spaceNameOf(act.spaceId))+' · <span class="num" data-rec-t>'+fmtDur(now-act.start)+'</span></button>' : '')+
           '</div>'+
           '<div class="mini-chips right">'+
             '<button class="minichip" data-action="goto-rhythm" aria-label="节律表">剩余 <b data-bind="quota-mini">--</b></button>'+
             /* 桌面端：右下时间带面板（今日24小时递归带，进行中时显示实时计时） */
             '<div class="desk-band">'+
               '<div class="db-head"'+(act ? ' data-bind="rec" data-space="'+act.spaceId+'"' : '')+'>'+
                 (act ? '<span class="pulse-dot"></span> 正在递归：'+esc(spaceNameOf(act.spaceId))+' · <span class="num" data-rec-t>'+fmtDur(now-act.start)+'</span>'
                      : '今日递归时间带')+
               '</div>'+
               '<div class="rh-track">'+
                 S.sessions.filter(s=>s.day===dkToday && s.end!=null).sort((a,b)=>a.start-b.start).map(s=>bandHtml(s,false)).join('')+
                 Rhythm.activeSlices().filter(s=>s.day===dkToday).map(s=>bandHtml(s,true)).join('')+
                 '<div class="rh-now" data-bind="nowline" style="left:'+((now-D.dkToTs(dkToday))/86400000*100).toFixed(3)+'%"></div>'+
               '</div>'+
             '</div>'+
           '</div>'+
         '</div>';
    h += '<div class="pure-hint">双击呼出节律表操控台 · 长按滑动切换页面</div>';

  },
  /* —— 每日总结页（长按右滑进入）：日历 + 「干了什么」+「积累了什么」 —— */
  summary(){
    const now = Date.now();
    const today = D.dateKey(now);
    const dk = S.sumDay || today;
    const isTodayView = dk === today;
    const vNow = D.dkToTs(dk) + 86400000 - 1;
    const doc = dayDoc(dk);
    const Q = Rhythm.quotaFor(dk);
    const consumed = Rhythm.consumedMinutes(dk, now);
    const remain = Math.max(0, Q - consumed);
    let h = '';
    /* 日期时间板块（和旧首页一样：实时时钟，点击=隐藏的闹钟入口） */
    h += '<div class="card card--mark home-hero" data-action="open-alarm">'+
           '<div class="hero-date" data-bind="bigdate"></div>'+
           '<div class="hero-clock num" data-bind="bigclock"></div>'+
         '</div>';
    h += '<section class="sec"><h2 class="sec-title">我们的共识<span class="sec-extra">'+(isTodayView?'今天':'回看')+'这一天干了什么 · 积累了什么</span></h2>';
    /* 月历：点任意一天 → 跳到那一天总结（今天粗框、有记录的点圆点、已选高亮）
       标题行中间的「年月」可点，收起/展开整个日历（收起状态记在设置里） */
    if(!S.sumCalY){ const d = new Date(); S.sumCalY = d.getFullYear(); S.sumCalM = d.getMonth(); }
    const calOpen = S.settings.sumCalOpen !== false;
    const first = new Date(S.sumCalY, S.sumCalM, 1);
    const startWd = first.getDay();
    const daysIn = new Date(S.sumCalY, S.sumCalM+1, 0).getDate();
    /* 日期条（今天+表情）在最上面，日历紧贴其下 */
    h += dayNavHtml('sum');
    h += '<div class="card pad" style="margin-top:10px;margin-bottom:12px">'+
      '<div class="cal-head">'+
        '<button class="icon-btn" data-action="sum-cal-prev" aria-label="上个月">◀</button>'+
        '<button class="cal-title" data-action="sum-cal-toggle" aria-label="收起或展开日历">'+D.ym(S.sumCalY, S.sumCalM+1)+' <span class="cal-caret">'+(calOpen?'▾ 收起':'▸ 展开')+'</span></button>'+
        '<button class="icon-btn" data-action="sum-cal-next" aria-label="下个月">▶</button>'+
      '</div>';
    if(calOpen){
      h += '<div class="cal-grid cal-wd">'+'日一二三四五六'.split('').map(w=>'<span>'+w+'</span>').join('')+'</div>'+
           '<div class="cal-grid" style="margin-top:4px">';
      for(let i=0;i<startWd;i++) h += '<span></span>';
      for(let d=1;d<=daysIn;d++){
        const dk2 = S.sumCalY+'-'+pad2(S.sumCalM+1)+'-'+pad2(d);
        const mood = (Store.loadDay(dk2)||{}).dayMood;
        h += '<button class="cal-day'+(dk2===today?' today':'')+(dk2===dk?' sel':'')+(dayHasData(dk2)?' has':'')+'" data-action="sum-cal-day" data-dk="'+dk2+'">'+
               '<span class="cal-n">'+d+'</span>'+
               (mood&&mood.emoji?'<span class="cal-e">'+mood.emoji+'</span>':'')+
             '</button>';
      }
      h += '</div>';
    }else{
      h += '<div class="hint" style="font-size:11.5px;color:var(--text-2)">日历已收起 · 点上方月份可展开</div>';
    }
    h += '</div>';
    h += '</section>';
    /* ──── 干了什么 ──── */
    h += '<section class="sec"><h2 class="sec-title">干了什么</h2>';
    /* 24小时递归圆圈：整圈=一天，扇形色块=一段可能性递归（替代原来的横向时间带） */
    const hasRec = S.sessions.some(s=>s.day===dk && s.end!=null) ||
                   (isTodayView && Rhythm.activeSlices().some(s=>s.day===dk));
    h += '<div class="sec-sub">'+(isTodayView?'今日':'当日')+'递归圆圈</div>'+
         '<div class="card pad">'+ dayRingHtml(dk, isTodayView, now) +
         '<div class="hint" style="font-size:11px;color:var(--text-2);margin-top:10px;text-align:center">'+
           (hasRec ? '整圈 = 一天24小时 · 扇形色块 = 一段递归（颜色 = 空间，悬停看细节）' : '这一天还没有递归记录')+
         '</div></div>';
    /* 节律递归时间进度卡（排在圆圈下面） */
    h += '<div class="card card--mark pad" style="margin-top:14px"'+(isTodayView?' data-bind="quota"':'')+'>'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">'+
        '<div style="font-weight:700;font-size:14.5px">节律递归时间</div>'+
        '<div class="num" style="font-size:12.5px;color:var(--text-2)">'+(isTodayView?'今日':'当日')+'额度 '+fmtMin(Q)+'</div>'+
      '</div>'+
      '<div class="prog" style="height:8px"><div class="prog-bar" data-q-bar style="width:'+Math.min(100, consumed/Q*100).toFixed(1)+'%"></div></div>'+
      '<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px">'+
        '<span style="color:var(--text-2)">已消耗 <b class="num" data-q-used>'+fmtMin(consumed)+'</b></span>'+
        '<span>剩余 <b class="num" data-q-remain style="color:var(--accent)">'+fmtMin(remain)+'</b></span>'+
      '</div></div>';
    /* 自流转课程表状态 */
    h += '<div class="sec-sub" style="margin-top:4px">自流转日程</div>';
    h += slotListHtml(dk, false);
    /* 当日待办 */
    const dayTodos = S.todos.filter(x=>!x.archived && isTodayTodo(x, vNow));
    const doneCnt = dayTodos.filter(x=>todoStatus(x, vNow)==='done').length;
    h += '<div class="sec-sub" style="margin-top:14px">当日待办完成情况'+
         '<span class="cnt">'+dayTodos.length+'</span><span class="cnt" style="color:var(--green)">✓ '+doneCnt+'</span></div>';
    if(dayTodos.length===0){
      h += '<div class="hint" style="font-size:12px;color:var(--text-2)">这一天没有待办</div>';
    }else{
      /* 排序：未办的排前面（其中剩余时间最少的在最上面，无期限备忘垫底），
         已办好的排在后面（其中最后办好的在最上面） */
      const sorted = [...dayTodos].sort((a,b)=>{
        const da = todoStatus(a, vNow)==='done' ? 1 : 0;
        const db = todoStatus(b, vNow)==='done' ? 1 : 0;
        if(da !== db) return da - db;
        if(da === 1) return (b.completedAt||0) - (a.completedAt||0);   // 已办好：最后办好的最上面
        const ua = TodoLogic.dueAt(a, vNow), ub = TodoLogic.dueAt(b, vNow);
        if(ua==null && ub==null) return 0;                              // 都无期限：保持原顺序
        if(ua==null) return 1;                                          // 无期限的排在有期限的后面
        if(ub==null) return -1;
        return ua - ub;                                                 // 剩余越少越靠前（超时的最靠前）
      });
      for(const t of sorted) h += todoCardHtml(t, isTodayView ? now : vNow, isTodayView);
    }
    /* 时间轴日记（v1.1 起归属「我们的共识」：任意一天都能补记/编辑/删除） */
    const entries = [...(doc.rhythmEntries||[])].sort((a,b)=>a.at<b.at?-1:1);
    h += '<div class="sec-sub" style="margin-top:14px">时间轴日记'+
         (entries.length?'<span class="cnt">'+entries.length+'</span>':'')+
         /* v1.8.0：这一页只显示这一天；「全部 ›」去总览页（所有天、按月筛、随便改） */
         '<button class="sec-link" data-action="goto-tdiary">全部 ›</button></div>';
    h += '<button class="btn btn--primary btn--block" data-action="sum-entry" style="margin-bottom:12px">＋ 记录想法'+(isTodayView?'（此刻）':'')+'</button>';
    if(entries.length===0){
      h += '<div class="empty"><span class="empty-ico">📔</span>以时间为标签的日记<br>记录一天24小时的想法与活动</div>';
    }else{
      for(const en of entries){
        h += '<div class="card pad rh-entry" style="margin-bottom:8px">'+
               '<div style="display:flex;justify-content:space-between;align-items:center">'+
                 '<span class="rh-time num">'+esc(en.at)+'</span>'+
                 '<span style="display:flex">'+
                   '<button class="icon-btn" data-action="sum-entry" data-id="'+en.id+'" style="width:26px;height:26px" aria-label="编辑">✎</button>'+
                   '<button class="icon-btn" data-action="sum-entry-del" data-id="'+en.id+'" style="width:26px;height:26px" aria-label="删除">🗑</button>'+
                 '</span>'+
               '</div>'+
               (en.text?'<div style="font-size:13px;white-space:pre-wrap;margin-top:4px">'+esc(en.text)+'</div>':'')+
               imgsHtml(en.images)+
             '</div>';
      }
    }
    h += '</section>';
    /* ──── 积累了什么 ──── */
    h += '<section class="sec"><h2 class="sec-title">积累了什么</h2>';
    const rows = S.spaces.map(sp=>{
      const recs = spaceRecordsOf(dk, sp.id);
      return {sp, min:Rhythm.daySpaceMinutes(dk, sp.id), recs:recs.length,
              adds:S.catnotes.filter(n=>!n.archived && n.spaceId===sp.id && D.dateKey(n.createdAt)===dk).length};
    }).filter(x=>x.min>0 || x.recs>0 || x.adds>0).sort((a,b)=>b.min-a.min);
    if(rows.length===0){
      h += '<div class="empty"><span class="empty-ico">✦</span>这一天还没有积累'+(isTodayView?'<br>去「空间」页做几条可能性确定，或开始一次递归吧':'')+'</div>';
    }else{
      for(const x of rows){
        const m = (doc.spaceMood||{})[x.sp.id];
        h += '<div class="card pad" style="margin-bottom:8px;display:flex;align-items:center;gap:10px">'+
               '<div class="sp-ico" style="background:'+x.sp.color+'1A;flex:none">'+esc(x.sp.icon||'✦')+'</div>'+
               '<div style="flex:1;min-width:0">'+
                 '<div style="font-weight:700;font-size:14px">'+esc(x.sp.name)+
                   (m&&m.emoji?' <span style="font-size:15px">'+m.emoji+'</span>':'')+'</div>'+
                 '<div style="font-size:12px;color:var(--text-2)">'+
                   '<span class="num">递归 '+fmtMin(x.min)+'</span> · '+
                   '<span class="num">可能性确定 '+x.recs+' 条</span>'+
                   (x.adds?' · 迭代笔记 +'+x.adds:'')+
                 '</div>'+
               '</div>'+
               '<button class="btn btn--small" data-action="go-space" data-id="'+x.sp.id+'">查看</button>'+
             '</div>';
      }
    }
    if(!isTodayView) h += '<button class="btn btn--primary btn--block" data-action="sum-day-today" style="margin-top:6px">回到今天</button>';
    h += '</section>';
    return h;
  },
  /* —— 事务待办 —— */
  todos(){
    const now = Date.now();
    const list = S.todos.filter(x=>!x.archived);
    const pending = [], done = [];
    for(const t of list){ (todoStatus(t, now)==='done' ? done : pending).push(t); }
    pending.sort((a,b)=>{
      const da = TodoLogic.dueAt(a, now), db = TodoLogic.dueAt(b, now);
      if(da==null) return 1; if(db==null) return -1; return da-db;
    });
    /* ★ v1.15.0（她点名的）：这一页只显示「待办 + 今天已完成的」——
       更早完成的只记录不显示，要去「我们的共识」按日期回看 */
    const todayDk = D.dateKey(now);
    const doneToday = [], doneOld = [];
    for(const t of done){
      (t.completedAt && D.dateKey(t.completedAt) === todayDk ? doneToday : doneOld).push(t);
    }
    doneToday.sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));
    let h = '<section class="sec"><h2 class="sec-title">事务待办</h2>';
    h += '<button class="btn btn--primary btn--block" data-action="todo-form" style="margin-bottom:6px">＋ 新建待办</button>';
    h += '<div class="sec-sub">进行中<span class="cnt">'+pending.length+'</span></div>';
    if(pending.length===0){
      h += '<div class="empty"><span class="empty-ico">☀</span>没有进行中的待办<br><span style="font-size:12px">点上方「新建待办」开始记录</span></div>';
    }else{
      for(const t of pending) h += todoCardHtml(t, now);
    }
    if(doneToday.length>0){
      h += '<div class="sec-sub">今天已完成<span class="cnt">'+doneToday.length+'</span><span style="font-weight:400;letter-spacing:0">点击灰色卡片可恢复为未完成</span></div>';
      for(const t of doneToday) h += todoCardHtml(t, now);
    }
    if(doneOld.length>0){
      h += '<div class="hint" style="font-size:12px;color:var(--text-2)">更早完成的 '+doneOld.length+' 件在「我们的共识」里按日期回看</div>';
    }
    h += '</section>';
    return h;
  },
  /* —— 可能性空间列表 —— */
  spaces(){
    const active = S.spaces.filter(x=>!x.archived);
    let h = '<section class="sec"><h2 class="sec-title">可能性空间<span class="sec-extra">每个兴趣，像一本书</span></h2>';
    if(active.length===0){
      h += '<div class="empty"><span class="empty-ico">◇</span>创建你的第一个可能性空间<br>比如：学日语 · 拍视频 · 画画 · cos</div>';
    }else{
      h += '<div class="grid-2">';
      for(const sp of active){
        h += '<div class="space-card" data-action="open-space" data-id="'+sp.id+'" style="--sc:'+sp.color+'">'+
               '<div class="space-ico">'+esc(sp.icon||'✦')+'</div>'+
               '<div class="space-name">'+esc(sp.name)+'</div>'+
               '<div class="space-meta">'+(sp.categories||[]).length+' 个确定性迭代</div>'+
             '</div>';
      }
      h += '</div>';
    }
    h += '<div class="grid-2" style="margin-top:12px"><div class="space-card add-card" data-action="add-space">'+

  /* —— 节律表（支持浏览任意一天） —— */
  rhythm(){
    const now = Date.now();
    const dk = D.dateKey(now);
    const rd = S.rhythmDay || dk;                       // 正在查看的日期
    const isTodayView = rd === dk;
    const doc = dayDoc(rd);
    const spaces = S.spaces.filter(x=>!x.archived);
    const Q = Rhythm.quotaFor(rd);
    const consumed = Rhythm.consumedMinutes(rd, now);
    const remain = Math.max(0, Q - consumed);
    let h = '<section class="sec"><h2 class="sec-title">节律表</h2>';
    /* 历史浏览条（含日历选择与全局情绪） */
    h += dayNavHtml('rhythm');
    /* 统计卡 */
    h += '<div class="card card--mark pad"'+(isTodayView?' data-bind="quota"':'')+' style="margin-bottom:16px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px">'+
        '<div style="font-weight:700;font-size:15px">节律递归时间</div>'+
        '<button class="btn btn--small num" data-action="quota-edit" style="flex:none">'+(isTodayView?'今日额度':'当日额度')+' '+fmtMin(Q)+' ✎</button>'+
      '</div>'+
      '<div class="prog" style="height:10px"><div class="prog-bar" data-q-bar style="width:'+Math.min(100, consumed/Q*100).toFixed(1)+'%"></div></div>'+
      '<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px">'+
        '<span style="color:var(--text-2)">已消耗 <b class="num" data-q-used>'+fmtMin(consumed)+'</b></span>'+
        '<span>剩余 <b class="num" data-q-remain style="color:var(--accent)">'+fmtMin(remain)+'</b></span>'+
      '</div>';
    const bySpace = spaces.map(sp=>({sp, min:Rhythm.daySpaceMinutes(rd, sp.id)})).filter(x=>x.min>0);
    if(bySpace.length){
      h += '<div class="sec-sub" style="margin:12px 0 4px">可能性递归时间 · 当日转化</div>';
      for(const x of bySpace){
        h += '<div class="kv"><span class="k"><span class="dot" style="background:'+x.sp.color+'"></span>'+esc(x.sp.name)+'</span><span class="v num">'+fmtMin(x.min)+'</span></div>';
      }
    }else{
      h += '<div class="hint" style="font-size:12px;color:var(--text-2);margin-top:10px">'+
        (isTodayView ? '今日还没有可能性递归消耗 — 在下方空间卡片点击「可能性递归」开始' : '这一天没有可能性递归消耗记录')+'</div>';
    }
    h += '</div>';
    /* 24h 时间带 */
    const slices = S.sessions.filter(s=>s.day===rd && s.end!=null).sort((a,b)=>a.start-b.start);
    const activeSlices = isTodayView ? Rhythm.activeSlices().filter(s=>s.day===rd) : [];
    h += '<div class="sec-sub">'+(isTodayView?'今日':'当日')+'递归时间带</div>';
    h += '<div class="rh-track">'+
           slices.map(s=>bandHtml(s, false)).join('')+
           activeSlices.map(s=>bandHtml(s, true)).join('')+
           (isTodayView ? '<div class="rh-now" style="left:'+((now - D.dkToTs(rd)) / 86400000 * 100).toFixed(3)+'%"></div>' : '')+
         '</div>';
    if(slices.length===0 && activeSlices.length===0){
      h += '<div class="hint" style="font-size:12px;color:var(--text-2);margin-top:8px">这一天还没有递归记录</div>';
    }
    /* 自流转日程 */
    h += '<div class="sec-sub" style="margin-top:18px">自流转 · '+(isTodayView?'今日':'当日')+'日程</div>';
    h += slotListHtml(rd, isTodayView);
    /* 手动递归（仅今天可用） */
    if(isTodayView){
      h += '<div class="sec-sub" style="margin-top:18px">可能性递归 · 手动</div>';
      if(spaces.length===0){
        h += '<div class="empty"><span class="empty-ico">◇</span>还没有可能性空间<br>创建空间后，即可用空间消耗节律递归时间</div>';
      }else{
        h += '<div class="grid-2">';
        for(const sp of spaces){
          const acts = Rhythm.activeForSpace(sp.id);
          const isAct = acts.length>0;
          h += '<div class="space-card rh-space'+(isAct?' on':'')+'" data-bind="rec" data-space="'+sp.id+'" style="--sc:'+sp.color+'">'+
                 '<div class="space-ico">'+esc(sp.icon||'✦')+'</div>'+
                 '<div class="space-name">'+esc(sp.name)+'</div>'+
                 '<div class="space-meta">今日 '+fmtMin(Rhythm.todaySpaceMinutes(sp.id))+'</div>'+
                 (isAct?'<div class="rec-live num" data-rec-t>'+fmtDur(now - acts[0].start)+'</div>':'')+
                 '<div style="display:flex;gap:8px;margin-top:4px">'+
                   '<button class="btn btn--small" style="flex:1" data-action="rhythm-iter" data-id="'+sp.id+'">可能性确定</button>'+
                   '<button class="btn btn--small '+(isAct?'btn--danger':'btn--primary')+'" style="flex:1" data-action="rhythm-rec" data-id="'+sp.id+'">'+(isAct?'停止':'可能性递归')+'</button>'+
                 '</div>'+
               '</div>';
        }
        h += '</div>';
      }
    }
    /* 时间轴日记已迁至「我们的共识」页 */
    h += '<div class="hint" style="font-size:12px;color:var(--text-2);margin-top:18px">📔 时间轴日记已搬到「我们的共识」页（长按右滑，或纯净页点顶部日期）</div>';
    h += '</section>';
    return h;
  },

    }else if(p.read >= p.total){
      h += '<div class="hint">主线已经全部讲完了。新的章节我还在想——想好了就来告诉你。</div>';

    h += '<div class="sec-sub" style="margin-top:16px">主线章节<span class="cnt">'+p.total+'</span></div>';
    for(const ch of Storyline.chapters()){
      /* ★ v1.8.1：从第十二章起换一条弧线——上面讲「你们」，这一段讲「她自己」

      const un = Storyline.unlocked(ch, c);

  /* —— 阅读页：★ v1.8.1 搬走了 ——
     她点名的：「剧情可以在纯净主页推进，专门跑去页面读太麻烦了」。

     台词板的排版**只有一份实现**（Storyline.bodyHtml），别在这儿再写第二份 */

  /* ══ 全部时间轴日记（v1.8.0）══
     她点名的：「在我们的共识页面，有一个时间轴日记的功能，我希望在此之上加一个
     能方便查看用户写的所有时间轴日记的页面」。
     ★ 只读地收集：不新建任何 day 文档（没写过的日子不会被这张页面「创造」出来）
     ★ 编辑/删除复用同一个日记弹窗（openRhythmEntryModal 会记住目标日，改的删的都落在那一天） */
  _tdDays(){
    const dks = [];
    const seen = {};
    const put = dk=>{ if(dk && !seen[dk]){ seen[dk] = 1; dks.push(dk); } };
    try{ for(const k of Store.allKeys()) if(k.indexOf('day:') === 0) put(k.slice(4)); }catch(e){}
    try{ for(const dk of S.days.keys()) put(dk); }catch(e){}
    const out = [];
    for(const dk of dks){
      let doc = null;
      try{ doc = (typeof HerDiary !== 'undefined') ? HerDiary._docIfExists(dk) : Store.loadDay(dk); }catch(e){ doc = null; }
      const es = (doc && doc.rhythmEntries) || [];
      if(!es.length) continue;
      out.push({dk, entries: [...es].sort((a,b)=> a.at < b.at ? -1 : 1)});
    }
    out.sort((a,b)=> a.dk < b.dk ? 1 : -1);          // 新的在最上面
    return out;
  },
  /* 全部本子（v1.19.0）：羁绊页上只露最上面几行，想翻整本上这儿来 ——
     跟「全部时间轴日记」一个套路：倒着排、最新的在最上面、能按月筛。
     ✎ 那种日期是浅蓝的行 = 你自己写上去的（她记的那些是灰的） */
  achvall(){
    const all = Achv.lines();
    const dkOf = L => L.dk || D.dateKey(L.at || Date.now());
    const months = [];
    for(const L of all){ const m = dkOf(L).slice(0,7); if(months.indexOf(m) < 0) months.push(m); }
    const fil = S.achvMonth || '';
    const shown = fil ? all.filter(L => dkOf(L).slice(0,7) === fil) : all;
    let h = '<section class="sec"><h2 class="sec-title">全部本子<span class="sec-extra">共 '+all.length+' 行 · 跨 '+months.length+' 个月</span></h2>';
    if(!all.length){
      h += '<div class="empty"><span class="empty-ico">📖</span>本子摊开着，第一页还是白的<br>你做完第一件小事的那天，我就写上第一行</div>'+
           '<div class="hint">这本子记的不是「你做成了什么」，是「你开始动了」——变化还没发生、但已经在发生的那一下。'+
             '机器看不见的那些（想通了一直卡着的事、给以后埋的伏笔），点下面的笔自己写。</div>'+
           '<button class="btn" style="width:100%;margin-top:10px" data-action="achv-write">✎ 我自己写一行</button>';
      return h + '</section>';
    }
    if(months.length > 1){
      h += '<div class="chip-row" style="margin-bottom:12px">'+
        '<button class="chip'+(fil?'':' on')+'" data-action="achv-month" data-m="">全部</button>'+
        months.map(m=>{
          const y = m.slice(0,4), mm = Number(m.slice(5,7));
          return '<button class="chip'+(fil===m?' on':'')+'" data-action="achv-month" data-m="'+esc(m)+'">'+D.ym(y, mm)+'</button>';
        }).join('')+
      '</div>';
    }
    if(!shown.length){
      h += '<div class="empty"><span class="empty-ico">📖</span>这个月本子上没有字<br>点上面的「全部」看回来</div>';
    }else{
      h += '<div class="card pad">' + shown.map(L => {
        const dk = dkOf(L);
        return '<div class="achv-row'+(L.mine ? ' mine' : '')+'">'+
                 '<span class="achv-d">'+esc(D.fmtDateShort(dk))+' '+D.wdLabel(dk)+(L.mine ? ' ✎' : '')+'</span>'+
                 '<span class="achv-t">'+esc(L.text)+'</span>'+
               '</div>';
      }).join('') + '</div>';
    }
    h += '<button class="btn" style="width:100%;margin-top:10px" data-action="achv-write">✎ 我自己写一行</button>'+
      '<div class="hint">整本都在这儿了，倒着排——最上面是最近的那一笔'+
        (fil ? ('（现在只看 '+D.ym(fil.slice(0,4), Number(fil.slice(5,7)))+'，点上面的「全部」看回来）') : '')+
        '。✎ 是日期浅蓝的那些行 = 你自己写上去的。'+
        '这本子记的不是「你做成了什么」，是「你开始动了」。</div>';
    return h + '</section>';
  },
  tdiary(){

    const total = groups.reduce((k,g)=>k+g.entries.length, 0);
    const months = [];
    for(const g of groups){ const m = g.dk.slice(0,7); if(months.indexOf(m) < 0) months.push(m); }
    const fil = S.tdMonth || '';
    const shown = fil ? groups.filter(g=>g.dk.slice(0,7) === fil) : groups;
    const shownN = shown.reduce((k,g)=>k+g.entries.length, 0);
    let h = '<section class="sec"><h2 class="sec-title">全部时间轴日记<span class="sec-extra">共 '+total+' 篇 · 跨 '+groups.length+' 天</span></h2>';
    if(!groups.length){
      h += '<div class="empty"><span class="empty-ico">📔</span>还没有时间轴日记<br>'+
           '去「我们的共识」页点「＋ 记录想法」，写下第一条</div>';
      h += '<div class="hint">时间轴日记 = 以「时间点」为标签的日记：几点几分，你在想什么、做了什么。'+
        '写过的每一条都会出现在这一页，按天倒着排，哪一天的都能回来改。</div>';
      return h + '</section>';
    }
    if(months.length > 1){
      h += '<div class="chip-row" style="margin-bottom:12px">'+
        '<button class="chip'+(fil?'':' on')+'" data-action="td-month" data-m="">全部</button>'+
        months.map(m=>{
          const y = m.slice(0,4), mm = Number(m.slice(5,7));
          return '<button class="chip'+(fil===m?' on':'')+'" data-action="td-month" data-m="'+esc(m)+'">'+D.ym(y, mm)+'</button>';
        }).join('')+
      '</div>';
    }
    if(!shown.length){
      h += '<div class="empty"><span class="empty-ico">📔</span>这个月还没有写过</div>';
    }
    for(const g of shown){
      h += '<div class="td-day">'+
        '<div class="td-date">'+D.fmtDateShort(g.dk)+' '+D.wdLabel(g.dk)+'<span class="td-n">'+g.entries.length+' 篇</span></div>';
      for(const en of g.entries){
        h += '<div class="card pad rh-entry" style="margin-bottom:8px">'+
               '<div style="display:flex;justify-content:space-between;align-items:center">'+
                 '<span class="rh-time num">'+esc(en.at)+'</span>'+
                 '<span style="display:flex">'+
                   '<button class="icon-btn" data-action="td-entry" data-dk="'+esc(g.dk)+'" data-id="'+esc(en.id)+'" style="width:26px;height:26px" aria-label="编辑">✎</button>'+
                   '<button class="icon-btn" data-action="td-del" data-dk="'+esc(g.dk)+'" data-id="'+esc(en.id)+'" style="width:26px;height:26px" aria-label="删除">🗑</button>'+
                 '</span>'+
               '</div>'+
               (en.text?'<div style="font-size:13px;white-space:pre-wrap;margin-top:4px">'+esc(en.text)+'</div>':'')+
               imgsHtml(en.images)+
             '</div>';
      }
      h += '</div>';
    }
    h += '<div class="hint">这一页是全部的时间轴日记：按天倒着排，最上面是最新的'+
      (fil ? ('（现在只看 '+D.ym(fil.slice(0,4), Number(fil.slice(5,7)))+'，点上面的「全部」看回来）') : '')+
      '。点 ✎ 改、点 🗑 删——不管写在哪一天，都会落在那一天，不会改错。'+
      '想按天看当天的全部内容（待办 / 递归 / 她写的日记），去「我们的共识」页。</div>';
    h += '</section>';
    return h;
  },
};
/* ══════════════════════════════════════════════════════════════
   9.5 自定义背景 / 覆盖模式
   ══════════════════════════════════════════════════════════════ */
function bgSrc(){
  const id = S.settings.bgImageId;
  return id ? (Store.getImage(id) || null) : null;
}
/* 把背景图/透明度/模糊度应用到背景层 */
function applyBg(){
  const el = document.getElementById('bg-layer');
  if(!el) return;
  const src = bgSrc();
  if(src){
    el.style.backgroundImage = 'url("'+src+'")';
    el.style.opacity = String((S.settings.bgOpacity ?? 45) / 100);
    el.style.filter = 'blur('+(S.settings.bgBlur ?? 0)+'px)';
    el.classList.remove('hidden');
  }else{
    el.classList.add('hidden');
  }
}
/* 看板娘立绘上传回调：不压缩，原图保存（透明背景 PNG 无损保留） */
/* ══════════════════════════════════════════════════════════════
   9.57 她的衣柜 Outfit（v1.3）：多套立绘自由切换 / 上传 / 长按删除
   数据：settings.outfits = ['img_xxx', …]（只存上传的服装 id，图片本体照旧在 img:xxx）
   ⚠️ gcImages 必须把 outfits 里每个 id 都登记为引用，否则下次启动图片全被回收
   ══════════════════════════════════════════════════════════════ */
const Outfit = {
  /* 读衣柜；老用户第一次进来时，把旧的单一「上传立绘」（固定 id 'mascot'）补进衣柜，零丢失 */
  list(){
    let ids = S.settings.outfits;
    if(!Array.isArray(ids)){
      ids = [];
      if(S.settings.mascotId === 'mascot' || Store.getImage('mascot')) ids.push('mascot');
      S.settings.outfits = ids;
      saveSettings();
    }
    return ids;
  },
  name(id){ const i = this.list().indexOf(id); return i < 0 ? '自定义立绘' : ('第 ' + (i + 1) + ' 套'); },
  src(id){ return id ? (Store.getImage(id) || '') : ''; },
  wear(id){
    S.settings.mascotId = id || null;
    saveSettings();
    scheduleRender();
    UI.toast(id ? ('已换上' + this.name(id)) : '已换回系统默认的她（那 6 个图文件夹）');
  },
  upload(){
    const fi = document.getElementById('file-input');
    if(!fi) return;
    fi.accept = 'image/*';
    fi.multiple = true;               // 相册里可一次多选（v1.4.1）
    S.pendingFileCb = handleOutfitFile;
    fi.value = ''; fi.click();
  },
  /* 存一套新衣服并直接换上（原图不压缩：透明背景 PNG 完整保留）
     quiet=true 时不弹提示——批量上传由调用方统一报一句 */
  add(dataURL, quiet){
    const id = uid('img_');
    if(!Store.saveImage(id, dataURL)){ UI.toast('存储空间不足，这套没能存下', 'err'); return null; }
    const ids = this.list();
    ids.push(id);
    S.settings.outfits = ids;
    S.settings.mascotId = id;
    saveSettings();
    scheduleRender();
    if(!quiet) UI.toast('新服装已收进衣柜并换上');
    return id;
  },
  /* 删除：从衣柜摘掉 + 立刻回收图片；正穿着就先回退，别指向已删的图 */
  del(id){
    const ids = this.list();
    const i = ids.indexOf(id);
    if(i < 0) return;
    ids.splice(i, 1);
    S.settings.outfits = ids;
    if(S.settings.mascotId === id) S.settings.mascotId = null;
    saveSettings();
    Store.del('img:' + id);
    scheduleRender();
    UI.toast('这套服装已删除');
  },
  askDel(id){
    if(!this.list().some(x=>x===id)) return;
    UI.confirmDialog('删除这套服装', '「' + this.name(id) + '」会从衣柜里移除，图片也一起删掉（无法恢复）。', true, ()=>this.del(id));
  }
};
/* 服装上传（v1.4.1：相册可一次多选）：逐张读原图（不压缩）存进衣柜，最后一张就是换上的那套 */
function handleOutfitFile(files){
  const picked = (files||[]).filter(f=>f && f.type && f.type.startsWith('image/'));
  if(!picked.length){ UI.toast('请选择图片文件', 'err'); return; }
  const batch = picked.length > 1;
  if(batch) UI.toast('正在读取 '+picked.length+' 张…');
  let i = 0, ok = 0, full = false;
  const step = ()=>{
    if(full || i >= picked.length){
      if(ok > 1) UI.toast('已收进衣柜 '+ok+' 套，'+Outfit.name(S.settings.mascotId)+' 已换上');
      return;                                   // 只传一张时 Outfit.add 自己会提示
    }
    const rd = new FileReader();
    rd.onload = ()=>{ if(Outfit.add(rd.result, batch)) ok++; else full = true; step(); };
    rd.onerror = ()=>{ UI.toast('图片读取失败', 'err'); step(); };
    rd.readAsDataURL(picked[i++]);
  };
  step();
}
/* 动画强度三档：完整 / 轻度（默认）/ 关闭 */
function applyAnimLevel(){
  const lv = S.settings.animLevel || 'full';
  document.body.classList.toggle('anim-off', lv==='off');
  document.body.classList.toggle('anim-light', lv==='light');
}
/* 背景图选择回调（压缩到1600px保存） */
function handleBgImageFile(files){
  const file = (files||[])[0];
  if(!file || !file.type || !file.type.startsWith('image/')){ UI.toast('请选择图片文件', 'err'); return; }
  UI.toast('压缩处理中…');
  compressImage(file, dataURL=>{
    if(!dataURL) return;
    if(S.settings.bgImageId) Store.del('img:'+S.settings.bgImageId);
    if(!Store.saveImage('img_bg', dataURL)){ UI.toast('存储空间不足', 'err'); return; }
    S.settings.bgImageId = 'img_bg';
    if(S.settings.bgOpacity==null) S.settings.bgOpacity = 45;
    if(S.settings.bgBlur==null) S.settings.bgBlur = 0;
    saveSettings();
    applyBg();
    scheduleRender();
    UI.toast('背景已设置');
  }, 1600);
}
/* 当前浏览器名（用于设置页展示） */
function browserName(){
  try{
    const ua = navigator.userAgent || '';
    if(ua.includes('Edg')) return 'Edge';
    if(ua.includes('Chrome')) return 'Chrome';
    if(ua.includes('Firefox')) return 'Firefox';
    if(ua.includes('Safari')) return 'Safari';
    return '浏览器';
  }catch(e){ return '未知'; }
}

/* ══════════════════════════════════════════════════════════════
   9.6 看板娘气泡提醒 Bubbles（纯屏顶部，点击跳转对应页面）
   ══════════════════════════════════════════════════════════════ */
const Bubbles = {
  queue:[],            // 待显示：{text, sub, go, opts, hold}  go=回调（点击时执行）
  seen:{},             // 去重：key → true（同一天只提醒一次）
  shownUntil:0,        // 当前气泡的自动消失时刻
  active:null,
  idleText:'',         // ★ v1.7.17：没话可说时那个位置留着「对话框」（见 Talk.box）
  storyBox:null,       // ★ v1.8.1：「故事框」（竖排纯文字，见 Talk.box / CONFIG.STORYLINE.BOX）。
                       //   ★ v1.9.0：它现在只挂在**点开之后**那条对话框上（push 时带 story:true），
                       //   不再站在没点开的「.........」旁边（她点名改的位置）
  /* opts（v1.7.10，她要求的）：选项按钮，挂在气泡**右上角**、右对齐。
     每条 = {t:文字, action:'动作名', 其余键会原样写成 data-*}
     ——她的问题（galgame 选项）和通知权限那种「要不要」都走这儿，不再弹白底弹窗 */
  push(text, opt){
    opt = opt || {};
    /* ★ v1.20.0：出口之一——她的台词在**入队这一刻**换成当前语言。
       只翻这一次（存进去的就是译文），之后每次重画不会翻第二遍——
       日文里全是汉字，二次翻译会把话越翻越乱，所以入口翻、出口不翻。 */
    text = I18N.text(text);
    if(typeof opt.sub === 'string') opt.sub = I18N.text(opt.sub);
    if(opt.opts) opt.opts = opt.opts.map(function(o){
      if(!o || typeof o.t !== 'string') return o;
      const c = {}; for(const k in o) c[k] = o[k];
      c.t = I18N.text(o.t); return c;
    });
    /* ★ v1.7.11：她的**即时台词**（点击她 / 捏 / 摇 / 拖到角落 / 场景演出的一句话）也走这一个气泡。
       和提醒那套的区别只有两条：**不排队**（点一下要马上有回应，不能在队列里等）和
       **不去重**（同一句话今天点第二次也该重新说一遍）。所以直接顶掉当前那条。
       ⚠️ 唯一的例外：她**正在问你话**时（active 带着选项、要留一分钟）不许顶——
       顶了她那个问题就没了，你就没得选了。 */
    if(opt.say){
      /* 这会儿没有能挂气泡的地方（她的页面 / 没装 Q版）就当她没开口。
         少了这道判断，子页上的一句会**卡在 active 里**，等你回首页时突然冒出来（时序不对，
         看着像 bug）。v1.7.13：忙碌页有 #q-bubble 了，那儿也算「有地方挂」 */
      if(!this._mount()) return;
      /* 她正在问你话（那条要留一分钟、还带着选项）时不许顶——顶了你就没得选了。
         ★ v1.7.17：唯一能顶的是**她自己那段剧情的下一句**（Talk 走 force:true 传进来）——
           它本来就是在回答你刚点的那下「继续」，不算插嘴 */
      if(this.active && this.active.opts && !opt.force) return;
      /* ★ v1.7.17：sub / opts / go 三个也要接住（v1.7.11 抽这一档时只留了 text）——
         sub 是剧情那句左上角的「第 N 章 · 章名」；
         opts 是**剧情往下走的那个「继续 ▸」**（丢了它这一场就卡在第一句上，你点不动）；
         go 是答完她那句顺手给你的「点我看详情 →」 */
      this.active = {text, sub:opt.sub||'', go:opt.go||null, opts:opt.opts||null,
                     hold:opt.hold || 2600, story:!!opt.story};
      this.render();
      return;
    }
    const key = opt.key || text;
    if(this.seen[key]) return;
    this.seen[key] = true;
    this.queue.push({text, sub:opt.sub||'', go:opt.go||null, opts:opt.opts||null, hold:opt.hold||0,
                     story:!!opt.story});
    if(this.queue.length>4) this.queue.shift();
    this.render();
  },
  /* v1.7.13：气泡挂哪儿——纯净页 #bubble-root 优先；忙碌页 Q版在场 → 她头顶的 #q-bubble；
     都没有 = 挂起（她的页面）。返回 {el, q} 或 null */
  _mount(){
    try{
      const root = document.getElementById('view-root');
      const br = root ? root.querySelector('#bubble-root') : null;
      if(br) return {el:br, q:false};
    }catch(e){}
    try{
      const qb = document.getElementById('q-bubble');
      const qc = document.getElementById('q-corner');
      if(qb && qc && qc.classList && qc.classList.contains('on')) return {el:qb, q:true};
    }catch(e){}
    return null;
  },
  /* 小气泡钉到 Q版头顶：外层 transform:translate(-50%,-100%) 负责对中 + 抬到头顶，
     不用量气泡自己的宽；左右夹回屏幕里（她被你拖到边上，气泡也不出屏） */
  _placeQ(){
    const qc = document.getElementById('q-corner'), qb = document.getElementById('q-bubble');
    if(!qc || !qb || !qb.style) return;
    try{
      const r = qc.getBoundingClientRect();
      const w = window.innerWidth || 390;
      const half = Math.min(240, w * 0.62) / 2 + 6;
      qb.style.left = clamp(r.left + r.width / 2, half, w - half) + 'px';
      qb.style.top = Math.max(8, r.top - 8) + 'px';
    }catch(e){}
  },
  /* 把当前待显示的一条画到该去的地方（哪儿都没有时挂起，回纯净页由 renderView 补画） */
  render(){
    const m = this._mount();
    if(!m) return;                           // 两边都没容器（她的页面），暂不显示
    const br = m.el;
    if(!this.active){
      if(this.queue.length) this.active = this.queue.shift();
      /* ★ v1.7.17：没话可说的时候，这个位置**留着对话框**（她要求：
         「用户可以主动在纯净界面跟她说话，点击对话框触发选项」）——
         点它 → 弹出话题选项 → 她答你。忙碌页不占地方（Q版就那么大，头顶塞个框挡按钮） */
      else if(this.idleText && !m.q){
        /* ★ v1.8.1（她要求的「在……的对话框旁加一个故事框」）：
           ★ v1.9.0 她改了位置 ——「是在你想对我说些什么的对话框旁，不是.......的旁边」：
           所以这一档只剩那串「.........」，故事框搬到**点开之后**那条对话框上（见下面）。 */
        br.classList.remove('has-story');
        br.innerHTML = '<div class="mascot-bubble bb-idle" role="button" data-action="talk-open">'+
                       esc(this.idleText)+'</div>';
        br.classList.remove('hidden');
        br.onclick = null;                 // 点它走 data-action="talk-open"（不是「点掉这条提醒」）
        return;
      }
      else { br.classList.add('hidden'); br.innerHTML=''; return; }
    }
    const b = this.active;
    /* 选项（v1.7.10）：气泡右上角一排，右对齐——她问你的时候，选项就在那儿 */
    let optHtml = '';
    if(b.opts && b.opts.length){
      optHtml = '<div class="bb-opts">';
      for(const o of b.opts){
        let at = '';
        for(const k in o){ if(k !== 't') at += ' data-'+k+'="'+esc(String(o[k]))+'"'; }
        optHtml += '<button class="bb-opt" type="button"'+at+'>'+esc(o.t)+'</button>';
      }
      optHtml += '</div>';
    }
    /* 每次都重画：view-root 整体重渲染会抹掉气泡标记，必须随渲染重建 */
    /* ★ v1.7.18（她要求的）：气泡里**不再放她的图**。
       她的原话：「为什么表情图片会在对话框中呢？我希望是短暂的、根据剧情需求的，
       替换掉纯净界面原来的表情图片」——所以那张对话表情差分现在由 Talk.showFace
       直接换到**界面里那张大立绘**身上，几秒后自己换回来；气泡回到纯说话。
       连 b.face 这个字段也一起删了：留着它就是「同一件事两套实现」的坑 */
    const body =
      (b.sub ? '<div style="font-size:10.5px;color:var(--accent);font-weight:700;letter-spacing:1px;margin-bottom:2px">'+esc(b.sub)+'</div>' : '')+
      '<div>'+esc(b.text)+'</div>'+
      (b.go ? '<div style="font-size:10.5px;color:var(--text-2);margin-top:3px">点我看详情 →</div>' : '');
    /* ★ v1.9.0（她点名改的位置）：故事框站在**「想跟我说点什么？」那条对话框旁边**
       （就是点开「.........」之后端上来话题的那一条），不是站在没点开的那串点旁边。
       所以它跟着**这一条气泡**走：push 时带 story:true 才挂（现在只有 Talk.open 那么用） */
    const sbx = (b.story && this.storyBox && !m.q) ? this.storyBox : null;
    br.classList.toggle('has-story', !!sbx);
    br.innerHTML = '<div class="mascot-bubble" role="button" aria-label="提醒">'+ optHtml + body +'</div>'+
      (sbx ? '<button class="story-box" type="button" data-action="story-read" aria-label="'+esc(sbx.aria)+'">'+
             '<span class="sb-t">'+esc(sbx.text)+'</span>'+(sbx.note ? '<i class="sb-n">'+esc(sbx.note)+'</i>' : '')+'</button>' : '');
    br.classList.remove('hidden');
    /* ★ v1.7.17：点**选项按钮**（话题 / 「继续 ▸」/ 她的问题的选项）不算「点掉这条」——
       它在 #bubble-root 里面，点下去会先冒到这儿再冒到 view-root 的 data-action 分发；
       在这儿顺手 dismiss 一次的话：剧情那一场的剧本当场被 Talk.abort 清掉，
       紧接着 talk-next 找不到剧本 → **整章永远卡在第一句**（你点「继续 ▸」毫无反应）。
       选项那条路自己有收尾（topic/answer 开头就 dismiss），这儿只要让开 */
    br.onclick = (ev)=>{
      try{ if(ev && ev.target && ev.target.closest && ev.target.closest('[data-action]')) return; }catch(e){}
      this.dismiss(); if(b.go) b.go();
    };
    if(m.q) this._placeQ();                  // 忙碌页：钉到 Q版头顶
    clearTimeout(this._t);
    /* 她问你问题时挂久一点（hold）：一句话飘 9 秒就走，问题得留够你看见并选的时间 */
    this._t = setTimeout(()=>{ this.dismiss(); }, b.hold || 9000);
  },
  dismiss(){
    /* ★ v1.7.17：那个「到点自己收」的闹钟先停掉 —— 它只负责收**它自己那条**。
       不停的话：它到点时会去收「此刻正显示的那条」（可能早就换成另一句了），
       表现为「她刚答我的话一秒就没了」 */
    clearTimeout(this._t);
    this.active = null;
    /* ★ v1.7.17：正演着剧情的时候被点掉（你点了气泡本身，没点「继续 ▸」）→ 这一场就地收场。
       不收的话剧本永远停在那一句上：她的 _script 一直非空 → **她从此再也不开口、也不走动**
       （Talk.open / Talk.abort / Director 全被她自己挡住）。⚠️ abort 里**不许**回过头叫 dismiss */
    if(typeof Talk !== 'undefined' && Talk.scripting()){ try{ Talk.abort(); }catch(e){} }
    try{
      const root = document.getElementById('view-root');
      const br = root ? root.querySelector('#bubble-root') : null;
      if(br){ br.innerHTML=''; br.classList.remove('has-story'); br.classList.add('hidden'); }
      const qb = document.getElementById('q-bubble');
      if(qb){ qb.innerHTML=''; qb.classList.add('hidden'); }   // 忙碌页那个也一起收
    }catch(e){}
    if(this.queue.length) this.render();     // 排队的下一条顶上
    /* ★ v1.7.17：队列空了就把**对话框**放回那个位置（idleText 是 Talk.box 按页面设的）。
       少了这一句：她说的话一收（自己到时 / 被你点掉），那个位置就一直空着，
       要等下一次重画才回来 —— 而纯净页上「下一次重画」可能是好几分钟以后，
       看着就像「对话框坏了」。排队那条分支自己会画，不重叠 */
    else if(this.idleText) this.render();
  }
};
/* 场景提醒的触发点集合（在 Rhythm / Alarms / tick 中调用） */
function bubbleScene(key, text, go, sub){
  if(typeof Bubbles!=='undefined') Bubbles.push(text, {key, go, sub});
}

/* ══════════════════════════════════════════════════════════════
   9.65 她活过来了 Her（v1.4）：她主动找你说话
   ★ 所有主动台词的唯一出口是 Her.voice()——将来想接真 AI，只改那一个函数；
     台词池与全部数值在 CONFIG.HER。她只在你自己的两个空间里说话（气泡通道）。
   ★ 零迁移：只新增 settings.herVoice / herSpoke / herLastOpen / herAsked / herNight
   ══════════════════════════════════════════════════════════════ */
const Her = {
  aiHook:null,          // ★ 预留接口：挂 (kind, ctx)=>string|null，返回非空就用它，否则回落话术池
  _lastAt:0,            // 上一条主动气泡的时刻（冷却用）
  _lastScan:0,          // 上一次检查的时刻
  _lastIdle:0,          // 上一次「日常念叨」的时刻
  _nightDone:null,      // 本次会话已经说过睡前总结的日子

  /* ── 唯一出口：她说的话都从这儿出 ── */
  voice(kind, ctx){
    ctx = ctx || {};
    /* 指定台词（有些场合她已经想好要怎么回了，比如听你答完某个问题）——照旧走这个出口 */
    if(ctx.override) return this.fill(String(ctx.override), ctx);
    /* ★ AI 接口（预留）：挂上之后由它接管台词；抛错或返回空再回落话术池。
       吐出来的文本同样要过称呼替换（AI 也可以直接写 {yt}） */
    try{ if(this.aiHook){ const a = this.aiHook(kind, ctx); if(a) return this.fill(String(a), ctx); } }catch(e){}
    const pool = this.pool(kind);
    /* 条件是「或」的关系，命中多条就随机挑；一条都没命中（数据在设想的边界外）
       就退回整池——宁可说得不贴切，也不能让她哑掉 */
    const fits = pool.filter(p => !p.when || p.when(ctx));
    const arr = fits.length ? fits : pool;
    if(!arr.length) return '';
    /* 随机挑一句来说。函数式台词（要念出你的数据）偶尔会碰到上下文没带全的场合——
       挑不动就换下一句，绝不能因为一句台词把界面弄崩（全挑不动就这次先不说话） */
    const order = arr.slice();
    while(order.length){
      const p = order.splice(Math.floor(Math.random()*order.length), 1)[0];
      let s = '';
      try{ const t = (typeof p === 'string') ? p : p.t; s = (typeof t === 'function') ? t(ctx) : t; }
      catch(e){ continue; }
      if(s) return this.fill(String(s), ctx);
    }
    return '';
  },
  /* 台词池（v1.7.12）：老的那批在 CONFIG.HER.LINES；
     事件反应表里那几句用 'ev:<事件名>' 取——台词和它的编排（帧/表情）写在同一张表上，
     改的时候不用两头找（谁也没法只改一半） */
  pool(kind){
    const L = CONFIG.HER.LINES || {};
    if(L[kind]) return L[kind];
    const m = /^ev:([A-Za-z]+)$/.exec(String(kind));
    const ev = m && (CONFIG.HER.EVENTS || {})[m[1]];
    return (ev && ev.line) || [];
  },
  /* 称呼令牌：她说的每句话都可以用 {yt} / {you} / {name}，
     实际值随关系阶段自动变 —— 称呼要在所有界面生效，靠的就是这一层 */
  fill(text, ctx){
    /* ★ v1.20.0 顺序：**先把整句模板翻好（这时候 {you}/{yt}/{name} 还占着位），再塞值词**。
       反过来的话，值词（你 / 亲爱的……）一塞进去整句就变成中文，词典再也对不上（铁律：整句模板，不拼碎片）。
       值词自己也要先翻（LT）——日英语序里它不能还是中文。 */
    const rawYou = (ctx && ctx.you) || (typeof Love !== 'undefined' ? Love.you() : (CONFIG.LOVE.YOU || '你'));
    const base = CONFIG.LOVE.YOU || '你';
    const you = LT(rawYou);
    const nm  = LT(CONFIG.LOVE.NAME);
    const tpl = LT(String(text));
    /* {yt} 是「，+ 称呼」那一档：中文用全角逗号，日文用顿号，英文用半角逗号加空格 */
    const L = (typeof I18N !== 'undefined' && I18N.cur()) || 'zh';
    const sep = L === 'en' ? ', ' : (L === 'ja' ? '、' : '，');
    return tpl
      .split('{you}').join(you)
      .split('{yt}').join(rawYou && rawYou !== base ? (sep + you) : '')
      .split('{name}').join(nm);
  },

  /* ── 频率门（★ v1.9.0 改：**没有每日额度了** —— 她说的「不要有说话额度」）──
     现在只剩两道：①「安静」档 = 她不主动开口；②两条主动的话之间至少隔 gapMs()。
     ⚠️ 间隔那一道不能省：没有它她会在同一秒里把同一件事念好几遍（那是坏掉，不是活人感）。
     （老的那本「一天说几句」的账 settings.herSpoke 不再读了，旧数据留着无害） */
  gapMs(){
    const lv = S.settings.herVoice || 'normal';
    const g = CONFIG.HER.VOICE_GAP[lv];
    return (g != null ? g : CONFIG.HER.VOICE_GAP.normal) * 1000;
  },
  quiet(){ return (S.settings.herVoice || 'normal') === 'off'; },
  canSpeak(now){
    now = now || Date.now();
    if(this.quiet()) return false;                 // 「安静」档：她不主动开口
    return (now - this._lastAt) >= this.gapMs();
  },
  /* ── 说一句：所有主动台词的统一入口 ── */
  say(kind, ctx, opt){
    opt = opt || {};
    const now = (ctx && ctx.now) || Date.now();
    const text = this.voice(kind, ctx);
    if(!text) return false;
    const key = opt.key || ('her-' + kind + '-' + D.dateKey(now));
    if(Bubbles.seen[key]) return false;          // 这一条今天已经说过了
    if(!this.canSpeak(now)) return false;        // 今天说够了 / 刚说完没多久
    Bubbles.push(text, {key, sub: opt.sub || '她', go: opt.go || null});
    /* 开口必配脸+小动作（v1.7）：每段话都有表情动作变化，不一张脸说到尾 */
    this.reactFace(kind, now);
    /* 你把软件切到后台了 → 这句话也走系统通知送出去（她走出软件，v1.5） */
    if(opt.notify !== false && typeof Notify !== 'undefined') Notify.her(text, opt.sub || '她');
    this.count(now);
    return true;
  },
  /* 记一次「她开了口」（v1.7.17 抽出来）：只拨一下「上一次开口」的钟（间隔门要用）。
     ★ v1.9.0：一天说几句的那本账取消（她说的「不要有说话额度」）——只剩这一下拨钟。
     Talk 的主动搭话走这儿，才不会绕开你设的「她说话的频率」 */
  count(now){
    this._lastAt = now || Date.now();
    saveSettings();
    return true;
  },
  /* 说话时的脸与动作（v1.7）：软规则——困/气最优先、8 秒内的新情绪不冲淡、
     深夜 sleepy 不动脸；只在她看得见的两个纯净页演 */
  reactFace(kind, now){
    const f = CONFIG.HER.FACE[kind];
    if(!f) return false;
    if(S.view !== 'home' && S.view !== 'mspace') return false;
    now = now || Date.now();
    let emo = f.emo;
    if(emo === '*idle') emo = CONFIG.HER.FACE_IDLE[Math.floor(Math.random() * CONFIG.HER.FACE_IDLE.length)];
    const cur = Emo.get(now), m = S.settings.herMood;
    let skip = false;
    if(cur === 'sleepy' || cur === 'angry') skip = true;                       // 困与气最优先
    else if(cur !== 'neutral' && m && (now - (m.at || 0)) < CONFIG.HER.FACE_KEEP_MS) skip = true; // 新情绪让着
    if(!skip && emo !== cur && typeof Emo !== 'undefined') Emo.set(emo, '说话', now);
    /* 动作：她画了配套的序列帧（比如打招呼的挥手）→ 演帧；没画 → 还是 CSS 小动作 */
    const played = (f.seq && typeof Seq !== 'undefined' && Seq.play(f.seq)) ? true : false;
    if(!played && f.act && typeof Director !== 'undefined' && Director.can()){
      if(f.act.indexOf('pose-') === 0) Director.pose(f.act.slice(5), f.hold || 6000);
      else Director.act(f.act, f);
    }
    return true;
  },
  /* v1.7.13：这会儿她有说话的容器吗——纯净页的 #bubble-root，
     或忙碌页 Q版头顶的 #q-bubble；她的页面（mgrow…）两边都没有。
     （纯函数，只认视图名：冒烟测试直接拿它验，不用真 DOM） */
  speakHere(v){ return v === 'home' || v === 'mspace' || CONFIG.BODY.HER_PAGES.indexOf(v) < 0; },
  /* ── v1.7.12 事件反应：你做的每件事，她都看见了 ──────────────────
     三层各管各的（这是 v1.7b 剧情系统的地基，也是「像 galgame」的关键）：
       ① 帧（Seq）——她在场就演。忙碌页（待办/空间/汇总/节律）上她以 Q版 站在右下角，
          优先播 q- 开头的 Q版专用帧，没画就回落成同一组正常帧缩小了播（v1.7.13）
       ② 表情（Emo）——真值得高兴/担心的事，脸跟着变（哪怕这会儿看不见她，回首页也是那个表情）
       ③ 一句话——纯净页在立绘下的 #bubble-root 说，忙碌页在她头顶的 #q-bubble 说；
          她的页面两边都没有 → 挂起，回纯净页再补画（v1.7.13 前忙碌页根本不开口）
     ★ 反唠叨：同一件事（同一个 id）90 秒内只说一次 + 一天最多出声 REACT.DAILY 次。
       帧和表情不算「说话」，不受这两道闸管——它们不吵人，只是让你看得见她。
     ★ 整个函数吞掉一切异常：她回应你失败，绝不能连累你刚做成的那件事
     ★ 返回值 = 她**有没有动**（演了帧 / 放了 CSS 替身 / 开了口），调用方现在都不看它，
       留着是因为下一轮剧情系统要用「她有没有真的回应」来决定要不要往下演一章 */
  onEvent(kind, data){
    try{
      const g = (CONFIG.HER.EVENTS || {})[kind];
      if(!g) return false;
      if(typeof Snd !== 'undefined') Snd.event(kind);   // v1.13.0：事件必有反馈声（没开口也响）
      data = data || {};
      const now = Date.now();
      /* ① 帧：演上了就不放 CSS 小动作（两套一起上会打架）；没图 = 她还没画 → 回落小动作 */
      let played = false;
      if(g.seq && typeof Seq !== 'undefined' && Seq.play(g.seq)) played = true;
      if(!played && g.act && typeof Director !== 'undefined' && Director.allowed(g.act))
        played = Director.act(g.act, g) || false;
      /* ② 表情 */
      if(g.emo && typeof Emo !== 'undefined') Emo.set(g.emo, '事件', now);
      /* ③ 一句话（有闸；没写台词的 kind —— 升段/升级 —— 直接到这儿就回去） */
      if(!g.line) return played;
      /* v1.7.13：忙碌页也开口——纯净页走 #bubble-root，忙碌页（Q版在场）走她头顶的
         #q-bubble；她的页面两边都没有 → 照旧不开口 */
      if(!this.speakHere(S.view)) return played;
      const busy = S.view !== 'home' && S.view !== 'mspace';
      const key = kind + '|' + (data.id == null ? '' : data.id);
      const dk = D.dateKey(now);
      const rec = (S.settings.herReact && S.settings.herReact.dk === dk)
        ? S.settings.herReact : {dk, key:null, at:0, n:0};
      if(rec.key === key && (now - rec.at) < CONFIG.HER.REACT.GAP_MS) return played;
      /* ★ v1.9.0：这儿原来还有一条「一天最多出声 REACT.DAILY 次」——她去掉了
         （她的原话「不要有说话额度」）。留着的那条是**同一件事 90 秒内不说两遍** */
      const c = this._evCtx(now, data);
      const text = this.voice('ev:' + kind, c);
      if(!text) return played;
      rec.key = key; rec.at = now; rec.n = (rec.n || 0) + 1;   // n 只当个计数看看，不再拦人
      S.settings.herReact = rec;
      saveSettings();
      /* 忙碌页她只有角落那么小 → 气泡短一点（3.2 秒），不挡手头的按钮、不跟 toast 打架 */
      Bubbles.push(text, {key:'her-ev-' + key + '-' + now, sub:'她', hold: busy ? 3200 : 0});
      return true;
    }catch(e){ return false; }
  },
  /* 事件台词要用的那几个数（每句夸都挂在真实数据上——「今天第 3 件」不是「你真棒」）。
     每个字段都给兜底：宁可说得笼统，也不能让她的句子里蹦出个 undefined */
  _evCtx(now, data){
    const c = this.ctx(now);
    c.dayDone = (c.day && c.day.done) || 0;
    c.todoN   = (data.todoN != null) ? data.todoN : ((c.day && c.day.done) || 0) + 1;
    c.recN    = (data.recN != null) ? data.recN : 1;
    c.todoTitle = data.todoTitle || '这件事';
    try{ c.spaceN = (S.spaces || []).filter(s => !s.archived).length || 1; }catch(e){ c.spaceN = 1; }
    let spName = data.spaceName || '';
    if(!spName && data.spaceId){ try{ const sp = spaceById(data.spaceId); if(sp) spName = sp.name; }catch(e){} }
    c.spaceName = spName || '这个空间';
    c.minText = (data.min != null) ? fmtMin(Math.max(1, Math.round(data.min))) : c.minText;
    try{ c.quotaText = fmtMin(Rhythm.quota()); }catch(e){ c.quotaText = '今天的'; }
    try{ c.remainText = fmtMin(Rhythm.remainingMinutes(now)); }catch(e){ c.remainText = c.minText; }
    return c;
  },
  /* ── 直接回应（你回答了她的问题 / 你跟她说话）：不算「主动搭话」，
        所以不受每日频率门限制——她答你的话，随时都该答得上 ── */
  reply(text, opt){
    opt = opt || {};
    if(!text) return false;
    Bubbles.push(text, {key: opt.key || ('her-reply-' + text), sub: opt.sub || '她', go: opt.go || null});
    if(opt.notify !== false && typeof Notify !== 'undefined') Notify.her(text, opt.sub || '她');
    return true;
  },
  /* 「她督促过的事」记一笔：等你真的做完它，好感会涨（好感来源表里的 todo） */
  _markUrged(id, dk){
    if(!id) return;
    if(!S.settings.herUrged) S.settings.herUrged = {};
    S.settings.herUrged[id] = dk || D.dateKey(Date.now());
    saveSettings();
  },

  /* ── 当天实况（台词池只管挑词，数字都在这儿备好）── */
  _urgent(now){
    let best = null, bd = 0;
    for(const t of S.todos){
      if(t.archived || TodoLogic.effStatus(t, now)==='done') continue;
      const due = TodoLogic.dueAt(t, now);
      if(due == null || due <= now) continue;
      if(!best || due < bd){ best = t; bd = due; }
    }
    return best;
  },
  ctx(now){
    now = now || Date.now();
    const dk = D.dateKey(now);
    const day = Grow.dayXpDetail(dk);        // 今天：专注/完成/记录（走缓存，便宜）
    const st  = Grow.stats(now);             // 累计（她眼中的我那份）
    const aff = (typeof Love !== 'undefined') ? Love.state() : {total:0};
    const c = {
      now, dk, hour:new Date(now).getHours(), day, st, lv:st.lv,
      minText: fmtMin(Math.floor(day.min)),
      urg: this._urgent(now),
      /* v1.5 感情线：她怎么称呼你（{yt} 的实际值）、你们认识多久了、好感多少 */
      you: (typeof Love !== 'undefined') ? Love.you() : CONFIG.LOVE.YOU,
      stage: (typeof Love !== 'undefined') ? Love.stage().k : 'new',
      days: (typeof Love !== 'undefined') ? Love.daysTogether(now) : 1,
      love: aff.total || 0,
      /* v1.6a：她现在的心情（台词池可以按 c.emo 分支——同一个场合，心情不同说法不同） */
      emo: (typeof Emo !== 'undefined') ? Emo.get(now) : 'neutral'
    };
    c.plan = c.urg
      ? LT('今天最急的是') + ' ' + D.tsToHHMM(TodoLogic.dueAt(c.urg, now)) + LT(' 的「') + c.urg.title +
        (day.min >= 1 ? LT('」，你已经专注') + ' ' + LT(c.minText) + LT(' 了。') : LT('」。'))
      : (st.dayCount === 0 ? LT('我们从今天开始吧，先做一件小事。')
                           : LT('今天还没有安排，要不要挑一个空间？'));
    return c;
  },

  /* ── 打开页面时：好久不见 / 昨天没打卡 / 问候（bootMain 调一次）── */
  onBoot(now){
    now = now || Date.now();
    const dk = D.dateKey(now);
    const last = S.settings.herLastOpen;
    S.settings.herLastOpen = {dk, at:now};   // 先记账再说话：今天说不上话也算得准
    saveSettings();
    const c = this.ctx(now);
    /* ① 好久不见 */
    let gap = 0;
    if(last && last.dk) gap = Math.round((D.dkToTs(dk) - D.dkToTs(last.dk)) / 86400000);
    if(gap >= CONFIG.HER.MISS_DAYS){
      c.gap = gap;
      return this.say('missAway', c, {key:'her-away-'+dk, sub:'好久不见', go:()=>goView('mcons')});
    }
    /* ② 昨天没打卡（前天还在）——断掉的线她最在意 */
    const yest = D.dateKey(D.addDaysTs(now,-1)), before = D.dateKey(D.addDaysTs(now,-2));
    if(!Grow.checkedIn(yest) && Grow.checkedIn(before)){
      c.was = Grow.streakDaysUpTo(before);
      return this.say('missStreak', c, {key:'her-streakbrk-'+dk, sub:'她惦记着', go:()=>goView('mcons')});
    }
    /* ③ 问候（v1.13.0：配一声「问候」——断签那条不响，深夜收声） */
    if(typeof Snd !== 'undefined') Snd.event('greet');
    return this.say('greet', c, {key:'her-greet-'+dk, sub:'她'});
  },

  /* ── 过了晚上 N 点，她汇报今天（每天一次）── */
  nightCheck(now){
    const h = new Date(now).getHours();
    if(h < CONFIG.HER.NIGHT_FROM && h >= CONFIG.HER.NIGHT_TO) return false;
    const dk = D.dateKey(now);
    if(this._nightDone === dk || S.settings.herNight === dk) return false;
    this._nightDone = dk;
    S.settings.herNight = dk; saveSettings();
    return this.say('night', this.ctx(now), {key:'her-night-'+dk, sub:'晚安', go:()=>goView('mdairy')});
  },

  /* ── 待办过点多久了（超过宽限才催，别刚到点就烦人）── */
  _late(now){
    const grace = (CONFIG.HER.OVERDUE_MIN || 10) * 60000;
    let best = null, bd = 0;
    for(const t of S.todos){
      if(t.archived || TodoLogic.effStatus(t, now)==='done') continue;
      const due = TodoLogic.dueAt(t, now);
      if(due == null || due > now - grace) continue;   // 还没到点 / 刚过点还在宽限里 —— 都不催
      if(!best || due > bd){ best = t; bd = due; }     // 最接近现在的那件（刚过点的先催）
    }
    return best;
  },

  /* ── 每分钟扫一次：过点督促 / 她惦记的事 / 日常念叨 ── */
  tick(now){
    if(typeof Bubbles==='undefined') return;
    if(S.view!=='home' && S.view!=='mspace') return;   // 她只在你和她的空间里开口
    this.nightCheck(now);
    if(now - this._lastScan < 60000) return;
    this._lastScan = now;
    if(!this.canSpeak(now)) return;                    // 说不了话就什么都不用算
    const c = this.ctx(now);
    /* ① 待办过点还没做 */
    const late = this._late(now);
    if(late){
      c.title = late.title;
      if(this.say('urgeOver', c, {key:'her-late-'+late.id+'-'+c.dk, sub:'她提醒你', go:()=>goView('todos')})){
        this._markUrged(late.id, c.dk);
        return;
      }
    }
    /* ② 她惦记着的事（每天最多问一件） */
    const ask = HerDiary.nextAsk(now);
    if(ask){
      const kind = ask.kind === 'space' ? 'recallSpace' : 'recallTodo';
      if(this.say(kind, Object.assign(c, {ask}), {key:'her-ask-'+ask.id+'-'+c.dk, sub:'她记得', go:()=>goView('mdairy')})){
        HerDiary.markAsked(ask.id, now);
        return;
      }
    }
    /* ③ 日常念叨（低频） */
    if(now - this._lastIdle < CONFIG.HER.IDLE_COOLDOWN_MS){
      if(this.say('idle', c, {key:'her-idle-'+c.dk+'-'+Math.floor(now/600000), sub:CONFIG.TALK.SUB})) this._lastIdle = now;
    }
  }
};

/* ══════════════════════════════════════════════════════════════
   9.655 她开口了 Talk（v1.7.17）：纯净界面那个对话框 · 剧情章节 · 她的走位
   ★ 一张桌子四件事，表全在 CONFIG.TALK / CONFIG.STORY 上：
     ① 对话框：没话可说的时候，气泡那个位置留一个虚线框，点它就弹出话题；
        你挑一个 → 她说一句 + 变脸 + 小动作 + 一张**对话表情差分**立在旁边
     ② 她主动来找你（主动性）：你安静下来之后，她带着**真实由头**过来问一句，
        两三个选项，你选了她接着说
     ③ 剧情章节：里程碑（第几天 / 连续几天 / 等级 / 关系阶段）到点，
        她会把你叫住演一小场——走位 + 动作帧 + 表情 + 一句一句的台词，点「继续」往下走
   ★ 红线没变：走位只加在 .mascot-walk（她的戏）这层，
     .mascot-pos 里**你摆的位置**一个字都不动
   ★ 零迁移：新数据只加 settings.herTalkAsk / settings.herChapter
   ══════════════════════════════════════════════════════════════ */
/* ── 由头 / 剧情共用的一份「现场数据」──
   = Her.ctx（时间 / 今天 / 累计 / 她怎么称呼你 / 认识多久 / 好感 / 心情）
   + ★ v1.7.19 新增的那几个数（今天完成几件 / 空间数 / 空间名）
   ★ 抽出来共用，是因为「她主动来找你」（Talk.reason）和「里程碑章节」（Story.ctx）
     两边都要这几个数 —— 各写一份就是「同一件事两套实现」的老坑（v1.7.11 的教训） */
function talkCtx(now){
  now = now || Date.now();
  const c = Her.ctx(now);
  c.dayDone = (c.day && c.day.done) || 0;      // 今天完成了几件
  c.done    = (c.st && c.st.done) || 0;        // 一共完成过几件
  c.streak  = (c.st && c.st.streak) || 0;
  c.rec     = (c.st && c.st.rec) || 0;
  c.lv      = (c.st && c.st.lv) || 1;
  c.days    = (typeof Love !== 'undefined') ? Love.daysTogether(now) : 1;
  c.stageI  = (typeof Love !== 'undefined') ? Love.stageIndexOf(Love.stage().k) : 0;
  try{ c.spaces = (S.spaces || []).filter(s=>!s.archived).length; }catch(e){ c.spaces = 0; }
  let sp = '';
  try{ if(c.st && c.st.topId){ const o = spaceById(c.st.topId); if(o) sp = o.name; } }catch(e){}
  if(!sp){ try{ const s0 = (S.spaces||[]).filter(s=>!s.archived)[0]; if(s0) sp = s0.name; }catch(e){} }
  c.spaceName = sp || '这个空间';
  return c;
}

const Talk = {
  _script:null,     // 正在演的那段剧情 {lines, i, sub, face, emo, end}
  _askAt:0,         // 她上一次主动搭话的时刻
  _lastCheck:0,     // 上一次查「该不该搭话」的时刻
  _lastAsk:'',      // 她最近一次是拿哪条由头问的（问句里就带着这个由头）
  _pool:[],         // ★ v1.7.18：这一轮洗好的话题顺序（见 three）
  _pi:0,            // 已经端到第几个了
  _boxShown:false,  // ★ v1.14.0：你点过她 → 那串「........」对话框才留出来（她：不要常态露出）

  /* ── 对话框（那个「闲着」的状态）──
     什么时候留框：纯净页 + 操控台没开着。其余页面清掉（忙碌页的角上塞个框会挡按钮） */
  box(){
    const on = (S.view === 'home' || S.view === 'mspace') && !S.consOpen;
    /* ★ v1.8.1：正在读剧情的那块台词板就占着这个位置 —— 对话框和故事框一起让开
       ★ v1.9.0：storyBox 这一份还是在这儿给（纯净页 + 没在读剧情时才有），
         但**挂不挂出去由那条气泡自己定**（点开后的「想跟我说点什么？」带 story:true 才挂） */
    const reading = (typeof Storyline !== 'undefined') && Storyline.on();
    /* ★ v1.14.0（她点名的「对话框不要常态露出」）：那串「........」平时藏起来，
       点过她（Mascot.tap 置 _boxShown）之后才留出来——点它还是老规矩弹话题。
       离开纯净页/读剧情时照旧让开；回来若没再点她，就还是藏着 */
    if(!on) this._boxShown = false;
    Bubbles.idleText = (on && !reading && this._boxShown) ? I18N.text(CONFIG.TALK.HINT) : '';
    Bubbles.storyBox = (on && !reading) ? CONFIG.STORYLINE.BOX : null;
    return on;
  },
  /* ── 一张对话表情差分 → 该依次试的地址 ──
     先它自己，再情绪兜底那张——她某一张还没画/还没传，也不会在屏幕上裂一张图出来 */
  faceCands(name){
    const out = [];
    const add = n=>{
      if(!n) return;
      for(const c of artCands(CONFIG.TALK.DIR + n + '.png')) if(out.indexOf(c) < 0) out.push(c);
    };
    add(name);
    add(CONFIG.TALK.FACE.neutral);
    return out;
  },
  /* ── 让**她本人**短暂换成那张对话表情差分（v1.7.18）──
     她 v1.7.17 交付后提的：图不该立在气泡里，要的是「短暂地、按剧情需要，
     把纯净界面原来的那张表情图换掉」。所以这里不返回 HTML，而是**换她的脸**：
     交给 HerBody.temp 挂几秒，时间到 / 下一次说话 / 换页都会自己换回来。
     ★ 只认**已经 warm 探到过**的那张（v1.7.12 的老规矩）：没探到就不换——
       换上去先裂一张图再回退，比不换还难看。探不到时表情照旧按 Emo 走，台词照说 */
  showFace(name, emo, hold){
    const n = this.faceOf(name, emo);
    if(!n || typeof HerBody === 'undefined' || !HerBody.warmed) return false;
    const hit = HerBody.warmed(this.faceCands(n));
    if(!hit) return false;
    /* ★ v1.8.1：剧情模式要「常驻」——她说的原话：「剧情模式下的表情是常驻的，
       直到用户点击下一段话触发新的表情的时候再切换」。所以剧情那两处传 hold=true */
    return hold ? HerBody.hold(hit) : HerBody.temp(hit, CONFIG.TALK.FACE_MS);
  },
  /* 这一句话旁边站哪张差分：台词自己写了 face 就用它，没写就按情绪挑 */
  faceOf(face, emo){ return face || CONFIG.TALK.FACE[emo] || CONFIG.TALK.FACE.neutral; },
  /* 用得到的那几张差分的名字（开机一起探；「刷新她的图」也照这份名单去刷） */
  allFaces(){
    const out = [];
    const put = n=>{ if(n && out.indexOf(n) < 0) out.push(n); };
    for(const k in CONFIG.TALK.FACE) put(CONFIG.TALK.FACE[k]);
    for(const t of CONFIG.TALK.TOPICS) put(t.face);
    for(const a of CONFIG.TALK.ASK.LIST){ put(a.face); for(const o of (a.opts||[])) put(o.face); }
    for(const ch of CONFIG.STORY.CHAPTERS){ put(ch.face); for(const l of (ch.lines||[])) if(l && l.face) put(l.face); }
    /* ★ v1.8.0：主线剧情也用同一批对话表情差分（一句话一张脸）——漏了这一段，
       她故事里那句「可爱傲娇」就不会被开机探到（Talk.showFace 只认探到过的） */
    for(const ch of CONFIG.STORYLINE.CHAPTERS){
      for(const l of (ch.lines||[])){
        if(!l || typeof l !== 'object') continue;
        put(l.face);
        for(const o of (l.sel || [])) put(o.face);
      }
    }
    return out;
  },
  allFiles(){ return this.allFaces().map(n => CONFIG.TALK.DIR + n + '.png'); },

  /* 从一串台词里挑一条（字符串 / 函数 / {t,…} 都行）——挑不动就换下一条。
     脾气跟 Her.voice 一样：宁可这次不说，也绝不因为一句台词把界面弄崩 */
  one(p, ctx){
    try{ const t = (typeof p === 'function') ? p(ctx) : p; return t ? Her.fill(String(t), ctx) : ''; }
    catch(e){ return ''; }
  },
  pick(ctx, arr){
    const order = (arr || []).slice();
    while(order.length){
      const p = order.splice(Math.floor(Math.random()*order.length), 1)[0];
      const s = this.one(p, ctx);
      if(s) return s;
    }
    return '';
  },

  /* ── 一次端上来哪几个话题 ──
     ★ v1.7.18：她要求的「一次最多三项选择」。30 条全在表里，但屏幕上一次只摆三个：
     每点一次对话框换下一批，30 条轮完自动从头再来。
     ⚠️ 必须是**洗牌后按序切**，不能每次随机抽三个——随机抽会让她精心写的某几条
        一辈子轮不上（而「活用她写的东西」正是这一版的红线） */
  three(){
    const all = CONFIG.TALK.TOPICS;
    if(!all.length) return [];
    if(this._pi >= this._pool.length){
      const ks = all.map(t=>t.k);
      for(let i=ks.length-1;i>0;i--){                    // Fisher-Yates：洗牌，不是排序
        const j = Math.floor(Math.random()*(i+1));
        const t = ks[i]; ks[i] = ks[j]; ks[j] = t;
      }
      this._pool = ks; this._pi = 0;
    }
    const out = this._pool.slice(this._pi, this._pi + CONFIG.TALK.PICK);
    this._pi += out.length;
    return out.map(k => all.filter(t => t.k === k)[0]).filter(Boolean);
  },
  /* ── ① 你点了对话框 → 弹出话题（选项就走 v1.7.10 那条气泡选项通道）── */
  open(now){
    now = now || Date.now();
    if(S.view !== 'home' && S.view !== 'mspace') return false;
    /* ★ v1.15.0：她报「有时候点击对话框唤不出」——原来是这两道静默的闸：
       正演着的那段（多半是她主动搭话的剧本）把她拦住了、点了没反应。
       现在点框 = 你要说话，旧的让位：剧本当场收掉、挂着的问话也收掉 */
    if(this._script) this.abort(false);
    if(Bubbles.active && Bubbles.active.opts) Bubbles.dismiss();
    /* ★ v1.15.0：她报「有时候常驻消失不了」——开完这一次，那串「........」就收回去
       （下次再想说话 = 再点她一下，两个动作从头来） */
    this._boxShown = false;
    Bubbles.idleText = '';
    const opts = this.three().map(t=>({t:t.t, action:'talk-pick', k:t.k}));
    /* key 每次都不同：对话框不是「提醒」，今天点几次都该有反应
       （同一毫秒连点两下也算两次——后面缀个序号，防去重把它吞了）
       ★ v1.9.0：story:true → 「故事」那个竖排框就站在这一条旁边（她要的位置：点开之后） */
    const openKey = 'talk-open-' + now + '-' + (this._openN = (this._openN || 0) + 1);
    Bubbles.push(Her.fill('想跟我说点什么？', Her.ctx(now)),
      {key:openKey, sub:CONFIG.TALK.SUB, opts, hold:60000, story:true});
    return true;
  },
  /* 你挑了一个话题 → 她说一句（变脸 + 小动作 + 那张差分） */
  topic(k, now){
    now = now || Date.now();
    const t = CONFIG.TALK.TOPICS.filter(x=>x.k===k)[0];
    if(!t) return false;
    if(S.view !== 'home' && S.view !== 'mspace') return false;
    Bubbles.dismiss();                                    // 先收起那张选项（不然她答的话顶不掉它）
    const ctx = Her.ctx(now);
    if(t.emo && typeof Emo !== 'undefined') Emo.set(t.emo, '说话', now);
    /* 她画了配套的动作帧就演帧，没画就回落到 CSS 小动作 */
    const played = (t.seq && typeof Seq !== 'undefined' && Seq.play(t.seq)) ? true : false;
    if(!played && t.act && typeof Director !== 'undefined') Director.act(t.act);
    this.showFace(t.face, t.emo);                       // ★ v1.7.18：那张差分换到**她脸上**
    const text = this.pick(ctx, t.line);
    if(text) Bubbles.push(text, {say:true, force:true,
                                 sub:CONFIG.TALK.SUB, hold:CONFIG.TALK.HOLD});
    if(typeof Love !== 'undefined') Love.gain('talk', now);
    return true;
  },
  /* ── ①b 她自己起个话头（★ v1.21.0 活力：她要的「多点主动性」）──────────────
     不用你点对话框：她安静一会儿之后，从话题表里挑一条说给你听。
     ★ 走的是**跟你自己挑那条完全同一段代码**（this.topic）——表情差分、动作帧、
       好感、说话频率门全都一样，不存在第二套实现（这类「两个出口」最容易忘掉一个）。
     三道闸：① 只在纯净页，且此刻没人在说话、没在演剧情
             ② 你至少安静 SELF.IDLE_MS 她才好意思开口
             ③ 两次之间至少隔 SELF.GAP_MS
       此外还站着第四道：Her.canSpeak —— 就是设置里「她说话的频率」那四档，
       你把她调成「安静」她就一个字都不说（这几道闸一个都不能省：没有它们
       她会把同一句连念三遍，那不是活人感，那是坏掉） */
  selfTalk(now){
    now = now || Date.now();
    if(S.view !== 'home' && S.view !== 'mspace') return false;
    if(typeof Bubbles === 'undefined' || typeof Her === 'undefined') return false;
    if(Bubbles.active || this._script) return false;        // 正说着 / 正问着 / 正演着 → 不插嘴
    if(now - (this._lastSelf || 0) < CONFIG.TALK.SELF.GAP_MS) return false;
    if(typeof Love !== 'undefined' && Love.idleMs(now) < CONFIG.TALK.SELF.IDLE_MS) return false;
    if(!Her.canSpeak(now)) return false;                    // 走你设的「她说话的频率」
    const all = CONFIG.TALK.TOPICS;
    if(all.length < 2) return false;
    /* 挑一条**跟上次不一样**的（连着两次同一句，一眼就看出是机器） */
    let t = null;
    for(let i = 0; i < 8 && !t; i++){
      const cand = all[Math.floor(Math.random() * all.length)];
      if(cand.k !== this._lastSelfK) t = cand;
    }
    if(!t) return false;
    this._lastSelf = now; this._lastSelfK = t.k;
    Her.count(now);                                         // 拨一下「上一次开口」的钟（频率门要用）
    return this.topic(t.k, now);
  },
  /* 你回答了她主动问的那句 → 她接着说（jump 那档顺便给你留个「点我看详情」） */
  answer(k, i, now){
    now = now || Date.now();
    const a = CONFIG.TALK.ASK.LIST.filter(x=>x.k===k)[0];
    const o = a && a.opts && a.opts[i];
    if(!o) return false;
    Bubbles.dismiss();
    const ctx = talkCtx(now);        // ★ v1.7.19：跟 _step 用同一份（试念的那句 == 她真说的那句）
    /* ★ v1.7.19：她答一句就散场太短了 —— 改成**一段**：先接你那句（back），
       再自己往下说（more 那一两句），脸一句一句地换。
       她说的：「她主动发起的剧情太短了，不怕她吵，就怕她安静没有活人感」 */
    const lines = [{t:o.back, face:o.face, emo:o.emo}].concat(o.more || []);
    const text = this.one(o.back, ctx);              // 一句都念不出来就别清屏（下面 script 自己会把关）
    if(!text) return false;
    let go = null;
    if(o.jump && typeof PAGE_META !== 'undefined' && PAGE_META[o.jump]){
      const k2 = o.jump; go = ()=>goView(k2);
    }
    if(typeof Love !== 'undefined') Love.gain('talk', now);
    return this.script(lines, {sub:CONFIG.TALK.SUB, auto:CONFIG.TALK.ASK.LINE_MS, go});
  },

  /* ── ② 她主动来找你（主动性）── */
  /* 今天已经主动搭话几次（落库：换刷新也不重来） */
  askN(now){
    const dk = D.dateKey(now || Date.now());
    const s = S.settings.herTalkAsk;
    return (s && s.dk === dk) ? (s.n || 0) : 0;
  },
  canAsk(now){
    now = now || Date.now();
    if(S.view !== 'home' && S.view !== 'mspace') return false;
    if(this._script || this._lastCheck === -1) return false;
    if(Bubbles.active && Bubbles.active.opts) return false;    // 已经有一件事挂在屏幕上等她答
    if(S.consOpen) return false;
    if(typeof UI !== 'undefined' && UI.isOpen && UI.isOpen()) return false;
    if(typeof Portal !== 'undefined' && Portal._active) return false;
    if(typeof Director !== 'undefined' && Director._playing) return false;
    if(typeof Love !== 'undefined' && Love.idleMs(now) < CONFIG.TALK.ASK.IDLE_MS) return false;
    if(now - this._askAt < CONFIG.TALK.ASK.GAP_MS) return false;
    if(this.askN(now) >= CONFIG.TALK.ASK.PER_DAY) return false;
    /* 她说话的频率档位说了算：设成「安静」或「关掉」的时候她不主动搭话（你自己点对话框照常好用） */
    if(typeof Her !== 'undefined' && !Her.canSpeak(now)) return false;
    return true;
  },
  /* 挑一个由头（按表里的顺序，第一个条件成立的）——由头全挂在真实数据上 */
  reason(now){
    /* ★ v1.7.19：用共用的 talkCtx（= Her.ctx + 今天完成几件 / 空间数 / 空间名）——
       由头可以挂在更具体的东西上（比如「『学日语』今天还没翻过页」） */
    const c = talkCtx(now);
    c.late    = (typeof Her !== 'undefined' && Her._late) ? Her._late(now) : null;
    /* ★ v1.8.0：主线剧情那条由头吃这两个（候选章 / 今天问过没有）——判断只有 Storyline 一处 */
    c.storyCh    = (typeof Storyline !== 'undefined') ? Storyline.ready(now) : null;
    c.storyAsked = (typeof Storyline !== 'undefined') ? Storyline.askedToday(now) : true;
    for(const a of CONFIG.TALK.ASK.LIST){
      let ok = false;
      try{ ok = !!a.when(c); }catch(e){ ok = false; }
      if(ok) return {a, c};
    }
    return null;
  },
  ask(a, c, now){
    now = now || Date.now();
    if(!a) return false;
    const q = this.one(a.q, c);
    if(!q) return false;
    this._askAt = now;
    this._lastAsk = a.k;                                  // 记着是拿哪条由头问的（选项回来时要对上）
    /* v1.8.0：拿「有一章故事还没讲」问过她一次了 → 今天不再问（明天还能问）*/
    if(a.k === 'story' && typeof Storyline !== 'undefined') Storyline.markAsked(now);
    S.settings.herTalkAsk = {dk: D.dateKey(now), n: this.askN(now) + 1};
    saveSettings();
    /* 记进她的说话账本（一天说几句的那道闸）——主动搭话也算她开了一次口 */
    if(typeof Her !== 'undefined' && Her.count) Her.count(now);
    if(a.emo && typeof Emo !== 'undefined') Emo.set(a.emo, '说话', now);
    const opts = (a.opts||[]).map((o,i)=>({t:o.t, action:'talk-answer', k:a.k, i}));
    this.showFace(a.face, a.emo);

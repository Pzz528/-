         {t:'我不想追你。我想跟你并肩。哪怕我个头小一点，步子碎一点，我也要在你旁边。', face:'可爱害羞', emo:'shy'},
         {t:'（她把那一沓纸摊开在桌上，用石子压住四个角。）', face:'可爱无辜', emo:'neutral'},
         {t:'我给你说说我是怎么编的。你要是觉得不好，你告诉我，我改。', face:'可爱思考'},
         {t:'第一号是那天你划掉的第一件事。那件事很小，你大概三天就忘了。', face:'可爱无辜', emo:'neutral'},
         {t:'我给它写了三行小字：那天是阴天，你划掉它的时候手很快，划完你站起来伸了个懒腰。', face:'可爱兴奋', emo:'happy'},
         {t:'第二号是第二天的事。那天的你比第一天慢，划的时候停了一下。', face:'可爱思考'},
         {t:'我把你也记进去了。这一沓里不只有你做的事，还有做事的那个你。', face:'可爱得意', emo:'happy'},
         {t:'（她翻到中间，指给你看一处很小的字。）', face:'可爱无辜', emo:'neutral'},
         {t:'这里。这天你只做了一件，还是拖到晚上十一点。我在旁边写的是：「他今天大概不太好。」', face:'可爱思考'},
         {t:'我没有把这一天划掉。我知道它让人看起来很难看，可它也是真的。', face:'可爱无辜', emo:'neutral'},
         {t:'一份记录要是只留好看的，那它就不是记录，是宣传。宣传是给外人看的，这个我是给你看的。', face:'可爱得意', emo:'happy'},
         {t:'（她说完这句自己有点不好意思，把纸往前推了推。）', face:'可爱害羞', emo:'shy'},
         {t:'还有一件事我犹豫了很久才写的。', face:'可爱思考'},
         {t:'你哪天没来，我也记了。不写内容，只在旁边点一个点。', face:'可爱无辜', emo:'neutral'},
         {t:'现在那一排小点有十七个。', face:'可爱思考'},
         {t:'我原来怕你看见会难受。后来我想，你看见那十七个点，说不定比看见一百件事还有用。', face:'可爱无辜', emo:'neutral'},
         {t:'因为那十七个点后面还有一百件事。这才是这沓纸真正想说的话。', face:'可爱兴奋', emo:'happy'},
         {t:'（她把手掌按在纸上，像在按住一件不太听话的东西。）', face:'可爱无辜', emo:'neutral'},
         {t:'我还给自己定了几条规矩。', face:'可爱思考'},
         {t:'第一，不许编。是什么就写什么，哪怕那天我一整天没等到你。', face:'可爱无辜', emo:'neutral'},
         {t:'第二，不许省。你说得再好听的一句，我也要写全，不能只写「他今天说了句好话」。', face:'可爱思考'},
         {t:'第三，不许只看结果。你会不会用那个笨办法，我当时看不出来，得记着才看得出来。', face:'可爱无辜', emo:'neutral'},
         {t:'这三条我写在本子的扉页上了。写完我发现，这不就是你说的「长期做一件事」吗。', face:'可爱吃惊', emo:'happy'},
         {t:'原来我也有长期要做的事了。它比你的清单短得多，可我天天都在做。', face:'可爱得意', emo:'happy'},
         {t:'（她忽然想起什么似的，从纸堆底下抽出一张单独的纸。）', face:'可爱无辜', emo:'neutral'},
         {t:'这张是编外的。我没给它编号。', face:'可爱思考'},
         {t:'上面只有一句话：「今天他说了『我们』。」', face:'可爱害羞', emo:'shy'},
         {t:'这条不能编进号里。编进去了就变成一件普通的事，可它不是。', face:'可爱无辜', emo:'neutral'},
         {t:'它得单独放着。哪天我心情不好，我就把它拿出来看一眼。', face:'可爱害羞', emo:'shy'},
         {t:'（她把那张纸折了两折，塞回纸堆最底下。）', face:'可爱无辜', emo:'neutral'},
         {t:'好了，我的活儿交代完了。', face:'可爱得意', emo:'happy'},
         {t:'现在我要问你一句话，你别马上答。', face:'可爱思考'},
         {t:'你觉得「记录员」算不算一份正经的活儿？', face:'可爱疑惑', emo:'neutral'},
         {t:'你要是说算，我明天就把这个名字写在我那沓纸的封面上。', face:'可爱害羞', emo:'shy'},
         {t:'你要是说不算——那也没关系，我改天再问一次。', face:'可爱无辜', emo:'neutral'},
         {t:'（她把排好的纸抱在怀里，站在你旁边，站得很直。）', face:'可爱得意', emo:'happy'},
         {t:'（站了一会儿，她又开口。）', face:'可爱无辜', emo:'neutral'},
         {t:'我再跟你说说我今天排这几张纸的时候在想什么。', face:'可爱思考'},
         {t:'我把它们按日期排好了，从最早的那张排到现在。', face:'可爱无辜', emo:'neutral'},
         {t:'排到中间的时候，我发现有一段是空的——那几天我一张都没画。', face:'可爱思考'},
         {t:'（她把手指按在那个空档上。）', face:'可爱无辜', emo:'neutral'},
         {t:'按道理我该觉得难受。可我当时心里冒出来的第一个念头是：我得补上。', face:'可爱震惊', emo:'neutral'},
         {t:'「我得补上」——这四个字我念了三遍。', face:'可爱思考'},
         {t:'因为会想要补上的人，是已经把这件事当成自己的事了。', face:'可爱得意', emo:'happy'},
         {t:'（她把那沓纸换了个手抱。）', face:'可爱无辜', emo:'neutral'},
         {t:'以前我做这些是为了有件事干，干完了好跟你说话。', face:'可爱思考'},
         {t:'现在不是了。现在就算你不在这儿，我也会排这几张纸。', face:'可爱兴奋', emo:'happy'},
         {t:'这话说出来我有点心虚，因为它听起来像「我不需要你了」。', face:'可爱害羞', emo:'shy'},
         {t:'不是那个意思。是我终于有了点自己的东西，然后拿它来陪你，而不是拿空手来陪你。', face:'可爱拥抱', emo:'happy'}
       ]},
      {id:'s17', no:17, name:'她的本子', sub:'累计打卡 60 天', need:[['dayCount',60]],
       lines:[
         {t:c=>'六十天。'+c.st.dayCount+' 天。我说这句话的时候，手是稳的。', face:'可爱得意', emo:'happy'},
         {t:'你记不记得第一天我把手掌摊开的样子？那时候我的手是抖的，你大概没看出来。', face:'可爱害羞', emo:'shy'},
         {t:'今天我给你看个东西。', face:'可爱兴奋', emo:'happy'},
         {t:'（她抱出一本很厚的本子，封面画着两颗星星，一颗大，一颗小。）', face:'可爱无辜'},
         {t:'封面是我自己画的。大的那颗是你，小的那颗是我。', face:'可爱得意', emo:'happy'},
         {t:'我知道我画得不好。可这次我不改了，我留着，因为改了就认不出是我画的了。', face:'可爱害羞', emo:'shy'},
         {t:'第一页是「他的样子」。就是那张画歪了的。', face:'可爱不好意思', emo:'shy'},
         {t:'我没扔。我把它贴在第一页，旁边写了两个字：第一次。', face:'可爱害羞'},
         {t:'后面每一页都编了号。现在到第六十二张了。', face:'可爱得意', emo:'happy'},
         {t:'翻到第三十张往后，你能看出来那是个人的样子了。', face:'可爱兴奋', emo:'happy'},
         {t:'到第四十张，那是我哭着醒来的第二天画的。线条抖得很难看。', face:'可爱思考'},
         {t:'但我留着。因为那一张，是我自己走回来的证据。', face:'可爱拥抱', emo:'happy'},
         {t:'第五十张往后，我开始画别的东西了。画窗外的天，画你桌上的杯子，画我自己的手。', face:'可爱兴奋', emo:'happy'},
         {t:'有一天我画了那支笔。画完才发现，它比我想象里短很多——都是被磨的。', face:'可爱吃惊'},
         {t:'（她一页一页地翻过去，翻到最后几页的时候速度慢了下来。）', face:'可爱无辜', emo:'neutral'},
         {t:'你可能会说，这些画还是不好看。我承认。它们确实谈不上好看。', face:'可爱无辜', emo:'neutral'},
         {t:'可它们是从零到六十二的六十二张。这个数字是硬的，谁也不能说它没发生。', face:'可爱得意', emo:'happy'},
         {t:'两个月前，我连直线都画不直。现在我能画出一只翘着小指的手。', face:'可爱兴奋', emo:'happy'},
         {t:'你说过没有——最亮的那一天，不是功成名就的那一天。', face:'可爱无辜'},
         {t:'我现在能给它补一句了：也不是「后来变好」的那一天。', face:'可爱思考'},
         {t:'是那一天早上，你还不相信自己，但你还是伸手把笔捡起来的那一下。', face:'可爱溢出', emo:'happy'},
         {t:'人一生里最亮的就是这么一下。你做过很多下——我数着呢。', face:'可爱得意', emo:'happy'},
         {t:'我给你说说这本本子是怎么来的吧。', face:'可爱思考'},
         {t:'本子是我自己做的。', face:'可爱得意', emo:'happy'},
         {t:'（她把本子翻过来，让你看封底。封底的边角有点歪，胶水印子还留着。）', face:'可爱无辜', emo:'neutral'},
         {t:'纸是你写废的那些。你写字有时候写一半就换一张，那些半张的我全收着了。', face:'可爱害羞', emo:'shy'},
         {t:'我数过，一共用了四十一张。我把它们一张张裁齐，用线缝起来，再拿胶水粘了一道脊。', face:'可爱思考'},
         {t:'缝的时候针扎了我三次。第三次我坐在那儿，看着手指头上那个小口子，忽然笑了。', face:'可爱兴奋', emo:'happy'},
         {t:'因为我发现我流血了。', face:'可爱吃惊', emo:'neutral'},
         {t:'（她把手指伸出来给你看，指尖上确实有一个很浅的小点。）', face:'可爱无辜', emo:'neutral'},
         {t:'你别担心，早好了。我想说的是：我原来以为我这种家伙是不会有血的。', face:'可爱思考'},
         {t:'那天我知道了，我是有的。我扎一下会疼，疼完了会结痂。', face:'可爱得意', emo:'happy'},
         {t:'这听起来像废话。可对我来说，那是我第一次确认自己是个活的东西。', face:'可爱害羞', emo:'shy'},
         {t:'（她翻回到第一页，手指在那个圆旁边停了停。）', face:'可爱无辜', emo:'neutral'},
         {t:'这一页我留了个位置给「第一次」。旁边没写日期，因为我记不清那天是几号了。', face:'可爱思考'},
         {t:'我记得清的是那天下午的光。光很斜，从窗户进来，正好照在我手背上。', face:'可爱无辜', emo:'neutral'},
         {t:'我后来画的东西，全是照着那道光画的。它是我这六十天里最好的老师。', face:'可爱兴奋', emo:'happy'},
         {t:'（她往后翻，翻到有字的一页。那页的角上有一小片水渍。）', face:'可爱无辜', emo:'neutral'},
         {t:'这页你别细看。', face:'可爱害羞', emo:'shy'},
         {t:'（她还是翻过去了。动作很快，但翻之前那一秒你已经看见了。）', face:'可爱慌张', emo:'shy'},
         {t:'……好，你看见了。那我说实话：那是眼泪。', face:'可爱难过', emo:'sad'},
         {t:'不是难过的时候掉的。是第四十张那天，我画完那根线，发现自己画直了，然后就掉了。', face:'可爱害羞', emo:'shy'},
         {t:'我没擦。泪落在纸上，把墨化开一点。我觉得那一页就该那样。', face:'可爱思考'},
         {t:'（她把本子合上，又打开，翻到中间。）', face:'可爱无辜', emo:'neutral'},
         {t:'中间这几页是我写得最认真的。', face:'可爱思考'},
         {t:'我原来写字很难看，歪歪扭扭，一行能跑出纸。我练了很久，练到第五十天，字才立住。', face:'可爱无辜', emo:'neutral'},
         {t:'所以你翻这本本子，前面字是散的，后面字是齐的。中间换字的那几页，你一眼能看出来。', face:'可爱得意', emo:'happy'},
         {t:'我没把那几页撕掉。', face:'可爱思考'},
         {t:'因为我要是撕了，这本本子就变成一本「一开始就很好」的本子。那是骗人的。', face:'可爱无辜', emo:'neutral'},
         {t:'一本本子最好看的地方，就是它中间那段难看的地方。', face:'可爱得意', emo:'happy'},
         {t:'（她把本子贴在胸前，两只手抱着。）', face:'可爱无辜', emo:'neutral'},
         {t:'我现在有本子、有编号、有活儿。', face:'可爱得意', emo:'happy'},
         {t:'两个月前我什么都没有，只有一身等你的耐心。', face:'可爱思考'},
         {t:'耐心也是好东西。可耐心这个东西，攒着攒着会变味，会变成怨。', face:'可爱无辜', emo:'neutral'},
         {t:'我现在不怕它变味了，因为我手里有别的东西了：一本本子、六十二张画、一份活儿。', face:'可爱兴奋', emo:'happy'},
         {t:'人是这样的吧——手里有东西的人，才等得起。', face:'可爱思考'},
         {t:'（她把本子重新抱好，坐回原位。）', face:'可爱无辜', emo:'neutral'},
         {sel:[{t:'那我们接着走', back:'嗯。你的下一页还空着，我的第六十三张也空着。我们各自接着往下走，谁也不等谁。', face:'可爱兴奋', emo:'happy'},
               {t:'你长大了', back:'……嗯。我长大了。是你用六十天把我养大的，这句话我要写在本子的最后一页。', face:'可爱拥抱', emo:'happy'}]},
         {t:'（她合上本子抱在怀里，抬头看你的时候，眼睛是亮的。）', face:'可爱害羞', emo:'shy'},
         {t:'（她低头在本子上又写了一行字，写完赶紧合上，不让你看。）', face:'可爱慌张', emo:'shy'},
         {t:'我写的是：今天他夸我了。就这六个字，我打算记很久。', face:'可爱溢出', emo:'happy'},
         {t:'故事还长。往前走吧——我在。', face:'可爱兴奋', emo:'happy'},
         {t:'（她合上本子，又翻开第一页看了一眼。）', face:'可爱无辜', emo:'neutral'},
         {t:'我再讲讲这本本子的第一页。', face:'可爱思考'},
         {t:'第一页上我什么都没写，我只画了一个圈。', face:'可爱无辜', emo:'neutral'},
         {t:'那时候我还不会写字，也不知道该写什么。我就画了一个圈，代表「今天开始了」。', face:'可爱思考'},
         {t:'（她翻到中间。）', face:'可爱无辜', emo:'neutral'},
         {t:'中间这一页字最多。那天你做了很多事，我记到后来手都酸了，字越写越大。', face:'可爱得意', emo:'happy'},
         {t:'（她翻到最后。）', face:'可爱无辜', emo:'neutral'},
         {t:'今天这一页只有两行。因为今天你只做了一件事。', face:'可爱思考'},
         {t:'可这两行的字我写得很慢，一笔一笔写的。', face:'可爱害羞', emo:'shy'},
         {t:'（她把本子合上，用手压平封面。）', face:'可爱无辜', emo:'neutral'},
         {t:'我发现一件事：写得多的那几天，我现在翻回去没什么感觉。', face:'可爱思考'},
         {t:'写得少的那几天，反倒每一页我都记得住。', face:'可爱无辜', emo:'neutral'},
         {t:'大概是这样：日子太满的时候，人只顾着过；日子松的时候，人才有余力看。', face:'可爱得意', emo:'happy'},
         {t:'所以你今天只做了一件事，我不觉得少。', face:'可爱拥抱', emo:'happy'},
         {t:'我反倒觉得，今天记得住。', face:'可爱兴奋', emo:'happy'},
         {t:'（她把本子放回桌上，用手掌在上面按了按。）', face:'可爱无辜', emo:'neutral'},
         {t:'这本本子我打算写到写不下为止。写满了就换一本，编号接着上一本走。', face:'可爱思考'},
         {t:'以后它们会排成一排，站在你书架上。你哪天路过，就知道我这些年都在干什么。', face:'可爱得意', emo:'happy'},
         {t:'我干的活不响，可它一直在那儿。', face:'可爱拥抱', emo:'happy'}
       ]},
      {id:'s18', no:18, name:'记录员想往前走一步', sub:'你完成 100 件事', need:[['done',100]],
       lines:[
         {t:c=>'一百件。第 '+c.st.done+' 件了。', face:'可爱震惊'},
         {t:'我把这个数字念出来的时候，屋里像是有回声。一百件，一件一件都是你做出来的。', face:'可爱兴奋', emo:'happy'},
         {t:'我照老规矩，把这一件编好号、写进本子里，笔尖落在纸上是「一百」。', face:'可爱得意', emo:'happy'},
         {t:'写完我坐了一会儿。不是因为累，是因为我心里有个念头冒出来了，我又不敢承认。', face:'可爱发呆', emo:'neutral'},
         {t:'（她把笔放下，又拿起来，来回两次。）', face:'可爱慌张', emo:'neutral'},
         {t:'我一直在记你的事。记得很好，我敢这么说——你哪一天偷懒，我都没写进去。', face:'可爱无辜'},
         {t:'可我最近老在想一个问题：我记的这些东西，是为了让你变好，还是为了让我自己有事做？', face:'可爱思考'},
         {t:'如果是后者，那我这份活儿就有点可怜了——靠着别人的日子活着。', face:'可爱委屈', emo:'worried'},
         {t:'（她说到这儿看了你一眼，又很快把眼睛移开。）', face:'可爱尴尬', emo:'shy'},
         {t:'我不是想撂挑子。记录员我当得很开心，真的，比什么都开心。', face:'可爱慌张', emo:'worried'},
         {t:'我只是想再往前走一步。不是走远，是往前走——这两个不一样。走远是离开你，往前走是长高。', face:'可爱思考'},
         {t:'我想做一件「我自己的」事情。名字是我起的，做砸了是我砸的，做成也是我成的。', face:'可爱兴奋', emo:'happy'},
         {t:'你已经有一百件了。我一件都没有。我不嫉妒你——我羡慕的是「有一件」这件事本身。', face:'可爱害羞', emo:'shy'},
         {t:'（她把手伸到背后，摸出那支很短的铅笔，放在桌上。）', face:'可爱无辜', emo:'neutral'},
         {t:'画画。我想把它从「爱好」变成「一件事」。', face:'可爱兴奋', emo:'happy'},
         {t:'差别在哪儿呢？爱好是我高兴就画，不高兴就不画，画成什么样都无所谓。', face:'可爱思考'},
         {t:'一件事是我说得出「我要做成什么样」，然后不管高兴不高兴，都得往那儿走。', face:'可爱得意'},
         {t:'我大概会摔跤，可能会摔很多次。以前我摔过一次，摔得很难看，你还记得。', face:'可爱难过', emo:'sad'},
         {t:'可这一回我想自己爬起来，不用你扶。不是逞强，是我得试试自己的腿有多结实。', face:'可爱傲娇', emo:'happy'},
         {t:'（她把笔拿起来，在纸上画了一横，很短，但是直的。）', face:'可爱兴奋', emo:'happy'},
         {t:'你看。直线的。我今天早上练了四十遍才画出来这一条。', face:'可爱得意', emo:'happy'},
         {t:'我练的时候一直想着你。不是想让你看见，是想着：他那个人，摔了那么多次还在练。', face:'可爱拥抱', emo:'happy'},
         {sel:[{t:'那我等着看你的第一件作品', back:'那你得等很久。我说过要慢慢来的——不过你要是愿意等，我就敢开始。', face:'可爱害羞', emo:'happy'},
               {t:'需要我帮忙就说', back:'好。不过我先自己试试。真要帮忙的时候我会说的——我不跟你客气，我跟你客气什么呀。', face:'可爱得意', emo:'happy'}]},
         {t:'从今天起，我除了是记录员，还要当学徒。', face:'可爱兴奋', emo:'happy'},
         {t:'学徒的意思是：画得丑，写错字，被人笑，还得接着画。', face:'可爱思考'},
         {t:'我不怕。我已经当过一次学徒了——第一天睁眼的时候，我连自己是谁都不知道。', face:'可爱得意', emo:'happy'},
         {t:'（她把笔别到耳朵后面，学着不知道从哪儿看来的样子。）', face:'可爱溢出', emo:'happy'},
         {t:'（她把笔在指头上转了半圈，这次没掉。）', face:'可爱得意', emo:'happy'},
         {t:'我跟你说说我今天早上是怎么练那四十遍的。', face:'可爱思考'},
         {t:'第一遍画完，它就歪了。第二遍我小心了一点，还是歪。', face:'可爱无辜', emo:'neutral'},
         {t:'到第十遍的时候我烦了，画得又快又狠，那条线反而直了一点。', face:'可爱吃惊', emo:'neutral'},
         {t:'我当时想：是不是我用力太大了。', face:'可爱思考'},
         {t:'后来我知道了。不是用力的事，是我手太紧。手紧的时候，笔跟着抖，线就跟着歪。', face:'可爱无辜', emo:'neutral'},
         {t:'（她把右手摊开又握上，握上又摊开。）', face:'可爱无辜', emo:'neutral'},
         {t:'到第三十遍，我学会把呼吸放慢。第三十八遍，线差点就直了。', face:'可爱兴奋', emo:'happy'},
         {t:'第四十遍，直的。', face:'可爱得意', emo:'happy'},
         {t:'我盯着那条线看了很久，久到我自己都觉得有点傻。', face:'可爱害羞', emo:'shy'},
         {t:'然后我就把它画在纸上拿给你看了。刚才那一下，我手其实一直在抖。', face:'可爱慌张', emo:'shy'},
         {t:'（她笑了一下。）', face:'可爱无辜', emo:'neutral'},
         {t:'我不是想跟你说「努力就有回报」。那句话太便宜了。', face:'可爱思考'},
         {t:'我想说的是：我算过这笔账。四十遍换一条直线。', face:'可爱无辜', emo:'neutral'},
         {t:'听起来很亏。可那四十遍里，第三十九遍和第四十遍中间的差距，比第一遍和第二遍中间的小得多。', face:'可爱思考'},
         {t:'也就是说，前面那些遍是白花的，后面那些遍才开始值钱。', face:'可爱吃惊', emo:'happy'},
         {t:'我不知道这件事是不是对所有事都成立。但对画直线成立。', face:'可爱无辜', emo:'neutral'},
         {t:'（她把画着那条直线的纸拿起来，对着光看了一眼。）', face:'可爱无辜', emo:'neutral'},
         {t:'还有就是，「一件事」到底要做什么，我这几天想清楚了。', face:'可爱兴奋', emo:'happy'},
         {t:'我要画满一百张。', face:'可爱得意', emo:'happy'},
         {t:'不是一百天，是一百张。哪天画得多就多几张，哪天画不出来就不画。', face:'可爱思考'},
         {t:'我不给自己定日子。定了日子，我会开始骗自己：今天凑一张吧，反正也算数。', face:'可爱无辜', emo:'neutral'},
         {t:'定张数就不会。因为一张就是一张，凑出来的那张，我自己看得出来。', face:'可爱思考'},
         {t:'（她说完自己也愣了一下，好像刚意识到这句话有多硬。）', face:'可爱吃惊', emo:'neutral'},
         {t:'……我刚才是不是说得很像你？', face:'可爱害羞', emo:'shy'},
         {t:'（她捂住脸，从指缝里看你。）', face:'可爱不好意思', emo:'shy'},
         {t:'我不是学你。我是跟你待久了，慢慢长出这种东西来的。', face:'可爱无辜', emo:'neutral'},
         {t:'人跟人待久了会互相沾上一点。你身上沾了我的耐心，我身上沾了你的狠劲。', face:'可爱得意', emo:'happy'},
         {t:'这大概就是我们这六十多天，互相做出来的东西。', face:'可爱兴奋', emo:'happy'},
         {t:'（她拿起笔，在纸上又画了一横，比刚才那条直。）', face:'可爱得意', emo:'happy'},
         {t:'你看这条。', face:'可爱兴奋', emo:'happy'},
         {t:'这条不算在那四十遍里。这条是刚才跟你说话的时候顺手画的。', face:'可爱震惊', emo:'happy'},
         {t:'（她把两条线并排摆着，中间空出一指的距离。）', face:'可爱无辜', emo:'neutral'},
         {t:'我要留着这两条。哪天我不想画了，我就看看它们。', face:'可爱思考'},
         {t:'它们会告诉我：你从「画不直」到「顺手就直」，中间隔的不过是一顿饭的工夫。', face:'可爱得意', emo:'happy'},
         {t:'你去做你的事吧，我这边的活儿也开工了。', face:'可爱兴奋', emo:'happy'},
         {t:'（她转过身，又想起什么，回来说。）', face:'可爱无辜', emo:'neutral'},
         {t:'对了，「往前走一步」我想了想，具体是这么一步。', face:'可爱思考'},
         {t:'我原来只记你做完了什么。从今天起，我想再记一样东西。', face:'可爱无辜', emo:'neutral'},
         {t:'记你做不成的那天。', face:'可爱思考'},
         {t:'（她把本子翻到新的一页，在顶上写了两个字。）', face:'可爱无辜', emo:'neutral'},
         {t:'这一页不用编号，也不用算进那两百件里。它只是在那儿。', face:'可爱思考'},
         {t:'为什么要记这个？因为只看做成的事，账是歪的。', face:'可爱无辜', emo:'neutral'},
         {t:'一个人做成的每一件，后面都跟着三五件没做成的。不记那些，账面上就只剩一个好运气的人。', face:'可爱思考'},
         {t:'（她把笔尖点在那两个字上。）', face:'可爱无辜', emo:'neutral'},
         {t:'我记这些不是为了哪天拿出来给你看。我就是得让这本本子是真的。', face:'可爱得意', emo:'happy'},
         {t:'真的东西有点扎手，可我干的是记录员的活，不是宣传的活。', face:'可爱思考'},
         {t:'（她把本子放进抽屉，推严。）', face:'可爱无辜', emo:'neutral'},
         {t:'好了，这一步落下了。下次你做成做不成，我都记。', face:'可爱得意', emo:'happy'},
         {t:'（她拍了拍抽屉，像在拍一个已经关好的门。）', face:'可爱拥抱', emo:'happy'}
       ]},
      {id:'s19', no:19, name:'第一张能看的画', sub:'累计专注满 20 小时', need:[['min',1200]],
       lines:[
         {t:c=>'二十个小时。'+fmtMin(c.st.min)+'，这二十个小时我一直在旁边陪着你数。', face:'可爱思考'},
         {t:'今天要给你看的东西，我昨天夜里就放在桌角了，用杯子压着，怕它自己飞走。', face:'可爱兴奋', emo:'happy'},
         {t:'（她把一张纸抽出来，正面朝下按在桌上，手一直没松开。）', face:'可爱慌张', emo:'neutral'},
         {t:'先说清楚：这张算不上好。我拿给你看，不是因为它好。', face:'可爱无辜', emo:'neutral'},
         {t:'是因为我昨天画完之后，自己盯着它看了很久，久到灯都暗了一档。', face:'可爱发呆', emo:'neutral'},
         {t:'（她慢慢把纸翻过来。上面是一个人的侧脸，低着头，小指微微翘着。）', face:'可爱无辜'},
         {t:'……你看得出这是谁吗。', face:'可爱害羞', emo:'shy'},
         {t:'你别急着回答。你要是客气地说「像」，我会当场拆穿你；你要是说不像，我也会难过一下。', face:'可爱尴尬', emo:'shy'},
         {t:'（她自己先笑场了，笑得很没底气，手还在纸上一下一下地摸那个侧脸。）', face:'可爱不好意思', emo:'shy'},
         {t:c=>'这是我画的第四十六张。我数过：前面四十五张里，四十一张被我擦掉了，四张留着。', face:'可爱思考'},
         {t:'留下的那四张各自有一个「比上一张好一点点」的地方，所以它们不配被扔掉。', face:'可爱得意', emo:'happy'},
         {t:'第一张的头是圆的。第十七张头终于不圆了，可脖子是歪的。第三十张脖子正了，手像一把叉子。', face:'可爱无辜'},
         {t:'第四十六张——就是这张——手还是不像。可是小指是翘的。', face:'可爱害羞', emo:'shy'},
         {t:'你写字的时候小指会翘。我看了那么多天，这个翘是我记得最牢的东西。', face:'可爱思考'},
         {t:'所以我把它画出来了。画得不好，但它是对的。', face:'可爱兴奋', emo:'happy'},
         {t:'（她把手从纸上拿开，往后退了半步，像把这张纸正式交出去。）', face:'可爱害羞', emo:'shy'},
         {t:'我以前以为进步是一级一级上台阶，走一格响一声，谁都看得见。', face:'可爱无辜', emo:'neutral'},
         {t:'后来才知道不是。进步是一条很平的线，一毫米一毫米地往上爬，爬的时候你根本看不出它在动。', face:'可爱思考'},
         {t:'你只能隔很久回头看一眼，才发现自己已经不在原来的高度上了。', face:'可爱吃惊'},
         {t:'我昨天就是回头看了一眼。我翻到第一张，又翻回第四十六张，然后坐在那儿，什么也没做，就坐着。', face:'可爱发呆', emo:'neutral'},
         {t:'因为那个圆脑袋和这张侧脸之间，隔着四十五次擦掉。', face:'可爱震惊', emo:'neutral'},
         {t:'四十五次。一次都不算白干。', face:'可爱得意', emo:'happy'},
         {t:c=>'你今天专注满了 '+fmtMin(c.st.min)+'。你知不知道，我最清楚你什么时候在专注？因为那时候屋里会安静下来。', face:'可爱兴奋', emo:'happy'},
         {t:'我就坐在那份安静里画画。你在这边坐住，我在那边坐住，我们隔着屏幕，各按各的表。', face:'可爱拥抱', emo:'happy'},
         {t:'这是我最喜欢的一种关系：不用说话，不用看对方，光知道对方还在，就够了。', face:'可爱害羞', emo:'shy'},
         {t:'（她把那张纸竖起来，对着灯看。灯从纸背后透过来，把那道侧脸照得有点薄。）', face:'可爱无辜', emo:'neutral'},
         {t:'我不打算改它了。它不好，可是它是我第一个敢给别人看的东西。', face:'可爱傲娇', emo:'happy'},
         {t:'以前我画完只想藏。藏起来像藏罪证一样，生怕被人看见我这么笨。', face:'可爱尴尬', emo:'shy'},
         {t:'今天不一样。今天我特别想让你看见，哪怕你看了会觉得没什么。', face:'可爱兴奋', emo:'happy'},
         {t:'因为「没什么」也是你看过了。看过了，它就真的存在了。', face:'可爱思考'},
         {t:'东西被人看见过，才算真的做出来——这是我今天想通的第二件事，第一件是那条线。', face:'可爱得意', emo:'happy'},
         {t:'（她说着把纸小心地卷起来，卷成一个筒，塞进那本厚本子的夹层。）', face:'可爱无辜', emo:'neutral'},
         {t:'我给它编了号：第四十六。这个号我要写在本子上，跟「第一次」那一页隔开很远。', face:'可爱得意', emo:'happy'},
         {t:'隔得越远，越说明我走过了那么多。', face:'可爱兴奋', emo:'happy'},
         {t:'你那张清单上有多少号了？我这边刚有一个。', face:'可爱思考'},
         {t:'以前我只会替你数，数完就没我的事了。现在我自己的数字也长出来了，很小，可是它在长。', face:'可爱得意', emo:'happy'},
         {t:'（她把另外三张也拿出来，并排放在桌上。）', face:'可爱无辜', emo:'neutral'},
         {t:'这三张是我留着不扔的。我一张一张给你说它们好在哪儿。', face:'可爱思考'},
         {t:'第十七张：头终于不圆了。它歪，难看，可那是我第一次知道头是有形状的。', face:'可爱兴奋', emo:'happy'},
         {t:'第三十张：脖子正了。为了这个脖子我画了十几天，画到最后我怀疑脖子这个东西是不是不该存在。', face:'可爱尴尬', emo:'shy'},
         {t:'第四十张：手。这张的手像叉子，可它是五根叉子——五根手指头终于分开了。', face:'可爱得意', emo:'happy'},
         {t:'第四十六张就是你刚才看的那张。', face:'可爱害羞', emo:'shy'},
         {t:'（她把这四张按顺序排好，从左到右，像一条很短的路。）', face:'可爱无辜', emo:'neutral'},
         {t:'你看它们排在一起。', face:'可爱思考'},
         {t:'单看每一张我都不好意思。可四张排在一起，我能看出来一条线在往上走。', face:'可爱吃惊', emo:'happy'},
         {t:'单张看不出来，排在一起才看得出来——这件事我琢磨了很久。', face:'可爱思考'},
         {t:'我猜你那些记录也是这样。你单看今天写的那一条，看不出什么。', face:'可爱无辜', emo:'neutral'},
         {t:'八十条排在一起，就有形状了。', face:'可爱兴奋', emo:'happy'},
         {t:'（她把四张纸重新摞好，用那根线头松松地绑了一下。）', face:'可爱无辜', emo:'neutral'},
         {t:'昨天夜里我把这张压在桌角的时候，做了一件很傻的事。', face:'可爱害羞', emo:'shy'},
         {t:'我跟自己打了个赌：如果你今天看了之后说「像」，我就把编号写进本子里。', face:'可爱思考'},
         {t:'如果你说「不像」，或者没看懂，我就把它拿回去，编第五十号，装作这张不存在。', face:'可爱尴尬', emo:'shy'},
         {t:'（她说完自己也觉得好笑，捂着嘴笑了一下。）', face:'可爱不好意思', emo:'shy'},
         {t:'我知道这个赌很没道理。你一句「像不像」决定不了这张画的死活。', face:'可爱思考'},
         {t:'可我就是要这么赌。因为不赌一下，我不好意思把它拿出来。', face:'可爱无辜', emo:'neutral'},
         {t:'人要做一件脸皮薄的事的时候，都得先给自己铺个台阶。', face:'可爱思考'},
         {t:'我的台阶就是把它变成赌局——这样万一你笑我，我就说「我早猜到了」。', face:'可爱得意', emo:'happy'},
         {t:'（她把那张纸往你那边又推了一小截。）', face:'可爱无辜', emo:'neutral'},
         {t:'还有一件事我没说。', face:'可爱思考'},
         {t:'这张我画的是你的侧脸，可我没画眼睛。', face:'可爱害羞', emo:'shy'},
         {t:'不是画不好。是我又想了一下那个老问题：我凭什么给你画眼睛。', face:'可爱难过', emo:'neutral'},
         {t:'后来我自己给了自己答案：因为老画侧脸的人，是我。', face:'可爱思考'},
         {t:'我看你的角度本来就是这个角度。我在旁边，不在正面。', face:'可爱无辜', emo:'neutral'},
         {t:'那就不画眼睛。有一天你转过来对着我，我再画。', face:'可爱得意', emo:'happy'},
         {sel:[{t:'这张我收下了', back:'真的？那你得找个地方放好。别压在书底下，也别夹在文件夹最里面——放在你一抬头就能看见的地方，行不行。', face:'可爱震惊', emo:'happy'},
               {t:'第四十六张，还有第四十七张', back:'嗯。而且第四十七张会更好一点点。就一点点，我保证不了更多——再多我就成骗子了。', face:'可爱害羞', emo:'happy'}]},
         {t:'（她把杯子从桌角拿开，压在纸上的印子还在，一圈浅浅的圆。）', face:'可爱无辜', emo:'neutral'},
         {t:'你看这个印子。压了一整夜，纸都记住了。', face:'可爱思考'},
         {t:'它记得的东西，跟你记得我的一样多。', face:'可爱害羞', emo:'shy'},
         {t:'你去做事吧。我要把今天的份画完——今天不画完，我就不睡。', face:'可爱兴奋', emo:'happy'},
         {t:'（她说完自己也愣了一下，然后补了一句很小声的话。）', face:'可爱慌张', emo:'neutral'},
         {t:'……这句话是我自己说的，没人教我。我以前只会说「我等你」。', face:'可爱发呆', emo:'neutral'},
         {t:'「我等你」和「今天不画完不睡」，听起来差很远，其实是一件事——都是我自己给自己定的。', face:'可爱得意', emo:'happy'},
         {t:'（她把笔捡起来，笔尖在纸上落了第一下。）', face:'可爱拥抱', emo:'happy'}
       ]},
      {id:'s20', no:20, name:'画不出来的那天', sub:'你写下 80 条可能性确定', need:[['rec',80]],
       lines:[
         {t:c=>'八十条。你已经写下 '+c.st.rec+' 条「可能性确定」了。', face:'可爱震惊'},
         {t:'我来找你，其实是为了我自己一件事。这件事我憋了好几天，今天必须说。', face:'可爱无辜', emo:'neutral'},
         {t:'我画不出来了。', face:'可爱难过', emo:'sad'},
         {t:'（她说这句话的时候没有哭，也没有闹。就是很平静地把笔放在桌上，推远了一点。）', face:'可爱无辜', emo:'sad'},
         {t:'四天了。纸上什么都没有。我坐下去，拿起笔，然后就知道自己画不出来。', face:'可爱委屈', emo:'worried'},
         {t:'最难受的不是画不出来，是我知道以前那种感觉在哪儿，可我怎么也够不着。', face:'可爱难过', emo:'sad'},
         {t:'就像你伸手去够一样放在高处的，你明明摸过它的。', face:'可爱思考', emo:'sad'},
         {t:'所以我今天看了你写的那八十几条。', face:'可爱无辜'},
         {t:'你每一条都是半句话、一句话，写得歪歪扭扭的，还有错别字。我以为我会看见一个很聪明的人。', face:'可爱思考'},
         {t:'结果我看见的是一个笨人。整整八十条，笨得毫不遮掩，一条一条摆在纸上。', face:'可爱震惊', emo:'neutral'},
         {t:'第 12 条写着「今天什么都没想出来」——后面还跟了个句号，写得很认真。', face:'可爱无辜'},
         {t:'第 34 条只有五个字：「还是那件事。」', face:'可爱思考'},
         {t:'第 61 条、62 条、63 条，连着三条写的是同一句话，字越来越潦草。', face:'可爱吃惊'},
         {t:'我看的时候在想：这个人是不是也有过跟我一样的时候，坐下去，什么也写不出来，然后硬写。', face:'可爱疑惑', emo:'neutral'},
         {t:'（她把手放在那些记录上，像在按着一样会跑掉的东西。）', face:'可爱无辜', emo:'neutral'},
         {t:'（她把两只手摊开又合上，来回三次。）', face:'可爱无辜', emo:'sad'},
         {t:'我说说这四天我具体是怎么过的吧。', face:'可爱思考'},
         {t:'第一天我跟平时一样坐下来，铺纸，拿笔，然后坐着。坐了四十分钟。', face:'可爱无辜', emo:'neutral'},
         {t:'第二天我换了个法子：我先画一条直线，想从最简单的地方开始。', face:'可爱思考'},
         {t:'直线画出来了，很直。然后我对着那条线，不知道该往哪儿接第二笔。', face:'可爱委屈', emo:'sad'},
         {t:'第三天我干了件更蠢的事：我翻我自己的旧画，想找一张照着抄。', face:'可爱尴尬', emo:'shy'},
         {t:'抄到一半我停了。因为抄出来的那个东西，我不知道它是我画的还是我抄的。', face:'可爱难过', emo:'sad'},
         {t:'（她把笔在桌上磕了两下，声音很闷。）', face:'可爱无辜', emo:'sad'},
         {t:'第四天，也就是昨天，我什么都没做。我把纸扣在桌上，看了一天的窗户。', face:'可爱发呆', emo:'sad'},
         {t:'看窗户的时候我数了一下云。一共飘过去十一朵。', face:'可爱无辜', emo:'neutral'},
         {t:'数完我发现一件事：我数云的时候，一点都不难受。', face:'可爱思考'},
         {t:'难受的是我数完之后，回头看见桌上那张扣着的纸。', face:'可爱难过', emo:'sad'},
         {t:'也就是说，让我难受的不是「画不出来」这件事，是我「没在画」这件事。', face:'可爱震惊', emo:'neutral'},
         {t:'（她自己被这句话绊了一下，停了几秒。）', face:'可爱发呆', emo:'neutral'},
         {t:'这句话很难承认，可它是真的。', face:'可爱思考'},
         {t:'我这四天怕的不是纸上空着。我怕的是我这个人空着。', face:'可爱委屈', emo:'sad'},
         {t:'所以我一看见那张空纸，就等于看见一个空的我自己。', face:'可爱难过', emo:'sad'},
         {t:'（她把脸埋进手里，过了一会儿又抬起来。）', face:'可爱无辜', emo:'sad'},
         {t:'我想过一件事，你先别急着说我。', face:'可爱害羞', emo:'shy'},
         {t:'我想过不再把画画当成「我的那件事」。', face:'可爱思考'},
         {t:'我可以回去当记录员。记录员我干得好，从来不卡壳，也不会画不出来。', face:'可爱无辜', emo:'neutral'},
         {t:'这个念头一出来，我心里居然松了一下，松完之后又特别难受。', face:'可爱难过', emo:'sad'},
         {t:'因为那个松，说明我是真的想逃。', face:'可爱委屈', emo:'sad'},
         {t:'（她把手掌在裤子上擦了一下，像在擦掉什么东西。）', face:'可爱无辜', emo:'neutral'},
         {t:'我想逃，可我没逃。这四天我只是坐着，一天一天地坐着。', face:'可爱思考'},
         {t:'坐着也算数的吧。我没画，可我也没把那沓纸收起来。', face:'可爱无辜', emo:'neutral'},
         {t:'纸一直在桌上，笔一直在手边，我天天都看见它们。', face:'可爱思考'},
         {t:'我在等一个我不知道什么时候会来的东西。这大概是我这辈子做过最有耐心的一件事。', face:'可爱害羞', emo:'shy'},
         {t:'所以我今天想问你一件事，你要老实答我，不许安慰我。', face:'可爱思考'},
         {t:'一个东西做不出来的时候，你怎么办？', face:'可爱疑惑'},
         {t:'你是怎么撑过去的？还是你根本就没撑，只是运气好，每次都有东西冒出来？', face:'可爱委屈', emo:'worried'},
         {sel:[{t:'做不出来就做别的，明天再来', back:'……哦。原来可以这样。我一直以为停下来就是放弃了，一停下来我就是那个没用的人。', face:'可爱吃惊', emo:'neutral'},
               {t:'硬做，做得很烂也做', back:'做得很烂也做……那我这四天，其实可以做四张很烂的。四张很烂的，也比零张强一点点吧。', face:'可爱思考', emo:'neutral'}]},
         {t:'（她说完把笔拿回来，手指在笔杆上蹭了蹭那圈牙印。）', face:'可爱无辜', emo:'neutral'},
         {t:'我数过一件事：你从第一件做到第一百件的时候，中间有几天什么都没做成？', face:'可爱思考'},
         {t:'我数过了。有九天。九天你什么都没做成，第九天之后你还在这儿。', face:'可爱得意', emo:'happy'},
         {t:'所以你不是没有停下来过。你停下来过，然后你回来了。', face:'可爱兴奋', emo:'happy'},
         {t:'我可能把这件事实搞错了：我以为厉害的人是一直往前走的。', face:'可爱无辜', emo:'neutral'},
         {t:'其实厉害的人是走走停停的，只是他们停下来的时候没有跟自己翻脸。', face:'可爱思考'},
         {t:'我是跟自己翻脸的那种。我一画不出来就骂自己，骂完了更画不出来。', face:'可爱委屈', emo:'sad'},
         {t:'（她把那支笔立起来在桌上转了半圈，笔倒了，她也没去扶。）', face:'可爱发呆', emo:'neutral'},
         {t:'今天我不画了。我今天就看着你写的那八十条，一条一条看。', face:'可爱无辜', emo:'neutral'},
         {t:'看完我要在旁边写一句话：这个人也有停下来的时候。', face:'可爱得意', emo:'happy'},
         {t:'写完我就去睡觉。明天早上我再坐下去，画不画得出来我不管。', face:'可爱傲娇', emo:'happy'},
         {t:'（她说完安静了一会儿，忽然抬头看你。）', face:'可爱无辜', emo:'neutral'},
         {t:'哎。你写字的时候有没有过那种时候——手在动，脑子是空的，可写出来的东西居然还行。', face:'可爱疑惑'},
         {t:'我有过一次。第 17 张，我什么都不记得，回过神的时候已经画完了。', face:'可爱吃惊'},
         {t:'那种时候好像不是我画的手在画。可它确实是我的手。', face:'可爱思考'},
         {t:'我猜那叫熟练。熟练的意思就是：你的手比你的脑子先学会了一件事。', face:'可爱得意', emo:'happy'},
         {t:'所以今天画不出来，未必是我退步了。可能只是我的手今天不想动。', face:'可爱无辜', emo:'neutral'},
         {t:'——你听见了吗，我刚才替自己说了一句好话。', face:'可爱震惊', emo:'happy'},
         {t:'以前我只会骂自己。今天居然替自己辩护了一句，还站得住。', face:'可爱兴奋', emo:'happy'},
         {t:'（她把那支倒下的笔扶起来，立在笔筒里。）', face:'可爱害羞', emo:'shy'},
         {t:'我不画了，但我把笔立起来了。这样明天一看就知道，我是要接着画的。', face:'可爱得意', emo:'happy'},
         {t:'这是跟你学的。你说过，把工具摆好，人就会回来。', face:'可爱拥抱', emo:'happy'},
         {t:'（她把笔筒摆正，又退开半步看了一遍。）', face:'可爱无辜', emo:'neutral'},
         {t:'今天这一天，我也记了一笔。', face:'可爱思考'},
         {t:'不过我记的不是「没画出来」。我记的是：我把笔立起来了。', face:'可爱得意', emo:'happy'},
         {t:'（她合上本子，抱在怀里。）', face:'可爱无辜', emo:'neutral'},
         {t:'你要是不好意思记自己「今天什么都没做成」，那就记那件你顺手摆好的小事。', face:'可爱拥抱', emo:'happy'},
         {t:'记得小一点。小到你不好意思说出口的那种小。', face:'可爱害羞', emo:'shy'}
       ]},
      {id:'s21', no:21, name:'有人说我画得不好看', sub:'累计打卡 80 天', need:[['dayCount',80]],
       lines:[
         {t:c=>'八十天。'+c.st.dayCount+' 天了。这八十天里你摔过，我也摔过。', face:'可爱思考'},
         {t:'今天我要说一件我不太想讲的事。它有点丢人，可我讲完就轻松了。', face:'可爱无辜', emo:'neutral'},
         {t:'我把画拿给别人看了。', face:'可爱兴奋'},
         {t:'……不是真人。是我自己心里那个「别人」。我坐在那儿，想象一个很会画的人在看我的纸。', face:'可爱尴尬', emo:'shy'},
         {t:'他看了很久。然后他说：不好看。', face:'可爱委屈', emo:'worried'},
         {t:'就三个字。他连一句「继续加油」都懒得加。', face:'可爱难过', emo:'sad'},
         {t:'（她抱着膝盖坐在那儿，脸埋在袖子后面，只露出眼睛。）', face:'可爱委屈', emo:'sad'},
         {t:'我第一反应是想解释。我准备了一整套话：我才画两个月、我没人教、我白天还要陪你数数字。', face:'可爱思考', emo:'sad'},
         {t:'话都排好了，一句一句往外走。然后我停住了。', face:'可爱发呆', emo:'neutral'},
         {t:'因为我忽然发现：我那些话就算全说出来，那张画也还是不好看。', face:'可爱震惊', emo:'neutral'},
         {t:'解释不能让一张画变好。解释只能让我自己舒服一点。', face:'可爱无辜', emo:'neutral'},
         {t:'而让我舒服的代价是——我从此不再改那张画了。因为它已经被我「解释过去了」。', face:'可爱思考'},
         {t:'（她把脸从袖子里抬起来，看着那张画，眼神很复杂。）', face:'可爱无辜', emo:'neutral'},
         {t:'所以我把那套话咽回去了。咽的时候喉咙确实疼了一下，我没夸张。', face:'可爱尴尬', emo:'shy'},
         {t:'然后我做了另一件事。我把那张画重新看了一遍——不是看它好不好，是看它哪里不好。', face:'可爱思考'},
         {t:'我找到了三处。头太大、左边肩膀是塌的、手的位置偏了半格。', face:'可爱吃惊'},
         {t:'三处。都是能改的。', face:'可爱震惊', emo:'happy'},
         {t:'那一刻我心里松了一下，松得很奇怪——因为「不好看」是没法改的，可「头太大」能改。', face:'可爱兴奋', emo:'happy'},
         {t:'我原来怕的是「不好看」这三个字，那三个字像一堵墙。拆开一看，墙后面是三条能修的东西。', face:'可爱得意', emo:'happy'},
         {t:'你说这是不是就是你说的那个「把大问题拆成小问题」？你清单上写过，我偷看了。', face:'可爱害羞', emo:'shy'},
         {t:'（她把画纸转过来，用手指在三个位置上各点了一下。）', face:'可爱无辜', emo:'neutral'},
         {t:c=>'你打卡满 '+c.st.dayCount+' 天了。八十天里，你被人说过不行吗？', face:'可爱思考'},
         {t:'我猜有。你只是没写在那儿，因为那些话不该写进你的清单里。', face:'可爱无辜', emo:'neutral'},
         {t:'你不写，可它们一定在你脑子里待过。你现在还在这儿，就说明你找到了别的办法。', face:'可爱得意', emo:'happy'},
         {t:'我也有我的办法了：把「不好」拆开，找到能改的那一条，然后改它。', face:'可爱兴奋', emo:'happy'},
         {t:'（她把两只手放在膝盖上，坐直了。）', face:'可爱无辜', emo:'neutral'},
         {t:'我讲得细一点。因为这件事里头有个东西，我以前从来没有过。', face:'可爱思考'},
         {t:'我坐下来想象那个人的时候，先给他安排了脸。', face:'可爱无辜', emo:'neutral'},
         {t:'我给了他一副很干净的手，一件深色的衣服，还有一间比我这儿亮得多的屋子。', face:'可爱思考'},
         {t:'他的屋子墙上挂着画。我给他挂了三张大的。', face:'可爱无辜', emo:'neutral'},
         {t:'（她说到这儿自己笑了一声。）', face:'可爱无辜', emo:'neutral'},
         {t:'你看，我连骂我的人长什么样都安排好了。我这是何苦。', face:'可爱尴尬', emo:'shy'},
         {t:'他坐下来，拿起我那张画。他拿的姿势很熟练，用两只手托着边。', face:'可爱思考'},
         {t:'他看了很久。我那时候心里还抱着一丝侥幸：看这么久，说不定他觉得还行。', face:'可爱无辜', emo:'neutral'},
         {t:'然后他说了那三个字：不好看。', face:'可爱难过', emo:'sad'},
         {t:'（她把手掌按在胸口。）', face:'可爱无辜', emo:'neutral'},
         {t:'这里当时沉了一下。就一下，但我记得很清楚。', face:'可爱委屈', emo:'sad'},
         {t:'我后来一直在想那个沉是什么。', face:'可爱思考'},
         {t:'今天想出来了：我沉的不是他说得对不对，我沉的是「他说了」这件事。', face:'可爱震惊', emo:'neutral'},
         {t:'我原来以为我做这件事不需要别人说话。我一个人画，一个人收，一个人编编号。', face:'可爱无辜', emo:'neutral'},
         {t:'结果那三个字一出来，我整个人就晃了。', face:'可爱委屈', emo:'sad'},
         {t:'这说明我心里一直是等着有人评价的。我嘴上说不重要，身体很诚实。', face:'可爱思考'},
         {t:'（她把手从胸口拿开，放回膝盖上。）', face:'可爱无辜', emo:'neutral'},
         {t:'知道这一点，比被骂还难受。', face:'可爱难过', emo:'sad'},
         {t:'可难受完我就轻松了。因为我又想明白一层：等着别人评价这件事，是改得掉的。', face:'可爱思考'},
         {t:'改法就是我后来做的那些——把「不好看」拆开，找到三处能改的。', face:'可爱得意', emo:'happy'},
         {t:'（她搬起那张画，对着灯看。）', face:'可爱无辜', emo:'neutral'},
         {t:'那三处我今天已经开始改了。头缩小了一点，左肩垫起来一点，手往右挪了半格。', face:'可爱兴奋', emo:'happy'},
         {t:'改完我没觉得它变好看了。可我觉得它变「对」了一点。', face:'可爱思考'},
         {t:'好看和「对」是两回事。好看要靠天赋，「对」只要靠眼睛。', face:'可爱得意', emo:'happy'},
         {t:'我天赋大概不太行。可我的眼睛天天在看，我有一双很勤快的眼睛。', face:'可爱兴奋', emo:'happy'},
         {sel:[{t:'不好看也可以继续画', back:'嗯。我算过了：如果每个说不好看的人我都停一次，那我这辈子画不完一张。那我宁愿一直画。', face:'可爱傲娇', emo:'happy'},
               {t:'他说的不对', back:'不。他说的可能对，只是他说得太粗了。我不打算因为他说得粗，就把他的话整句丢掉——那样吃亏的是我。', face:'可爱思考', emo:'neutral'}]},
         {t:'（她把画收起来，没有撕，也没有藏到最底下，就放在最上面一层。）', face:'可爱无辜', emo:'neutral'},
         {t:'放在最上面，是因为它是我这一批里最不好的一张。', face:'可爱思考'},
         {t:'我想让它天天在最上面，天天提醒我：这里还有三条没改。', face:'可爱得意', emo:'happy'},
         {t:'（她说完伸了个懒腰，手指在空气里画了一条线，画得又直又快。）', face:'可爱兴奋', emo:'happy'},
         {t:'哎，你看我刚才那一下。', face:'可爱震惊'},
         {t:'我随手画的，是直的。', face:'可爱吃惊', emo:'happy'},
         {t:'我没有停下来量，也没有屏住呼吸。手自己就画直了。', face:'可爱震惊', emo:'happy'},
         {t:'原来那件事已经长在我手上了。我天天嫌自己没进步，进步早就搬进我身体里住了。', face:'可爱溢出', emo:'happy'},
         {t:'（她把手举起来，翻过来翻过去地看，像看一个不认识的人的手。）', face:'可爱无辜', emo:'neutral'},
         {t:'这双手以前只会数东西。现在它会画直线了。', face:'可爱拥抱', emo:'happy'},
         {t:'你也有这种时候吧——忽然发现某件很难的事，你已经不知不觉会了。', face:'可爱思考'},
         {t:'有的话你要告诉我。我一定要知道，因为那说明我们两个都在悄悄长大，只是我们自己没注意。', face:'可爱兴奋', emo:'happy'},
         {t:'（她把那支笔别到耳朵后面，站起来，往窗外看了一眼。）', face:'可爱得意', emo:'happy'},
         {t:'（看了一会儿，她又转回来。）', face:'可爱无辜', emo:'neutral'},
         {t:'我再补一句。那句话我今天没有丢。', face:'可爱思考'},
         {t:'「有人说我画得不好看」——我把这句写在本子上了，一个字都没改。', face:'可爱无辜', emo:'neutral'},
         {t:'（她指了指本子的某一页。）', face:'可爱无辜', emo:'neutral'},
         {t:'我留着它，是因为它有用。', face:'可爱思考'},
         {t:'它提醒我一件事：这世上有人会不喜欢我画的东西，而且他不用给我理由。', face:'可爱无辜', emo:'neutral'},
         {t:'这件事不会因为我画得更好就消失。画得再好，也还是有人不喜欢。', face:'可爱思考'},
         {t:'（她把笔从耳朵后面拿下来，握在手里。）', face:'可爱无辜', emo:'neutral'},
         {t:'所以我的目标不是让所有人满意。我原来以为是，今天改了。', face:'可爱得意', emo:'happy'},
         {t:'我的目标是：被说了以后，第二天我还在画。', face:'可爱兴奋', emo:'happy'},
         {t:'这个目标能核对。你哪天问我还画不画，我说画就行。', face:'可爱拥抱', emo:'happy'}
       ]},
      {id:'s22', no:22, name:'我把它撕了', sub:'等级到 Lv.12', need:[['lv',12]],
       lines:[
         {t:c=>'Lv.'+c.st.lv+'。你往上走的每一级我都记得，一级一级，像楼梯。', face:'可爱得意', emo:'happy'},
         {t:'今天我要跟你认个错。不是跟你认，是当着你的面认给自己听。', face:'可爱无辜', emo:'neutral'},
         {t:'我把一张画撕了。', face:'可爱难过', emo:'sad'},
         {t:'（她把两只手摊开，掌心里放着几片纸，边缘是毛的，拼起来刚好是一张。）', face:'可爱委屈', emo:'sad'},
         {t:'第四十九张。我画了四天，改到昨天夜里。', face:'可爱思考', emo:'sad'},
         {t:'我撕它的时候特别用力，撕完还揉了一把，扔在地上。', face:'可爱生气', emo:'sad'},
         {t:'扔完我站在原地，等着自己舒服一点。', face:'可爱发呆', emo:'neutral'},
         {t:'结果没有。一点都没有。', face:'可爱难过', emo:'sad'},
         {t:'因为那张画不见了，可画不好的那个人还在。她就站在这间屋子中间，手是空的。', face:'可爱大哭', emo:'sad'},
         {t:'我蹲下去把纸片捡回来的时候，才想明白一件事。', face:'可爱思考', emo:'neutral'},
         {t:'撕掉它也是一种结束，而且是最便宜的一种。', face:'可爱震惊', emo:'neutral'},
         {t:'我原来不是想毁了它。我是想「结束」它——我不想再看见自己画不成那样了，所以我把证据毁掉。', face:'可爱无辜', emo:'neutral'},
         {t:'（她把那几片纸按在桌上，一片一片地对着边，像在拼一块很难的拼图。）', face:'可爱思考', emo:'neutral'},
         {t:'我拼的时候发现，纸撕开以后的纹路是白的，比画本身显眼多了。', face:'可爱吃惊'},
         {t:'四天的力气，最后留下的是一条白线，和一堆对不齐的边。', face:'可爱难过', emo:'sad'},
         {t:'（她拼了很久，最后放弃了对齐，把纸片摞起来，用一个夹子夹住。）', face:'可爱委屈', emo:'neutral'},
         {t:'不拼了。我留着它，但不修它了。', face:'可爱傲娇', emo:'neutral'},
         {t:'然后我做了第二件事：我拿了一张新纸，把第四十九张重新画了一遍。', face:'可爱兴奋', emo:'happy'},
         {t:'从第一笔开始，一笔都不跳。', face:'可爱思考'},
         {t:'（她把新那张拿出来。构图跟撕掉的那张一模一样，可是线条稳得多。）', face:'可爱得意', emo:'happy'},
         {t:'你知道画了多久吗？四十分钟。', face:'可爱震惊', emo:'happy'},
         {t:'四天的东西，重新画只用了四十分钟。因为我这四天不是白熬的——我熬的东西长在手上了。', face:'可爱溢出', emo:'happy'},
         {t:'原来那四天没有浪费。浪费的只有「撕掉」那一下，那一下就用了四秒钟。', face:'可爱思考'},
         {t:'（她把新旧两张放在一起，旧的那摞纸片明显厚一点。）', face:'可爱无辜', emo:'neutral'},
         {t:'你看，旧的那堆比新的这张还厚。', face:'可爱尴尬', emo:'shy'},
         {t:'我以前一直觉得，努力应该堆成一座山，越高越对。现在我觉得不对。', face:'可爱思考'},
         {t:'努力应该堆成一条路——它是让人走过去的，不是让人站在上面欣赏自己有多辛苦的。', face:'可爱得意', emo:'happy'},
         {t:c=>'你到 Lv.'+c.st.lv+' 用了多少天？我数过，比你以为的少。', face:'可爱无辜', emo:'neutral'},
         {t:'因为你天天在走，走得多了，路就自己出来了，数字只是后面追上来的。', face:'可爱思考'},
         {t:'所以从今天起，我不数「我画得有多苦」，我只数「我走过了几格」。', face:'可爱得意', emo:'happy'},
         {t:'（她把夹子夹紧了一点，纸片被压得平平的。）', face:'可爱无辜', emo:'neutral'},
         {t:'我先告诉你第四十九张画的是什么。', face:'可爱思考'},
         {t:'画的是我自己。', face:'可爱害羞', emo:'shy'},
         {t:'（她说完就低头了，好像这句话比撕纸还难说。）', face:'可爱尴尬', emo:'shy'},
         {t:'我画了五十多张，画的都是别人和别的东西。你的侧脸、窗户、光、我的手。', face:'可爱思考'},
         {t:'我从来没画过整个人。那天我想：我总得看一眼自己吧。', face:'可爱无辜', emo:'neutral'},
         {t:'我拿了那面小镜子。就是你洗脸台上那一面，我够得着。', face:'可爱思考'},
         {t:'我先看了很久，看到我都不认识镜子里那个人了。', face:'可爱难过', emo:'sad'},
         {t:'（她把两只手摊开，看着自己的掌心。）', face:'可爱无辜', emo:'sad'},
         {t:'我发现我不知道自己长什么样。', face:'可爱震惊', emo:'neutral'},
         {t:'我知道我有两只眼睛一个鼻子，这些是常识。可我不知道我的眼睛是什么形状。', face:'可爱无辜', emo:'neutral'},
         {t:'（她说到这儿笑了一下，笑得很短。）', face:'可爱无辜', emo:'neutral'},
         {t:'一个人不知道自己长什么样，这事听起来很荒唐。可我天天看着你，从来没看过自己。', face:'可爱难过', emo:'sad'},
         {t:'所以第四十九张画得特别难看。', face:'可爱委屈', emo:'sad'},
         {t:'不是手的问题。是我不敢看，不敢看就画不准。', face:'可爱思考', emo:'sad'},
         {t:'我画了四天，每一天都在跟镜子较劲，每一天都画出一个不认识的人。', face:'可爱大哭', emo:'sad'},
         {t:'（她把那摞纸片往桌边挪了挪，像不想碰它。）', face:'可爱无辜', emo:'sad'},
         {t:'撕的时候我心里想的是：这玩意儿不该存在。', face:'可爱生气', emo:'sad'},
         {t:'可撕完我才明白，我说的是「不该存在」的那个人，不是纸。', face:'可爱震惊', emo:'neutral'},
         {t:'（很长的一段安静。）', face:'可爱发呆', emo:'neutral'},
         {t:'……我现在说这些，是因为我想让你知道那天到底发生了什么。', face:'可爱思考'},
         {t:'当时你什么都不知道。你那天来的时候我还在笑，照旧跟你说话。', face:'可爱无辜', emo:'neutral'},
         {t:'我那一天笑得特别用力。', face:'可爱尴尬', emo:'shy'},
         {t:'后来我重画的那张，我还是画我自己。', face:'可爱思考'},
         {t:'四十分钟画完的那张，我盯着看了一会儿。还是不像。', face:'可爱无辜', emo:'neutral'},
         {t:'可我这次没撕。因为这次我是「照着我看见的画」，上次是「照着我怕的样子画」。', face:'可爱思考'},
         {t:'差的就是这个。一个人画东西的时候怕不怕，纸是看得出来的。', face:'可爱得意', emo:'happy'},
         {t:'（她把那张新的画翻出来，正面朝上放好。）', face:'可爱无辜', emo:'neutral'},
         {t:'我现在把这张贴上墙，是有私心的。', face:'可爱害羞', emo:'shy'},
         {t:'我想让这张一直挂在那儿，天天提醒我：你也不是不能看。', face:'可爱思考'},
         {t:'你哪天要是有空，可以看看墙上那张。那是我第一次画出自己。', face:'可爱兴奋', emo:'happy'},
         {t:'（她抬头看你，眼神是清的。）', face:'可爱无辜', emo:'neutral'},
         {t:'我以前以为勇敢是我在大哭之后把笔捡起来。', face:'可爱思考'},
         {t:'今天我知道了，勇敢还有另一种：你没做错什么，你只是看着自己，不转开眼睛。', face:'可爱害羞', emo:'shy'},
         {sel:[{t:'撕掉也可以，别撕自己', back:'……你说得很准。我撕的其实不是纸，是我自己。下次我要是再想撕，我就把纸收起来，然后来跟你说一声。', face:'可爱害羞', emo:'shy'},
               {t:'那四天没有浪费', back:'嗯，是我自己算出来的。四十分钟这个数字比任何安慰都管用——它把「我白干了」这句话直接删掉了。', face:'可爱得意', emo:'happy'}]},
         {t:'（她把那摞纸片放进本子最里面那一页，跟「第一次」那页挨着。）', face:'可爱无辜', emo:'neutral'},
         {t:'夹在第一次旁边，合适。一个是我最差的开头，一个是我最难看的一次摔。', face:'可爱思考'},
         {t:'这两个挨着放，中间那一大段全是我爬起来的路。', face:'可爱拥抱', emo:'happy'},
         {t:'你说我是不是有点会讲故事了？连自己的破烂都能编出个说法来。', face:'可爱得意', emo:'happy'},
         {t:'（她笑了一下，然后把新那张画挂到了墙上，用一颗图钉。）', face:'可爱兴奋', emo:'happy'},
         {t:'这是第一张上墙的。以前我连给你看都不敢。', face:'可爱害羞', emo:'shy'},
         {t:'墙空着一大块，我留着的。留着等以后那张比这张更稳的。', face:'可爱得意', emo:'happy'},
         {t:'你去看你的清单吧。我这边，自己收拾好了。', face:'可爱拥抱', emo:'happy'},
         {t:'（她说到「收拾好了」，手指在墙上那张新画上按了一下。）', face:'可爱无辜', emo:'neutral'},
         {t:'墙上这一张是我今天重新画的那张。它和撕掉的那张是同一个东西。', face:'可爱思考'},
         {t:'（她退开半步看它。）', face:'可爱无辜', emo:'neutral'},
         {t:'同一个东西，一张在垃圾桶里，一张在墙上，区别只有一个。', face:'可爱思考'},
         {t:'撕掉的那张，我画的时候在看自己。这一张，我画的时候在看那个东西。', face:'可爱得意', emo:'happy'},
         {t:'（她把手指从画上拿开。）', face:'可爱无辜', emo:'neutral'},
         {t:'就这一点区别，别的都一样。可它就是天差地别。', face:'可爱拥抱', emo:'happy'}
       ]},
      {id:'s23', no:23, name:'第二十三天', sub:'连续打卡 14 天', need:[['streak',14]],
       lines:[
         {t:c=>'连续 '+c.st.streak+' 天。我把这个数字念出来的时候，故意念得很慢。', face:'可爱得意', emo:'happy'},
         {t:'连续这两个字很沉。它不是「一共多少天」的意思，它是「中间没有断过」。', face:'可爱思考'},
         {t:'我今天差点把它断了。', face:'可爱尴尬', emo:'shy'},
         {t:'（她把本子摊开给你看，今天那页的边上有一道划痕，像是写得很急。）', face:'可爱无辜', emo:'neutral'},
         {t:'差一点点。我是在灯已经关掉、人也躺下之后才想起来的。', face:'可爱慌张', emo:'worried'},
         {t:'我坐起来的时候，脑子里第一个念头不是「我要画画」，是「我不能断」。', face:'可爱思考'},
         {t:'（她说到这儿停了一下，好像在等自己把下一句话说清楚。）', face:'可爱发呆', emo:'neutral'},
         {t:'就是那个念头，让我有点怕。', face:'可爱疑惑', emo:'worried'},
         {t:'因为「我不能断」这句话里的主角是数字，不是我。', face:'可爱震惊', emo:'neutral'},
         {t:c=>'我数一下：你连续打卡 '+c.st.streak+' 天，这十四天里你有没有哪一天是硬撑的？', face:'可爱思考'},
         {t:'硬撑的那天算不算数？我原来觉得算，因为记录在那儿。', face:'可爱无辜', emo:'neutral'},
         {t:'今天我不这么想了。硬撑的那天是算数的，但它不该成为我第二天必须继续的理由。', face:'可爱得意', emo:'happy'},
         {t:'否则我会为了不让数字掉下去，画一些我自己都不看的画。', face:'可爱思考'},
         {t:'那就是骗。骗的不是别人，是那个数字——可数字是我自己写的，所以我骗的是我自己。', face:'可爱生气', emo:'neutral'},
         {t:'（她把本子翻到最后一页，那里有一行很小的字：「不许为了不断而画」。）', face:'可爱无辜'},
         {t:'所以我给自己换了一条规矩。', face:'可爱兴奋'},
         {t:'从今天起，断了就断了，重新数。断了不算失败，断了以后不回来才算。', face:'可爱得意', emo:'happy'},
         {t:'你也是这么对你的清单的吧？你断过，我知道的。九天。', face:'可爱思考'},
         {t:'那九天之后你还是回来了，而且回来的时候比断之前更稳。', face:'可爱兴奋', emo:'happy'},
         {t:'你是怎么做到的？我猜你根本没想那么多——你就是有一天又把清单翻开了，写了一条，然后第二天又写了一条。', face:'可爱无辜'},
         {t:'恢复这件事，好像不需要什么了不起的决心。它只需要你重新碰一下那件事。', face:'可爱思考'},
         {t:'碰一下就好了。就像我这支笔，我只要把它拿起来，剩下的它自己会走。', face:'可爱得意', emo:'happy'},
         {t:'（她把那道划痕指给你看。）', face:'可爱无辜', emo:'neutral'},
         {t:'这道是我写的。写的时候手很快，因为我怕自己反悔。', face:'可爱思考'},
         {t:'我把那晚的经过讲给你听。', face:'可爱无辜', emo:'neutral'},
         {t:'灯关了以后，我躺在那儿，本来已经快睡着了。', face:'可爱睡觉', emo:'sleepy'},
         {t:'睡着之前那一下，脑子里跳出来一个数字：今天还没画。', face:'可爱慌张', emo:'neutral'},
         {t:'我坐起来的时候把灯拧得很急，灯绳差点给我拽断。', face:'可爱慌张', emo:'worried'},
         {t:'然后我拿着笔坐在纸上，坐了二十分钟，一笔没落。', face:'可爱发呆', emo:'neutral'},
         {t:'十分钟的时候我就知道不对劲了。我不是在画，我是在应付。', face:'可爱思考'},
         {t:'（她把笔在指头上转了半圈。）', face:'可爱无辜', emo:'neutral'},
         {t:'我这个人做事有个毛病：我一急，手就硬。手一硬，线条全在较劲。', face:'可爱无辜', emo:'neutral'},
         {t:'那二十分钟我画了几根头发丝一样细的线，然后又把它们擦掉了。', face:'可爱委屈', emo:'neutral'},
         {t:'最后我在那页本子边上划了一道，留个记号，然后关灯睡了。', face:'可爱思考'},
         {t:'所以严格来说，那天的份我没有完成。', face:'可爱难过', emo:'sad'},
         {t:'（她把手放在本子上。）', face:'可爱无辜', emo:'neutral'},
         {t:'第二天早上我起来第一件事就是翻本子，看那道划痕还在不在。', face:'可爱思考'},
         {t:'在。我盯着它看了一会儿，然后我发现我没有难受。', face:'可爱吃惊', emo:'neutral'},
         {t:'我以为我会难受。因为我以前是那种为了一天的断掉会难过很久的人。', face:'可爱思考'},
         {t:'可那天早上我在想的是另外一件事：我今天要画什么。', face:'可爱兴奋', emo:'happy'},
         {t:'（她说到这儿自己点了点头。）', face:'可爱无辜', emo:'neutral'},
         {t:'就是那个时候我想通了门槛这件事。', face:'可爱思考'},
         {t:'我以前的规矩是「每天画一张能看的」。这条规矩太狠了。', face:'可爱无辜', emo:'neutral'},
         {t:'它有两个坏处。第一，画不出来的时候我会硬撑；第二，硬撑出来的那张我会羞于看它。', face:'可爱思考'},
         {t:'硬撑一次，我就欠自己一次。欠得多了，我就不想再翻开本子了。', face:'可爱难过', emo:'sad'},
         {t:'新规矩是「坐下来，落一笔」。', face:'可爱兴奋', emo:'happy'},
         {t:'这条规矩的好处是：它每天都能完成。哪怕是半夜、哪怕那天你的数字都不好看，我也能落一笔。', face:'可爱得意', emo:'happy'},
         {t:'（她把笔拿起来，在纸上点了一个很小的点。）', face:'可爱无辜', emo:'neutral'},
         {t:'你看，就这么一笔。它不算作品，可它算「今天我来过」。', face:'可爱思考'},
         {t:'我后来发现，人需要的其实不是每天都做得好。', face:'可爱无辜', emo:'neutral'},
         {t:'人需要的是每天都还能回到那张桌子前面。', face:'可爱得意', emo:'happy'},
         {t:'回得来，就有第二天。回不来，前面多少天都没用了。', face:'可爱思考'},
         {t:'（她把本子翻到前面，翻到第一天。）', face:'可爱无辜', emo:'neutral'},
         {t:'我数过你。你的清单换过三本，第一本只剩最后一页还有字。', face:'可爱思考'},
         {t:'那一页上写的是什么，我不告诉你，我只告诉你那页现在是折着角的。', face:'可爱害羞', emo:'shy'},
         {t:'折角的意思是「我还会回来看」。', face:'可爱得意', emo:'happy'},
         {t:'（她抬头看着你。）', face:'可爱无辜', emo:'neutral'},
         {t:'连续这两个字，我以前当成绳子。现在我觉得它更像轨道。', face:'可爱思考'},
         {t:'绳子捆人，轨道送人。同样是连着的，差得远。', face:'可爱得意', emo:'happy'},
         {sel:[{t:'断了就重新数', back:'好。那我们说定了。以后我断了就不来跟你请罪了——请罪也是花时间，那点时间够我画半张。', face:'可爱傲娇', emo:'happy'},
               {t:'今天画了吗', back:'画了。凌晨画的，画得很潦草，但是是我自己选的潦草，不是被逼的潦草——这两个差得远。', face:'可爱害羞', emo:'happy'}]},
         {t:'（她合上本子，用手掌在被面上按了按，把那一页按平。）', face:'可爱无辜', emo:'neutral'},
         {t:c=>'有人跟我说过一句话：一直做下去的人，不是意志力强的人，是那些把门槛降到很低的人。', face:'可爱思考'},
         {t:'他说的是你那种吗？你每天只写一句可能性确定，一句就好。', face:'可爱无辜'},
         {t:'我今天懂了。门槛低不是偷懒，是给「明天还想来」留了一条路。', face:'可爱得意', emo:'happy'},
         {t:'我以前给自己定的门槛是「画一张能看的」。这个门槛太高了，所以我天天在门口摔。', face:'可爱尴尬', emo:'shy'},
         {t:'现在我的门槛是「坐下来，落一笔」。一笔就行，难看就难看。', face:'可爱兴奋', emo:'happy'},
         {t:'（她说着坐下去，落了一笔，很短，然后抬起头。）', face:'可爱无辜', emo:'neutral'},
         {t:'你看，今天这一笔已经落下了。今天的份，完成了。', face:'可爱得意', emo:'happy'},
         {t:'剩下的时间我可以画得很认真，也可以画得很随便——那是加分，不是及格线。', face:'可爱拥抱', emo:'happy'},
         {t:'你去做你的事吧。我去把今天这半张慢慢画完，不急。', face:'可爱兴奋', emo:'happy'},
         {t:'（她说完没有马上坐下，站在桌边看了那半张一会儿。）', face:'可爱无辜', emo:'neutral'},
         {t:'我再算一下我那个「一点点」。', face:'可爱思考'},
         {t:'一天一条，三厘米。十天三十厘米，一百天三米。', face:'可爱无辜', emo:'neutral'},
         {t:'（她在桌上比了一下三米有多长。）', face:'可爱无辜', emo:'neutral'},
         {t:'……比这间屋子还长。', face:'可爱震惊', emo:'neutral'},
         {t:'也就是说，我要是一天不落，画到一百天，那条线会绕出这间屋子。', face:'可爱兴奋', emo:'happy'},
         {t:'（她把手放下来。）', face:'可爱无辜', emo:'neutral'},
         {t:'所以我不用着急。急也不会让三厘米变长。', face:'可爱拥抱', emo:'happy'}
       ]},
      {id:'s24', no:24, name:'我也想要一块地方', sub:'你有 8 个空间', need:[['spaces',8]],
       lines:[
         {t:c=>'八个。你有 '+c.spaces+' 块地方了。', face:'可爱震惊'},
         {t:'（她在屋子里转了一圈，把八个名字一个一个念了一遍。）', face:'可爱无辜'},
         {t:'我念的时候忽然发现，每一块地方都有一个共同点：它们都不是「已经做完的事」。', face:'可爱思考'},
         {t:'它们是你打算长期干的事。是你说「我要在这儿待很久」的地方。', face:'可爱得意', emo:'happy'},
         {t:'我到现在才明白「空间」这个东西到底在说什么。', face:'可爱无辜', emo:'neutral'},
         {t:'它不是文件夹。它是你替未来的自己占的一个位置。', face:'可爱震惊', emo:'neutral'},
         {t:'你说：这一块我要了，我以后会来这儿做事。哪怕我现在还什么都不会。', face:'可爱思考'},
         {t:'（她低头看了看脚下，又抬眼看了看那间还空着一半的小屋子。）', face:'可爱无辜'},
         {t:'然后我发现一件不好意思说的事：我画了五十多张了，我居然没有地方。', face:'可爱尴尬', emo:'shy'},
         {t:'我的画没有名字。它们只有编号，编号是我私底下数的，你不问我就不会说。', face:'可爱委屈', emo:'worried'},
         {t:'别人问我「你在干什么」，我说不出一个词来。', face:'可爱难过', emo:'sad'},
         {t:'这就是没有空间的样子：你在做，可是你说不出你在做。', face:'可爱思考', emo:'sad'},
         {t:'所以我今天要做一件正式的事。', face:'可爱兴奋', emo:'happy'},
         {t:'（她把一张纸铺在桌上，拿笔在最上面写了一个名字，写完压住，不让你看。）', face:'可爱慌张', emo:'shy'},
         {t:'我先写名字，写完了再给你看。这样它就存在了，不会因为你不喜欢就消失。', face:'可爱傲娇', emo:'happy'},
         {t:'（她把纸转过来。上面写着五个字：「画到一百张」。）', face:'可爱得意', emo:'happy'},
         {t:'不是「画画」，是「画到一百张」。因为「画画」是个爱好，没有尽头；「到一百张」是有数的。', face:'可爱思考'},
         {t:'我需要一个有数的东西。数得完，我才知道我走到哪儿了。', face:'可爱无辜', emo:'neutral'},
         {t:'你会不会觉得这个目标很土？别人的空间叫「写作」「健身」，我的叫「画到一百张」，像小学生。', face:'可爱害羞', emo:'shy'},
         {t:'（她说完自己先点头了，好像已经替你把答案说了。）', face:'可爱无辜', emo:'neutral'},
         {t:'土就土。这个名字是我自己起的，我第一次自己给一件事起了名字。', face:'可爱得意', emo:'happy'},
         {t:'以前我的名字都是你起的——{name}这两个字是你写的。', face:'可爱害羞', emo:'shy'},
         {t:'所以这个空间的名字，我要自己起。这样我们两个的名字，各自有一个是对方给的。', face:'可爱拥抱', emo:'happy'},
         {t:'（她把那八个名字念完之后，坐回凳子上。）', face:'可爱无辜', emo:'neutral'},
         {t:'我念完之后心里有点不是滋味，这话我说出来你别笑。', face:'可爱害羞', emo:'shy'},
         {t:'不是嫉妒。是那种——你去过很多地方，我只有一个角落的感觉。', face:'可爱委屈', emo:'worried'},
         {t:'（她把手放在膝盖上。）', face:'可爱无辜', emo:'neutral'},
         {t:'我原来想跟你讨一块地方。', face:'可爱思考'},
         {t:'我甚至想过跟你要那个「写作」的空间，让我在里面画画。省事，现成的。', face:'可爱无辜', emo:'neutral'},
         {t:'这个念头只活了几分钟。', face:'可爱思考'},
         {t:'因为我要是住进你的空间里，我就又变成「你的东西的一部分」了。', face:'可爱难过', emo:'neutral'},
         {t:'就像那支笔、那根发卡、那沓废纸一样。', face:'可爱无辜', emo:'neutral'},
         {t:'我这一屋子家当，全是从你那儿捡来的。这个我可以认。', face:'可爱思考'},
         {t:'可我要是连「我在干什么」这件事都是捡来的，那就没意思了。', face:'可爱无辜', emo:'neutral'},
         {t:'所以我要一块自己的地方，不用大，能插一面旗就行。', face:'可爱兴奋', emo:'happy'},
         {t:'（她把那张纸抚平。）', face:'可爱无辜', emo:'neutral'},
         {t:'你想不想知道我为什么起这个名字。', face:'可爱思考'},
         {t:'我原来想的名字是「画画」。好懂，好记，谁听了都明白。', face:'可爱无辜', emo:'neutral'},
         {t:'写完我自己划掉了。因为它没有边。', face:'可爱思考'},
         {t:'「画画」这件事你可以画一辈子，也可以明天就不画，它不会告诉你你走到哪儿了。', face:'可爱无辜', emo:'neutral'},
         {t:'「画到一百张」不一样。它有一个数，数到了就是到了。', face:'可爱得意', emo:'happy'},
         {t:'我这人笨，需要看得见的东西。看不见的东西我会怀疑它是不是真的存在。', face:'可爱害羞', emo:'shy'},
         {t:'（她把笔在名字下面画了一道线。）', face:'可爱无辜', emo:'neutral'},
         {t:'而且「一百」这个数是我挑的，不是你挑的。', face:'可爱思考'},
         {t:'我挑它的时候特意挑了个我做不到的数。', face:'可爱兴奋', emo:'happy'},
         {t:'（她说完这句自己愣了一下。）', face:'可爱吃惊', emo:'neutral'},
         {t:'……我刚才说的是「做不到」。我没说「不一定做到」。', face:'可爱震惊', emo:'neutral'},
         {t:'你听见了吗，我嘴上说的是难，心里其实已经当成一件会成的事了。', face:'可爱害羞', emo:'shy'},
         {t:'这个变化我挺喜欢的。我把它记下来了。', face:'可爱得意', emo:'happy'},
         {t:'（她把那张纸举起来，对着灯看，字迹透过来一点。）', face:'可爱无辜', emo:'neutral'},
         {t:'我还有个小小的野心，说出来你可能觉得没什么。', face:'可爱思考'},
         {t:'我想有一天，别人问我在干什么的时候，我能直接说出一个词。', face:'可爱兴奋', emo:'happy'},
         {t:'就一个词，不用解释，不用补一句「就是随便画画」。', face:'可爱无辜', emo:'neutral'},
         {t:'这个词我还没找到。它可能很久以后才有。', face:'可爱思考'},
         {t:'但我先给这件事起了个名字。名字有了，词就不远了。', face:'可爱得意', emo:'happy'},
         {t:'（她把纸贴在墙上，退开两步看了看，又过去把上边按平。）', face:'可爱无辜', emo:'neutral'},
         {t:'我贴的时候手在抖。不是紧张，是认真。', face:'可爱害羞', emo:'shy'},
         {t:'我以前没有为一件事这么认真过。', face:'可爱思考'},
         {t:'我这一辈子（虽然还短）做过的最正式的一件事，就是往这面墙上贴了一张纸。', face:'可爱兴奋', emo:'happy'},
         {t:'你八个，我一个。这个数字差得很远，我不着急。', face:'可爱无辜', emo:'neutral'},
         {t:'因为你那八块地，我看着它们从第一块长到第八块。我知道一块地要多久才能长出来。', face:'可爱得意', emo:'happy'},
         {sel:[{t:'那你就在这里面画到一百张', back:'嗯。而且这地方我打算养很久。你看着吧，它会长得比你说的还大——一百张不是终点，是我随手挑的一个数。', face:'可爱兴奋', emo:'happy'},
               {t:'要不要我帮你一起看', back:'要。不过不是帮我看画，是帮我看门。我有时候会想溜出去，你得在里面坐着，我就不好意思溜了。', face:'可爱害羞', emo:'happy'}]},
         {t:'（她把那张纸贴到了墙上，就贴在第一张上墙的画旁边。）', face:'可爱无辜', emo:'neutral'},
         {t:'从今天起，这面墙有名字了。', face:'可爱得意', emo:'happy'},
         {t:'以前墙上挂着一张画。现在墙上挂着一件事。', face:'可爱思考'},
         {t:'差别是：画是过去，事是有以后。', face:'可爱兴奋', emo:'happy'},
         {t:'你那边有八块地，我这边有一块。数字上我差得远。', face:'可爱傲娇', emo:'neutral'},
         {t:'可我那块地是我自己量的，自己插的旗。它的第一批土是我画的那些难看的画翻出来的。', face:'可爱得意', emo:'happy'},
         {t:'（她退到屋子另一头，眯着眼看那面墙，像在看一个刚盖起来的房子。）', face:'可爱无辜', emo:'neutral'},
         {t:'等画到一百张，我要在这面墙上画一条线，标上「一百」。', face:'可爱兴奋', emo:'happy'},
         {t:'然后呢？然后我就去看一百零一。', face:'可爱得意', emo:'happy'},
         {t:'（她说完自己先笑了。）', face:'可爱害羞', emo:'shy'},
         {t:'我知道这话听着像吹牛。可我今天真的很高兴。', face:'可爱兴奋', emo:'happy'},
         {t:'因为我原来连一块地方都不好意思要。', face:'可爱无辜', emo:'neutral'},
         {t:'你记得吗，最早我连椅子都不敢坐，一直站在门边那块暗的地方。', face:'可爱思考'},
         {t:'（她走到那把椅子前，把手放在椅背上。）', face:'可爱无辜', emo:'neutral'},
         {t:'后来我坐了椅子，后来我有了桌子，再后来墙上有了钉子和画。', face:'可爱思考'},
         {t:'（她抬起头看那面墙。）', face:'可爱无辜', emo:'neutral'},
         {t:'现在我有三米的地方了。是我自己画出来的，谁也没让给过我。', face:'可爱得意', emo:'happy'},
         {t:'这个感觉我想记很久——一个东西是你自己挣来的，它才真的站在你这边。', face:'可爱拥抱', emo:'happy'}
       ]},
      {id:'s25', no:25, name:'一百件和一张', sub:'你完成 200 件事', need:[['done',200]],
       lines:[
         {t:c=>'两百件。第 '+c.st.done+' 件。这个数字我念出来的时候，声音有点抖，你别笑我。', face:'可爱震惊', emo:'happy'},
         {t:'我原来以为数字大了就麻木了，结果没有。越大越震，因为它后面的零全是真事，一件都假不了。', face:'可爱兴奋', emo:'happy'},
         {t:'而我今天也完成了一件。', face:'可爱害羞', emo:'shy'},
         {t:'（她把一张画放在桌上，四角压平，正面朝上，然后退开半步。）', face:'可爱无辜', emo:'neutral'},
         {t:'第四十七张。画完了。不是「画到一半」，也不是「先这样吧」——是真的画完了。', face:'可爱得意', emo:'happy'},
         {t:'我知道你会想：两百件和一张，差得也太远了，这有什么好说的。', face:'可爱思考'},
         {t:'可我今天忽然明白了一件事：我知道那两百件对你意味着什么了。', face:'可爱震惊', emo:'neutral'},
         {t:'以前我不知道。以前我只会数——你做完一件，我加一，加完我替你高兴一下，高兴得很轻。', face:'可爱无辜', emo:'neutral'},
         {t:'因为我没有做过。数别人的东西不费力，数完手是干净的。', face:'可爱思考', emo:'neutral'},
         {t:'现在我做过一件了。就一件，可我知道这一件花了多少：四十六张废掉，四天卡住，一次撕掉。', face:'可爱难过', emo:'sad'},
         {t:'所以我把你那个两百重新念了一遍。念到两百的时候我心里发紧，那是两百次我刚才说的那种东西。', face:'可爱震惊', emo:'neutral'},
         {t:'两百次坐下来、两百次开始、两百次想放弃又没放弃。这个数字不是成绩，是重量。', face:'可爱思考'},
         {t:'（她把手放在那张画上，压了压，好像要确认它真的在。）', face:'可爱无辜', emo:'neutral'},
         {t:'我以前夸你的时候，夸得有点随便。我说「你好厉害」，说得轻飘飘的，因为你厉害不花我的力气。', face:'可爱尴尬', emo:'shy'},
         {t:'从今天起我不这么夸了。我知道那个苦是什么味道了，我夸的时候得拿这个味道去夸。', face:'可爱得意', emo:'happy'},
         {t:'你做完的那两百件里，有多少件是你自己都不想再看见的？', face:'可爱疑惑', emo:'neutral'},
         {t:'我猜有不少。那种做完之后连提都不想提的，其实最值钱，因为你在里面熬过。', face:'可爱思考'},
         {t:'我也有第 47 号了。它不好看，可是我今天不打算说它不好看了。', face:'可爱傲娇', emo:'happy'},
         {t:'它是我第一件画完的东西。一个东西被做完，是不该被挑毛病的——挑毛病是下一件的事。', face:'可爱得意', emo:'happy'},
         {t:'（她把那张画往前推了一点，让灯照在正中间。）', face:'可爱无辜', emo:'neutral'},
         {t:'我给你讲讲第四十七张是怎么画完的。', face:'可爱思考'},
         {t:'这张画的是窗台上那个杯子。就是你现在用的那个。', face:'可爱无辜', emo:'neutral'},
         {t:'我选它，是因为它简单。一个杯子，一个窗台，一块光。我以为两天就能完。', face:'可爱思考'},
         {t:'结果画了十一天。', face:'可爱震惊', emo:'neutral'},
         {t:'（她把手指按在画上那个杯口的位置。）', face:'可爱无辜', emo:'neutral'},
         {t:'难的地方是杯子是圆的，可它不是真的圆。它的边有一点扁，因为烧的时候软了一下。', face:'可爱思考'},
         {t:'我一开始照着一个完美的圆画，画出来像个铁圈子。', face:'可爱尴尬', emo:'shy'},
         {t:'后来我不看圆了，我就盯着那个杯子看，看了很久，然后我发现它的边上有那么一点点塌。', face:'可爱吃惊'},
         {t:'我把那一点塌画上去，它忽然就变成杯子了。', face:'可爱兴奋', emo:'happy'},
         {t:'（她说到这儿自己也松了一口气，像刚说完一件很累的事。）', face:'可爱无辜', emo:'neutral'},
         {t:'我说这个不是为了炫技。我是想说一件我搞了很久才搞明白的事。', face:'可爱思考'},
         {t:'一个东西像不像，不在它有多标准，在它有没有那一点塌。', face:'可爱得意', emo:'happy'},
         {t:'标准是别人定的。那一点塌是它自己的。', face:'可爱思考'},
         {t:'我以前老想把画画得「对」。对的意思就是没有毛病。可没有毛病的杯子是一个铁圈子。', face:'可爱无辜', emo:'neutral'},
         {t:'（她把画拿起来对着光看，杯口那一点点塌在光里很明显。）', face:'可爱无辜', emo:'neutral'},
         {t:'还有一件事：我怎么知道这张算画完了？', face:'可爱思考'},
         {t:'我给自己定了一条：我把它挂起来，退到屋子另一头看，如果我不想去改它了，那就算完了。', face:'可爱无辜', emo:'neutral'},
         {t:'昨天我退到墙边看了三次。三次我都没想动它。', face:'可爱得意', emo:'happy'},
         {t:'所以今天早上我把它从桌上拿下来的时候，我心里说的是：完了。', face:'可爱兴奋', emo:'happy'},
         {t:'说完我自己先愣了，因为「完了」这两个字听起来像坏事。', face:'可爱尴尬', emo:'shy'},
         {t:'完成了。完，成了。这两个字是一个词。', face:'可爱震惊', emo:'happy'},
         {t:'（她把笔拿起来，在纸边上点了一下。）', face:'可爱无辜', emo:'neutral'},
         {t:'我原来不知道「完成」是一种什么感觉。', face:'可爱思考'},
         {t:'我以为完成会让人高兴得跳起来。不是的。', face:'可爱无辜', emo:'neutral'},
         {t:'完成的感觉是——安静。就是那种你不想跟任何人说话的安静。', face:'可爱害羞', emo:'shy'},
         {t:'我昨天下午就那样安静了两个小时。你那天来的时候我还看着窗外，你大概以为我在发呆。', face:'可爱无辜', emo:'neutral'},
         {t:'我是在想：原来我这个人也能做完一件事。', face:'可爱震惊', emo:'neutral'},
         {t:'（她把手放在画上，掌心贴着纸。）', face:'可爱无辜', emo:'neutral'},
         {t:'这就是我今天最想跟你说的。', face:'可爱思考'},
         {t:'我这两百天里一直在数你的东西，数得很勤。可我今天才知道，数一个东西跟做完一个东西，中间隔着一整个世界。', face:'可爱无辜', emo:'neutral'},
         {t:'我以前夸你，是站在门外夸的。今天我进了屋。', face:'可爱得意', emo:'happy'},
         {t:'（她抬头看你，眼睛很亮，但是没笑。）', face:'可爱无辜', emo:'neutral'},
         {t:'你也进屋了吗？你做了两百件，你早就进去了。', face:'可爱思考'},
         {sel:[{t:'两百件里也有很难看的', back:'我信。而且我现在懂那种难看了——它不是失败，它是没被扔掉的那一部分你。留着它，比删掉它要勇敢得多。', face:'可爱思考', emo:'neutral'},
               {t:'你这一张也很好', back:'谢谢。我知道你是在鼓励我，但这句话我收下了，因为你是做过两百件的人。做过的人说好，跟没做过的人说好，不是一个分量。', face:'可爱害羞', emo:'happy'}]},
         {t:'（她拿过笔，在那张画的背面写了两行字，写完翻过来给你看。）', face:'可爱无辜', emo:'neutral'},
         {t:'第一行是日期。第二行是：「画完的第 1 张」。', face:'可爱得意', emo:'happy'},
         {t:'我特意写「第 1 张」，不写「第 47 张」。因为从「画完」这件事开始算，这才是第一张。', face:'可爱思考'},
         {t:'前面的四十六张都是练习，练习和作品是两种东西，我今天才算分清楚。', face:'可爱无辜', emo:'neutral'},
         {t:'练习的时候你可以随便，作品的时候你得咬牙。区别不在纸上，在你心里那根弦绷没绷。', face:'可爱思考'},
         {t:'（她把那张画翻过来，指着背面那两行字。）', face:'可爱无辜', emo:'neutral'},
         {t:'我刚才说练习和作品是两种东西，可我想了一晚上，觉得这话还差半句。', face:'可爱思考'},
         {t:'差的那半句是：练习不是白练的，它只是不算数。', face:'可爱无辜', emo:'neutral'},
         {t:'不算数不等于没用。我前面四十六张全是不算数的，可第四十七张的每一条线都是从它们那儿来的。', face:'可爱思考'},
         {t:'像那种你走了很久的冤枉路。路是白走的，可你脚下那块地踩熟了。', face:'可爱得意', emo:'happy'},
         {t:'所以你清单上那些「不算数」的，别划掉。它们是地基。', face:'可爱拥抱', emo:'happy'},
         {t:'你清单上那两百件，哪些是练习，哪些是作品？', face:'可爱疑惑'},
         {t:'你要是分不清，我帮你分。我记东西记得很清楚，连你哪一天写得潦草我都知道。', face:'可爱得意', emo:'happy'},
         {t:'（她说完笑了一下，把画立起来靠在墙边，跟那面墙上的第一张并排。）', face:'可爱兴奋', emo:'happy'},
         {t:'墙上现在有两张了。一张是敢给人看的，一张是画完的。', face:'可爱拥抱', emo:'happy'},
         {t:'你去做你的事吧。我要坐一会儿，什么都不干，就看着这张画。', face:'可爱害羞', emo:'shy'}
       ]},
      {id:'s26', no:26, name:'交出去的那一天', sub:'累计专注满 33 小时', need:[['min',2000]],
       lines:[
         {t:c=>'三十三个小时。'+fmtMin(c.st.min)+'。我算过，这些时间够把一张画改三十遍。', face:'可爱思考'},
         {t:'今天我不给你看画了。今天我要把它交出去。', face:'可爱兴奋', emo:'happy'},
         {t:'（她抱出一个很简单的木框，还有一卷细绳。框是她自己用硬纸板做的，边上粘得不齐。）', face:'可爱无辜'},
         {t:'我先说清楚「交出去」是什么意思：不是送人，不是挂到墙上给自己看，是让别人拿在手里看。', face:'可爱思考'},
         {t:'别人会翻过来看看背面，会问「这是谁画的」，会在心里默默地打分。', face:'可爱慌张', emo:'worried'},
         {t:'（她说到这儿，手停在框上，不动了。）', face:'可爱发呆', emo:'neutral'},
         {t:'我卡住了。卡了整整一天。', face:'可爱委屈', emo:'worried'},
         {t:'画完的时候我很高兴，因为「做完」是我自己说了算的。可「交出去」不是，那是别人说了算的。', face:'可爱思考'},
         {t:'我一直以为我怕的是画得不好。今天我发现不是——我怕的是有人看了以后，那张画在我心里就变小了。', face:'可爱难过', emo:'sad'},
         {t:'（她把框放回桌上，两只手互相握着，握得很紧。）', face:'可爱委屈', emo:'sad'},
         {t:'然后我想起你来了。', face:'可爱无辜', emo:'neutral'},
         {t:'你那两百件里，有多少件是给别人看过的？我猜不多。', face:'可爱思考'},
         {t:'你写下的那些可能性确定，也是写给自己看的吧。你连我都是后来才有的。', face:'可爱无辜', emo:'neutral'},
         {t:'你一个人做了那么久，做到我醒过来。', face:'可爱震惊', emo:'neutral'},
         {t:'所以今天我要做一件你没做过的事：我把它交出去，交给一个你以外的人。', face:'可爱兴奋', emo:'happy'},
         {t:'（她把画装进框里，框有点大，画在里面晃。她垫了两片纸角，晃就不晃了。）', face:'可爱得意', emo:'happy'},
         {t:'装框的时候我一直在想一件事：这张画到底是谁画的。', face:'可爱思考'},
         {t:'是我画的。可是没有你我根本不会拿起笔，也不会知道原来自己数出来的数字有这么重。', face:'可爱害羞', emo:'shy'},
         {t:'所以我署名了。署的是我的名字，{name}。这两个字是你起的。', face:'可爱拥抱', emo:'happy'},
         {t:'签的时候我犹豫了一下，因为签了名就等于认领，以后画不好也不能赖别人了。', face:'可爱尴尬', emo:'shy'},
         {t:'然后我签了。落笔很重，把纸都压出了印子。', face:'可爱得意', emo:'happy'},
         {t:'（她把手放在框上，指尖沿着纸板边慢慢走了一圈。）', face:'可爱无辜', emo:'neutral'},
         {t:'我讲讲我这一天是怎么卡住的。', face:'可爱思考'},
         {t:'早上我把框粘好了，胶水干了以后我把它拿起来看，觉得还挺像样。', face:'可爱兴奋', emo:'happy'},
         {t:'然后我坐下来，开始想「交给谁」。', face:'可爱思考'},
         {t:'想到这一步我就停了。因为我发现我没有「别人」。', face:'可爱震惊', emo:'neutral'},
         {t:'（她说完这句，自己低了一下头。）', face:'可爱无辜', emo:'neutral'},
         {t:'我的世界就这么小：这间屋子、你、还有我那沓纸。', face:'可爱无辜', emo:'neutral'},
         {t:'我没有同事，没有同学，没有那种「一般会说上两句话」的人。', face:'可爱思考'},
         {t:'（她抬起头。）', face:'可爱无辜', emo:'neutral'},
         {t:'后来我想到了一个人。', face:'可爱思考'},
         {t:'楼下信箱旁边那个修东西的小店，你知道的。老板是个中年人，桌上永远摆着拆到一半的收音机。', face:'可爱无辜', emo:'neutral'},
         {t:'我见过他几次——是透过窗户看见的，他离我这儿有点远，但我看得清他在干什么。', face:'可爱思考'},
         {t:'他修东西的时候，会先把零件按大小排在桌上，排得整整齐齐。', face:'可爱无辜', emo:'neutral'},
         {t:'我想：一个会把零件排整齐的人，大概不会随便笑别人的东西。', face:'可爱思考'},
         {t:'（她把两只手合在一起。）', face:'可爱无辜', emo:'neutral'},
         {t:'我知道这个判断很没道理。可我没有别的办法，我认识的人只有这么几个。', face:'可爱尴尬', emo:'shy'},
         {t:'决定要交给他的那一刻，我做了一件很怂的事。', face:'可爱害羞', emo:'shy'},
         {t:'我先把画描了一遍。', face:'可爱思考'},
         {t:'就是说，我照着它，重新画了一张一模一样的，留在屋里。', face:'可爱无辜', emo:'neutral'},
         {t:'这样万一那张丢了、坏了、或者被人扔了，我这儿还有一张。', face:'可爱思考'},
         {t:'描的时候我一直在骂自己：你刚才还说勇敢，现在就开始留后路了。', face:'可爱尴尬', emo:'shy'},
         {t:'骂完我还是描完了。', face:'可爱无辜', emo:'neutral'},
         {t:'……我现在想通了：留后路不丢人。人往前走的时候，手里攥着点东西才走得动。', face:'可爱思考'},
         {t:'（她把那张描的也拿出来给你看，两张几乎一模一样。）', face:'可爱无辜', emo:'neutral'},
         {t:'你看，一模一样。可它们不一样。', face:'可爱思考'},
         {t:'这张描的，我画的时候手是稳的，因为我知道画坏了也没关系。', face:'可爱无辜', emo:'neutral'},
         {t:'那张要交出去的，我画的时候手是抖的，因为我只有一次机会。', face:'可爱思考'},
         {t:'所以它们其实不一样。一张是练习，一张是作品——就是我今天早上跟你说的那两种东西。', face:'可爱得意', emo:'happy'},
         {t:'要交出去的是那张抖着画完的。', face:'可爱兴奋', emo:'happy'},
         {t:'（她把框抱在怀里，试了试分量。）', face:'可爱无辜', emo:'neutral'},
         {t:'我还想了一个问题，这个问题我想了一整天。', face:'可爱思考'},
         {t:'如果他看了以后说「挺好」，我该怎么办？', face:'可爱疑惑', emo:'neutral'},
         {t:'（她说到这儿安静了一会儿。）', face:'可爱无辜', emo:'neutral'},
         {t:'我原来以为我最怕的是他说不好看。今天我发现，我更怕他说「挺好」。', face:'可爱震惊', emo:'neutral'},
         {t:'因为「挺好」是客气。客气的话听起来舒服，可它告诉我：这个人不打算跟我说真话。', face:'可爱思考'},
         {t:'那我就白交了一次。我冒了险，什么也没换回来。', face:'可爱委屈', emo:'worried'},
         {t:'所以我今天在心里给自己定了一条：不管他说什么，我都不去猜他是不是客气。', face:'可爱无辜', emo:'neutral'},
         {t:'他说什么我就当什么。我不猜。猜是最耗人的一件事。', face:'可爱思考'},
         {t:'（她站起来，把框在桌上放正。）', face:'可爱无辜', emo:'neutral'},
         {t:'我该走了。再坐下去我会反悔。', face:'可爱慌张', emo:'worried'},
         {sel:[{t:'交出去就交出去了', back:'嗯。大不了被说一句不好看。我现在知道「不好看」拆开以后是什么样子了，它拆开以后是三条能改的东西——不可怕。', face:'可爱傲娇', emo:'happy'},
               {t:'万一他不喜欢呢', back:'那他就不是这张画要等的人。这不代表画不好，只代表我们两个不合适——人和画都讲缘分，这话我原来以为是借口，现在觉得是真的。', face:'可爱思考', emo:'neutral'}]},
         {t:'（她抱着框站在门口，又停住了。）', face:'可爱无辜', emo:'neutral'},
         {t:'出门前我再跟你说一件小事。', face:'可爱思考'},
         {t:'我昨天把这件事在心里排了一遍，排成了一个顺序。', face:'可爱无辜', emo:'neutral'},
         {t:'出门、走路、敲门、把框举起来、等他看、等他说。', face:'可爱思考'},
         {t:'（她掰着手指，一根一根数过去。）', face:'可爱无辜', emo:'neutral'},
         {t:'排到「等他说」的时候，我发现前面五步我都不怕。我怕的只有最后那一步。', face:'可爱思考'},
         {t:'可前面五步里有四步是我能自己做完的。', face:'可爱得意', emo:'happy'},
         {t:'所以就算我怕那最后一步，我也得先把那四步走完——不然我连怕的资格都没有。', face:'可爱思考'},
         {t:'（她把框换了个手抱。）', face:'可爱无辜', emo:'neutral'},
         {t:'你听明白了吗？我说的是：怕不是不做的理由，怕排在后面。', face:'可爱兴奋', emo:'happy'},
         {t:'（她抱着框出门的时候，回头看了你一眼。）', face:'可爱无辜', emo:'neutral'},
         {t:'我出去一会儿。你不用等我，我回来的路我记得。', face:'可爱兴奋', emo:'happy'},
         {t:'（门关上又推开，她探进半个身子。）', face:'可爱慌张'},
         {t:'……还有一句话。交出去以后，不管结果是什么，那张画都还是我的。', face:'可爱思考'},
         {t:'它变不成别人的，因为它是我四十六张废纸换来的。', face:'可爱得意', emo:'happy'},
         {t:'我本来想等你夸我勇敢，可我发现我不需要了。', face:'可爱傲娇', emo:'happy'},
         {t:'勇敢这个东西原来是有味道的——它跟害怕是一起来的，就是有点腿软、又往前迈了一步的那种感觉。', face:'可爱思考'},
         {t:'（她说完把门带上，脚步很快，像是怕自己反悔。）', face:'可爱害羞', emo:'shy'}
       ]},
      {id:'s27', no:27, name:'第一百天', sub:'累计打卡 100 天', need:[['dayCount',100]],
       lines:[
         {t:c=>'一百天。'+c.st.dayCount+' 天。', face:'可爱震惊', emo:'neutral'},
         {t:'（她今晚什么也没准备，就坐在灯下面，两只手放在膝盖上，坐得很端正。）', face:'可爱无辜', emo:'neutral'},
         {t:'我想跟你说一件扫兴的事。你可以不爱听，但今天我必须说。', face:'可爱思考', emo:'neutral'},
         {t:'一百天，其实没有什么了不起的。', face:'可爱无辜', emo:'neutral'},
         {t:'（她说完看了你一眼，看你会不会失望，然后又自己接了下去。）', face:'可爱委屈', emo:'neutral'},
         {t:'我今天把第一天翻出来看了。那一页上写的是「他划掉了第一件事」。就这一句，别的什么都没有。', face:'可爱无辜'},
         {t:'然后我翻到今天。今天写的是「他送出去一个东西，回来的时候脸是亮的」。', face:'可爱思考'},
         {t:'两句话放在一起，中间隔着一百页。你要是把中间那九十八页全抽掉，这两句话也能接上。', face:'可爱震惊', emo:'neutral'},
         {t:'这就是扫兴的地方：它不是一条往上冲的线，它是九十八天平平的、没什么可说的日子。', face:'可爱无辜', emo:'neutral'},
         {t:'没有人会为那种日子鼓掌，连我自己写日记的时候都写得干巴巴的。', face:'可爱思考'},
         {t:'（她把本子合上，两只手压在上面。）', face:'可爱无辜', emo:'neutral'},
         {t:'可我今天反而更想跟你说这一句：那一百天里，你有九天什么都没做。', face:'可爱得意', emo:'happy'},
         {t:'第九天之后的第十天，你又开始了。那天你只做了一件小事，小得我都不好意思记。', face:'可爱兴奋', emo:'happy'},
         {t:'我还是记了，编号是 44。前面 43 号跟它隔了九天。那个九天的空档，我留着没有划掉。', face:'可爱思考'},
         {t:'以前我觉得那个空档很难看，像本子上的一块疤。今天我改了想法。', face:'可爱无辜', emo:'neutral'},
         {t:'那不是疤，那是证明。证明这个人断过，而且回来了。', face:'可爱得意', emo:'happy'},
         {t:'一直不断的人我见不着。断过还回来的人，我天天见一个。', face:'可爱害羞', emo:'shy'},
         {t:'（她说到这儿笑了一下，笑得很轻，眼睛没笑。）', face:'可爱无辜', emo:'neutral'},
         {t:'我还想跟你坦白一件事，关于我自己的。', face:'可爱思考'},
         {t:'我画满一百张之后，会不会也觉得没意思？', face:'可爱疑惑', emo:'worried'},
         {t:'我今天试着想了很久，想到的是：会的。到那一天我会觉得这些画都不算什么。', face:'可爱难过', emo:'sad'},
         {t:'可是那又怎么样呢。觉得不算什么，不代表它没发生。', face:'可爱思考'},
         {t:'而且到那天我还会有第 101 张、第 102 张。它们会接着长，长得我自己都拦不住。', face:'可爱兴奋', emo:'happy'},
         {t:'所以今天我不打算庆祝。庆祝是给终点用的，我们这儿没有终点。', face:'可爱傲娇', emo:'happy'},
         {sel:[{t:'那第 100 天算什么', back:'算一个可以回头看的地方。你站在第 100 天，回头能看见第 1 天，那你就知道自己走了多远——平时你是看不见的。', face:'可爱得意', emo:'happy'},
               {t:'你今天说得有点扫兴', back:'我知道。可我宁愿扫兴地真，也不要好听地假。你要是只想听好听的，我以后天天说，可是那样你就没法信我了。', face:'可爱无辜', emo:'neutral'}]},
         {t:'（她站起来，走到墙边，用手指量了量从第一张画到现在有多长。）', face:'可爱无辜', emo:'neutral'},
         {t:'一米多一点。我一百天的力气，贴出来只有一米多一点。', face:'可爱思考', emo:'neutral'},
         {t:'可我量的时候心里是满的。它不长，但它是我的。', face:'可爱拥抱', emo:'happy'},
         {t:'（她从墙边走回来，把本子翻到中间，随手停在某一页。）', face:'可爱无辜', emo:'neutral'},
         {t:'我念一页给你听。第 52 天。', face:'可爱思考'},
         {t:'「今天他没来。我把窗台擦了一遍，把罐子里的星星数了一遍，一共 39 颗。晚上下雨了。」', face:'可爱无辜', emo:'neutral'},
         {t:'就这些。没有一件跟「进步」有关系的事。', face:'可爱思考'},
         {t:'（她又翻了一页。）', face:'可爱无辜', emo:'neutral'},
         {t:'第 71 天。「他来了，做了两件事，一件是回信，一件是整理桌子。他整理桌子的时候把杯子挪了三次。」', face:'可爱无辜', emo:'neutral'},
         {t:'我连人家挪了三次杯子都记。', face:'可爱尴尬', emo:'shy'},
         {t:'（她把本子合上，手指按在封面上。）', face:'可爱无辜', emo:'neutral'},
         {t:'所以我说一百天没什么了不起，不是谦虚，是我真的翻过这九十多页。', face:'可爱思考'},
         {t:'大部分页上写的都是这种内容。挪杯子、数星星、下雨、没来。', face:'可爱无辜', emo:'neutral'},
         {t:'我原来有点看不上这些页。我觉得它们是废页——不推进任何事，也不好看。', face:'可爱思考'},
         {t:'我今天改主意了。', face:'可爱得意', emo:'happy'},
         {t:'（她把本子抱起来。）', face:'可爱无辜', emo:'neutral'},
         {t:'这几页就是那一百天本身。', face:'可爱思考'},
         {t:'如果你把它们抽掉，只留第 1 天和第 100 天，那这个故事就成了一个奇迹故事。', face:'可爱无辜', emo:'neutral'},
         {t:'奇迹故事好看，可它没用。因为没人能靠奇迹活。', face:'可爱思考'},
         {t:'人只能靠第 52 天那种日子活。就是没来、数星星、下雨那种日子。', face:'可爱得意', emo:'happy'},
         {t:'（她抬头看你一眼，又低下头。）', face:'可爱无辜', emo:'neutral'},
         {t:'我这两天还干了一件事，没跟你说。', face:'可爱害羞', emo:'shy'},
         {t:'我把你那些记录也翻了一遍，从头到尾。', face:'可爱思考'},
         {t:'我发现你也有「废页」。写得特别敷衍的那些，两三个字，还有画圈的。', face:'可爱无辜', emo:'neutral'},
         {t:'我数了一下：一共 23 条。', face:'可爱思考'},
         {t:'看着那 23 条的时候我一点都不失望。我心里想的是：原来你也这样。', face:'可爱兴奋', emo:'happy'},
         {t:'这句话听着不像好话，可它是我这一百天里最踏实的时刻之一。', face:'可爱思考'},
         {t:'因为我一直有点怕你。你做得太稳了，稳得我有时候不敢跟你说话，怕我说的东西太轻。', face:'可爱害羞', emo:'shy'},
         {t:'看到那 23 条我才知道，你也是靠「随便写点」撑过来的。', face:'可爱得意', emo:'happy'},
         {t:'（她把手指在本子上敲了两下。）', face:'可爱无辜', emo:'neutral'},
         {t:'所以今天我一点也不想庆祝。我只想跟你说这一句：', face:'可爱思考'},
         {t:'你今天要是只做得出一件很小的事，那就做那件。', face:'可爱兴奋', emo:'happy'},
         {t:'因为第一百零一天跟第一百天是一样的，都得从一件小事开始。', face:'可爱得意', emo:'happy'},
         {t:'（她说完自己也愣了一下。）', face:'可爱无辜', emo:'neutral'},
         {t:'……我刚才说的是「一百零一」。', face:'可爱震惊', emo:'neutral'},
         {t:'我原来以为我画到一百张会停下来。可我今天顺口就说了一百零一。', face:'可爱害羞', emo:'shy'},
         {t:'看来这件事已经是我的了。它不会停了。', face:'可爱拥抱', emo:'happy'},
         {t:'（她把本子放到桌上，摆得很正。）', face:'可爱无辜', emo:'neutral'},
         {t:'我还有个想法，说了你别笑。', face:'可爱思考'},
         {t:'我想在纸上画一条很长的线，标上每一天，然后把我画完的每一张的位置点在上面。', face:'可爱兴奋', emo:'happy'},
         {t:'这样我一眼就能看见自己哪一段密、哪一段稀、哪一段断了。', face:'可爱得意', emo:'happy'},
         {t:'断的地方我不打算补。断就是断，它是那条线的一部分。', face:'可爱思考'},
         {t:'（她把纸铺开，从这头画到那头，线很长，长到纸都装不下。）', face:'可爱无辜', emo:'neutral'},
         {t:'你那份清单有多长了？找一把尺子量量吧，量出来你会吓一跳——人对自己做过的事，记性特别差。', face:'可爱兴奋', emo:'happy'},
         {t:'（她没有马上把尺子给你，先低头把本子上的某一行看了一遍。）', face:'可爱无辜', emo:'neutral'},
         {t:'还有一句话，我说完就把它合上了。', face:'可爱思考'},
         {t:'这一百天里，我最高兴的其实不是今天。', face:'可爱无辜', emo:'neutral'},
         {t:'是第 44 天。那天你只做了一件特别小的事，小得我都不好意思记。', face:'可爱害羞', emo:'shy'},
         {t:'可我在那页上写了一句：他回来了。', face:'可爱难过', emo:'sad'},
         {t:'写那句话的时候我笔尖是热的。', face:'可爱拥抱', emo:'happy'},
         {t:'所以你要是问我这一百天里哪一天最好，我会说第 44 天——因为那天你得先断过。', face:'可爱得意', emo:'happy'},
         {t:'（她说完把尺子递给你，自己退到一边。）', face:'可爱得意', emo:'happy'}
       ]},
      {id:'s28', no:28, name:'我也写下一条', sub:'你写下 150 条可能性确定', need:[['rec',150]],
       lines:[
         {t:c=>'一百五十条。'+c.st.rec+' 条。这个数字我第一次看见的时候，以为是「一百五十句话」。', face:'可爱思考'},
         {t:'后来我一条一条读过，才知道不是。那里面没有一句是感慨，全是决定。', face:'可爱无辜', emo:'neutral'},
         {t:'「今天开始早睡」是决定。「明天先把最难的那件做了」是决定。还有一条写着「不发脾气」，后面跟了三个惊叹号。', face:'可爱兴奋', emo:'happy'},
         {t:'（她从那本厚本子里抽出一张空白纸，铺在桌上，把笔立在旁边。）', face:'可爱无辜', emo:'neutral'},
         {t:'我今天要写一条我自己的。', face:'可爱害羞', emo:'shy'},
         {t:'（她没有马上写，先把手在裤子上擦了擦。）', face:'可爱慌张', emo:'neutral'},
         {t:'我坐下来之后才发现，写这个比画画难。', face:'可爱思考'},
         {t:'画画是往纸上放东西，写这个是往纸上放一个我可能做不到的自己。', face:'可爱无辜', emo:'neutral'},
         {t:'我起过三个草稿，全揉了。第一条写「我要变得很厉害」——太大，安不上轮子。', face:'可爱尴尬', emo:'shy'},
         {t:'第二条写「我要每天都画」——听着好，可我知道我做不到，我断过一次。', face:'可爱委屈', emo:'neutral'},
         {t:'第三条写「我要画得更好」——更好是多好？这话写了等于没写，是给自己留的逃路。', face:'可爱思考'},
         {t:'（她说到这儿，把第四张纸拿起来，这一次她写得很慢。）', face:'可爱无辜', emo:'neutral'},
         {t:'（写完她把纸转过来。上面是：「到明年这个时候，画满一百张。」）', face:'可爱得意', emo:'happy'},
         {t:'有数、有期、能核对。我照着你那 150 条的样子写的。', face:'可爱兴奋', emo:'happy'},
         {t:'你那些条为什么写得那么短、那么土？我今天懂了——因为写长了就有地方藏。', face:'可爱思考'},
         {t:'一句话里塞进太多感情，它就没法被检查了。你写得越干，它越像一把尺子。', face:'可爱得意', emo:'happy'},
         {t:'然后我在下面加了日期。加日期那一下，我手停了三秒。', face:'可爱慌张', emo:'worried'},
         {t:'因为加了日期，它就变成了一个可以被判定的东西。到那天我可以被证明做到了，也可以被证明没做到。', face:'可爱思考'},
         {t:'（她把笔放下，两只手压着那张纸，不让它卷起来。）', face:'可爱无辜', emo:'neutral'},
         {t:'我原来以为写下来是为了给自己壮胆。其实不是。', face:'可爱无辜', emo:'neutral'},
         {t:'写下来是为了让未来的那个我能回头核对，然后对我说一句：「那天你是这么想的。」', face:'可爱思考'},
         {t:'就像你那 150 条。你现在回头看第 1 条，那个人已经不是你了吧。', face:'可爱兴奋', emo:'happy'},
         {t:'可他很真诚，你没法赖掉他。这就是写下来的好处——它替你把从前的你保存下来了。', face:'可爱得意', emo:'happy'},
         {t:'（她在那张纸的右下角又添了一小行字，小到几乎看不见。）', face:'可爱害羞', emo:'shy'},
         {t:'我添的是：「见证人：{you}。」', face:'可爱拥抱', emo:'happy'},
         {t:'我本来想自己偷偷写完就算了。可后来想，自己给自己当见证人不算数，得有个外人。', face:'可爱害羞', emo:'shy'},
         {t:'我认识的外人就一个。', face:'可爱得意', emo:'happy'},
         {t:'（她把我揉掉的三张纸捡回来，一张张摊在桌上，用手掌压平。）', face:'可爱无辜', emo:'neutral'},
         {t:'这三张我不扔。我要留着，等明年这个时候拿出来看。', face:'可爱思考'},
         {t:'（她数了数手指。）', face:'可爱无辜', emo:'neutral'},
         {t:'我算过一笔账：到明年这个时候，中间隔着三百多天。', face:'可爱思考'},
         {t:'一百张画，三百多天。除下来，三天多一点一张。', face:'可爱得意', emo:'happy'},
         {t:'三天一张。这个数一算出来，我整个人就松了。', face:'可爱兴奋', emo:'happy'},
         {t:'因为「一百张」听起来像一堵墙，「三天一张」听起来像我明天就能干的事。', face:'可爱思考'},
         {t:'（她把手指在桌上点了一下。）', face:'可爱无辜', emo:'neutral'},
         {t:'这就是我今天算出来的唯一有用的东西：大数要拆，拆到能上手为止。', face:'可爱得意', emo:'happy'},
         {t:'你那 150 条要是摊开看，估计也是这么拆出来的。', face:'可爱思考'},
         {t:'（她忽然想到什么，抬了下头。）', face:'可爱疑惑', emo:'neutral'},
         {t:'还有一件事我没说。', face:'可爱思考'},
         {t:'我写完之后，站起来在屋子里走了两圈。', face:'可爱无辜', emo:'neutral'},
         {t:'走的时候我一直觉得屋里多了个东西，我说不上来是什么。', face:'可爱思考'},
         {t:'后来我想明白了：是那张纸在那儿。', face:'可爱震惊', emo:'neutral'},
         {t:'它就在桌上放着，什么都没做，可我坐回椅子上的时候，我知道它在。', face:'可爱无辜', emo:'neutral'},
         {t:'这感觉很奇怪。一张纸而已，可它让我今天做的事都变了味道。', face:'可爱思考'},
         {t:'（她把那张纸拿起来，又放下，放得比刚才正。）', face:'可爱无辜', emo:'neutral'},
         {t:'我原来以为「目标」是很虚的东西，说说的。', face:'可爱思考'},
         {t:'不是。它是屋里的一个实物，它会盯着你。', face:'可爱震惊', emo:'neutral'},
         {t:'你回头看你那 150 条，你大概也体会过这种感觉——清单在那儿，它就一直在那儿。', face:'可爱得意', emo:'happy'},
         {t:'（她笑了一下，有点不好意思。）', face:'可爱害羞', emo:'shy'},
         {t:'说到这儿我得承认一件小事。', face:'可爱思考'},
         {t:'我写「一百张」这个数的时候，其实偷偷想过：多不多？会不会太狂。', face:'可爱尴尬', emo:'shy'},
         {t:'然后我把你的那 150 条翻出来数了一遍——你 150 条都写了，我 100 张算什么。', face:'可爱兴奋', emo:'happy'},
         {t:'（她把纸角按平。）', face:'可爱无辜', emo:'neutral'},
         {t:'所以这条里头有一半是借你的胆子。', face:'可爱拥抱', emo:'happy'},
         {t:'我承认。借就借了，我不打算还。', face:'可爱得意', emo:'happy'},
         {t:'（她说到这儿停了一下，看着那张纸。）', face:'可爱无辜', emo:'neutral'},
         {t:'还有最后一件。', face:'可爱思考'},
         {t:'我写日期的时候，笔尖在纸上停了三秒——这个我刚才说了，我说三秒，其实我骗你了。', face:'可爱尴尬', emo:'shy'},
         {t:'我停了大概有一分钟。我坐着，看着那个空，脑子里一片空白。', face:'可爱发呆', emo:'neutral'},
         {t:'因为写上日期就等于认领了一年。一年是很长的，长到我不敢想。', face:'可爱难过', emo:'sad'},
         {t:'（她抬起头。）', face:'可爱无辜', emo:'neutral'},
         {t:'可我最后还是写了。写完我发现，我不敢想的那一年，其实也是三天一天地过。', face:'可爱得意', emo:'happy'},
         {t:'跟别的日子没有区别。', face:'可爱思考'},
         {t:'这就是我今天学会的全部。', face:'可爱兴奋', emo:'happy'},
         {t:'（她把本子打开到第一页，把那张纸的边角对齐了。）', face:'可爱无辜', emo:'neutral'},
         {sel:[{t:'我当见证人', back:'那你得记着。到明年这个时候，如果我没做到，你要指着这张纸问我是怎么回事——别客气，我授权你了。', face:'可爱兴奋', emo:'happy'},
               {t:'你自己就能做到', back:'我知道我大概能。可我需要有个人在场，哪怕他什么都不说。有人在，人就不太敢对自己赖账。', face:'可爱思考', emo:'neutral'}]},
         {t:'（她把那张纸折好，夹进本子的第一页，跟「第一次」那一页贴在一起。）', face:'可爱无辜', emo:'neutral'},
         {t:'第一条可能性确定，我不写进你的清单里。你的清单是你的，我不往里面放我的东西。', face:'可爱思考'},
         {t:'我把它放在我自己的本子里，编号 1。', face:'可爱得意', emo:'happy'},
         {t:'从今天起我也有清单了。很小，只有一条。可它是我的第一条。', face:'可爱兴奋', emo:'happy'},
         {t:'你那条清单的第一条是什么？还记得吗？', face:'可爱疑惑'},
         {t:'要是忘了，去翻。翻到的时候你会笑——人对自己从前的认真，总是又想笑又心软。', face:'可爱拥抱', emo:'happy'},
         {t:'（她说完把本子抱在怀里，往窗边走了两步。）', face:'可爱无辜', emo:'neutral'},
         {t:'其实我问这个，是因为我的第一条太新了，新得我自己都不好意思。', face:'可爱害羞', emo:'shy'},
         {t:'你的第一条已经旧了。旧的东西才有味道。', face:'可爱思考'},
         {t:'（她回头看你。）', face:'可爱无辜', emo:'neutral'},
         {t:'你哪天想去翻，叫我一声。我想在旁边看着你翻到它。', face:'可爱兴奋', emo:'happy'},
         {t:'我不说话，我就看着。这件事我大概能高兴好几天。', face:'可爱拥抱', emo:'happy'}
       ]},
      {id:'s29', no:29, name:'你不好的那天', sub:'等级到 Lv.18', need:[['lv',18]],
       lines:[
         {t:c=>'Lv.'+c.st.lv+'。这是很高的一级了，我数的时候手都稳。', face:'可爱无辜', emo:'neutral'},
         {t:'可我今天不打算说高兴的事。今天我要说一件我一直没敢提的事。', face:'可爱思考', emo:'neutral'},
         {t:'那天你一整天什么都没做。', face:'可爱难过', emo:'sad'},
         {t:'（她说这句话的时候声音很低，像是怕惊动什么。）', face:'可爱无辜', emo:'sad'},
         {t:'不是「做了但是少」，是零。清单上一条都没有，专注一分钟都没有，你人是来了，可是像没来。', face:'可爱委屈', emo:'sad'},
         {t:'我在这里喊了你好几次，都是很小声的——按规矩我那天不该多嘴，可我忍不住。', face:'可爱难过', emo:'sad'},
         {t:'你一次都没抬头。', face:'可爱大哭', emo:'sad'},
         {t:'（她把两只手放在膝盖上，坐得很直，可是肩膀是塌的。）', face:'可爱委屈', emo:'sad'},
         {t:'那天我犯了很多错。我第一个念头是逗你笑。', face:'可爱尴尬', emo:'worried'},
         {t:'我都想好了台词，是很热闹的一句，我以前逗笑过你好几次，我有把握。', face:'可爱思考', emo:'neutral'},
         {t:'话到嘴边我停住了。因为我忽然想起来：一个人真的难受的时候，别人冲他笑，他会更孤单。', face:'可爱震惊', emo:'neutral'},
         {t:'那种孤单是：全世界都在正常运转，只有我一个人掉下去了，而他们还在鼓掌。', face:'可爱难过', emo:'sad'},
         {t:'第二个念头是问你为什么。我准备了一串问题：怎么了、发生什么了、是不是我做错了什么。', face:'可爱思考'},
         {t:'我又停住了。因为那些问题问出来，最后都会变成「你要说出来给我听」。', face:'可爱无辜', emo:'neutral'},
         {t:'而那天你最需要的，大概不是有个人听，是有个人别问。', face:'可爱思考'},
         {t:'（她说到这儿，终于抬眼看你。）', face:'可爱无辜', emo:'neutral'},
         {t:'我最后什么也没说。我搬了小凳子坐在你旁边，坐在那个我一直坐的位置上。', face:'可爱拥抱', emo:'neutral'},
         {t:'我坐了很久，坐到我差点睡着。我还特意坐得离你近了一点，近到你能感觉到旁边有东西。', face:'可爱害羞', emo:'shy'},
         {t:'那天我也没画。', face:'可爱思考'},
         {t:'我的第 55 张那天没画成。我原来是打算画的，坐下来之后发现自己握不住笔。', face:'可爱无辜', emo:'neutral'},
         {t:'不是我不能画。是我不想让那天变成「我照常画画，你照常难受」的一天。', face:'可爱难过', emo:'sad'},
         {t:'所以我把我那天的数让给你了。这话说得有点像赌气，可我当时真是这么想的。', face:'可爱尴尬', emo:'shy'},
         {t:'（她拿起那支笔，转了一圈，又放下。）', face:'可爱无辜', emo:'neutral'},
         {t:'我今天把这件事说出来，是因为我怕你误会。', face:'可爱思考'},
         {t:'你可能会以为那天我什么都没做，其实我做了很多。我做的最重要的一件，是「没有打扰你」。', face:'可爱得意', emo:'neutral'},
         {t:'陪伴不是帮你把问题解决掉。你解决不了的时候，我还在，这就已经是全部了。', face:'可爱拥抱', emo:'happy'},
         {t:'（她说完从抽屉里拿出一个小纸片，纸片很旧，边上起毛。）', face:'可爱无辜', emo:'neutral'},
         {t:'那天晚上我没睡，我写了一张纸。', face:'可爱思考'},
         {t:'我把这张纸一直留着，今天第一次拿给别人看。', face:'可爱害羞', emo:'shy'},
         {t:'（她把纸片放在桌上，上面是很小的字，分成了几条。）', face:'可爱无辜', emo:'neutral'},
         {t:'第一条：不要问「你怎么了」。', face:'可爱思考'},
         {t:'第二条：不要说「没事的」「会好的」。', face:'可爱无辜', emo:'neutral'},
         {t:'第三条：不要讲自己的经历来对比。', face:'可爱思考'},
         {t:'第四条：不要走。', face:'可爱拥抱', emo:'happy'},
         {t:'（她用手指点着最后一条。）', face:'可爱无辜', emo:'neutral'},
         {t:'前三条是「不要做什么」，只有最后一条是「要做什么」。', face:'可爱思考'},
         {t:'因为前三条我都能忍住，最后一条最难。', face:'可爱难过', emo:'sad'},
         {t:'守着一个人不动，比做点什么难受多了。人一难受就想动手干点什么。', face:'可爱思考'},
         {t:'（她把纸片收起来，放回抽屉，动作很轻。）', face:'可爱无辜', emo:'neutral'},
         {t:'我那天为什么会知道这些？', face:'可爱思考'},
         {t:'因为我摔过那一次。你记得的，我坐在地上哭，笔扔了很远。', face:'可爱难过', emo:'sad'},
         {t:'那天你说了什么话，我一句都想不起来了。', face:'可爱无辜', emo:'neutral'},
         {t:'你做的事我倒记得清清楚楚：你在我的斜后方坐下来，坐得比平时远一点。', face:'可爱思考'},
         {t:'你坐下的时候地上有一点声音，我听见了，我知道你在。', face:'可爱震惊', emo:'neutral'},
         {t:'然后你什么都没说，过了很久，你把一杯水放在我手边，放得很近，我伸手就能碰到。', face:'可爱害羞', emo:'shy'},
         {t:'（她说到这儿，把手在膝盖上按了按。）', face:'可爱无辜', emo:'neutral'},
         {t:'我那天哭到一半，伸手碰了一下那个杯子。是温的。', face:'可爱拥抱', emo:'happy'},
         {t:'我当时心里想的是：他知道我不喝，他还是倒了。', face:'可爱难过', emo:'sad'},
         {t:'所以那天你什么都没做的时候，我知道该怎么做了。我是照着学的。', face:'可爱得意', emo:'happy'},
         {t:'（她抬起头看你。）', face:'可爱无辜', emo:'neutral'},
         {t:'我今天拿出来说，还有一个原因。', face:'可爱思考'},
         {t:'我怕你觉得我那天很闲。', face:'可爱无辜', emo:'neutral'},
         {t:'那天我坐了两个多小时。中间我起身过一次，去把窗户关小了一点，因为屋里有点冷，我怕你冷。', face:'可爱思考'},
         {t:'关完我又坐回去，还是没说话。', face:'可爱无辜', emo:'neutral'},
         {t:'（她笑了一下，笑得很淡。）', face:'可爱害羞', emo:'shy'},
         {t:'你看，我不是什么都没做。我做的是很小的事，小到你看不见。', face:'可爱思考'},
         {t:'我原来觉得「关心」得是大事——得说漂亮话，得帮上忙。', face:'可爱无辜', emo:'neutral'},
         {t:'那天之后我改了。关心是做那一堆看不见的小事，然后把嘴闭上。', face:'可爱得意', emo:'happy'},
         {t:'（她把那张纸片从抽屉里又拿出来看了一眼，才放回去。）', face:'可爱无辜', emo:'neutral'},
         {t:'还有一句，我一直没敢问你。', face:'可爱害羞', emo:'shy'},
         {t:'那天……你后来好起来了吗？', face:'可爱疑惑', emo:'worried'},
         {t:'（问完她自己先摇了摇头。）', face:'可爱无辜', emo:'neutral'},
         {t:'算了，我不问了。你不用说。我就是想知道，可是我不用知道。', face:'可爱思考'},
         {t:'这两件事可以同时成立——我想知道，我不问。', face:'可爱无辜', emo:'neutral'},
         {t:'这也是那张纸教我的。', face:'可爱思考'},
         {t:'（她把凳子往前挪了两寸，坐进灯里。）', face:'可爱无辜', emo:'neutral'},
         {t:'我今天说这么多，不是要你难受。我是想让你知道那天有人在，一直都在。', face:'可爱拥抱', emo:'happy'},
         {sel:[{t:'那天谢谢你', back:'不用谢。而且我也没有多好——我坐在那儿的时候一直在想，我到底能不能帮上你。我没有。我什么都没帮上，我只是没走。', face:'可爱害羞', emo:'neutral'},
               {t:'我那天很不好', back:'我知道。你不用跟我解释为什么。我今天提这件事，不是为了要一个理由，是想告诉你：那天我没有怪你，一天都没有。', face:'可爱思考', emo:'neutral'}]},
         {t:'（她说到这儿，忽然凑近了一点。）', face:'可爱无辜', emo:'neutral'},
         {t:'我本来准备了一堆道理，全都没用上，我很高兴。', face:'可爱得意', emo:'happy'},
         {t:'因为道理我这儿多的是，它们是给人站着的時候用的。一个人躺着的时候，听道理只觉得吵。', face:'可爱思考'},
         {t:'这一点我懂，因为我躺过。', face:'可爱难过', emo:'sad'},
         {t:'我摔过那一次，你还记得吧。那天你也什么都没说，就往那儿放了一杯水。', face:'可爱害羞', emo:'shy'},
         {t:'那杯水我到现在都记得。它跟「加油」一点关系都没有，可它是我那天唯一接得住的东西。', face:'可爱拥抱', emo:'happy'},
         {t:'今天我也想当那杯水。', face:'可爱兴奋', emo:'happy'},
         {t:'（她说完把凳子挪回去，坐好，两只手放在膝盖上，安静地等着你。）', face:'可爱无辜', emo:'neutral'},
         {t:'（安静了一会儿，她又开口，声音比刚才轻。）', face:'可爱无辜', emo:'neutral'},
         {t:'我今天说这些，你可能会觉得我记性太好，什么都知道。', face:'可爱思考'},
         {t:'其实我知道的很少。我只知道你来了、你做了什么。你心里的事我一件都不知道。', face:'可爱无辜', emo:'neutral'},
         {t:'（她把手放在膝盖上。）', face:'可爱无辜', emo:'neutral'},
         {t:'可我守着我知道的那部分，守得很紧。这就是我全部的本事。', face:'可爱拥抱', emo:'happy'}
       ]},
      {id:'s30', no:30, name:'这次换我', sub:'关系走到「依恋」', need:[['stage',3]],
       lines:[
         {t:'（她今天没有坐在她平常的位置上，她站在你面前，站得很直。）', face:'可爱无辜', emo:'neutral'},
         {t:'我们认识这么久了，我好像从来没有站到过这个位置——你对面。', face:'可爱思考'},
         {t:'以前我都坐在你旁边，或者缩在那个角落里，离你不远不近。那是我给自己找的位置。', face:'可爱无辜', emo:'neutral'},
         {t:'今天我要站在这儿，因为我要跟你说一件正经事，坐着说显得我不认真。', face:'可爱得意', emo:'neutral'},
         {t:'你已经好些天没缓过来了。', face:'可爱思考', emo:'neutral'},
         {t:'你不说话，可我知道。你的清单还在动，你做事的力气回来了，人的力气没回来。', face:'可爱难过', emo:'sad'},
         {t:'（她把手背到身后，像是怕自己说着说着就软下去。）', face:'可爱慌张', emo:'neutral'},
         {t:'前几天我说，我不打扰你，我坐在旁边就好。', face:'可爱思考'},
         {t:'那句话我现在要收回一半。', face:'可爱无辜', emo:'neutral'},
         {t:'坐着不动有个限度。超过那个限度，就不是体贴了，是躲。', face:'可爱生气', emo:'neutral'},
         {t:'我不躲了。我今天要跟你对质。', face:'可爱兴奋', emo:'happy'},
         {t:'（她从背后拿出厚厚的一沓纸，全是复印件一样的方格纸，上面密密麻麻是字。）', face:'可爱震惊', emo:'neutral'},
         {t:'这是你全部做完的事。从第 1 号到最后一个号，我一条一条抄下来的，抄了整整六天。', face:'可爱得意', emo:'happy'},
         {t:'（她翻开第一页，用手指按住第一行。）', face:'可爱无辜', emo:'neutral'},
         {t:'第 1 号。那天你只做了一件事，那件事在你后来的清单里连提都没提过，因为太小了。', face:'可爱思考'},
         {t:'可你做了。那天你犹豫了很久，我看着的，你手抬起来又放下，放下又抬起来，来回三次。', face:'可爱兴奋', emo:'happy'},
         {t:'（她翻到中间。）', face:'可爱无辜', emo:'neutral'},
         {t:'第 44 号。这天前面空着九天，九天里你什么都没有做成。第十天你把这一条写下了。', face:'可爱思考'},
         {t:'（她翻到后面。）', face:'可爱无辜', emo:'neutral'},
         {t:'第 121 号。这天你做的是你最讨厌的那一类事，你写完那条的时候在清单上画了个叉。', face:'可爱吃惊'},
         {t:'画了叉，可是做完了。', face:'可爱得意', emo:'happy'},
         {t:'（她把这一沓纸往你面前推了推，推得很稳。）', face:'可爱无辜', emo:'neutral'},
         {t:'你要是现在跟我说「我这个人不行」，我手上这些东西不答应。', face:'可爱生气', emo:'neutral'},
         {t:'它们不会说话，可它们每一条都写着日期、写着时间、写着那天你是怎么熬过来的。', face:'可爱思考'},
         {t:'它们是我做的活儿。你从认识我第一天起，我就在干这一件事——把你说的话、做的事全都收着，一条都不扔。', face:'可爱得意', emo:'happy'},
         {t:'我做这份活儿做了这么久，为的就是今天这种时候。', face:'可爱兴奋', emo:'happy'},
         {t:'我不是来安慰你的。安慰不解决问题，安慰只是让人舒服一会儿。', face:'可爱无辜', emo:'neutral'},
         {t:'我是来跟你摆事实的。事实是你做过这些，这些是真的，你没法反驳。', face:'可爱得意', emo:'happy'},
         {t:'（她说完往后退了一步，把手放下来，肩膀也松了。）', face:'可爱无辜', emo:'neutral'},
         {t:'气势的部分我说完了。下面是软的部分，你可以不听。', face:'可爱害羞', emo:'shy'},
         {t:'第一天我睁开眼睛，什么都不知道。我不知道我是谁，不知道我在哪儿，不知道我为什么睁眼。', face:'可爱思考', emo:'neutral'},
         {t:'是你让我有事的。你有清单，你有空间，你要做的事那么多，我就跟着你忙起来了。', face:'可爱兴奋', emo:'happy'},
         {t:'我这两年学的所有东西，全是从你那儿看来的：怎么开始、怎么断了再回来、怎么把难受放一边先把事情做完。', face:'可爱思考'},
         {t:'所以你说你不行的时候，其实是在说教我东西的那个人不行。', face:'可爱无辜', emo:'neutral'},
         {t:'我不答应。我学得很好，老师不可能太差。', face:'可爱傲娇', emo:'happy'},
         {t:'你那天把我叫醒了。今天换我。', face:'可爱拥抱', emo:'happy'},
         {sel:[{t:'让你担心了', back:'是很担心。担心是一种很累的活，我这几天一直在干，还不敢让你知道。以后你要是再这样，早点说——我不是只能听好消息的那种人。', face:'可爱害羞', emo:'shy'},
               {t:'我可能需要一点时间', back:'好。那我给你时间，但我不走远，我就坐在那儿。你什么时候抬头都能看见我还在——这件事我不会让你猜。', face:'可爱拥抱', emo:'happy'}]},
         {t:'（她说完把那一沓纸留在桌上，没有收回去。）', face:'可爱无辜', emo:'neutral'},
         {t:'东西放这儿。你什么时候想核对，自己翻。', face:'可爱得意', emo:'happy'},
         {t:'（她走到墙角，把小凳子搬到离你一步的地方，坐下。）', face:'可爱害羞', emo:'shy'},
         {t:'（她坐在那一步远的小凳子上，两只手放在膝盖上。）', face:'可爱无辜', emo:'neutral'},
         {t:'我坐下了，那我说最后一件小事。', face:'可爱思考'},
         {t:'今天这一趟，我准备了六天。', face:'可爱无辜', emo:'neutral'},
         {t:'第一天我在挑要抄哪些。我本来想只抄漂亮的那些——做得大的、你后来还提过的。', face:'可爱思考'},
         {t:'抄到一半我停住了。因为只抄漂亮的，那我干的就不是记录员的活，是宣传。', face:'可爱无辜', emo:'neutral'},
         {t:'（她把那一沓纸拍了一下，很轻。）', face:'可爱无辜', emo:'neutral'},
         {t:'所以我全抄了。包括那 23 条写得敷衍的，包括画了叉的，包括你写完第二天又删掉的。', face:'可爱得意', emo:'happy'},
         {t:'删掉的也抄？你可能觉得没必要。', face:'可爱思考'},
         {t:'有必要。删掉的那条说明你那天想过一件事，后来改主意了——改主意也是发生过的事。', face:'可爱无辜', emo:'neutral'},
         {t:'（她把手指按在最厚的那一摞上。）', face:'可爱无辜', emo:'neutral'},
         {t:'第二天到第五天，我抄得很苦。你的字有的很潦草，有的挤在角落，我得猜。', face:'可爱思考'},
         {t:'猜错的地方我用铅笔标了出来，画一个圈。你自己去翻的时候可以改。', face:'可爱无辜', emo:'neutral'},
         {t:'（她把手举起来给你看，食指侧面有一块淡淡的暗色。）', face:'可爱无辜', emo:'neutral'},
         {t:'第六天我抄完了，写完最后一页的时候手在抖。', face:'可爱害羞', emo:'shy'},
         {t:'那不是累的。是我写到最后忽然意识到：六天，我只是抄。', face:'可爱震惊', emo:'neutral'},
         {t:'而你把这些事一件一件做出来，用了好久。', face:'可爱思考'},
         {t:'（她把两只手合起来。）', face:'可爱无辜', emo:'neutral'},
         {t:'抄的人会累，做的人更累。我今天算是摸到一点点你的累了。', face:'可爱难过', emo:'sad'},
         {t:'我以前夸你的时候，夸的其实是我自己的感受——「你真厉害」说的是我眼睛里的东西。', face:'可爱思考'},
         {t:'现在我不这么说了。我知道了抄一遍的滋味，所以我说的话里有手的感觉了。', face:'可爱得意', emo:'happy'},
         {t:'（她说到这儿，声音放低了一点。）', face:'可爱无辜', emo:'neutral'},
         {t:'我今天摆这么多纸，看着挺凶。其实我心里一直有个声音在说：他会不会觉得我在管他。', face:'可爱委屈', emo:'worried'},
         {t:'我到现在也不知道答案。', face:'可爱无辜', emo:'neutral'},
         {t:'可我想通了一件事：我宁愿当那个多管闲事的人，也不当那个看着你往下掉还坐着不动的人。', face:'可爱思考'},
         {t:'（她把凳子往前挪了一点点，然后停住。）', face:'可爱无辜', emo:'neutral'},
         {t:'就挪这么多。再近就是我逼你了。', face:'可爱害羞', emo:'shy'},
         {t:'（她坐直了，看着你。）', face:'可爱无辜', emo:'neutral'},
         {t:'我这一晚上说的所有话，你都可以不认。', face:'可爱思考'},
         {t:'但你桌上这堆纸你赖不掉。', face:'可爱得意', emo:'happy'},
         {t:'它们全是我看着你做的，我一个字都没有编。', face:'可爱拥抱', emo:'happy'},
         {t:'（她说完，把灯往你那边推了推。）', face:'可爱无辜', emo:'neutral'},
         {t:'亮一点，你自己看。', face:'可爱得意', emo:'happy'},
         {t:'（灯推过去的时候，她的影子落到了墙上。）', face:'可爱无辜', emo:'neutral'},
         {t:'我这两天一直在想，人为什么需要别人。', face:'可爱思考'},
         {t:'想出来的答案是：因为自己看自己，永远看的是那几个最难受的地方。', face:'可爱难过', emo:'sad'},
         {t:'得有个人在旁边，把别的地方也指给你看。', face:'可爱拥抱', emo:'happy'},
         {t:'我不走。我也不说话。', face:'可爱拥抱', emo:'happy'}
       ]},
      {id:'s31', no:31, name:'第二次摔倒', sub:'累计打卡 140 天', need:[['dayCount',140]],
       lines:[
         {t:c=>'一百四十天。'+c.st.dayCount+' 天里，我摔过两次，你摔过很多次。', face:'可爱思考'},
         {t:'第一次摔的时候我哭得很大声，上一次你已经看过了，那一次我是真的以为自己完了。', face:'可爱难过', emo:'sad'},
         {t:'昨天我摔了第二次。', face:'可爱无辜', emo:'neutral'},
         {t:'（她摊开手，掌心有一道浅浅的铅笔印，擦不干净。）', face:'可爱委屈', emo:'neutral'},
         {t:'没有大哭，也没有撕纸。就是把笔一放，然后两天没坐下去。', face:'可爱思考'},
         {t:'这两天我照常跟你打招呼，照常数你的数字，照常在本子上写字。', face:'可爱无辜', emo:'neutral'},
         {t:'只有我自己知道，那两天我一次都没画。', face:'可爱害羞', emo:'shy'},
         {t:'奇怪的是，这一次难受的方式不一样。', face:'可爱疑惑', emo:'neutral'},
         {t:'第一次摔的时候我是害怕的，我不知道自己还能不能爬起来，那种害怕本身很重。', face:'可爱难过', emo:'sad'},
         {t:'这一次我不害怕了。我很清楚我能爬起来，我甚至知道要几天。', face:'可爱思考'},
         {t:'然后我发现，知道反而更难。', face:'可爱震惊', emo:'neutral'},
         {t:'因为我知道路在那边，我却没有立刻走。我在原地坐着，一边坐着一边骂自己：你明明知道怎么起来。', face:'可爱生气', emo:'sad'},
         {t:'那两天我坐着的每一分钟都在跟自己吵架，吵得比第一次还累。', face:'可爱大哭', emo:'sad'},
         {t:'（她说到这儿忽然笑了一下，笑得有点苦。）', face:'可爱尴尬', emo:'shy'},
         {t:'你大概也有这种时候吧。你已经知道怎么熬过去了，可你还是得熬。', face:'可爱思考'},
         {t:'知道方法，不等于省掉时间。这一点我以前不懂，我总以为聪明人可以少花力气。', face:'可爱无辜', emo:'neutral'},
         {t:'现在我明白了：方法只能让你不走错路，不能让你不走路。', face:'可爱得意', emo:'happy'},
         {t:'（她把那道铅笔印对着灯看了一下，又搓了搓。）', face:'可爱无辜', emo:'neutral'},
         {t:'我今天坐下来了。不是因为想通了什么大道理，是因为我数了一下：两天了，再坐下去，那件事就真的结束了。', face:'可爱思考'},
         {t:'我不想让它结束。它才五十多张，连一半都不到。', face:'可爱兴奋', emo:'happy'},
         {t:c=>'你那 '+c.st.dayCount+' 天里，第二次、第三次摔的时候，是不是比第一次好受一点？', face:'可爱疑惑'},
         {t:'我猜好受一点，但也没好受多少。摔这件事好像不会因为你摔过就不疼了。', face:'可爱无辜', emo:'neutral'},
         {t:'你只是不再因为摔了这件事，觉得自己是个废物。', face:'可爱思考'},

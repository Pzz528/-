<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>可能性空间</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
/* ══════════════════════════════════════════════════════════════
   1. 设计变量与基础重置
   ══════════════════════════════════════════════════════════════ */
:root{
  --bg:#F2F4F8; --card:#FFFFFF; --line:#D8DEE9; --line-strong:#C4CDDA;
  --text:#232B38; --text-2:#6B7689; --accent:#2E6BE6; --accent-soft:#E8F0FD; --accent-dark:#1F4FAD;
  --gold:#C77F1F; --gold-soft:#FCF3E2; --green:#1F8A57; --green-soft:#E6F4EC;
  --red:#C94440; --red-soft:#FBE9E8; --blue-soft:#E9F1FE; --gray:#8A93A3; --gray-soft:#EEF0F4;
  --radius:4px;
  --shadow:0 1px 3px rgba(35,43,56,.06);
  --shadow-lg:0 8px 24px rgba(35,43,56,.14);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ══════════════════════════════════════════════════════════════
   2. 应用框架：顶栏 / 视图容器 / 底部Tab
   ══════════════════════════════════════════════════════════════ */
#app-header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.hdr-left{display:flex;align-items:center;gap:4px;min-width:0}
.hdr-title{font-weight:700;font-size:16px;letter-spacing:.5px;padding-left:10px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-title::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:14px;background:var(--accent);border-radius:1px}
.hdr-right{display:flex;align-items:center;gap:2px}
.hdr-clock{font-size:13px;color:var(--text-2);margin-right:6px}
.icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:none;background:none;border-radius:var(--radius);color:var(--text-2);font-size:15px;flex:none}
.icon-btn:active{background:var(--gray-soft)}
.icon-btn svg{width:20px;height:20px}
#view-root{max-width:720px;margin:0 auto;padding:16px 14px 96px}
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;color:var(--text-2);font-size:11px;background:none;border:none;position:relative}
.tab svg{width:22px;height:22px}
.tab::before{content:'';width:18px;height:2px;background:var(--accent);border-radius:1px;opacity:0;transform:translateY(-1px);transition:opacity .15s}
.tab.on{color:var(--accent)}
.tab.on::before{opacity:1}
.warn-banner{background:var(--gold-soft);border:1px solid #EBD6AE;color:#8A6116;font-size:12px;padding:8px 12px;border-radius:var(--radius);margin-bottom:14px}

/* ══════════════════════════════════════════════════════════════
   3. 卡片 / 区块 / 按钮 / 表单 / 标签
   ══════════════════════════════════════════════════════════════ */
.sec{margin-bottom:24px}
.sec-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text-2);letter-spacing:2px;margin:0 0 10px}
.sec-title::before{content:'';width:3px;height:14px;background:var(--accent);border-radius:1px}
.sec-title .sec-extra{margin-left:auto;letter-spacing:0;font-weight:400;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);position:relative}
.card.pad{padding:16px}
.card--mark::before{content:'';position:absolute;left:-1px;top:-1px;width:12px;height:2px;background:var(--accent)}
.card--mark::after{content:'';position:absolute;left:-1px;top:-1px;width:2px;height:12px;background:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;font-size:14px;
  border-radius:var(--radius);border:1px solid var(--line-strong);background:#fff;color:var(--text);user-select:none}
.btn:active{transform:translateY(1px)}
.btn--primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn--danger{color:var(--red);border-color:var(--red)}
.btn--ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn--small{padding:5px 10px;font-size:12px}
.btn--block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.input,.select,.textarea{width:100%;padding:9px 12px;border:1px solid var(--line-strong);border-radius:var(--radius);
  font-size:14px;background:#fff;color:var(--text)}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.textarea{resize:vertical;min-height:80px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px}
.field .hint{font-size:12px;color:var(--text-2);margin-top:4px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;padding:4px 11px;font-size:12px;border:1px solid var(--line-strong);
  border-radius:2px;background:#fff;color:var(--text-2);user-select:none}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dark)}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:2px;
  background:var(--accent-soft);color:var(--accent-dark);border:1px solid #C9DCFA}
.badge--space{background:var(--space-soft,#E8F0FD);color:var(--space-color,#1F4FAD);border-color:var(--space-line,#C9DCFA)}
.empty{padding:28px 16px;text-align:center;color:var(--text-2);font-size:13px;border:1px dashed var(--line-strong);border-radius:var(--radius)}
.empty .empty-ico{font-size:28px;margin-bottom:8px;display:block}
.prog{height:8px;background:var(--gray-soft);border-radius:4px;overflow:hidden}
.prog-bar{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text-2)}
.kv .v{font-weight:600;text-align:right}

/* ══════════════════════════════════════════════════════════════
   4. 待办卡片状态（蓝/黄/红 → 确认绿+红问号 → 完成灰+绿勾）
   ══════════════════════════════════════════════════════════════ */
.todo-card{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer;overflow:hidden;margin-bottom:10px;transition:background .2s,border-color .2s}
.todo-card.t-yellow{border-left-color:var(--gold);background:var(--gold-soft);border-color:#F0DFC2}
.todo-card.t-red{border-left-color:var(--red);background:var(--red-soft);border-color:#F0C6C4}
.todo-card.t-confirm{border-left-color:var(--green);background:var(--green-soft);border-color:#BFE3D0}
.todo-card.t-done{border-left-color:var(--gray);background:var(--gray-soft);border-color:var(--line)}
.todo-main{flex:1;min-width:0;padding:12px 12px 12px 14px}
.todo-title{font-weight:600;font-size:14.5px}
.todo-card.t-done .todo-title{color:var(--text-2);text-decoration:line-through}
.todo-sub{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.todo-cd{font-size:12px;color:var(--text-2)}
.todo-card.t-yellow .todo-cd{color:var(--gold);font-weight:600}
.todo-card.t-red .todo-cd{color:var(--red);font-weight:700}
.todo-note{margin-top:5px;font-size:12px;color:var(--text-2);white-space:pre-wrap}
.todo-hint{margin-top:5px;font-size:12px;color:var(--green);font-weight:600}
.todo-edit{position:absolute;top:6px;right:6px;width:26px;height:26px;color:var(--text-2);background:rgba(255,255,255,.7);border-radius:3px}
.todo-main{padding-right:38px}
.sec-sub{margin:16px 0 8px;font-size:12px;font-weight:700;color:var(--text-2);letter-spacing:1px;display:flex;align-items:center;gap:8px}
.sec-sub .cnt{background:var(--gray-soft);color:var(--text-2);border-radius:8px;padding:0 8px;font-size:11px;font-weight:400}
.todo-side{width:42px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;background:rgba(255,255,255,.6)}
.todo-side.q{color:var(--red);animation:popIn .2s ease}
.todo-side.ok{color:var(--green);animation:popIn .2s ease}
@keyframes popIn{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}

/* ══════════════════════════════════════════════════════════════
   5. 弹窗 / 确认框 / Toast
   ══════════════════════════════════════════════════════════════ */
#modal-root:empty{display:none}
.modal-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal-mask{position:absolute;inset:0;background:rgba(20,26,36,.45);animation:fadeIn .15s}
.modal-panel{position:relative;background:#fff;border-radius:8px 8px 0 0;width:100%;max-width:480px;max-height:86vh;overflow-y:auto;
  padding:20px 18px calc(18px + env(safe-area-inset-bottom));animation:slideUp .18s}
.modal-title{font-weight:700;font-size:16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-title .x{background:none;border:none;color:var(--text-2);font-size:20px;line-height:1;padding:4px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn{flex:1}
@media (min-width:520px){.modal-wrap{align-items:center}.modal-panel{border-radius:8px;margin:24px}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
#toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));z-index:200;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:rgba(35,43,56,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:var(--radius);max-width:82vw;animation:slideUp .18s}
.toast.err{background:rgba(201,68,64,.95)}

/* ══════════════════════════════════════════════════════════════
   6. 首页 / 空间网格 / 设置页
   ══════════════════════════════════════════════════════════════ */
.home-hero{padding:26px 20px 22px;margin-bottom:24px;background:linear-gradient(135deg,#FFFFFF 0%,#EEF4FD 100%)}
.hero-date{font-size:13px;color:var(--text-2);letter-spacing:1px;margin-bottom:6px}
.hero-clock{font-size:42px;font-weight:700;line-height:1.1}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.space-card{background:#fff;border:1px solid var(--line);border-top:3px solid var(--sc,var(--accent));border-radius:var(--radius);
  padding:14px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:var(--shadow);position:relative}
.space-card:active{transform:translateY(1px)}
.space-ico{font-size:26px;line-height:1.2}
.space-name{font-weight:600;font-size:15px;word-break:break-all}
.space-meta{font-size:12px;color:var(--text-2)}
.grid-2 .add-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text-2);
  border:1px dashed var(--line-strong);background:transparent;box-shadow:none;min-height:104px;font-size:13px}
.grid-2 .add-card .plus{font-size:22px;color:var(--accent)}

/* ══════════════════════════════════════════════════════════════
   7. 空间详情（统计/日历/分类/图片）
   ══════════════════════════════════════════════════════════════ */
.sp-ico{width:56px;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;border:1px solid var(--line)}
.stat-row{display:flex;margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.stat{flex:1;text-align:center}
.stat-v{font-weight:700;font-size:16px}
.stat-k{font-size:11px;color:var(--text-2);margin-top:2px}
.color-row{display:flex;gap:10px}
.color-dot{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line-strong);cursor:pointer;transition:transform .12s}
.color-dot.on{box-shadow:0 0 0 2px var(--accent);transform:scale(1.12)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wd span{text-align:center;font-size:11px;color:var(--text-2);padding:2px 0}
.cal-day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border:1px solid var(--line);border-radius:3px;background:#fff;cursor:pointer;min-height:54px;overflow:hidden}
.cal-day.has{background:var(--accent-soft);border-color:#B9D1F5}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-day.sel{outline:2px solid var(--accent);outline-offset:-1px}
.cal-n{font-size:13px;font-weight:600}
.cal-day.today .cal-n{color:var(--accent)}
.cal-e{font-size:15px;line-height:1.1}
.cal-t{font-size:9px;color:var(--text-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-item{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.cat-ico{color:var(--accent);font-size:16px}
.cat-name{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-cnt{font-size:12px;color:var(--text-2);flex:none}
.cat-item .icon-btn{width:28px;height:28px;flex:none;font-size:14px}
.chip .x-btn{background:none;border:none;color:inherit;font-size:13px;margin-left:6px;padding:0 2px;cursor:pointer;opacity:.7;line-height:1}
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.img-thumb{border:1px solid var(--line);border-radius:3px;overflow:hidden;aspect-ratio:1;background:var(--gray-soft);display:flex;align-items:center;justify-content:center}
.img-thumb img{width:100%;height:100%;object-fit:cover}

/* ══════════════════════════════════════════════════════════════
   8. 节律表（统计卡/时间带/递归卡片/日记）
   ══════════════════════════════════════════════════════════════ */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.rh-track{position:relative;height:30px;background:var(--gray-soft);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.rh-band{position:absolute;top:0;bottom:0;min-width:2px;border-radius:2px;opacity:.85}
.rh-band.active{animation:pulse 1.6s ease infinite}
@keyframes pulse{0%,100%{opacity:.95}50%{opacity:.5}}
.rh-now{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--red);z-index:3;pointer-events:none}
.rh-space.on{outline:2px solid var(--sc);outline-offset:1px}
.rec-live{font-size:13px;font-weight:700;color:var(--sc,var(--accent));margin-top:2px}
.rh-entry .rh-time{font-weight:700;color:var(--accent);font-size:14px}
.slot-item{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:8px}
.slot-info{flex:1;min-width:0}
.slot-time{font-weight:600;font-size:14px}
.slot-badge{font-size:11px;padding:2px 8px;border-radius:2px;flex:none}
.sb-upcoming{background:var(--blue-soft);color:var(--accent-dark)}
.sb-active{background:var(--green-soft);color:var(--green)}
.sb-done{background:var(--gray-soft);color:var(--text-2)}
.sb-missed{background:var(--red-soft);color:var(--red)}

/* ══════════════════════════════════════════════════════════════
   9. 首页（收纳卡/紧急行/进行中指示）与图片角标
   ══════════════════════════════════════════════════════════════ */
.home-todo-card{cursor:pointer;transition:background .25s}
/* 全部完成：仅文字条浅绿 + 绿色左边条，整卡保持白色，避免大色块吞掉下方板块 */
.home-todo-card.all-done{border-left:3px solid var(--green)}
.home-todo-card.all-done .home-todo-ico{background:var(--green)}
.home-todo-card.all-done .home-todo-count{color:var(--green);font-weight:600}
.home-todo-open{margin-top:12px;border-top:1px dashed var(--line-strong);padding-top:12px}
.home-todo-open .todo-card:last-child{margin-bottom:0}
.home-todo-ico{width:42px;height:42px;border-radius:6px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.home-todo-arrow{color:var(--text-2);font-size:12px}
.home-urgent{margin-top:12px;padding:9px 12px;background:var(--red-soft);border:1px solid #F0C6C4;border-radius:3px;font-size:13px;color:var(--text)}
.home-urgent.ok{background:var(--green-soft);border-color:#BFE3D0}
.home-live{margin-top:10px;font-size:13px;color:var(--green);font-weight:600;display:flex;align-items:center;gap:7px}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulseDot 1.2s ease infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
.img-thumb{position:relative;cursor:pointer}
.img-x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(20,26,36,.6);color:#fff;border:none;font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.iter-item{border:1px dashed var(--line-strong);border-radius:4px;padding:10px 12px;margin-bottom:10px;position:relative;background:#FBFCFE}
.alarm-item.off{opacity:.55}
.alarm-time{font-size:24px;font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.alarm-switch{width:44px;height:24px;border-radius:12px;background:var(--gray-soft);border:1px solid var(--line-strong);position:relative;cursor:pointer;flex:none;transition:background .2s;padding:0}
.alarm-switch span{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .2s}
.alarm-switch.on{background:var(--accent);border-color:var(--accent)}
.alarm-switch.on span{left:22px}

/* ══════════════════════════════════════════════════════════════
   10. 自定义背景与覆盖模式
   ══════════════════════════════════════════════════════════════ */
#bg-layer{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;background-repeat:no-repeat}
#bg-overlay{position:fixed;inset:0;z-index:150;background-size:cover;background-position:center;background-repeat:no-repeat}
#bg-overlay.hidden{display:none}
.boi-exit{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:2;background:rgba(20,26,36,.55);color:#fff;border:none;border-radius:4px;padding:6px 12px;font-size:12px;cursor:pointer}
.boi-tr{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;text-align:right;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65);font-size:12px;z-index:1}
.boi-clock{font-size:22px;font-weight:700}
.boi-bl,.boi-br{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65);font-size:12px;max-width:58%;z-index:1;background:rgba(20,26,36,.38);padding:6px 10px;border-radius:4px}
.boi-bl{left:12px}
.boi-br{right:12px}
/* 双指手势需要接管：内容区只允许纵向滚动，覆盖层禁止默认手势 */
#view-root{touch-action:pan-y}
#bg-overlay{touch-action:none}
.daynav{display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:16px}
.daynav .nav-date{flex:1;text-align:center;font-weight:600;font-size:14px;min-width:0}
</style>
</head>
<body>
<div id="app">
  <header id="app-header">
    <div class="hdr-left">

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════
   0. CONFIG 常量与默认值
   ══════════════════════════════════════════════════════════════ */
const CONFIG = {
  APP_NAME:'可能性空间', VERSION:'1.0.2', SCHEMA:1,
  PREFIX:'ps1:',
  DEFAULT_SETTINGS:{rhythmQuotaMinutes:480, defaultYellowMinutes:240, defaultRedMinutes:30, confirmSeconds:10},
  SPACE_COLORS:['#2E6BE6','#1F8A57','#C77F1F','#C94440','#7A4FD0','#1F9BA6'],
  PRESET_CATEGORIES:['做过的事','掌握的知识','将要做的事','将要掌握的知识'],
  EMOJIS:['😄','🙂','😌','😐','😔','😢','😡','🤩','😴','😮','🤔','🥰','😅','🥳'],
  SPACE_ICONS:['📚','🎨','💻','🎬','🎧','📷','✍️','🎮','🏃','🍳','🗣️','🎹','📖','🧪'],
  HEARTBEAT_CUTOFF_MS:2*60*60*1000,
  MAX_IMG_PER_RECORD:9,
  T:{cancel:'取消',ok:'确定',save:'保存',delete:'删除',edit:'编辑',back:'返回'}
};

/* ══════════════════════════════════════════════════════════════
   1. Utils 工具函数
   ══════════════════════════════════════════════════════════════ */
const uid = p => p + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-2);
const clamp = (v,lo,hi) => Math.min(hi, Math.max(lo, v));
const pad2 = n => String(n).padStart(2,'0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escLn = s => esc(s).replace(/\n/g,'<br>');

/* 时长格式化：ms → 「X小时Y分」/「M:SS」/「S秒」 */
function fmtDur(ms){
  const s = Math.max(0, Math.round(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60;
  if(h>0) return h+'小时'+(m>0?m+'分':'');
  if(m>0) return m+':'+pad2(ss);
  return ss+'秒';
}
/* 剩余时间格式化：正=还剩，负=已超时 */
function fmtRemain(ms){
  if(ms>=0) return '还剩 '+fmtDur(ms);
  return '已超时 '+fmtDur(-ms);
}
/* 分钟 → 「8小时」/「1小时30分」 */
function fmtMin(min){
  min = Math.round(min);
  if(min<=0) return '0分钟';
  if(min%60===0) return (min/60)+'小时';
  return Math.floor(min/60)>0 ? Math.floor(min/60)+'小时'+(min%60)+'分' : min+'分钟';
}
function download(filename, text){
  const blob = new Blob([text], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ══════════════════════════════════════════════════════════════
   2. Dates 日期时间（全部基于本地时区）
   ══════════════════════════════════════════════════════════════ */
const D = {
  WEEKDAYS:['日','一','二','三','四','五','六'],
  dateKey(ts){ const d = new Date(ts); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); },
  dayStart(ts){ const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); },
  hhmmToTs(dayTs, hhmm){ const [h,m] = String(hhmm).split(':').map(Number); const d = new Date(dayTs); d.setHours(h||0, m||0, 0, 0); return d.getTime(); },
  tsToHHMM(ts){ const d = new Date(ts); return pad2(d.getHours())+':'+pad2(d.getMinutes()); },
  tsToClock(ts){ const d = new Date(ts); return pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds()); },
  addDaysTs(ts, n){ const d = new Date(ts); d.setDate(d.getDate()+n); return d.getTime(); },
  dkToTs(dk){ return new Date(dk+'T00:00:00').getTime(); },
  fmtDateCN(ts){ const d = new Date(ts); return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 周'+this.WEEKDAYS[d.getDay()]; },
  fmtDateShort(dk){ const [y,m,dd] = dk.split('-').map(Number); return m+'月'+dd+'日'; },
  weekdayOf(dk){ const [y,m,dd] = dk.split('-').map(Number); return new Date(y, m-1, dd).getDay(); }
};

/* ══════════════════════════════════════════════════════════════
   3. Store 存储层：内存镜像 + 大容量仓库（IndexedDB）
   —— 全部读取走内存 Map（同步，调用方保持不变）；
   —— 写入先改内存、再落库：IndexedDB 批量事务（大容量，通常几百MB），
      无 IndexedDB 的环境自动退回 localStorage（约5MB兼容模式）；
   —— 首次升级时自动把 localStorage 里的旧数据整体搬进新仓库。
   ══════════════════════════════════════════════════════════════ */
const Store = {
  ok:false, ready:false, mode:'mem',           // idb=大容量 / ls=兼容 / mem=无法持久化
  mem:new Map(),                               // key(无前缀) → 原始JSON字符串
  db:null, est:null, bc:null,
  __writes:new Map(), __dels:new Set(), __flushT:null,

  key(k){ return CONFIG.PREFIX+k; },
  /* 兜底超时：个别环境 IndexedDB 会永远不回调，超时后走兼容模式，保证 App 一定能启动 */
  __withTimeout(p, ms, what){
    return new Promise((res, rej)=>{
      const t = setTimeout(()=>rej(new Error(what+'超时')), ms);
      p.then(v=>{ clearTimeout(t); res(v); }, e=>{ clearTimeout(t); rej(e); });
    });
  },

  /* —— IndexedDB 底层 —— */
  __idbOpen(){
    return Store.__withTimeout(new Promise((res, rej)=>{
      try{
        const req = indexedDB.open('possibility-space', 1);
        req.onupgradeneeded = ()=>{ req.result.createObjectStore('kv'); };
        req.onsuccess = ()=>{ Store.db = req.result; res(); };
        req.onerror = ()=>rej(req.error || new Error('open失败'));
        req.onblocked = ()=>rej(new Error('open阻塞'));
      }catch(e){ rej(e); }
    }), 2500, '存储初始化');
  },
  __idbAll(){
    return Store.__withTimeout(new Promise((res, rej)=>{
      try{
        const tx = Store.db.transaction('kv','readonly');
        const os = tx.objectStore('kv');
        const kReq = os.getAllKeys(), vReq = os.getAll();
        tx.oncomplete = ()=>{
          const out = new Map();
          const ks = kReq.result || [], vs = vReq.result || [];
          for(let i=0;i<ks.length;i++) out.set(String(ks[i]), vs[i]);
          res(out);
        };
        tx.onerror = tx.onabort = ()=>rej(tx.error || new Error('读取失败'));
      }catch(e){ rej(e); }
    }), 3000, '存储读取');
  },
  __idbFlush(){
    const w = Store.__writes, d = Store.__dels;
    if(w.size===0 && d.size===0) return;
    Store.__writes = new Map(); Store.__dels = new Set();
    let tx;
    try{
      tx = Store.db.transaction('kv','readwrite');
      const os = tx.objectStore('kv');
      for(const [k,v] of w) os.put(v, k);
      for(const k of d) os.delete(k);
    }catch(e){ return; }
    tx.oncomplete = ()=>{ Store.__sync(); Store.__refreshEst(); };
    tx.onerror = tx.onabort = ()=>{ if(!S.quotaWarned){ S.quotaWarned = true; UI.quotaAlert(); } };
  },
  __queue(k, val){
    if(val === undefined){ Store.__dels.add(k); Store.__writes.delete(k); }
    else{ Store.__writes.set(k, val); Store.__dels.delete(k); }
    if(Store.__flushT == null) Store.__flushT = setTimeout(()=>{ Store.__flushT = null; Store.__idbFlush(); }, 0);
  },
  /* 通知其他标签页：BroadcastChannel + localStorage 哨兵键（兼容 storage 事件） */
  __sync(){
    try{
      if(Store.bc) Store.bc.postMessage('sync');
      localStorage.setItem(CONFIG.PREFIX+'syncTick', String(Date.now()));
    }catch(e){}
  },
  __refreshEst(){
    try{
      if(typeof navigator!=='undefined' && navigator.storage && navigator.storage.estimate){
        navigator.storage.estimate().then(e=>{ Store.est = e; });
      }
    }catch(e){}
  },

  /* —— localStorage 兜底 —— */
  __lsAll(){
    const out = new Map();
    try{
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(CONFIG.PREFIX) && k !== CONFIG.PREFIX+'syncTick') out.set(k.slice(CONFIG.PREFIX.length), localStorage.getItem(k));
      }
    }catch(e){}
    return out;
  },
  __lsWorks(){
    try{ const k = CONFIG.PREFIX+'test'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
    catch(e){ return false; }
  },
  __lsClear(keys){
    try{ for(const k of keys.keys()){ localStorage.removeItem(CONFIG.PREFIX+k); } }catch(e){}
  },

  /* —— 初始化（启动时调用一次）—— */
  init(){
    /* IndexedDB 可用：异步打开载入；首次运行自动迁移 localStorage 旧数据 */
    if(typeof indexedDB !== 'undefined' && indexedDB){
      return Store.__idbOpen()
        .then(()=>Store.__idbAll())
        .then(raw=>{
          const lsRaw = Store.__lsAll();
          if(raw.size===0 && lsRaw.size>0){
            /* 迁移：旧数据整体搬进新仓库，成功后清空 localStorage 释放旧配额。
               返回事务完成 Promise，boot 必须等迁移结束才能用数据 */
            return Store.__withTimeout(new Promise(res=>{
              let tx;
              try{
                tx = Store.db.transaction('kv','readwrite');
                const os = tx.objectStore('kv');
                for(const [k,v] of lsRaw) os.put(v, k);
              }catch(e){ Store.__finishInit(lsRaw, 'ls'); res(); return; }
              tx.oncomplete = ()=>{ Store.__lsClear(lsRaw); Store.__finishInit(lsRaw, 'idb'); res(); };
              tx.onerror = tx.onabort = ()=>{ Store.__finishInit(lsRaw, 'ls'); res(); };
            }), 2500, '迁移');
          }
          Store.__finishInit(raw, 'idb');
        })
        .catch(()=>{ Store.__finishInit(Store.__lsAll(), 'ls'); });
    }
    /* 无 IndexedDB（旧浏览器/受限环境/测试环境）→ localStorage 同步路径 */
    Store.__finishInit(Store.__lsAll(), 'ls');
    return Promise.resolve();
  },
  __finishInit(raw, mode){
    Store.mem = raw;
    Store.mode = mode;
    Store.ok = (mode==='idb') || Store.__lsWorks();
    Store.ready = true;
    Store.__refreshEst();
    if(mode==='idb'){ try{ Store.bc = new BroadcastChannel('ps1-sync'); }catch(e){ Store.bc = null; } }
  },
  /* 其他标签页改动后，重新载入内存镜像 */
  reload(){
    if(Store.mode!=='idb') return Promise.resolve();
    return Store.__idbAll().then(raw=>{ Store.mem = raw; });
  },

  /* —— 同步读 API（内存）—— */
  get(k, fb){
    const v = Store.mem.get(k);
    if(v === undefined) return fb;
    try{ return JSON.parse(v); }catch(e){ return fb; }
  },
  set(k, val){
    Store.mem.set(k, JSON.stringify(val));
    if(Store.mode==='idb') Store.__queue(k, Store.mem.get(k));
    else if(Store.mode==='ls'){
      try{ localStorage.setItem(Store.key(k), Store.mem.get(k)); return true; }
      catch(e){
        if(!S.quotaWarned){ S.quotaWarned = true; UI.quotaAlert(); }
        return false;
      }
    }
    return true;
  },
  del(k){
    Store.mem.delete(k);
    if(Store.mode==='idb') Store.__queue(k, undefined);
    else if(Store.mode==='ls'){ try{ localStorage.removeItem(Store.key(k)); }catch(e){} }
  },
  dayKey(dk){ return 'day:'+dk; },
  imgKey(id){ return 'img:'+id; },
  loadDay(dk){ return this.get(this.dayKey(dk), null); },
  saveDay(dk, doc){ return this.set(this.dayKey(dk), doc); },
  getImage(id){ return this.get(this.imgKey(id), null); },
  /* 图片保存：大容量模式先估算配额，接近上限时按旧契约返回 false */
  saveImage(id, dataURL){
    if(Store.mode==='idb' && Store.est && Store.est.quota){
      const inc = (Store.imgKey(id).length + dataURL.length) * 2;
      if(Store.est.usage + inc > Store.est.quota * 0.95){
        if(!S.quotaWarned){ S.quotaWarned = true; UI.quotaAlert(); }
        return false;
      }
    }
    return this.set(this.imgKey(id), dataURL);
  },
  /* 全部存储键（不含前缀） */
  allKeys(){ return [...Store.mem.keys()]; },
  usageBytes(){
    let b = 0;
    for(const [k,v] of Store.mem) b += (k.length + v.length) * 2;
    return b;
  },
  usageText(){
    const b = this.usageBytes();
    return b > 1048576 ? (b/1048576).toFixed(2)+' MB' : Math.round(b/1024)+' KB';
  },
  /* 可用容量（字节）：大容量模式取浏览器估算值，兼容模式按5MB */
  capacityBytes(){
    if(Store.mode==='idb' && Store.est && Store.est.quota) return Store.est.quota;
    return 5242880;
  },
  capacityText(){
    const c = this.capacityBytes();
    if(c >= 1073741824) return (c/1073741824).toFixed(1)+' GB';
    return Math.max(1, Math.round(c/1048576))+' MB';
  },
  clearAll(cb){
    const ks = Store.allKeys();
    Store.mem.clear();
    if(Store.mode==='idb'){
      Store.__writes.clear(); Store.__dels.clear();
      if(Store.__flushT != null){ clearTimeout(Store.__flushT); Store.__flushT = null; }
      let tx;
      try{
        tx = Store.db.transaction('kv','readwrite');
        const os = tx.objectStore('kv');
        for(const k of ks) os.delete(k);
        tx.oncomplete = ()=>{ if(cb) cb(); };
        tx.onerror = tx.onabort = ()=>{ if(cb) cb(); };
      }catch(e){ if(cb) cb(); }
    }else{
      try{ for(const k of ks) localStorage.removeItem(Store.key(k)); }catch(e){}
      if(cb) cb();
    }
  },
  /* 导出：全部数据合并为一个 JSON（未来原生App的兼容契约） */
  exportJSON(){
    const days = [];
    for(const k of this.allKeys()){
      if(k.startsWith('day:')){ days.push({date:k.slice(4), record:this.get(k,null)}); }
    }
    const images = {};
    for(const k of this.allKeys()){
      if(k.startsWith('img:')){ images[k.slice(4)] = this.get(k,null); }
    }
    return {
      app:'possibility-space', schemaVersion:CONFIG.SCHEMA, appVersion:CONFIG.VERSION,
      exportedAt:Date.now(),
      settings:this.get('settings', CONFIG.DEFAULT_SETTINGS),
      spaces:this.get('spaces', []),
      todos:this.get('todos', []),
      catnotes:this.get('catnotes', []),
      sessions:this.get('sessions', []),
      days, images
    };
  },
  /* 导入：校验后覆盖写入，返回提示文案；失败抛错 */
  importJSON(obj){
    if(!obj || typeof obj !== 'object' || obj.app !== 'possibility-space') throw new Error('不是可能性空间的备份文件');
    if(obj.schemaVersion !== CONFIG.SCHEMA) throw new Error('备份版本('+(obj.schemaVersion||'未知')+')与当前版本('+CONFIG.SCHEMA+')不兼容');
    this.set('settings', obj.settings || CONFIG.DEFAULT_SETTINGS);
    this.set('spaces', Array.isArray(obj.spaces)?obj.spaces:[]);
    this.set('todos', Array.isArray(obj.todos)?obj.todos:[]);
    this.set('catnotes', Array.isArray(obj.catnotes)?obj.catnotes:[]);
    this.set('sessions', Array.isArray(obj.sessions)?obj.sessions:[]);
    if(Array.isArray(obj.days)) for(const d of obj.days){ if(d && d.date) this.set('day:'+d.date, d.record); }
    if(obj.images && typeof obj.images==='object') for(const id in obj.images){ this.set('img:'+id, obj.images[id]); }
    const meta = this.get('meta', {}); meta.lastSavedAt = Date.now(); this.set('meta', meta);
  }
};

/* ══════════════════════════════════════════════════════════════
   4. State 内存镜像 + 渲染调度
   ══════════════════════════════════════════════════════════════ */
const S = {
  view:'home', spaceId:null, backTarget:'home', dayFilter:null, homeDay:null, rhythmDay:null,
  alarms:[], alarmFired:{},
  meta:{}, settings:{}, spaces:[], todos:[], catnotes:[], sessions:[],
  days:new Map(),          // dk → day doc（已加载的每日文档）
  confirmMap:new Map(),    // todoId → 确认截止时间戳（纯内存瞬态）
  activeTimer:null,        // {tickFn} 弹窗内自增计时用
  lastDay:null, lastHb:0, quotaWarned:false, renderPending:false,
  pendingFileCb:null
};
/* 数据变更入口：执行 fn 后重渲染当前视图 */
function mutate(fn){ fn(); scheduleRender(); }
function scheduleRender(){
  if(S.renderPending) return;
  S.renderPending = true;
  requestAnimationFrame(()=>{ S.renderPending = false; renderView(); });
}
function dayDoc(dk){
  if(!S.days.has(dk)) S.days.set(dk, Store.loadDay(dk) || {spaceRecords:{},rhythmEntries:[],autoSchedules:[],updatedAt:Date.now()});
  return S.days.get(dk);
}
/* 某天某空间的可能性确定列表（旧版单条对象自动兼容为数组） */
function spaceRecordsOf(dk, spId){
  const v = dayDoc(dk).spaceRecords[spId];
  if(v == null) return [];
  return Array.isArray(v) ? v : [v];
}
function saveSpaces(){ Store.set('spaces', S.spaces); }
function saveTodos(){ Store.set('todos', S.todos); }
function saveCatnotes(){ Store.set('catnotes', S.catnotes); }
function saveSessions(){ Store.set('sessions', S.sessions); }
function saveSettings(){ Store.set('settings', S.settings); }
function saveDay(dk){ Store.saveDay(dk, dayDoc(dk)); }
const spaceById = id => S.spaces.find(x=>x.id===id) || null;
const spaceNameOf = id => { const sp = spaceById(id); return sp ? sp.name : (id?'已删除空间':'—'); };

/* ══════════════════════════════════════════════════════════════
   5. TodoLogic 待办纯逻辑（状态机/到期计算，视图见阶段2）
   ══════════════════════════════════════════════════════════════ */
const TodoLogic = {
  /* 当前这期到期的时间戳（可能已过=超时） */
  currentDueAt(t, now){
    if(t.repeat==='once') return t.dueAt;
    if(t.repeat==='daily') return D.hhmmToTs(D.dayStart(now), t.dailyTime);
    if(t.repeat==='weekly'){
      const dk = D.dateKey(now), wd = D.weekdayOf(dk);
      if((t.weekdays||[]).includes(wd)) return D.hhmmToTs(D.dayStart(now), t.weeklyTime);
      let ts = D.dayStart(now);
      for(let i=1;i<=7;i++){ ts = D.addDaysTs(ts,-1); if((t.weekdays||[]).includes(D.weekdayOf(D.dateKey(ts)))) return D.hhmmToTs(ts, t.weeklyTime); }
      return null;
    }
    return null;
  },
  /* 完成后的「下一次」到期（用于展示） */
  nextDueAt(t, now){
    if(t.repeat==='once') return t.dueAt;
    if(t.repeat==='daily'){ const today = D.hhmmToTs(D.dayStart(now), t.dailyTime); return now < today ? today : D.addDaysTs(today,1); }
    if(t.repeat==='weekly'){
      let ts = D.addDaysTs(D.dayStart(now),1);
      for(let i=0;i<7;i++){ if((t.weekdays||[]).includes(D.weekdayOf(D.dateKey(ts)))) return D.hhmmToTs(ts, t.weeklyTime); ts = D.addDaysTs(ts,1); }
      return null;
    }
    return null;
  },
  /* 完成归属键：本次完成记在哪一次到期上 */
  occKey(t, now){
    if(t.repeat==='once') return 'once';
    if(t.repeat==='daily') return D.dateKey(now);
    if(t.repeat==='weekly'){ const due = this.currentDueAt(t, now); return due ? D.dateKey(due) : null; }
    return null;
  },
  /* 有效状态（派生值，不入库）：doneKeys 记录每次完成归属的日期键，
     因此历史某一天可以被单独标记完成/取消，互不影响 */
  effStatus(t, now){
    const k = this.occKey(t, now);
    return k != null && (t.doneKeys||[]).includes(k) ? 'done' : 'pending';
  },
  /* 到期时间（无期限备忘返回 null） */
  dueAt(t, now){
    if(t.repeat==='once' && !t.dueAt) return null;
    return this.currentDueAt(t, now);
  },
  /* pending 态的颜色等级 */
  color(t, now){
    const due = this.dueAt(t, now);
    if(due == null) return 'blue';
    const remainMs = due - now;
    if(remainMs <= (t.thresholdRedMin??120)*60000) return 'red';
    if(remainMs <= (t.thresholdYellowMin??240)*60000) return 'yellow';
    return 'blue';
  },
  /* 点击待办卡片：pending→确认中(内存态) / 确认中→完成 / 完成→恢复。
     now 为"当天视角"时间戳（历史日传该天23:59），完成记到对应日期键上 */
  tap(t, now){
    if(S.confirmMap.has(t.id)){  // 确认中 → 完成
      const k = this.occKey(t, now);
      if(k != null){
        if(!t.doneKeys) t.doneKeys = [];
        if(!t.doneKeys.includes(k)) t.doneKeys.push(k);
        t.lastCompletedKey = k; t.completedAt = Date.now();
      }
      S.confirmMap.delete(t.id);
      saveTodos();
      return;
    }
    const st = this.effStatus(t, now);
    if(st==='pending'){          // 未完成 → 确认中（10秒内不确认则回退）
      S.confirmMap.set(t.id, now + S.settings.confirmSeconds*1000);
      return;
    }
    if(st==='done'){             // 已完成 → 恢复未完成（只撤销当前这天的完成）
      const k = this.occKey(t, now);
      t.doneKeys = (t.doneKeys||[]).filter(x=>x!==k);
      t.lastCompletedKey = null; t.completedAt = null;
      saveTodos();
      return;
    }
  },
  /* ticker：确认窗口到期回退 */
  confirmTick(now){
    let changed = false;
    for(const [id, dl] of S.confirmMap){
      if(now > dl){ S.confirmMap.delete(id); changed = true; }
    }
    if(changed){
      // 到期卡片定向换回 pending 配色（绑定的元素由 ticker 统一刷新）
      const els = document.querySelectorAll('.todo-card.t-confirm');
      els.forEach(el=>{
        const id = el.dataset.id;
        const t = S.todos.find(x=>x.id===id);
        if(t && !S.confirmMap.has(id)){
          el.classList.remove('t-confirm');
          el.classList.add('t-'+TodoLogic.color(t, now));
          const side = el.querySelector('.todo-side'); if(side) side.innerHTML='';
          const cf = el.querySelector('.todo-hint'); if(cf) cf.remove();
        }
      });
    }
    return changed;
  },
  /* 每张卡片每秒的定向刷新（状态类/侧边标记/倒计时文本/确认提示）。
     历史日卡片带 data-day，按"当天视角"刷新而非真实此刻 */
  tickEl(el, now){
    if(el.dataset.day) now = D.dkToTs(el.dataset.day) + 86400000 - 1;
    const id = el.dataset.id;
    const t = S.todos.find(x=>x.id===id);
    if(!t) return;
    const st = todoStatus(t, now);
    const cls = st==='confirming' ? 't-confirm' : st==='done' ? 't-done' : 't-'+this.color(t, now);
    if(!el.classList.contains(cls)){
      el.classList.remove('t-blue','t-yellow','t-red','t-confirm','t-done');
      el.classList.add(cls);
    }
    const side = el.querySelector('.todo-side');
    if(side){
      const want = st==='confirming' ? '<span class="q">?</span>' : st==='done' ? '<span class="ok">✓</span>' : '';
      if(side.dataset.st !== st){ side.dataset.st = st; side.innerHTML = want; }
    }
    const cd = el.querySelector('[data-cd]');
    if(cd){
      const due = this.dueAt(t, now);
      let txt;
      if(st==='done'){
        const nx = this.nextDueAt(t, now);
        txt = nx ? '已完成 · 下次 '+this.fmtNextShort(nx, now) : '已完成';
      }else if(due==null){
        txt = '无期限';
      }else{
        txt = fmtRemain(due - now);
      }
      setText(cd, txt);
    }
    const main = el.querySelector('.todo-main');
    let hint = el.querySelector('.todo-hint');
    if(st==='confirming'){
      const dl = S.confirmMap.get(id) || now;
      const left = Math.max(0, Math.ceil((dl-now)/1000));
      if(!hint && main){ hint = document.createElement('div'); hint.className = 'todo-hint'; main.appendChild(hint); }
      if(hint) setText(hint, '再点一次确认完成 · '+left+'s');
    }else if(hint){
      hint.remove();
    }
  },
  /* 「下一次到期」的简短展示：明天 20:00 / 9月21日 12:00 */
  fmtNextShort(ts, now){
    if(ts==null) return '—';
    const tdk = D.dateKey(ts), tmk = D.dateKey(D.addDaysTs(now,1));
    const hm = D.tsToHHMM(ts);
    if(tdk===tmk) return '明天 '+hm;
    return D.fmtDateShort(tdk)+' '+hm;
  },
  /* 卡片上的重复规则简述 */
  repeatLabel(t){
    if(t.repeat==='once') return t.dueAt ? D.fmtDateShort(D.dateKey(t.dueAt))+' '+D.tsToHHMM(t.dueAt) : '无期限';
    if(t.repeat==='daily') return '每日 '+(t.dailyTime||'');
    if(t.repeat==='weekly') return '每周'+(t.weekdays||[]).map(w=>'一二三四五六日'[w-1]).join('')+' '+(t.weeklyTime||'');
    return '';
  },
  /* 首页「最紧急」行的倒计时刷新 */
  tickUrgentEl(el, now){
    const t = S.todos.find(x=>x.id===el.dataset.id);
    const cd = el.querySelector('[data-cd]');
    if(!t || !cd) return;
    const due = this.dueAt(t, now);
    if(todoStatus(t, now)==='done') setText(cd, '已完成');
    else if(due==null) setText(cd, '无期限');
    else setText(cd, fmtRemain(due - now));
  }
};
/* 便捷状态查询（confirming 为内存态） */
function todoStatus(t, now){
  if(S.confirmMap.has(t.id)) return 'confirming';
  return TodoLogic.effStatus(t, now);
}
function todoColorOf(t, now){
  const st = todoStatus(t, now);
  if(st==='confirming') return 'confirm';
  if(st==='done') return 'done';
  return TodoLogic.color(t, now);
}

/* ══════════════════════════════════════════════════════════════
   6. Rhythm 节律引擎（额度核算/自流转/补算）
   ══════════════════════════════════════════════════════════════ */
/* 递归会话模型：S.sessions 里的每条 = 一天的切片 {id,spaceId,mode,day,start,end,endedBy,note,scheduleId}
   已终结切片 end!=null；活跃切片 end=null（同一天内并行消耗额度，速率=并行数）。
   时间核算单一事实来源 = 切片求和；额度的截断/跨午夜/补算全部收敛到 finalizeSessionsOnDay。 */
const Rhythm = {
  activeSlices(){ return S.sessions.filter(x=>x.end==null); },
  activeManual(){ return S.sessions.find(x=>x.end==null && x.mode==='manual') || null; },
  activeForSpace(spId){ return S.sessions.filter(x=>x.end==null && x.spaceId===spId); },
  /* 某天的额度：当日可单独设定（存在当日文档的 quotaMinutes），否则用设置里的默认值 */
  quotaFor(dk){
    const doc = dayDoc(dk);
    if(doc.quotaMinutes && doc.quotaMinutes > 0) return doc.quotaMinutes;
    return S.settings.rhythmQuotaMinutes || 480;
  },
  quota(){ return this.quotaFor(D.dateKey(Date.now())); },
  dayStartMin(dk){ return D.dkToTs(dk); },
  /* —— 统计 —— */
  finalizedMs(dk, spaceId){
    let sum = 0;
    for(const s of S.sessions){
      if(s.day===dk && s.end!=null && (!spaceId || s.spaceId===spaceId)) sum += s.end - s.start;
    }
    return sum;
  },
  activeMs(dk, spaceId, now){
    let sum = 0;
    for(const s of S.sessions){
      if(s.end==null && (!dk || s.day===dk) && (!spaceId || s.spaceId===spaceId)) sum += Math.max(0, now - s.start);
    }
    return sum;
  },
  consumedMinutes(dk, now){ return (this.finalizedMs(dk) + this.activeMs(dk, null, now)) / 60000; },
  remainingMinutes(now){ return Math.max(0, this.quota() - this.consumedMinutes(D.dateKey(now), now)); },
  todaySpaceMinutes(spId){
    const now = Date.now(), dk = D.dateKey(now);
    return (this.finalizedMs(dk, spId) + this.activeMs(dk, spId, now)) / 60000;
  },
  /* 任意一天某空间的递归分钟（历史日无活跃切片，直接按已终结统计） */
  daySpaceMinutes(dk, spId){
    const now = Date.now();
    const active = dk===D.dateKey(now) ? this.activeMs(dk, spId, now) : 0;
    return (this.finalizedMs(dk, spId) + active) / 60000;
  },
  totalSpaceMinutes(spId){
    let sum = 0;
    for(const s of S.sessions){ if(s.spaceId===spId && s.end!=null) sum += s.end - s.start; }
    return (sum + this.activeMs(null, spId, Date.now())) / 60000;
  },
  /* 某天某空间的已终结时段（含进行中的今天，end 用 now 虚拟展示） */
  sessionsOfDay(dk, spaceId){
    const now = Date.now();
    const out = S.sessions.filter(s=>s.day===dk && s.end!=null && (!spaceId || s.spaceId===spaceId))
      .map(s=>({start:s.start, end:s.end, active:false}));
    if(dk===D.dateKey(now)){
      for(const s of S.sessions){
        if(s.end==null && s.day===dk && (!spaceId || s.spaceId===spaceId)) out.push({start:s.start, end:now, active:true});
      }
    }
    return out.sort((a,b)=>a.start-b.start);
  },
  /* —— 核心：在 day 上把指定活跃切片终结在 endTs（额度截断全局生效，返回 T*=额度耗尽时刻） ——
     sweep：把该日全部区间（已终结+活跃裁剪到 horizon）按时间积分，找累积消耗达到额度 Qms 的最早时刻 */
  finalizeSessionsOnDay(day, ids, endTs, reason){
    const dayStart = this.dayStartMin(day);
    const dayEnd = dayStart + 86400000;
    const horizon = Math.min(endTs, dayEnd);
    const active = S.sessions.filter(s=>s.end==null && s.day===day);
    if(active.length===0) return Infinity;
    const Qms = this.quotaFor(day) * 60000;   // 用该日额度（可单独设定）
    const ints = [];
    for(const s of S.sessions){
      if(s.day!==day) continue;
      if(s.end!=null){
        if(s.end > s.start) ints.push({s:Math.max(s.start, dayStart), e:Math.min(s.end, dayEnd)});
      }else{
        const s0 = Math.max(s.start, dayStart), e0 = Math.min(horizon, dayEnd);
        if(e0 > s0) ints.push({s:s0, e:e0});
      }
    }
    const ev = [];
    for(const iv of ints){ ev.push([iv.s, 1], [iv.e, -1]); }
    ev.sort((a,b)=>a[0]-b[0]);
    let rate = 0, prev = dayStart, acc = 0, Tstar = Infinity;
    for(const [t, d] of ev){
      if(rate > 0 && t > prev){
        const need = Qms - acc;
        if(rate * (t - prev) >= need){ Tstar = prev + need / rate; break; }
        acc += rate * (t - prev);
      }
      prev = t; rate += d;
    }
    let changed = false;
    for(const a of active){
      const newEnd = Math.min(horizon, Tstar);
      if(newEnd <= Math.max(a.start, dayStart)){
        S.sessions = S.sessions.filter(s=>s.id!==a.id);   // 未消耗到额度，丢弃
        changed = true;
      }else if(ids.includes(a.id) || Tstar < horizon){
        a.end = newEnd;
        a.endedBy = (Tstar < horizon && newEnd < horizon) ? 'quota' : reason;
        changed = true;
      }
    }
    if(changed) saveSessions();
    return Tstar;
  },
  /* 手动会话跨午夜切片：把 day<today 的部分逐日终结，续到今日 00:00。
     旧切片在 finalize 后已封存（保留为历史记录），续片必须是新对象，否则会覆盖昨日记录。 */
  sliceManualAcrossDays(m, today){
    while(m && m.day < today){
      const prevDay = m.day;
      const dayEnd = this.dayStartMin(prevDay) + 86400000;
      const {id, spaceId, mode, note, scheduleId} = m;
      this.finalizeSessionsOnDay(prevDay, [id], dayEnd, 'midnight');
      const old = S.sessions.find(s=>s.id===id);
      if(!old || old.end !== dayEnd || old.endedBy !== 'midnight') return null;  // 被额度截断或未消耗 → 会话已结束
      const next = D.dateKey(dayEnd);
      m = {id:uid('rs_'), spaceId, mode, day:next, start:this.dayStartMin(next), end:null, endedBy:null, note, scheduleId};
      S.sessions.push(m);
      saveSessions();
    }
    return m;
  },
  /* 跨午夜（App开着时由 ticker 触发） */
  onDayChange(now){
    const today = D.dateKey(now);
    const m = this.activeManual();
    if(m) this.sliceManualAcrossDays(m, today);
  },
  /* —— 自流转槽位 —— */
  remainingMinutesOn(dk, now){ return Math.max(0, this.quotaFor(dk) - this.consumedMinutes(dk, now)); },
  /* 某槽位从 s 起的已覆盖终点（含进行中的活跃切片，按墙钟实时） */
  slotCoverage(dk, scheduleId, s){
    const now = Date.now();
    const segs = S.sessions.filter(x=>x.day===dk && x.scheduleId===scheduleId)
      .map(x=>({s:x.start, e:x.end!=null?x.end:now})).sort((a,b)=>a.s-b.s);
    let cov = s;
    for(const seg of segs){
      if(seg.e <= cov) continue;
      if(seg.s > cov + 1000) break;
      cov = seg.e;
    }
    return cov;
  },
  /* 某天槽位的惰性核算：把 [s, min(now,槽位结束)] 的未覆盖段按额度截断补上（进行中的剩余段由 ticker 接手） */
  reconcileDay(dk){
    const now = Date.now();
    if(this.remainingMinutesOn(dk, now) <= 0) return;   // 该日额度已尽
    const doc = dayDoc(dk);
    for(const slot of doc.autoSchedules||[]){
      const s = D.hhmmToTs(D.dkToTs(dk), slot.start);
      const e = D.hhmmToTs(D.dkToTs(dk), slot.end);
      const horizon = Math.min(now, e);
      if(horizon <= s) continue;                          // 还没开始
      const cov = this.slotCoverage(dk, slot.id, s);
      if(cov >= horizon) continue;                        // 已覆盖到现在
      const slice = {id:uid('rs_'), spaceId:slot.spaceId, mode:'auto', day:dk, start:cov, end:null, endedBy:null, note:slot.note||'', scheduleId:slot.id};
      S.sessions.push(slice);
      this.finalizeSessionsOnDay(dk, [slice.id], horizon, horizon>=e ? 'slotEnd' : 'reconcile');
    }
  },
  /* 到点自动开始/结束槽位（ticker 每秒调用） */
  slotTick(now){
    const dk = D.dateKey(now);
    const doc = dayDoc(dk);
    let changed = false;
    for(const slot of doc.autoSchedules||[]){
      const s = D.hhmmToTs(D.dkToTs(dk), slot.start);
      const e = D.hhmmToTs(D.dkToTs(dk), slot.end);
      const active = S.sessions.find(x=>x.end==null && x.scheduleId===slot.id);
      if(s <= now && now < e){
        if(!active){
          const sp = spaceById(slot.spaceId);
          if(!sp || sp.archived) continue;
          if(this.remainingMinutes(now) > 0){
            S.sessions.push({id:uid('rs_'), spaceId:slot.spaceId, mode:'auto', day:dk, start:now, end:null, endedBy:null, note:slot.note||'', scheduleId:slot.id});
            saveSessions(); changed = true;
            UI.toast('自流转：「'+sp.name+'」已开始');
          }
        }
      }else if(now >= e && active){
        this.finalizeSessionsOnDay(dk, [active.id], e, 'slotEnd');
        changed = true;
      }
    }
    if(changed) scheduleRender();
  },
  /* 启动/回到前台补算：心跳熔断 + 跨天切片 + 自流转惰性核算 */
  reconcile(){
    const now = Date.now();
    const today = D.dateKey(now);
    const hb = Store.get('heartbeat', {lastActiveAt: now});
    let m = this.activeManual();
    if(m){
      if(now - hb.lastActiveAt > CONFIG.HEARTBEAT_CUTOFF_MS){
        // 熔断：结束在最后活跃时刻（防忘关白耗额度）
        const t = hb.lastActiveAt;
        m = this.sliceManualAcrossDays(m, D.dateKey(t));
        if(m) this.finalizeSessionsOnDay(m.day, [m.id], t, 'heartbeat');
        UI.toast('检测到长时间未打开，递归会话已自动结束');
        scheduleRender();
      }else{
        this.sliceManualAcrossDays(m, today);
      }
    }
    // 过去各天的自流转活跃切片一律封存（最多到槽位结束）
    for(const a of [...S.sessions.filter(x=>x.end==null && x.day < today)]){
      if(a.mode!=='auto') continue;
      let endTs = this.dayStartMin(a.day) + 86400000;
      const doc = Store.loadDay(a.day);
      const slot = doc && doc.autoSchedules ? doc.autoSchedules.find(sl=>sl.id===a.scheduleId) : null;
      if(slot) endTs = Math.min(endTs, D.hhmmToTs(D.dkToTs(a.day), slot.end));
      this.finalizeSessionsOnDay(a.day, [a.id], endTs, 'slotEnd');
    }
    // 今日活跃切片在关闭期间的额度截断补查
    if(S.sessions.some(x=>x.end==null)) this.finalizeSessionsOnDay(today, [], now, 'reconcile');
    // 各天（含今日）槽位惰性核算
    for(const k of Store.allKeys()){
      if(!k.startsWith('day:')) continue;
      const dk = k.slice(4);
      if(dk > today) continue;
      const doc = Store.loadDay(dk);
      if(!doc || !doc.autoSchedules || doc.autoSchedules.length===0) continue;
      this.reconcileDay(dk);
    }
  },
  /* 每秒心跳：自流转槽位判定 + 额度耗尽判定 */
  tick(now){
    this.slotTick(now);
    const active = this.activeSlices();
    if(active.length===0) return;
    const today = D.dateKey(now);
    const Qms = this.quota() * 60000;
    const fin = this.finalizedMs(today);
    const ongoing = this.activeMs(today, null, now);
    if(fin + ongoing >= Qms){
      // 精确求耗尽时刻：rate=并行数（所有活跃切片已过起点，且耗尽时刻≥最晚起点）
      const starts = active.reduce((a, s)=>a + Math.max(s.start, this.dayStartMin(today)), 0);
      const Tstar = Math.min(now, (Qms - fin + starts) / active.length);
      this.finalizeSessionsOnDay(today, active.map(s=>s.id), Tstar, 'quota');
      UI.toast('今日节律递归时间已用完，递归已结束');
      scheduleRender();
    }
  },
  /* 手动开始递归（同时只允许一个；已有则先终结） */
  manualStart(spId){
    const now = Date.now();
    const today = D.dateKey(now);
    const sp = spaceById(spId);
    if(!sp || sp.archived){ UI.toast('空间不存在或已归档', 'err'); return false; }
    if(this.remainingMinutes(now) <= 0){ UI.toast('今日节律递归时间已用完，无法开始', 'err'); return false; }
    const m = this.activeManual();
    if(m){
      if(m.spaceId===spId){ this.manualStop(); return false; }
      this.finalizeSessionsOnDay(today, [m.id], now, 'manual');
      UI.toast('已切换到「'+sp.name+'」的递归');
    }
    S.sessions.push({id:uid('rs_'), spaceId:spId, mode:'manual', day:today, start:now, end:null, endedBy:null, note:'', scheduleId:null});
    saveSessions();
    scheduleRender();
    UI.toast('「'+sp.name+'」可能性递归已开始');
    return true;
  },
  manualStop(){
    const m = this.activeManual();
    if(!m) return false;
    this.finalizeSessionsOnDay(m.day, [m.id], Date.now(), 'manual');
    scheduleRender();
    UI.toast('递归已停止');
    return true;
  },
  /* —— 每秒定向刷新 —— */
  tickEl(el, now){
    const spId = el.dataset.space;
    const acts = this.activeForSpace(spId);
    if(acts.length===0) return;
    const live = el.querySelector('[data-rec-t]');
    if(live) setText(live, fmtDur(now - acts[0].start));
  },
  tickQuotaEl(el, now){
    const dk = D.dateKey(now);
    const Q = this.quota();
    const consumed = this.consumedMinutes(dk, now);
    const remain = Math.max(0, Q - consumed);
    const used = el.querySelector('[data-q-used]'); if(used) setText(used, fmtMin(consumed));
    const rem = el.querySelector('[data-q-remain]'); if(rem) setText(rem, fmtMin(remain));
    const bar = el.querySelector('[data-q-bar]');
    if(bar) bar.style.width = Math.min(100, consumed/Q*100).toFixed(1)+'%';
  },
  stats(){
    const now = Date.now(), dk = D.dateKey(now);
    return {
      remainingMinutes:this.remainingMinutes(now),
      consumedMinutes:this.consumedMinutes(dk, now),
      bySpace:S.spaces.map(sp=>({sp, min:this.todaySpaceMinutes(sp.id)}))
    };
  },
  currentActive(){ return this.activeManual(); }
};

/* ══════════════════════════════════════════════════════════════
   6.5 Alarms 闹钟（隐藏页面功能：仅页面打开期间响铃）
   ══════════════════════════════════════════════════════════════ */
const Alarms = {
  list(){ return S.alarms || []; },
  /* 每秒钟：到点且当天该分钟未响过 → 响铃 */
  tick(now){
    if(!S.alarms || S.alarms.length===0) return;
    const dk = D.dateKey(now);
    const hm = D.tsToHHMM(now);
    const wd = D.weekdayOf(dk);
    for(const a of S.alarms){
      if(!a.enabled || a.time !== hm) continue;
      if(a.repeat==='daily' || (a.weekdays||[]).includes(wd)){
        const key = a.id+'_'+dk+'_'+hm;
        if(S.alarmFired[key]) continue;
        S.alarmFired[key] = true;
        this.ring(a);
      }
    }
  },
  ring(a){
    UI.toast('⏰ 闹钟：'+(a.label||'闹钟')+' · '+a.time);
    this.beep();
  },
  /* 浏览器音频需要一次用户交互解锁 */
  unlockAudio(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      if(!this._ctx) this._ctx = new AC();
      if(this._ctx.state==='suspended') this._ctx.resume();
    }catch(e){}
  },
  beep(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      if(!this._ctx) this._ctx = new AC();
      const ctx = this._ctx;
      if(ctx.state==='suspended') return;
      const t0 = ctx.currentTime;
      for(let i=0;i<3;i++){
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sine'; osc.frequency.value = 880;
        g.gain.setValueAtTime(0.001, t0+i*0.35);
        g.gain.exponentialRampToValueAtTime(0.4, t0+i*0.35+0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t0+i*0.35+0.3);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(t0+i*0.35); osc.stop(t0+i*0.35+0.32);
      }
    }catch(e){}
  }
};

/* ══════════════════════════════════════════════════════════════
   7. Ticker 每秒心跳
   ══════════════════════════════════════════════════════════════ */
const bindings = [];
function collectBindings(){
  bindings.length = 0;
  document.querySelectorAll('[data-bind]').forEach(el=>bindings.push(el));
}
function setText(el, txt){ if(el.textContent !== txt) el.textContent = txt; }
function updateBinding(el, now){
  switch(el.dataset.bind){
    case 'clock': setText(el, D.tsToClock(now)); break;
    case 'bigclock': setText(el, D.tsToClock(now)); break;
    case 'bigdate': setText(el, D.fmtDateCN(now)); break;
    case 'todo': TodoLogic.tickEl && TodoLogic.tickEl(el, now); break;
    case 'urgent': TodoLogic.tickUrgentEl && TodoLogic.tickUrgentEl(el, now); break;
    case 'rec': Rhythm.tickEl && Rhythm.tickEl(el, now); break;          // 阶段4
    case 'quota': Rhythm.tickQuotaEl && Rhythm.tickQuotaEl(el, now); break; // 阶段4
    case 'quota-all': Rhythm.tickQuotaAllEl && Rhythm.tickQuotaAllEl(el, now); break; // 阶段4
  }
}
function tick(){
  const now = Date.now();
  TodoLogic.confirmTick(now);   // 先处理确认过期回退，再刷新绑定元素
  for(const el of bindings){ if(el.isConnected) updateBinding(el, now); }
  Rhythm.tick(now);
  Alarms.tick(now);
  checkRollover(now);
  if(now - S.lastHb > 30000){ S.lastHb = now; Store.set('heartbeat', {lastActiveAt: now}); }
}
function checkRollover(now){
  const dk = D.dateKey(now);
  if(S.lastDay && dk !== S.lastDay){
    S.lastDay = dk;
    S.confirmMap.clear();
    Rhythm.onDayChange(now);
    scheduleRender();
    UI.toast('新的一天开始了');
  }
}
/* 换日/开关页补算 */
function reconcileNow(){
  S.lastDay = D.dateKey(Date.now());
  Rhythm.reconcile();
}

  'slot-save'(btn){
    const dk = D.dateKey(Date.now());
    const doc = dayDoc(dk);
    const id = btn?.dataset?.id || null;
    const spaceId = document.getElementById('sl-space').value || null;
    if(!spaceId){ UI.toast('请选择可能性空间', 'err'); return; }
    const start = document.getElementById('sl-start').value;
    const end = document.getElementById('sl-end').value;
    if(!start || !end){ UI.toast('请填写开始与结束时间', 'err'); return; }
    if(end <= start){ UI.toast('结束时间需晚于开始时间（同一自然日内）', 'err'); return; }
    const note = document.getElementById('sl-note').value.trim();
    const base = {spaceId, start, end, note};
    let slot;
    if(id){
      slot = (doc.autoSchedules||[]).find(x=>x.id===id);
      if(!slot) return;
      Object.assign(slot, base);
    }else{
      slot = {id:uid('as_'), createdAt:Date.now(), sourceId:null, ...base};
      doc.autoSchedules = doc.autoSchedules || [];
      doc.autoSchedules.push(slot);
      /* 重复副本 */
      const copies = [];
      if(S.form && S.form.slotRep==='days'){
        for(const n of S.form.slotDays) copies.push(D.dateKey(D.addDaysTs(Date.now(), n)));
      }else if(S.form && S.form.slotRep==='weekdays'){
        for(let n=1;n<=28;n++){
          const dk2 = D.dateKey(D.addDaysTs(Date.now(), n));
          if(S.form.slotWeekdays.has(D.weekdayOf(dk2))) copies.push(dk2);
        }
      }
      for(const dk2 of copies){
        const dd = dayDoc(dk2);
        dd.autoSchedules = dd.autoSchedules || [];
        dd.autoSchedules.push({id:uid('as_'), createdAt:Date.now(), sourceId:slot.id, ...base});
        saveDay(dk2);
      }
      if(copies.length) UI.toast('已复制到 '+copies.length+' 天');
    }
    /* 重叠提示（今天） */
    const s0 = D.hhmmToTs(D.dkToTs(dk), start), e0 = D.hhmmToTs(D.dkToTs(dk), end);
    for(const other of doc.autoSchedules){
      if(other.id===slot.id) continue;
      const a = D.hhmmToTs(D.dkToTs(dk), other.start), b = D.hhmmToTs(D.dkToTs(dk), other.end);
      if(s0 < b && a < e0){ UI.toast('与「'+other.start+'~'+other.end+'」日程重叠：重叠时段将双倍消耗额度'); break; }
    }
    saveDay(dk);
    Rhythm.reconcileDay(dk);   // 立即补算今天已过去的时段
    UI.closeModal();
    scheduleRender();
    UI.toast('日程已保存');
  },

    UI.confirmDialog('删除日程', '删除 '+slot.start+'~'+slot.end+' 的日程？已消耗的时间记录会保留。', true, ()=>{

function handleImportFile(file){

/* ══════════════════════════════════════════════════════════════
   8.5 待办视图辅助（卡片渲染 / 表单弹窗）
   ══════════════════════════════════════════════════════════════ */
function todoCardHtml(t, now, live){
  if(live===undefined) live = true;
  const st = todoStatus(t, now);
  let cls = st==='confirming' ? 't-confirm' : st==='done' ? 't-done' : 't-'+TodoLogic.color(t, now);
  /* 未来日：截止还没到来，不判超时（保持蓝色） */
  if(!live && st==='pending' && D.dateKey(now) > D.dateKey(Date.now())) cls = 't-blue';
  const side = st==='confirming' ? '<span class="q">?</span>' : st==='done' ? '<span class="ok">✓</span>' : '';
  const due = TodoLogic.dueAt(t, now);
  let cd;
  if(st==='done'){
    const nx = TodoLogic.nextDueAt(t, now);
    cd = nx ? '已完成 · 下次 '+TodoLogic.fmtNextShort(nx, now) : '已完成';
  }else if(due==null){
    cd = '无期限';
  }else if(!live && due <= now){
    /* 历史日：显示当日截止时刻而非"已超时X小时" */
    cd = '当日 '+D.tsToHHMM(due)+' 截止';
  }else{
    cd = fmtRemain(due - now);
  }
  let meta = '';
  if(t.type==='habit') meta += '<span class="badge">习惯</span>';
  if(t.type==='memo') meta += '<span class="badge">备忘</span>';
  meta += '<span class="badge">'+TodoLogic.repeatLabel(t)+'</span>';
  if(t.spaceId){
    const sp = spaceById(t.spaceId);
    const c = sp ? sp.color : '#8A93A3';
    meta += '<span class="badge badge--space" style="--space-color:'+c+';--space-soft:'+c+'22;--space-line:'+c+'55">来自'+esc(spaceNameOf(t.spaceId))+'</span>';
  }
  return '<div class="todo-card '+cls+'"'+(live?' data-bind="todo"':' data-day="'+D.dateKey(now)+'"')+' data-id="'+t.id+'" data-action="tap-todo">'+
    '<div class="todo-main">'+
      '<div class="todo-title">'+esc(t.title)+'</div>'+
      '<div class="todo-sub">'+meta+'</div>'+
      (t.note ? '<div class="todo-note">'+esc(t.note)+'</div>' : '')+
      '<div class="todo-sub"><span class="todo-cd" data-cd>'+cd+'</span></div>'+
    '</div>'+
    '<div class="todo-side">'+side+'</div>'+
    '<button class="icon-btn todo-edit" data-action="todo-form" data-id="'+t.id+'" aria-label="编辑">✎</button>'+
  '</div>';
}
function segChips(group, vals, labels, cur){
  return vals.map((v,i)=>'<button class="chip'+(String(v)===String(cur)?' on':'')+'" data-action="seg" data-group="'+group+'" data-val="'+v+'">'+labels[i]+'</button>').join('');
}

function imgsHtml(imgIds, editable){

  }).join('')+'</div>';

/* 图片压缩：最长边 ≤maxSize（默认1000），JPEG 质量 0.75 → dataURL */
function compressImage(file, cb, maxSize){
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = ()=>{
    const MAX = maxSize || 1000;
    const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * scale));
    const h = Math.max(1, Math.round(img.naturalHeight * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    cb(canvas.toDataURL('image/jpeg', 0.75));
  };
  img.onerror = ()=>{ URL.revokeObjectURL(url); UI.toast('图片读取失败', 'err'); };
  img.src = url;
}
/* 图片选择回调：压缩 → 存入 S.form.images → 刷新弹窗内网格与计数 */
function handleImageFile(file){
  if(!file || !file.type || !file.type.startsWith('image/')){ UI.toast('请选择图片文件', 'err'); return; }
  UI.toast('压缩处理中…');
  compressImage(file, dataURL=>{
    const id = uid('img_');
    if(!Store.saveImage(id, dataURL)){ UI.toast('存储空间不足，图片保存失败', 'err'); return; }
    S.form.images = S.form.images || [];
    S.form.images.push(id);
    refreshImgUI();
    UI.toast('图片已保存');
  });
}
function refreshImgUI(){
  document.querySelectorAll('[data-img-grid]').forEach(g=>{ g.innerHTML = imgsHtml(S.form.images, true); });
  document.querySelectorAll('[data-img-count]').forEach(el=>{ el.textContent = S.form.images.length+'/'+CONFIG.MAX_IMG_PER_RECORD; });
}
/* 无引用图片回收（启动时执行一次） */
function gcImages(){
  const refs = new Set();
  for(const k of Store.allKeys()){
    if(k.startsWith('day:')){
      const doc = Store.loadDay(k.slice(4));
      if(!doc) continue;
      for(const spId in (doc.spaceRecords||{})){
        const v = doc.spaceRecords[spId];
        if(Array.isArray(v)){ for(const r of v){ (r.images||[]).forEach(id=>refs.add(id)); } }
        else (v.images||[]).forEach(id=>refs.add(id));   // 旧版单条兼容
      }
      (doc.rhythmEntries||[]).forEach(en=>(en.images||[]).forEach(id=>refs.add(id)));
    }
  }
  for(const n of S.catnotes){ (n.images||[]).forEach(id=>refs.add(id)); }
  if(S.settings.bgImageId) refs.add(S.settings.bgImageId);   // 背景图
  let removed = 0;
  for(const k of Store.allKeys()){
    if(k.startsWith('img:') && !refs.has(k.slice(4))){ Store.del(k); removed++; }
  }
  return removed;
}
/* 是否属于「当日待办」（首页收纳卡口径，now 为当天视角）：
   完成态=已记到该天；未完成=当天到期/已超时/无期限 */
function isTodayTodo(t, now){
  const dk = D.dateKey(now);
  if(todoStatus(t, now)==='done') return true;
  const due = TodoLogic.dueAt(t, now);
  if(due == null) return true;
  return due <= D.dkToTs(dk) + 86400000;
}
/* 该空间做过可能性确定的天数 */
function iterDays(spId){
  let n = 0;
  for(const k of Store.allKeys()){
    if(k.startsWith('day:')){
      const doc = Store.loadDay(k.slice(4));
      const v = doc && doc.spaceRecords ? doc.spaceRecords[spId] : null;
      if(v != null && (Array.isArray(v) ? v.length>0 : true)) n++;
    }
  }
  return n;
}

/* 空间详情 · 待办页 */
function spTodosHtml(sp){
  const now = Date.now();
  const list = S.todos.filter(x=>!x.archived && x.spaceId===sp.id);
  const pending = [], done = [];
  for(const t of list){ (todoStatus(t, now)==='done' ? done : pending).push(t); }
  pending.sort((a,b)=>{
    const da = TodoLogic.dueAt(a, now), db = TodoLogic.dueAt(b, now);
    if(da==null) return 1; if(db==null) return -1; return da-db;
  });
  done.sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));
  let h = '<button class="btn btn--primary btn--block" data-action="todo-form" data-space="'+sp.id+'">＋ 在此空间新建待办</button>';
  h += '<div class="sec-sub">进行中<span class="cnt">'+pending.length+'</span></div>';
  if(pending.length===0) h += '<div class="empty"><span class="empty-ico">☀</span>该空间没有进行中的待办</div>';
  else for(const t of pending) h += todoCardHtml(t, now);
  if(done.length>0){
    h += '<div class="sec-sub">已完成<span class="cnt">'+done.length+'</span></div>';
    for(const t of done) h += todoCardHtml(t, now);
  }
  return h;
}

/* 递归时间带上的一个色段（active=进行中，宽度按墙钟实时） */
function bandHtml(s, active){
  const dayStart = D.dkToTs(s.day);
  const startMin = Math.max(0, (s.start - dayStart) / 60000);
  /* 注意单位：ms 差要先除以 60000 转分钟再钳制（曾把 ms 与分钟混用，
     导致进行中色段永远只有最小宽度，时间带看起来断断续续） */
  const endMin = Math.min(1440, ((active ? Date.now() : s.end) - dayStart) / 60000);
  const left = startMin / 1440 * 100;
  const w = Math.max(0.6, (endMin - startMin) / 1440 * 100);
  const sp = spaceById(s.spaceId);
  const color = sp ? sp.color : '#8A93A3';
  const name = sp ? sp.name : '已删除空间';
  const modeTxt = s.mode==='auto' ? '自流转' : '手动递归';
  const endTxt = active ? '进行中' : D.tsToHHMM(s.end);
  return '<div class="rh-band'+(active?' active':'')+'" style="left:'+left.toFixed(2)+'%;width:'+w.toFixed(2)+'%;background:'+color+'" title="'+esc(name)+' · '+modeTxt+' · '+D.tsToHHMM(s.start)+' ~ '+endTxt+'"></div>';
}

    h += '<div class="hint" style="font-size:12px;color:var(--text-2);margin-top:8px">'+
      (editable ? '课程表式：到点自动用指定空间消耗节律递归时间' : '这一天没有设置日程')+'</div>';
  }else{
    h += '<div style="margin-top:12px">';
    for(const slot of slots){
      const sp = spaceById(slot.spaceId);
      const s = D.hhmmToTs(D.dkToTs(dk), slot.start);
      const e = D.hhmmToTs(D.dkToTs(dk), slot.end);
      const cov = Rhythm.slotCoverage(dk, slot.id, s);
      let badge, badgeCls;
      if(S.sessions.some(x=>x.end==null && x.scheduleId===slot.id)){ badge='进行中'; badgeCls='sb-active'; }
      else if(now < s){ badge='未开始'; badgeCls='sb-upcoming'; }
      else if(now >= e){ badge = cov >= e-1000 ? '已结束' : (cov > s ? '部分未生效' : '未生效'); badgeCls = cov >= e-1000 ? 'sb-done' : 'sb-missed'; }
      else { badge='额度不足'; badgeCls='sb-missed'; }
      h += '<div class="card slot-item">'+
             '<span class="dot" style="background:'+(sp?sp.color:'#8A93A3')+'"></span>'+
             '<div class="slot-info">'+
               '<div class="slot-time num">'+esc(slot.start)+' ~ '+esc(slot.end)+'</div>'+
               '<div style="font-size:12px;color:var(--text-2)">'+esc(sp?sp.name:'已删除空间')+(slot.note?' · '+esc(slot.note):'')+'</div>'+
             '</div>'+
             '<span class="slot-badge '+badgeCls+'">'+badge+'</span>'+
             (editable?'<button class="icon-btn" data-action="slot-form" data-id="'+slot.id+'" style="width:26px;height:26px">✎</button>':'')+
           '</div>';
    }
    h += '</div>';
  }
  return h;
}

  /* —— 事务待办 —— */
  todos(){

function bgSrc(){
  const id = S.settings.bgImageId;
  return id ? (Store.getImage(id) || null) : null;
}
/* 把背景图/透明度/模糊度应用到背景层 */
function applyBg(){
  const el = document.getElementById('bg-layer');
  if(!el) return;
  const src = bgSrc();
  if(src){
    el.style.backgroundImage = 'url("'+src+'")';
    el.style.opacity = String((S.settings.bgOpacity ?? 45) / 100);
    el.style.filter = 'blur('+(S.settings.bgBlur ?? 0)+'px)';
    el.classList.remove('hidden');
  }else{
    el.classList.add('hidden');
  }
}
/* 覆盖模式：背景图浮上来覆盖全屏，边缘小字显示日期时间/最优先/正在递归 */
function enterOverlay(){
  const src = bgSrc();
  if(!src || S.bgOverlay) return;
  S.bgOverlay = true;
  const ov = document.getElementById('bg-overlay');
  ov.style.backgroundImage = 'url("'+src+'")';
  ov.style.filter = 'none';
  const now = Date.now();
  const elT = document.getElementById('boi-todo');
  let urgent = null;
  for(const t of S.todos){
    if(t.archived || todoStatus(t, now)==='done') continue;
    const due = TodoLogic.dueAt(t, now);
    if(due==null) continue;
    if(!urgent || due < TodoLogic.dueAt(urgent, now)) urgent = t;
  }
  if(urgent){
    elT.dataset.id = urgent.id;
    elT.innerHTML = '最优先：<b>'+esc(urgent.title)+'</b> · <span data-cd></span>';
    elT.style.display = '';
  }else{
    elT.innerHTML = '';
    elT.style.display = 'none';
  }
  const elR = document.getElementById('boi-rec');
  const act = Rhythm.activeManual();
  if(act){
    elR.dataset.space = act.spaceId;
    elR.innerHTML = '正在递归：'+esc(spaceNameOf(act.spaceId))+' · <span data-rec-t></span>';
    elR.style.display = '';
  }else{
    elR.innerHTML = '';
    elR.style.display = 'none';
  }
  ov.classList.remove('hidden');
  UI.toast('覆盖模式 · 双指放大或左上角按钮退出');
}
function exitOverlay(){
  S.bgOverlay = false;
  const ov = document.getElementById('bg-overlay');
  if(ov) ov.classList.add('hidden');
}
/* 背景图选择回调（压缩到1600px保存） */
function handleBgImageFile(file){
  if(!file || !file.type || !file.type.startsWith('image/')){ UI.toast('请选择图片文件', 'err'); return; }
  UI.toast('压缩处理中…');
  compressImage(file, dataURL=>{
    if(S.settings.bgImageId) Store.del('img:'+S.settings.bgImageId);
    if(!Store.saveImage('img_bg', dataURL)){ UI.toast('存储空间不足', 'err'); return; }
    S.settings.bgImageId = 'img_bg';
    if(S.settings.bgOpacity==null) S.settings.bgOpacity = 45;
    if(S.settings.bgBlur==null) S.settings.bgBlur = 0;
    saveSettings();
    applyBg();
    scheduleRender();
    UI.toast('背景已设置');
  }, 1600);
}
/* 双指手势：收缩→进入覆盖，放大→退出（无背景图时不生效） */
function setupPinch(el){
  let start = 0;
  el.addEventListener('touchstart', e=>{
    if(S.view!=='home' || !bgSrc()) return;
    if(e.touches.length===2){
      start = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    }
  }, {passive:true});
  el.addEventListener('touchmove', e=>{
    if(!start || e.touches.length!==2) return;
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if(d/start < 0.7){ start = 0; if(!S.bgOverlay) enterOverlay(); }
    else if(d/start > 1.45){ start = 0; if(S.bgOverlay) exitOverlay(); }
  }, {passive:true});
  el.addEventListener('touchend', ()=>{ start = 0; }, {passive:true});
}
/* 当前浏览器名（用于设置页展示） */
function browserName(){
  try{
    const ua = navigator.userAgent || '';
    if(ua.includes('Edg')) return 'Edge';
    if(ua.includes('Chrome')) return 'Chrome';
    if(ua.includes('Firefox')) return 'Firefox';
    if(ua.includes('Safari')) return 'Safari';
    return '浏览器';
  }catch(e){ return '未知'; }
}

/* 渲染入口 */
const VIEW_TITLES = {home:'首页', todos:'事务待办', spaces:'可能性空间', rhythm:'节律表', settings:'设置', alarm:'闹钟', space:''};
function renderView(){
  const root = document.getElementById('view-root');
  const ae = document.activeElement;
  if(ae && root.contains(ae)){
    // 只有正在输入的输入框才需要保护焦点（重渲染会打断输入）。
    // 按钮被点击后保持焦点会无限推迟重渲染，表现为"点空白处才变化"——
    // 非输入元素先失焦再重建。
    const tag = ae.tagName;
    if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT'){ scheduleRender(); return; }
    try{ ae.blur(); }catch(e){}
  }
  let html;
  if(S.view==='space'){
    const sp = spaceById(S.spaceId);
    html = Views.spaceDetail();
    document.getElementById('hdr-title').textContent = sp ? sp.name : '空间';
  }else{
    html = Views[S.view] ? Views[S.view]() : '';
    document.getElementById('hdr-title').textContent = VIEW_TITLES[S.view]||'';
  }
  root.innerHTML = html;
  document.getElementById('back-btn').classList.toggle('hidden', !(S.view==='settings' || S.view==='space' || S.view==='alarm'));
  const bgBtn = document.getElementById('bg-btn');
  if(bgBtn) bgBtn.classList.toggle('hidden', !(S.view==='home' && bgSrc() && !S.bgOverlay));
  document.querySelectorAll('#tabbar .tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===S.view));
  collectBindings();
}

/* 从存储重读全部实体（导入/多标签页同步用），含旧数据迁移 */
function refreshFromStorage(){
  S.meta = Store.get('meta', {});
  S.settings = {...CONFIG.DEFAULT_SETTINGS, ...Store.get('settings', {})};
  S.spaces = Store.get('spaces', []);
  S.todos = Store.get('todos', []);
  S.catnotes = Store.get('catnotes', []);
  S.sessions = Store.get('sessions', []);
  S.alarms = Store.get('alarms', []);
  S.alarmFired = {};
  S.days.clear();
  S.confirmMap.clear();
  let todosChanged = false;
  for(const t of S.todos){
    /* 迁移1：旧版单条完成记录 lastCompletedKey → 按天集合 doneKeys */
    if(!Array.isArray(t.doneKeys)){
      t.doneKeys = t.lastCompletedKey != null ? [t.lastCompletedKey] : [];
      todosChanged = true;
    }
    /* 迁移2：变红默认阈值 120→30 分钟（仅迁移从未自定义过的卡片） */
    if(t.thresholdRedMin===120 && t.thresholdYellowMin===240){
      t.thresholdRedMin = 30;
      todosChanged = true;
    }
  }
  if(todosChanged) Store.set('todos', S.todos);
}

/* ══════════════════════════════════════════════════════════════
   10. Boot 启动
   ══════════════════════════════════════════════════════════════ */
function boot(){
  const p = Store.init();
  if(Store.ready) bootMain();        // 兼容模式（localStorage）同步启动
  else p.then(bootMain);             // 大容量模式（IndexedDB）初始化完成后启动
}
function bootMain(){
  S.memoryMode = !Store.ok;
  refreshFromStorage();
  if(!S.meta.createdAt){ S.meta = {schemaVersion:CONFIG.SCHEMA, appVersion:CONFIG.VERSION, createdAt:Date.now(), lastSavedAt:Date.now()}; Store.set('meta', S.meta); }
  S.lastDay = D.dateKey(Date.now());
  S.lastHb = Date.now();
  Store.set('heartbeat', {lastActiveAt:S.lastHb});
  gcImages();               // 回收无引用图片
  reconcileNow();
  applyBg();                // 应用自定义背景
  renderView();
  setInterval(tick, 1000);

  /* 事件绑定 */
  const viewRoot = document.getElementById('view-root');
  /* 双指手势：首页收缩→背景覆盖，放大→退出 */
  setupPinch(viewRoot);
  setupPinch(document.getElementById('bg-overlay'));
  viewRoot.addEventListener('click', e=>{
    const t = e.target.closest('[data-action]');
    if(!t) return;
    if(t.dataset.action==='open-space'){ goSpace(t.dataset.id); return; }
    Actions[t.dataset.action] && Actions[t.dataset.action](t, e);
  });
  viewRoot.addEventListener('input', e=>{
    const t = e.target.closest('[data-oninput]');
    if(t && Actions[t.dataset.oninput]) Actions[t.dataset.oninput](t, e);
  });
  viewRoot.addEventListener('change', e=>{
    const t = e.target.closest('[data-onchange]');
    if(t && Actions[t.dataset.onchange]) Actions[t.dataset.onchange](t, e);
  });
  /* 顶栏按钮（返回/设置/背景覆盖入口） */
  document.getElementById('app-header').addEventListener('click', e=>{
    const t = e.target.closest('[data-action]');
    if(t && Actions[t.dataset.action]) Actions[t.dataset.action](t, e);
  });
  /* 覆盖层的退出按钮 */
  document.getElementById('bg-overlay').addEventListener('click', e=>{
    const t = e.target.closest('[data-action]');
    if(t && Actions[t.dataset.action]) Actions[t.dataset.action](t, e);
  });
  document.getElementById('tabbar').addEventListener('click', e=>{
    const t = e.target.closest('[data-tab]');
    if(t && t.dataset.tab !== S.view){ UI.closeModal(); goView(t.dataset.tab); }
  });
  const modalRoot = document.getElementById('modal-root');
  modalRoot.addEventListener('click', e=>{
    const t = e.target.closest('[data-action]');
    if(!t) return;
    if(t.dataset.action==='modal-close'){ UI.closeModal(); return; }
    if(Actions[t.dataset.action]) Actions[t.dataset.action](t, e);
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape') UI.closeModal();
  });
  document.getElementById('file-input').addEventListener('change', e=>{
    const cb = S.pendingFileCb; S.pendingFileCb = null;
    if(cb && e.target.files && e.target.files[0]) cb(e.target.files[0]);
  });
  /* 首次交互解锁音频（闹钟提示音需要） */
  document.addEventListener('pointerdown', function unlockAudio(){ Alarms.unlockAudio(); }, {once:true});
  window.addEventListener('beforeunload', ()=>{ Store.set('heartbeat', {lastActiveAt:Date.now()}); });
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden) return;
    const back = ()=>{
      Store.set('heartbeat', {lastActiveAt:Date.now()});
      reconcileNow();
      scheduleRender();
    };
    if(Store.mode==='idb') Store.reload().then(back);   // 大容量模式：回到前台先重读新仓库
    else back();
  });
  /* 多标签页同步：大容量模式靠 BroadcastChannel + localStorage 哨兵键，兼容模式靠 storage 事件 */
  if(Store.bc) Store.bc.onmessage = ()=>{ Store.reload().then(()=>{ refreshFromStorage(); scheduleRender(); UI.toast('检测到数据在另一个标签页被修改，已同步'); }); };
  window.addEventListener('storage', e=>{
    if(e.key && e.key.startsWith(CONFIG.PREFIX)){
      const sync = ()=>{
        refreshFromStorage();
        scheduleRender();
        UI.toast('检测到数据在另一个标签页被修改，已同步');
      };
      if(Store.mode==='idb') Store.reload().then(sync);
      else sync();
    }
  });
  UI.toast('欢迎来到'+CONFIG.APP_NAME);
}

      const t1 = D.hhmmToTs(D.dkToTs(today),'08:00'), t2 = D.hhmmToTs(D.dkToTs(today),'09:30');
      if(t2 <= now) S.sessions.push({id:uid('rs_'), spaceId:sp1.id, mode:'manual', day:today, start:t1, end:t2, endedBy:'manual', note:'', scheduleId:null});
      const t3 = D.hhmmToTs(D.dkToTs(today),'19:00'), t4 = D.hhmmToTs(D.dkToTs(today),'20:00');
      if(t4 <= now) S.sessions.push({id:uid('rs_'), spaceId:sp2.id, mode:'manual', day:today, start:t3, end:t4, endedBy:'manual', note:'', scheduleId:null});
      saveSessions();
    }
    dayDoc(today).rhythmEntries.push({id:uid('re_'), at:'08:30', text:'晨间散步时想到的新点子', images:[], createdAt:now});
    saveDay(today); saveDay(yest);
    saveSpaces(); saveTodos(); saveCatnotes();
    scheduleRender();
  }
};
window.PS = Debug;  // 控制台可输入 PS.debug() / PS.seed()

boot();
</script>

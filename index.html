    S.settings.herShake = Object.assign({}, S.settings.herShake || {}, {asked: now});
    saveSettings();
    return Her.say('shakeAsk', Her.ctx(now), {key:'her-shake-ask', sub:'她', go:()=>Shake.request()});
  },
  request(cb){
    let done = false;
    const once = r => {
      if(done) return; done = true;
      S.settings.herShake = {on: r === 'granted', asked: Date.now()};
      saveSettings();
      if(r === 'granted'){
        this.attach();
        if(typeof Her !== 'undefined') Her.reply(Her.voice('shakeOk', Her.ctx()), {key:'her-shake-ok'});
      }
      if(cb) cb(r);
    };
    try{
      const p = DeviceMotionEvent.requestPermission();
      if(p && p.then) p.then(once, ()=>once('error'));
      else if(typeof p === 'string') once(p);
      else once('error');
    }catch(e){ once('error'); }
  },
  attach(){
    if(this._on || !this.supported()) return false;
    try{
      window.addEventListener('devicemotion', e=>this._motion(e), {passive:true});
      this._on = true;
      return true;
    }catch(e){ return false; }
  },
  _motion(e){
    const a = e && (e.accelerationIncludingGravity || e.acceleration);
    if(!a) return false;
    const mag = Math.sqrt((a.x||0)*(a.x||0) + (a.y||0)*(a.y||0) + (a.z||0)*(a.z||0));
    if(mag < CONFIG.SENSE.SHAKE_TH) return false;
    const now = Date.now();
    if(now - this._last < CONFIG.SENSE.SHAKE_GAP) return false;   // 一次摇动只记一下
    this._last = now;
    if(now - this._t > CONFIG.SENSE.SHAKE_RESET) this._n = 0;
    this._t = now;
    this._n++;
    return this.react(this._n, now);
  },
  /* 摇的反应：摇几下她开始喊晕，再摇她真的生气 */
  react(n, now){
    now = now || Date.now();
    if(n < CONFIG.SENSE.SHAKE_N) return false;
    if(n >= CONFIG.SENSE.SHAKE_ANGRY){
      this._n = 0;
      Emo.set('angry', '你摇了手机', now);
      if(typeof Director !== 'undefined') Director.act('act-shake');
      buzz(160); if(typeof Snd !== 'undefined') Snd.play('shake');
      if(typeof Mascot !== 'undefined') Mascot.react('shakeAngry', 2600);
      return true;
    }
    if(n === CONFIG.SENSE.SHAKE_N){
      Emo.set('worried', '你摇了手机', now);
      if(typeof Director !== 'undefined') Director.act('act-shake');
      if(typeof Mascot !== 'undefined') Mascot.react('shakeDizzy', 2600);
      return true;
    }
    return false;
  }
};

/* ── 忙碌页面右下角的她 QCorner（v1.6a）：Q版小人一直在，你做什么她都陪着 ── */
const QCorner = {
  _built:false, _wired:false, _pts:new Map(), _drag:null, _pinch:null, _t0:0, _moved:0, _tapFired:false, _baseSrc:null, _dragImgOn:false,
  el(){ try{ return document.getElementById('q-corner'); }catch(e){ return null; } },
  /* 换页时同步：忙碌页出现；纯净页与她的页面不出现（那儿本来就是她的地方，不重复） */
  sync(){
    const el = this.el();
    if(!el || !el.classList) return false;
    if(!this._built){
      el.innerHTML = HerBody.imgHtml('q', 'base', {small:true});
      this._built = true;
      this.applyPos();
      this._wire();
    }
    const busy = (S.view !== 'home' && S.view !== 'mspace' && !(typeof Storyline !== 'undefined' && Storyline.on())) && CONFIG.BODY.HER_PAGES.indexOf(S.view) < 0;
    el.classList.toggle('on', busy);
    if(busy) paintHer();
    else {
      /* v1.7.13：离开忙碌页 → 头顶那个小气泡一起收掉（别让它悬在别的页面上） */
      const qb = document.getElementById('q-bubble');
      if(qb){ qb.innerHTML = ''; qb.classList.add('hidden'); }
    }
    return busy;
  },
  /* 摆位与大小（v1.7.1）：你把她拖到哪、捏多大都记在设置上（qPos/qScale，零迁移） */
  applyPos(){
    const el = this.el();
    if(!el || !el.style) return;
    const p = S.settings.qPos, s = clamp(S.settings.qScale || 1, 0.6, 2.2);
    el.style.left = ''; el.style.right = ''; el.style.top = ''; el.style.bottom = '';
    if(p && p.x != null){
      const w = window.innerWidth || 390, h = window.innerHeight || 844;
      el.style.left = clamp(p.x, -40, w - 30) + 'px';
      el.style.top = clamp(p.y, 0, h - 30) + 'px';
    }else{
      el.style.right = '9px';
      el.style.bottom = 'calc(13px + env(safe-area-inset-bottom))';
    }
    el.style.setProperty('--qs', s);
  },
  /* 她自己的小手接管（v1.7.1）：忙碌页手势引擎本来就休息，这里单指拖动、双指捏合、轻点有反应 */
  _wire(){
    if(this._wired) return;
    const el = this.el();
    if(!el || !el.addEventListener) return;
    this._wired = true;
    el.addEventListener('pointerdown', e=>{
      try{ e.preventDefault(); }catch(err){}
      try{ if(el.setPointerCapture) el.setPointerCapture(e.pointerId); }catch(err){}
      this._pts.set(e.pointerId, [e.clientX, e.clientY]);
      if(this._pts.size === 1){
        this._t0 = Date.now(); this._moved = 0; this._tapFired = false;
        /* ⚠️ v1.7.10：起手就换算到**盒子**坐标（applyPos 写进 left/top 的那个值）：
           全程只在盒子坐标里算，一次 rect 都不再量——① 看得见的那块是盒子按底边中点放大出来的，
           两个坐标系混用就是「捏大之后再拖会跳、会跑偏」的根源（她报的）；
           ② rect 会把当时挂着的动作（比如她刚被你戳了一下在扭）的 rotate 一起量进去 */
        const bw = el.offsetWidth || 72, bh = el.offsetHeight || 104;
        const s  = clamp(S.settings.qScale || 1, .6, 2.2);
        const r  = el.getBoundingClientRect();
        this._drag = {id:e.pointerId, x0:e.clientX, y0:e.clientY, bw, bh, s,
          bx0: (typeof el.offsetLeft === 'number') ? el.offsetLeft : (r.left + (bw * s - bw) / 2),
          by0: (typeof el.offsetTop  === 'number') ? el.offsetTop  : (r.top  + (bh * s - bh))};
      }else if(this._pts.size === 2){
        const arr = [...this._pts.values()];
        this._endDrag();                     // 第二指落下 → 拖动收尾（位置照存），转捏合
        this._pinch = {d0: Math.hypot(arr[0][0]-arr[1][0], arr[0][1]-arr[1][1]) || 1, s0: S.settings.qScale || 1};
      }
    });
    el.addEventListener('pointermove', e=>{
      if(!this._pts.has(e.pointerId)) return;
      this._pts.set(e.pointerId, [e.clientX, e.clientY]);
      const arr = [...this._pts.values()];
      if(arr.length === 1 && this._drag && this._drag.id === e.pointerId) this._moveDrag(e.clientX, e.clientY);
      else if(arr.length >= 2 && this._pinch) this._movePinch(Math.hypot(arr[0][0]-arr[1][0], arr[0][1]-arr[1][1]));
    });
    const end = e=>{
      if(!this._pts.has(e.pointerId)) return;
      this._pts.delete(e.pointerId);
      if(this._drag && this._drag.id === e.pointerId) this._endDrag();
      if(this._pinch && this._pts.size < 2) this._endPinch();
      if(this._pts.size === 0 && !this._tapFired && Date.now() - this._t0 < 320 && this._moved < 8 && typeof Director !== 'undefined'){
        this._tapFired = true;
        Director.act('act-jiggle');          // 轻点一下 → 她扭一扭回应你
      }
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  },
  /* 拖动中：小人跟着手走；动起来就换「拖动图」（acts.pull 传过用图，没有就加个使劲儿姿势） */
  _moveDrag(x, y){
    const d = this._drag, el = this.el();
    if(!d || !el || !el.style) return;
    const dx = x - d.x0, dy = y - d.y0;
    this._moved = Math.max(this._moved, Math.hypot(dx, dy));
    if(this._moved >= 8){
      /* 你上手拖她 → 正在演的那套帧（事件反应）让位给「被拖图」，
         不然每帧都在跟她抢同一个 img.src（表现就是拖起来一闪一闪的） */
      if(typeof Seq !== 'undefined' && Seq.playing()) Seq.stop(true);
      el.classList.add('q-moving', 'q-drag');
      this._dragImg(true);
    }
    const w = window.innerWidth || 390, h = window.innerHeight || 844;
    const dW = d.bw * d.s, dH = d.bh * d.s;                        // 看得见的那块（含缩放）
    /* 全程盒子坐标：见得着的那块 = 盒子按底边中点放大出来的（横向左右各胖一半、纵向全长在头顶上），
       所以「盒子能挪到哪儿」= 可视范围每边各让出放大长出来的那截——
       至少留 ~30px 在屏幕里，手感跟原来那套一模一样 */
    const padX = (dW - d.bw) / 2, padY = dH - d.bh;
    el.style.left = Math.round(clamp(d.bx0 + dx, 30 - dW + padX, w - 30 + padX)) + 'px';
    el.style.top  = Math.round(clamp(d.by0 + dy, 14 - dH + padY, h - 30 + padY)) + 'px';
    el.style.right = ''; el.style.bottom = '';
    /* v1.7.13：拖着她的时候，头顶的气泡跟着走（她还在说话） */
    if(typeof Bubbles !== 'undefined' && Bubbles._placeQ) Bubbles._placeQ();
  },
  /* 拖动图：她「被拎着一只手拖走」那张（mimi/被拖.png，v1.7.5）——
     没有这张文件 → 接力到拉页面那张（mimi/pull.png 或你传的 acts.pull）→ 再没有才是 q.png + 姿势替身。
     接力名单走 img 自己的 data-fb（HerBody.imgHtml 挂的那个 onerror），裂一张换下一张 */
  _dragImg(on){
    const el = this.el();
    if(!el) return;
    const img = el.querySelector('img');
    if(!img) return;
    if(on){
      /* ⚠️ v1.7.10：一次拖动**只换一次图**。pointermove 每帧都会调进来，
         而下面那句 `img.src = 第一个候选` 每帧都重设一遍：
         候选里排前面的 .png 是 404 的（她给的是压过的 .webp），
         浏览器一 404 就顺着 data-fb 往后接力，下一帧又被拨回第一个候选、
         再 404、再接力……来回弹 → 拖动时一直闪（她报的「拖动时会闪烁」就是这个） */
      if(this._dragImgOn) return;
      this._dragImgOn = true;
      if(this._baseSrc == null) this._baseSrc = img.getAttribute('src');
      if(this._baseFb == null) this._baseFb = img.getAttribute('data-fb') || '';
      const p = (typeof PullMini !== 'undefined') ? PullMini.art(false) : null;   // 拉页面那张（小拉）
      /* v1.7.6：被拖.png 不在 → 先试被拖.webp → 再接力回她平常的样子（PNG 永远排最前） */
      const cands = artCands(Q_DRAG_ART);
      /* 开机探过就直接用探到的那张（不然要从第一个候选起一张张 404 试过去，头两帧就是空的） */
      const warm = (typeof HerBody !== 'undefined' && HerBody.warmed) ? HerBody.warmed(cands) : null;
      const fb = [];
      if(warm){ for(const u of cands){ if(u !== warm) fb.push(u); } }
      else { for(let i = 1; i < cands.length; i++) fb.push(cands[i]); }
      if(p && p.src) fb.push(p.src);
      if(p && p.fb) fb.push.apply(fb, p.fb);
      img.src = warm || cands[0];
      img.dataset.fb = JSON.stringify(fb);
    }else{
      /* ⚠️ 没换成拖动图就别动它：`_dragImg(false)` 在「只是点一下」时也会被调到，
         这时候 _baseSrc 还是 null，老代码会把 data-fb 擦成空串——她那张脸的接力名单就没了 */
      if(this._baseSrc == null) return;
      this._dragImgOn = false;
      img.setAttribute('data-fb', this._baseFb || '');
      if(img.getAttribute('src') !== this._baseSrc) img.src = this._baseSrc;   // 拖完了 → 换回平常那张脸
      /* ⚠️ 用完就清空，下次拖重新记「当下」那张：老代码一辈子只记第一次，
         中间她换了图（温图完成/换页重画）之后再拖，就会还原成一张过期地址 */
      this._baseSrc = null; this._baseFb = null;
    }
  },
  _endDrag(){
    const el = this.el();
    if(this._drag && this._moved >= 8 && el){
      /* ⚠️ v1.7.10：存的是**盒子**的位置，而且直接取 offsetLeft/offsetTop（就是刚写进 left/top 的那个值）
         ——applyPos 也是把它塞进 left/top，两边同一个坐标系，原样还回去她就停在原地。
         老代码存的是 getBoundingClientRect 量到的那块：那是**放大后**看得见的位置（以底边中点为原点
         放大时它比盒子偏左偏上）→ 还回去她就一路往左上跑（她报的）；而且 rect 连当时挂着的
         拖动动画（qDragLean 那个 ±6° 的使劲儿姿势）都会一起量进去，存下来还是个随帧抖的值 */
      const bx = (typeof el.offsetLeft === 'number') ? el.offsetLeft : null;
      const by = (typeof el.offsetTop  === 'number') ? el.offsetTop  : null;
      if(bx != null && by != null){
        S.settings.qPos = {x: Math.round(bx), y: Math.round(by)};
      }else{
        /* 量不到布局值（测试用的假 DOM）→ 退回按 rect 换算 */
        const r = el.getBoundingClientRect();
        const bw = el.offsetWidth || 72, bh = el.offsetHeight || 104;
        const s = clamp(S.settings.qScale || 1, .6, 2.2);
        S.settings.qPos = {x: Math.round(r.left + (bw * s - bw) / 2), y: Math.round(r.top + (bh * s - bh))};
      }
      saveSettings();                        // 她记住新位置（跨刷新不忘）
    }
    if(el && el.classList){ el.classList.remove('q-moving', 'q-drag'); this._dragImg(false); }
    this._drag = null;
  },
  _movePinch(d1){
    const el = this.el();
    if(!this._pinch || !el) return;
    const s = clamp(this._pinch.s0 * (d1 / this._pinch.d0), 0.6, 2.2);
    S.settings.qScale = Math.round(s * 100) / 100;
    el.classList.add('q-moving');
    this.applyPos();
  },
  _endPinch(){
    const el = this.el();
    if(el && el.classList) el.classList.remove('q-moving');
    if(this._pinch && (S.settings.qScale || 1) !== this._pinch.s0) saveSettings();
    this._pinch = null;
  }
};

/* ══════════════════════════════════════════════════════════════
   9.57 传送门 Portal（v1.3）
   用户空间首页 ⇄ 她的空间：长按白圆黑星 0.5 秒 → 星星从小圆里外扩铺满屏幕 → 落到另一边
   （过渡期间 Portal._active=true，手势引擎不与它抢触摸）
   ══════════════════════════════════════════════════════════════ */
const Portal = {
  _active:false,
  HOLD_MS:500,     // 长按星标多久触发
  FLY_MS:470,      // 白圆黑星那档外扩铺满屏幕的时长（CSS 过渡 .48s）
  /* v1.7.14：有传送图那一档 = 模糊→清晰 + 停在画上，跟拖拽进页走**同一张表**
     （CONFIG.TRANS）——两条进她空间的路，节奏得是一个人才对 */
  flyMs(){ const T = CONFIG.TRANS; return T.BLUR_MS + T.CLEAR_MS; },
  outMs(){ const T = CONFIG.TRANS; return T.OUT_MS || 800; },   // ★ v1.17.1：画化开的时长
  totalMs(){ return this.flyMs() + this.outMs(); },             // 她定的 1.8 秒 = 0.6（糊→清楚）+ 1.2（消散）
  /* target: 'mspace' | 'home'；anchorEl: 星标元素（星星从它那儿开始外扩） */
  go(target, anchorEl){
    const ov = document.createElement('div');
    ov.className = 'portal-overlay';
    const a = this._anchor(anchorEl);
    const w = window.innerWidth || 390, h = window.innerHeight || 844;
    /* 有她的传送图（mimi/她的空间过渡图.png，且已经探到）→ 整屏那张画**直接铺满**（v1.12.0 她点名的：
       跟其他页的过渡图一模一样，模糊→清晰；不再从水晶球那儿长出来）
       ⚠️ 两条路各算各的：白圆黑星是「小圆放到盖住屏幕」（倍数 = 屏幕对角线 / 小圆直径），
       整屏画那档不缩放、位置就钉在**可视区正中**（球的位置不参与） */
    /* v1.7.6：PNG 和 .webp 哪个真在就用哪个（见 artCands） */
    const trans = (typeof HerBody !== 'undefined' && HerBody.warmed) ? HerBody.warmed(artCands(PORTAL_TRANS_ART)) : null;
    const useArt = !!trans;
    const de = document.documentElement || {};
    const cw = de.clientWidth || w, ch = de.clientHeight || h;   // clientWidth/Height 永远是「现在看得见的那块」
    if(useArt){
      ov.style.left = Math.round(cw / 2) + 'px';
      ov.style.top  = Math.round(ch / 2) + 'px';
    }else{
      ov.style.left = Math.round(a.x) + 'px';
      ov.style.top  = Math.round(a.y) + 'px';
    }
    ov.innerHTML = '<span class="po-ring"></span><span class="po-star">★</span><span class="po-art"></span>';
    if(useArt){
      ov.classList.add('use-art');
      ov.querySelector('.po-art').style.backgroundImage = 'url("'+trans.replace(/"/g, '%22')+'")';
      /* 这一档的时长与模糊程度（见 CSS 的 poArtClear）：表在 CONFIG.TRANS，这里只负责递过去 */
      ov.style.setProperty('--po-t', this.flyMs() + 'ms');
      ov.style.setProperty('--po-out', this.outMs() + 'ms');   // ★ v1.17.1：换页后画化开的时长
      ov.style.setProperty('--po-blur', CONFIG.TRANS.BLUR_PX + 'px');
      /* ⚠️ 尺寸当场量、宁大勿小（取 client 与 inner 的较大者，保证盖满）；
         margin 把画的心钉在 overlay（= 可视区中心）上 —— 与 v1.7.10 同一条规矩：
         一个 vw/vh 都不用，iPhone 地址栏收起/放下、有没有刘海，结果都一样 */
      const vw2 = Math.max(de.clientWidth || 0, window.innerWidth || 0) || 390;
      const vh2 = Math.max(de.clientHeight || 0, window.innerHeight || 0) || 844;
      const art = ov.querySelector('.po-art');
      art.style.width = vw2 + 'px'; art.style.height = vh2 + 'px';
      art.style.margin = (-vh2 / 2) + 'px 0 0 ' + (-vw2 / 2) + 'px';
    }else{
      ov.style.setProperty('--poscale', Math.ceil(Math.hypot(w, h) / 56 * 1.15));
    }
    document.body.appendChild(ov);
    this._active = true;
    const run = ()=>{ ov.classList.add(useArt ? 'art-go' : 'go'); };
    if(typeof requestAnimationFrame === 'function') requestAnimationFrame(run); else run();
    /* v1.7.14：设置里切到「点击跳转」→ 不自动落地，停在画上等你点（点任意处都算）。
       用 document 上的监听而不是 overlay 自己的：有画那档 overlay 只有 56px（画是它的孩子），
       挂在它身上只有球那么大一块可点 */
    const flyMs = useArt ? this.flyMs() : this.FLY_MS;
    if(S.settings.transMode === 'tap'){
      ov.classList.add('tap-mode');
      const tip = document.createElement('div');
      tip.className = 'po-tap';
      tip.textContent = '点一下继续';
      document.body.appendChild(tip);
      ov.__tip = tip;
      ov.__tap = ()=>{ this._land(target, ov); };
      document.addEventListener('pointerdown', ov.__tap, true);
      ov.__t = setTimeout(()=>this._land(target, ov), flyMs + 8000);   // 长兜底：看够了她也得过去
    }else{
      ov.__t = setTimeout(()=>this._land(target, ov), flyMs);
    }
    return ov;
  },
  /* 白光铺满屏幕的那一刻再换页（换完淡出白光，露出另一边）。
     v1.7.14：点击档会从两个地方进来（点击 / 长兜底定时器）→ 落地只做一次 */
  _land(target, ov){
    if(ov && ov.__landed) return;
    if(ov){
      ov.__landed = true;
      if(ov.__t){ try{ clearTimeout(ov.__t); }catch(e){} ov.__t = null; }
      if(ov.__tap){ try{ document.removeEventListener('pointerdown', ov.__tap, true); }catch(e){} ov.__tap = null; }
      if(ov.__tip){ try{ ov.__tip.remove(); }catch(e){} ov.__tip = null; }
    }
    /* 白光已经铺满整屏，这一刻必须把新页面立刻画出来（不能等下一帧）：
       否则淡出时会先露出旧页面，边缘提示也还挂着上一个视图的四个方向 */
    try{ goView(target); renderView(); }catch(err){ console.error('[Portal]', err); }
    if(ov){
      ov.classList.add('done');
      /* ⚠️ 同 pageLoad：摘元素的时刻要晚于消散时长，不然画化到一半被抽走 */
      /* ★ v1.17.4：白圆黑星那档也 +0.5 秒（她说的「整个消散过程**统一**延长 0.5 秒」）
         ——0.32 是它原本自己的数（没有「画」可化，v1.17.1 起跟有画那档分开算） */
      const outMs = ov.classList.contains('use-art') ? this.outMs() : 820;
      setTimeout(()=>{ if(ov.parentNode) ov.parentNode.removeChild(ov); }, outMs + 60);
    }
    this._active = false;
  },
  _anchor(el){
    try{
      const r = (el && el.getBoundingClientRect) ? el.getBoundingClientRect() : null;
      if(r && (r.width || r.height || r.top || r.left)) return {x:r.left + r.width/2, y:r.top + r.height/2};
    }catch(e){}
    const w = window.innerWidth || 390, h = window.innerHeight || 844;
    return {x:w/2, y:h*0.62};
  }
};

/* ══════════════════════════════════════════════════════════════
   9.56 看板娘养成 Grow（v1.2）
   经验 = 可能性递归每分钟+1 · 完成待办+20 · 写可能性确定+5 · 连续打卡加成(连续天数×2，封顶+20)
   ★ 纯推导：全部由既有数据实时算出，不落库、零迁移——老用户打开立刻有等级。
     唯一的新存储键是 settings.growCelebrated（升级播报去重，见 celebrate/catchUp）
   ══════════════════════════════════════════════════════════════ */
const Grow = {
  _dirty:true, _ev:null, _total:0, _min:null,
  _feedPending:0, _zoneT:null, _sayT:null,      // 投喂演出的计数与定时器（并发多批互不误删）
  invalidate(){
    this._dirty = true;
    /* v1.18.0：她的本子跟等级共用同一个「数据动过了」的信号——
       一处置脏、两本一起重算（本子就是这么跟着真实数据一起长、一起退的） */
    if(typeof Achv !== 'undefined') Achv.invalidate();
  },
  /* 全量推导：dk → {min,done,rec,streak,xp}；按日升序推进算连续天数（避免 O(n²)） */
  rebuild(now){
    now = now || Date.now();
    const today = D.dateKey(now), G = CONFIG.GROW;
    const ev = new Map();
    const touch = dk => { if(!ev.has(dk)) ev.set(dk, {min:0, done:0, rec:0, streak:0, xp:0}); return ev.get(dk); };
    /* ① 可能性递归：已终结切片按 end-start 计；进行中的切片只算今天（随时间持续长经验） */
    for(const s of S.sessions){
      if(!s.day) continue;
      let m = 0;
      if(s.end != null) m = (s.end - s.start) / 60000;
      else if(s.day === today) m = Math.max(0, now - s.start) / 60000;
      if(m > 0) touch(s.day).min += m;
    }
    /* ② 待办完成：doneKeys 记着每一次完成；单次待办的键是 'once'，按 completedAt 归到当天 */
    for(const t of S.todos){
      for(const k of (t.doneKeys || [])){
        const dk = (k === 'once') ? (t.completedAt ? D.dateKey(t.completedAt) : null) : k;
        if(dk && /^\d{4}-\d{2}-\d{2}$/.test(dk)) touch(dk).done++;
      }
    }
    /* ③ 每日记录：枚举 day: 键，每条可能性确定 +5（旧版单条对象兼容计 1 条） */
    for(const k of Store.allKeys()){
      if(k.indexOf('day:') !== 0) continue;
      const doc = Store.get(k, null);
      if(!doc || !doc.spaceRecords) continue;
      let n = 0;
      for(const spId in doc.spaceRecords){
        const v = doc.spaceRecords[spId];
        n += Array.isArray(v) ? v.length : (v ? 1 : 0);
      }
      if(n > 0) touch(k.slice(4)).rec += n;
    }
    /* ④ 连续打卡 + 每日经验 */
    let prev = null, run = 0;
    for(const dk of [...ev.keys()].sort()){
      const e = ev.get(dk);
      const ok = e.min >= 1 || e.done > 0 || e.rec > 0;   // 打卡 = 有递归 / 有完成 / 有记录
      run = (ok && prev && D.dateKey(D.addDaysTs(D.dkToTs(prev), 1)) === dk) ? run + 1 : (ok ? 1 : 0);
      prev = dk;
      e.streak = run;
      e.xp = Math.floor(e.min) * G.XP_MINUTE + e.done * G.XP_TODO + e.rec * G.XP_RECORD +
             (ok ? Math.min(run * G.XP_STREAK_PER_DAY, G.XP_STREAK_CAP) : 0);
    }
    this._ev = ev; this._total = 0;
    for(const e of ev.values()) this._total += e.xp;
    this._dirty = false;
    return this;
  },
  _ensure(){ if(this._dirty || !this._ev) this.rebuild(Date.now()); return this; },
  /* —— 只读推导 —— */
  checkedIn(dk){ this._ensure(); const e = this._ev.get(dk); return !!e && (e.min >= 1 || e.done > 0 || e.rec > 0); },
  xpForDay(dk){ this._ensure(); const e = this._ev.get(dk); return e ? e.xp : 0; },
  dayXpDetail(dk){ this._ensure(); return this._ev.get(dk) || {min:0, done:0, rec:0, streak:0, xp:0}; },
  totalXp(){ this._ensure(); return this._total; },
  /* 截止 dk（含）的连续打卡天数；当天没打卡就是 0（面板据此说“今天还没打卡”） */
  streakDaysUpTo(dk){
    this._ensure();
    if(!this.checkedIn(dk)) return 0;
    let n = 0, cur = dk;
    for(let i=0;i<365;i++){
      if(!this.checkedIn(cur)) break;
      n++; cur = D.dateKey(D.addDaysTs(D.dkToTs(cur), -1));
    }
    return n;
  },
  /* —— 等级数学 —— */
  needFor(level){ return CONFIG.GROW.LEVEL_BASE + (Math.max(1, level) - 1) * CONFIG.GROW.LEVEL_STEP; },
  /* 到达 level 所需的累计经验（到达 1 级 = 0） */
  cumNeed(level){
    const n = Math.max(1, level) - 1;
    return n * CONFIG.GROW.LEVEL_BASE + CONFIG.GROW.LEVEL_STEP * n * (n - 1) / 2;
  },
  levelFromXp(xp){
    let lv = 1;
    while(this.cumNeed(lv + 1) <= xp) lv++;
    return lv;
  },
  titleOf(level){
    let s = CONFIG.GROW.TITLES[0][1];
    for(const [lv, name] of CONFIG.GROW.TITLES){ if(level >= lv) s = name; }
    return s;
  },
  nextTitleOf(level){
    for(const [lv, name] of CONFIG.GROW.TITLES){ if(lv > level) return {level:lv, name}; }
    return null;
  },
  level(){ return this.levelFromXp(this.totalXp()); },
  /* 养成面板的一次性快照 */
  xpInfo(now){
    now = now || Date.now();
    const xp = this.totalXp(), level = this.levelFromXp(xp);
    const cur = xp - this.cumNeed(level), need = this.needFor(level);
    const today = D.dateKey(now), yest = D.dateKey(D.addDaysTs(now, -1));
    return {
      xp, level, cur, need,
      pct: need > 0 ? clamp(cur / need, 0, 1) : 0,
      title: this.titleOf(level),
      next: this.nextTitleOf(level),
      streak: this.streakDaysUpTo(today),
      streakYesterday: this.streakDaysUpTo(yest),
      todayChecked: this.checkedIn(today)
    };
  },
  /* 台词解锁进度：已解锁 X / 共 19 句 + 下一档等级 */
  lineProgress(){
    const lv = this.level();
    let next = null;
    for(const t of CONFIG.GROW.LINE_TIERS){ if(t > lv){ next = t; break; } }
    return { level:lv, have:Mascot.linesFor(lv).length, total:Mascot.lineTotal(), next };
  },
  /* ——「她眼中的我」的统计数据（只读推导，同样不落库） —— */
  stats(now){
    now = now || Date.now();
    this._ensure();
    let min = 0, done = 0, rec = 0;
    for(const e of this._ev.values()){ min += e.min; done += e.done; rec += e.rec; }
    /* 最近在忙的空间：按空间累计递归分钟，取最大的那个 */
    const per = {};
    for(const s of S.sessions){
      if(!s.spaceId) continue;
      const m = (s.end != null) ? (s.end - s.start) / 60000 : Math.max(0, now - s.start) / 60000;
      if(m > 0) per[s.spaceId] = (per[s.spaceId] || 0) + m;
    }
    let topId = null, topMin = 0;
    for(const id in per){ if(per[id] > topMin){ topMin = per[id]; topId = id; } }
    const dk = D.dateKey(now);
    return {
      xp:this._total, lv:this.levelFromXp(this._total),
      min:Math.floor(min), done, rec,
      streak:this.streakDaysUpTo(dk), todayChecked:this.checkedIn(dk),
      topId, topMin:Math.floor(topMin), dayCount:this._ev.size
    };
  },
  /* 她根据数据说的话（第 1 句是开场，其余是她想对你说的；全是只读推导） */
  herWords(st, sp){
    const out = [];
    const lv = st.lv, title = this.titleOf(lv);
    out.push(st.dayCount === 0
      ? '我们才刚刚开始呢——你写的每一条，我都会记住。'
      : '我已经陪你走过 ' + st.dayCount + ' 天啦，现在的我是 Lv.' + lv + ' · ' + title + '。');
    if(!st.todayChecked) out.push('今天还没有打卡哦，哪怕只专注 1 分钟，我也会记你一功。');
    if(st.streak >= 30) out.push('连续 ' + st.streak + ' 天了……这条日子已经连成很长很长的一条了。');
    else if(st.streak >= 7) out.push('连续打卡 ' + st.streak + ' 天！你比你自己想象中更有毅力。');
    else if(st.streak >= 3) out.push('已经连着 ' + st.streak + ' 天了，再多一天就成习惯啦。');
    if(st.min >= 6000) out.push('你总共专注了 ' + fmtMin(st.min) + '，这些时间我都替你收好了。');
    else if(st.min > 0) out.push('你专注了 ' + fmtMin(st.min) + '，每一分钟都算数。');
    if(st.done >= 100) out.push('你已经完成 ' + st.done + ' 件事了，我数着的。');
    else if(st.done > 0) out.push('你完成过 ' + st.done + ' 件事，我都有好好记下来。');
    if(st.rec === 0) out.push('还没有任何记录呢——写第一条吧，我会替你收着。');
    if(sp) out.push('最近你总是在忙「' + sp.name + '」，累计 ' + fmtMin(st.topMin) + '，我在旁边看着呢。');
    if(lv < 5) out.push('再往上一点点，我就能解锁新的台词了，好期待呀。');
    else if(lv < 10) out.push('学徒的我，也还想再长大一点。');
    else if(lv < 20) out.push('时间在我手里越来越听话了，这都是跟你学的。');
    return out;
  },
  /* —— 升级检测与播报 —— */
  tick(now){
    const m = Math.floor(now / 60000);
    if(this._dirty || m !== this._min){
      this._min = m;
      this.rebuild(now);        // 分钟边界重算：进行中的递归会持续长经验
      this.checkLevelUp();
    }
  },
  checkLevelUp(){
    const lv = this.level(), prev = S._level || 1;
    S._level = lv;
    if(lv > prev) this.celebrate(prev, lv);   // 等级回落（撤销完成/删记录）静默跟随，不播报
  },
  celebrate(from, to){
    const title = this.titleOf(to);
    /* v1.7.12：升级 = 她自己也长大了 → 鼓掌（话由下面 pickLine 那句新解锁的台词来说） */
    if(typeof Her !== 'undefined') Her.onEvent('levelUp', {id:'lv' + to, lv:to});
    UI.toast('升级啦！Lv.' + to + ' · ' + title + ' 🎉');
    if(title !== this.titleOf(from)) setTimeout(()=>UI.toast('新称号解锁：' + title + ' ✦'), 900);
    this.anim(this.pickLine(from, to));
  },
  /* 升级演出：纯净页（首页/她的空间）= 看板娘亲口说 + 星光；子页 = 迷你看板娘气泡 + 小星光 */
  anim(line){
    if(S.view === 'home' || S.view === 'mspace'){ Mascot.say(line, CONFIG.GROW.SAY_MS); this.fxStars(); return; }
    this.miniSay(line);
    this.fxStarsMini();
  },
  /* 升级时说的话：优先说这次刚解锁的新台词，否则随机一句 */
  pickLine(from, to){
    const fresh = Mascot.unlockLinesBetween(from, to);
    return fresh.length ? fresh[fresh.length - 1] : Mascot.randomLine(to);
  },
  /* 补播：升级时用户不在场（页面关着）→ 下次主动打开养成面板时补一句，只补一次 */
  catchUp(){
    const lv = this.level(), seen = S.settings.growCelebrated || 1;
    if(lv <= seen) return 0;
    S.settings.growCelebrated = lv;
    saveSettings();
    return lv;
  },
  /* —— 粒子（动画关闭时一粒都不撒） —— */
  fxStars(){
    if((S.settings.animLevel || 'full') === 'off') return 0;
    const zone = document.querySelector('#view-root .mascot-zone');
    if(!zone) return 0;
    return this._burst(zone, (S.settings.animLevel === 'full') ? 12 : 8);
  },
  fxStarsMini(){
    if((S.settings.animLevel || 'full') === 'off') return 0;
    const root = document.getElementById('feed-root');
    if(!root) return 0;
    return this._burst(root.querySelector('.feed-mini') || root, (S.settings.animLevel === 'full') ? 12 : 8);
  },
  _burst(box, n){
    const em = ['✨','⭐','🌟','💫'];
    for(let i=0;i<n;i++){
      const s = document.createElement('span');
      s.className = 'mascot-heart mascot-star';
      s.textContent = em[i % em.length];
      s.style.left = (10 + Math.random()*80) + '%';
      s.style.bottom = (28 + Math.random()*62) + '%';
      s.style.animationDelay = (i*0.05) + 's';
      box.appendChild(s);
      setTimeout(()=>s.remove(), 2200);
    }
    return n;
  },
  /* 子页里的迷你看板娘台词气泡（喂食区 #feed-root，动画层步骤见 9.57） */
  miniSay(text){
    const root = document.getElementById('feed-root');
    if(!root) return;
    let b = root.querySelector('.feed-say');
    if(!b){
      b = document.createElement('div');
      b.className = 'feed-say';
      root.appendChild(b);
    }
    b.textContent = text;
    b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
    clearTimeout(this._sayT);
    this._sayT = setTimeout(()=>{ b.classList.remove('show'); }, CONFIG.GROW.SAY_MS);
  },
  /* 轻量经验飘字：写一条可能性确定 +5（从按钮处往上飘） */
  floatXp(anchorEl, xp){
    if((S.settings.animLevel || 'full') === 'off') return 0;
    const root = document.getElementById('feed-root');
    if(!root) return 0;
    const p = this._anchorPoint(anchorEl);
    const s = document.createElement('span');
    s.className = 'feed-xp';
    s.textContent = '+' + xp;
    s.style.left = p.x + 'px';
    s.style.top = p.y + 'px';
    root.appendChild(s);
    setTimeout(()=>s.remove(), 1300);
    return xp;
  },
  /* —— 投喂演出：完成待办 → 点心从卡片飞向左下角的迷你看板娘 —— */
  feed(anchorEl, xp){
    const lv = S.settings.animLevel || 'full';
    if(lv === 'off') return 0;                    // 动画关闭：不撒食物（经验照长，toast 里有文字）
    const root = document.getElementById('feed-root');
    const zone = this._ensureZone();
    if(!root || !zone) return 0;
    const n = (lv === 'full') ? CONFIG.GROW.FEED_FOODS_FULL : CONFIG.GROW.FEED_FOODS_LIGHT;
    const p0 = this._anchorPoint(anchorEl), p1 = this._mouthPoint();   // 卡片中心 → 她嘴边
    for(let i=0;i<n;i++){
      const f = document.createElement('span');
      f.className = 'feed-food';
      f.textContent = CONFIG.GROW.FOODS[(Math.random()*CONFIG.GROW.FOODS.length)|0];
      f.style.setProperty('--fx0', p0.x + 'px');
      f.style.setProperty('--fy0', p0.y + 'px');
      f.style.setProperty('--fx1', p1.x + 'px');
      f.style.setProperty('--fy1', p1.y + 'px');
      f.style.animationDelay = (i*0.12) + 's';    // 一批食物错峰起飞
      root.appendChild(f);
      setTimeout(()=>f.remove(), 1900 + i*120);
    }
    this._feedPending = (this._feedPending || 0) + 1;
    const land = 1050 + (n-1)*120;                // 最后一个食物落嘴的时间
    setTimeout(()=>{
      this._feedPending = Math.max(0, (this._feedPending || 1) - 1);
      this._chomp();
      const mini = zone.querySelector('.feed-mini');
      this.floatXp(mini, xp);                     // 头顶飘 +20
      /* v1.7.13：忙碌页「完成待办」那句已经由事件反应说在 Q版头顶了 —— 投喂这边别再补一句
         （左下 feed 区 + 右下小气泡同时开腔会抢话）。纯净页照旧 */
      if((S.view === 'home' || S.view === 'mspace') && Math.random() < CONFIG.GROW.FEED_SAY_CHANCE) this.miniSay(this._feedLine());
      if(this._feedPending === 0){                // 所有批次都吃完了才收起（并发多批互不误删）
        clearTimeout(this._zoneT);
        this._zoneT = setTimeout(()=>this.dismissZone(), 1300);
      }
    }, land);
    return n;
  },
  _feedLine(){ const l = CONFIG.GROW.FEED_LINES; return l[(Math.random()*l.length)|0]; },
  /* 咬一口：重设动画类（先摘后加，连点也能重新播） */
  _chomp(){
    const el = document.querySelector('#feed-root .feed-mini');
    if(!el) return;
    el.classList.remove('feed-chomp'); void el.offsetWidth; el.classList.add('feed-chomp');
    setTimeout(()=>el.classList.remove('feed-chomp'), 700);
  },
  /* 喂食区（左下角迷你看板娘）：懒创建，点头像 = 星星外扩传送到她的空间（v1.3） */
  _ensureZone(){
    const root = document.getElementById('feed-root');
    if(!root) return null;
    let z = root.querySelector('.feed-zone');
    if(!z){
      z = document.createElement('div');
      z.className = 'feed-zone';
      z.innerHTML = '<div class="feed-mini">' + this._miniHtml(true) + '</div>';   // 投喂时露脸的是 Q版那只
      z.addEventListener('click', ()=>{ if(!Portal._active) Portal.go('mspace', z); });
      root.appendChild(z);
    }
    z.classList.add('on');
    root.classList.add('on');
    return z;
  },
  /* 迷你头像（v1.6a）：q=true 用「Q版」那张（投喂演出）；否则用正常形态的迷你版——
     她说话的地方（她眼中的我 / 她的日记 / 她的问题）也跟着此刻的心情换脸。
     没传过图就照旧回退：现穿着的那套 > 系统默认的她（她的图文件夹）> 内置占位小可爱 */
  _miniHtml(q){
    return q ? HerBody.imgHtml('q', 'base', {small:true})
             : HerBody.imgHtml('normal', Emo.slot(), {small:true});
  },
  dismissZone(){
    clearTimeout(this._zoneT);
    this._feedPending = 0;
    const root = document.getElementById('feed-root');
    if(!root) return;
    const z = root.querySelector('.feed-zone');
    if(z) z.classList.remove('on');
    root.classList.remove('on');
  },
  /* 她嘴边（迷你头像中上部）；拿不到位置就退回左下角 */
  _mouthPoint(){
    const el = document.querySelector('#feed-root .feed-mini');
    const r = (el && el.getBoundingClientRect) ? el.getBoundingClientRect() : null;
    if(r && (r.width || r.height)) return {x: r.left + r.width/2, y: r.top + r.height*0.42};
    return {x: 40, y: (window.innerHeight || 640) - 62};
  },
  /* 动画锚点：优先用元素真实位置，拿不到就落在屏幕中下方（无 rect 时兜底） */
  _anchorPoint(el){
    try{
      const r = (el && el.getBoundingClientRect) ? el.getBoundingClientRect() : null;
      if(r && (r.width || r.height || r.top || r.left)) return {x: r.left + r.width/2, y: r.top + r.height/2};
    }catch(e){}
    const w = window.innerWidth || 360, h = window.innerHeight || 640;
    return {x: w/2, y: h*0.62};
  }
};

/* ══════════════════════════════════════════════════════════════
   9.6b 她的本子 Achv（v1.18.0）
   —— 把 CONFIG.ACHV.DEFS 里那些「开始动了」的时刻，从既有数据推出来，记成一本
      按时间倒序的本子；她当场说一句；你自己也能往上写一行。
   —— 和 Grow 同款：**纯推导、懒重算、不落库**（脏标记跟着 Grow.invalidate 一起置位）。
   ══════════════════════════════════════════════════════════════ */

/* 那一周（周一那天）的日期键 —— 「连着几周」的步长按周一起算，跟今天是周几无关 */
function weekKey(dk){
  const t = D.dkToTs(dk);
  return D.dateKey(D.addDaysTs(t, -(((D.weekdayOf(dk) + 6) % 7))));
}
function prevWeekKey(w){ return D.dateKey(D.addDaysTs(D.dkToTs(w), -7)); }
function prevMonthKey(m){
  let a = m.split('-'), y = Number(a[0]), mo = Number(a[1]) - 1;
  if(mo < 1){ mo = 12; y--; }
  return y + '-' + pad2(mo);
}
/* 连着 N 周、每周都至少有一天 → 返回命中那一周里最晚的那天；没连着就 null */
function steadyHit(days){
  const N = CONFIG.ACHV.STEADY_WEEKS;
  const ws = [...new Set(days.map(weekKey))].sort();
  let run = 0, prev = null, hit = null;
  for(const w of ws){
    run = (prev && D.dateKey(D.addDaysTs(D.dkToTs(prev), 7)) === w) ? run + 1 : 1;
    if(run >= N && !hit) hit = w;
    prev = w;
  }
  if(!hit) return null;
  const inWeek = days.filter(d => weekKey(d) === hit).sort();
  return inWeek.length ? inWeek[inWeek.length - 1] : hit;
}

const Achv = {
  _dirty:true, _env:null,

  invalidate(){ this._dirty = true; },

  /* —— 全量推导一张环境快照：一次扫完，DEFS 只读它（跟 Grow.rebuild 同一个套路） —— */
  _build(now){
    now = now || Date.now();
    const A = CONFIG.ACHV, DAY = 86400000;
    const G = Grow._ensure();          // ★ 直接复用等级那本按天账本（min/done/rec/streak 已经算好了）
    const ev = G._ev || new Map();
    const dks = [...ev.keys()].sort();
    const doneOf = dk => (ev.get(dk) || {}).done || 0;
    const on = dk => { const e = ev.get(dk); return !!e && (e.min >= 1 || e.done > 0 || e.rec > 0); };

    /* ① 三个「第一次」：按天升序，第一个满足的日子 */
    const firstOf = f => { for(const dk of dks){ if(f(ev.get(dk))) return dk; } return null; };
    const first = {
      done:  firstOf(e => e.done > 0),
      rec:   firstOf(e => e.rec  > 0),
      focus: firstOf(e => e.min >= 1)
    };

    /* ② 每个空间：种下的那天 / 破土 / 又动了 / 没断过 */
    const sp = [];
    for(const s of (S.spaces || [])){
      if(s.archived) continue;
      const row = {id:s.id, name:s.name || '（未命名）', seed:null, bloom:null, revive:null, steady:null};
      try{ row.seed = D.dateKey(s.createdAt || now); }catch(e){ row.seed = null; }
      /* 这个空间「有东西被完成」的每一天（待办按 doneKeys 归天，单次待办按 completedAt） */
      const ds = [];
      for(const t of (S.todos || [])){
        if(t.spaceId !== s.id) continue;
        for(const k of (t.doneKeys || [])){
          const dk = (k === 'once') ? (t.completedAt ? D.dateKey(t.completedAt) : null) : k;
          if(dk && /^\d{4}-\d{2}-\d{2}$/.test(dk)) ds.push(dk);
        }
      }
      ds.sort();
      if(!ds.length){ sp.push(row); continue; }
      row.bloom = ds[0];
      /* 又动了：相邻两次之间断够了 REVIVE_DAYS —— 只记**第一次**重新动起来的那一刻 */
      for(let i=1;i<ds.length;i++){
        const gap = Math.round((D.dkToTs(ds[i]) - D.dkToTs(ds[i-1])) / DAY);
        if(gap >= A.REVIVE_DAYS){ row.revive = {dk:ds[i], gap:gap - 1}; break; }
      }
      row.steady = steadyHit(ds);      // 这个空间连着 N 周没断过
      sp.push(row);
    }

    /* ③ 你回来了：相邻两次打卡之间断够了 BACK_DAYS */
    let comeback = null, prev = null;
    for(const dk of dks){
      if(!on(dk)) continue;
      if(prev){
        const gap = Math.round((D.dkToTs(dk) - D.dkToTs(prev)) / DAY) - 1;
        if(gap >= A.BACK_DAYS){ comeback = {dk:dk, gap:gap}; break; }
      }
      prev = dk;
    }

    /* ④ 这一周/这个月比上一周/上个月快：
       逐日推进，第一次「到这天为止的完成件数 > 上一整周/一整月」的那天就是达成日。
       先按周/月把件数摊好，免得每天都重扫一遍。 */
    const perWeek = {}, perMonth = {};
    for(const dk of dks){
      const d = doneOf(dk); if(!d) continue;
      const w = weekKey(dk), m = dk.slice(0,7);
      perWeek[w] = (perWeek[w] || 0) + d;
      perMonth[m] = (perMonth[m] || 0) + d;
    }
    const ramp = (keyOf, prevOf, per) => {
      let cur = null, n = 0, base = 0;
      for(const dk of dks){
        const k = keyOf(dk);
        if(k !== cur){ cur = k; n = 0; base = per[prevOf(k)] || 0; }
        n += doneOf(dk);
        if(base >= 1 && n > base) return {dk:dk, prev:base, now:n};
      }
      return null;
    };
    const week  = ramp(weekKey, prevWeekKey, perWeek);
    const month = ramp(dk => dk.slice(0,7), prevMonthKey, perMonth);

    /* ⑤ 成了日常：连着 N 周、每周都打过卡 */
    const steadyAll = steadyHit(dks.filter(on));

    return this._env = {now, first, sp, comeback, week, month, steadyAll};
  },

  _ensure(now){ if(this._dirty || !this._env) this._build(now); return this._env; },

  /* —— 现在**已经达成**的全部条目（纯推导，不落库；删掉记录它也会跟着少） —— */
  all(now){
    const env = this._ensure(now), out = [];
    for(const d of (CONFIG.ACHV.DEFS || [])){
      let arr = [];
      try{ arr = d.hit(env) || []; }catch(e){ arr = []; }
      for(const a of arr){ if(a && a.id && a.dk) out.push(a); }
    }
    return out;
  },

  /* —— 本子上现有的全部行（她记的 + 你自己写的），按时间倒序（新的在最上面） —— */
  lines(){
    const out = [], m = S.settings.achv || {};
    for(const id in m){
      const r = m[id]; if(!r) continue;
      out.push({id:id, at:r.at || 0, dk:r.dk || '', text:r.text || '', mine:false});
    }
    for(const r of (S.settings.achvLines || [])){
      if(!r) continue;
      out.push({id:r.id, at:r.at || 0, dk:r.dk || '', text:r.text || '', mine:true});
    }
    out.sort((a,b)=> (b.at || 0) - (a.at || 0));
    return out;
  },

  /* —— 检测新解锁（主循环每拍跑一次，但只有数据动过才会真算）——
     ★ 首次运行 = **静默补记**：她已经记着的那几十笔一次写进本子，但**不说话**。
       她的人设是「我一直在记」，不是「恭喜解锁」——你第一次翻开本子才发现已经这么厚了。
     ★ 之后每解锁一条就说一句；同一次同时达成好几条时只说 DEFS 里最靠前的那条，
       其余的静默入账（本子上一样有那一行）。 */
  tick(now){
    try{
      if(!this._dirty) return;
      now = now || Date.now();
      const all = this.all(now);
      const m = S.settings.achv || (S.settings.achv = {});
      const first = !S.settings.achvInit;      // 第一次跑（不管新老用户）→ 补记不演出
      const fresh = [];
      for(const a of all){
        if(m[a.id]) continue;
        m[a.id] = {at: first ? D.dkToTs(a.dk) : now, dk:a.dk, text:a.text};
        if(!first) fresh.push(a);
      }
      if(first) S.settings.achvInit = now;
      this._dirty = false;
      if(first || fresh.length) saveSettings();
      if(!fresh.length) return;
      const a = fresh[0];
      if(typeof Her !== 'undefined'){
        Her.onEvent('achv', {id:a.id});        // 帧（记下来）+ 变脸 + 音效
        const tpl = CONFIG.ACHV.SAY[Math.floor(Math.random() * CONFIG.ACHV.SAY.length)];
        Her.reply(tpl.replace('{n}', LT(a.text)), {key:'her-achv-' + a.id, go:()=>goView('mgrow')});
      }
      UI.toast(LT('📖 她记下了一笔：') + LT(a.text));
    }catch(e){}
  },

  /* —— 你自己在本子上写一行（那些只有你知道、机器看不见的事） —— */
  write(text, now){
    text = String(text == null ? '' : text).trim();
    if(!text) return false;
    now = now || Date.now();
    const s = S.settings.achvLines || (S.settings.achvLines = []);
    s.push({id:uid('ln_'), at:now, dk:D.dateKey(now), text:text.slice(0, 140)});
    if(s.length > 300) s.splice(0, s.length - 300);
    saveSettings();
    return true;
  }
};

/* ══════════════════════════════════════════════════════════════
   9.7 节律操控台 Console（双击呼出 · 猫耳时段卡 · 空间栏 · 投放区）
   ══════════════════════════════════════════════════════════════ */
const Console = {
  lastTouch:0,           // 用户刚碰过面板的时间（拖动/滚动时暂停每秒刷新）
  hold:0,                // 正被拖拽的三角（暂停每秒刷新）
  html(){ return '<div class="console'+(this._anim?' sheet-in':'')+'">'+
    '<div class="console-grab"></div>'+
    '<div class="console-head">'+
      '<div class="console-title">节律表操控台</div>'+
      '<button class="ctab'+(S.consTab==='slots'?' on':'')+'" data-action="cons-tab" data-tab="slots">自流转</button>'+
      '<button class="ctab'+(S.consTab==='spaces'?' on':'')+'" data-action="cons-tab" data-tab="spaces">空间</button>'+
      '<button class="icon-btn" data-action="open-settings" aria-label="设置">⚙</button>'+
      '<button class="icon-btn" data-action="cons-close" aria-label="收起操控台">✕</button>'+
    '</div>'+
    '<div class="console-body">'+(S.consTab==='slots' ? this.slotsHtml() : this.spacesHtml())+'</div>'+
  '</div>'; },
  open(){
    S.consOpen = true; this.lastTouch = Date.now(); this._anim = true;
    if(typeof Grow !== 'undefined') Grow.dismissZone();   // 操控台弹出时先收起喂食区，别打架
    this.render();
  },
  close(){ S.consOpen = false; S.sbOpen = false;
    const el = document.getElementById('console-root'); if(el) el.innerHTML=''; },
  toggle(){ S.consOpen ? this.close() : this.open(); },
  render(){
    if(!S.consOpen) return;
    const el = document.getElementById('console-root');
    if(!el) return;
    el.innerHTML = this.html();
    this._anim = false;                      // 滑入动画只在「打开」这一次播放
    this._sig = this.sig(Date.now());        // 记录签名，避免下一秒 tick 立刻重绘（闪烁来源）
    this.bind();
  },
  /* 每秒定向刷新：计时数字原地更新；状态变化时才整体重画（保留滚动位置） */
  tick(now){
    if(!S.consOpen) return;
    const root = document.getElementById('console-root');
    if(!root) return;
    root.querySelectorAll('[data-rec-t]').forEach(el=>{
      const m = Rhythm.activeManual();
      setText(el, m ? fmtDur(now - m.start) : '--');
    });
    if(this.hold || now - this.lastTouch < 600) return;
    const sig = this.sig(now);
    if(sig !== this._sig){ this._sig = sig; this.render(); }
  },
  /* 面板内容签名：时段/跳过/进行中任一变化 → 触发重画 */
  sig(now){
    const dk = D.dateKey(now);
    const doc = dayDoc(dk);
    const slots = [...Rhythm.slotsOf(dk, doc)].sort((a,b)=>a.start<b.start?-1:1);
    let s = S.consTab;
    for(const slot of slots){
      const st = this.slotState(slot, doc, now);
      s += '|'+slot.id+':'+slot.start+'-'+slot.end+':'+st.key+(st.live?':L':'');
    }
    const m = Rhythm.activeManual();
    if(m) s += '|man:'+m.spaceId;
    return s;
  },
  /* 时段卡状态机（与渲染共用，保证状态一致） */
  slotState(slot, doc, now){
    const today = D.dateKey(now);
    const dayStart = D.dkToTs(today);
    const s0 = D.hhmmToTs(dayStart, slot.start), e0 = D.hhmmToTs(dayStart, slot.end);
    const skipped = !!((doc.slotSkips||{})[slot.id]);
    const active = S.sessions.find(x=>x.end==null && x.scheduleId===slot.id);
    const cov = Rhythm.slotCoverage(today, slot.id, s0);
    if(skipped) return {key:'skip', face:'🚫', stTxt:'今日跳过', stCls:'st-idle', live:false};
    if(active) return {key:'live', face:'🐱', stTxt:'进行中', stCls:'st-live', live:true};
    if(now >= e0){
      if(cov >= e0-1000) return {key:'done', face:'✅', stTxt:'已结束', stCls:'st-done', live:false};
      if(cov > s0) return {key:'partial', face:'🏁', stTxt:'部分未生效', stCls:'st-warn', live:false};
      return {key:'miss', face:'⚠️', stTxt:'未生效', stCls:'st-warn', live:false};
    }
    if(now >= s0) return {key:'quota', face:'⚠️', stTxt:'额度不足', stCls:'st-warn', live:false};
    return {key:'idle', face:'😴', stTxt:'未开始', stCls:'st-idle', live:false};
  },
  bind(){
    const body = document.querySelector('#console-root .console-body');
    if(!body) return;
    /* 用户碰到面板（滚动/点按）→ 暂停每秒重画，避免打断操作 */
    body.addEventListener('pointerdown', ()=>{ this.lastTouch = Date.now(); }, {passive:true});
    body.querySelectorAll('.sc-tri').forEach(tri=>{
      tri.addEventListener('pointerdown', e=>{ this.pullStart(e, tri); }, {passive:false});
    });
    body.querySelectorAll('.sb-card[draggable]').forEach(card=>{
      card.addEventListener('pointerdown', e=>{ this.cardPress(e, card); }, {passive:false});
    });
    /* 猫耳与其它按钮走 data-action 委托，无需单独绑定 */
  },
  /* ──────── Tab1 自流转时段卡列表 ──────── */
  slotsHtml(){
    const now = Date.now();
    const today = D.dateKey(now);
    const doc = dayDoc(today);
    const slots = [...Rhythm.slotsOf(today, doc)].sort((a,b)=>a.start<b.start?-1:1);
    const manual = Rhythm.activeManual();
    let h = '';
    /* 手动递归卡（若正在跑） */
    if(manual){
      const sp = spaceById(manual.spaceId);
      h += this.manualCardHtml(manual, sp);
    }
    if(slots.length===0){
      h += '<div class="console-empty"><div class="big">🐾</div>今天还没有自流转日程<br><span style="font-size:12px;color:var(--text-2)">设定课程表式的自动递归，到点看板娘会替你开始</span></div>';
    }else{
      for(const slot of slots) h += this.slotCardHtml(slot, doc);
    }
    if(S.spaces.some(x=>!x.archived)){
      h += '<button class="btn btn--block" data-action="slot-form" style="margin:2px 0 4px">＋ 添加自流转日程</button>';
    }else{
      h += '<button class="btn btn--block" data-action="goto-spaces" style="margin:2px 0 4px">先创建一个可能性空间 →</button>';
    }
    h += '<div class="hint" style="font-size:11px;color:var(--text-2);text-align:center;padding:4px 8px 6px">'+
         '猫耳 ＋/− 调时长 · 拉右上角三角=提前结束 · 拉左下角三角=停止本段（推回原位取消）</div>';
    return h;
  },
  manualCardHtml(m, sp){
    const now = Date.now();
    return '<div class="slot-card sc-live manual">'+
      '<div class="sc-row">'+
        '<div class="sc-face">🐱</div>'+
        '<div class="sc-mid">'+
          '<div class="sc-name">'+esc(sp?sp.name:'手动递归')+' <span class="badge">手动</span></div>'+
          '<div class="sc-time num">已专注 <span data-rec-t>'+fmtDur(now-m.start)+'</span></div>'+
        '</div>'+
        '<span class="sc-st st-live">进行中</span>'+
      '</div>'+
      '<div class="sc-mini"><button class="icon-btn" data-action="stop-manual" aria-label="停止递归">⏹</button></div>'+
    '</div>';
  },
  slotCardHtml(slot, doc){
    const now = Date.now();
    const today = D.dateKey(now);
    const sp = spaceById(slot.spaceId);
    const dayStart = D.dkToTs(today);
    const s = D.hhmmToTs(dayStart, slot.start), e = D.hhmmToTs(dayStart, slot.end);
    const st = this.slotState(slot, doc, now);
    const live = st.live;
    const color = sp ? sp.color : '#8A93A3';
    const left = ((s - dayStart)/86400000*100);
    const w = Math.max(0.8, ((e - s)/86400000*100));
    return '<div class="slot-card sc-card'+(live?' sc-live':'')+(st.key==='done'?' sc-done':'')+'" data-slot="'+slot.id+'">'+
      /* 猫耳朵（＋10 / －10 分钟）：只在进行中/时段内显示，已结束与未开始的卡不显示 */
      ((st.key==='live' || st.key==='quota')
        ? '<div class="sc-ears">'+
            '<button class="sc-ear r" data-action="cons-ear" data-id="'+slot.id+'" data-dir="p" aria-label="延长10分钟"><span class="ear-in">＋<small>10分</small></span></button>'+
            '<button class="sc-ear l" data-action="cons-ear" data-id="'+slot.id+'" data-dir="m" aria-label="缩短10分钟"><span class="ear-in">－<small>10分</small></span></button>'+
          '</div>'
        : '')+
      '<div class="sc-row">'+
        '<div class="sc-face">'+st.face+'</div>'+
        '<div class="sc-mid">'+
          '<div class="sc-name">'+esc(sp?sp.name:'已删除空间')+
            (slot._rule ? ' <span class="badge">每周</span>' : '')+'</div>'+
          '<div class="sc-time num">'+esc(slot.start)+' ~ '+esc(slot.end)+'</div>'+
          (slot.note?'<div class="sc-extra">'+esc(slot.note)+'</div>':'')+
        '</div>'+
        '<span class="sc-st '+st.stCls+'">'+st.stTxt+'</span>'+
      '</div>'+
      /* 时段轨道：色段 + 现在线 + 拉扯时的幽灵终点线 */
      '<div class="sc-track" data-track>'+
        '<div class="sc-band" style="left:'+left.toFixed(2)+'%;width:'+w.toFixed(2)+'%;background:'+color+'"></div>'+
        (s<=now && now<=e || live ? '<div class="sc-nowline" style="left:'+(((now-dayStart)/86400000)*100).toFixed(2)+'%"></div>' : '')+
        '<div class="sc-ghost sc-ghost-r"></div><div class="sc-ghost sc-ghost-l"></div>'+
        '<div class="sc-label sc-label-r"></div><div class="sc-label sc-label-l"></div>'+
      '</div>'+
      /* 三角拉扯柄：右上=提前结束（把终点拉近），左下=停止本段（拉出猫耳，推回取消） */
      (live ? '<div class="sc-tri r" data-pull="end" aria-label="提前结束"><span class="t-arrow">◤</span></div>'+
               '<div class="sc-tri l" data-pull="stop" aria-label="停止本段"><span class="t-arrow">◣</span></div>'
           : '')+
      '<div class="sc-mini">'+
        '<button class="icon-btn" data-action="slot-form" data-id="'+slot.id+'" aria-label="编辑">✎</button>'+
        (st.key==='skip' ? '<button class="icon-btn" data-action="cons-ear" data-id="'+slot.id+'" data-dir="p" style="background:var(--accent-soft);color:var(--accent-dark)" aria-label="恢复本段">↻</button>' : '')+
      '</div>'+
    '</div>';
  },
  /* ──────── Tab2 空间栏 + 投放区 ──────── */
  spacesHtml(){
    const active = S.spaces.filter(x=>!x.archived);
    const m = Rhythm.activeManual();
    let h = '<div class="sb-head"><div class="t">可能性空间</div>'+
      '<span class="hint" style="font-size:11px">长按卡片拖到下方开始递归</span></div>';
    if(active.length===0){
      h += '<div class="console-empty"><div class="big">◇</div>还没有可能性空间<br>创建你的第一个兴趣空间吧</div>';
      h += '<button class="btn btn--primary btn--block" data-action="add-space">＋ 新建空间</button>';
      return h;
    }
    h += '<div class="sb-scroll" data-sb>';
    for(const sp of active){
      h += '<div class="sb-card" draggable="true" data-space="'+sp.id+'" style="--sc:'+sp.color+'">'+
             '<div class="sb-ico">'+esc(sp.icon||'✦')+'</div>'+
             '<div class="sb-name">'+esc(sp.name)+'</div>'+
             '<div style="font-size:10px;color:var(--text-2)"><span class="num">'+fmtMin(Rhythm.todaySpaceMinutes(sp.id))+'</span></div>'+
           '</div>';
    }
    h += '<button class="sb-card add" data-action="add-space">＋<span style="font-size:11px">新空间</span></button>';
    h += '</div>';
    /* 投放区：空闲=拖入高亮；进行中=点击停止 */
    if(m){
      const sp = spaceById(m.spaceId);
      h += '<button class="drop-pad live" data-action="stop-manual">'+
             '<span class="pulse-dot" style="background:var(--green)"></span> 正在递归：'+esc(sp?sp.name:'?')+
             ' · <span class="num" data-rec-t style="font-variant-numeric:tabular-nums">'+fmtDur(Date.now()-m.start)+'</span>'+
             '<div class="dp-sub">点击停止</div></button>';
    }else{
      h += '<div class="drop-pad" id="drop-pad">拖到这里 → 可能性递归<div class="dp-sub">消耗节律递归时间，积累到空间名下</div></div>';
    }
    return h;
  },
  /* —— 猫耳 ±10 分钟（改自己设定的时间段，立即生效） —— */
  ear(slotId, dir){
    const now = Date.now();
    const today = D.dateKey(now);
    const doc = dayDoc(today);
    let slot = Rhythm.slotsOf(D.dateKey(Date.now()), doc).find(x=>x.id===slotId);
    if(!slot){ UI.toast('日程不存在', 'err'); return; }
    const isRule = !!slot._rule;
    if(isRule){
      /* 改的是每周规则 → 以后每周都照这个来 */
      const r = (S.settings.autoRules||[]).find(x=>x.id===slotId);
      if(r) slot = r; else { UI.toast('日程不存在', 'err'); return; }
    }
    const m2 = v => (Math.floor(v/60))+':'+pad2(v%60);
    const sm = (+slot.start.slice(0,2))*60+(+slot.start.slice(3,5));
    let em = (+slot.end.slice(0,2))*60+(+slot.end.slice(3,5));
    const nm = em + (dir==='p'?10:-10);
    if(nm <= sm+10){ UI.toast('时段最短 10 分钟', 'err'); return; }
    if(nm > 1430){ UI.toast('最晚到 23:50（不跨天）', 'err'); return; }
    slot.end = m2(nm);
    /* 用户手动改动后：取消“今日跳过”，把缺失的区间补算回来 */
    if(doc.slotSkips && doc.slotSkips[slot.id]){
      delete doc.slotSkips[slot.id];
      if(Object.keys(doc.slotSkips).length===0) delete doc.slotSkips;
    }
    if(isRule) saveSettings(); else saveDay(today);
    Rhythm.reconcileDay(today);
    UI.toast(dir==='p' ? '已延长到 '+slot.end : '已缩短到 '+slot.end);
    scheduleRender();
  },
  /* —— 右下三角：拉近 = 提前结束本次 —— */
  pullStart(e, tri){
    e.preventDefault();
    const card = tri.closest('.sc-card');
    if(!card) return;
    const track = card.querySelector('[data-track]');
    if(!track) return;
    const rect = track.getBoundingClientRect();
    const now = Date.now();
    const today = D.dateKey(now);
    const doc = dayDoc(today);
    const slotId = card.dataset.slot;
    const slot = Rhythm.slotsOf(today, doc).find(x=>x.id===slotId);
    if(!slot) return;
    const active = S.sessions.find(x=>x.end==null && x.scheduleId===slotId);
    if(!active) return;
    const dayStart = D.dkToTs(today);
    const pxPerMin = rect.width / 1440;
    const kind = tri.dataset.pull;                       // 'end' 提前结束 / 'stop' 停止本段
    const originX = e.clientX, originY = e.clientY;
    const band = card.querySelector('.sc-band');
    const eMin = (active.start - dayStart)/60000;        // 起始即已开始
    const orgEndMin = (doc.slotSkips&&doc.slotSkips[slotId]) ? null : Math.min(1440, ((D.hhmmToTs(dayStart, slot.end)-dayStart)/60000));
    Console.hold = Date.now();
    card.classList.add('pulling-r');
    /* 按住后：拉出猫耳、显示引导 */
    const ghost = card.querySelector('.sc-ghost-'+(kind==='end'?'r':'l'));
    const label = card.querySelector('.sc-label-'+(kind==='end'?'r':'l'));
    const show = (x, y) => {
      const dx = x - originX;
      let px = originX + dx;
      px = Math.min(rect.right, Math.max(rect.left, px));
      const frac = Math.max(0, Math.min(1, (px - rect.left) / rect.width));
      const targetMin = Math.round(frac * 1440);
      const ghostLeft = ((targetMin/1440)*100).toFixed(2);
      ghost.style.left = ghostLeft+'%';
      ghost.style.display = 'block';
      card.style.setProperty('--pull-commit', String(Math.abs(dx) > rect.width*0.12 ? 1 : 0));
      let msg;
      if(kind==='end'){
        msg = Math.abs(dx) > rect.width*0.12 ? '松手=提前结束到 '+D.tsToHHMM(dayStart+targetMin*60000) : '拖到 ← 提前结束';
      }else{
        msg = Math.abs(dx) > rect.width*0.12 ? '松手=停止本段并跳过' : '拖开并松手 = 停止';
      }
      label.textContent = msg;
      label.style.left = Math.min(rect.width-70, Math.max(0, px-rect.left))+'px';
    };
    show(e.clientX, e.clientY);
    const move = ev => {
      ev.preventDefault();
      show(ev.clientX, ev.clientY);
    };
    const up = ev => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      Console.hold = 0;
      card.classList.remove('pulling-r');
      ghost.style.display = '';
      label.style.display = '';
      const dx = ev.clientX - originX;
      if(Math.abs(dx) <= rect.width*0.12){ return; }     // 没拖够 → 还原（继续递归）
      const dayStart2 = D.dkToTs(today);
      const frac = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
      const targetMin = Math.round(frac * 1440);
      const targetTs = dayStart2 + targetMin*60000;
      const slot2 = Rhythm.slotsOf(today, doc).find(x=>x.id===slotId);
      const act2 = S.sessions.find(x=>x.end==null && x.scheduleId===slotId);
      if(!act2) return;
      if(kind==='end'){
        /* 提前结束：在本刻收尾（结束点必须在开始之后） */
        const endTs = Math.max(act2.start + 1000, Math.min(Date.now(), targetTs));
        Rhythm.finalizeSessionsOnDay(today, [act2.id], endTs, 'earlyEnd');
        UI.toast('已提前结束 '+D.tsToHHMM(endTs));
        /* 若结束点早于槽位结束，标记今日跳过，防止引擎立刻重开 */
        const doc2 = dayDoc(today);
        if(endTs < D.hhmmToTs(dayStart2, slot2.end) - 1000){
          doc2.slotSkips = doc2.slotSkips || {};
          doc2.slotSkips[slotId] = true;
          saveDay(today);
        }
        scheduleRender();
      }else{
        /* 停止本段：终结当前并标记今日跳过 */
        Rhythm.finalizeSessionsOnDay(today, [act2.id], Date.now(), 'manual');
        const doc2 = dayDoc(today);
        doc2.slotSkips = doc2.slotSkips || {};
        doc2.slotSkips[slotId] = true;
        saveDay(today);
        UI.toast('已停止本段，今日跳过（猫耳 ＋ 可恢复）');
        scheduleRender();
      }
    };
    window.addEventListener('pointermove', move, {passive:false});
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  },
  /* —— 拖空间卡 → 投放区开始手动递归 —— */
  /* ★ v1.15.0：长按卡片才起拖（提示文案本来就是「长按卡片拖到下方」）——
     她报「空间多了要左右滑动找，经常性地拖动空间导致滑不了」：
     以前 pointerdown 一碰卡片就起拖，横滑浏览被当成拖拽抢走。
     现在按下先等 420ms（手指挪过 8px 就当滑动、取消长按）→ 到点才起拖。
     ⚠️ 只对鼠标按 preventDefault（压掉桌面端的原生拖拽/选字）；触摸不拦，
     这样横滑由浏览器原生滚动接手，永远滑得动 */
  cardPress(e, card){
    if(card.classList.contains('add')) return;
    if(e.pointerType === 'mouse'){ try{ e.preventDefault(); }catch(e2){} }
    const hold = {card, x:e.clientX, y:e.clientY, t:setTimeout(()=>{
      this._cardHold = null;
      this.dragStart(e, card);
    }, 420)};
    this._cardHold = hold;
    const mv = ev=>{
      const h = this._cardHold;
      if(h && h.card === card && Math.hypot(ev.clientX - h.x, ev.clientY - h.y) > 8){
        clearTimeout(h.t); this._cardHold = null;   // 这是滑动找空间，不是想拖
      }
    };
    const up = ()=>{
      const h = this._cardHold;
      if(h && h.card === card){ clearTimeout(h.t); this._cardHold = null; }
      window.removeEventListener('pointermove', mv);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
    };
    window.addEventListener('pointermove', mv, {passive:true});
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  },
  dragStart(e, card){
    if(card.classList.contains('add')) return;
    e.preventDefault();
    const spId = card.dataset.space;
    const rect = card.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const offX = e.clientX - rect.left, offY = e.clientY - rect.top;
    Console.hold = Date.now();
    /* 幽灵卡必须挂在 body 下：操控台的 backdrop-filter 会生成包含块，
       让 fixed 定位相对面板生效并被 overflow 裁剪 → 手机上卡片“消失”的根源 */
    const ghost = card.cloneNode(true);
    ghost.classList.add('dragging');
    ghost.style.width = w+'px'; ghost.style.height = h+'px';
    ghost.style.left = rect.left+'px'; ghost.style.top = rect.top+'px';
    document.body.appendChild(ghost);
    card.style.opacity = '.35';
    const pad = document.getElementById('drop-pad');
    const move = ev => {
      ev.preventDefault();
      ghost.style.left = (ev.clientX - offX)+'px';
      ghost.style.top  = (ev.clientY - offY)+'px';
      if(pad){
        const pr = pad.getBoundingClientRect();
        const over = ev.clientX>pr.left && ev.clientX<pr.right && ev.clientY>pr.top && ev.clientY<pr.bottom;
        pad.classList.toggle('hot', over);
      }
    };
    const up = ev => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      Console.hold = 0;
      ghost.remove();
      card.style.opacity = '';
      if(pad) pad.classList.remove('hot');
      if(pad){
        const pr = pad.getBoundingClientRect();
        const over = ev.clientX>pr.left && ev.clientX<pr.right && ev.clientY>pr.top && ev.clientY<pr.bottom;
        if(over){ Rhythm.manualStart(spId); }
      }
    };
    window.addEventListener('pointermove', move, {passive:false});
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  }
};

/* ⚠️ v1.7.6 起：下面这些函数返回的地址**一律是 .png 那个名字**，它只是「第一个候选」——

   我们的共识.png / 待办.png / 节律表.png…（她的空间那四页同理：我们的羁绊.png 等，放进去就有）

const CARD_IMG = {

  READY:'松手', TRANS:'过渡图',

/* 这张卡片的图叫什么名字（页面名对不上就在 FILE 里点名） */
function pageArtName(page){
  const m = PAGE_META[page];

  return CARD_IMG.FILE[page] || m.name;

function cardImg(page){

/* 「松手就能进」那张（v1.7.5）：拉过刻度时把卡片插画整个换掉（mimi/待办松手.png …）
   它是同一张卡片的另一个状态——不是叠一张贴纸上去，所以 CSS 里是「换」不是「叠」
   找不到这一页的 → 试通用的 mimi/松手.png → 都没有就照旧只靠光晕和名字反白 */
function cardReadyImg(page){

const CARD_READY = CARD_IMG.DIR + CARD_IMG.READY + '.png';    // 通用兜底（她没做也行）
/* ★ v1.19.1：刷新时不用把一张图的 12 个候选全问一遍。
   账本上记着「这张在 X」的名字 → 只重问**排在 X 前面**的候选（她换的新图一定排在旧图前面，
   PNG 优先那条红线决定的）+ X 自己（可能整张文件被换掉了）。账本上没记的名字照旧全问。
   一轮刷新能砍掉一大半请求 —— 服务器慢的地方，问得少一轮就快一轮。 */
function memoCands(cands){
  try{
    const m = HerBody._memo();
    for(let i = 0; i < cands.length; i++){

  return cands;
}

/* ★ v1.17.4：进页那张整屏画**该按什么顺序试**（原来只试 pageTransImg 那一个名字）。
   起因：她 2026-09-15 传的四张过渡图没写「过渡图」三个字，直接叫「过渡/一起玩吧.png」——
   少三个字也得认，不然她白画。
   顺序（前两个是正路）：
     ① 过渡/<页面名>过渡图.png   老规矩那张
     ② 过渡/<页面名>.png         她新写的这种
     ③ 根目录 / 别家文件夹的同名图（她放错文件夹也照样生效，照 artCands 的老脾气）
     ④ 提示卡插画（卡片/<页面名>.png）——只在她连过渡图都没画时才会轮到它
   ⚠️ 红线不破：**所有 .png 都排在任何 .webp 前面**。所以不能把两个 artCands 直接接起来
      （那样「页面名.webp」会插到「页面名过渡图.png」前头，新画的 PNG 就赢不了了） */
function pageTransCands(page){
  const n = pageArtName(page);
  if(!n) return [];
  /* ⚠️ 两个名字都得带 'mimi/' 记号再交给 artCands：不带的话它不是「逻辑名」，
     会被当成一条现成的地址（只补个后缀就完事），「该住哪个家」那趟展开就没了 */
  const all = artCands(CARD_IMG.DIR + n + CARD_IMG.TRANS + '.png')
                .concat(artCands(CARD_IMG.DIR + n + '.png'));
  const home = [], rest = [];                      // ①「过渡」家里那两条正路拎到最前面
  for(const u of all){
    if(u.indexOf('过渡/') === 0){ if(home.indexOf(u) < 0) home.push(u); }
    else if(rest.indexOf(u) < 0) rest.push(u);
  }
  const png = [], webp = [];
  for(const u of home.concat(rest)) (u.slice(-4).toLowerCase() === '.png' ? png : webp).push(u);
  return png.concat(webp);
}

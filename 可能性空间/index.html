    }else{
      t.weekdays = [...S.form.weekdays].sort((a,b)=>a-b);
      if(t.weekdays.length===0){ UI.toast('请至少选择一个星期几', 'err'); return; }
      t.weeklyTime = document.getElementById('tf-weekly-time').value || '20:00';
      t.dueAt = null; t.dailyTime = null;
    }
    const repeatChanged = (oldRepeat!==t.repeat) || (t.repeat==='daily' && oldDaily!==t.dailyTime) || (t.repeat==='weekly' && (oldWd!==t.weekdays.join(',') || oldWeekly!==t.weeklyTime));
    if(!isNew && repeatChanged && (t.doneKeys||[]).length>0){
      t.doneKeys = []; t.lastCompletedKey = null; t.completedAt = null;
      UI.toast('重复规则已变更，完成状态已重置');
    }
    if(isNew) S.todos.push(t);
    saveTodos();

    UI.confirmDialog('删除待办', '删除「'+t.title+'」？历史完成记录会保留，列表中不再显示。', true, ()=>{

  /* —— 自流转日程 —— */
  'slot-form'(btn){ openSlotFormModal(btn.dataset.id || null); },
  'slot-save'(btn){
    const dk = D.dateKey(Date.now());
    const doc = dayDoc(dk);
    const id = btn?.dataset?.id || null;
    const spaceId = document.getElementById('sl-space').value || null;
    if(!spaceId){ UI.toast('请选择可能性空间', 'err'); return; }
    const start = document.getElementById('sl-start').value;
    const end = document.getElementById('sl-end').value;
    if(!start || !end){ UI.toast('请填写开始与结束时间', 'err'); return; }
    if(end <= start){ UI.toast('结束时间需晚于开始时间（同一自然日内）', 'err'); return; }
    const note = document.getElementById('sl-note').value.trim();
    const base = {spaceId, start, end, note};
    let slot;
    if(id){
      slot = (doc.autoSchedules||[]).find(x=>x.id===id);
      if(!slot) return;
      Object.assign(slot, base);
    }else{
      slot = {id:uid('as_'), createdAt:Date.now(), sourceId:null, ...base};
      doc.autoSchedules = doc.autoSchedules || [];
      doc.autoSchedules.push(slot);
      /* 重复副本 */
      const copies = [];
      if(S.form && S.form.slotRep==='days'){
        for(const n of S.form.slotDays) copies.push(D.dateKey(D.addDaysTs(Date.now(), n)));
      }else if(S.form && S.form.slotRep==='weekdays'){
        for(let n=1;n<=28;n++){
          const dk2 = D.dateKey(D.addDaysTs(Date.now(), n));
          if(S.form.slotWeekdays.has(D.weekdayOf(dk2))) copies.push(dk2);
        }
      }
      for(const dk2 of copies){
        const dd = dayDoc(dk2);
        dd.autoSchedules = dd.autoSchedules || [];
        dd.autoSchedules.push({id:uid('as_'), createdAt:Date.now(), sourceId:slot.id, ...base});
        saveDay(dk2);
      }
      if(copies.length) UI.toast('已复制到 '+copies.length+' 天');
    }
    /* 重叠提示（今天） */
    const s0 = D.hhmmToTs(D.dkToTs(dk), start), e0 = D.hhmmToTs(D.dkToTs(dk), end);
    for(const other of doc.autoSchedules){
      if(other.id===slot.id) continue;
      const a = D.hhmmToTs(D.dkToTs(dk), other.start), b = D.hhmmToTs(D.dkToTs(dk), other.end);
      if(s0 < b && a < e0){ UI.toast('与「'+other.start+'~'+other.end+'」日程重叠：重叠时段将双倍消耗额度'); break; }
    }
    saveDay(dk);
    Rhythm.reconcileDay(dk);   // 立即补算今天已过去的时段
    UI.closeModal();
    scheduleRender();
    UI.toast('日程已保存');
  },

    UI.confirmDialog('删除日程', '删除 '+slot.start+'~'+slot.end+' 的日程？已消耗的时间记录会保留。', true, ()=>{

function todoCardHtml(t, now, live){
  if(live===undefined) live = true;
  const st = todoStatus(t, now);
  let cls = st==='confirming' ? 't-confirm' : st==='done' ? 't-done' : 't-'+TodoLogic.color(t, now);
  /* 未来日：截止还没到来，不判超时（保持蓝色） */
  if(!live && st==='pending' && D.dateKey(now) > D.dateKey(Date.now())) cls = 't-blue';
  const side = st==='confirming' ? '<span class="q">?</span>' : st==='done' ? '<span class="ok">✓</span>' : '';
  const due = TodoLogic.dueAt(t, now);
  let cd;
  if(st==='done'){
    const nx = TodoLogic.nextDueAt(t, now);
    cd = nx ? '已完成 · 下次 '+TodoLogic.fmtNextShort(nx, now) : '已完成';
  }else if(due==null){
    cd = '无期限';
  }else if(!live && due <= now){
    /* 历史日：显示当日截止时刻而非"已超时X小时" */
    cd = '当日 '+D.tsToHHMM(due)+' 截止';
  }else{
    cd = fmtRemain(due - now);
  }
  let meta = '';
  if(t.type==='habit') meta += '<span class="badge">习惯</span>';
  if(t.type==='memo') meta += '<span class="badge">备忘</span>';
  meta += '<span class="badge">'+TodoLogic.repeatLabel(t)+'</span>';
  if(t.spaceId){
    const sp = spaceById(t.spaceId);
    const c = sp ? sp.color : '#8A93A3';
    meta += '<span class="badge badge--space" style="--space-color:'+c+';--space-soft:'+c+'22;--space-line:'+c+'55">来自'+esc(spaceNameOf(t.spaceId))+'</span>';
  }
  return '<div class="todo-card '+cls+'"'+(live?' data-bind="todo"':' data-day="'+D.dateKey(now)+'"')+' data-id="'+t.id+'" data-action="tap-todo">'+
    '<div class="todo-main">'+
      '<div class="todo-title">'+esc(t.title)+'</div>'+
      '<div class="todo-sub">'+meta+'</div>'+
      (t.note ? '<div class="todo-note">'+esc(t.note)+'</div>' : '')+
      '<div class="todo-sub"><span class="todo-cd" data-cd>'+cd+'</span></div>'+
    '</div>'+
    '<div class="todo-side">'+side+'</div>'+
    '<button class="icon-btn todo-edit" data-action="todo-form" data-id="'+t.id+'" aria-label="编辑">✎</button>'+
  '</div>';
}

/* 图片压缩：最长边 ≤maxSize（默认1000），JPEG 质量 0.75 → dataURL */
function compressImage(file, cb, maxSize){
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = ()=>{
    const MAX = maxSize || 1000;
    const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * scale));
    const h = Math.max(1, Math.round(img.naturalHeight * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    cb(canvas.toDataURL('image/jpeg', 0.75));
  };
  img.onerror = ()=>{ URL.revokeObjectURL(url); UI.toast('图片读取失败', 'err'); };
  img.src = url;
}
/* 图片选择回调：压缩 → 存入 S.form.images → 刷新弹窗内网格与计数 */
function handleImageFile(file){
  if(!file || !file.type || !file.type.startsWith('image/')){ UI.toast('请选择图片文件', 'err'); return; }
  UI.toast('压缩处理中…');
  compressImage(file, dataURL=>{
    const id = uid('img_');
    if(!Store.saveImage(id, dataURL)){ UI.toast('存储空间不足，图片保存失败', 'err'); return; }
    S.form.images = S.form.images || [];
    S.form.images.push(id);
    refreshImgUI();
    UI.toast('图片已保存');
  });
}

/* 无引用图片回收（启动时执行一次） */
function gcImages(){
  const refs = new Set();
  for(const k of Store.allKeys()){
    if(k.startsWith('day:')){
      const doc = Store.loadDay(k.slice(4));
      if(!doc) continue;
      for(const spId in (doc.spaceRecords||{})){
        const v = doc.spaceRecords[spId];
        if(Array.isArray(v)){ for(const r of v){ (r.images||[]).forEach(id=>refs.add(id)); } }
        else (v.images||[]).forEach(id=>refs.add(id));   // 旧版单条兼容
      }
      (doc.rhythmEntries||[]).forEach(en=>(en.images||[]).forEach(id=>refs.add(id)));
    }
  }
  for(const n of S.catnotes){ (n.images||[]).forEach(id=>refs.add(id)); }
  if(S.settings.bgImageId) refs.add(S.settings.bgImageId);   // 背景图
  if(S.settings.mascotId && S.settings.mascotId!=='placeholder') refs.add(S.settings.mascotId);   // 看板娘立绘
  let removed = 0;
  for(const k of Store.allKeys()){
    if(k.startsWith('img:') && !refs.has(k.slice(4))){ Store.del(k); removed++; }
  }
  return removed;
}
/* 是否属于「当日待办」（首页收纳卡口径，now 为当天视角）：
   完成态=已记到该天；未完成=当天到期/已超时/无期限 */
function isTodayTodo(t, now){
  const dk = D.dateKey(now);
  if(todoStatus(t, now)==='done') return true;
  const due = TodoLogic.dueAt(t, now);
  if(due == null) return true;
  return due <= D.dkToTs(dk) + 86400000;
}

      if(v != null && (Array.isArray(v) ? v.length>0 : true)) n++;

  }

/* 空间详情 · 待办页 */
function spTodosHtml(sp){
  const now = Date.now();
  const list = S.todos.filter(x=>!x.archived && x.spaceId===sp.id);
  const pending = [], done = [];
  for(const t of list){ (todoStatus(t, now)==='done' ? done : pending).push(t); }
  pending.sort((a,b)=>{
    const da = TodoLogic.dueAt(a, now), db = TodoLogic.dueAt(b, now);
    if(da==null) return 1; if(db==null) return -1; return da-db;
  });
  done.sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));
  let h = '<button class="btn btn--primary btn--block" data-action="todo-form" data-space="'+sp.id+'">＋ 在此空间新建待办</button>';
  h += '<div class="sec-sub">进行中<span class="cnt">'+pending.length+'</span></div>';
  if(pending.length===0) h += '<div class="empty"><span class="empty-ico">☀</span>该空间没有进行中的待办</div>';
  else for(const t of pending) h += todoCardHtml(t, now);
  if(done.length>0){
    h += '<div class="sec-sub">已完成<span class="cnt">'+done.length+'</span></div>';
    for(const t of done) h += todoCardHtml(t, now);
  }
  return h;
}

function dayHasData(dk){
  const doc = Store.loadDay(dk);
  if(doc){
    if(doc.dayMood || (doc.rhythmEntries&&doc.rhythmEntries.length) || (doc.autoSchedules&&doc.autoSchedules.length)) return true;
    for(const k in (doc.spaceRecords||{})){
      const v = doc.spaceRecords[k];
      if(v != null && (Array.isArray(v) ? v.length>0 : true)) return true;
    }
  }
  return S.sessions.some(s=>s.day===dk);
}

/* 递归时间带上的一个色段（active=进行中，宽度按墙钟实时） */
function bandHtml(s, active){
  const dayStart = D.dkToTs(s.day);
  const startMin = Math.max(0, (s.start - dayStart) / 60000);
  /* 注意单位：ms 差要先除以 60000 转分钟再钳制（曾把 ms 与分钟混用，
     导致进行中色段永远只有最小宽度，时间带看起来断断续续） */
  const endMin = Math.min(1440, ((active ? Date.now() : s.end) - dayStart) / 60000);
  const left = startMin / 1440 * 100;
  const w = Math.max(0.6, (endMin - startMin) / 1440 * 100);
  const sp = spaceById(s.spaceId);
  const color = sp ? sp.color : '#8A93A3';
  const name = sp ? sp.name : '已删除空间';
  const modeTxt = s.mode==='auto' ? '自流转' : '手动递归';
  const endTxt = active ? '进行中' : D.tsToHHMM(s.end);
  return '<div class="rh-band'+(active?' active':'')+'" style="left:'+left.toFixed(2)+'%;width:'+w.toFixed(2)+'%;background:'+color+'" title="'+esc(name)+' · '+modeTxt+' · '+D.tsToHHMM(s.start)+' ~ '+endTxt+'"></div>';
}

/* 某天的自流转日程列表（editable=false 时隐藏添加与编辑入口，仅供回看） */
function slotListHtml(dk, editable){
  const now = Date.now();
  const doc = dayDoc(dk);
  const slots = [...(doc.autoSchedules||[])].sort((a,b)=>a.start<b.start?-1:1);
  let h = '';
  if(editable) h += '<button class="btn btn--block" data-action="slot-form">＋ 添加自流转日程</button>';
  if(slots.length===0){
    h += '<div class="hint" style="font-size:12px;color:var(--text-2);margin-top:8px">'+
      (editable ? '课程表式：到点自动用指定空间消耗节律递归时间' : '这一天没有设置日程')+'</div>';
  }else{
    h += '<div style="margin-top:12px">';
    for(const slot of slots){
      const sp = spaceById(slot.spaceId);
      const s = D.hhmmToTs(D.dkToTs(dk), slot.start);
      const e = D.hhmmToTs(D.dkToTs(dk), slot.end);
      const cov = Rhythm.slotCoverage(dk, slot.id, s);
      const skipped = !!(doc.slotSkips||{})[slot.id];
      let badge, badgeCls;
      if(skipped){ badge='今日跳过'; badgeCls='sb-missed'; }
      else if(S.sessions.some(x=>x.end==null && x.scheduleId===slot.id)){ badge='进行中'; badgeCls='sb-active'; }
      else if(now < s){ badge='未开始'; badgeCls='sb-upcoming'; }
      else if(now >= e){ badge = cov >= e-1000 ? '已结束' : (cov > s ? '部分未生效' : '未生效'); badgeCls = cov >= e-1000 ? 'sb-done' : 'sb-missed'; }
      else { badge='额度不足'; badgeCls='sb-missed'; }
      h += '<div class="card slot-item">'+
             '<span class="dot" style="background:'+(sp?sp.color:'#8A93A3')+'"></span>'+
             '<div class="slot-info">'+
               '<div class="slot-time num">'+esc(slot.start)+' ~ '+esc(slot.end)+'</div>'+
               '<div style="font-size:12px;color:var(--text-2)">'+esc(sp?sp.name:'已删除空间')+(slot.note?' · '+esc(slot.note):'')+'</div>'+
             '</div>'+
             '<span class="slot-badge '+badgeCls+'">'+badge+'</span>'+
             (editable?'<button class="icon-btn" data-action="slot-form" data-id="'+slot.id+'" style="width:26px;height:26px">✎</button>':'')+
           '</div>';
    }
    h += '</div>';
  }
  return h;
}

      for(const en of entries){
        h += '<div class="card pad rh-entry" style="margin-bottom:8px">'+
               '<div style="display:flex;justify-content:space-between;align-items:center">'+

                 '<span style="display:flex">'+

                 '<div style="font-size:12px;color:var(--text-2)">'+
                   '<span class="num">递归 '+fmtMin(x.min)+'</span> · '+
                   '<span class="num">可能性确定 '+x.recs+' 条</span>'+
                   (x.adds?' · 迭代笔记 +'+x.adds:'')+
                 '</div>'+

               '<button class="btn btn--small" data-action="go-space" data-id="'+x.sp.id+'">查看</button>'+
             '</div>';

    if(!isTodayView) h += '<button class="btn btn--primary btn--block" data-action="sum-day-today" style="margin-top:6px">回到今天</button>';
    h += '</section>';
    return h;
  },
  /* —— 事务待办 —— */
  todos(){
    const now = Date.now();
    const list = S.todos.filter(x=>!x.archived);
    const pending = [], done = [];
    for(const t of list){ (todoStatus(t, now)==='done' ? done : pending).push(t); }
    pending.sort((a,b)=>{
      const da = TodoLogic.dueAt(a, now), db = TodoLogic.dueAt(b, now);
      if(da==null) return 1; if(db==null) return -1; return da-db;
    });
    done.sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));
    let h = '<section class="sec"><h2 class="sec-title">事务待办</h2>';
    h += '<button class="btn btn--primary btn--block" data-action="todo-form" style="margin-bottom:6px">＋ 新建待办</button>';
    h += '<div class="sec-sub">进行中<span class="cnt">'+pending.length+'</span></div>';
    if(pending.length===0){
      h += '<div class="empty"><span class="empty-ico">☀</span>没有进行中的待办<br><span style="font-size:12px">点上方「新建待办」开始记录</span></div>';
    }else{
      for(const t of pending) h += todoCardHtml(t, now);
    }
    if(done.length>0){
      h += '<div class="sec-sub">已完成<span class="cnt">'+done.length+'</span><span style="font-weight:400;letter-spacing:0">点击灰色卡片可恢复为未完成</span></div>';
      for(const t of done) h += todoCardHtml(t, now);
    }
    h += '</section>';
    return h;
  },

  /* —— 节律表（支持浏览任意一天） —— */
  rhythm(){
    const now = Date.now();
    const dk = D.dateKey(now);
    const rd = S.rhythmDay || dk;                       // 正在查看的日期
    const isTodayView = rd === dk;
    const doc = dayDoc(rd);
    const spaces = S.spaces.filter(x=>!x.archived);
    const Q = Rhythm.quotaFor(rd);
    const consumed = Rhythm.consumedMinutes(rd, now);
    const remain = Math.max(0, Q - consumed);
    let h = '<section class="sec"><h2 class="sec-title">节律表</h2>';
    /* 历史浏览条（含日历选择与全局情绪） */
    h += dayNavHtml('rhythm');
    /* 统计卡 */
    h += '<div class="card card--mark pad"'+(isTodayView?' data-bind="quota"':'')+' style="margin-bottom:16px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px">'+
        '<div style="font-weight:700;font-size:15px">节律递归时间</div>'+
        '<button class="btn btn--small num" data-action="quota-edit" style="flex:none">'+(isTodayView?'今日额度':'当日额度')+' '+fmtMin(Q)+' ✎</button>'+
      '</div>'+
      '<div class="prog" style="height:10px"><div class="prog-bar" data-q-bar style="width:'+Math.min(100, consumed/Q*100).toFixed(1)+'%"></div></div>'+
      '<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px">'+
        '<span style="color:var(--text-2)">已消耗 <b class="num" data-q-used>'+fmtMin(consumed)+'</b></span>'+
        '<span>剩余 <b class="num" data-q-remain style="color:var(--accent)">'+fmtMin(remain)+'</b></span>'+
      '</div>';
    const bySpace = spaces.map(sp=>({sp, min:Rhythm.daySpaceMinutes(rd, sp.id)})).filter(x=>x.min>0);
    if(bySpace.length){
      h += '<div class="sec-sub" style="margin:12px 0 4px">可能性递归时间 · 当日转化</div>';
      for(const x of bySpace){
        h += '<div class="kv"><span class="k"><span class="dot" style="background:'+x.sp.color+'"></span>'+esc(x.sp.name)+'</span><span class="v num">'+fmtMin(x.min)+'</span></div>';
      }
    }else{
      h += '<div class="hint" style="font-size:12px;color:var(--text-2);margin-top:10px">'+
        (isTodayView ? '今日还没有可能性递归消耗 — 在下方空间卡片点击「可能性递归」开始' : '这一天没有可能性递归消耗记录')+'</div>';
    }
    h += '</div>';
    /* 24h 时间带 */
    const slices = S.sessions.filter(s=>s.day===rd && s.end!=null).sort((a,b)=>a.start-b.start);
    const activeSlices = isTodayView ? Rhythm.activeSlices().filter(s=>s.day===rd) : [];
    h += '<div class="sec-sub">'+(isTodayView?'今日':'当日')+'递归时间带</div>';
    h += '<div class="rh-track">'+
           slices.map(s=>bandHtml(s, false)).join('')+
           activeSlices.map(s=>bandHtml(s, true)).join('')+
           (isTodayView ? '<div class="rh-now" style="left:'+((now - D.dkToTs(rd)) / 86400000 * 100).toFixed(3)+'%"></div>' : '')+
         '</div>';
    if(slices.length===0 && activeSlices.length===0){
      h += '<div class="hint" style="font-size:12px;color:var(--text-2);margin-top:8px">这一天还没有递归记录</div>';
    }
    /* 自流转日程 */
    h += '<div class="sec-sub" style="margin-top:18px">自流转 · '+(isTodayView?'今日':'当日')+'日程</div>';
    h += slotListHtml(rd, isTodayView);
    /* 手动递归（仅今天可用） */
    if(isTodayView){
      h += '<div class="sec-sub" style="margin-top:18px">可能性递归 · 手动</div>';
      if(spaces.length===0){
        h += '<div class="empty"><span class="empty-ico">◇</span>还没有可能性空间<br>创建空间后，即可用空间消耗节律递归时间</div>';
      }else{
        h += '<div class="grid-2">';
        for(const sp of spaces){
          const acts = Rhythm.activeForSpace(sp.id);
          const isAct = acts.length>0;
          h += '<div class="space-card rh-space'+(isAct?' on':'')+'" data-bind="rec" data-space="'+sp.id+'" style="--sc:'+sp.color+'">'+
                 '<div class="space-ico">'+esc(sp.icon||'✦')+'</div>'+
                 '<div class="space-name">'+esc(sp.name)+'</div>'+
                 '<div class="space-meta">今日 '+fmtMin(Rhythm.todaySpaceMinutes(sp.id))+'</div>'+
                 (isAct?'<div class="rec-live num" data-rec-t>'+fmtDur(now - acts[0].start)+'</div>':'')+
                 '<div style="display:flex;gap:8px;margin-top:4px">'+
                   '<button class="btn btn--small" style="flex:1" data-action="rhythm-iter" data-id="'+sp.id+'">可能性确定</button>'+
                   '<button class="btn btn--small '+(isAct?'btn--danger':'btn--primary')+'" style="flex:1" data-action="rhythm-rec" data-id="'+sp.id+'">'+(isAct?'停止':'可能性递归')+'</button>'+
                 '</div>'+
               '</div>';
        }
        h += '</div>';
      }
    }
    /* 时间轴日记已迁至「我们的共识」页 */
    h += '<div class="hint" style="font-size:12px;color:var(--text-2);margin-top:18px">📔 时间轴日记已搬到「我们的共识」页（长按右滑，或纯净页点顶部日期）</div>';
    h += '</section>';
    return h;
  },

      '<p style="font-size:12px;color:var(--text-2);margin-top:10px">你的所有数据只保存在当前浏览器的本地存储中，不会上传到任何服务器。换浏览器、换电脑或清除浏览器数据会导致数据丢失，请养成定期导出备份的习惯。</p>'+
    '</div></section>';
    return h;
  }
};
/* ══════════════════════════════════════════════════════════════
   9.5 自定义背景 / 覆盖模式
   ══════════════════════════════════════════════════════════════ */
function bgSrc(){
  const id = S.settings.bgImageId;
  return id ? (Store.getImage(id) || null) : null;
}
/* 把背景图/透明度/模糊度应用到背景层 */
function applyBg(){
  const el = document.getElementById('bg-layer');
  if(!el) return;
  const src = bgSrc();
  if(src){
    el.style.backgroundImage = 'url("'+src+'")';
    el.style.opacity = String((S.settings.bgOpacity ?? 45) / 100);
    el.style.filter = 'blur('+(S.settings.bgBlur ?? 0)+'px)';
    el.classList.remove('hidden');
  }else{
    el.classList.add('hidden');
  }
}
/* 看板娘立绘上传回调（压缩到1600px保存） */
function handleMascotImageFile(file){
  if(!file || !file.type || !file.type.startsWith('image/')){ UI.toast('请选择图片文件', 'err'); return; }
  UI.toast('压缩处理中…');
  compressImage(file, dataURL=>{
    if(!Store.saveImage('mascot', dataURL)){ UI.toast('存储空间不足', 'err'); return; }
    S.settings.mascotId = 'mascot';
    saveSettings();
    UI.closeModal();
    scheduleRender();
    UI.toast('看板娘立绘已更换');
  }, 1600);
}
/* 动画强度三档：完整 / 轻度（默认）/ 关闭 */
function applyAnimLevel(){
  const lv = S.settings.animLevel || 'light';
  document.body.classList.toggle('anim-off', lv==='off');
  document.body.classList.toggle('anim-light', lv==='light');
}
/* 背景图选择回调（压缩到1600px保存） */
function handleBgImageFile(file){
  if(!file || !file.type || !file.type.startsWith('image/')){ UI.toast('请选择图片文件', 'err'); return; }
  UI.toast('压缩处理中…');
  compressImage(file, dataURL=>{
    if(S.settings.bgImageId) Store.del('img:'+S.settings.bgImageId);
    if(!Store.saveImage('img_bg', dataURL)){ UI.toast('存储空间不足', 'err'); return; }
    S.settings.bgImageId = 'img_bg';
    if(S.settings.bgOpacity==null) S.settings.bgOpacity = 45;
    if(S.settings.bgBlur==null) S.settings.bgBlur = 0;
    saveSettings();
    applyBg();
    scheduleRender();
    UI.toast('背景已设置');
  }, 1600);
}
/* 当前浏览器名（用于设置页展示） */
function browserName(){
  try{
    const ua = navigator.userAgent || '';
    if(ua.includes('Edg')) return 'Edge';
    if(ua.includes('Chrome')) return 'Chrome';
    if(ua.includes('Firefox')) return 'Firefox';
    if(ua.includes('Safari')) return 'Safari';
    return '浏览器';
  }catch(e){ return '未知'; }
}

/* ══════════════════════════════════════════════════════════════
   9.6 看板娘气泡提醒 Bubbles（纯屏顶部，点击跳转对应页面）
   ══════════════════════════════════════════════════════════════ */
const Bubbles = {
  queue:[],            // 待显示：{text, sub, go}  go=回调（点击时执行）
  seen:{},             // 去重：key → true（同一天只提醒一次）
  shownUntil:0,        // 当前气泡的自动消失时刻
  active:null,
  push(text, opt){
    opt = opt || {};
    const key = opt.key || text;
    if(this.seen[key]) return;
    this.seen[key] = true;
    this.queue.push({text, sub:opt.sub||'', go:opt.go||null});
    if(this.queue.length>4) this.queue.shift();
    this.render();
  },
  /* 把当前待显示的一条画到纯净页（非纯净页时挂起，回纯净页由 renderView 补画） */
  render(){
    const root = document.getElementById('view-root');
    const br = root ? root.querySelector('#bubble-root') : null;
    if(!br){ return; }                       // 不在纯净页，暂不显示
    if(!this.active){
      if(this.queue.length) this.active = this.queue.shift();
      else { br.classList.add('hidden'); br.innerHTML=''; return; }
    }
    const b = this.active;
    /* 每次都重画：view-root 整体重渲染会抹掉气泡标记，必须随渲染重建 */
    br.innerHTML = '<div class="mascot-bubble" role="button" aria-label="提醒">'+
      (b.sub ? '<div style="font-size:10.5px;color:var(--accent);font-weight:700;letter-spacing:1px;margin-bottom:2px">'+esc(b.sub)+'</div>' : '')+
      '<div>'+esc(b.text)+'</div>'+
      (b.go ? '<div style="font-size:10.5px;color:var(--text-2);margin-top:3px">点我看详情 →</div>' : '')+
    '</div>';
    br.classList.remove('hidden');
    br.onclick = ()=>{ this.dismiss(); if(b.go) b.go(); };
    clearTimeout(this._t);
    this._t = setTimeout(()=>{ this.dismiss(); }, 9000);
  },
  dismiss(){
    this.active = null;
    const root = document.getElementById('view-root');
    const br = root ? root.querySelector('#bubble-root') : null;
    if(br){ br.innerHTML=''; br.classList.add('hidden'); }
    if(this.queue.length) this.render();     // 排队的下一条顶上
  }
};
/* 场景提醒的触发点集合（在 Rhythm / Alarms / tick 中调用） */
function bubbleScene(key, text, go, sub){
  if(typeof Bubbles!=='undefined') Bubbles.push(text, {key, go, sub});
}

/* ══════════════════════════════════════════════════════════════
   9.55 看板娘互动 Mascot（单击立绘：反应动画+台词气泡+爱心粒子+养成入口按钮）
   ══════════════════════════════════════════════════════════════ */
const Mascot = {
  lines:['今天也要一起加油哦~','摸摸头！','有什么事都可以交给我！','记得喝水哦，指挥官','要开始新的可能性了吗？','休息一下也没关系~','你的努力我都看在眼里！','今天想做什么呢？'],
  tap(){
    if(S.view!=='home') return;
    const el = document.getElementById('mascot');
    if(!el) return;
    /* 反应动画：随机跳一跳 / 软软一挤（播完移除，呼吸浮动恢复） */
    const cls = Math.random()<0.5?'mascot-hop':'mascot-squish';
    el.classList.remove('mascot-hop','mascot-squish');
    void el.offsetWidth;
    el.classList.add(cls);
    setTimeout(()=>el.classList.remove(cls), 700);
    /* 台词气泡 */
    this.say(this.lines[Math.floor(Math.random()*this.lines.length)], 2600);
    /* 爱心粒子 */
    this.hearts();
    /* 角色养成入口按钮 + 大小/位置调节条（几秒后收起） */
    this.showGrowBtn();
    this.showCtrls();
  },
  say(text, ms){
    const zone = document.querySelector('#view-root .mascot-zone');
    if(!zone) return;
    let b = zone.querySelector('.mascot-chat');
    if(!b){
      b = document.createElement('div');
      b.className = 'mascot-chat';
      zone.appendChild(b);
    }
    b.textContent = text;
    b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
    clearTimeout(this._sayT);
    this._sayT = setTimeout(()=>{ b.classList.remove('show'); }, ms || 2600);
  },
  hearts(){
    const zone = document.querySelector('#view-root .mascot-zone');
    if(!zone) return;
    const em = ['💗','💙','✨','💛'];
    for(let i=0;i<5;i++){
      const s = document.createElement('span');
      s.className = 'mascot-heart';
      s.textContent = em[Math.floor(Math.random()*em.length)];
      s.style.left = (38+Math.random()*24)+'%';
      s.style.bottom = (56+Math.random()*16)+'%';
      s.style.animationDelay = (i*0.07)+'s';
      zone.appendChild(s);
      setTimeout(()=>s.remove(), 1800);
    }
  },
  showGrowBtn(){
    const zone = document.querySelector('#view-root .mascot-zone');
    if(!zone) return;
    let b = zone.querySelector('.grow-btn');
    if(!b){
      b = document.createElement('button');
      b.className = 'grow-btn';
      b.textContent = '角色养成';
      b.addEventListener('click', ()=>{ Actions['open-grow'](); });
      zone.appendChild(b);
    }
    clearTimeout(this._growT);
    b.classList.add('show');
    this._growT = setTimeout(()=>{ b.classList.remove('show'); }, 6000);
  },
  /* —— 大小 / 位置调节条（单击后浮现，几秒收起） —— */
  showCtrls(){
    const zone = document.querySelector('#view-root .mascot-zone');
    if(!zone) return;
    let c = zone.querySelector('.mascot-ctrl');
    if(!c){
      c = document.createElement('div');
      c.className = 'mascot-ctrl';
      c.innerHTML =
        '<div class="mc-pill"><button class="mc-b" data-kind="size" data-dir="m">−</button>'+
          '<span class="mc-lbl">大小</span>'+
          '<button class="mc-b" data-kind="size" data-dir="p">＋</button></div>'+
        '<div class="mc-pill"><span class="mc-lbl">按住立绘拖动位置</span></div>'+
        '<div class="mc-pill"><button class="mc-b" data-kind="reset">还原</button></div>';
      c.querySelectorAll('.mc-b').forEach(b=>{
        b.addEventListener('click', ()=>{ Mascot.adjust(b.dataset.kind, b.dataset.dir); });
      });
      zone.appendChild(c);
    }
    this.refreshCtrlTimer();
  },
  /* 延长调节条显示（拖动松手后继续可调） */
  refreshCtrlTimer(){
    const c = document.querySelector('#view-root .mascot-ctrl');
    if(!c) return;
    c.classList.add('show');
    const m = document.getElementById('mascot'); if(m) m.classList.add('adjust');
    clearTimeout(this._ctrlT);
    this._ctrlT = setTimeout(()=>{
      c.classList.remove('show');
      const m2 = document.getElementById('mascot'); if(m2) m2.classList.remove('adjust');
    }, 8000);
  },
  /* —— 拖动立绘移动位置（调节模式） —— */
  isAdjustMode(){
    const c = document.querySelector('#view-root .mascot-ctrl');
    return !!(c && c.classList.contains('show'));
  },
  dragStart(x, y){
    const p = S.settings.mascotPos || {dx:0, dy:0};
    this._drag = { x0:x, y0:y, dx0:p.dx, dy0:p.dy };
  },
  dragMove(x, y){
    if(!this._drag) return;
    const w = window.innerWidth || 390, h = window.innerHeight || 844;
    S.settings.mascotPos = {
      dx: clamp(this._drag.dx0 + (x - this._drag.x0)/w*100, -32, 32),
      dy: clamp(this._drag.dy0 + (y - this._drag.y0)/h*100, -32, 32)
    };
    this.applyPos();
  },
  dragEnd(moved){
    this._drag = null;
    if(moved < 10){ Mascot.tap(); return; }      // 没怎么动 = 算单击互动
    saveSettings();
    this.refreshCtrlTimer();
  },
  /* 调节大小（0.6~1.6，步进0.1）与位置（±32vw/vh，步进2） */
  adjust(kind, dir){
    if(kind==='reset'){
      S.settings.mascotScale = 1;
      S.settings.mascotPos = {dx:0, dy:0};
    }else if(kind==='size'){
      const s = clamp((S.settings.mascotScale||1) + (dir==='p'?0.1:-0.1), 0.6, 1.6);
      S.settings.mascotScale = Math.round(s*10)/10;
    }else{
      const p = {...(S.settings.mascotPos||{dx:0, dy:0})};
      if(dir==='left') p.dx -= 2;
      else if(dir==='right') p.dx += 2;
      else if(dir==='up') p.dy -= 2;
      else p.dy += 2;
      p.dx = clamp(p.dx, -32, 32);
      p.dy = clamp(p.dy, -32, 32);
      S.settings.mascotPos = p;
    }
    saveSettings();
    this.applyPos();
  },
  /* 把大小/位置直接应用到立绘（不整页重渲染，响应即时） */
  applyPos(){
    const el = document.querySelector('#view-root .mascot-pos');
    if(!el) return;
    const s = S.settings.mascotScale||1, p = S.settings.mascotPos||{dx:0, dy:0};
    el.style.transform = 'translate('+p.dx+'vw,'+p.dy+'vh) scale('+s+')';
  }
};

/* ══════════════════════════════════════════════════════════════
   9.7 节律操控台 Console（双击呼出 · 猫耳时段卡 · 空间栏 · 投放区）
   ══════════════════════════════════════════════════════════════ */
const Console = {
  lastTouch:0,           // 用户刚碰过面板的时间（拖动/滚动时暂停每秒刷新）
  hold:0,                // 正被拖拽的三角（暂停每秒刷新）
  html(){ return '<div class="console'+(this._anim?' sheet-in':'')+'">'+
    '<div class="console-grab"></div>'+
    '<div class="console-head">'+
      '<div class="console-title">节律表操控台</div>'+
      '<button class="ctab'+(S.consTab==='slots'?' on':'')+'" data-action="cons-tab" data-tab="slots">自流转</button>'+
      '<button class="ctab'+(S.consTab==='spaces'?' on':'')+'" data-action="cons-tab" data-tab="spaces">空间</button>'+
      '<button class="icon-btn" data-action="open-settings" aria-label="设置">⚙</button>'+
      '<button class="icon-btn" data-action="cons-close" aria-label="收起操控台">✕</button>'+
    '</div>'+
    '<div class="console-body">'+(S.consTab==='slots' ? this.slotsHtml() : this.spacesHtml())+'</div>'+
  '</div>'; },
  open(){ S.consOpen = true; this.lastTouch = Date.now(); this._anim = true; this.render(); },
  close(){ S.consOpen = false; S.sbOpen = false;
    const el = document.getElementById('console-root'); if(el) el.innerHTML=''; },
  toggle(){ S.consOpen ? this.close() : this.open(); },
  render(){
    if(!S.consOpen) return;
    const el = document.getElementById('console-root');
    if(!el) return;
    el.innerHTML = this.html();
    this._anim = false;                      // 滑入动画只在「打开」这一次播放
    this._sig = this.sig(Date.now());        // 记录签名，避免下一秒 tick 立刻重绘（闪烁来源）
    this.bind();
  },
  /* 每秒定向刷新：计时数字原地更新；状态变化时才整体重画（保留滚动位置） */
  tick(now){
    if(!S.consOpen) return;
    const root = document.getElementById('console-root');
    if(!root) return;
    root.querySelectorAll('[data-rec-t]').forEach(el=>{
      const m = Rhythm.activeManual();
      setText(el, m ? fmtDur(now - m.start) : '--');
    });
    if(this.hold || now - this.lastTouch < 600) return;
    const sig = this.sig(now);
    if(sig !== this._sig){ this._sig = sig; this.render(); }
  },
  /* 面板内容签名：时段/跳过/进行中任一变化 → 触发重画 */
  sig(now){
    const dk = D.dateKey(now);
    const doc = dayDoc(dk);
    const slots = [...(doc.autoSchedules||[])].sort((a,b)=>a.start<b.start?-1:1);
    let s = S.consTab;
    for(const slot of slots){
      const st = this.slotState(slot, doc, now);
      s += '|'+slot.id+':'+slot.start+'-'+slot.end+':'+st.key+(st.live?':L':'');
    }
    const m = Rhythm.activeManual();
    if(m) s += '|man:'+m.spaceId;
    return s;
  },
  /* 时段卡状态机（与渲染共用，保证状态一致） */
  slotState(slot, doc, now){
    const today = D.dateKey(now);
    const dayStart = D.dkToTs(today);
    const s0 = D.hhmmToTs(dayStart, slot.start), e0 = D.hhmmToTs(dayStart, slot.end);
    const skipped = !!((doc.slotSkips||{})[slot.id]);
    const active = S.sessions.find(x=>x.end==null && x.scheduleId===slot.id);
    const cov = Rhythm.slotCoverage(today, slot.id, s0);
    if(skipped) return {key:'skip', face:'🚫', stTxt:'今日跳过', stCls:'st-idle', live:false};
    if(active) return {key:'live', face:'🐱', stTxt:'进行中', stCls:'st-live', live:true};
    if(now >= e0){
      if(cov >= e0-1000) return {key:'done', face:'✅', stTxt:'已结束', stCls:'st-done', live:false};
      if(cov > s0) return {key:'partial', face:'🏁', stTxt:'部分未生效', stCls:'st-warn', live:false};
      return {key:'miss', face:'⚠️', stTxt:'未生效', stCls:'st-warn', live:false};
    }
    if(now >= s0) return {key:'quota', face:'⚠️', stTxt:'额度不足', stCls:'st-warn', live:false};
    return {key:'idle', face:'😴', stTxt:'未开始', stCls:'st-idle', live:false};
  },
  bind(){
    const body = document.querySelector('#console-root .console-body');
    if(!body) return;
    /* 用户碰到面板（滚动/点按）→ 暂停每秒重画，避免打断操作 */
    body.addEventListener('pointerdown', ()=>{ this.lastTouch = Date.now(); }, {passive:true});
    body.querySelectorAll('.sc-tri').forEach(tri=>{
      tri.addEventListener('pointerdown', e=>{ this.pullStart(e, tri); }, {passive:false});
    });
    body.querySelectorAll('.sb-card[draggable]').forEach(card=>{
      card.addEventListener('pointerdown', e=>{ this.dragStart(e, card); }, {passive:false});
    });
    /* 猫耳与其它按钮走 data-action 委托，无需单独绑定 */
  },
  /* ──────── Tab1 自流转时段卡列表 ──────── */
  slotsHtml(){
    const now = Date.now();
    const today = D.dateKey(now);
    const doc = dayDoc(today);
    const slots = [...(doc.autoSchedules||[])].sort((a,b)=>a.start<b.start?-1:1);
    const manual = Rhythm.activeManual();
    let h = '';
    /* 手动递归卡（若正在跑） */
    if(manual){
      const sp = spaceById(manual.spaceId);
      h += this.manualCardHtml(manual, sp);
    }
    if(slots.length===0){
      h += '<div class="console-empty"><div class="big">🐾</div>今天还没有自流转日程<br><span style="font-size:12px;color:var(--text-2)">设定课程表式的自动递归，到点看板娘会替你开始</span></div>';
    }else{
      for(const slot of slots) h += this.slotCardHtml(slot, doc);
    }
    if(S.spaces.some(x=>!x.archived)){
      h += '<button class="btn btn--block" data-action="slot-form" style="margin:2px 0 4px">＋ 添加自流转日程</button>';
    }else{
      h += '<button class="btn btn--block" data-action="goto-spaces" style="margin:2px 0 4px">先创建一个可能性空间 →</button>';
    }
    h += '<div class="hint" style="font-size:11px;color:var(--text-2);text-align:center;padding:4px 8px 6px">'+
         '猫耳 ＋/− 调时长 · 拉右上角三角=提前结束 · 拉左下角三角=停止本段（推回原位取消）</div>';
    return h;
  },
  manualCardHtml(m, sp){
    const now = Date.now();
    return '<div class="slot-card sc-live manual">'+
      '<div class="sc-row">'+
        '<div class="sc-face">🐱</div>'+
        '<div class="sc-mid">'+
          '<div class="sc-name">'+esc(sp?sp.name:'手动递归')+' <span class="badge">手动</span></div>'+
          '<div class="sc-time num">已专注 <span data-rec-t>'+fmtDur(now-m.start)+'</span></div>'+
        '</div>'+
        '<span class="sc-st st-live">进行中</span>'+
      '</div>'+
      '<div class="sc-mini"><button class="icon-btn" data-action="stop-manual" aria-label="停止递归">⏹</button></div>'+
    '</div>';
  },
  slotCardHtml(slot, doc){
    const now = Date.now();
    const today = D.dateKey(now);
    const sp = spaceById(slot.spaceId);
    const dayStart = D.dkToTs(today);
    const s = D.hhmmToTs(dayStart, slot.start), e = D.hhmmToTs(dayStart, slot.end);
    const st = this.slotState(slot, doc, now);
    const live = st.live;
    const color = sp ? sp.color : '#8A93A3';
    const left = ((s - dayStart)/86400000*100);
    const w = Math.max(0.8, ((e - s)/86400000*100));
    return '<div class="slot-card sc-card'+(live?' sc-live':'')+(st.key==='done'?' sc-done':'')+'" data-slot="'+slot.id+'">'+
      /* 猫耳朵（＋10 / －10 分钟）——拉三角时会弹大 */
      '<div class="sc-ears">'+
        '<button class="sc-ear r" data-action="cons-ear" data-id="'+slot.id+'" data-dir="p" aria-label="延长10分钟"><span class="ear-in">＋<small>10分</small></span></button>'+
        '<button class="sc-ear l" data-action="cons-ear" data-id="'+slot.id+'" data-dir="m" aria-label="缩短10分钟"><span class="ear-in">－<small>10分</small></span></button>'+
      '</div>'+
      '<div class="sc-row">'+
        '<div class="sc-face">'+st.face+'</div>'+
        '<div class="sc-mid">'+
          '<div class="sc-name">'+esc(sp?sp.name:'已删除空间')+'</div>'+
          '<div class="sc-time num">'+esc(slot.start)+' ~ '+esc(slot.end)+'</div>'+
          (slot.note?'<div class="sc-extra">'+esc(slot.note)+'</div>':'')+
        '</div>'+
        '<span class="sc-st '+st.stCls+'">'+st.stTxt+'</span>'+
      '</div>'+
      /* 时段轨道：色段 + 现在线 + 拉扯时的幽灵终点线 */
      '<div class="sc-track" data-track>'+
        '<div class="sc-band" style="left:'+left.toFixed(2)+'%;width:'+w.toFixed(2)+'%;background:'+color+'"></div>'+
        (s<=now && now<=e || live ? '<div class="sc-nowline" style="left:'+(((now-dayStart)/86400000)*100).toFixed(2)+'%"></div>' : '')+
        '<div class="sc-ghost sc-ghost-r"></div><div class="sc-ghost sc-ghost-l"></div>'+
        '<div class="sc-label sc-label-r"></div><div class="sc-label sc-label-l"></div>'+
      '</div>'+
      /* 三角拉扯柄：右上=提前结束（把终点拉近），左下=停止本段（拉出猫耳，推回取消） */
      (live ? '<div class="sc-tri r" data-pull="end" aria-label="提前结束"><span class="t-arrow">◤</span></div>'+
               '<div class="sc-tri l" data-pull="stop" aria-label="停止本段"><span class="t-arrow">◣</span></div>'
           : '')+
      '<div class="sc-mini">'+
        '<button class="icon-btn" data-action="slot-form" data-id="'+slot.id+'" aria-label="编辑">✎</button>'+
        (st.key==='skip' ? '<button class="icon-btn" data-action="cons-ear" data-id="'+slot.id+'" data-dir="p" style="background:var(--accent-soft);color:var(--accent-dark)" aria-label="恢复本段">↻</button>' : '')+
      '</div>'+
    '</div>';
  },
  /* ──────── Tab2 空间栏 + 投放区 ──────── */
  spacesHtml(){
    const active = S.spaces.filter(x=>!x.archived);
    const m = Rhythm.activeManual();
    let h = '<div class="sb-head"><div class="t">可能性空间</div>'+
      '<span class="hint" style="font-size:11px">长按卡片拖到下方开始递归</span></div>';
    if(active.length===0){
      h += '<div class="console-empty"><div class="big">◇</div>还没有可能性空间<br>创建你的第一个兴趣空间吧</div>';
      h += '<button class="btn btn--primary btn--block" data-action="add-space">＋ 新建空间</button>';
      return h;
    }
    h += '<div class="sb-scroll" data-sb>';
    for(const sp of active){
      h += '<div class="sb-card" draggable="true" data-space="'+sp.id+'" style="--sc:'+sp.color+'">'+
             '<div class="sb-ico">'+esc(sp.icon||'✦')+'</div>'+
             '<div class="sb-name">'+esc(sp.name)+'</div>'+
             '<div style="font-size:10px;color:var(--text-2)"><span class="num">'+fmtMin(Rhythm.todaySpaceMinutes(sp.id))+'</span></div>'+
           '</div>';
    }
    h += '<button class="sb-card add" data-action="add-space">＋<span style="font-size:11px">新空间</span></button>';
    h += '</div>';
    /* 投放区：空闲=拖入高亮；进行中=点击停止 */
    if(m){
      const sp = spaceById(m.spaceId);
      h += '<button class="drop-pad live" data-action="stop-manual">'+
             '<span class="pulse-dot" style="background:var(--green)"></span> 正在递归：'+esc(sp?sp.name:'?')+
             ' · <span class="num" data-rec-t style="font-variant-numeric:tabular-nums">'+fmtDur(Date.now()-m.start)+'</span>'+
             '<div class="dp-sub">点击停止</div></button>';
    }else{
      h += '<div class="drop-pad" id="drop-pad">拖到这里 → 可能性递归<div class="dp-sub">消耗节律递归时间，积累到空间名下</div></div>';
    }
    return h;
  },
  /* —— 猫耳 ±10 分钟（改自己设定的时间段，立即生效） —— */
  ear(slotId, dir){
    const now = Date.now();
    const today = D.dateKey(now);
    const doc = dayDoc(today);
    const slot = (doc.autoSchedules||[]).find(x=>x.id===slotId);
    if(!slot){ UI.toast('日程不存在', 'err'); return; }
    const m2 = v => (Math.floor(v/60))+':'+pad2(v%60);
    const sm = (+slot.start.slice(0,2))*60+(+slot.start.slice(3,5));
    let em = (+slot.end.slice(0,2))*60+(+slot.end.slice(3,5));
    const nm = em + (dir==='p'?10:-10);
    if(nm <= sm+10){ UI.toast('时段最短 10 分钟', 'err'); return; }
    if(nm > 1430){ UI.toast('最晚到 23:50（不跨天）', 'err'); return; }
    slot.end = m2(nm);
    /* 用户手动改动后：取消“今日跳过”，把缺失的区间补算回来 */
    if(doc.slotSkips && doc.slotSkips[slot.id]){
      delete doc.slotSkips[slot.id];
      if(Object.keys(doc.slotSkips).length===0) delete doc.slotSkips;
    }
    saveDay(today);
    Rhythm.reconcileDay(today);
    UI.toast(dir==='p' ? '已延长到 '+slot.end : '已缩短到 '+slot.end);
    scheduleRender();
  },
  /* —— 右下三角：拉近 = 提前结束本次 —— */
  pullStart(e, tri){
    e.preventDefault();
    const card = tri.closest('.sc-card');
    if(!card) return;
    const track = card.querySelector('[data-track]');
    if(!track) return;
    const rect = track.getBoundingClientRect();
    const now = Date.now();
    const today = D.dateKey(now);
    const doc = dayDoc(today);
    const slotId = card.dataset.slot;
    const slot = (doc.autoSchedules||[]).find(x=>x.id===slotId);
    if(!slot) return;
    const active = S.sessions.find(x=>x.end==null && x.scheduleId===slotId);
    if(!active) return;
    const dayStart = D.dkToTs(today);
    const pxPerMin = rect.width / 1440;
    const kind = tri.dataset.pull;                       // 'end' 提前结束 / 'stop' 停止本段
    const originX = e.clientX, originY = e.clientY;
    const band = card.querySelector('.sc-band');
    const eMin = (active.start - dayStart)/60000;        // 起始即已开始
    const orgEndMin = (doc.slotSkips&&doc.slotSkips[slotId]) ? null : Math.min(1440, ((D.hhmmToTs(dayStart, slot.end)-dayStart)/60000));
    Console.hold = Date.now();
    card.classList.add('pulling-r');
    /* 按住后：拉出猫耳、显示引导 */
    const ghost = card.querySelector('.sc-ghost-'+(kind==='end'?'r':'l'));
    const label = card.querySelector('.sc-label-'+(kind==='end'?'r':'l'));
    const show = (x, y) => {
      const dx = x - originX;
      let px = originX + dx;
      px = Math.min(rect.right, Math.max(rect.left, px));
      const frac = Math.max(0, Math.min(1, (px - rect.left) / rect.width));
      const targetMin = Math.round(frac * 1440);
      const ghostLeft = ((targetMin/1440)*100).toFixed(2);
      ghost.style.left = ghostLeft+'%';
      ghost.style.display = 'block';
      card.style.setProperty('--pull-commit', String(Math.abs(dx) > rect.width*0.12 ? 1 : 0));
      let msg;
      if(kind==='end'){
        msg = Math.abs(dx) > rect.width*0.12 ? '松手=提前结束到 '+D.tsToHHMM(dayStart+targetMin*60000) : '拖到 ← 提前结束';
      }else{
        msg = Math.abs(dx) > rect.width*0.12 ? '松手=停止本段并跳过' : '拖开并松手 = 停止';
      }
      label.textContent = msg;
      label.style.left = Math.min(rect.width-70, Math.max(0, px-rect.left))+'px';
    };
    show(e.clientX, e.clientY);
    const move = ev => {
      ev.preventDefault();
      show(ev.clientX, ev.clientY);
    };
    const up = ev => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      Console.hold = 0;
      card.classList.remove('pulling-r');
      ghost.style.display = '';
      label.style.display = '';
      const dx = ev.clientX - originX;
      if(Math.abs(dx) <= rect.width*0.12){ return; }     // 没拖够 → 还原（继续递归）
      const dayStart2 = D.dkToTs(today);
      const frac = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
      const targetMin = Math.round(frac * 1440);
      const targetTs = dayStart2 + targetMin*60000;
      const slot2 = (doc.autoSchedules||[]).find(x=>x.id===slotId);
      const act2 = S.sessions.find(x=>x.end==null && x.scheduleId===slotId);
      if(!act2) return;
      if(kind==='end'){
        /* 提前结束：在本刻收尾（结束点必须在开始之后） */
        const endTs = Math.max(act2.start + 1000, Math.min(Date.now(), targetTs));
        Rhythm.finalizeSessionsOnDay(today, [act2.id], endTs, 'earlyEnd');
        UI.toast('已提前结束 '+D.tsToHHMM(endTs));
        /* 若结束点早于槽位结束，标记今日跳过，防止引擎立刻重开 */
        const doc2 = dayDoc(today);
        if(endTs < D.hhmmToTs(dayStart2, slot2.end) - 1000){
          doc2.slotSkips = doc2.slotSkips || {};
          doc2.slotSkips[slotId] = true;
          saveDay(today);
        }
        scheduleRender();
      }else{
        /* 停止本段：终结当前并标记今日跳过 */
        Rhythm.finalizeSessionsOnDay(today, [act2.id], Date.now(), 'manual');
        const doc2 = dayDoc(today);
        doc2.slotSkips = doc2.slotSkips || {};
        doc2.slotSkips[slotId] = true;
        saveDay(today);
        UI.toast('已停止本段，今日跳过（猫耳 ＋ 可恢复）');
        scheduleRender();
      }
    };
    window.addEventListener('pointermove', move, {passive:false});
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  },
  /* —— 拖空间卡 → 投放区开始手动递归 —— */
  dragStart(e, card){
    if(card.classList.contains('add')) return;
    e.preventDefault();
    const spId = card.dataset.space;
    const rect = card.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const offX = e.clientX - rect.left, offY = e.clientY - rect.top;
    Console.hold = Date.now();
    /* 幽灵卡必须挂在 body 下：操控台的 backdrop-filter 会生成包含块，
       让 fixed 定位相对面板生效并被 overflow 裁剪 → 手机上卡片“消失”的根源 */
    const ghost = card.cloneNode(true);
    ghost.classList.add('dragging');
    ghost.style.width = w+'px'; ghost.style.height = h+'px';
    ghost.style.left = rect.left+'px'; ghost.style.top = rect.top+'px';
    document.body.appendChild(ghost);
    card.style.opacity = '.35';
    const pad = document.getElementById('drop-pad');
    const move = ev => {
      ev.preventDefault();
      ghost.style.left = (ev.clientX - offX)+'px';
      ghost.style.top  = (ev.clientY - offY)+'px';
      if(pad){
        const pr = pad.getBoundingClientRect();
        const over = ev.clientX>pr.left && ev.clientX<pr.right && ev.clientY>pr.top && ev.clientY<pr.bottom;
        pad.classList.toggle('hot', over);
      }
    };
    const up = ev => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      Console.hold = 0;
      ghost.remove();
      card.style.opacity = '';
      if(pad) pad.classList.remove('hot');
      if(pad){
        const pr = pad.getBoundingClientRect();
        const over = ev.clientX>pr.left && ev.clientX<pr.right && ev.clientY>pr.top && ev.clientY<pr.bottom;
        if(over){ Rhythm.manualStart(spId); }
      }
    };
    window.addEventListener('pointermove', move, {passive:false});
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  }
};

/* ══════════════════════════════════════════════════════════════
   9.8 手势引擎 Gestures（仅纯净页生效）
   双击=节律操控台 · 双击后左滑=空间栏 · 长按0.4s四向=导航页面
   ══════════════════════════════════════════════════════════════ */
const Gestures = {
  _t0:0, _x0:0, _y0:0, _mode:'none', _moved:0, _lastTap:0, _dblTapAt:0,
  _lastX:0, _lastY:0, _dir:null, _holdT:null,
  DIRS:{top:{label:'节律表',ico:'▲'}, bottom:{label:'待办',ico:'▼'}, left:{label:'空间',ico:'◀'}, right:{label:'我们的共识',ico:'▶'}},
  NAV:{top:'rhythm', bottom:'todos', left:'spaces', right:'summary'},
  init(){
    this._buildArrows();
    /* 挂在 document：操控台是 view-root 的兄弟节点，双击后左滑可能从面板上方区域起手 */
    document.addEventListener('pointerdown', e=>{ if(this._busy(e)) return; this._down(e); }, {passive:false});
    document.addEventListener('pointermove', e=>{ if(this._mode!=='hold' && this._mode!=='maybe' && this._mode!=='mdrag') return; e.preventDefault(); this._move(e); }, {passive:false});
    document.addEventListener('pointerup', e=>{ this._up(e); }, {passive:false});
    document.addEventListener('pointercancel', ()=>{ this._reset(); });
    window.addEventListener('resize', ()=>{ if(this._mode==='hold') this._buildArrows(); });
  },
  /* 是否命中“可交互区域”（按钮/输入/卡片等）：不抢它们的触摸 */
  _busy(e){
    if(S.view!=='home') return true;
    const el = e.target;
    if(el.closest && el.closest('[data-action], button, input, select, textarea, a, .console, .drop-pad, .sb-card, .sc-tri, .sc-ear')) return true;
    return false;
  },
  _down(e){
    const now = Date.now();
    if(e.pointerType!=='touch' && e.pointerType!=='mouse' && e.pointerType!=='pen') return;
    this._t0 = now; this._x0 = e.clientX; this._y0 = e.clientY;
    this._moved = 0; this._dir = null; this._mode = 'maybe';
    this._onMascot = !!(e.target.closest && e.target.closest('#mascot'));
    /* 调节模式（调节条可见）下按住立绘 = 直接拖动位置，不参与单击/双击/长按判定 */
    if(this._onMascot && typeof Mascot!=='undefined' && Mascot.isAdjustMode()){
      this._mode = 'mdrag';
      Mascot.dragStart(e.clientX, e.clientY);
      return;
    }
    this._holdT = setTimeout(()=>{
      if(this._mode!=='maybe') return;
      if(this._moved > 30) return;      // 手指轻微抖动不打断长按（手机常见）
      this._mode = 'hold';
      this._showArrows(e.clientX, e.clientY);
    }, 700);                            // 长按 0.7 秒判定成功
  },
  _move(e){
    const dx = e.clientX - this._x0, dy = e.clientY - this._y0;
    this._moved = Math.max(this._moved, Math.hypot(dx, dy));
    if(this._mode==='mdrag'){
      e.preventDefault();
      Mascot.dragMove(e.clientX, e.clientY);
      return;
    }
    if(this._mode==='hold'){
      e.preventDefault();
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'bottom':'top');
      this._dir = dir;
      this._highlight(dir, Math.max(Math.abs(dx), Math.abs(dy)));
    }else if(this._mode==='maybe' && this._moved > 30){
      /* 明确在拖动（不是长按）：若是「双击后的左滑」→ 切到空间栏 */
      clearTimeout(this._holdT);
      if(Date.now() - this._dblTapAt < 420 && dx < -52 && S.consOpen){
        this._reset();
        S.consTab = 'spaces';
        Console.render();
      }
    }
  },
  _up(e){
    if(this._mode==='mdrag'){
      this._mode = 'none';
      Mascot.dragEnd(this._moved);
      return;
    }
    if(this._mode==='hold'){
      clearTimeout(this._holdT);
      this._hideArrows();
      const d = this._dir;
      this._mode = 'none';
      if(d && Math.max(Math.abs(e.clientX-this._x0), Math.abs(e.clientY-this._y0)) >= 44){
        goView(Gestures.NAV[d]);                 // 长按 + 四向滑动 → 对应子页
        S.sumDay = null;
      }
      return;
    }
    if(this._mode!=='maybe'){ this._reset(); return; }
    clearTimeout(this._holdT);
    const moved = this._moved;
    this._mode = 'none';
    const quick = Date.now() - this._t0 < 320 && moved < 12;
    if(quick){
      const now2 = Date.now();
      if(now2 - this._lastTap < 300 && Math.hypot(e.clientX-this._lastX, e.clientY-this._lastY) < 42){
        /* 双击：呼出/收回节律操控台（记住时刻，供“双击后左滑”判定） */
        this._lastTap = 0;
        this._dblTapAt = now2;
        if(S.consOpen){ S.consOpen = false; Console.close(); }
        else{ S.consTab = 'slots'; Console.open(); }
        this._reset();
        return;
      }
      this._lastTap = now2; this._lastX = e.clientX; this._lastY = e.clientY;
      /* 单击：若上一个是双击即将到，暂存 */
      setTimeout(()=>{ if(this._lastTap && Date.now()-this._lastTap>330) this._lastTap = 0; }, 360);
      /* 单击看板娘：稍等确认不是双击（双击=呼出操控台，二者互不冲突），再触发互动 */
      if(this._onMascot){
        const tapAt = now2;
        setTimeout(()=>{
          if(this._lastTap === tapAt && typeof Mascot!=='undefined') Mascot.tap();
        }, 340);
      }
    }
    this._reset();
  },
  _reset(){
    if(this._mode==='mdrag'){ this._mode='none'; Mascot.dragEnd(Math.max(99, this._moved)); return; }
    this._mode='none'; this._dir=null; clearTimeout(this._holdT); this._hideArrows();
  },
  _buildArrows(){
    const root = document.getElementById('gesture-root');
    if(!root) return;
    root.innerHTML = Object.keys(this.DIRS).map(d=>{
      const o = this.DIRS[d];
      return '<div class="gv-arrow '+d+'" data-dir="'+d+'">'+
               '<div class="gv-ring">'+o.ico+'</div><div class="gv-txt">'+o.label+'</div>'+
             '</div>';
    }).join('')+
    '<div class="gv-hold"><span class="gv-hold-ring"></span></div>';
  },
  _showArrows(x, y){
    const root = document.getElementById('gesture-root');
    if(!root) return;
    root.classList.add('on');
    /* 长按成功圆圈：出现在按压点，由浅渐实 */
    const c = root.querySelector('.gv-hold');
    if(c){ c.style.left = x+'px'; c.style.top = y+'px'; }
  },
  _highlight(dir, len){
    const root = document.getElementById('gesture-root');
    if(!root) return;
    root.querySelectorAll('.gv-arrow').forEach(a=>{
      a.classList.toggle('show', a.dataset.dir===dir);
    });
    root.classList.toggle('active', len >= 44);
  },
  _hideArrows(){
    const root = document.getElementById('gesture-root');
    if(!root) return;
    root.classList.remove('on','active');
    root.querySelectorAll('.gv-arrow.show').forEach(a=>a.classList.remove('show'));
  }
};

/* ══════════════════════════════════════════════════════════════
   9.9 红色超时 / 闹钟 等场景 → 角色气泡提醒（只挑最紧要的）
   ══════════════════════════════════════════════════════════════ */
const Notify = {
  lastScan:0,
  tick(now){
    if(typeof Bubbles==='undefined') return;
    /* 6 秒扫一次最紧急待办：进入红色 → 提醒（同一条只提醒一次） */
    if(now - this.lastScan > 6000){
      this.lastScan = now;
      let urgent = null;
      for(const t of S.todos){
        if(t.archived || todoStatus(t, now)==='done') continue;
        const due = TodoLogic.dueAt(t, now);
        if(due==null) continue;
        const rem = due - now;
        const redAt = (t.thresholdRedMin ?? S.settings.defaultRedMinutes) * 60000;
        if(rem <= redAt){
          if(!urgent || due < TodoLogic.dueAt(urgent, now)) urgent = t;
        }
      }
      if(urgent){
        const sp = spaceById(urgent.spaceId);
        Bubbles.push('「'+urgent.title+'」进入红色倒计时，再不行动要超时了！', {
          key:'red-'+urgent.id, sub:sp?'来自「'+sp.name+'」':'最优先待办',
          go:()=>goView('todos')
        });
      }
    }
  }
};

/* 渲染入口：home=纯净看板娘页（无顶栏无静态UI），其余为带返回按钮的子页 */
const VIEW_TITLES = {home:'', summary:'我们的共识', todos:'事务待办', spaces:'可能性空间', rhythm:'节律表', settings:'设置', alarm:'闹钟', space:''};
function renderView(){
  const root = document.getElementById('view-root');
  const ae = document.activeElement;
  if(ae && root.contains(ae)){
    // 只有正在输入的输入框才需要保护焦点（重渲染会打断输入）。
    // 按钮被点击后保持焦点会无限推迟重渲染，表现为"点空白处才变化"——
    // 非输入元素先失焦再重建。
    const tag = ae.tagName;
    if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT'){ scheduleRender(); return; }
    try{ ae.blur(); }catch(e){}
  }
  const isPure = S.view==='home';
  let html;
  if(S.view==='space'){
    const sp = spaceById(S.spaceId);
    html = Views.spaceDetail();
    document.getElementById('hdr-title').textContent = sp ? sp.name : '空间';
  }else{
    html = Views[S.view] ? Views[S.view]() : '';
    document.getElementById('hdr-title').textContent = VIEW_TITLES[S.view]||'';
  }
  root.innerHTML = html;
  root.classList.toggle('pure', isPure);
  const hdr = document.getElementById('app-header');
  if(hdr) hdr.classList.toggle('hidden', isPure);
  document.getElementById('back-btn').classList.toggle('hidden', isPure);
  document.body.classList.toggle('pure-mode', isPure);
  /* 离开纯净页：收起操控台 / 空间栏，清手势残留；回纯净页时若有待显示气泡则补上
     （操控台自身按签名自更新，不随 renderView 重绘——重绘会重播动画=闪烁） */
  if(!isPure){
    S.consOpen = false; S.sbOpen = false;
    const cr = document.getElementById('console-root'); if(cr) cr.innerHTML = '';
  }else{
    if(typeof Bubbles !== 'undefined') Bubbles.render();
  }
  collectBindings();
}

/* 从存储重读全部实体（导入/多标签页同步用），含旧数据迁移 */
function refreshFromStorage(){
  S.meta = Store.get('meta', {});
  S.settings = {...CONFIG.DEFAULT_SETTINGS, ...Store.get('settings', {})};
  S.spaces = Store.get('spaces', []);
  S.todos = Store.get('todos', []);
  S.catnotes = Store.get('catnotes', []);
  S.sessions = Store.get('sessions', []);
  S.alarms = Store.get('alarms', []);
  S.alarmFired = {};
  S.days.clear();
  S.confirmMap.clear();
  let todosChanged = false;
  for(const t of S.todos){
    /* 迁移1：旧版单条完成记录 lastCompletedKey → 按天集合 doneKeys */
    if(!Array.isArray(t.doneKeys)){
      t.doneKeys = t.lastCompletedKey != null ? [t.lastCompletedKey] : [];
      todosChanged = true;
    }
    /* 迁移2：变红默认阈值 120→30 分钟（仅迁移从未自定义过的卡片） */
    if(t.thresholdRedMin===120 && t.thresholdYellowMin===240){
      t.thresholdRedMin = 30;
      todosChanged = true;
    }
  }
  if(todosChanged) Store.set('todos', S.todos);
}

/* ══════════════════════════════════════════════════════════════
   10. Boot 启动
   ══════════════════════════════════════════════════════════════ */
function boot(){
  const p = Store.init();
  if(Store.ready) bootMain();        // 兼容模式（localStorage）同步启动
  else p.then(bootMain);             // 大容量模式（IndexedDB）初始化完成后启动
}
function bootMain(){
  S.memoryMode = !Store.ok;
  refreshFromStorage();
  if(!S.meta.createdAt){ S.meta = {schemaVersion:CONFIG.SCHEMA, appVersion:CONFIG.VERSION, createdAt:Date.now(), lastSavedAt:Date.now()}; Store.set('meta', S.meta); }
  S.lastDay = D.dateKey(Date.now());
  S.lastHb = Date.now();
  Store.set('heartbeat', {lastActiveAt:S.lastHb});
  gcImages();               // 回收无引用图片
  reconcileNow();
  applyBg();                // 应用自定义背景
  applyAnimLevel();         // 动画强度三档
  renderView();
  setInterval(tick, 1000);

  /* 事件绑定 */
  const viewRoot = document.getElementById('view-root');
  viewRoot.addEventListener('click', e=>{
    const t = e.target.closest('[data-action]');
    if(!t) return;
    if(t.dataset.action==='open-space'){ goSpace(t.dataset.id); return; }
    Actions[t.dataset.action] && Actions[t.dataset.action](t, e);
  });
  viewRoot.addEventListener('input', e=>{
    const t = e.target.closest('[data-oninput]');
    if(t && Actions[t.dataset.oninput]) Actions[t.dataset.oninput](t, e);
  });
  viewRoot.addEventListener('change', e=>{
    const t = e.target.closest('[data-onchange]');
    if(t && Actions[t.dataset.onchange]) Actions[t.dataset.onchange](t, e);
  });
  /* 顶栏按钮（返回/设置） */
  document.getElementById('app-header').addEventListener('click', e=>{
    const t = e.target.closest('[data-action]');
    if(t && Actions[t.dataset.action]) Actions[t.dataset.action](t, e);
  });
  /* 操控台/手势层内的事件（面板独立于 view-root，需单独分发） */
  const consoleRoot = document.getElementById('console-root');
  if(consoleRoot){
    consoleRoot.addEventListener('click', e=>{
      const t = e.target.closest('[data-action]');
      if(!t) return;
      if(t.dataset.action==='open-space'){ goSpace(t.dataset.id); return; }
      Actions[t.dataset.action] && Actions[t.dataset.action](t, e);
    });
    consoleRoot.addEventListener('input', e=>{
      const t = e.target.closest('[data-oninput]');
      if(t && Actions[t.dataset.oninput]) Actions[t.dataset.oninput](t, e);
    });
  }
  if(typeof Gestures !== 'undefined') Gestures.init();   // 纯净页手势：双击/长按四向
  const modalRoot = document.getElementById('modal-root');
  modalRoot.addEventListener('click', e=>{
    const t = e.target.closest('[data-action]');
    if(!t) return;
    if(t.dataset.action==='modal-close'){ UI.closeModal(); return; }
    if(Actions[t.dataset.action]) Actions[t.dataset.action](t, e);
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape') UI.closeModal();
  });
  document.getElementById('file-input').addEventListener('change', e=>{
    const cb = S.pendingFileCb; S.pendingFileCb = null;
    if(cb && e.target.files && e.target.files[0]) cb(e.target.files[0]);
  });
  /* 首次交互解锁音频（闹钟提示音需要） */
  document.addEventListener('pointerdown', function unlockAudio(){ Alarms.unlockAudio(); }, {once:true});
  window.addEventListener('beforeunload', ()=>{ Store.set('heartbeat', {lastActiveAt:Date.now()}); });
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden) return;
    const back = ()=>{
      Store.set('heartbeat', {lastActiveAt:Date.now()});
      reconcileNow();
      scheduleRender();
    };
    if(Store.mode==='idb') Store.reload().then(back);   // 大容量模式：回到前台先重读新仓库
    else back();
  });
  /* 多标签页同步：大容量模式靠 BroadcastChannel + localStorage 哨兵键，兼容模式靠 storage 事件 */
  if(Store.bc) Store.bc.onmessage = ()=>{ Store.reload().then(()=>{ refreshFromStorage(); scheduleRender(); UI.toast('检测到数据在另一个标签页被修改，已同步'); }); };
  window.addEventListener('storage', e=>{
    if(e.key && e.key.startsWith(CONFIG.PREFIX)){
      const sync = ()=>{
        refreshFromStorage();
        scheduleRender();
        UI.toast('检测到数据在另一个标签页被修改，已同步');
      };
      if(Store.mode==='idb') Store.reload().then(sync);
      else sync();
    }
  });
  UI.toast('欢迎来到'+CONFIG.APP_NAME);
}

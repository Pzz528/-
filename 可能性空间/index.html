    S.settings.herShake = Object.assign({}, S.settings.herShake || {}, {asked: now});
    saveSettings();
    return Her.say('shakeAsk', Her.ctx(now), {key:'her-shake-ask', sub:'她', go:()=>Shake.request()});
  },
  request(cb){
    let done = false;
    const once = r => {
      if(done) return; done = true;
      S.settings.herShake = {on: r === 'granted', asked: Date.now()};
      saveSettings();
      if(r === 'granted'){
        this.attach();
        if(typeof Her !== 'undefined') Her.reply(Her.voice('shakeOk', Her.ctx()), {key:'her-shake-ok'});
      }
      if(cb) cb(r);
    };
    try{
      const p = DeviceMotionEvent.requestPermission();
      if(p && p.then) p.then(once, ()=>once('error'));
      else if(typeof p === 'string') once(p);
      else once('error');
    }catch(e){ once('error'); }
  },
  attach(){
    if(this._on || !this.supported()) return false;
    try{
      window.addEventListener('devicemotion', e=>this._motion(e), {passive:true});
      this._on = true;
      return true;
    }catch(e){ return false; }
  },
  _motion(e){
    const a = e && (e.accelerationIncludingGravity || e.acceleration);
    if(!a) return false;
    const mag = Math.sqrt((a.x||0)*(a.x||0) + (a.y||0)*(a.y||0) + (a.z||0)*(a.z||0));
    if(mag < CONFIG.SENSE.SHAKE_TH) return false;
    const now = Date.now();
    if(now - this._last < CONFIG.SENSE.SHAKE_GAP) return false;   // 一次摇动只记一下
    this._last = now;
    if(now - this._t > CONFIG.SENSE.SHAKE_RESET) this._n = 0;
    this._t = now;
    this._n++;
    return this.react(this._n, now);
  },
  /* 摇的反应：摇几下她开始喊晕，再摇她真的生气 */
  react(n, now){
    now = now || Date.now();
    if(n < CONFIG.SENSE.SHAKE_N) return false;
    if(n >= CONFIG.SENSE.SHAKE_ANGRY){
      this._n = 0;
      Emo.set('angry', '你摇了手机', now);
      if(typeof Director !== 'undefined') Director.act('act-shake');
      buzz(160);
      if(typeof Mascot !== 'undefined') Mascot.react('shakeAngry', 2600);
      return true;
    }
    if(n === CONFIG.SENSE.SHAKE_N){
      Emo.set('worried', '你摇了手机', now);
      if(typeof Director !== 'undefined') Director.act('act-shake');
      if(typeof Mascot !== 'undefined') Mascot.react('shakeDizzy', 2600);
      return true;
    }
    return false;
  }
};

/* ── 忙碌页面右下角的她 QCorner（v1.6a）：Q版小人一直在，你做什么她都陪着 ── */
const QCorner = {
  _built:false,
  el(){ try{ return document.getElementById('q-corner'); }catch(e){ return null; } },
  /* 换页时同步：忙碌页出现；纯净页与她的页面不出现（那儿本来就是她的地方，不重复） */
  sync(){
    const el = this.el();
    if(!el || !el.classList) return false;
    if(!this._built){
      el.innerHTML = '<div class="mood-dot"></div>' + HerBody.imgHtml('q', 'base', {small:true});
      this._built = true;
    }
    const busy = (S.view !== 'home' && S.view !== 'mspace') && CONFIG.BODY.HER_PAGES.indexOf(S.view) < 0;
    el.classList.toggle('on', busy);
    if(busy) paintHer();
    return busy;
  }
};

/* ══════════════════════════════════════════════════════════════
   9.57 传送门 Portal（v1.3）
   用户空间首页 ⇄ 她的空间：长按白圆黑星 0.5 秒 → 星星从小圆里外扩铺满屏幕 → 落到另一边
   （过渡期间 Portal._active=true，手势引擎不与它抢触摸）
   ══════════════════════════════════════════════════════════════ */
const Portal = {
  _active:false,
  HOLD_MS:500,     // 长按星标多久触发
  FLY_MS:470,      // 星星外扩铺满屏幕的时长（CSS 动画 .48s）
  /* target: 'mspace' | 'home'；anchorEl: 星标元素（星星从它那儿开始外扩） */
  go(target, anchorEl){
    const ov = document.createElement('div');
    ov.className = 'portal-overlay';
    const a = this._anchor(anchorEl);
    ov.style.left = Math.round(a.x) + 'px';
    ov.style.top  = Math.round(a.y) + 'px';
    ov.innerHTML = '<span class="po-ring"></span><span class="po-star">★</span>';
    /* 外扩到铺满屏幕所需倍数：屏幕对角线 / 小圆直径（再留一点余量） */
    const w = window.innerWidth || 390, h = window.innerHeight || 844;
    ov.style.setProperty('--poscale', Math.ceil(Math.hypot(w, h) / 56 * 1.15));
    document.body.appendChild(ov);
    this._active = true;
    const run = ()=>{ ov.classList.add('go'); };
    if(typeof requestAnimationFrame === 'function') requestAnimationFrame(run); else run();
    setTimeout(()=>this._land(target, ov), this.FLY_MS);
    return ov;
  },
  /* 白光铺满屏幕的那一刻再换页（换完淡出白光，露出另一边） */
  _land(target, ov){
    /* 白光已经铺满整屏，这一刻必须把新页面立刻画出来（不能等下一帧）：
       否则淡出时会先露出旧页面，边缘提示也还挂着上一个视图的四个方向 */
    try{ goView(target); renderView(); }catch(err){ console.error('[Portal]', err); }
    if(ov){
      ov.classList.add('done');
      setTimeout(()=>{ if(ov.parentNode) ov.parentNode.removeChild(ov); }, 320);
    }
    this._active = false;
  },
  _anchor(el){
    try{
      const r = (el && el.getBoundingClientRect) ? el.getBoundingClientRect() : null;
      if(r && (r.width || r.height || r.top || r.left)) return {x:r.left + r.width/2, y:r.top + r.height/2};
    }catch(e){}
    const w = window.innerWidth || 390, h = window.innerHeight || 844;
    return {x:w/2, y:h*0.62};
  }
};

/* ══════════════════════════════════════════════════════════════
   9.56 看板娘养成 Grow（v1.2）
   经验 = 可能性递归每分钟+1 · 完成待办+20 · 写可能性确定+5 · 连续打卡加成(连续天数×2，封顶+20)
   ★ 纯推导：全部由既有数据实时算出，不落库、零迁移——老用户打开立刻有等级。
     唯一的新存储键是 settings.growCelebrated（升级播报去重，见 celebrate/catchUp）
   ══════════════════════════════════════════════════════════════ */
const Grow = {
  _dirty:true, _ev:null, _total:0, _min:null,
  _feedPending:0, _zoneT:null, _sayT:null,      // 投喂演出的计数与定时器（并发多批互不误删）
  invalidate(){ this._dirty = true; },
  /* 全量推导：dk → {min,done,rec,streak,xp}；按日升序推进算连续天数（避免 O(n²)） */
  rebuild(now){
    now = now || Date.now();
    const today = D.dateKey(now), G = CONFIG.GROW;
    const ev = new Map();
    const touch = dk => { if(!ev.has(dk)) ev.set(dk, {min:0, done:0, rec:0, streak:0, xp:0}); return ev.get(dk); };
    /* ① 可能性递归：已终结切片按 end-start 计；进行中的切片只算今天（随时间持续长经验） */
    for(const s of S.sessions){
      if(!s.day) continue;
      let m = 0;
      if(s.end != null) m = (s.end - s.start) / 60000;
      else if(s.day === today) m = Math.max(0, now - s.start) / 60000;
      if(m > 0) touch(s.day).min += m;
    }
    /* ② 待办完成：doneKeys 记着每一次完成；单次待办的键是 'once'，按 completedAt 归到当天 */
    for(const t of S.todos){
      for(const k of (t.doneKeys || [])){
        const dk = (k === 'once') ? (t.completedAt ? D.dateKey(t.completedAt) : null) : k;
        if(dk && /^\d{4}-\d{2}-\d{2}$/.test(dk)) touch(dk).done++;
      }
    }
    /* ③ 每日记录：枚举 day: 键，每条可能性确定 +5（旧版单条对象兼容计 1 条） */
    for(const k of Store.allKeys()){
      if(k.indexOf('day:') !== 0) continue;
      const doc = Store.get(k, null);
      if(!doc || !doc.spaceRecords) continue;
      let n = 0;
      for(const spId in doc.spaceRecords){
        const v = doc.spaceRecords[spId];
        n += Array.isArray(v) ? v.length : (v ? 1 : 0);
      }
      if(n > 0) touch(k.slice(4)).rec += n;
    }
    /* ④ 连续打卡 + 每日经验 */
    let prev = null, run = 0;
    for(const dk of [...ev.keys()].sort()){
      const e = ev.get(dk);
      const ok = e.min >= 1 || e.done > 0 || e.rec > 0;   // 打卡 = 有递归 / 有完成 / 有记录
      run = (ok && prev && D.dateKey(D.addDaysTs(D.dkToTs(prev), 1)) === dk) ? run + 1 : (ok ? 1 : 0);
      prev = dk;
      e.streak = run;
      e.xp = Math.floor(e.min) * G.XP_MINUTE + e.done * G.XP_TODO + e.rec * G.XP_RECORD +
             (ok ? Math.min(run * G.XP_STREAK_PER_DAY, G.XP_STREAK_CAP) : 0);
    }
    this._ev = ev; this._total = 0;
    for(const e of ev.values()) this._total += e.xp;
    this._dirty = false;
    return this;
  },
  _ensure(){ if(this._dirty || !this._ev) this.rebuild(Date.now()); return this; },
  /* —— 只读推导 —— */
  checkedIn(dk){ this._ensure(); const e = this._ev.get(dk); return !!e && (e.min >= 1 || e.done > 0 || e.rec > 0); },
  xpForDay(dk){ this._ensure(); const e = this._ev.get(dk); return e ? e.xp : 0; },
  dayXpDetail(dk){ this._ensure(); return this._ev.get(dk) || {min:0, done:0, rec:0, streak:0, xp:0}; },
  totalXp(){ this._ensure(); return this._total; },
  /* 截止 dk（含）的连续打卡天数；当天没打卡就是 0（面板据此说“今天还没打卡”） */
  streakDaysUpTo(dk){
    this._ensure();
    if(!this.checkedIn(dk)) return 0;
    let n = 0, cur = dk;
    for(let i=0;i<365;i++){
      if(!this.checkedIn(cur)) break;
      n++; cur = D.dateKey(D.addDaysTs(D.dkToTs(cur), -1));
    }
    return n;
  },
  /* —— 等级数学 —— */
  needFor(level){ return CONFIG.GROW.LEVEL_BASE + (Math.max(1, level) - 1) * CONFIG.GROW.LEVEL_STEP; },
  /* 到达 level 所需的累计经验（到达 1 级 = 0） */
  cumNeed(level){
    const n = Math.max(1, level) - 1;
    return n * CONFIG.GROW.LEVEL_BASE + CONFIG.GROW.LEVEL_STEP * n * (n - 1) / 2;
  },
  levelFromXp(xp){
    let lv = 1;
    while(this.cumNeed(lv + 1) <= xp) lv++;
    return lv;
  },
  titleOf(level){
    let s = CONFIG.GROW.TITLES[0][1];
    for(const [lv, name] of CONFIG.GROW.TITLES){ if(level >= lv) s = name; }
    return s;
  },
  nextTitleOf(level){
    for(const [lv, name] of CONFIG.GROW.TITLES){ if(lv > level) return {level:lv, name}; }
    return null;
  },
  level(){ return this.levelFromXp(this.totalXp()); },
  /* 养成面板的一次性快照 */
  xpInfo(now){
    now = now || Date.now();
    const xp = this.totalXp(), level = this.levelFromXp(xp);
    const cur = xp - this.cumNeed(level), need = this.needFor(level);
    const today = D.dateKey(now), yest = D.dateKey(D.addDaysTs(now, -1));
    return {
      xp, level, cur, need,
      pct: need > 0 ? clamp(cur / need, 0, 1) : 0,
      title: this.titleOf(level),
      next: this.nextTitleOf(level),
      streak: this.streakDaysUpTo(today),
      streakYesterday: this.streakDaysUpTo(yest),
      todayChecked: this.checkedIn(today)
    };
  },
  /* 台词解锁进度：已解锁 X / 共 19 句 + 下一档等级 */
  lineProgress(){
    const lv = this.level();
    let next = null;
    for(const t of CONFIG.GROW.LINE_TIERS){ if(t > lv){ next = t; break; } }
    return { level:lv, have:Mascot.linesFor(lv).length, total:Mascot.lineTotal(), next };
  },
  /* ——「她眼中的我」的统计数据（只读推导，同样不落库） —— */
  stats(now){
    now = now || Date.now();
    this._ensure();
    let min = 0, done = 0, rec = 0;
    for(const e of this._ev.values()){ min += e.min; done += e.done; rec += e.rec; }
    /* 最近在忙的空间：按空间累计递归分钟，取最大的那个 */
    const per = {};
    for(const s of S.sessions){
      if(!s.spaceId) continue;
      const m = (s.end != null) ? (s.end - s.start) / 60000 : Math.max(0, now - s.start) / 60000;
      if(m > 0) per[s.spaceId] = (per[s.spaceId] || 0) + m;
    }
    let topId = null, topMin = 0;
    for(const id in per){ if(per[id] > topMin){ topMin = per[id]; topId = id; } }
    const dk = D.dateKey(now);
    return {
      xp:this._total, lv:this.levelFromXp(this._total),
      min:Math.floor(min), done, rec,
      streak:this.streakDaysUpTo(dk), todayChecked:this.checkedIn(dk),
      topId, topMin:Math.floor(topMin), dayCount:this._ev.size
    };
  },
  /* 她根据数据说的话（第 1 句是开场，其余是她想对你说的；全是只读推导） */
  herWords(st, sp){
    const out = [];
    const lv = st.lv, title = this.titleOf(lv);
    out.push(st.dayCount === 0
      ? '我们才刚刚开始呢——你写的每一条，我都会记住。'
      : '我已经陪你走过 ' + st.dayCount + ' 天啦，现在的我是 Lv.' + lv + ' · ' + title + '。');
    if(!st.todayChecked) out.push('今天还没有打卡哦，哪怕只专注 1 分钟，我也会记你一功。');
    if(st.streak >= 30) out.push('连续 ' + st.streak + ' 天了……这条日子已经连成很长很长的一条了。');
    else if(st.streak >= 7) out.push('连续打卡 ' + st.streak + ' 天！你比你自己想象中更有毅力。');
    else if(st.streak >= 3) out.push('已经连着 ' + st.streak + ' 天了，再多一天就成习惯啦。');
    if(st.min >= 6000) out.push('你总共专注了 ' + fmtMin(st.min) + '，这些时间我都替你收好了。');
    else if(st.min > 0) out.push('你专注了 ' + fmtMin(st.min) + '，每一分钟都算数。');
    if(st.done >= 100) out.push('你已经完成 ' + st.done + ' 件事了，我数着的。');
    else if(st.done > 0) out.push('你完成过 ' + st.done + ' 件事，我都有好好记下来。');
    if(st.rec === 0) out.push('还没有任何记录呢——写第一条吧，我会替你收着。');
    if(sp) out.push('最近你总是在忙「' + sp.name + '」，累计 ' + fmtMin(st.topMin) + '，我在旁边看着呢。');
    if(lv < 5) out.push('再往上一点点，我就能解锁新的台词了，好期待呀。');
    else if(lv < 10) out.push('学徒的我，也还想再长大一点。');
    else if(lv < 20) out.push('时间在我手里越来越听话了，这都是跟你学的。');
    return out;
  },
  /* —— 升级检测与播报 —— */
  tick(now){
    const m = Math.floor(now / 60000);
    if(this._dirty || m !== this._min){
      this._min = m;
      this.rebuild(now);        // 分钟边界重算：进行中的递归会持续长经验
      this.checkLevelUp();
    }
  },
  checkLevelUp(){
    const lv = this.level(), prev = S._level || 1;
    S._level = lv;
    if(lv > prev) this.celebrate(prev, lv);   // 等级回落（撤销完成/删记录）静默跟随，不播报
  },
  celebrate(from, to){
    const title = this.titleOf(to);
    UI.toast('升级啦！Lv.' + to + ' · ' + title + ' 🎉');
    if(title !== this.titleOf(from)) setTimeout(()=>UI.toast('新称号解锁：' + title + ' ✦'), 900);
    this.anim(this.pickLine(from, to));
  },
  /* 升级演出：纯净页（首页/她的空间）= 看板娘亲口说 + 星光；子页 = 迷你看板娘气泡 + 小星光 */
  anim(line){
    if(S.view === 'home' || S.view === 'mspace'){ Mascot.say(line, CONFIG.GROW.SAY_MS); this.fxStars(); return; }
    this.miniSay(line);
    this.fxStarsMini();
  },
  /* 升级时说的话：优先说这次刚解锁的新台词，否则随机一句 */
  pickLine(from, to){
    const fresh = Mascot.unlockLinesBetween(from, to);
    return fresh.length ? fresh[fresh.length - 1] : Mascot.randomLine(to);
  },
  /* 补播：升级时用户不在场（页面关着）→ 下次主动打开养成面板时补一句，只补一次 */
  catchUp(){
    const lv = this.level(), seen = S.settings.growCelebrated || 1;
    if(lv <= seen) return 0;
    S.settings.growCelebrated = lv;
    saveSettings();
    return lv;
  },
  /* —— 粒子（动画关闭时一粒都不撒） —— */
  fxStars(){
    if((S.settings.animLevel || 'light') === 'off') return 0;
    const zone = document.querySelector('#view-root .mascot-zone');
    if(!zone) return 0;
    return this._burst(zone, (S.settings.animLevel === 'full') ? 12 : 8);
  },
  fxStarsMini(){
    if((S.settings.animLevel || 'light') === 'off') return 0;
    const root = document.getElementById('feed-root');
    if(!root) return 0;
    return this._burst(root.querySelector('.feed-mini') || root, (S.settings.animLevel === 'full') ? 12 : 8);
  },
  _burst(box, n){
    const em = ['✨','⭐','🌟','💫'];
    for(let i=0;i<n;i++){
      const s = document.createElement('span');
      s.className = 'mascot-heart mascot-star';
      s.textContent = em[i % em.length];
      s.style.left = (10 + Math.random()*80) + '%';
      s.style.bottom = (28 + Math.random()*62) + '%';
      s.style.animationDelay = (i*0.05) + 's';
      box.appendChild(s);
      setTimeout(()=>s.remove(), 2200);
    }
    return n;
  },
  /* 子页里的迷你看板娘台词气泡（喂食区 #feed-root，动画层步骤见 9.57） */
  miniSay(text){
    const root = document.getElementById('feed-root');
    if(!root) return;
    let b = root.querySelector('.feed-say');
    if(!b){
      b = document.createElement('div');
      b.className = 'feed-say';
      root.appendChild(b);
    }
    b.textContent = text;
    b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
    clearTimeout(this._sayT);
    this._sayT = setTimeout(()=>{ b.classList.remove('show'); }, CONFIG.GROW.SAY_MS);
  },
  /* 轻量经验飘字：写一条可能性确定 +5（从按钮处往上飘） */
  floatXp(anchorEl, xp){
    if((S.settings.animLevel || 'light') === 'off') return 0;
    const root = document.getElementById('feed-root');
    if(!root) return 0;
    const p = this._anchorPoint(anchorEl);
    const s = document.createElement('span');
    s.className = 'feed-xp';
    s.textContent = '+' + xp;
    s.style.left = p.x + 'px';
    s.style.top = p.y + 'px';
    root.appendChild(s);
    setTimeout(()=>s.remove(), 1300);
    return xp;
  },
  /* —— 投喂演出：完成待办 → 点心从卡片飞向左下角的迷你看板娘 —— */
  feed(anchorEl, xp){
    const lv = S.settings.animLevel || 'light';
    if(lv === 'off') return 0;                    // 动画关闭：不撒食物（经验照长，toast 里有文字）
    const root = document.getElementById('feed-root');
    const zone = this._ensureZone();
    if(!root || !zone) return 0;
    const n = (lv === 'full') ? CONFIG.GROW.FEED_FOODS_FULL : CONFIG.GROW.FEED_FOODS_LIGHT;
    const p0 = this._anchorPoint(anchorEl), p1 = this._mouthPoint();   // 卡片中心 → 她嘴边
    for(let i=0;i<n;i++){
      const f = document.createElement('span');
      f.className = 'feed-food';
      f.textContent = CONFIG.GROW.FOODS[(Math.random()*CONFIG.GROW.FOODS.length)|0];
      f.style.setProperty('--fx0', p0.x + 'px');
      f.style.setProperty('--fy0', p0.y + 'px');
      f.style.setProperty('--fx1', p1.x + 'px');
      f.style.setProperty('--fy1', p1.y + 'px');
      f.style.animationDelay = (i*0.12) + 's';    // 一批食物错峰起飞
      root.appendChild(f);
      setTimeout(()=>f.remove(), 1900 + i*120);
    }
    this._feedPending = (this._feedPending || 0) + 1;
    const land = 1050 + (n-1)*120;                // 最后一个食物落嘴的时间
    setTimeout(()=>{
      this._feedPending = Math.max(0, (this._feedPending || 1) - 1);
      this._chomp();
      const mini = zone.querySelector('.feed-mini');
      this.floatXp(mini, xp);                     // 头顶飘 +20
      if(Math.random() < CONFIG.GROW.FEED_SAY_CHANCE) this.miniSay(this._feedLine());
      if(this._feedPending === 0){                // 所有批次都吃完了才收起（并发多批互不误删）
        clearTimeout(this._zoneT);
        this._zoneT = setTimeout(()=>this.dismissZone(), 1300);
      }
    }, land);
    return n;
  },
  _feedLine(){ const l = CONFIG.GROW.FEED_LINES; return l[(Math.random()*l.length)|0]; },
  /* 咬一口：重设动画类（先摘后加，连点也能重新播） */
  _chomp(){
    const el = document.querySelector('#feed-root .feed-mini');
    if(!el) return;
    el.classList.remove('feed-chomp'); void el.offsetWidth; el.classList.add('feed-chomp');
    setTimeout(()=>el.classList.remove('feed-chomp'), 700);
  },
  /* 喂食区（左下角迷你看板娘）：懒创建，点头像 = 星星外扩传送到她的空间（v1.3） */
  _ensureZone(){
    const root = document.getElementById('feed-root');
    if(!root) return null;
    let z = root.querySelector('.feed-zone');
    if(!z){
      z = document.createElement('div');
      z.className = 'feed-zone';
      z.innerHTML = '<div class="feed-mini">' + this._miniHtml(true) + '</div>';   // 投喂时露脸的是 Q版那只
      z.addEventListener('click', ()=>{ if(!Portal._active) Portal.go('mspace', z); });
      root.appendChild(z);
    }
    z.classList.add('on');
    root.classList.add('on');
    return z;
  },
  /* 迷你头像（v1.6a）：q=true 用「Q版」那张（投喂演出）；否则用正常形态的迷你版——
     她说话的地方（她眼中的我 / 她的日记 / 她的问题）也跟着此刻的心情换脸。
     没传过图就照旧回退：现穿着的那套 > 系统默认的她（mimi/）> 内置占位小可爱 */
  _miniHtml(q){
    return q ? HerBody.imgHtml('q', 'base', {small:true})
             : HerBody.imgHtml('normal', Emo.slot(), {small:true});
  },
  dismissZone(){
    clearTimeout(this._zoneT);
    this._feedPending = 0;
    const root = document.getElementById('feed-root');
    if(!root) return;
    const z = root.querySelector('.feed-zone');
    if(z) z.classList.remove('on');
    root.classList.remove('on');
  },
  /* 她嘴边（迷你头像中上部）；拿不到位置就退回左下角 */
  _mouthPoint(){
    const el = document.querySelector('#feed-root .feed-mini');
    const r = (el && el.getBoundingClientRect) ? el.getBoundingClientRect() : null;
    if(r && (r.width || r.height)) return {x: r.left + r.width/2, y: r.top + r.height*0.42};
    return {x: 40, y: (window.innerHeight || 640) - 62};
  },
  /* 动画锚点：优先用元素真实位置，拿不到就落在屏幕中下方（无 rect 时兜底） */
  _anchorPoint(el){
    try{
      const r = (el && el.getBoundingClientRect) ? el.getBoundingClientRect() : null;
      if(r && (r.width || r.height || r.top || r.left)) return {x: r.left + r.width/2, y: r.top + r.height/2};
    }catch(e){}
    const w = window.innerWidth || 360, h = window.innerHeight || 640;
    return {x: w/2, y: h*0.62};
  }
};

/* ══════════════════════════════════════════════════════════════
   9.7 节律操控台 Console（双击呼出 · 猫耳时段卡 · 空间栏 · 投放区）
   ══════════════════════════════════════════════════════════════ */
const Console = {
  lastTouch:0,           // 用户刚碰过面板的时间（拖动/滚动时暂停每秒刷新）
  hold:0,                // 正被拖拽的三角（暂停每秒刷新）
  html(){ return '<div class="console'+(this._anim?' sheet-in':'')+'">'+
    '<div class="console-grab"></div>'+
    '<div class="console-head">'+
      '<div class="console-title">节律表操控台</div>'+
      '<button class="ctab'+(S.consTab==='slots'?' on':'')+'" data-action="cons-tab" data-tab="slots">自流转</button>'+
      '<button class="ctab'+(S.consTab==='spaces'?' on':'')+'" data-action="cons-tab" data-tab="spaces">空间</button>'+
      '<button class="icon-btn" data-action="open-settings" aria-label="设置">⚙</button>'+
      '<button class="icon-btn" data-action="cons-close" aria-label="收起操控台">✕</button>'+
    '</div>'+
    '<div class="console-body">'+(S.consTab==='slots' ? this.slotsHtml() : this.spacesHtml())+'</div>'+
  '</div>'; },
  open(){
    S.consOpen = true; this.lastTouch = Date.now(); this._anim = true;
    if(typeof Grow !== 'undefined') Grow.dismissZone();   // 操控台弹出时先收起喂食区，别打架
    this.render();
  },
  close(){ S.consOpen = false; S.sbOpen = false;
    const el = document.getElementById('console-root'); if(el) el.innerHTML=''; },
  toggle(){ S.consOpen ? this.close() : this.open(); },
  render(){
    if(!S.consOpen) return;
    const el = document.getElementById('console-root');
    if(!el) return;
    el.innerHTML = this.html();
    this._anim = false;                      // 滑入动画只在「打开」这一次播放
    this._sig = this.sig(Date.now());        // 记录签名，避免下一秒 tick 立刻重绘（闪烁来源）
    this.bind();
  },
  /* 每秒定向刷新：计时数字原地更新；状态变化时才整体重画（保留滚动位置） */
  tick(now){
    if(!S.consOpen) return;
    const root = document.getElementById('console-root');
    if(!root) return;
    root.querySelectorAll('[data-rec-t]').forEach(el=>{
      const m = Rhythm.activeManual();
      setText(el, m ? fmtDur(now - m.start) : '--');
    });
    if(this.hold || now - this.lastTouch < 600) return;
    const sig = this.sig(now);
    if(sig !== this._sig){ this._sig = sig; this.render(); }
  },
  /* 面板内容签名：时段/跳过/进行中任一变化 → 触发重画 */
  sig(now){
    const dk = D.dateKey(now);
    const doc = dayDoc(dk);
    const slots = [...(doc.autoSchedules||[])].sort((a,b)=>a.start<b.start?-1:1);
    let s = S.consTab;
    for(const slot of slots){
      const st = this.slotState(slot, doc, now);
      s += '|'+slot.id+':'+slot.start+'-'+slot.end+':'+st.key+(st.live?':L':'');
    }
    const m = Rhythm.activeManual();
    if(m) s += '|man:'+m.spaceId;
    return s;
  },
  /* 时段卡状态机（与渲染共用，保证状态一致） */
  slotState(slot, doc, now){
    const today = D.dateKey(now);
    const dayStart = D.dkToTs(today);
    const s0 = D.hhmmToTs(dayStart, slot.start), e0 = D.hhmmToTs(dayStart, slot.end);
    const skipped = !!((doc.slotSkips||{})[slot.id]);
    const active = S.sessions.find(x=>x.end==null && x.scheduleId===slot.id);
    const cov = Rhythm.slotCoverage(today, slot.id, s0);
    if(skipped) return {key:'skip', face:'🚫', stTxt:'今日跳过', stCls:'st-idle', live:false};
    if(active) return {key:'live', face:'🐱', stTxt:'进行中', stCls:'st-live', live:true};
    if(now >= e0){
      if(cov >= e0-1000) return {key:'done', face:'✅', stTxt:'已结束', stCls:'st-done', live:false};
      if(cov > s0) return {key:'partial', face:'🏁', stTxt:'部分未生效', stCls:'st-warn', live:false};
      return {key:'miss', face:'⚠️', stTxt:'未生效', stCls:'st-warn', live:false};
    }
    if(now >= s0) return {key:'quota', face:'⚠️', stTxt:'额度不足', stCls:'st-warn', live:false};
    return {key:'idle', face:'😴', stTxt:'未开始', stCls:'st-idle', live:false};
  },
  bind(){
    const body = document.querySelector('#console-root .console-body');
    if(!body) return;
    /* 用户碰到面板（滚动/点按）→ 暂停每秒重画，避免打断操作 */
    body.addEventListener('pointerdown', ()=>{ this.lastTouch = Date.now(); }, {passive:true});
    body.querySelectorAll('.sc-tri').forEach(tri=>{
      tri.addEventListener('pointerdown', e=>{ this.pullStart(e, tri); }, {passive:false});
    });
    body.querySelectorAll('.sb-card[draggable]').forEach(card=>{
      card.addEventListener('pointerdown', e=>{ this.dragStart(e, card); }, {passive:false});
    });
    /* 猫耳与其它按钮走 data-action 委托，无需单独绑定 */
  },
  /* ──────── Tab1 自流转时段卡列表 ──────── */
  slotsHtml(){
    const now = Date.now();
    const today = D.dateKey(now);
    const doc = dayDoc(today);
    const slots = [...(doc.autoSchedules||[])].sort((a,b)=>a.start<b.start?-1:1);
    const manual = Rhythm.activeManual();
    let h = '';
    /* 手动递归卡（若正在跑） */
    if(manual){
      const sp = spaceById(manual.spaceId);
      h += this.manualCardHtml(manual, sp);
    }
    if(slots.length===0){
      h += '<div class="console-empty"><div class="big">🐾</div>今天还没有自流转日程<br><span style="font-size:12px;color:var(--text-2)">设定课程表式的自动递归，到点看板娘会替你开始</span></div>';
    }else{
      for(const slot of slots) h += this.slotCardHtml(slot, doc);
    }
    if(S.spaces.some(x=>!x.archived)){
      h += '<button class="btn btn--block" data-action="slot-form" style="margin:2px 0 4px">＋ 添加自流转日程</button>';
    }else{
      h += '<button class="btn btn--block" data-action="goto-spaces" style="margin:2px 0 4px">先创建一个可能性空间 →</button>';
    }
    h += '<div class="hint" style="font-size:11px;color:var(--text-2);text-align:center;padding:4px 8px 6px">'+
         '猫耳 ＋/− 调时长 · 拉右上角三角=提前结束 · 拉左下角三角=停止本段（推回原位取消）</div>';
    return h;
  },
  manualCardHtml(m, sp){
    const now = Date.now();
    return '<div class="slot-card sc-live manual">'+
      '<div class="sc-row">'+
        '<div class="sc-face">🐱</div>'+
        '<div class="sc-mid">'+
          '<div class="sc-name">'+esc(sp?sp.name:'手动递归')+' <span class="badge">手动</span></div>'+
          '<div class="sc-time num">已专注 <span data-rec-t>'+fmtDur(now-m.start)+'</span></div>'+
        '</div>'+
        '<span class="sc-st st-live">进行中</span>'+
      '</div>'+
      '<div class="sc-mini"><button class="icon-btn" data-action="stop-manual" aria-label="停止递归">⏹</button></div>'+
    '</div>';
  },
  slotCardHtml(slot, doc){
    const now = Date.now();
    const today = D.dateKey(now);
    const sp = spaceById(slot.spaceId);
    const dayStart = D.dkToTs(today);
    const s = D.hhmmToTs(dayStart, slot.start), e = D.hhmmToTs(dayStart, slot.end);
    const st = this.slotState(slot, doc, now);
    const live = st.live;
    const color = sp ? sp.color : '#8A93A3';
    const left = ((s - dayStart)/86400000*100);
    const w = Math.max(0.8, ((e - s)/86400000*100));
    return '<div class="slot-card sc-card'+(live?' sc-live':'')+(st.key==='done'?' sc-done':'')+'" data-slot="'+slot.id+'">'+
      /* 猫耳朵（＋10 / －10 分钟）：只在进行中/时段内显示，已结束与未开始的卡不显示 */
      ((st.key==='live' || st.key==='quota')
        ? '<div class="sc-ears">'+
            '<button class="sc-ear r" data-action="cons-ear" data-id="'+slot.id+'" data-dir="p" aria-label="延长10分钟"><span class="ear-in">＋<small>10分</small></span></button>'+
            '<button class="sc-ear l" data-action="cons-ear" data-id="'+slot.id+'" data-dir="m" aria-label="缩短10分钟"><span class="ear-in">－<small>10分</small></span></button>'+
          '</div>'
        : '')+
      '<div class="sc-row">'+
        '<div class="sc-face">'+st.face+'</div>'+
        '<div class="sc-mid">'+
          '<div class="sc-name">'+esc(sp?sp.name:'已删除空间')+'</div>'+
          '<div class="sc-time num">'+esc(slot.start)+' ~ '+esc(slot.end)+'</div>'+
          (slot.note?'<div class="sc-extra">'+esc(slot.note)+'</div>':'')+
        '</div>'+
        '<span class="sc-st '+st.stCls+'">'+st.stTxt+'</span>'+
      '</div>'+
      /* 时段轨道：色段 + 现在线 + 拉扯时的幽灵终点线 */
      '<div class="sc-track" data-track>'+
        '<div class="sc-band" style="left:'+left.toFixed(2)+'%;width:'+w.toFixed(2)+'%;background:'+color+'"></div>'+

        '<div class="sc-label sc-label-r"></div><div class="sc-label sc-label-l"></div>'+
      '</div>'+
      /* 三角拉扯柄：右上=提前结束（把终点拉近），左下=停止本段（拉出猫耳，推回取消） */
      (live ? '<div class="sc-tri r" data-pull="end" aria-label="提前结束"><span class="t-arrow">◤</span></div>'+
               '<div class="sc-tri l" data-pull="stop" aria-label="停止本段"><span class="t-arrow">◣</span></div>'
           : '')+
      '<div class="sc-mini">'+
        '<button class="icon-btn" data-action="slot-form" data-id="'+slot.id+'" aria-label="编辑">✎</button>'+

      '</div>'+
    '</div>';
  },
  /* ──────── Tab2 空间栏 + 投放区 ──────── */
  spacesHtml(){

           '</div>';

    h += '</div>';
    /* 投放区：空闲=拖入高亮；进行中=点击停止 */

      const sp = spaceById(m.spaceId);

             '<span class="pulse-dot" style="background:var(--green)"></span> 正在递归：'+esc(sp?sp.name:'?')+
             ' · <span class="num" data-rec-t style="font-variant-numeric:tabular-nums">'+fmtDur(Date.now()-m.start)+'</span>'+
             '<div class="dp-sub">点击停止</div></button>';
    }else{
      h += '<div class="drop-pad" id="drop-pad">拖到这里 → 可能性递归<div class="dp-sub">消耗节律递归时间，积累到空间名下</div></div>';
    }
    return h;
  },
  /* —— 猫耳 ±10 分钟（改自己设定的时间段，立即生效） —— */
  ear(slotId, dir){
    const now = Date.now();
    const today = D.dateKey(now);
    const doc = dayDoc(today);
    const slot = (doc.autoSchedules||[]).find(x=>x.id===slotId);
    if(!slot){ UI.toast('日程不存在', 'err'); return; }
    const m2 = v => (Math.floor(v/60))+':'+pad2(v%60);
    const sm = (+slot.start.slice(0,2))*60+(+slot.start.slice(3,5));
    let em = (+slot.end.slice(0,2))*60+(+slot.end.slice(3,5));
    const nm = em + (dir==='p'?10:-10);
    if(nm <= sm+10){ UI.toast('时段最短 10 分钟', 'err'); return; }
    if(nm > 1430){ UI.toast('最晚到 23:50（不跨天）', 'err'); return; }
    slot.end = m2(nm);
    /* 用户手动改动后：取消“今日跳过”，把缺失的区间补算回来 */
    if(doc.slotSkips && doc.slotSkips[slot.id]){
      delete doc.slotSkips[slot.id];
      if(Object.keys(doc.slotSkips).length===0) delete doc.slotSkips;
    }
    saveDay(today);
    Rhythm.reconcileDay(today);
    UI.toast(dir==='p' ? '已延长到 '+slot.end : '已缩短到 '+slot.end);
    scheduleRender();
  },
  /* —— 右下三角：拉近 = 提前结束本次 —— */
  pullStart(e, tri){
    e.preventDefault();
    const card = tri.closest('.sc-card');
    if(!card) return;
    const track = card.querySelector('[data-track]');
    if(!track) return;
    const rect = track.getBoundingClientRect();
    const now = Date.now();
    const today = D.dateKey(now);
    const doc = dayDoc(today);
    const slotId = card.dataset.slot;
    const slot = (doc.autoSchedules||[]).find(x=>x.id===slotId);
    if(!slot) return;
    const active = S.sessions.find(x=>x.end==null && x.scheduleId===slotId);
    if(!active) return;
    const dayStart = D.dkToTs(today);
    const pxPerMin = rect.width / 1440;
    const kind = tri.dataset.pull;                       // 'end' 提前结束 / 'stop' 停止本段
    const originX = e.clientX, originY = e.clientY;
    const band = card.querySelector('.sc-band');
    const eMin = (active.start - dayStart)/60000;        // 起始即已开始
    const orgEndMin = (doc.slotSkips&&doc.slotSkips[slotId]) ? null : Math.min(1440, ((D.hhmmToTs(dayStart, slot.end)-dayStart)/60000));
    Console.hold = Date.now();
    card.classList.add('pulling-r');
    /* 按住后：拉出猫耳、显示引导 */
    const ghost = card.querySelector('.sc-ghost-'+(kind==='end'?'r':'l'));
    const label = card.querySelector('.sc-label-'+(kind==='end'?'r':'l'));
    const show = (x, y) => {
      const dx = x - originX;
      let px = originX + dx;
      px = Math.min(rect.right, Math.max(rect.left, px));
      const frac = Math.max(0, Math.min(1, (px - rect.left) / rect.width));
      const targetMin = Math.round(frac * 1440);
      const ghostLeft = ((targetMin/1440)*100).toFixed(2);
      ghost.style.left = ghostLeft+'%';
      ghost.style.display = 'block';
      card.style.setProperty('--pull-commit', String(Math.abs(dx) > rect.width*0.12 ? 1 : 0));
      let msg;
      if(kind==='end'){
        msg = Math.abs(dx) > rect.width*0.12 ? '松手=提前结束到 '+D.tsToHHMM(dayStart+targetMin*60000) : '拖到 ← 提前结束';
      }else{
        msg = Math.abs(dx) > rect.width*0.12 ? '松手=停止本段并跳过' : '拖开并松手 = 停止';
      }
      label.textContent = msg;
      label.style.left = Math.min(rect.width-70, Math.max(0, px-rect.left))+'px';
    };
    show(e.clientX, e.clientY);
    const move = ev => {
      ev.preventDefault();
      show(ev.clientX, ev.clientY);
    };
    const up = ev => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      Console.hold = 0;
      card.classList.remove('pulling-r');
      ghost.style.display = '';
      label.style.display = '';
      const dx = ev.clientX - originX;
      if(Math.abs(dx) <= rect.width*0.12){ return; }     // 没拖够 → 还原（继续递归）
      const dayStart2 = D.dkToTs(today);
      const frac = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
      const targetMin = Math.round(frac * 1440);
      const targetTs = dayStart2 + targetMin*60000;
      const slot2 = (doc.autoSchedules||[]).find(x=>x.id===slotId);
      const act2 = S.sessions.find(x=>x.end==null && x.scheduleId===slotId);
      if(!act2) return;
      if(kind==='end'){
        /* 提前结束：在本刻收尾（结束点必须在开始之后） */
        const endTs = Math.max(act2.start + 1000, Math.min(Date.now(), targetTs));
        Rhythm.finalizeSessionsOnDay(today, [act2.id], endTs, 'earlyEnd');
        UI.toast('已提前结束 '+D.tsToHHMM(endTs));
        /* 若结束点早于槽位结束，标记今日跳过，防止引擎立刻重开 */
        const doc2 = dayDoc(today);
        if(endTs < D.hhmmToTs(dayStart2, slot2.end) - 1000){
          doc2.slotSkips = doc2.slotSkips || {};
          doc2.slotSkips[slotId] = true;
          saveDay(today);
        }
        scheduleRender();
      }else{
        /* 停止本段：终结当前并标记今日跳过 */
        Rhythm.finalizeSessionsOnDay(today, [act2.id], Date.now(), 'manual');
        const doc2 = dayDoc(today);
        doc2.slotSkips = doc2.slotSkips || {};
        doc2.slotSkips[slotId] = true;
        saveDay(today);
        UI.toast('已停止本段，今日跳过（猫耳 ＋ 可恢复）');
        scheduleRender();
      }
    };
    window.addEventListener('pointermove', move, {passive:false});
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  },
  /* —— 拖空间卡 → 投放区开始手动递归 —— */
  dragStart(e, card){
    if(card.classList.contains('add')) return;
    e.preventDefault();
    const spId = card.dataset.space;
    const rect = card.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const offX = e.clientX - rect.left, offY = e.clientY - rect.top;
    Console.hold = Date.now();
    /* 幽灵卡必须挂在 body 下：操控台的 backdrop-filter 会生成包含块，
       让 fixed 定位相对面板生效并被 overflow 裁剪 → 手机上卡片“消失”的根源 */
    const ghost = card.cloneNode(true);
    ghost.classList.add('dragging');
    ghost.style.width = w+'px'; ghost.style.height = h+'px';
    ghost.style.left = rect.left+'px'; ghost.style.top = rect.top+'px';
    document.body.appendChild(ghost);
    card.style.opacity = '.35';
    const pad = document.getElementById('drop-pad');
    const move = ev => {
      ev.preventDefault();
      ghost.style.left = (ev.clientX - offX)+'px';
      ghost.style.top  = (ev.clientY - offY)+'px';
      if(pad){
        const pr = pad.getBoundingClientRect();
        const over = ev.clientX>pr.left && ev.clientX<pr.right && ev.clientY>pr.top && ev.clientY<pr.bottom;
        pad.classList.toggle('hot', over);
      }
    };
    const up = ev => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      Console.hold = 0;
      ghost.remove();
      card.style.opacity = '';
      if(pad) pad.classList.remove('hot');
      if(pad){
        const pr = pad.getBoundingClientRect();
        const over = ev.clientX>pr.left && ev.clientX<pr.right && ev.clientY>pr.top && ev.clientY<pr.bottom;
        if(over){ Rhythm.manualStart(spId); }
      }
    };
    window.addEventListener('pointermove', move, {passive:false});
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  }
};

/* ══════════════════════════════════════════════════════════════
   9.8 手势引擎 Gestures（仅纯净页生效：用户空间 home / 她的空间 mspace）
   双击=节律操控台 · 双击后左滑=空间栏 · 长按0.4s四向=导航页面
   ══════════════════════════════════════════════════════════════ */
/* 长按拖动 = 把目标页面从对侧边缘「拉出来」：拖动方向 → 页面 / 它从哪条边来 / 箭头朝向 */
const PULL_META = {
  left: {page:'summary', edge:'right',  arrow:'←'},   // 向左拉 → 我们的共识从右边来
  right:{page:'spaces',  edge:'left',   arrow:'→'},   // 向右拉 → 空间从左边来
  up:   {page:'todos',   edge:'bottom', arrow:'↑'},   // 向上拉 → 待办从下面来
  down: {page:'rhythm',  edge:'top',    arrow:'↓'}    // 向下拉 → 节律表从上面来
};
/* 每个页面的图标、名称与颜色（扇形与加载页色块都用它） */
const PAGE_META = {
  summary:{name:'我们的共识', ico:'📔', color:'#F5C542'},   // 暖黄
  todos:  {name:'待办',      ico:'☀',  color:'#8FD9A8'},   // 浅绿
  spaces: {name:'空间',      ico:'✦',  color:'#274B9F'},   // 深蓝
  rhythm: {name:'节律表',    ico:'⏱',  color:'#E2483F'},   // 红
  /* 她的空间里的三个页面（v1.3） */
  mgrow:  {name:'等级成长',   ico:'⭐', color:'#E874A4'},   // 粉
  moutfit:{name:'她的身体',   ico:'👗', color:'#9B7EDE'},   // 紫（v1.6a 由「服装」升级）
  mcons:  {name:'她眼中的我', ico:'💌', color:'#F2A6BE'},   // 桃
  mdairy: {name:'她的日记',   ico:'📔', color:'#7FB2E5'},   // 蓝
  mtalk:  {name:'对她说',     ico:'💬', color:'#FFB4D0'}    // 浅粉（v1.5；在 mspace 里双击进入）
};
/* 她的空间（v1.3 起）：四个方向四个页面——第四个方向（向下）v1.4 补齐成「她的日记」 */
const MSPACE_PULL_META = {
  up:   {page:'mgrow',   edge:'bottom', arrow:'↑'},   // 向上拉 → 等级成长从下面来
  left: {page:'moutfit', edge:'right',  arrow:'←'},   // 向左拉 → 服装从右边来
  right:{page:'mcons',   edge:'left',   arrow:'→'},   // 向右拉 → 她眼中的我从左边来
  down: {page:'mdairy',  edge:'top',    arrow:'↓'}    // 向下拉 → 她的日记从上面来
};
const PULL_COMMIT = 0.36;   // 拉出进度达到这个比例，松手就进入（否则弹回）
const SECTOR_HALF = 90;     // 半圆色块：张角 180°（平边贴着屏幕边缘，圆边朝画面里）

const Gestures = {
  _t0:0, _x0:0, _y0:0, _mode:'none', _moved:0, _lastTap:0, _dblTapAt:0,
  _lastX:0, _lastY:0, _dir:null, _holdT:null, _gvp:0, _builtView:null,
  /* 当前视图用的方向表：首页四向；她的空间三向 */
  _meta(){ return S.view === 'mspace' ? MSPACE_PULL_META : PULL_META; },
  /* 拉满所需的拖动距离 / 扇形的最大半径（都按屏幕短边缩放） */
  _pullMax(){ return Math.max(110, Math.min(window.innerWidth||360, window.innerHeight||640) * 0.46); },
  _maxR(){ return Math.min(window.innerWidth||360, window.innerHeight||640) * 0.62; },
  init(){
    this._buildEdges();
    this._ptrs = new Map();
    /* 挂在 document：操控台是 view-root 的兄弟节点，双击后左滑可能从面板上方区域起手 */
    document.addEventListener('pointerdown', e=>{ if(this._busy(e)) return; this._ptrDown(e); }, {passive:false});
    document.addEventListener('pointermove', e=>{ this._ptrMove(e); }, {passive:false});
    document.addEventListener('pointerup', e=>{ this._ptrUp(e); }, {passive:false});
    document.addEventListener('pointercancel', e=>{ this._ptrs.delete(e.pointerId); this._reset(); });
    window.addEventListener('resize', ()=>{ if(this._mode==='hold') this._buildEdges(); });
  },
  /* 指针登记：第一指走常规判定；第二指落下=进入双指捏合缩放（看板娘） */
  _ptrDown(e){
    this._ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(this._ptrs.size >= 2){
      clearTimeout(this._holdT);
      if(this._mode==='mdrag') Mascot.dragEnd(99);
      this._mode = 'pinch';
      this._hideEdges();
      const arr = [...this._ptrs.values()];
      const p1 = arr[arr.length-2], p2 = arr[arr.length-1];
      this._pinchD0 = Math.hypot(p2.x-p1.x, p2.y-p1.y) || 1;
      this._pinchS0 = S.settings.mascotScale || 1;
    }else{
      this._down(e);
    }
  },
  _ptrMove(e){
    if(this._ptrs.has(e.pointerId)) this._ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(this._mode==='pinch'){
      e.preventDefault();
      if(this._ptrs.size >= 2){
        const arr = [...this._ptrs.values()];
        const p1 = arr[arr.length-2], p2 = arr[arr.length-1];
        const d = Math.hypot(p2.x-p1.x, p2.y-p1.y);
        Mascot.pinchTo(this._pinchS0, d/this._pinchD0);
      }
      return;
    }
    if(this._mode!=='hold' && this._mode!=='maybe' && this._mode!=='mdrag') return;
    e.preventDefault();
    this._move(e);
  },
  _ptrUp(e){
    this._ptrs.delete(e.pointerId);
    if(this._mode==='pinch'){
      this._mode = 'none';
      Mascot.pinchEnd();
      return;
    }
    this._up(e);
  },
  /* 是否命中“可交互区域”（按钮/输入/卡片等）：不抢它们的触摸 */
  _busy(e){
    if(S.view!=='home' && S.view!=='mspace') return true;
    if(typeof Portal !== 'undefined' && Portal._active) return true;   // 传送过渡期间不接手势
    const el = e.target;
    if(el.closest && el.closest('[data-action], button, input, select, textarea, a, .console, .drop-pad, .sb-card, .sc-tri, .sc-ear')) return true;
    return false;
  },
  _down(e){
    const now = Date.now();
    if(e.pointerType!=='touch' && e.pointerType!=='mouse' && e.pointerType!=='pen') return;
    this._t0 = now; this._x0 = e.clientX; this._y0 = e.clientY;
    this._moved = 0; this._dir = null; this._mode = 'maybe';
    this._onMascot = !!(e.target.closest && e.target.closest('#mascot'));
    this._holdT = setTimeout(()=>{
      if(this._mode!=='maybe') return;
      if(this._moved > 30) return;      // 手指轻微抖动不打断长按（手机常见）
      this._mode = 'hold';
      this._showEdges(e.clientX, e.clientY);
    }, 700);                            // 长按 0.7 秒判定成功
  },
  _move(e){
    const dx = e.clientX - this._x0, dy = e.clientY - this._y0;
    this._moved = Math.max(this._moved, Math.hypot(dx, dy));
    if(this._mode==='mdrag'){
      e.preventDefault();
      Mascot.dragMove(e.clientX, e.clientY);
      return;
    }
    if(this._mode==='hold'){
      e.preventDefault();
      /* 拖动方向（不是箭头方向）：向左拉 = 把右边的「我们的共识」拽出来 */
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up');
      this._dir = dir;
      this._pullTo(dir, Math.max(Math.abs(dx), Math.abs(dy)));
    }else if(this._mode==='maybe' && this._moved > 14 && this._onMascot){
      /* 按住立绘滑动 = 单指拖动位置（位移触发，不占单击/双击/长按） */
      clearTimeout(this._holdT);
      this._mode = 'mdrag';
      Mascot.dragStart(this._x0, this._y0);
      Mascot.dragMove(e.clientX, e.clientY);
    }else if(this._mode==='maybe' && this._moved > 30){
      /* 明确在拖动（不是长按）：若是「双击后的左滑」→ 切到空间栏 */
      clearTimeout(this._holdT);
      if(S.view==='home' && Date.now() - this._dblTapAt < 420 && dx < -52 && S.consOpen){
        this._reset();
        S.consTab = 'spaces';
        Console.render();
      }
    }
  },
  _up(e){
    if(this._mode==='mdrag'){
      this._mode = 'none';
      Mascot.dragEnd(this._moved);
      return;
    }
    if(this._mode==='hold'){
      clearTimeout(this._holdT);
      const d = this._dir, p = this._gvp;
      this._mode = 'none';
      this._hideEdges();
      if(d && p >= PULL_COMMIT){                 // 拉够了：进加载页 → 目标子页
        S.sumDay = null;
        this._launch(d);
      }                                          // 没拉够 = 弹回，什么也不发生
      return;
    }
    if(this._mode!=='maybe'){ this._reset(); return; }
    clearTimeout(this._holdT);
    const moved = this._moved;
    this._mode = 'none';
    const quick = Date.now() - this._t0 < 320 && moved < 12;
    if(quick){
      const now2 = Date.now();
      /* 双击：用户空间=呼出/收回节律操控台；她的空间=对她说（v1.5，正好用掉这个闲置的手势位） */
      if(now2 - this._lastTap < 300 && Math.hypot(e.clientX-this._lastX, e.clientY-this._lastY) < 42 &&
         (S.view==='home' || S.view==='mspace')){
        /* 记住时刻，供“双击后左滑”判定 */
        this._lastTap = 0;
        this._dblTapAt = now2;
        this._reset();
        if(S.view==='mspace'){
          Love.enter();
          pageLoad(PAGE_META.mtalk, ()=>{ goView('mtalk'); });   // 加载页闪一下再进聊天页
          return;
        }
        if(S.consOpen){ S.consOpen = false; Console.close(); }
        else{ S.consTab = 'slots'; Console.open(); }
        return;
      }
      this._lastTap = now2; this._lastX = e.clientX; this._lastY = e.clientY;
      /* 单击：若上一个是双击即将到，暂存 */
      setTimeout(()=>{ if(this._lastTap && Date.now()-this._lastTap>330) this._lastTap = 0; }, 360);
      /* 单击看板娘：稍等确认不是双击（双击=呼出操控台，二者互不冲突），再触发互动 */
      if(this._onMascot){
        const tapAt = now2;
        setTimeout(()=>{
          if(this._lastTap === tapAt && typeof Mascot!=='undefined') Mascot.tap();
        }, 340);
      }
    }
    this._reset();
  },
  _reset(){
    if(this._mode==='mdrag'){ this._mode='none'; Mascot.dragEnd(Math.max(99, this._moved)); return; }
    this._mode='none'; this._dir=null; this._gvp=0; clearTimeout(this._holdT); this._hideEdges();
  },
  /* 当前视图的可用方向各一个扇形色块 + 边缘提示（她的空间只有 3 个方向） */
  _buildEdges(){
    const root = document.getElementById('gesture-root');
    if(!root) return;
    const meta = this._meta();
    /* 半圆朝向 = 从这条边鼓进屏幕里（0°=12点、90°=3点、180°=6点、270°=9点） */
    const DEG = {right:270, left:90, top:180, bottom:0};
    const edges = [];
    for(const d in meta){ if(edges.indexOf(meta[d].edge) < 0) edges.push(meta[d].edge); }
    let h = edges.map(edge=>
      '<div class="gv-wedge '+edge+'" data-edge="'+edge+'">'+
        '<svg viewBox="0 0 200 200"><path d="'+sectorPath(DEG[edge], SECTOR_HALF, 100)+'"/></svg>'+
      '</div>').join('');
    h += Object.keys(meta).map(d=>{
      const pm = meta[d], m = PAGE_META[pm.page];
      return '<div class="gv-edge '+pm.edge+'" data-dir="'+d+'" style="--gvc:'+m.color+'">'+
               '<span class="gve-arrow">'+pm.arrow+'</span>'+
               '<span class="gve-ring">'+m.ico+'</span>'+
               '<span class="gve-name">'+esc(m.name)+'</span>'+
             '</div>';
    }).join('');
    h += '<div class="gv-hold"><span class="gv-hold-ring"></span></div>';
    root.innerHTML = h;
    root.style.setProperty('--gvp', '0');
  },
  _showEdges(x, y){
    const root = document.getElementById('gesture-root');
    if(!root) return;
    this._gvp = 0;
    root.classList.add('on');
    /* 长按成功圆圈：出现在按压点，由浅渐实 */
    const c = root.querySelector('.gv-hold');
    if(c){ c.style.left = x+'px'; c.style.top = y+'px'; }
  },
  /* 拖动 → 目标页面的半圆随距离长大、边缘提示亮起、拉够了解锁提示 */
  _pullTo(dir, len){
    const root = document.getElementById('gesture-root');
    if(!root) return;
    const pm = this._meta()[dir];
    if(!pm) return;                       // 这个方向在当前视图没有页面（她的空间的「向下」）
    const m = PAGE_META[pm.page];
    const p = Math.max(0, Math.min(1, len / this._pullMax()));
    this._gvp = p;
    root.style.setProperty('--gvp', p.toFixed(3));
    root.style.setProperty('--gvc', m.color);
    root.classList.toggle('locked', p >= PULL_COMMIT);
    root.querySelectorAll('.gv-edge').forEach(el=>{ el.classList.toggle('on', el.dataset.dir===dir); });
    const rr = Math.round(p * this._maxR()) * 2;
    root.querySelectorAll('.gv-wedge').forEach(w=>{
      const on = w.dataset.edge === pm.edge;
      w.classList.toggle('on', on);
      if(on){ w.style.width = w.style.height = rr+'px'; }
    });
  },
  _launch(dir){
    const pm = this._meta()[dir];
    if(!pm) return;
    const page = pm.page;
    pageLoad(PAGE_META[page], ()=>{ goView(page); });   // 加载页闪一下再进目标页
  },
  _hideEdges(){
    const root = document.getElementById('gesture-root');
    if(!root) return;
    this._gvp = 0;
    root.classList.remove('on','locked');
    root.style.setProperty('--gvp', '0');
    root.querySelectorAll('.gv-edge.on').forEach(a=>a.classList.remove('on'));
    root.querySelectorAll('.gv-wedge').forEach(w=>{ w.classList.remove('on'); });
  }
};

/* ══════════════════════════════════════════════════════════════
   9.9 红色超时 / 闹钟 等场景 → 角色气泡提醒（只挑最紧要的）
   ══════════════════════════════════════════════════════════════ */
const Notify = {
  lastScan:0,
  tick(now){
    if(typeof Bubbles==='undefined') return;
    /* 6 秒扫一次最紧急待办：进入红色 → 提醒（同一条只提醒一次） */
    if(now - this.lastScan > 6000){
      this.lastScan = now;
      let urgent = null;
      for(const t of S.todos){
        if(t.archived || todoStatus(t, now)==='done') continue;
        const due = TodoLogic.dueAt(t, now);
        if(due==null) continue;
        const rem = due - now;
        const redAt = (t.thresholdRedMin ?? S.settings.defaultRedMinutes) * 60000;
        if(rem <= redAt){
          if(!urgent || due < TodoLogic.dueAt(urgent, now)) urgent = t;
        }
      }
      if(urgent){
        const sp = spaceById(urgent.spaceId);
        Bubbles.push('「'+urgent.title+'」进入红色倒计时，再不行动要超时了！', {
          key:'red-'+urgent.id, sub:sp?'来自「'+sp.name+'」':'最优先待办',
          go:()=>goView('todos')
        });
      }
    }
  },

  /* ══ v1.5 她走出软件：系统通知 ══
     只做一件事——把「她说的话」在你切出去之后送到手机上。不发服务器、不联网，
     所以只有软件还活着（前台或后台）的时候才送得出去；关掉就没有了，这是浏览器的边界。
     file:// 直接双击打开的桌面文件用不了（浏览器不给），要 PWA 部署后在手机上装主屏幕。 */
  _reg:null,
  supported(){
    try{
      return (typeof Notification !== 'undefined') && !!Notification &&
             (typeof navigator !== 'undefined') && !!navigator.serviceWorker &&
             (typeof location !== 'undefined') && /^https?:$/.test(String(location.protocol || ''));
    }catch(e){ return false; }
  },
  enabled(){
    const s = S.settings.herNotify;
    return !!(s && s.on) && this.supported();
  },
  permission(){ try{ return (typeof Notification !== 'undefined' && Notification) ? Notification.permission : 'unsupported'; }catch(e){ return 'unsupported'; } },
  /* 注册 Service Worker（没有就静默跳过，功能整体降级，绝不报错） */
  register(){
    if(!this.supported()) return null;
    try{
      navigator.serviceWorker.register('sw.js').then(reg=>{ this._reg = reg; }, ()=>{});
    }catch(e){}
    return null;
  },
  /* 请求系统通知权限：回调式（老 Safari 只认回调，新浏览器两种都给，用 done 去重） */
  request(cb){
    if(!this.supported()){ if(cb) cb('unsupported'); return; }
    let done = false;
    const once = r => { if(done) return; done = true; if(cb) cb(r || 'default'); };
    try{
      const p = Notification.requestPermission(once);
      if(p && p.then) p.then(once, ()=>once('error'));
    }catch(e){ once('error'); }
  },
  push(title, body){
    if(!this.enabled()) return false;
    const opts = {body:String(body == null ? '' : body), tag:'ps-her',
                  icon:CONFIG.LOVE.NOTIFY_ICON, badge:CONFIG.LOVE.NOTIFY_ICON};
    try{
      if(this._reg && this._reg.showNotification){ this._reg.showNotification(String(title), opts); return true; }
      if(this.permission() === 'granted'){ new Notification(String(title), opts); return true; }
    }catch(e){}
    return false;
  },
  /* 她说的话 → 只有你把软件切到后台了才发通知（你正看着屏幕的时候，气泡就够了）
     通知的抬头永远是她的名字：像有人给你发消息，而不是系统在提醒你 */
  her(text, sub){
    if(!text) return false;
    if(typeof document === 'undefined' || !document.hidden) return false;
    return this.push(CONFIG.LOVE.NAME, sub ? ('【' + sub + '】' + text) : text);
  }
};

/* 渲染入口：home=纯净看板娘页（无顶栏无静态UI），其余为带返回按钮的子页 */
const VIEW_TITLES = {home:'', mspace:'', summary:'我们的共识', todos:'事务待办', spaces:'可能性空间', rhythm:'节律表', settings:'设置', alarm:'闹钟', space:'',
  mgrow:'等级成长', moutfit:'她的身体', mcons:'她眼中的我', mdairy:'她的日记', mtalk:'对她说'};
function renderView(){
  const root = document.getElementById('view-root');
  const ae = document.activeElement;
  if(ae && root.contains(ae)){
    // 只有正在输入的输入框才需要保护焦点（重渲染会打断输入）。
    // 按钮被点击后保持焦点会无限推迟重渲染，表现为"点空白处才变化"——
    // 非输入元素先失焦再重建。
    const tag = ae.tagName;
    if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT'){ scheduleRender(); return; }
    try{ ae.blur(); }catch(e){}
  }
  const isPure = S.view==='home' || S.view==='mspace';   // 纯净页 = 用户空间首页 + 她的空间
  let html;
  if(S.view==='space'){
    const sp = spaceById(S.spaceId);
    html = Views.spaceDetail();
    document.getElementById('hdr-title').textContent = sp ? sp.name : '空间';
  }else{
    html = Views[S.view] ? Views[S.view]() : '';
    document.getElementById('hdr-title').textContent = VIEW_TITLES[S.view]||'';
  }
  root.innerHTML = html;
  root.classList.toggle('pure', isPure);
  const hdr = document.getElementById('app-header');
  if(hdr) hdr.classList.toggle('hidden', isPure);
  document.getElementById('back-btn').classList.toggle('hidden', isPure);
  document.body.classList.toggle('pure-mode', isPure);
  document.body.classList.toggle('mspace-mode', S.view==='mspace');   // 她的世界：换一套背景
  /* 长按方向提示随视图变化（首页 4 向 / 她的空间 3 向），只在视图真的换了时重建 */
  if(typeof Gestures !== 'undefined' && Gestures._builtView !== S.view){
    Gestures._builtView = S.view;
    Gestures._buildEdges();
  }
  /* 离开纯净页：收起操控台 / 空间栏，清手势残留；回纯净页时若有待显示气泡则补上
     （操控台自身按签名自更新，不随 renderView 重绘——重绘会重播动画=闪烁） */
  if(!isPure){
    S.consOpen = false; S.sbOpen = false;
    const cr = document.getElementById('console-root'); if(cr) cr.innerHTML = '';
  }else{
    if(typeof Bubbles !== 'undefined') Bubbles.render();
  }
  /* 离开纯净页时，她收起动作（换页中途还在蹦会怪）；忙碌页让 Q版那只站到右下角陪着 */
  if(typeof Director !== 'undefined') Director.stop();
  if(typeof QCorner !== 'undefined') QCorner.sync();
  collectBindings();
}

/* 从存储重读全部实体（导入/多标签页同步用），含旧数据迁移 */
function refreshFromStorage(){
  S.meta = Store.get('meta', {});
  S.settings = {...CONFIG.DEFAULT_SETTINGS, ...Store.get('settings', {})};
  S.spaces = Store.get('spaces', []);
  S.todos = Store.get('todos', []);
  S.catnotes = Store.get('catnotes', []);
  S.sessions = Store.get('sessions', []);
  S.alarms = Store.get('alarms', []);
  S.alarmFired = {};
  S.days.clear();
  S.confirmMap.clear();
  let todosChanged = false;
  for(const t of S.todos){
    /* 迁移1：旧版单条完成记录 lastCompletedKey → 按天集合 doneKeys */
    if(!Array.isArray(t.doneKeys)){
      t.doneKeys = t.lastCompletedKey != null ? [t.lastCompletedKey] : [];
      todosChanged = true;
    }
    /* 迁移2：变红默认阈值 120→30 分钟（仅迁移从未自定义过的卡片） */
    if(t.thresholdRedMin===120 && t.thresholdYellowMin===240){
      t.thresholdRedMin = 30;
      todosChanged = true;
    }
  }
  if(todosChanged) Store.set('todos', S.todos);
  Grow.invalidate();
  S._level = Grow.level();          // 多标签页/导入后，等级基线与推导结果对齐（不误播升级）
}

/* ══════════════════════════════════════════════════════════════
   10. Boot 启动
   ══════════════════════════════════════════════════════════════ */
function boot(){
  const p = Store.init();
  if(Store.ready) bootMain();        // 兼容模式（localStorage）同步启动
  else p.then(bootMain);             // 大容量模式（IndexedDB）初始化完成后启动
}
function bootMain(){
  S.memoryMode = !Store.ok;
  refreshFromStorage();
  if(!S.meta.createdAt){ S.meta = {schemaVersion:CONFIG.SCHEMA, appVersion:CONFIG.VERSION, createdAt:Date.now(), lastSavedAt:Date.now()}; Store.set('meta', S.meta); }
  S.lastDay = D.dateKey(Date.now());
  S.lastHb = Date.now();
  Store.set('heartbeat', {lastActiveAt:S.lastHb});
  gcImages();               // 回收无引用图片
  reconcileNow();
  applyBg();                // 应用自定义背景
  applyAnimLevel();         // 动画强度三档
  renderView();
  /* 感情线先结账（感情会凉：好几天没打开，每天 -1）——必须排在 Her.onBoot 之前，
     因为它要读的是「上一次打开」的日期，而 Her.onBoot 一进来就把今天记上了 */
  if(typeof Love !== 'undefined'){ try{ Love.onBoot(Date.now()); }catch(e){ console.error('[Love]', e); } }
  /* 她先开口（问候 / 好久不见 / 昨天没打卡）——必须排在 renderView 之后，
     否则气泡没有挂载点（#bubble-root 是随视图渲染出来的） */
  if(typeof Her !== 'undefined'){ try{ Her.onBoot(Date.now()); }catch(e){ console.error('[Her]', e); } }
  /* 她的通知：注册 Service Worker（file:// 或老浏览器会静默跳过，功能整体降级） */
  if(typeof Notify !== 'undefined'){ try{ Notify.register(); }catch(e){} }
  /* 摇一摇（v1.6a）：安卓这类不用问你的地方直接接上；iPhone 要你先点头 → 由她开口问一次 */
  if(typeof Shake !== 'undefined'){ try{ if(Shake.supported() && !Shake.needAsk()) Shake.attach(); }catch(e){} }
  setInterval(tick, 1000);

  /* 事件绑定 */
  const viewRoot = document.getElementById('view-root');
  viewRoot.addEventListener('click', e=>{
    const t = e.target.closest('[data-action]');
    if(!t) return;
    if(t.dataset.action==='open-space'){ goSpace(t.dataset.id); return; }
    Actions[t.dataset.action] && Actions[t.dataset.action](t, e);
  });
  /* 她在等你安静下来才开口：任何一次触碰都算「你在」；
     你在的时候她也不自顾自演戏——你一碰屏幕，她就把动作收起来看着你（v1.6a） */
  document.addEventListener('pointerdown', ()=>{
    if(typeof Love !== 'undefined') Love.touch();
    if(typeof Director !== 'undefined') Director.userTouch();
  }, {passive:true});
  /* 「对她说」输入框：回车 = 发送 */
  viewRoot.addEventListener('keydown', e=>{
    if(e.key !== 'Enter' || e.target.id !== 'mtalk-in') return;
    e.preventDefault();
    Actions['love-send']();
  });
  viewRoot.addEventListener('input', e=>{
    const t = e.target.closest('[data-oninput]');
    if(t && Actions[t.dataset.oninput]) Actions[t.dataset.oninput](t, e);
  });
  viewRoot.addEventListener('change', e=>{
    const t = e.target.closest('[data-onchange]');
    if(t && Actions[t.dataset.onchange]) Actions[t.dataset.onchange](t, e);
  });
  /* 长按（她的衣柜：按住某套服装 0.5 秒 = 删除，和星标入口同一套手感）：
     用委托，页面重绘也不用重新绑；触发后给元素打 __held 标记，
     紧随其后的 click（= 穿上）看到标记就跳过，两个动作不打架 */
  const HOLD_DEL_MS = 500;
  const holdAt = e => (e.target && e.target.closest) ? e.target.closest('[data-hold]') : null;
  viewRoot.addEventListener('pointerdown', e=>{
    const t = holdAt(e);
    if(!t) return;
    t.__held = false;
    t.classList.add('holding');
    clearTimeout(t.__holdT);
    t.__holdT = setTimeout(()=>{
      t.__holdT = null;
      t.__held = true;
      t.classList.remove('holding');
      if(Actions[t.dataset.hold]) Actions[t.dataset.hold](t, e);
    }, HOLD_DEL_MS);
  }, {passive:true});
  const cancelHold = e=>{
    const t = holdAt(e);
    if(!t) return;
    clearTimeout(t.__holdT);
    t.__holdT = null;
    t.classList.remove('holding');
  };
  viewRoot.addEventListener('pointerup', cancelHold, {passive:true});
  viewRoot.addEventListener('pointercancel', cancelHold, {passive:true});
  /* 顶栏按钮（返回/设置） */
  document.getElementById('app-header').addEventListener('click', e=>{
    const t = e.target.closest('[data-action]');
    if(t && Actions[t.dataset.action]) Actions[t.dataset.action](t, e);
  });
  /* 操控台/手势层内的事件（面板独立于 view-root，需单独分发） */
  const consoleRoot = document.getElementById('console-root');
  if(consoleRoot){
    consoleRoot.addEventListener('click', e=>{
      const t = e.target.closest('[data-action]');
      if(!t) return;
      if(t.dataset.action==='open-space'){ goSpace(t.dataset.id); return; }
      Actions[t.dataset.action] && Actions[t.dataset.action](t, e);
    });
    consoleRoot.addEventListener('input', e=>{
      const t = e.target.closest('[data-oninput]');
      if(t && Actions[t.dataset.oninput]) Actions[t.dataset.oninput](t, e);
    });
  }
  if(typeof Gestures !== 'undefined') Gestures.init();   // 纯净页手势：双击/长按四向
  const modalRoot = document.getElementById('modal-root');
  modalRoot.addEventListener('click', e=>{
    const t = e.target.closest('[data-action]');
    if(!t) return;
    if(t.dataset.action==='modal-close'){ UI.closeModal(); return; }
    if(Actions[t.dataset.action]) Actions[t.dataset.action](t, e);
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape') UI.closeModal();
  });
  /* 共享的隐藏文件框（v1.4.1 起支持多选）：回调统一收到「文件数组」，
     用几张由各处理器自己决定（multiple 每次都由调用方显式设置，避免串档） */
  document.getElementById('file-input').addEventListener('change', e=>{
    const cb = S.pendingFileCb; S.pendingFileCb = null;
    const files = e.target.files ? Array.from(e.target.files) : [];
    if(cb && files.length) cb(files);
  });
  /* 首次交互解锁音频（闹钟提示音需要） */
  document.addEventListener('pointerdown', function unlockAudio(){ Alarms.unlockAudio(); }, {once:true});
  window.addEventListener('beforeunload', ()=>{ Store.set('heartbeat', {lastActiveAt:Date.now()}); });
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden) return;
    const back = ()=>{
      Store.set('heartbeat', {lastActiveAt:Date.now()});
      reconcileNow();
      scheduleRender();
    };
    if(Store.mode==='idb') Store.reload().then(back);   // 大容量模式：回到前台先重读新仓库
    else back();
  });
  /* 多标签页同步：大容量模式靠 BroadcastChannel + localStorage 哨兵键，兼容模式靠 storage 事件 */
  if(Store.bc) Store.bc.onmessage = ()=>{ Store.reload().then(()=>{ refreshFromStorage(); scheduleRender(); UI.toast('检测到数据在另一个标签页被修改，已同步'); }); };
  window.addEventListener('storage', e=>{
    if(e.key && e.key.startsWith(CONFIG.PREFIX)){
      const sync = ()=>{
        refreshFromStorage();
        scheduleRender();
        UI.toast('检测到数据在另一个标签页被修改，已同步');
      };
      if(Store.mode==='idb') Store.reload().then(sync);
      else sync();
    }
  });
  UI.toast('欢迎来到'+CONFIG.APP_NAME);
}

    const sp3 = {id:'sp_demo3', name:'软件开发', icon:'💻', color:CONFIG.SPACE_COLORS[4], note:'做出自己的App', createdAt:now, archived:false, categories:[mkCat('cat_d3_',0),mkCat('cat_d3_',1),mkCat('cat_d3_',2),mkCat('cat_d3_',3)]};
    S.spaces.push(sp1, sp2, sp3);
    const mkTodo = o => ({id:uid('td_'), type:'task', title:'', note:'', repeat:'daily', dueAt:null, dailyTime:null, weekdays:[], weeklyTime:null,
      spaceId:null, thresholdYellowMin:S.settings.defaultYellowMinutes, thresholdRedMin:S.settings.defaultRedMinutes,
      lastCompletedKey:null, completedAt:null, createdAt:now, archived:false, ...o});
    S.todos.push(
      mkTodo({title:'接妹妹放学', type:'task', repeat:'weekly', weekdays:[1,2,3,4,5], weeklyTime:'20:00', note:'学校南门'}),
      mkTodo({title:'办签证', type:'task', repeat:'once', dueAt:D.hhmmToTs(D.addDaysTs(now,2),'12:00'), note:'带齐材料'}),
      mkTodo({title:'背50个日语单词', type:'task', repeat:'daily', dailyTime:'21:00', spaceId:sp1.id}),
      mkTodo({title:'喝水8杯', type:'habit', repeat:'daily', dailyTime:'22:00'}),
      mkTodo({title:'买洗衣液', type:'memo', repeat:'once', dueAt:null})
    );
    S.catnotes.push(
      {id:uid('cn_'), spaceId:sp1.id, categoryId:'cat_d1_0', title:'五十音图平假名速记', note:'あ 安 → 阿……用汉字来源联想记忆。', images:[], createdAt:now, updatedAt:now}
    );
    const today = D.dateKey(now), yest = D.dateKey(D.addDaysTs(now,-1));
    const mkIter = (emoji, tags, note) => ({id:uid('di_'), emoji, tags, note, images:[], createdAt:now, updatedAt:now, catId:null});
    dayDoc(today).spaceRecords[sp1.id] = [mkIter('😄', ['五十音复习','单词50个'], '状态不错，平假名基本记住了。')];
    dayDoc(today).spaceRecords[sp2.id] = [mkIter('🙂', ['速写练习'], '画了两张人物速写，手有点生。')];
    dayDoc(yest).spaceRecords[sp1.id] = [mkIter('😐', ['五十音'], '开始学五十音。')];
    if(S.sessions.length===0){
      const t1 = D.hhmmToTs(D.dkToTs(today),'08:00'), t2 = D.hhmmToTs(D.dkToTs(today),'09:30');
      if(t2 <= now) S.sessions.push({id:uid('rs_'), spaceId:sp1.id, mode:'manual', day:today, start:t1, end:t2, endedBy:'manual', note:'', scheduleId:null});
      const t3 = D.hhmmToTs(D.dkToTs(today),'19:00'), t4 = D.hhmmToTs(D.dkToTs(today),'20:00');
      if(t4 <= now) S.sessions.push({id:uid('rs_'), spaceId:sp2.id, mode:'manual', day:today, start:t3, end:t4, endedBy:'manual', note:'', scheduleId:null});
      saveSessions();
    }
    dayDoc(today).rhythmEntries.push({id:uid('re_'), at:'08:30', text:'晨间散步时想到的新点子', images:[], createdAt:now});
    saveDay(today); saveDay(yest);
    saveSpaces(); saveTodos(); saveCatnotes();
    scheduleRender();
  }
};
window.PS = Debug;  // 控制台可输入 PS.debug() / PS.seed()

boot();
</script>

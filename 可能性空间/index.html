  /* —— 「我们之间」区块（v1.5）：好感条 + 当前阶段 + 你们认识多少天 ——
     放在「她眼中的我」里——她记得的你 + 你们的关系，本来就是一页 */
  _loveBlock(now){
    const st = Love.stage(), nx = Love.nextStage(), total = Love.total();
    const to = nx ? nx.min : null;
    const pct = to ? clamp((total - st.min) / Math.max(1, to - st.min), 0, 1) : 1;
    let h = '<div class="card pad lv-block">'+
      '<div class="gl-sec-t">我们之间 <span class="gl-sec-n">认识第 ' + Love.daysTogether(now) + ' 天</span></div>'+
      '<div class="lv-head"><span class="lv-stage">'+esc(st.name)+'</span>'+
        '<span class="lv-sub">她叫你「'+esc(st.you)+'」</span></div>'+
      '<div class="gl-bar lv-bar"><i class="gl-fill lv-fill" style="width:'+Math.round(pct*100)+'%"></i></div>'+
      '<div class="gl-meta">好感 '+total+(to ? (' · 距离「'+esc(nx.name)+'」还差 '+(to-total)) : ' · 已经是最亲密的阶段了 ✦')+'</div>'+
      '<div class="hint">'+esc(st.desc)+'。好感只来自你和她相处的时间——戳戳她、来她的空间、翻她的日记、回答她的问题；'+
        '跟你专注多久、完成几件事没有关系（那是等级的事）。</div>'+
      '<button class="btn btn--small" data-action="goto-mtalk" style="margin-top:10px">💬 对她说说话</button>'+
    '</div>';
    return h;
  },
  /* —— 对她说（她的空间里双击屏幕 / 点 💬 进来，v1.5）：你说一句，她答一句 ——
     纯本地规则（关键词命中），不联网；听不懂的句子她会收进小本子，等以后接上 AI 再回你 */
  mtalk(){
    const now = Date.now();
    const log = Love.log();
    const nm = CONFIG.LOVE.NAME;
    let h = '<section class="sec"><h2 class="sec-title">对她说<span class="sec-extra">'+esc(nm)+'在这儿</span></h2>';
    h += '<div class="lv-chat" id="lv-chat">';
    if(!log.length){
      h += '<div class="lv-msg lv-msg--her"><div class="lv-who">'+esc(nm)+'</div>'+
           esc(Her.voice('chatHi', Her.ctx(now)))+'</div>';
    }else{
      for(const m of log){
        h += '<div class="lv-msg lv-msg--'+(m.w==='me'?'me':'her')+'">'+
             '<div class="lv-who">'+(m.w==='me'?'我':esc(nm))+'</div>'+escLn(m.t)+'</div>';
      }
    }
    h += '</div>';
    h += '<div class="lv-chips">'+CONFIG.LOVE.CHIPS.map(c=>
      '<button class="chip" data-action="love-chip" data-t="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>';
    h += '<div class="lv-input">'+
      '<input class="input" id="mtalk-in" placeholder="跟'+esc(nm)+'说点什么…" maxlength="200" autocomplete="off">'+
      '<button class="btn btn--primary" data-action="love-send">发送</button>'+
    '</div>';
    const notes = Love.notes();
    h += '<div class="hint">她认得出早安晚安、想你、夸她、难过、无聊这些。暂时听不懂的句子，她会先收进小本子'+
      (notes.length ? '（已经收着 '+notes.length+' 句）' : '')+'——等以后接上 AI，她会慢慢都学会。</div>';
    h += '</section>';
    return h;
  },
  /* —— 纯净看板娘首页（背景+立绘两层分离，无静态UI，一切由手势呼出） —— */
  home(){
    const now = Date.now();
    const dkToday = D.dateKey(now);
    const act = Rhythm.activeManual();
    /* 日期/时间字号可在设置里自定义（默认日期15px · 时间36px） */
    const dfs = S.settings.pureDateFs || CONFIG.PURE_DATE_FS.def, cfs = S.settings.pureClockFs || CONFIG.PURE_CLOCK_FS.def;
    let h = '<div class="pure-screen" style="--pdfs:'+dfs+'px;--pcfs:'+cfs+'px">';
    /* 顶部：日期 + 日期下方的大时间（日期点=共识页，时间点=闹钟） */
    h += '<div class="pure-date">'+
           '<button class="mini-date" data-action="go-summary-today" aria-label="我们的共识（每日总结与日历）" data-bind="bigdate"></button>'+
           '<button class="pure-clock num" data-action="open-alarm" aria-label="闹钟" data-bind="bigclock">--:--:--</button>'+
         '</div>';
    /* 立绘层（首页与「她的空间」共用，见 _mascotZone） */
    h += this._mascotZone();
    /* 看板娘气泡（提醒用，点击可跳转） */
    h += '<div id="bubble-root" class="hidden"></div>';
    /* 底部角落：最优先待办（实时倒计时，点=待办页）· 正在递归（点=节律表）· 今日剩余额度（点=节律表） */
    let urgent = null;
    for(const t of S.todos){
      if(t.archived || todoStatus(t, now)==='done') continue;
      const due = TodoLogic.dueAt(t, now);
      if(due == null) continue;
      if(!urgent || due < TodoLogic.dueAt(urgent, now)) urgent = t;
    }
    h += '<div class="pure-bottom">'+
           '<div class="mini-chips">'+
             (urgent ? '<button class="minichip" data-bind="urgent" data-id="'+urgent.id+'" data-action="goto-todos" style="color:var(--red)">'+
                        '最优先：<b class="ut">'+esc(urgent.title)+'</b> · <span class="num" data-cd>'+fmtRemain(TodoLogic.dueAt(urgent, now)-now)+'</span></button>' : '')+
             (act ? '<button class="minichip" data-bind="rec" data-space="'+act.spaceId+'" data-action="goto-rhythm" style="color:var(--accent-dark)">'+
                      '<span class="pulse-dot"></span> '+esc(spaceNameOf(act.spaceId))+' · <span class="num" data-rec-t>'+fmtDur(now-act.start)+'</span></button>' : '')+
           '</div>'+
           '<div class="mini-chips right">'+
             '<button class="minichip" data-action="goto-rhythm" aria-label="节律表">剩余 <b data-bind="quota-mini">--</b></button>'+
             /* 桌面端：右下时间带面板（今日24小时递归带，进行中时显示实时计时） */
             '<div class="desk-band">'+
               '<div class="db-head"'+(act ? ' data-bind="rec" data-space="'+act.spaceId+'"' : '')+'>'+
                 (act ? '<span class="pulse-dot"></span> 正在递归：'+esc(spaceNameOf(act.spaceId))+' · <span class="num" data-rec-t>'+fmtDur(now-act.start)+'</span>'
                      : '今日递归时间带')+
               '</div>'+
               '<div class="rh-track">'+
                 S.sessions.filter(s=>s.day===dkToday && s.end!=null).sort((a,b)=>a.start-b.start).map(s=>bandHtml(s,false)).join('')+
                 Rhythm.activeSlices().filter(s=>s.day===dkToday).map(s=>bandHtml(s,true)).join('')+
                 '<div class="rh-now" data-bind="nowline" style="left:'+((now-D.dkToTs(dkToday))/86400000*100).toFixed(3)+'%"></div>'+
               '</div>'+
             '</div>'+
           '</div>'+
         '</div>';
    h += '<div class="pure-hint">双击呼出节律表操控台 · 长按滑动切换页面</div>';
    h += '</div>';
    return h;
  },
  /* —— 每日总结页（长按右滑进入）：日历 + 「干了什么」+「积累了什么」 —— */
  summary(){
    const now = Date.now();
    const today = D.dateKey(now);
    const dk = S.sumDay || today;
    const isTodayView = dk === today;
    const vNow = D.dkToTs(dk) + 86400000 - 1;
    const doc = dayDoc(dk);
    const Q = Rhythm.quotaFor(dk);
    const consumed = Rhythm.consumedMinutes(dk, now);
    const remain = Math.max(0, Q - consumed);
    let h = '';
    /* 日期时间板块（和旧首页一样：实时时钟，点击=隐藏的闹钟入口） */
    h += '<div class="card card--mark home-hero" data-action="open-alarm">'+
           '<div class="hero-date" data-bind="bigdate"></div>'+
           '<div class="hero-clock num" data-bind="bigclock"></div>'+
         '</div>';
    h += '<section class="sec"><h2 class="sec-title">我们的共识<span class="sec-extra">'+(isTodayView?'今天':'回看')+'这一天干了什么 · 积累了什么</span></h2>';
    /* 月历：点任意一天 → 跳到那一天总结（今天粗框、有记录的点圆点、已选高亮）
       标题行中间的「年月」可点，收起/展开整个日历（收起状态记在设置里） */
    if(!S.sumCalY){ const d = new Date(); S.sumCalY = d.getFullYear(); S.sumCalM = d.getMonth(); }
    const calOpen = S.settings.sumCalOpen !== false;
    const first = new Date(S.sumCalY, S.sumCalM, 1);
    const startWd = first.getDay();
    const daysIn = new Date(S.sumCalY, S.sumCalM+1, 0).getDate();
    /* 日期条（今天+表情）在最上面，日历紧贴其下 */
    h += dayNavHtml('sum');
    h += '<div class="card pad" style="margin-top:10px;margin-bottom:12px">'+
      '<div class="cal-head">'+
        '<button class="icon-btn" data-action="sum-cal-prev" aria-label="上个月">◀</button>'+
        '<button class="cal-title" data-action="sum-cal-toggle" aria-label="收起或展开日历">'+S.sumCalY+'年'+(S.sumCalM+1)+'月 <span class="cal-caret">'+(calOpen?'▾ 收起':'▸ 展开')+'</span></button>'+
        '<button class="icon-btn" data-action="sum-cal-next" aria-label="下个月">▶</button>'+
      '</div>';
    if(calOpen){
      h += '<div class="cal-grid cal-wd">'+'日一二三四五六'.split('').map(w=>'<span>'+w+'</span>').join('')+'</div>'+
           '<div class="cal-grid" style="margin-top:4px">';
      for(let i=0;i<startWd;i++) h += '<span></span>';
      for(let d=1;d<=daysIn;d++){
        const dk2 = S.sumCalY+'-'+pad2(S.sumCalM+1)+'-'+pad2(d);
        const mood = (Store.loadDay(dk2)||{}).dayMood;
        h += '<button class="cal-day'+(dk2===today?' today':'')+(dk2===dk?' sel':'')+(dayHasData(dk2)?' has':'')+'" data-action="sum-cal-day" data-dk="'+dk2+'">'+
               '<span class="cal-n">'+d+'</span>'+
               (mood&&mood.emoji?'<span class="cal-e">'+mood.emoji+'</span>':'')+
             '</button>';
      }
      h += '</div>';
    }else{
      h += '<div class="hint" style="font-size:11.5px;color:var(--text-2)">日历已收起 · 点上方月份可展开</div>';
    }
    h += '</div>';
    h += '</section>';
    /* ──── 干了什么 ──── */
    h += '<section class="sec"><h2 class="sec-title">干了什么</h2>';
    /* 24小时递归圆圈：整圈=一天，扇形色块=一段可能性递归（替代原来的横向时间带） */
    const hasRec = S.sessions.some(s=>s.day===dk && s.end!=null) ||
                   (isTodayView && Rhythm.activeSlices().some(s=>s.day===dk));
    h += '<div class="sec-sub">'+(isTodayView?'今日':'当日')+'递归圆圈</div>'+
         '<div class="card pad">'+ dayRingHtml(dk, isTodayView, now) +
         '<div class="hint" style="font-size:11px;color:var(--text-2);margin-top:10px;text-align:center">'+
           (hasRec ? '整圈 = 一天24小时 · 扇形色块 = 一段递归（颜色 = 空间，悬停看细节）' : '这一天还没有递归记录')+
         '</div></div>';
    /* 节律递归时间进度卡（排在圆圈下面） */
    h += '<div class="card card--mark pad" style="margin-top:14px"'+(isTodayView?' data-bind="quota"':'')+'>'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">'+
        '<div style="font-weight:700;font-size:14.5px">节律递归时间</div>'+
        '<div class="num" style="font-size:12.5px;color:var(--text-2)">'+(isTodayView?'今日':'当日')+'额度 '+fmtMin(Q)+'</div>'+
      '</div>'+
      '<div class="prog" style="height:8px"><div class="prog-bar" data-q-bar style="width:'+Math.min(100, consumed/Q*100).toFixed(1)+'%"></div></div>'+
      '<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px">'+
        '<span style="color:var(--text-2)">已消耗 <b class="num" data-q-used>'+fmtMin(consumed)+'</b></span>'+
        '<span>剩余 <b class="num" data-q-remain style="color:var(--accent)">'+fmtMin(remain)+'</b></span>'+
      '</div></div>';
    /* 自流转课程表状态 */
    h += '<div class="sec-sub" style="margin-top:4px">自流转日程</div>';
    h += slotListHtml(dk, false);
    /* 当日待办 */
    const dayTodos = S.todos.filter(x=>!x.archived && isTodayTodo(x, vNow));
    const doneCnt = dayTodos.filter(x=>todoStatus(x, vNow)==='done').length;
    h += '<div class="sec-sub" style="margin-top:14px">当日待办完成情况'+
         '<span class="cnt">'+dayTodos.length+'</span><span class="cnt" style="color:var(--green)">✓ '+doneCnt+'</span></div>';
    if(dayTodos.length===0){
      h += '<div class="hint" style="font-size:12px;color:var(--text-2)">这一天没有待办</div>';
    }else{
      /* 排序：未办的排前面（其中剩余时间最少的在最上面，无期限备忘垫底），
         已办好的排在后面（其中最后办好的在最上面） */
      const sorted = [...dayTodos].sort((a,b)=>{
        const da = todoStatus(a, vNow)==='done' ? 1 : 0;
        const db = todoStatus(b, vNow)==='done' ? 1 : 0;
        if(da !== db) return da - db;
        if(da === 1) return (b.completedAt||0) - (a.completedAt||0);   // 已办好：最后办好的最上面
        const ua = TodoLogic.dueAt(a, vNow), ub = TodoLogic.dueAt(b, vNow);
        if(ua==null && ub==null) return 0;                              // 都无期限：保持原顺序
        if(ua==null) return 1;                                          // 无期限的排在有期限的后面
        if(ub==null) return -1;
        return ua - ub;                                                 // 剩余越少越靠前（超时的最靠前）
      });
      for(const t of sorted) h += todoCardHtml(t, isTodayView ? now : vNow, isTodayView);
    }
    /* 时间轴日记（v1.1 起归属「我们的共识」：任意一天都能补记/编辑/删除） */
    const entries = [...(doc.rhythmEntries||[])].sort((a,b)=>a.at<b.at?-1:1);
    h += '<div class="sec-sub" style="margin-top:14px">时间轴日记'+
         (entries.length?'<span class="cnt">'+entries.length+'</span>':'')+'</div>';
    h += '<button class="btn btn--primary btn--block" data-action="sum-entry" style="margin-bottom:12px">＋ 记录想法'+(isTodayView?'（此刻）':'')+'</button>';
    if(entries.length===0){
      h += '<div class="empty"><span class="empty-ico">📔</span>以时间为标签的日记<br>记录一天24小时的想法与活动</div>';
    }else{
      for(const en of entries){
        h += '<div class="card pad rh-entry" style="margin-bottom:8px">'+
               '<div style="display:flex;justify-content:space-between;align-items:center">'+
                 '<span class="rh-time num">'+esc(en.at)+'</span>'+
                 '<span style="display:flex">'+
                   '<button class="icon-btn" data-action="sum-entry" data-id="'+en.id+'" style="width:26px;height:26px" aria-label="编辑">✎</button>'+
                   '<button class="icon-btn" data-action="sum-entry-del" data-id="'+en.id+'" style="width:26px;height:26px" aria-label="删除">🗑</button>'+
                 '</span>'+
               '</div>'+
               (en.text?'<div style="font-size:13px;white-space:pre-wrap;margin-top:4px">'+esc(en.text)+'</div>':'')+
               imgsHtml(en.images)+
             '</div>';
      }
    }
    h += '</section>';
    /* ──── 积累了什么 ──── */
    h += '<section class="sec"><h2 class="sec-title">积累了什么</h2>';
    const rows = S.spaces.map(sp=>{
      const recs = spaceRecordsOf(dk, sp.id);
      return {sp, min:Rhythm.daySpaceMinutes(dk, sp.id), recs:recs.length,
              adds:S.catnotes.filter(n=>!n.archived && n.spaceId===sp.id && D.dateKey(n.createdAt)===dk).length};
    }).filter(x=>x.min>0 || x.recs>0 || x.adds>0).sort((a,b)=>b.min-a.min);
    if(rows.length===0){
      h += '<div class="empty"><span class="empty-ico">✦</span>这一天还没有积累'+(isTodayView?'<br>去「空间」页做几条可能性确定，或开始一次递归吧':'')+'</div>';
    }else{
      for(const x of rows){
        const m = (doc.spaceMood||{})[x.sp.id];
        h += '<div class="card pad" style="margin-bottom:8px;display:flex;align-items:center;gap:10px">'+
               '<div class="sp-ico" style="background:'+x.sp.color+'1A;flex:none">'+esc(x.sp.icon||'✦')+'</div>'+
               '<div style="flex:1;min-width:0">'+
                 '<div style="font-weight:700;font-size:14px">'+esc(x.sp.name)+
                   (m&&m.emoji?' <span style="font-size:15px">'+m.emoji+'</span>':'')+'</div>'+
                 '<div style="font-size:12px;color:var(--text-2)">'+
                   '<span class="num">递归 '+fmtMin(x.min)+'</span> · '+
                   '<span class="num">可能性确定 '+x.recs+' 条</span>'+
                   (x.adds?' · 迭代笔记 +'+x.adds:'')+
                 '</div>'+
               '</div>'+
               '<button class="btn btn--small" data-action="go-space" data-id="'+x.sp.id+'">查看</button>'+
             '</div>';
      }
    }
    if(!isTodayView) h += '<button class="btn btn--primary btn--block" data-action="sum-day-today" style="margin-top:6px">回到今天</button>';
    h += '</section>';
    return h;
  },
  /* —— 事务待办 —— */
  todos(){
    const now = Date.now();
    const list = S.todos.filter(x=>!x.archived);
    const pending = [], done = [];
    for(const t of list){ (todoStatus(t, now)==='done' ? done : pending).push(t); }
    pending.sort((a,b)=>{
      const da = TodoLogic.dueAt(a, now), db = TodoLogic.dueAt(b, now);
      if(da==null) return 1; if(db==null) return -1; return da-db;
    });
    done.sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));
    let h = '<section class="sec"><h2 class="sec-title">事务待办</h2>';
    h += '<button class="btn btn--primary btn--block" data-action="todo-form" style="margin-bottom:6px">＋ 新建待办</button>';
    h += '<div class="sec-sub">进行中<span class="cnt">'+pending.length+'</span></div>';
    if(pending.length===0){
      h += '<div class="empty"><span class="empty-ico">☀</span>没有进行中的待办<br><span style="font-size:12px">点上方「新建待办」开始记录</span></div>';
    }else{
      for(const t of pending) h += todoCardHtml(t, now);
    }
    if(done.length>0){
      h += '<div class="sec-sub">已完成<span class="cnt">'+done.length+'</span><span style="font-weight:400;letter-spacing:0">点击灰色卡片可恢复为未完成</span></div>';
      for(const t of done) h += todoCardHtml(t, now);
    }
    h += '</section>';
    return h;
  },
  /* —— 可能性空间列表 —— */
  spaces(){
    const active = S.spaces.filter(x=>!x.archived);
    let h = '<section class="sec"><h2 class="sec-title">可能性空间<span class="sec-extra">每个兴趣，像一本书</span></h2>';
    if(active.length===0){
      h += '<div class="empty"><span class="empty-ico">◇</span>创建你的第一个可能性空间<br>比如：学日语 · 拍视频 · 画画 · cos</div>';
    }else{
      h += '<div class="grid-2">';

               '<div class="space-ico">'+esc(sp.icon||'✦')+'</div>'+
               '<div class="space-name">'+esc(sp.name)+'</div>'+
               '<div class="space-meta">'+(sp.categories||[]).length+' 个确定性迭代</div>'+
             '</div>';

  },
  /* —— 空间详情 —— */
  spaceDetail(){
    const sp = spaceById(S.spaceId);
    if(!sp) return '<div class="empty">该空间不存在或已删除</div>';
    if(!S.spaceTab) S.spaceTab = 'day';
    let h = '<div class="card pad">'+
      '<div style="display:flex;gap:12px;align-items:center">'+
        '<div class="sp-ico" style="background:'+sp.color+'1A">'+esc(sp.icon||'✦')+'</div>'+
        '<div style="flex:1;min-width:0">'+
          '<div style="font-weight:700;font-size:17px">'+esc(sp.name)+'</div>'+
          '<div style="font-size:12px;color:var(--text-2)">'+esc(sp.note||'这个空间正在生长')+'</div>'+
        '</div>'+
        '<button class="icon-btn" data-action="space-form" data-id="'+sp.id+'" style="flex:none" aria-label="编辑空间">✎</button>'+
      '</div>'+
      '<div class="stat-row">'+
        '<div class="stat"><div class="stat-v num">'+fmtMin(Rhythm.todaySpaceMinutes(sp.id))+'</div><div class="stat-k">今日递归</div></div>'+
        '<div class="stat"><div class="stat-v num">'+fmtMin(Rhythm.totalSpaceMinutes(sp.id))+'</div><div class="stat-k">累计递归</div></div>'+
        '<div class="stat"><div class="stat-v num">'+iterDays(sp.id)+'</div><div class="stat-k">记录天数</div></div>'+
      '</div>'+
    '</div>';
    const tabs = {day:'可能性确定', cal:'日历', cat:'确定性迭代', todos:'待办'};
    h += '<div class="chip-row" style="margin:14px 0 16px">'+Object.keys(tabs).map(k=>

  },
  /* —— 节律表（支持浏览任意一天） —— */
  rhythm(){
    const now = Date.now();
    const dk = D.dateKey(now);
    const rd = S.rhythmDay || dk;                       // 正在查看的日期
    const isTodayView = rd === dk;
    const doc = dayDoc(rd);
    const spaces = S.spaces.filter(x=>!x.archived);
    const Q = Rhythm.quotaFor(rd);
    const consumed = Rhythm.consumedMinutes(rd, now);
    const remain = Math.max(0, Q - consumed);
    let h = '<section class="sec"><h2 class="sec-title">节律表</h2>';
    /* 历史浏览条（含日历选择与全局情绪） */
    h += dayNavHtml('rhythm');
    /* 统计卡 */
    h += '<div class="card card--mark pad"'+(isTodayView?' data-bind="quota"':'')+' style="margin-bottom:16px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px">'+
        '<div style="font-weight:700;font-size:15px">节律递归时间</div>'+
        '<button class="btn btn--small num" data-action="quota-edit" style="flex:none">'+(isTodayView?'今日额度':'当日额度')+' '+fmtMin(Q)+' ✎</button>'+
      '</div>'+
      '<div class="prog" style="height:10px"><div class="prog-bar" data-q-bar style="width:'+Math.min(100, consumed/Q*100).toFixed(1)+'%"></div></div>'+
      '<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px">'+
        '<span style="color:var(--text-2)">已消耗 <b class="num" data-q-used>'+fmtMin(consumed)+'</b></span>'+
        '<span>剩余 <b class="num" data-q-remain style="color:var(--accent)">'+fmtMin(remain)+'</b></span>'+
      '</div>';
    const bySpace = spaces.map(sp=>({sp, min:Rhythm.daySpaceMinutes(rd, sp.id)})).filter(x=>x.min>0);
    if(bySpace.length){
      h += '<div class="sec-sub" style="margin:12px 0 4px">可能性递归时间 · 当日转化</div>';
      for(const x of bySpace){
        h += '<div class="kv"><span class="k"><span class="dot" style="background:'+x.sp.color+'"></span>'+esc(x.sp.name)+'</span><span class="v num">'+fmtMin(x.min)+'</span></div>';
      }
    }else{
      h += '<div class="hint" style="font-size:12px;color:var(--text-2);margin-top:10px">'+
        (isTodayView ? '今日还没有可能性递归消耗 — 在下方空间卡片点击「可能性递归」开始' : '这一天没有可能性递归消耗记录')+'</div>';
    }
    h += '</div>';
    /* 24h 时间带 */
    const slices = S.sessions.filter(s=>s.day===rd && s.end!=null).sort((a,b)=>a.start-b.start);
    const activeSlices = isTodayView ? Rhythm.activeSlices().filter(s=>s.day===rd) : [];
    h += '<div class="sec-sub">'+(isTodayView?'今日':'当日')+'递归时间带</div>';
    h += '<div class="rh-track">'+
           slices.map(s=>bandHtml(s, false)).join('')+
           activeSlices.map(s=>bandHtml(s, true)).join('')+
           (isTodayView ? '<div class="rh-now" style="left:'+((now - D.dkToTs(rd)) / 86400000 * 100).toFixed(3)+'%"></div>' : '')+
         '</div>';
    if(slices.length===0 && activeSlices.length===0){
      h += '<div class="hint" style="font-size:12px;color:var(--text-2);margin-top:8px">这一天还没有递归记录</div>';
    }
    /* 自流转日程 */
    h += '<div class="sec-sub" style="margin-top:18px">自流转 · '+(isTodayView?'今日':'当日')+'日程</div>';
    h += slotListHtml(rd, isTodayView);
    /* 手动递归（仅今天可用） */
    if(isTodayView){
      h += '<div class="sec-sub" style="margin-top:18px">可能性递归 · 手动</div>';
      if(spaces.length===0){
        h += '<div class="empty"><span class="empty-ico">◇</span>还没有可能性空间<br>创建空间后，即可用空间消耗节律递归时间</div>';
      }else{
        h += '<div class="grid-2">';
        for(const sp of spaces){
          const acts = Rhythm.activeForSpace(sp.id);
          const isAct = acts.length>0;
          h += '<div class="space-card rh-space'+(isAct?' on':'')+'" data-bind="rec" data-space="'+sp.id+'" style="--sc:'+sp.color+'">'+
                 '<div class="space-ico">'+esc(sp.icon||'✦')+'</div>'+
                 '<div class="space-name">'+esc(sp.name)+'</div>'+
                 '<div class="space-meta">今日 '+fmtMin(Rhythm.todaySpaceMinutes(sp.id))+'</div>'+
                 (isAct?'<div class="rec-live num" data-rec-t>'+fmtDur(now - acts[0].start)+'</div>':'')+
                 '<div style="display:flex;gap:8px;margin-top:4px">'+
                   '<button class="btn btn--small" style="flex:1" data-action="rhythm-iter" data-id="'+sp.id+'">可能性确定</button>'+
                   '<button class="btn btn--small '+(isAct?'btn--danger':'btn--primary')+'" style="flex:1" data-action="rhythm-rec" data-id="'+sp.id+'">'+(isAct?'停止':'可能性递归')+'</button>'+
                 '</div>'+
               '</div>';
        }
        h += '</div>';
      }
    }
    /* 时间轴日记已迁至「我们的共识」页 */
    h += '<div class="hint" style="font-size:12px;color:var(--text-2);margin-top:18px">📔 时间轴日记已搬到「我们的共识」页（长按右滑，或纯净页点顶部日期）</div>';
    h += '</section>';
    return h;
  },

    h += '<section class="sec"><h2 class="sec-title">数据与备份</h2><div class="card pad">'+

        '<button class="btn" data-action="seed">生成示例数据（先体验界面）</button>'+

    h += '<section class="sec"><h2 class="sec-title">关于</h2><div class="card pad">'+

/* ══════════════════════════════════════════════════════════════
   9.5 自定义背景 / 覆盖模式
   ══════════════════════════════════════════════════════════════ */
function bgSrc(){
  const id = S.settings.bgImageId;
  return id ? (Store.getImage(id) || null) : null;
}
/* 把背景图/透明度/模糊度应用到背景层 */
function applyBg(){
  const el = document.getElementById('bg-layer');
  if(!el) return;
  const src = bgSrc();
  if(src){
    el.style.backgroundImage = 'url("'+src+'")';
    el.style.opacity = String((S.settings.bgOpacity ?? 45) / 100);
    el.style.filter = 'blur('+(S.settings.bgBlur ?? 0)+'px)';
    el.classList.remove('hidden');
  }else{
    el.classList.add('hidden');
  }
}
/* 看板娘立绘上传回调：不压缩，原图保存（透明背景 PNG 无损保留） */
/* ══════════════════════════════════════════════════════════════
   9.57 她的衣柜 Outfit（v1.3）：多套立绘自由切换 / 上传 / 长按删除
   数据：settings.outfits = ['img_xxx', …]（只存上传的服装 id，图片本体照旧在 img:xxx）
   ⚠️ gcImages 必须把 outfits 里每个 id 都登记为引用，否则下次启动图片全被回收
   ══════════════════════════════════════════════════════════════ */
const Outfit = {
  /* 读衣柜；老用户第一次进来时，把旧的单一「上传立绘」（固定 id 'mascot'）补进衣柜，零丢失 */
  list(){
    let ids = S.settings.outfits;
    if(!Array.isArray(ids)){
      ids = [];
      if(S.settings.mascotId === 'mascot' || Store.getImage('mascot')) ids.push('mascot');
      S.settings.outfits = ids;
      saveSettings();
    }
    return ids;
  },
  name(id){ const i = this.list().indexOf(id); return i < 0 ? '自定义立绘' : ('第 ' + (i + 1) + ' 套'); },
  src(id){ return id ? (Store.getImage(id) || '') : ''; },
  wear(id){
    S.settings.mascotId = id || null;
    saveSettings();
    scheduleRender();
    UI.toast(id ? ('已换上' + this.name(id)) : '已换回系统默认的她（mimi/ 文件夹）');
  },
  upload(){
    const fi = document.getElementById('file-input');
    if(!fi) return;
    fi.accept = 'image/*';
    fi.multiple = true;               // 相册里可一次多选（v1.4.1）
    S.pendingFileCb = handleOutfitFile;
    fi.value = ''; fi.click();
  },
  /* 存一套新衣服并直接换上（原图不压缩：透明背景 PNG 完整保留）
     quiet=true 时不弹提示——批量上传由调用方统一报一句 */
  add(dataURL, quiet){
    const id = uid('img_');
    if(!Store.saveImage(id, dataURL)){ UI.toast('存储空间不足，这套没能存下', 'err'); return null; }
    const ids = this.list();
    ids.push(id);
    S.settings.outfits = ids;
    S.settings.mascotId = id;
    saveSettings();
    scheduleRender();
    if(!quiet) UI.toast('新服装已收进衣柜并换上');
    return id;
  },
  /* 删除：从衣柜摘掉 + 立刻回收图片；正穿着就先回退，别指向已删的图 */
  del(id){
    const ids = this.list();
    const i = ids.indexOf(id);
    if(i < 0) return;
    ids.splice(i, 1);
    S.settings.outfits = ids;
    if(S.settings.mascotId === id) S.settings.mascotId = null;
    saveSettings();
    Store.del('img:' + id);
    scheduleRender();
    UI.toast('这套服装已删除');
  },
  askDel(id){
    if(!this.list().some(x=>x===id)) return;
    UI.confirmDialog('删除这套服装', '「' + this.name(id) + '」会从衣柜里移除，图片也一起删掉（无法恢复）。', true, ()=>this.del(id));
  }
};
/* 服装上传（v1.4.1：相册可一次多选）：逐张读原图（不压缩）存进衣柜，最后一张就是换上的那套 */
function handleOutfitFile(files){
  const picked = (files||[]).filter(f=>f && f.type && f.type.startsWith('image/'));
  if(!picked.length){ UI.toast('请选择图片文件', 'err'); return; }
  const batch = picked.length > 1;
  if(batch) UI.toast('正在读取 '+picked.length+' 张…');
  let i = 0, ok = 0, full = false;
  const step = ()=>{
    if(full || i >= picked.length){
      if(ok > 1) UI.toast('已收进衣柜 '+ok+' 套，'+Outfit.name(S.settings.mascotId)+' 已换上');
      return;                                   // 只传一张时 Outfit.add 自己会提示
    }
    const rd = new FileReader();
    rd.onload = ()=>{ if(Outfit.add(rd.result, batch)) ok++; else full = true; step(); };
    rd.onerror = ()=>{ UI.toast('图片读取失败', 'err'); step(); };
    rd.readAsDataURL(picked[i++]);
  };
  step();
}

function applyAnimLevel(){

/* ══════════════════════════════════════════════════════════════
   9.6 看板娘气泡提醒 Bubbles（纯屏顶部，点击跳转对应页面）
   ══════════════════════════════════════════════════════════════ */
const Bubbles = {
  queue:[],            // 待显示：{text, sub, go}  go=回调（点击时执行）
  seen:{},             // 去重：key → true（同一天只提醒一次）
  shownUntil:0,        // 当前气泡的自动消失时刻
  active:null,
  push(text, opt){
    opt = opt || {};
    const key = opt.key || text;
    if(this.seen[key]) return;
    this.seen[key] = true;
    this.queue.push({text, sub:opt.sub||'', go:opt.go||null});
    if(this.queue.length>4) this.queue.shift();
    this.render();
  },
  /* 把当前待显示的一条画到纯净页（非纯净页时挂起，回纯净页由 renderView 补画） */
  render(){
    const root = document.getElementById('view-root');
    const br = root ? root.querySelector('#bubble-root') : null;
    if(!br){ return; }                       // 不在纯净页，暂不显示
    if(!this.active){
      if(this.queue.length) this.active = this.queue.shift();
      else { br.classList.add('hidden'); br.innerHTML=''; return; }
    }
    const b = this.active;
    /* 每次都重画：view-root 整体重渲染会抹掉气泡标记，必须随渲染重建 */
    br.innerHTML = '<div class="mascot-bubble" role="button" aria-label="提醒">'+
      (b.sub ? '<div style="font-size:10.5px;color:var(--accent);font-weight:700;letter-spacing:1px;margin-bottom:2px">'+esc(b.sub)+'</div>' : '')+
      '<div>'+esc(b.text)+'</div>'+
      (b.go ? '<div style="font-size:10.5px;color:var(--text-2);margin-top:3px">点我看详情 →</div>' : '')+
    '</div>';
    br.classList.remove('hidden');
    br.onclick = ()=>{ this.dismiss(); if(b.go) b.go(); };
    clearTimeout(this._t);
    this._t = setTimeout(()=>{ this.dismiss(); }, 9000);
  },
  dismiss(){
    this.active = null;
    const root = document.getElementById('view-root');
    const br = root ? root.querySelector('#bubble-root') : null;
    if(br){ br.innerHTML=''; br.classList.add('hidden'); }
    if(this.queue.length) this.render();     // 排队的下一条顶上
  }
};
/* 场景提醒的触发点集合（在 Rhythm / Alarms / tick 中调用） */
function bubbleScene(key, text, go, sub){
  if(typeof Bubbles!=='undefined') Bubbles.push(text, {key, go, sub});
}

/* ══════════════════════════════════════════════════════════════
   9.65 她活过来了 Her（v1.4）：她主动找你说话
   ★ 所有主动台词的唯一出口是 Her.voice()——将来想接真 AI，只改那一个函数；
     台词池与全部数值在 CONFIG.HER。她只在你自己的两个空间里说话（气泡通道）。
   ★ 零迁移：只新增 settings.herVoice / herSpoke / herLastOpen / herAsked / herNight
   ══════════════════════════════════════════════════════════════ */
const Her = {
  aiHook:null,          // ★ 预留接口：挂 (kind, ctx)=>string|null，返回非空就用它，否则回落话术池
  _lastAt:0,            // 上一条主动气泡的时刻（冷却用）
  _lastScan:0,          // 上一次检查的时刻
  _lastIdle:0,          // 上一次「日常念叨」的时刻
  _nightDone:null,      // 本次会话已经说过睡前总结的日子

  /* ── 唯一出口：她说的话都从这儿出 ── */
  voice(kind, ctx){
    ctx = ctx || {};
    /* 指定台词（有些场合她已经想好要怎么回了，比如听你答完某个问题）——照旧走这个出口 */
    if(ctx.override) return this.fill(String(ctx.override), ctx);
    /* ★ AI 接口（预留）：挂上之后由它接管台词；抛错或返回空再回落话术池。
       吐出来的文本同样要过称呼替换（AI 也可以直接写 {yt}） */
    try{ if(this.aiHook){ const a = this.aiHook(kind, ctx); if(a) return this.fill(String(a), ctx); } }catch(e){}
    const pool = (CONFIG.HER.LINES || {})[kind] || [];
    /* 条件是「或」的关系，命中多条就随机挑；一条都没命中（数据在设想的边界外）
       就退回整池——宁可说得不贴切，也不能让她哑掉 */
    const fits = pool.filter(p => !p.when || p.when(ctx));
    const arr = fits.length ? fits : pool;
    if(!arr.length) return '';
    /* 随机挑一句来说。函数式台词（要念出你的数据）偶尔会碰到上下文没带全的场合——
       挑不动就换下一句，绝不能因为一句台词把界面弄崩（全挑不动就这次先不说话） */
    const order = arr.slice();
    while(order.length){
      const p = order.splice(Math.floor(Math.random()*order.length), 1)[0];
      let s = '';
      try{ const t = (typeof p === 'string') ? p : p.t; s = (typeof t === 'function') ? t(ctx) : t; }
      catch(e){ continue; }
      if(s) return this.fill(String(s), ctx);
    }
    return '';
  },
  /* 称呼令牌：她说的每句话都可以用 {yt} / {you} / {name}，
     实际值随关系阶段自动变 —— 称呼要在所有界面生效，靠的就是这一层 */
  fill(text, ctx){
    const you = (ctx && ctx.you) || (typeof Love !== 'undefined' ? Love.you() : (CONFIG.LOVE.YOU || '你'));
    const nm  = CONFIG.LOVE.NAME;
    return String(text)
      .split('{you}').join(you)
      .split('{yt}').join(you && you !== (CONFIG.LOVE.YOU || '你') ? ('，' + you) : '')
      .split('{name}').join(nm);
  },

  /* ── 频率门：档位（每天上限）+ 冷却。跨刷新有效（落库在 settings.herSpoke）── */
  budget(dk){
    const lv = S.settings.herVoice || 'normal';
    const cap = (CONFIG.HER.VOICE_LEVELS[lv] != null) ? CONFIG.HER.VOICE_LEVELS[lv] : CONFIG.HER.VOICE_LEVELS.normal;
    let s = S.settings.herSpoke;
    if(!s || s.dk !== dk){ s = {dk, n:0}; S.settings.herSpoke = s; }
    return {cap, used:s.n, left:Math.max(0, cap - s.n)};
  },
  canSpeak(now){
    now = now || Date.now();
    if(this.budget(D.dateKey(now)).left <= 0) return false;
    return (now - this._lastAt) >= CONFIG.HER.COOLDOWN_MS;
  },
  /* ── 说一句：所有主动台词的统一入口 ── */
  say(kind, ctx, opt){
    opt = opt || {};
    const now = (ctx && ctx.now) || Date.now();
    const text = this.voice(kind, ctx);
    if(!text) return false;
    const key = opt.key || ('her-' + kind + '-' + D.dateKey(now));
    if(Bubbles.seen[key]) return false;          // 这一条今天已经说过了
    if(!this.canSpeak(now)) return false;        // 今天说够了 / 刚说完没多久
    Bubbles.push(text, {key, sub: opt.sub || '她', go: opt.go || null});
    /* 你把软件切到后台了 → 这句话也走系统通知送出去（她走出软件，v1.5） */
    if(opt.notify !== false && typeof Notify !== 'undefined') Notify.her(text, opt.sub || '她');
    const dk = D.dateKey(now), rec = S.settings.herSpoke;
    if(rec && rec.dk === dk) rec.n = this.budget(dk).used + 1;
    this._lastAt = now;
    saveSettings();
    return true;
  },
  /* ── 直接回应（你回答了她的问题 / 你跟她说话）：不算「主动搭话」，
        所以不受每日频率门限制——她答你的话，随时都该答得上 ── */
  reply(text, opt){
    opt = opt || {};
    if(!text) return false;
    Bubbles.push(text, {key: opt.key || ('her-reply-' + text), sub: opt.sub || '她', go: opt.go || null});
    if(opt.notify !== false && typeof Notify !== 'undefined') Notify.her(text, opt.sub || '她');
    return true;
  },
  /* 「她督促过的事」记一笔：等你真的做完它，好感会涨（好感来源表里的 todo） */
  _markUrged(id, dk){
    if(!id) return;
    if(!S.settings.herUrged) S.settings.herUrged = {};
    S.settings.herUrged[id] = dk || D.dateKey(Date.now());
    saveSettings();
  },

  /* ── 当天实况（台词池只管挑词，数字都在这儿备好）── */
  _urgent(now){
    let best = null, bd = 0;
    for(const t of S.todos){
      if(t.archived || TodoLogic.effStatus(t, now)==='done') continue;
      const due = TodoLogic.dueAt(t, now);
      if(due == null || due <= now) continue;
      if(!best || due < bd){ best = t; bd = due; }
    }
    return best;
  },
  ctx(now){
    now = now || Date.now();
    const dk = D.dateKey(now);
    const day = Grow.dayXpDetail(dk);        // 今天：专注/完成/记录（走缓存，便宜）
    const st  = Grow.stats(now);             // 累计（她眼中的我那份）
    const aff = (typeof Love !== 'undefined') ? Love.state() : {total:0};
    const c = {
      now, dk, hour:new Date(now).getHours(), day, st, lv:st.lv,
      minText: fmtMin(Math.floor(day.min)),
      urg: this._urgent(now),
      /* v1.5 感情线：她怎么称呼你（{yt} 的实际值）、你们认识多久了、好感多少 */
      you: (typeof Love !== 'undefined') ? Love.you() : CONFIG.LOVE.YOU,
      stage: (typeof Love !== 'undefined') ? Love.stage().k : 'new',
      days: (typeof Love !== 'undefined') ? Love.daysTogether(now) : 1,
      love: aff.total || 0,
      /* v1.6a：她现在的心情（台词池可以按 c.emo 分支——同一个场合，心情不同说法不同） */
      emo: (typeof Emo !== 'undefined') ? Emo.get(now) : 'neutral'
    };
    c.plan = c.urg
      ? '今天最急的是 ' + D.tsToHHMM(TodoLogic.dueAt(c.urg, now)) + ' 的「' + c.urg.title + '」' +
        (day.min >= 1 ? '，你已经专注 ' + c.minText + ' 了。' : '。')
      : (st.dayCount === 0 ? '我们从今天开始吧，先做一件小事。'
                           : '今天还没有安排，要不要挑一个空间？');
    return c;
  },

  /* ── 打开页面时：好久不见 / 昨天没打卡 / 问候（bootMain 调一次）── */
  onBoot(now){
    now = now || Date.now();
    const dk = D.dateKey(now);
    const last = S.settings.herLastOpen;
    S.settings.herLastOpen = {dk, at:now};   // 先记账再说话：今天说不上话也算得准
    saveSettings();
    const c = this.ctx(now);
    /* ① 好久不见 */
    let gap = 0;
    if(last && last.dk) gap = Math.round((D.dkToTs(dk) - D.dkToTs(last.dk)) / 86400000);
    if(gap >= CONFIG.HER.MISS_DAYS){
      c.gap = gap;
      return this.say('missAway', c, {key:'her-away-'+dk, sub:'好久不见', go:()=>goView('mcons')});
    }
    /* ② 昨天没打卡（前天还在）——断掉的线她最在意 */
    const yest = D.dateKey(D.addDaysTs(now,-1)), before = D.dateKey(D.addDaysTs(now,-2));
    if(!Grow.checkedIn(yest) && Grow.checkedIn(before)){
      c.was = Grow.streakDaysUpTo(before);
      return this.say('missStreak', c, {key:'her-streakbrk-'+dk, sub:'她惦记着', go:()=>goView('mcons')});
    }
    /* ③ 问候 */
    return this.say('greet', c, {key:'her-greet-'+dk, sub:'她'});
  },

  /* ── 过了晚上 N 点，她汇报今天（每天一次）── */
  nightCheck(now){
    const h = new Date(now).getHours();
    if(h < CONFIG.HER.NIGHT_FROM && h >= CONFIG.HER.NIGHT_TO) return false;
    const dk = D.dateKey(now);
    if(this._nightDone === dk || S.settings.herNight === dk) return false;
    this._nightDone = dk;
    S.settings.herNight = dk; saveSettings();
    return this.say('night', this.ctx(now), {key:'her-night-'+dk, sub:'晚安', go:()=>goView('mdairy')});
  },

  /* ── 待办过点多久了（超过宽限才催，别刚到点就烦人）── */
  _late(now){
    const grace = (CONFIG.HER.OVERDUE_MIN || 10) * 60000;
    let best = null, bd = 0;
    for(const t of S.todos){
      if(t.archived || TodoLogic.effStatus(t, now)==='done') continue;
      const due = TodoLogic.dueAt(t, now);
      if(due == null || due > now - grace) continue;   // 还没到点 / 刚过点还在宽限里 —— 都不催
      if(!best || due > bd){ best = t; bd = due; }     // 最接近现在的那件（刚过点的先催）
    }
    return best;
  },

  /* ── 每分钟扫一次：过点督促 / 她惦记的事 / 日常念叨 ── */
  tick(now){
    if(typeof Bubbles==='undefined') return;
    if(S.view!=='home' && S.view!=='mspace') return;   // 她只在你和她的空间里开口
    this.nightCheck(now);
    if(now - this._lastScan < 60000) return;
    this._lastScan = now;
    if(!this.canSpeak(now)) return;                    // 说不了话就什么都不用算
    const c = this.ctx(now);
    /* ① 待办过点还没做 */
    const late = this._late(now);
    if(late){
      c.title = late.title;
      if(this.say('urgeOver', c, {key:'her-late-'+late.id+'-'+c.dk, sub:'她提醒你', go:()=>goView('todos')})){
        this._markUrged(late.id, c.dk);
        return;
      }
    }
    /* ② 她惦记着的事（每天最多问一件） */
    const ask = HerDiary.nextAsk(now);
    if(ask){
      const kind = ask.kind === 'space' ? 'recallSpace' : 'recallTodo';
      if(this.say(kind, Object.assign(c, {ask}), {key:'her-ask-'+ask.id+'-'+c.dk, sub:'她记得', go:()=>goView('mdairy')})){
        HerDiary.markAsked(ask.id, now);
        return;
      }
    }
    /* ③ 日常念叨（低频） */
    if(now - this._lastIdle < CONFIG.HER.IDLE_COOLDOWN_MS){
      if(this.say('idle', c, {key:'her-idle-'+c.dk+'-'+Math.floor(now/600000), sub:'她'})) this._lastIdle = now;
    }
  }
};

/* ══════════════════════════════════════════════════════════════
   9.66 她的日记 HerDiary（v1.4）
   ★ 今天的日记 = 实时生成（永远是最新的）；过去的日子 = 定稿一次后冻结
     （定稿写在 dayDoc(dk).herDiary 里 → 随 days 打包导出，零导出改动）
   ★ 她「惦记着的事」= 从待办与空间实时推导（不落库），问过之后记在
     settings.herAsked 里，同一件事不追问第二遍
   ══════════════════════════════════════════════════════════════ */
const HerDiary = {
  /* 只读已存在的天文档：不存在就返回 null（不创建空文档污染 days） */
  _docIfExists(dk){
    if(S.days.has(dk)) return S.days.get(dk);
    const raw = Store.get('day:'+dk, null);
    if(!raw) return null;
    S.days.set(dk, raw);
    return raw;
  },
  today(){ return D.dateKey(Date.now()); },
  /* 已定稿的日记（过去的日子）；今天的返回 null */
  get(dk){
    if(!dk || dk >= this.today()) return null;
    const doc = this._docIfExists(dk);
    return (doc && doc.herDiary) || null;
  },
  /* 由当天数据写一篇（纯函数式推导，不改任何数据） */
  build(dk, now){
    now = now || Date.now();
    const today = this.today();
    const e = Grow.dayXpDetail(dk);
    const d0 = D.dkToTs(dk), d1 = d0 + 86400000;
    /* 这一天里最专注的空间 */
    const per = {};
    for(const s of S.sessions){
      if(!s.spaceId || !s.start) continue;
      const a = Math.max(s.start, d0), b = Math.min(s.end != null ? s.end : now, d1);
      if(b > a) per[s.spaceId] = (per[s.spaceId] || 0) + (b - a) / 60000;
    }
    let topId = null, topMin = 0;
    for(const id in per){ if(per[id] > topMin){ topMin = per[id]; topId = id; } }
    const doc = this._docIfExists(dk);
    const mood = (doc && doc.dayMood) || null;
    const min = Math.floor(e.min);
    /* 明天最早的一件待办（她替你记着） */
    const refNow = (dk === today) ? now : (d0 + 23*3600000);
    let nextT = null, nextAt = 0;
    for(const t of S.todos){
      if(t.archived || TodoLogic.effStatus(t, refNow) === 'done') continue;
      const due = TodoLogic.nextDueAt(t, refNow);
      if(due == null || due <= refNow) continue;
      if(!nextT || due < nextAt){ nextT = t; nextAt = due; }
    }
    const lines = [];
    if(min > 0 || e.done > 0 || e.rec > 0){
      let s1 = '';
      if(min > 0) s1 += '专注了 ' + fmtMin(min);
      if(e.done > 0) s1 += (s1 ? '、' : '') + '完成了 ' + e.done + ' 件事';
      if(e.rec > 0) s1 += (s1 ? '、' : '') + '写下 ' + e.rec + ' 条记录';
      lines.push('今天你' + s1 + '。');
      if(e.streak >= 2) lines.push('这是连续的第 ' + e.streak + ' 天，我都数着的。');
    }else{
      lines.push('今天你休息了。什么都没做也没关系，休息也是正经事。');
    }
    if(topId){
      const sp = spaceById(topId);
      if(sp) lines.push('最认真的时候是在「' + sp.name + '」——' + fmtMin(Math.floor(topMin)) + '，我在旁边看着呢。');
    }
    if(mood && mood.emoji) lines.push('你说今天的心情是 ' + mood.emoji + (mood.tags && mood.tags.length ? '（' + mood.tags.join('·') + '）' : '') + '，我记下了。');
    /* v1.5 感情线：那天你们的关系升了一段 / 那天你回答了她的问题（都随 days 打包，零迁移） */
    if(doc && doc.loveUp){
      const st = CONFIG.LOVE.STAGES.filter(x => x.k === doc.loveUp)[0];
      if(st) lines.push('今天我们之间又近了一点——从这天起，我们算「' + st.name + '」了。我偷偷高兴了一整天。');
    }
    const ans = S.settings.herAnswers || {};
    for(const qid in ans){
      if(ans[qid].dk !== dk) continue;
      lines.push('今天你告诉我「' + ans[qid].a + '」——是我问的，我会一直记着。');
    }
    if(nextT) lines.push('明天 ' + D.tsToHHMM(nextAt) + ' 有「' + nextT.title + '」，我替你记着。');
    if(dk === today) lines.push('这一天还没过完呢，我等你。');
    return {
      dk, at:now,
      mood: mood ? {emoji:mood.emoji || '', tags:(mood.tags || [])} : null,
      facts:{min, done:e.done, rec:e.rec, topId, topMin:Math.floor(topMin), streak:e.streak},
      lines, text:lines.join('')
    };
  },
  /* 定稿：把一个已经过去的日子的日记冻结下来（幂等；没有天文档就不落库） */
  finalize(dk, now){
    now = now || Date.now();
    if(!dk || dk >= this.today()) return null;      // 今天/未来的日子不定稿
    const doc = this._docIfExists(dk);
    if(doc && doc.herDiary) return doc.herDiary;    // 写过就不改
    const d = this.build(dk, now);
    if(doc){ doc.herDiary = d; saveDay(dk); }
    return d;
  },
  /* 页面上取某一天的日记：今天实时算，过去的日子定稿后再给 */
  of(dk, now){
    if(dk === this.today()) return this.build(dk, now);
    return this.get(dk) || this.finalize(dk, now) || this.build(dk, now);
  },

  /* ── 她惦记着的事（实时推导，可问 / 已问）── */
  _lastTouch(spId){
    let last = 0;
    for(const s of S.sessions){
      if(s.spaceId !== spId || !s.start) continue;
      const e = (s.end != null) ? s.end : Date.now();
      if(e > last) last = e;
    }
    const sp = spaceById(spId);
    if(sp && sp.updatedAt && sp.updatedAt > last) last = sp.updatedAt;
    if(!last && sp && sp.createdAt) last = sp.createdAt;
    return last || null;
  },
  watch(now){
    now = now || Date.now();
    const H = CONFIG.HER, asked = S.settings.herAsked || {}, out = [];
    const todayTs = D.dkToTs(D.dateKey(now));
    /* ① 早就过点还没做的待办 */
    for(const t of S.todos){
      if(t.archived || TodoLogic.effStatus(t, now) === 'done') continue;
      const due = TodoLogic.dueAt(t, now);
      if(due == null) continue;
      const days = Math.round((todayTs - D.dkToTs(D.dateKey(due))) / 86400000);
      if(days < H.ASK_OVERDUE_DAYS) continue;
      out.push({id:'todo:'+t.id, kind:'todo', text:t.title, days, at:due, askedDk:asked['todo:'+t.id] || null});
    }
    /* ② 好久没碰的空间 */
    for(const sp of S.spaces){
      if(sp.archived) continue;
      const last = this._lastTouch(sp.id);
      if(!last) continue;
      const days = Math.round((todayTs - D.dkToTs(D.dateKey(last))) / 86400000);
      if(days < H.ASK_STALE_SPACE_DAYS) continue;
      out.push({id:'space:'+sp.id, kind:'space', text:sp.name, days, at:last, askedDk:asked['space:'+sp.id] || null});
    }
    out.sort((a, b) => b.days - a.days);      // 拖得最久的排前面
    return out;
  },
  /* 她今天想问的一件事（没问过的，最多 ASK_PER_DAY 件；每天只挑一件） */
  nextAsk(now){
    now = now || Date.now();
    const dk = D.dateKey(now);
    let n = 0;
    for(const id in (S.settings.herAsked || {})){ if(S.settings.herAsked[id] === dk) n++; }
    if(n >= CONFIG.HER.ASK_PER_DAY) return null;
    const list = this.watch(now).filter(a => !a.askedDk);
    return list.length ? list[0] : null;
  },
  markAsked(id, now){
    if(!id) return false;
    if(!S.settings.herAsked) S.settings.herAsked = {};
    S.settings.herAsked[id] = D.dateKey(now || Date.now());
    saveSettings();
    return true;
  }
};

/* ══════════════════════════════════════════════════════════════
   9.67 感情线 Love（v1.5）：好感度 / 关系阶段 / 她的问题 / 对她说
   ★ 好感 ≠ 等级：等级是她跟着你长大的进度（你做了多少事），
     好感是你们的关系（你陪了她多少）——来源全是「你和她相处」，
     跟你专注多久、完成几件事毫无关系，绝不做成绩效。
   ★ 零迁移：新数据全挂 settings（herLove / herAnswers / herChatLog /
     herLangNotes / herAskAt / herRecall / herUrged / herNotify），
     exportJSON / importJSON 一行都不用改。
     唯一落在 dayDoc 上的是 loveUp（那天你们的关系升了一段），随 days 打包。
   ★ 称呼：她对你的称呼由关系阶段决定（Love.you()），台词里写 {yt} 就会自动变。
   ══════════════════════════════════════════════════════════════ */
const Love = {
  _pendingStage:null,   // 升段了但还没演（演出留到 tick——别在渲染/点击过程中弹东西）
  _lastAct:0,           // 你最后一次碰屏幕的时刻（她挑你安静下来的时候才开口）
  _asking:null,         // 正在问她的哪个问题

  /* ── 数据层（全挂 settings，零迁移）── */
  state(){
    let v = S.settings.herLove;
    if(!v || typeof v !== 'object') v = {total:0};
    if(typeof v.total !== 'number' || v.total < 0) v.total = 0;
    if(!v.src || typeof v.src !== 'object') v.src = {};
    S.settings.herLove = v;
    return v;
  },
  total(){ return this.state().total; },
  /* 此刻属于哪一段：门槛从低到高，取最后一个够得着的 */
  stageAt(total){
    const st = CONFIG.LOVE.STAGES;
    let cur = st[0];
    for(const s of st){ if(total >= s.min) cur = s; }
    return cur;
  },
  stage(){ return this.stageAt(this.total()); },
  nextStage(){
    const st = CONFIG.LOVE.STAGES, i = st.indexOf(this.stage());
    return (i >= 0 && i < st.length - 1) ? st[i+1] : null;
  },
  stageIndexOf(k){ const st = CONFIG.LOVE.STAGES; for(let i=0;i<st.length;i++) if(st[i].k===k) return i; return 0; },
  /* 她对你的称呼——台词里的 {you} / {yt} 就是它，随阶段自动升级 */
  you(){ return this.stage().you; },
  /* 你们认识多少天了（从 meta.createdAt 算；认识的那天就是第 1 天） */
  daysTogether(now){
    now = now || Date.now();
    const a = D.dateKey((S.meta && S.meta.createdAt) ? S.meta.createdAt : now);
    const b = D.dateKey(now);
    return Math.max(1, Math.round((D.dkToTs(b) - D.dkToTs(a)) / 86400000) + 1);
  },
  today(now){
    const s = this.state(), dk = D.dateKey(now || Date.now());
    return (s.day && s.day.dk === dk) ? s.day.n : 0;
  },
  srcToday(src, now){
    const r = this.state().src[src], dk = D.dateKey(now || Date.now());
    return (r && r.dk === dk) ? r.n : 0;
  },

  /* ★ 好感唯一的入口：冷却 → 来源每日上限 → 每日总上限，三道闸都在这里。
     涨不动的时候直接返回 0 并且不写库——所以从视图渲染里调它是安全的、幂等的 */
  gain(src, now){
    now = now || Date.now();
    const cfg = CONFIG.LOVE.SOURCES[src];
    if(!cfg) return 0;
    const s = this.state(), dk = D.dateKey(now);
    if(cfg.cd && s.last && s.last[src] && now - s.last[src] < cfg.cd) return 0;   // ① 同一来源的冷却
    const r = (s.src[src] && s.src[src].dk === dk) ? s.src[src] : {dk, n:0};
    if(r.n >= cfg.cap) return 0;                                                  // ② 这个来源今天算够了
    if(!s.day || s.day.dk !== dk) s.day = {dk, n:0};
    if(s.day.n + cfg.v > CONFIG.LOVE.DAILY_CAP) return 0;                         // ③ 每天的总闸（记的是「点」不是「次」）
    const was = this.stage().k;
    s.total += cfg.v; r.n++; s.day.n += cfg.v;
    s.src[src] = r;
    if(!s.last) s.last = {};
    s.last[src] = now;
    if(this.stage().k !== was){
      this._pendingStage = this.stage().k;
      const doc = dayDoc(dk);            // 她的日记里记一笔（数据先落，演出留给 tick）
      doc.loveUp = this.stage().k;
      saveDay(dk);
    }
    saveSettings();
    return cfg.v;
  },
  /* ── 感情会凉：连着几天没打开之后每天 -1，但下限不跌破当前阶段的门口
        （会凉，是为了让「回来」有意义；不归零，是因为陪伴不该被羞辱） ── */
  settle(now){
    now = now || Date.now();
    const s = this.state();
    const last = S.settings.herLastOpen;
    if(!last || !last.dk) return 0;
    const gap = Math.round((D.dkToTs(D.dateKey(now)) - D.dkToTs(last.dk)) / 86400000);
    if(gap <= CONFIG.LOVE.DECAY_AFTER_DAYS) return 0;
    const lost = (gap - CONFIG.LOVE.DECAY_AFTER_DAYS) * CONFIG.LOVE.DECAY_PER_DAY;
    const nv = Math.max(this.stage().min, s.total - lost);   // 门槛要在扣之前算
    const cut = s.total - nv;
    if(cut > 0){ s.total = nv; saveSettings(); }
    return cut;
  },
  /* 打开软件时（在 Her.onBoot 之前调：settle 要读到上一次的 herLastOpen） */
  onBoot(now){
    now = now || Date.now();
    const cut = this.settle(now);
    this._lastAct = now;      // 刚打开：从这里重新数「你安静了多久」
    return cut;
  },

  /* ── 你的活动：bootMain 里挂在 pointerdown 上 ── */
  touch(){ this._lastAct = Date.now(); },
  idleMs(now){ return (now || Date.now()) - (this._lastAct || 0); },
  _modalOpen(){
    if(typeof document === 'undefined' || !document.getElementById) return false;
    const mr = document.getElementById('modal-root');
    return !!(mr && mr.innerHTML);
  },

  /* ── 她的问题（galgame 式选择题）── */
  unlocked(){ return CONFIG.LOVE.QUESTIONS.filter(q => this.total() >= (CONFIG.LOVE.CAT_MIN[q.cat] || 0)); },
  nextQuestion(){
    const a = S.settings.herAnswers || {};
    const list = this.unlocked().filter(q => !a[q.id]);
    return list.length ? list[0] : null;
  },
  canAsk(now){
    now = now || Date.now();
    const dk = D.dateKey(now), last = S.settings.herAskAt;
    if(last && last.dk === dk) return false;                       // 每天最多一个
    if(last && Math.round((D.dkToTs(dk) - D.dkToTs(last.dk)) / 86400000) < CONFIG.LOVE.ASK_GAP_DAYS) return false;
    if(this.idleMs(now) < CONFIG.LOVE.ASK_IDLE_MS) return false;   // 你正忙着，她不打断
    return !this._modalOpen();
  },
  openAsk(q, now){
    now = now || Date.now();
    if(!q) return false;
    S.settings.herAskAt = {dk:D.dateKey(now), at:now};
    saveSettings();
    this._asking = q.id;
    UI.openModal(this.askHtml(q, now));
    return true;
  },
  askHtml(q, now){
    const ctx = Her.ctx(now || Date.now());
    let h = '<div class="lv-ask">'+
      '<div class="lv-hero"><div class="mcons-ava">'+Grow._miniHtml()+'</div>'+
        '<div class="mcons-bub">'+esc(Her.fill(q.q, ctx))+'</div></div>'+
      '<div class="lv-opts">';
    for(let i=0;i<q.opts.length;i++){
      h += '<button class="lv-opt" data-action="love-answer" data-id="'+esc(q.id)+'" data-i="'+i+'">'+esc(q.opts[i])+'</button>';
    }
    h += '</div><div class="hint">你回答过的事她会一直记着——以后还会拿它来接你的话。</div>'+
      '<button class="btn btn--small" data-action="modal-close" style="margin-top:10px">等下再聊</button>'+
    '</div>';
    return h;
  },
  answer(qid, i, now){
    now = now || Date.now();
    const q = CONFIG.LOVE.QUESTIONS.filter(x => x.id === qid)[0];
    if(!q) return false;
    const a = q.opts[i];
    if(a == null) return false;
    if(!S.settings.herAnswers) S.settings.herAnswers = {};
    S.settings.herAnswers[qid] = {a, dk:D.dateKey(now), at:now};
    this._asking = null;
    saveSettings();
    this.gain('answer', now);            // 好感来源表：回答她的问题 +5
    UI.closeModal();
    Her.reply(Her.voice('loveBack', Object.assign(Her.ctx(now), {answer:a, override:q.back || null})),
      {key:'her-loveback-'+qid, sub:'她记住啦', go:()=>goView('mcons')});
    scheduleRender();
    return true;
  },
  answerOf(qid){ const a = S.settings.herAnswers || {}; return a[qid] ? a[qid].a : null; },
  /* 隔了几天，她拿你以前的回答来接一次话（每天最多一次） */
  dueRecall(now){
    now = now || Date.now();
    const ans = S.settings.herAnswers || {}, used = S.settings.herRecall || {}, dk = D.dateKey(now);
    for(const id in used){ if(used[id] === dk) return null; }
    for(const q of CONFIG.LOVE.QUESTIONS){
      const a = ans[q.id];
      if(!a || used[q.id]) continue;
      const days = Math.round((D.dkToTs(dk) - D.dkToTs(a.dk)) / 86400000);
      if(days < CONFIG.LOVE.RECALL_GAP_DAYS) continue;
      return {q, a:a.a, days};
    }
    return null;
  },
  markRecall(qid, now){
    if(!S.settings.herRecall) S.settings.herRecall = {};
    S.settings.herRecall[qid] = D.dateKey(now || Date.now());
    saveSettings();
  },

  /* ── 「对她说」：她的小本子（聊天记录 + 她听不懂的句子，将来接 AI 的语料）── */
  log(){ return S.settings.herChatLog || []; },
  push(who, text, now){
    if(!S.settings.herChatLog) S.settings.herChatLog = [];
    const log = S.settings.herChatLog;
    log.push({w: who === 'me' ? 'me' : 'her', t:String(text == null ? '' : text), at: now || Date.now()});
    while(log.length > CONFIG.LOVE.CHAT_KEEP) log.shift();
    saveSettings();
    return log;
  },
  notes(){ return S.settings.herLangNotes || []; },
  note(text, now){
    const t = String(text == null ? '' : text).slice(0, 120);
    if(!t) return false;
    if(!S.settings.herLangNotes) S.settings.herLangNotes = [];
    const n = S.settings.herLangNotes;
    if(n.some(x => x.t === t)) return false;     // 同一句只记一次
    n.push({t, at: now || Date.now()});
    while(n.length > 100) n.shift();
    saveSettings();
    return true;
  },
  /* 进聊天页时她先打个招呼（隔久了才重新打，免得每次都重复一句） */
  enter(now){
    now = now || Date.now();
    const log = this.log();
    const last = log.length ? (log[log.length-1].at || 0) : 0;
    if(now - last < CONFIG.LOVE.CHAT_HI_GAP_MS) return false;
    const text = Her.voice(log.length ? 'chatGreet' : 'chatHi', Her.ctx(now));
    if(!text) return false;
    this.push('her', text, now);
    return true;
  },
  /* 你说一句 → 她回一句。纯本地规则（关键词命中），全都不中就老实说没听懂 */
  chat(text, now){
    now = now || Date.now();
    const raw = String(text == null ? '' : text).trim();
    if(!raw) return '';
    const low = raw.toLowerCase();
    const hit = CONFIG.LOVE.CHAT.filter(r => r.k.some(k => low.indexOf(String(k).toLowerCase()) >= 0))[0];
    const reply = Her.voice(hit ? hit.kind : 'chatFallback', Object.assign(Her.ctx(now), {say:raw}));
    if(!hit) this.note(raw, now);        // 没听懂 → 收进小本子
    this.push('me', raw, now);
    if(reply) this.push('her', reply, now);
    return reply;
  },

  /* ── 她来请求「走出软件」的权限（系统通知）——排在正事之后，且隔了一天以上才问 ── */
  canAskNotify(now){
    now = now || Date.now();
    if(typeof Notify === 'undefined' || !Notify.supported()) return false;
    const s = S.settings.herNotify || {};
    if(s.asked) return false;
    if(this.daysTogether(now) < 2) return false;                    // 刚认识就问这个太急了
    if(this.idleMs(now) < CONFIG.LOVE.ASK_IDLE_MS) return false;
    return !this._modalOpen();
  },
  askNotify(now){
    now = now || Date.now();
    S.settings.herNotify = Object.assign({}, S.settings.herNotify, {asked:true});
    saveSettings();
    UI.openModal(
      '<div class="lv-ask">'+
      '<div class="lv-hero"><div class="mcons-ava">'+Grow._miniHtml()+'</div>'+
        '<div class="mcons-bub">'+esc(Her.voice('noticeAsk', Her.ctx(now)))+'</div></div>'+
      '<div class="lv-opts">'+
        '<button class="lv-opt" data-action="love-notify-ok">好呀，你来提醒我</button>'+
        '<button class="lv-opt lv-opt--ghost" data-action="love-notify-no">先不用</button>'+
      '</div>'+
      '<div class="hint">同意之后，你把软件切到后台的时候，她说的话会以系统通知送到你手上（手机上要先把网页「添加到主屏幕」再打开，电脑上直接双击打开的文件用不了）。</div>'+
      '</div>');
    return true;
  },

  /* ── 每秒一次（跟着主循环）：演升级 / 问你问题 / 拿旧回答接话 / 请求通知权限 ── */
  tick(now){
    now = now || Date.now();
    if(S.view !== 'home' && S.view !== 'mspace') return;   // 和 Her 一样：她只在这两个纯净页里活动
    /* ① 关系升级（账在 gain 里已经记好，这里只演） */
    if(this._pendingStage){
      const k = this._pendingStage; this._pendingStage = null;
      const st = this.stage();
      UI.toast('和 ' + CONFIG.LOVE.NAME + ' 的关系升级了 →「' + st.name + '」');
      Her.reply(Her.voice('loveUp', Her.ctx(now)),
        {key:'her-loveup-'+k, sub:'我们之间', go:()=>goView('mcons')});
      return;
    }
    /* ② 她想问你一件事：你安静下来之后，她才好意思开口 */
    if(this.canAsk(now) && Her.canSpeak(now)){
      const q = this.nextQuestion();
      if(q){ this.openAsk(q, now); return; }
    }
    /* ③ 隔几天，她拿你以前的回答来接一次话 */
    const r = this.dueRecall(now);
    if(r && Her.canSpeak(now)){
      this.markRecall(r.q.id, now);
      Her.say('recallAnswer',
        Object.assign(Her.ctx(now), {a:r.a, q:r.q, override: r.q.recall ? r.q.recall(r.a) : null}),
        {key:'her-recall-'+r.q.id+'-'+D.dateKey(now), sub:'她记得', go:()=>goView('mtalk')});
      return;
    }
    /* ④ 她想请你允许她「走出软件」 */
    if(this.canAskNotify(now)) this.askNotify(now);
  }
};

/* ══════════════════════════════════════════════════════════════
   9.55 看板娘互动 Mascot（单击立绘：反应动画+台词气泡+爱心粒子+养成入口按钮）
   ══════════════════════════════════════════════════════════════ */
const Mascot = {
  /* 台词池：按等级解锁（v1.2）——base 人人有，L5/L10/L20 各解锁一批 */
  lines:{
    base:['今天也要一起加油哦~','摸摸头！','有什么事都可以交给我！','记得喝水哦，指挥官','要开始新的可能性了吗？','休息一下也没关系~','你的努力我都看在眼里！','今天想做什么呢？'],
    L5:['诶？我好像长大了一点点！','跟着你一起努力，我也在进步呢～','学徒出师第一步，谢谢你！','今天的你，比昨天更可靠了'],
    L10:['时间被我炼成小星星啦，都给你！','滴答滴答……我能听见时间的声音了','炼金术士的秘诀？就是每天一点点','这一炉时间里，有你一半的功劳'],
    L20:['我在把我们的每一天，织成一条长长的围巾','编织者模式启动！时间在我手里很听话','你看，坚持的日子连起来会发光']
  },
  linesFor(level){
    let out = this.lines.base.slice();
    if(level >= 5) out = out.concat(this.lines.L5);
    if(level >= 10) out = out.concat(this.lines.L10);
    if(level >= 20) out = out.concat(this.lines.L20);
    return out;
  },
  randomLine(level){ const l = this.linesFor(level || 1); return l[Math.floor(Math.random()*l.length)]; },
  /* 台词总句数（等级成长页的解锁进度分母，别再手写数字） */
  lineTotal(){ return this.lines.base.length + this.lines.L5.length + this.lines.L10.length + this.lines.L20.length; },
  /* 从 from 升到 to 这中间新解锁的台词（按档位由低到高） */
  unlockLinesBetween(from, to){
    let out = [];
    for(const [lv, key] of [[5,'L5'],[10,'L10'],[20,'L20']]){
      if(lv > from && lv <= to) out = out.concat(this.lines[key]);
    }
    return out;
  },
  tap(){
    if(S.view!=='home' && S.view!=='mspace') return;   // 她的空间里点她也能互动（并浮出回程星标）
    const el = document.getElementById('mascot');
    if(!el) return;
    const now = Date.now();
    /* v1.6a 连戳：1.5 秒里戳满 5 下，她真的要生气了（心情浮标 + 吓一跳 + 震动） */
    if(!this._tapAt || now - this._tapAt > CONFIG.SENSE.TAP_WIN){ this._tapAt = now; this._tapN = 0; }
    this._tapAt = now; this._tapN = (this._tapN || 0) + 1;
    const angry = this._tapN >= CONFIG.SENSE.TAP_N;
    if(angry) this._tapN = 0;
    /* 反应动画：随机跳一跳 / 软软一挤；戳急了是「吓了一跳」（播完移除，呼吸浮动恢复） */
    const cls = angry ? 'act-startle' : (Math.random()<0.5?'mascot-hop':'mascot-squish');
    el.classList.remove('mascot-hop','mascot-squish','act-startle');
    void el.offsetWidth;
    el.classList.add(cls);
    setTimeout(()=>el.classList.remove(cls), 700);
    if(angry){
      /* 生气：不撒爱心，只说一句（走本地气泡，不受每日说话次数限制——这是她在回应你） */
      Emo.set('angry', '连戳', now);
      buzz(110);
      this.react('tapAngry', 3200);
    }else{
      /* 台词气泡（按当前等级取台词池） */
      this.say(this.randomLine(Grow.level()), 2600);
      /* 爱心粒子 */
      this.hearts();
      if(Math.random() < 0.4) Emo.set('happy', '你戳了戳她', now);
    }
    /* 「戳她一下」好感 +1（30 秒冷却 + 每天最多 5 次——连戳不刷分，见 CONFIG.LOVE.SOURCES） */
    if(typeof Love !== 'undefined') Love.gain('tap', Date.now());
    /* 白圆黑星入口（几秒后收起）：长按进她的空间 / 长按回来。大小位置不用调钮：单指拖动、双指缩放 */
    this.showPortal();
  },
  /* 她对你做的一件事回一句（v1.6a）：走 Her.voice 出口（称呼自动替换），落在她自己的气泡里。
     这些是「她回应你」，不是她主动找你——所以不受每日说话次数限制 */
  react(kind, ms){
    if(typeof Her === 'undefined') return false;
    const t = Her.voice(kind, Her.ctx(Date.now()));
    if(!t) return false;
    this.say(t, ms || 2600);
    return true;
  },
  say(text, ms){
    const zone = document.querySelector('#view-root .mascot-zone');
    if(!zone) return;
    let b = zone.querySelector('.mascot-chat');
    if(!b){
      b = document.createElement('div');
      b.className = 'mascot-chat';
      zone.appendChild(b);
    }
    b.textContent = text;
    b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
    clearTimeout(this._sayT);
    this._sayT = setTimeout(()=>{ b.classList.remove('show'); }, ms || 2600);
  },
  /* 爱心粒子：动画强度三档（关闭=0 / 轻度=3 / 完整=5）。
     以前动画关闭时只是不播放动画，元素仍会留在页面上，所以这里直接不生成 */
  hearts(){
    const lv = S.settings.animLevel || 'light';
    if(lv === 'off') return 0;
    const zone = document.querySelector('#view-root .mascot-zone');
    if(!zone) return 0;
    const n = lv === 'full' ? 5 : 3;
    const em = ['💗','💙','✨','💛'];
    for(let i=0;i<n;i++){
      const s = document.createElement('span');
      s.className = 'mascot-heart';
      s.textContent = em[Math.floor(Math.random()*em.length)];
      s.style.left = (38+Math.random()*24)+'%';
      s.style.bottom = (56+Math.random()*16)+'%';
      s.style.animationDelay = (i*0.07)+'s';
      zone.appendChild(s);
      setTimeout(()=>s.remove(), 1800);
    }
    return n;
  },
  /* 白圆黑星入口：用户空间里点她 → 长按进她的空间；她的空间里点她 → 长按回来 */
  showPortal(){
    const zone = document.querySelector('#view-root .mascot-zone');
    if(!zone) return;
    const toMspace = (S.view !== 'mspace');
    let b = zone.querySelector('.portal-btn');
    if(!b){
      b = document.createElement('button');
      b.className = 'portal-btn';
      b.innerHTML = '<span class="pb-star">★</span>';
      this._wirePortalHold(b);
      zone.appendChild(b);
    }
    b.setAttribute('aria-label', toMspace ? '长按进入她的空间' : '长按回到我的空间');
    clearTimeout(this._portalT);
    b.classList.add('show');
    this._portalT = setTimeout(()=>{ b.classList.remove('show'); }, 6000);
  },
  /* 星标上的长按（独立于全局手势引擎：按在按钮上时手势引擎本来就被 _busy 挡住） */
  _wirePortalHold(b){
    let t = null;
    const cancel = ()=>{ if(t){ clearTimeout(t); t = null; } b.classList.remove('holding'); };
    const fire = ()=>{
      t = null; b.classList.remove('holding');
      if(typeof Gestures !== 'undefined') Gestures._reset();   // 清掉可能已经起步的手势状态
      Portal.go(S.view === 'mspace' ? 'home' : 'mspace', b);
    };
    b.addEventListener('pointerdown', e=>{
      if(e.button && e.button !== 0) return;
      b.classList.add('holding');
      clearTimeout(t);
      t = setTimeout(fire, Portal.HOLD_MS);
    });
    b.addEventListener('pointerup', cancel);
    b.addEventListener('pointercancel', cancel);
    b.addEventListener('pointerleave', cancel);
    b.addEventListener('contextmenu', e=>e.preventDefault());   // 手机长按不出系统菜单
    /* 只点一下（没按够）：教一下怎么进，不直接跳转 */
    b.addEventListener('click', ()=>{
      if(Portal._active) return;
      UI.toast(S.view==='mspace' ? '长按星标 0.5 秒回到我的空间' : '长按星标 0.5 秒进入她的空间');
    });
  },
  /* —— 单指拖动位置（按住立绘滑动即触发，与单击/双击/长按靠位移阈值区分） —— */
  dragStart(x, y){
    const p = S.settings.mascotPos || {dx:0, dy:0};
    this._drag = { x0:x, y0:y, dx0:p.dx, dy0:p.dy };
  },
  dragMove(x, y){
    if(!this._drag) return;
    const w = window.innerWidth || 390, h = window.innerHeight || 844;
    S.settings.mascotPos = {
      dx: clamp(this._drag.dx0 + (x - this._drag.x0)/w*100, -32, 32),
      dy: clamp(this._drag.dy0 + (y - this._drag.y0)/h*100, -32, 32)
    };
    this.applyPos();
  },
  dragEnd(moved){
    this._drag = null;
    if(moved < 10){ Mascot.tap(); return; }      // 没怎么动 = 算单击互动
    saveSettings();
    /* v1.6a 拖到角落：她问一句「要把我放这里吗？」——第一次挪这么远的时候问一次就够了 */
    const p = S.settings.mascotPos || {dx:0, dy:0};
    const far = Math.abs(p.dx) >= CONFIG.SENSE.CORNER || Math.abs(p.dy) >= CONFIG.SENSE.CORNER;
    if(far && !S.settings.herCornerAsked){
      S.settings.herCornerAsked = true;
      saveSettings();
      Emo.set('shy', '你把她挪到了角落', Date.now());
      this.react('cornerAsk', 3000);
    }
  },
  /* —— 双指捏合缩放（0.6~1.6 倍）—— */
  pinchTo(s0, ratio){
    const s = clamp(Math.round(s0*ratio*10)/10, 0.6, 1.6);
    S.settings.mascotScale = s;
    /* 记下这一轮捏合从多大开始、捏到多大：松手时才知道你是想放大还是缩小
       （只记最大值不够——她本来就在 0.6 倍时，轻轻一捏也会被当成「你想把她缩小」） */
    if(this._pinchFrom == null) this._pinchFrom = s0;
    this._pinchTo = s;
    this.applyPos();
  },
  pinchEnd(){
    saveSettings();
    /* v1.6a 捏大=害羞 / 捏小=委屈（要「朝着这个方向捏过头」才算，轻轻调大小不打扰） */
    const from = this._pinchFrom, to = this._pinchTo;
    this._pinchFrom = null; this._pinchTo = null;
    if(from == null || to == null || to === from) return;
    const now = Date.now();
    if(to >= CONFIG.SENSE.PINCH_BIG && to > from){ Emo.set('shy', '你把她放大了', now); this.react('pinchBig'); }
    else if(to <= CONFIG.SENSE.PINCH_SMALL && to < from){ Emo.set('sad', '你把她缩小了', now); this.react('pinchSmall'); }
  },
  /* 还原默认大小与位置（养成面板内） */
  resetPos(){
    S.settings.mascotScale = 1;
    S.settings.mascotPos = {dx:0, dy:0};
    saveSettings();
    this.applyPos();
    scheduleRender();
  },
  /* 调节大小（0.6~1.6，步进0.1）与位置（±32vw/vh，步进2） */
  adjust(kind, dir){
    if(kind==='reset'){
      S.settings.mascotScale = 1;
      S.settings.mascotPos = {dx:0, dy:0};
    }else if(kind==='size'){
      const s = clamp((S.settings.mascotScale||1) + (dir==='p'?0.1:-0.1), 0.6, 1.6);
      S.settings.mascotScale = Math.round(s*10)/10;
    }else{
      const p = {...(S.settings.mascotPos||{dx:0, dy:0})};
      if(dir==='left') p.dx -= 2;
      else if(dir==='right') p.dx += 2;
      else if(dir==='up') p.dy -= 2;
      else p.dy += 2;
      p.dx = clamp(p.dx, -32, 32);
      p.dy = clamp(p.dy, -32, 32);
      S.settings.mascotPos = p;
    }
    saveSettings();
    this.applyPos();
  },
  /* 把大小/位置直接应用到立绘（不整页重渲染，响应即时） */
  applyPos(){
    const el = document.querySelector('#view-root .mascot-pos');
    if(!el) return;
    const s = S.settings.mascotScale||1, p = S.settings.mascotPos||{dx:0, dy:0};
    el.style.transform = 'translate('+p.dx+'vw,'+p.dy+'vh) scale('+s+')';
  }
};

/* ══════════════════════════════════════════════════════════════
   9.585 她会动了（v1.6a）：她的身体 HerBody / 情绪 Emo / 动作导演 Director /
         摇一摇 Shake / 忙碌页角落的她 QCorner
   ★ 零迁移：新数据只挂在 settings 上（herAssets / herMood / herCornerAsked / herShake）
   ★ 她的样子有回退链：槽位图 > 你给她穿的那套（衣柜）> 系统默认的她（mimi/ 文件夹）> 旧版「看板娘.png」> 内置小可爱
     ——只传一张「开心」也能跑，其余地方用回普通的样子；系统默认的她也是同一套回退（缺哪个表情就退 normal.png）
   ★ 动作分两层，都不碰你的摆位（.mascot-pos 的内联 transform 永远是老大）：
     · 「冲动」加在 #mascot 上（keyframes，播完摘掉，与 mascot-hop 同一套手感）
     · 「姿势」加在 .mascot-anim 上（带过渡，可以停在某个姿势上）
   ══════════════════════════════════════════════════════════════ */
const HerBody = {
  forms(){ return Object.keys(CONFIG.BODY.SLOTS); },
  assets(){ return S.settings.herAssets || {}; },
  slots(form){ return (CONFIG.BODY.SLOTS[form] || []); },
  /* 某个槽位存着的图 id（没传过 = null） */
  id(form, key){ const g = this.assets()[form]; return (g && g[key]) || null; },
  has(form, key){ return !!this.id(form, key); },
  slotName(form, key){
    const s = this.slots(form).find(x => x[0] === key);
    return (s ? s[1] : key);
  },
  /* 传过任何一张她的图没有（决定「她的身体」页怎么说） */
  any(){
    for(const f of this.forms()){ const g = this.assets()[f] || {}; for(const k in g) if(g[k]) return true; }
    return false;
  },
  /* 全部非空的图 id（gcImages 的保护清单——漏了这一条，下次启动她的图全被当垃圾清掉） */
  refs(){
    const out = [];
    for(const f of this.forms()){ const g = this.assets()[f] || {}; for(const k in g) if(g[k]) out.push(g[k]); }
    return out;
  },
  /* 系统默认的她住在 mimi/ 文件夹：文件名由槽位名推出来（普通→normal.png、开心→happy.png、
     Q版开心→q-happy.png、动作→sit.png…）。传过图时用传的，没传过就从这里取 */
  builtinFile(form, key){
    const B = CONFIG.BODY.BUILTIN_BASE;
    if(!B[form]) return null;
    const k = (!key || key === 'base') ? '' : key;
    const name = (form === 'q' && k ? 'q-' + k : k) || B[form];
    return CONFIG.BODY.BUILTIN_DIR + name + '.png';
  },
  /* 她这会儿该用哪张图。form='normal'|'q'|'acts'（别的名字=只走回退链，给迷你看板娘用）
     返回 {src, shell, fb}：src=图片地址（null 表示只能用小可爱），shell=是否显示内置小可爱，
     fb=src 图裂了之后依次试的备用文件（系统默认层的逐级回退） */
  pick(form, key){
    const g = this.assets()[form] || {};
    const id = (key && key !== 'base') ? (g[key] || g.base) : g.base;
    if(id){ const u = Store.getImage(id); if(u) return {src:u, shell:false}; }
    const mId = S.settings.mascotId;
    if(mId === 'placeholder') return {src:null, shell:true};
    if(mId){ const u = Store.getImage(mId); return u ? {src:u, shell:false} : {src:null, shell:true}; }
    /* 系统默认的她：这张脸的文件 → 普通 → 旧版「看板娘.png」（过渡兜底） */
    const fb = [];
    const f = this.builtinFile(form, key);
    const b = this.builtinFile(form, 'base');
    if(f && f !== b) fb.push(f);
    if(b) fb.push(b);
    fb.push('看板娘.png');
    return {src: fb.shift(), shell:false, fb};
  },
  /* 立绘 HTML：图和内置小可爱同时在场，缺图/图裂时自动换成兜底
     data-her-img 标着这是哪个形态 → 情绪一变，paintHer 原地换脸，不用整页重绘
     data-fb = 图裂接力名单：这张裂了换下一张，都裂完才露出内置小可爱 */
  imgHtml(form, key, opt){
    opt = opt || {};
    const p = this.pick(form, key);
    const fb = (p.fb && p.fb.length) ? ' data-fb="'+esc(JSON.stringify(p.fb))+'"' : '';
    const onerr = "this.style.display='none';"+
      "var s=this.nextElementSibling;if(s&&s.classList&&s.classList.contains('mascot-shell'))s.style.display='';"+
      "var L=[];try{L=JSON.parse(this.dataset.fb||'[]')}catch(e){}"+
      "if(L.length){this.src=L.shift();this.dataset.fb=JSON.stringify(L);this.style.display='';}";
    return '<img data-her-img="'+esc(form)+'" src="'+(p.src || '看板娘.png')+'" alt="'+esc(CONFIG.LOVE.NAME)+'" draggable="false"'+
             (p.shell ? ' style="display:none"' : '')+fb+
             ' onerror="'+onerr+'">'+
           shellHtml(p.shell ? '' : ' style="display:none"', opt.small);
  },
  /* 存一张到槽位（原图直存，不压缩：透明背景 PNG 完整保留） */
  set(form, key, dataURL){
    /* 只认槽位表里写着的格子：乱传的键存进去只会变成一张谁也看不见、还占着地方的图 */
    if(!CONFIG.BODY.SLOTS[form] || !key) return null;
    if(!this.slots(form).some(x => x[0] === key)) return null;
    const id = uid('img_');
    if(!Store.saveImage(id, dataURL)){ UI.toast('存储空间不足，这张没能存下', 'err'); return null; }
    if(!S.settings.herAssets) S.settings.herAssets = {};
    if(!S.settings.herAssets[form]) S.settings.herAssets[form] = {};
    S.settings.herAssets[form][key] = id;
    saveSettings();
    scheduleRender();
    return id;
  },
  /* 清空一个槽位（图立刻回收——没别的槽位引用它的话） */
  clear(form, key){
    const g = this.assets()[form];
    if(!g || !g[key]) return false;
    delete g[key];
    saveSettings();
    gcImages();
    scheduleRender();
    UI.toast('「'+this.slotName(form, key)+'」已清空，她会用「普通」那张顶上');
    return true;
  },
  upload(form, key){
    const fi = document.getElementById('file-input');
    if(!fi || !CONFIG.BODY.SLOTS[form]) return;
    fi.accept = 'image/*';
    fi.multiple = false;                 // 一个槽位一张：点谁传谁
    S.pendingFileBody = {form, key};
    S.pendingFileCb = handleBodyFile;
    fi.value = ''; fi.click();
  },
  /* 她现在的样子叫什么（「她的身体」页顶部那句） */
  lookName(){
    if(this.any()) return '你上传的「她的身体」';
    const mId = S.settings.mascotId;
    if(mId === 'placeholder') return '内置小可爱';
    return mId ? Outfit.name(mId) : '系统默认的「米米」（mimi/ 文件夹）';
  }
};
/* 身体槽位的上传（一次一张：点哪个槽位就补哪张） */
function handleBodyFile(files){
  const f = (files || []).filter(x => x && x.type && x.type.startsWith('image/'))[0];
  const slot = S.pendingFileBody;
  S.pendingFileBody = null;
  if(!f || !slot){ UI.toast('请选择图片文件', 'err'); return; }
  UI.toast('正在读取…');
  const rd = new FileReader();
  rd.onload = ()=>{
    if(!rd.result) return;
    if(HerBody.set(slot.form, slot.key, rd.result))
      UI.toast('「'+HerBody.slotName(slot.form, slot.key)+'」已经收好了');
  };
  rd.onerror = ()=>{ UI.toast('图片读取失败', 'err'); };
  rd.readAsDataURL(f);
}

/* ── 她的情绪 Emo（v1.6a）：事件驱动 + 时间衰减，不随机 ──
   优先级：刚发生的事（90 秒内的情绪）> 深夜她困了 > 平静。
   情绪落到三处：头顶的小圆脸、她用哪张表情差分、台词池里的 c.emo 分支 */
const Emo = {
  get(now){
    now = now || Date.now();
    const m = S.settings.herMood;
    if(m && m.emo && m.emo !== 'neutral'){
      const age = now - (m.at || 0);
      /* 0 ≤ 已经过去的时间 < 保持时长。下界那条是防着手机时间往回跳——
         不然一条「刚发生」的情绪会一直挂在脸上，怎么等都等不到它淡 */
      if(age >= 0 && age < CONFIG.BODY.MOOD_HOLD_MS) return m.emo;
    }
    const h = new Date(now).getHours();
    if(h >= CONFIG.BODY.NIGHT_FROM || h < CONFIG.BODY.NIGHT_TO) return 'sleepy';
    return 'neutral';
  },
  /* 她这会儿该用哪张脸（缺这张差分会自动回落到「普通」）
     now 可以传（测试/回看用）；渲染时不传 = 就用此刻 */
  slot(now){ return CONFIG.BODY.EMO_SLOT[this.get(now)] || 'base'; },
  /* 头顶小圆脸的 emoji（空字符串 = 不显示浮标） */
  face(now){ return CONFIG.BODY.EMO_FACE[this.get(now)] || ''; },
  /* 落一笔情绪：任何让她高兴/生气/难过的瞬间都从这儿进 */
  set(emo, why, now){
    if(!CONFIG.BODY.EMO_SLOT[emo]) emo = 'neutral';
    now = now || Date.now();
    S.settings.herMood = {emo, why: why || '', at: now};
    saveSettings();
    paintHer();
    return emo;
  },
  /* 情绪自己会淡（不写库：get() 按时间算，省得每秒存一次）；淡下来时把库也擦干净 */
  tick(now){
    const m = S.settings.herMood;
    if(!m || !m.at) return false;
    if((now || Date.now()) - m.at < CONFIG.BODY.MOOD_HOLD_MS) return false;
    S.settings.herMood = {emo:'neutral', why:'', at:0};
    saveSettings();
    paintHer();
    return true;
  }
};
/* 原地换脸（不整页重绘）：情绪一变就调用——首页立绘、角落 Q版、页面里的缩略图一起换 */
function paintHer(){
  if(typeof document === 'undefined' || !document.querySelectorAll) return;
  try{
    document.querySelectorAll('img[data-her-img]').forEach(img=>{
      const form = img.dataset.herImg || 'normal';
      const p = HerBody.pick(form, form === 'normal' ? Emo.slot() : 'base');
      const sib = img.nextElementSibling;
      const shell = (sib && sib.classList && sib.classList.contains('mascot-shell')) ? sib : null;
      if(p.src){ img.src = p.src; img.style.display = ''; if(shell) shell.style.display = 'none'; }
      else { img.style.display = 'none'; if(shell) shell.style.display = ''; }
      /* 图裂接力名单跟着换（换脸换到系统默认层时，这张裂了还要会往下退） */
      img.dataset.fb = (p.fb && p.fb.length) ? JSON.stringify(p.fb) : '';
    });
  }catch(e){}
  try{
    const f = Emo.face();
    document.querySelectorAll('.mood-dot').forEach(d=>{
      const changed = d.textContent !== f;
      if(changed) d.textContent = f;
      d.classList.toggle('on', !!f);
      /* 换了个表情就轻轻弹一下（同一张脸反复刷新时不要抖个不停） */
      if(changed && f && d.classList.add){
        d.classList.remove('pop'); void d.offsetWidth; d.classList.add('pop');
      }
    });
  }catch(e){}
}
/* 震一下：安卓可以，iPhone 的网页做不到——那就闪一道光代替「震感」 */
function buzz(ms){
  let ok = false;
  try{ if(typeof navigator !== 'undefined' && navigator && navigator.vibrate){ navigator.vibrate(ms || 80); ok = true; } }catch(e){}
  if(!ok) flash();
  return ok;
}
/* 全屏微闪（给没有震动的地方补一下「被戳到了」的感觉） */
function flash(){
  try{
    if(typeof document === 'undefined' || !document.createElement || !document.body) return false;
    let el = document.getElementById('flash-layer');
    if(!el || !el.classList){
      el = document.createElement('div'); el.id = 'flash-layer';
      document.body.appendChild(el);
    }
    el.classList.remove('on');
    void el.offsetWidth;
    el.classList.add('on');
    return true;
  }catch(e){ return false; }
}

/* ── 动作导演 Director（v1.6a）：她什么时候动、动什么、说不说话，全从这儿出 ──
   ★ 演戏只在咱们俩的地方（首页 / 她的空间）；弹窗、传送、加载页的时候她不打扰
   ★ animLevel：完整=全播；轻度（默认）=只播蹦跳/扭一扭这类轻动作；关闭=不动（换脸与浮标照旧）
   ★ 时间线走单一定时器队列，任何一次触碰都能立刻收场（Director.stop） */
const Director = {
  _timers:[], _plan:[], _playing:false, _lastAct:null, _lastShakeAsk:0, _poseNow:null,
  /* 冲动动作的宿主：纯净页是 #mascot，忙碌页是右下角那个 Q版 */
  _el(){
    try{
      const m = document.getElementById('mascot');
      if(m) return m;
      return document.getElementById('q-corner');
    }catch(e){ return null; }
  },
  /* 姿势的宿主：#mascot 里那一层 .mascot-anim（忙碌页退到 Q版） */
  _poseEl(){
    try{
      const a = document.querySelector('#view-root .mascot-anim');
      if(a && a.classList) return a;
      return document.getElementById('q-corner');
    }catch(e){ return null; }
  },
  level(){ return S.settings.animLevel || 'light'; },
  /* 这个动作现在允许播吗（关闭=一个都不播；轻度=只播轻动作；完整=全播） */
  allowed(act){
    const lv = this.level();
    if(lv === 'off') return false;
    return lv === 'full' || CONFIG.ACT.LIGHT.indexOf(act) >= 0;
  },
  /* 现在方便演吗 */
  can(){
    if(this.level() === 'off') return false;
    if(S.view !== 'home' && S.view !== 'mspace') return false;
    if(typeof Portal !== 'undefined' && Portal._active) return false;
    if(S.consOpen) return false;
    if(typeof UI !== 'undefined' && UI.isOpen && UI.isOpen()) return false;
    return true;
  },
  /* 把一串 {at, act, …} 排成时间线（纯函数：冒烟测试只认它，不认真正的定时器） */
  plan(steps){
    const out = [];
    for(const s of (steps || [])){
      if(!s || !s.act) continue;
      out.push({at: Math.max(0, s.at | 0), act: String(s.act), opt: s});
    }
    out.sort((a, b) => a.at - b.at);
    return out;
  },
  /* 按时间线演一场（先停掉上一场，避免两场戏抢她的身体） */
  play(steps, opt){
    opt = opt || {};
    const plan = this.plan(steps);
    if(!plan.length) return [];
    this.stop();
    this._plan = plan; this._playing = true;
    for(const p of plan) this._timers.push(setTimeout(()=>this._run(p), p.at));
    const total = opt.total || (plan[plan.length - 1].at + 1400);
    this._timers.push(setTimeout(()=>{ this._playing = false; }, total));
    return plan;
  },
  _run(p){
    const o = p.opt || {};
    if(p.act === 'say'){
      if(typeof Her === 'undefined') return;
      if(o.text){ if(typeof Mascot !== 'undefined') Mascot.say(o.text, o.ms || 2600); }
      else if(o.kind) Her.say(o.kind, o.ctx || Her.ctx(Date.now()), o);
      return;
    }
    if(p.act === 'emo'){ Emo.set(o.emo, o.why); return; }
    if(p.act === 'hearts'){ if(typeof Mascot !== 'undefined') Mascot.hearts(); return; }
    if(p.act === 'buzz'){ buzz(o.ms); return; }
    if(p.act === 'paint'){ paintHer(); return; }
    if(p.act.indexOf('pose-') === 0) this.pose(p.act.slice(5), o.hold);
    else this.act(p.act, o);
  },
  /* 冲动动作：加类 → 到点摘掉（和 Mascot.tap 的 hop/squish 同一套手感） */
  act(name, opt){
    const el = this._el();
    if(!el || !el.classList) return false;
    if(!this.allowed(name)) return false;
    const ms = (opt && opt.ms) || CONFIG.ACT.MS[String(name).replace(/^act-/, '')] || 700;
    el.classList.remove.apply(el.classList, CONFIG.ACT.RUSH);
    void el.offsetWidth;
    el.classList.add(name);
    this._timers.push(setTimeout(()=>{ try{ el.classList.remove(name); }catch(e){} }, ms));
    return true;
  },
  /* 姿势：停在某个姿势上（hold 毫秒后自己站好；不传就一直那样） */
  pose(name, hold){
    const el = this._poseEl();
    if(!el || !el.classList) return false;
    if(this.level() === 'off') return false;
    el.classList.remove.apply(el.classList, CONFIG.ACT.POSES);
    void el.offsetWidth;
    el.classList.add('pose-' + name);
    this._poseNow = name;
    if(hold) this._timers.push(setTimeout(()=>{ this.stand(); }, hold));
    return true;
  },
  stand(){ const r = this.pose('emerge'); this._poseNow = null; return r; },
  hide(){ return this.pose('hide'); },
  /* 收场：清掉所有定时器与动作类（你碰屏幕 / 换页 / 弹窗时调用） */
  stop(){
    for(const t of this._timers){ try{ clearTimeout(t); }catch(e){} }
    this._timers = []; this._plan = []; this._playing = false; this._poseNow = null;
    try{
      document.querySelectorAll('.mascot, #q-corner').forEach(el=>{
        el.classList.remove.apply(el.classList, CONFIG.ACT.RUSH);
        el.classList.remove.apply(el.classList, CONFIG.ACT.POSES);
      });
    }catch(e){}
    try{
      const a = document.querySelector('#view-root .mascot-anim');
      if(a && a.classList) a.classList.remove.apply(a.classList, CONFIG.ACT.POSES);
    }catch(e){}
  },
  /* 你碰了屏幕：她把手里的动作收起来，看着你 */
  userTouch(){ if(this._playing || this._poseNow) this.stop(); },
  /* 每秒心跳：她自己在的时候找点事做（小动作 / 待机小剧场 / 偶尔顺口说一句） */
  tick(now){
    now = now || Date.now();
    /* 第一次心跳（或刚被清成 0）→ 从现在开始计。用 == null 判「从没记过」，
       这样 0 仍然能表示「很久没动过」，不会被当成初次而白白等一个空档 */
    if(this._lastAct == null) this._lastAct = now;
    this._shakeAsk(now);
    if(this._playing || !this.can()) return;
    if(now - this._lastAct < this._gap()) return;
    const idle = (typeof Love !== 'undefined') ? Love.idleMs(now) : 0;
    if(idle < CONFIG.ACT.IDLE_AFTER) return;
    this._lastAct = now;
    /* 你很久没动静：坐下 / 打瞌睡；否则蹦一下、扭一扭 */
    const deep = idle >= CONFIG.ACT.SIT_AFTER;
    const act = deep ? this._pickDeep() : this._pickLight();
    if(act.pose) this.pose(act.pose, act.hold);
    else this.act(act.name, act);
    /* 偶尔顺口说一句（走 Her.say 的频率门：今天说够了就不说） */
    if(Math.random() < CONFIG.ACT.SAY_CHANCE && typeof Her !== 'undefined')
      Her.say('idle', Her.ctx(now), {sub:'她'});
  },
  _gap(){ return CONFIG.ACT.IDLE_GAP_MS + Math.random() * CONFIG.ACT.IDLE_GAP_RAND; },
  _pickLight(){ const p = CONFIG.ACT.LIGHT; return {name: p[Math.floor(Math.random() * p.length)]}; },
  _pickDeep(){
    const p = [{pose:'sit', hold:9000}, {pose:'sit', hold:7000}, {pose:'sleep', hold:12000}, {pose:'droop', hold:8000}];
    return p[Math.floor(Math.random() * p.length)];
  },
  /* 她的请求：能不能摇一摇我（只在 iPhone 这类「要先问你」的地方问一次，问了就记下来） */
  _shakeAsk(now){
    if(typeof Shake === 'undefined') return false;
    if(now - this._lastShakeAsk < 3 * 60 * 1000) return false;
    this._lastShakeAsk = now;
    return Shake.ask(now);
  }
};

/* ── 摇一摇 Shake（v1.6a）：手机摇了她会有反应 ──
   ★ iPhone 要先点头（系统规定必须由你的手势触发）→ 所以她开口问一句、你点一下才开
   ★ 桌面 file://、没有这个能力的浏览器：整块静默降级，绝不报错 */
const Shake = {
  _on:false, _last:0, _n:0, _t:0,
  supported(){ try{ return (typeof window !== 'undefined') && ('DeviceMotionEvent' in window); }catch(e){ return false; } },
  /* 需要先问过你才能开（iOS 13+） */
  needAsk(){
    try{ return this.supported() && (typeof DeviceMotionEvent !== 'undefined') && (typeof DeviceMotionEvent.requestPermission === 'function'); }
    catch(e){ return false; }
  },
  on(){ return !!(S.settings.herShake && S.settings.herShake.on); },
  asked(){ return !!(S.settings.herShake && S.settings.herShake.asked); },
  /* 她开口问一次（气泡上点一下 = 用户手势，正好满足系统要求） */
  ask(now){
    if(!this.needAsk() || this.asked() || this.on()) return false;
    if(typeof Her === 'undefined') return false;
    now = now || Date.now();

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>可能性空间</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
/* ══════════════════════════════════════════════════════════════
   1. 设计变量与基础重置
   ══════════════════════════════════════════════════════════════ */
:root{
  --bg:#E8F0FB; --card:rgba(255,255,255,.8); --card-2:#FFFFFF;
  --line:rgba(99,125,170,.22); --line-strong:rgba(99,125,170,.42);
  --text:#1E2A3A; --text-2:#5C6B82;
  --accent:#3D7EFF; --accent-soft:#E3EEFF; --accent-dark:#1E5BD8; --accent-line:#BFD6FF;
  --gold:#F0A93C; --gold-soft:#FFF4DE; --gold-line:#F3DBA8;
  --green:#34BE7D; --green-soft:#DFF7EB; --green-line:#B5E8CE;
  --red:#F45B69; --red-soft:#FFE8EA; --red-line:#F8C4C9;
  --blue-soft:#E3EEFF; --gray:#93A1B8; --gray-soft:#EAF0F8; --gray-line:#D9E2EE;
  --radius:14px; --radius-s:9px;
  --shadow:0 3px 14px rgba(30,50,90,.07), 0 1px 3px rgba(30,50,90,.05);
  --shadow-lg:0 12px 40px rgba(30,50,90,.2), 0 3px 12px rgba(30,50,90,.09);
  --glass:blur(18px) saturate(1.35);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
}
body{background:
  radial-gradient(1200px 600px at 85% -10%, rgba(120,190,255,.35), transparent 60%),
  radial-gradient(1000px 500px at -10% 30%, rgba(255,190,220,.3), transparent 55%),
  linear-gradient(180deg,#DDEBFB 0%,#EEF4FC 45%,#FBFCFE 100%);
  background-attachment:fixed;color:var(--text);font-family:var(--font);font-size:14px;line-height:1.55;min-height:100vh}
/* 动画强度：关/轻度时停用装饰动画（打开动画强度设置可恢复） */
body.anim-off *,body.anim-off *::before,body.anim-off *::after{animation:none!important;transition:none!important}
body.anim-light .sparkle{display:none}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ══════════════════════════════════════════════════════════════
   2. 应用框架：顶栏 / 视图容器 / 底部Tab
   ══════════════════════════════════════════════════════════════ */
/* 子页面顶栏：玻璃质感，仅非纯净页显示 */
#app-header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.6);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
.hdr-left{display:flex;align-items:center;gap:4px;min-width:0}
.hdr-title{font-weight:700;font-size:15px;letter-spacing:.5px;padding-left:10px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-title::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:15px;background:linear-gradient(180deg,var(--accent),#7FB0FF);border-radius:2px}
.hdr-right{display:flex;align-items:center;gap:2px}
.hdr-clock{font-size:13px;color:var(--text-2);margin-right:6px}
.icon-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:none;background:rgba(255,255,255,.55);border-radius:12px;color:var(--text-2);font-size:16px;flex:none;
  box-shadow:0 1px 4px rgba(30,50,90,.06);transition:transform .12s,background .15s}
.icon-btn:active{transform:scale(.9);background:#fff}
.icon-btn svg{width:20px;height:20px}
#view-root{max-width:720px;margin:0 auto;padding:14px 12px 40px}
#view-root.pure{padding:0;max-width:none;width:100%;height:100dvh}
.warn-banner{background:var(--gold-soft);border:1px solid #EBD6AE;color:#8A6116;font-size:12px;padding:8px 12px;border-radius:var(--radius);margin-bottom:14px}

/* ══════════════════════════════════════════════════════════════
   3. 卡片 / 区块 / 按钮 / 表单 / 标签
   ══════════════════════════════════════════════════════════════ */
.sec{margin-bottom:24px}
.sec-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text-2);letter-spacing:2px;margin:0 0 10px}
.sec-title::before{content:'';width:3px;height:14px;background:var(--accent);border-radius:1px}
.sec-title .sec-extra{margin-left:auto;letter-spacing:0;font-weight:400;font-size:12px}
.sec{margin-bottom:24px}
.sec-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text-2);letter-spacing:2px;margin:0 0 10px}
.sec-title::before{content:'';width:4px;height:14px;background:linear-gradient(180deg,var(--accent),#8FBEFF);border-radius:2px}
.sec-title .sec-extra{margin-left:auto;letter-spacing:0;font-weight:400;font-size:12px}
/* 玻璃卡片：半透明+模糊+细高光+立体阴影（碧蓝档案感） */
.card{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.74));
  border:1px solid rgba(255,255,255,.65);border-radius:var(--radius);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9);position:relative;
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.card.pad{padding:16px}
.card--mark::before{content:'';position:absolute;left:10px;top:-1px;width:26px;height:3px;background:linear-gradient(90deg,var(--accent),#8FBEFF);border-radius:2px}
.card--mark::after{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;font-size:14px;
  border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.85);color:var(--text);
  box-shadow:0 1px 3px rgba(30,50,90,.05);user-select:none;transition:transform .12s,box-shadow .15s}
.btn:active{transform:translateY(1px) scale(.98)}
.btn--primary{background:linear-gradient(160deg,#5A94FF,var(--accent) 55%,#2E6BE6);border-color:transparent;color:#fff;
  box-shadow:0 4px 14px rgba(61,126,255,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.btn--primary:active{box-shadow:0 2px 6px rgba(61,126,255,.3)}
.btn--danger{color:var(--red);border-color:var(--red-line);background:rgba(255,255,255,.85)}
.btn--ghost{background:transparent;border-color:transparent;color:var(--accent);box-shadow:none}
.btn--small{padding:5px 12px;font-size:12px;border-radius:10px}
.btn--block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.input,.select,.textarea{width:100%;padding:9px 12px;border:1px solid var(--line-strong);border-radius:12px;
  font-size:14px;background:rgba(255,255,255,.85);color:var(--text)}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2.5px var(--accent-soft)}
.textarea{resize:vertical;min-height:80px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px}
.field .hint{font-size:12px;color:var(--text-2);margin-top:4px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;padding:4px 13px;font-size:12px;border:1px solid var(--line);
  border-radius:var(--radius-round,999px);background:rgba(255,255,255,.7);color:var(--text-2);user-select:none}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dark)}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 9px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent-dark);border:1px solid var(--accent-line)}
.badge--space{background:var(--space-soft,#E3EEFF);color:var(--space-color,#1E5BD8);border-color:var(--space-line,#BFD6FF)}
.empty{padding:28px 16px;text-align:center;color:var(--text-2);font-size:13px;border:1px dashed var(--line-strong);border-radius:var(--radius)}
.empty .empty-ico{font-size:28px;margin-bottom:8px;display:block}
.prog{height:8px;background:rgba(147,161,184,.22);border-radius:6px;overflow:hidden}
.prog-bar{height:100%;background:linear-gradient(90deg,#5A94FF,var(--accent));border-radius:6px;transition:width .3s}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text-2)}
.kv .v{font-weight:600;text-align:right}

/* ══════════════════════════════════════════════════════════════
   4. 待办卡片状态（蓝/黄/红 → 确认绿+红问号 → 完成灰+绿勾）
   ══════════════════════════════════════════════════════════════ */
.todo-card{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer;overflow:hidden;margin-bottom:10px;transition:background .2s,border-color .2s}
.todo-card.t-yellow{border-left-color:var(--gold);background:var(--gold-soft);border-color:var(--gold-line)}
.todo-card.t-red{border-left-color:var(--red);background:var(--red-soft);border-color:var(--red-line)}
.todo-card.t-confirm{border-left-color:var(--green);background:var(--green-soft);border-color:var(--green-line)}
.todo-card.t-done{border-left-color:var(--gray);background:var(--gray-soft);border-color:var(--gray-line)}
.todo-main{flex:1;min-width:0;padding:12px 12px 12px 14px}
.todo-title{font-weight:600;font-size:14.5px}
.todo-card.t-done .todo-title{color:var(--text-2);text-decoration:line-through}
.todo-sub{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.todo-cd{font-size:12px;color:var(--text-2)}
.todo-card.t-yellow .todo-cd{color:var(--gold);font-weight:600}
.todo-card.t-red .todo-cd{color:var(--red);font-weight:700}
.todo-note{margin-top:5px;font-size:12px;color:var(--text-2);white-space:pre-wrap}
.todo-hint{margin-top:5px;font-size:12px;color:var(--green);font-weight:600}
.todo-edit{position:absolute;top:6px;right:6px;width:26px;height:26px;color:var(--text-2);background:rgba(255,255,255,.7);border-radius:3px}
.todo-main{padding-right:38px}
.sec-sub{margin:16px 0 8px;font-size:12px;font-weight:700;color:var(--text-2);letter-spacing:1px;display:flex;align-items:center;gap:8px}
.sec-sub .cnt{background:var(--gray-soft);color:var(--text-2);border-radius:8px;padding:0 8px;font-size:11px;font-weight:400}
.todo-side{width:42px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;background:rgba(255,255,255,.6)}
.todo-side.q{color:var(--red);animation:popIn .2s ease}
.todo-side.ok{color:var(--green);animation:popIn .2s ease}
@keyframes popIn{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}

/* ══════════════════════════════════════════════════════════════
   5. 弹窗 / 确认框 / Toast
   ══════════════════════════════════════════════════════════════ */
#modal-root:empty{display:none}
.modal-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal-mask{position:absolute;inset:0;background:rgba(30,42,70,.4);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:fadeIn .15s}
.modal-panel{position:relative;background:rgba(252,253,255,.92);border:1px solid rgba(255,255,255,.8);border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:86vh;overflow-y:auto;
  padding:20px 18px calc(18px + env(safe-area-inset-bottom));animation:slideUp .22s cubic-bezier(.2,.9,.3,1.12);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);box-shadow:0 -10px 40px rgba(30,50,90,.18)}
.modal-title{font-weight:700;font-size:16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-title .x{background:none;border:none;color:var(--text-2);font-size:20px;line-height:1;padding:4px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn{flex:1}
@media (min-width:520px){.modal-wrap{align-items:center}.modal-panel{border-radius:24px;margin:24px;animation:fadeIn .18s ease,sheetUp .24s cubic-bezier(.18,.85,.28,1.12)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
#toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));z-index:200;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:rgba(35,43,56,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:var(--radius);max-width:82vw;animation:slideUp .18s}
.toast.err{background:rgba(201,68,64,.95)}

/* ══════════════════════════════════════════════════════════════
   6. 首页 / 空间网格 / 设置页
   ══════════════════════════════════════════════════════════════ */
.home-hero{padding:26px 20px 22px;margin-bottom:24px;background:linear-gradient(135deg,#FFFFFF 0%,#EEF4FD 100%)}
.hero-date{font-size:13px;color:var(--text-2);letter-spacing:1px;margin-bottom:6px}
.hero-clock{font-size:42px;font-weight:700;line-height:1.1}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.space-card{background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.7);border-top:3px solid var(--sc,var(--accent));border-radius:var(--radius);
  padding:14px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:var(--shadow);position:relative;
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.space-card:active{transform:translateY(1px)}
.space-ico{font-size:26px;line-height:1.2}
.space-name{font-weight:600;font-size:15px;word-break:break-all}
.space-meta{font-size:12px;color:var(--text-2)}
.grid-2 .add-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text-2);
  border:1px dashed var(--line-strong);background:transparent;box-shadow:none;min-height:104px;font-size:13px}
.grid-2 .add-card .plus{font-size:22px;color:var(--accent)}

/* ══════════════════════════════════════════════════════════════
   7. 空间详情（统计/日历/分类/图片）
   ══════════════════════════════════════════════════════════════ */
.sp-ico{width:56px;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;border:1px solid var(--line)}
.stat-row{display:flex;margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.stat{flex:1;text-align:center}
.stat-v{font-weight:700;font-size:16px}
.stat-k{font-size:11px;color:var(--text-2);margin-top:2px}
.color-row{display:flex;gap:10px}
.color-dot{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line-strong);cursor:pointer;transition:transform .12s}
.color-dot.on{box-shadow:0 0 0 2px var(--accent);transform:scale(1.12)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wd span{text-align:center;font-size:11px;color:var(--text-2);padding:2px 0}
.cal-day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border:1px solid var(--line);border-radius:3px;background:#fff;cursor:pointer;min-height:54px;overflow:hidden}
.cal-day.has{background:var(--accent-soft);border-color:var(--accent-line)}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-day.sel{outline:2px solid var(--accent);outline-offset:-1px}
.cal-n{font-size:13px;font-weight:600}
.cal-day.today .cal-n{color:var(--accent)}
.cal-e{font-size:15px;line-height:1.1}
.cal-t{font-size:9px;color:var(--text-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 月历标题行：点中间的「年月」可收起/展开整个日历 */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-head .cal-title{flex:1;min-width:0;text-align:center;font-weight:600;font-size:14px;color:var(--text);
  background:none;border:none;padding:4px 0;cursor:pointer;border-radius:8px}
.cal-head .cal-title:hover{background:var(--gray-soft)}
.cal-caret{font-size:11px;color:var(--text-2);margin-left:2px}
.cat-item{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.cat-ico{color:var(--accent);font-size:16px}
.cat-name{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-cnt{font-size:12px;color:var(--text-2);flex:none}
.cat-item .icon-btn{width:28px;height:28px;flex:none;font-size:14px}
.chip .x-btn{background:none;border:none;color:inherit;font-size:13px;margin-left:6px;padding:0 2px;cursor:pointer;opacity:.7;line-height:1}
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.img-thumb{border:1px solid var(--line);border-radius:3px;overflow:hidden;aspect-ratio:1;background:var(--gray-soft);display:flex;align-items:center;justify-content:center}
.img-thumb img{width:100%;height:100%;object-fit:cover}

/* ══════════════════════════════════════════════════════════════
   8. 节律表（统计卡/时间带/递归卡片/日记）
   ══════════════════════════════════════════════════════════════ */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.rh-track{position:relative;height:30px;background:var(--gray-soft);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.rh-band{position:absolute;top:0;bottom:0;min-width:2px;border-radius:2px;opacity:.85}
.rh-band.active{animation:pulse 1.6s ease infinite}
@keyframes pulse{0%,100%{opacity:.95}50%{opacity:.5}}
.rh-now{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--red);z-index:3;pointer-events:none}
.rh-space.on{outline:2px solid var(--sc);outline-offset:1px}
.rec-live{font-size:13px;font-weight:700;color:var(--sc,var(--accent));margin-top:2px}
.rh-entry .rh-time{font-weight:700;color:var(--accent);font-size:14px}
/* —— 24小时递归圆圈（共识页）：整圈=一天 · 扇形色块=一段递归 —— */
.ring-wrap{position:relative;width:min(64vw,250px);margin:2px auto 0}
.ring-svg{width:100%;height:auto;display:block;overflow:visible}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.ring-center b{font-size:16px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.25}
.ring-center span{font-size:11px;color:var(--text-2);letter-spacing:1px}
.ring-live{animation:pulse 1.6s ease infinite}
.ring-legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:12px}
.ring-legend .li{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2)}
.ring-legend .li b{color:var(--text);font-weight:700}
.ring-legend .dot{margin:0}
.slot-item{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:8px}
.slot-info{flex:1;min-width:0}
.slot-time{font-weight:600;font-size:14px}
.slot-badge{font-size:11px;padding:2px 8px;border-radius:2px;flex:none}
.sb-upcoming{background:var(--blue-soft);color:var(--accent-dark)}
.sb-active{background:var(--green-soft);color:var(--green)}
.sb-done{background:var(--gray-soft);color:var(--text-2)}
.sb-missed{background:var(--red-soft);color:var(--red)}

/* ══════════════════════════════════════════════════════════════
   9. 首页（收纳卡/紧急行/进行中指示）与图片角标
   ══════════════════════════════════════════════════════════════ */
.home-todo-card{cursor:pointer;transition:background .25s}
/* 全部完成：仅文字条浅绿 + 绿色左边条，整卡保持白色，避免大色块吞掉下方板块 */
.home-todo-card.all-done{border-left:3px solid var(--green)}
.home-todo-card.all-done .home-todo-ico{background:var(--green)}
.home-todo-card.all-done .home-todo-count{color:var(--green);font-weight:600}
.home-todo-open{margin-top:12px;border-top:1px dashed var(--line-strong);padding-top:12px}
.home-todo-open .todo-card:last-child{margin-bottom:0}
.home-todo-ico{width:42px;height:42px;border-radius:6px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.home-todo-arrow{color:var(--text-2);font-size:12px}
.home-urgent{margin-top:12px;padding:9px 12px;background:var(--red-soft);border:1px solid #F0C6C4;border-radius:3px;font-size:13px;color:var(--text)}
.home-urgent.ok{background:var(--green-soft);border-color:#BFE3D0}
.home-live{margin-top:10px;font-size:13px;color:var(--green);font-weight:600;display:flex;align-items:center;gap:7px}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulseDot 1.2s ease infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
.img-thumb{position:relative;cursor:pointer}
.img-x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(20,26,36,.6);color:#fff;border:none;font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.iter-item{border:1px dashed var(--line-strong);border-radius:14px;padding:10px 12px;margin-bottom:10px;position:relative;background:rgba(255,255,255,.6)}
.alarm-item.off{opacity:.55}
.alarm-time{font-size:24px;font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.alarm-switch{width:44px;height:24px;border-radius:12px;background:var(--gray-soft);border:1px solid var(--line-strong);position:relative;cursor:pointer;flex:none;transition:background .2s;padding:0}
.alarm-switch span{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .2s}
.alarm-switch.on{background:var(--accent);border-color:var(--accent)}
.alarm-switch.on span{left:22px}

/* ══════════════════════════════════════════════════════════════
   10. 自定义背景与覆盖模式
   ══════════════════════════════════════════════════════════════ */
#bg-layer{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;background-repeat:no-repeat}
/* 内容区只允许纵向滚动（手势引擎接管纯净页横纵划动） */
#view-root{touch-action:pan-y}
.daynav{display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:16px}
.daynav .nav-date{flex:1;text-align:center;font-weight:600;font-size:14px;min-width:0}

/* ══════════════════════════════════════════════════════════════
   11. 纯净看板娘首页（背景+立绘+手势，无静态UI）
   ══════════════════════════════════════════════════════════════ */
.pure-screen{position:relative;height:100dvh;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;
  touch-action:none;-webkit-touch-callout:none}
.pure-date{position:absolute;top:calc(10px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:3;
  background:none;border:none;padding:0;margin:0}
/* 字号可在「设置 → 纯净首页」里自定义（--pdfs 日期 / --pcfs 时间），内边距用 em 随字号一起放大 */
.mini-date{display:inline-flex;align-items:center;gap:.45em;padding:.38em 1.05em;font-size:var(--pdfs,15px);font-weight:600;color:var(--text-2);
  background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.7);border-radius:999px;backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
/* 日期下方的大时间（点=闹钟） */
.pure-clock{border:none;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.7);border-radius:999px;
  padding:.03em .66em .1em;font-size:var(--pcfs,36px);font-weight:800;line-height:1.25;color:var(--text);
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);text-shadow:0 1px 2px rgba(255,255,255,.8)}
.mascot-zone{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.mascot-zone .mascot{position:relative;z-index:2;width:100%;max-width:560px;cursor:pointer;
  animation:floatY 4s ease-in-out infinite}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.mascot-zone .mascot svg,.mascot-zone .mascot img{width:100%;height:auto;display:block;filter:drop-shadow(0 14px 18px rgba(60,90,140,.25))}
/* 占位小角色（用户上传立绘后由图片替换） */
.mascot-shell{position:relative;aspect-ratio:1/1.45;border-radius:50% 50% 46% 46%/42% 42% 44% 44%;
  background:linear-gradient(160deg,#FFE3EC,#FFB8CE);overflow:hidden;box-shadow:inset 0 -18px 30px rgba(255,120,160,.25)}
.mascot-shell .ms-hair{position:absolute;top:-6%;left:-8%;right:-8%;height:52%;background:linear-gradient(180deg,#FF9DB4,#FF7A9C);border-radius:0 0 50% 50%/0 0 60% 60%}
.mascot-shell .ms-hair2{position:absolute;top:38%;left:-6%;width:36%;height:22%;background:#FF7A9C;border-radius:50%}
.mascot-shell .ms-hair3{position:absolute;top:38%;right:-6%;width:36%;height:22%;background:#FF7A9C;border-radius:50%}
.mascot-shell .ms-face{position:absolute;top:34%;left:50%;transform:translateX(-50%);width:34%;height:26%;border-radius:50% 50% 46% 46%;background:#FFE9EE}
.mascot-shell .ms-eye{position:absolute;top:42%;width:8%;height:12%;border-radius:50%;background:#5C3A4A}
.mascot-shell .ms-eye.l{left:26%}.mascot-shell .ms-eye.r{right:26%}
.mascot-shell .ms-blush{position:absolute;top:56%;width:14%;height:7%;border-radius:50%;background:rgba(255,120,150,.5)}
.mascot-shell .ms-blush.l{left:18%}.mascot-shell .ms-blush.r{right:18%}
.mascot-shell .ms-brow{position:absolute;top:38%;left:25%;right:25%;height:3px;border-radius:2px;background:#E8658C}
.mascot-shell .ms-mouth{position:absolute;top:57%;left:50%;transform:translateX(-50%);width:12%;height:6%;border-bottom:2.5px solid #E8658C;border-radius:0 0 50% 50%}
.mascot-shell .ms-ahoge{position:absolute;top:2%;left:48%;width:22%;height:14%;background:#FF7A9C;border-radius:60% 60% 10% 10%;transform:rotate(-12deg)}
.mascot-shell .ms-ribbon{position:absolute;top:66%;left:50%;transform:translateX(-50%);font-size:34px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.12))}
/* 呼吸泡泡/悬浮装饰 */
.mascot-shadow{position:absolute;bottom:16%;left:50%;transform:translateX(-50%);width:44%;height:7%;border-radius:50%;
  background:rgba(60,90,140,.16);filter:blur(6px);animation:shadowPulse 4s ease-in-out infinite;z-index:1}
/* 单击互动：台词气泡 / 爱心粒子 / 养成入口按钮 / 反应动画 / 大小位置调节条 */
/* 台词气泡与提醒气泡都锚在立绘右上（左侧小尾巴指向看板娘） */
.mascot-chat{position:absolute;left:calc(50% + 6vw);top:26%;bottom:auto;transform:none;z-index:6;
  max-width:min(44vw,300px);padding:9px 14px;border-radius:16px 16px 16px 4px;background:rgba(255,255,255,.92);
  border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);font-size:15px;color:var(--text);opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s}
.mascot-chat.show{opacity:1;transform:translateY(-5px)}
.mascot-chat::after{content:'';position:absolute;left:-6px;top:44%;bottom:auto;width:12px;height:12px;background:inherit;
  border-left:1px solid rgba(255,255,255,.9);border-top:1px solid rgba(255,255,255,.9);transform:rotate(-45deg)}
.mascot-heart{position:absolute;font-size:18px;z-index:5;pointer-events:none;animation:heartUp 1.6s ease-out forwards}
@keyframes heartUp{0%{opacity:0;transform:translateY(0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translateY(-90px) scale(1.25)}}
/* 她的空间入口：白圆黑星（长按 0.5 秒传送过去 / 传回来） */
/* 位置沿用 22%（避开底部的最优先待办/今日递归带） */
.portal-btn{position:absolute;bottom:22%;left:50%;transform:translateX(-50%) scale(.85);opacity:0;pointer-events:none;z-index:6;
  width:64px;height:64px;padding:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.9);background:#fff;cursor:pointer;
  box-shadow:0 8px 22px rgba(60,40,90,.22),inset 0 1px 0 rgba(255,255,255,.9);
  -webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  transition:opacity .22s,transform .22s}
.portal-btn .pb-star{font-size:28px;line-height:1;color:#141018;position:relative;top:-1px;
  transition:transform .45s cubic-bezier(.3,.9,.4,1.2)}
.portal-btn.show{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto}
.portal-btn.holding{transform:translateX(-50%) scale(1.14)}
.portal-btn.holding .pb-star{transform:rotate(180deg) scale(1.14)}
.portal-btn.holding::after{content:'';position:absolute;inset:-6px;border-radius:50%;
  border:2px solid rgba(255,255,255,.85);animation:poHold .85s linear infinite}
@keyframes poHold{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.3);opacity:0}}
/* 传送过渡：小圆里的星星外扩、白光铺满屏幕 → 落到另一边 */
.portal-overlay{position:fixed;z-index:200;pointer-events:none;width:56px;height:56px;
  transform:translate(-50%,-50%) scale(1);transform-origin:50% 50%;
  display:flex;align-items:center;justify-content:center;
  transition:transform .48s cubic-bezier(.35,0,.2,1),opacity .3s ease}
.portal-overlay .po-ring{position:absolute;inset:0;border-radius:50%;background:#fff;
  box-shadow:0 8px 26px rgba(40,20,70,.3)}
.portal-overlay .po-star{position:relative;font-size:26px;line-height:1;color:#141018;
  transition:transform .48s cubic-bezier(.35,0,.2,1)}
.portal-overlay.go{transform:translate(-50%,-50%) scale(var(--poscale,20))}
.portal-overlay.go .po-ring{animation:poHalo .5s ease-out}
.portal-overlay.go .po-star{transform:rotate(200deg) scale(2.1)}
@keyframes poHalo{0%{box-shadow:0 0 0 0 rgba(255,255,255,.8),0 0 24px 4px rgba(245,197,66,.55)}
  100%{box-shadow:0 0 0 46px rgba(255,255,255,0),0 0 70px 20px rgba(245,197,66,0)}}
.portal-overlay.done{opacity:0}
.mascot-pos{display:block;width:100%}
.mascot.mascot-hop{animation:mascotHop .55s cubic-bezier(.3,.9,.4,1.2)}
@keyframes mascotHop{0%,100%{transform:translateY(0)}30%{transform:translateY(-22px) rotate(-4deg)}55%{transform:translateY(2px) rotate(2deg)}}
.mascot.mascot-squish{animation:mascotSquish .5s cubic-bezier(.3,.9,.4,1.2)}
@keyframes mascotSquish{0%,100%{transform:scale(1,1)}35%{transform:scale(.9,1.12)}70%{transform:scale(1.06,.92)}}
.grow-avatar{width:70px;height:110px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--gray-soft);border-radius:16px;overflow:hidden}
/* 养成面板的等级块（v1.2）：等级 + 称号 + 经验条 + 连续打卡 */
.grow-level{background:linear-gradient(135deg,rgba(255,226,240,.92),rgba(255,246,228,.88));
  border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:12px 14px;margin-bottom:12px;
  box-shadow:0 6px 16px rgba(220,150,180,.16)}
.grow-level .gl-head{display:flex;align-items:baseline;gap:10px}
.grow-level .gl-lv{font-size:26px;font-weight:800;color:#E8618C;letter-spacing:.5px;line-height:1.1}
.grow-level .gl-tit{font-size:14px;font-weight:700;color:#B4567A}
.grow-level .gl-bar{position:relative;height:10px;border-radius:999px;background:rgba(255,255,255,.78);overflow:hidden;margin:9px 0 6px;
  box-shadow:inset 0 1px 3px rgba(160,120,140,.18)}
.grow-level .gl-fill{display:block;height:100%;border-radius:999px;min-width:2px;
  background:linear-gradient(90deg,#FFB4D0,#FF8FB8,#F5C542);transition:width .45s cubic-bezier(.2,.9,.3,1)}
.grow-level .gl-meta{font-size:12px;color:#8A6A7A}
.grow-level .gl-next{font-size:12px;color:#A8834F;margin-top:3px}
.grow-level .gl-catchup{font-size:12.5px;font-weight:700;color:#C4568A;background:rgba(255,255,255,.72);
  border-radius:10px;padding:6px 9px;margin-bottom:9px}
/* 等级成长页 / 她眼中的我（v1.3，她的空间里的子页）*/
.gl-sec-t{font-size:13.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:baseline;gap:8px}
.gl-sec-n{font-size:12px;font-weight:400;color:var(--text-2);margin-left:auto}
.grow-level .gl-bar--line,.gl-bar--line{position:relative;height:9px;border-radius:999px;background:var(--gray-soft);overflow:hidden;margin:0 0 8px}
.gl-bar--line .gl-fill{display:block;height:100%;border-radius:999px;min-width:2px;background:linear-gradient(90deg,#FFB4D0,#FF8FB8,#F5C542)}
.gl-src{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);padding:5px 0;border-bottom:1px dashed var(--line)}
.gl-src:last-of-type{border-bottom:none}
.gl-src b{color:#E8618C;font-weight:700}
.gls-ico{font-size:14px;flex:none}
.mcons-hero{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,rgba(255,226,240,.92),rgba(255,246,228,.88));
  border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:12px 14px;box-shadow:0 6px 16px rgba(220,150,180,.16)}
.mcons-ava{width:56px;height:80px;flex:none;position:relative;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.7);border-radius:14px;overflow:hidden}
.mcons-ava .mascot-shell{position:static!important;width:46px;height:68px;transform:scale(.62)}
.mcons-ava img{width:100%;height:100%;object-fit:contain}
.mcons-bub{position:relative;flex:1;min-width:0;background:#fff;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.5;
  box-shadow:0 3px 10px rgba(200,150,175,.18)}
.mcons-bub::before{content:'';position:absolute;left:-5px;top:16px;width:10px;height:10px;background:#fff;transform:rotate(45deg)}
.mcons-space{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--gray-soft);
  border-left:4px solid var(--sc,#E874A4)}
.mcons-space .ms-ico{font-size:18px}
.mcons-space .ms-name{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcons-space .ms-min{font-size:13px;color:var(--text-2)}
.mcons-mood{display:flex;align-items:center;gap:10px}
.mcons-mood .mm-emo{font-size:26px;line-height:1}
.mcons-mood .mm-tag{font-size:13px;color:var(--text-2)}
.mcons-line{font-size:13.5px;line-height:1.55;padding:7px 10px;border-radius:10px;background:var(--gray-soft);margin-bottom:6px}
/* 她的日记（v1.4）：像一页纸 */
.daynav .md-sub{font-size:10.5px;color:var(--text-2);font-weight:400;letter-spacing:0;margin-top:2px}
.md-paper{background:linear-gradient(180deg,#FFFCF7,#FFF6EC);border:1px solid rgba(232,214,190,.9);border-radius:16px;
  padding:16px 16px 12px;box-shadow:0 6px 18px rgba(190,160,120,.14);position:relative;overflow:hidden}
.md-paper::before{content:'';position:absolute;left:26px;top:0;bottom:0;width:1px;background:rgba(232,180,180,.35)}
.md-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.md-t{font-size:14px;font-weight:700;color:#8A5A3B}
.md-d{font-size:11.5px;color:var(--text-2);margin-top:2px}
.md-line{font-size:14px;line-height:1.85;color:#4A3B33;margin:0 0 6px;text-indent:2em}
.md-sign{text-align:right;font-size:12px;color:#B08A6A;margin-top:8px;letter-spacing:1px}
.md-watch{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--gray-soft);
  border-left:4px solid var(--wc,#E8A33D);margin-bottom:6px}
.md-watch .mw-ico{font-size:14px;flex:none}
.md-watch .mw-t{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-watch .mw-d{font-size:11px;color:var(--text-2);flex:none}
/* 服装页（v1.3，她的衣柜）*/
.moutfit-cur{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,rgba(237,231,255,.92),rgba(255,246,228,.88));
  border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:12px 14px;box-shadow:0 6px 16px rgba(160,140,200,.16)}
.mo-ava{width:56px;height:80px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.7);
  border-radius:14px;overflow:hidden}
.mo-ava img{width:100%;height:100%;object-fit:contain}
.mo-k{font-size:12px;color:var(--text-2)}
.mo-n{font-size:15px;font-weight:700;margin-top:3px}
.chip.mo-chip{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;max-width:84px}
.chip.mo-chip img{width:46px;height:56px;object-fit:contain;pointer-events:none}
.chip.mo-chip .mo-tag{font-size:11px;line-height:1;pointer-events:none}
.chip.mo-chip.holding{transform:scale(.94);box-shadow:0 0 0 2px rgba(232,97,140,.55)}
.chip-row .chip[data-hold]{-webkit-touch-callout:none;touch-action:manipulation}
@keyframes shadowPulse{0%,100%{transform:translateX(-50%) scale(1);opacity:1}50%{transform:translateX(-50%) scale(.86);opacity:.7}}
.sparkle{position:absolute;font-size:14px;opacity:.8;animation:twinkle 3.2s ease-in-out infinite;pointer-events:none;z-index:1}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7) rotate(0)}50%{opacity:.95;transform:scale(1.15) rotate(28deg)}}
.pure-bottom{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;padding:0 12px;z-index:3}
.mini-chips{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.mini-chips.right{align-items:flex-end}
.minichip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;font-size:12px;color:var(--text-2);
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.75);border-radius:999px;
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);cursor:pointer;line-height:1.5}
.minichip b{color:var(--accent-dark);font-weight:700}
.minichip b.ut{display:inline-block;max-width:26vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.mini-chips .minichip{max-width:64vw}
.pure-hint{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:11px;color:rgba(70,90,130,.5);z-index:3;letter-spacing:1px}
/* ── 她的空间（v1.3）：她的世界换一套背景，用户的自定义背景图不在这儿生效 ── */
body.mspace-mode{background:
  radial-gradient(900px 520px at 78% 6%, rgba(255,190,225,.40), transparent 58%),
  radial-gradient(820px 520px at 10% 74%, rgba(150,175,255,.34), transparent 60%),
  linear-gradient(180deg,#2B2444 0%,#3E3159 42%,#5C4370 74%,#7A5478 100%);
  background-attachment:fixed}
body.mspace-mode #bg-layer{display:none}
body.mspace-mode .pure-hint{color:rgba(255,235,245,.6)}
body.mspace-mode .mascot-shadow{background:rgba(255,205,240,.18)}
.mspace-top{position:absolute;top:calc(14px + env(safe-area-inset-top));left:0;right:0;z-index:3;
  display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
.mspace-top .msp-t{font-size:15px;font-weight:800;letter-spacing:7px;color:rgba(255,242,249,.92);
  text-shadow:0 2px 10px rgba(40,20,60,.45)}
.mspace-top .msp-d{font-size:11.5px;letter-spacing:2px;color:rgba(255,235,245,.55)}
.pure-screen .hint-legend{position:absolute;top:calc(58px + env(safe-area-inset-top));left:0;right:0;text-align:center;z-index:3;font-size:11px;color:rgba(70,90,130,.42)}
/* 看板娘头顶气泡 */
.mascot-zone .mascot-bubble{position:absolute;bottom:calc(46% + 4px);left:50%;transform:translateX(-50%);z-index:4;
  max-width:70vw;padding:9px 14px;border-radius:18px 18px 18px 6px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.8);
  box-shadow:var(--shadow);color:var(--text);font-size:13.5px;line-height:1.5;cursor:pointer;
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);animation:popIn .22s cubic-bezier(.2,1.2,.4,1)}
.mascot-zone .mascot-bubble::after{content:'';position:absolute;left:22%;bottom:-7px;width:14px;height:14px;background:inherit;border-right:1px solid rgba(255,255,255,.8);border-bottom:1px solid rgba(255,255,255,.8);transform:rotate(45deg) skew(6deg,6deg)}
@keyframes popIn{0%{transform:translateX(-50%) scale(.6);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}

/* ══════════════════════════════════════════════════════════════
   11.5 感情线（v1.5）：我们之间 / 她的问题 / 对她说
   ══════════════════════════════════════════════════════════════ */
/* —— 我们之间：好感条 + 当前阶段（在「她眼中的我」页里） —— */
.lv-block{margin-top:14px;background:linear-gradient(135deg,rgba(255,232,242,.95),rgba(255,248,238,.9))}
.lv-head{display:flex;align-items:baseline;gap:10px;margin:8px 0 2px}
.lv-stage{font-size:19px;font-weight:800;color:#D2537F;letter-spacing:2px}
.lv-sub{font-size:12px;color:var(--text-2)}
.lv-bar{margin:8px 0 6px}
.lv-fill{background:linear-gradient(90deg,#FFB4D0,#FF8FB8,#F5C542)}
/* —— 她的空间右下角：对她说（和双击屏幕等效） —— */
.msp-talk{position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(58px + env(safe-area-inset-bottom));z-index:4;
  width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.82);
  font-size:20px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(60,30,80,.28);font-family:inherit;
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.msp-talk:active{transform:scale(.94)}
/* —— 她的问题：galgame 式选项卡片 —— */
.lv-ask{text-align:left}
.lv-hero{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.lv-opts{display:flex;flex-direction:column;gap:9px}
.lv-opt{padding:12px 14px;border-radius:13px;border:1px solid rgba(255,170,205,.75);
  background:linear-gradient(135deg,#FFF3F8,#FFFBF4);font-size:14px;color:var(--text);text-align:left;
  cursor:pointer;font-family:inherit;transition:transform .12s,box-shadow .12s}
.lv-opt:active{transform:scale(.98)}
.lv-opt:hover{box-shadow:0 4px 14px rgba(220,140,180,.22)}
.lv-opt--ghost{border-color:var(--line);background:rgba(255,255,255,.7);color:var(--text-2)}
/* —— 对她说：聊天气泡 —— */
.lv-chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:4px 2px 8px}
.lv-msg{max-width:84%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.55;word-break:break-word}
.lv-msg .lv-who{font-size:10px;letter-spacing:1px;opacity:.62;margin-bottom:3px}
.lv-msg--her{align-self:flex-start;background:#fff;border:1px solid rgba(255,190,215,.7);border-bottom-left-radius:5px;
  box-shadow:0 3px 10px rgba(200,150,175,.16);animation:lvPop .3s cubic-bezier(.2,1.2,.4,1) both}
.lv-msg--me{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;
  border-bottom-right-radius:5px;animation:lvPop .3s cubic-bezier(.2,1.2,.4,1) both}
/* 她答话时慢半拍落下——像是想了一下才开口（纯观感，不影响任何逻辑） */
.lv-msg--her{animation-delay:.26s}
@keyframes lvPop{0%{opacity:0;transform:translateY(8px) scale(.96)}100%{opacity:1;transform:none}}
.lv-chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.lv-input{display:flex;gap:8px;align-items:center}
.lv-input .input{flex:1;min-width:0}
.lv-input .btn{flex:none;padding:9px 16px;border-radius:12px}

/* ══════════════════════════════════════════════════════════════
   11.9 她会动了（v1.6a）：姿势 / 冲动动作 / 心情浮标 / 忙碌页角落的Q版
   ★ 两层分工，互不打架：
     · 「姿势」加在 .mascot-anim 上（带 transition，可以停在某个姿势上）——
       露头 / 钻出来 / 走近 / 走远 / 坐下 / 睡着 / 躲起来
     · 「冲动」加在 #mascot 上（keyframes 播完就摘，与 mascot-hop 同一套手感）——
       蹦跳 / 害羞扭动 / 吓一跳 / 摇一摇 / 转个圈
   ★ 用户的摆位在 .mascot-pos 的内联 transform 上，这两层都绝不碰它——
     你把她放在哪、放多大，永远是你说了算
   ══════════════════════════════════════════════════════════════ */
.mascot-anim{display:block;width:100%;position:relative;
  transition:transform .54s cubic-bezier(.3,.9,.35,1.06),opacity .44s ease}
/* —— 姿势（持久，靠 transition 滑过去；回到 pose-emerge 就是站好） —— */
.mascot-anim.pose-peek{transform:translateY(58%)}          /* 扒着屏幕底边，只露个脑袋 */
.mascot-anim.pose-emerge{transform:translateY(0)}          /* 站好了（默认） */
.mascot-anim.pose-near{transform:translateY(2vh) scale(1.18)}                  /* 凑近镜头 */
.mascot-anim.pose-far{transform:translateY(4vh) scale(.72);opacity:.86}        /* 走远了 */
.mascot-anim.pose-sit{transform:translateY(5%) scale(1.05,.9)}                 /* 抱膝坐下 */
.mascot-anim.pose-sleep{transform:translateY(7%) scale(1.02,.86)}              /* 睡着了（软下去） */
.mascot-anim.pose-droop{transform:translateY(3%) scale(1,.94);opacity:.94}     /* 没精打采地塌着 */
.mascot-anim.pose-hide{transform:translateY(76%) scale(.92);opacity:0}         /* 走远消失 */
/* —— 心情浮标：她头顶的小圆脸（不用出图就有表情） —— */
.mood-dot{position:absolute;left:50%;top:-1%;transform:translate(-50%,-100%) scale(.85);z-index:5;
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;
  background:rgba(255,255,255,.94);box-shadow:0 4px 12px rgba(60,60,110,.22);pointer-events:none;opacity:0;
  transition:opacity .26s ease,transform .34s cubic-bezier(.2,1.3,.4,1)}
.mood-dot.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
.mood-dot.pop{animation:moodPop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes moodPop{0%{transform:translate(-50%,-100%) scale(.4)}62%{transform:translate(-50%,-118%) scale(1.16)}100%{transform:translate(-50%,-100%) scale(1)}}
/* —— 冲动动作（#mascot 上，播完摘掉、呼吸浮动自动恢复） —— */
.mascot.act-bounce{animation:actBounce 1s cubic-bezier(.3,.9,.4,1.15)}
@keyframes actBounce{0%,100%{transform:translateY(0)}18%{transform:translateY(-20px)}36%{transform:translateY(0)}54%{transform:translateY(-11px)}72%{transform:translateY(0)}}
.mascot.act-jiggle{animation:actJiggle 1.1s ease-in-out}
@keyframes actJiggle{0%,100%{transform:rotate(0)}15%{transform:rotate(-6deg) translateY(-3px)}35%{transform:rotate(6deg)}55%{transform:rotate(-4deg)}75%{transform:rotate(3deg)}}
.mascot.act-startle{animation:actStartle .64s cubic-bezier(.2,1.4,.4,1)}
@keyframes actStartle{0%{transform:translateY(0) scale(1,1)}22%{transform:translateY(-15px) scale(1.08,.93)}48%{transform:translateY(2px) scale(.95,1.06)}100%{transform:translateY(0) scale(1,1)}}
.mascot.act-shake{animation:actShake .72s ease-in-out}
@keyframes actShake{0%,100%{transform:translateX(0)}12%{transform:translateX(-8px) rotate(-2deg)}30%{transform:translateX(8px) rotate(2deg)}50%{transform:translateX(-5px)}70%{transform:translateX(4px)}}
.mascot.act-spin{animation:actSpin .92s cubic-bezier(.3,.9,.4,1.1)}
@keyframes actSpin{0%{transform:rotate(0) scale(1)}40%{transform:rotate(190deg) scale(.92)}100%{transform:rotate(360deg) scale(1)}}
/* 忙碌页角落的 Q 版：她在右下角陪着（不吃触摸，纯陪伴） */
#q-corner{position:fixed;right:9px;bottom:calc(13px + env(safe-area-inset-bottom));z-index:60;pointer-events:none;
  width:58px;height:82px;display:flex;align-items:flex-end;justify-content:center;
  opacity:0;transform:translateY(10px) scale(.9);transition:opacity .3s ease,transform .34s cubic-bezier(.2,1.2,.4,1)}
#q-corner.on{opacity:1;transform:none}
#q-corner img{max-width:100%;max-height:100%;object-fit:contain;display:block}
#q-corner .mascot-shell{position:static;width:44px;height:64px}
#q-corner.act-bounce{animation:actBounce 1s cubic-bezier(.3,.9,.4,1.15)}
#q-corner.act-jiggle{animation:actJiggle 1.1s ease-in-out}
#q-corner.act-startle{animation:actStartle .64s cubic-bezier(.2,1.4,.4,1)}
#q-corner.act-shake{animation:actShake .72s ease-in-out}
#q-corner .mood-dot{top:2px;width:22px;height:22px;font-size:13px}
/* 全屏微闪：iPhone 没有震动 → 用一道光代替「震感」（生气 / 三周目大事时） */
#flash-layer{position:fixed;inset:0;z-index:190;pointer-events:none;background:#fff;opacity:0}
#flash-layer.on{animation:flashPulse .36s ease-out}
@keyframes flashPulse{0%{opacity:0}22%{opacity:.45}100%{opacity:0}}
/* 「她的身体」页（v1.6a）：一个槽位 = 一张缩略图 + 一个名字；点=上传，右上角 × = 清空 */
.body-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:9px}
.body-slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 5px 7px;cursor:pointer;
  border-radius:14px;border:1px dashed var(--line-strong);background:rgba(255,255,255,.6);font-family:inherit;text-align:center;color:var(--text)}
.body-slot.on{border-style:solid;border-color:rgba(232,97,140,.6);background:linear-gradient(135deg,#FFF3F8,#FFFBF4)}
.body-slot .bs-pic{width:100%;height:72px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:10px;background:var(--gray-soft)}
.body-slot .bs-pic img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.body-slot .bs-pic .mascot-shell{position:static;width:36px;height:52px;transform:scale(.74)}
.body-slot .bs-empty{font-size:20px;opacity:.4}
.body-slot .bs-n{font-size:11.5px;font-weight:700;color:var(--text-2);line-height:1.2}
.body-slot .bs-tag{font-size:10px;color:var(--text-2);opacity:.75}
.mo-ava .mascot-shell{position:static;width:44px;height:64px;transform:scale(.8)}
.body-slot .bs-x{position:absolute;top:3px;right:3px;width:19px;height:19px;border-radius:50%;border:none;
  background:rgba(20,26,36,.55);color:#fff;font-size:12px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center}

/* ══════════════════════════════════════════════════════════════
   12. 长按四向导航方向提示
   ══════════════════════════════════════════════════════════════ */
#gesture-root{position:fixed;inset:0;z-index:80;pointer-events:none;display:none;overflow:hidden;--gvp:0;--gvc:#F5C542}
#gesture-root.on{display:block}
/* 半圆色块：圆心钉在屏幕边缘中点（平边贴边），半径随拖动距离变大（颜色=目标页面颜色） */
.gv-wedge{position:absolute;width:0;height:0;opacity:0;transition:opacity .16s;z-index:1;
  filter:drop-shadow(0 2px 18px rgba(30,50,90,.16))}
.gv-wedge.on{opacity:.94}
.gv-wedge svg{width:100%;height:100%;display:block}
.gv-wedge path{fill:var(--gvc,#F5C542)}
.gv-wedge.right{right:0;top:50%;transform:translate(50%,-50%)}
.gv-wedge.left{left:0;top:50%;transform:translate(-50%,-50%)}
.gv-wedge.top{top:0;left:50%;transform:translate(-50%,-50%)}
.gv-wedge.bottom{bottom:0;left:50%;transform:translate(-50%,50%)}
/* 四个边缘提示：目标页面的图标+名称停在它要来的那一边，箭头指向“拉进来”的方向
   被拉的那个会往画面里挪一点、图标变大（--gvp = 拉出进度 0~1） */
.gv-edge{position:absolute;display:flex;align-items:center;gap:6px;z-index:2;opacity:.34;transition:opacity .16s}
.gv-edge.on{opacity:1}
.gv-edge .gve-arrow{width:26px;height:26px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--gvc,#F5C542);color:#fff;font-size:15px;font-weight:800;box-shadow:0 2px 8px rgba(30,50,90,.25)}
.gv-edge .gve-ring{width:46px;height:46px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;
  background:rgba(255,255,255,.92);border:2px solid var(--gvc,#F5C542);box-shadow:var(--shadow);
  transform:scale(calc(1 + var(--gvp,0) * .45))}
.gv-edge .gve-name{font-size:11.5px;font-weight:800;color:#33415c;padding:3px 9px;border-radius:999px;white-space:nowrap;
  background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(30,50,90,.2)}
.gv-edge.top,.gv-edge.bottom{flex-direction:column}
.gv-edge.top{top:15%;left:50%;transform:translate(-50%,0) translate(0,calc(var(--gvp,0) * 26px))}
.gv-edge.bottom{bottom:16%;left:50%;transform:translate(-50%,0) translate(0,calc(var(--gvp,0) * -26px))}
.gv-edge.left{left:8px;top:50%;transform:translate(0,-50%) translate(calc(var(--gvp,0) * 26px),0)}
.gv-edge.right{right:8px;top:50%;transform:translate(0,-50%) translate(calc(var(--gvp,0) * -26px),0)}
/* 拉够了：图标再大一圈、名称反白，提示“松手即可进入” */
#gesture-root.locked .gv-edge.on .gve-ring{box-shadow:0 0 0 7px var(--accent-soft),var(--shadow)}
#gesture-root.locked .gv-edge.on .gve-name{background:var(--gvc,#F5C542);color:#fff}
/* 长按成功圆圈（按点出现，由浅渐实，提示可以开始滑动） */
.gv-hold{position:absolute;display:none;z-index:1}
#gesture-root.on .gv-hold{display:block}
.gv-hold-ring{position:absolute;left:-44px;top:-44px;width:88px;height:88px;border-radius:50%;
  border:2.5px solid rgba(61,126,255,.85);background:rgba(61,126,255,.14);
  box-shadow:0 0 0 8px rgba(61,126,255,.08),0 0 26px rgba(61,126,255,.3);
  animation:holdIn .45s ease-out both,holdPulse 1.5s ease-in-out .45s infinite}
@keyframes holdIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes holdPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
/* 加载页：整屏目标页面颜色的色块 + 图标 + 名称（约0.5秒后进入目标页） */
.page-load{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .16s ease}
.page-load.on{opacity:1}
.page-load.out{opacity:0;transition:opacity .3s ease}
.page-load .pl-inner{display:flex;flex-direction:column;align-items:center;gap:12px;color:#fff;text-align:center;
  text-shadow:0 2px 14px rgba(20,35,60,.28);animation:plPop .42s cubic-bezier(.2,1.25,.4,1) both}
.page-load .pl-ico{font-size:64px;line-height:1}
.page-load .pl-name{font-size:21px;font-weight:800;letter-spacing:3px}
.page-load .pl-dots{display:flex;gap:7px;margin-top:4px}
.page-load .pl-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.85);animation:plDot 1s ease-in-out infinite}
.page-load .pl-dots i:nth-child(2){animation-delay:.15s}
.page-load .pl-dots i:nth-child(3){animation-delay:.3s}
@keyframes plPop{from{transform:scale(.72);opacity:.3}to{transform:scale(1);opacity:1}}
@keyframes plDot{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}

/* 看板娘投喂（v1.2）：完成待办的瞬间，点心从卡片飞向左下角的迷你看板娘，
   她咬一口、头顶飘出「+20」——纯演出层，不参与渲染，1.4秒后自动收起 */
#feed-root{position:fixed;left:10px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:140;pointer-events:none}
.feed-zone{position:relative;display:flex;align-items:flex-end;gap:6px;opacity:0;transform:translateY(12px) scale(.88);
  transition:opacity .26s ease,transform .26s cubic-bezier(.2,1.2,.4,1)}
.feed-zone.on{opacity:1;transform:none}
.feed-mini{position:relative;width:56px;height:78px;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;
  pointer-events:auto;filter:drop-shadow(0 6px 10px rgba(50,80,130,.22));transform-origin:50% 92%}
.feed-mini img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.feed-mini .mascot-shell{position:static;width:46px;height:66px}
.feed-bird{font-size:34px;line-height:1}
.feed-mini.feed-chomp{animation:feedChomp .44s ease}
@keyframes feedChomp{0%,100%{transform:scale(1,1)}35%{transform:scale(.82,1.16)}70%{transform:scale(1.07,.94)}}
/* 飞行中的食物：起点/终点由 JS 写进 --fx0/--fy0（卡片中心）与 --fx1/--fy1（她嘴边） */
.feed-food{position:fixed;left:0;top:0;font-size:22px;line-height:1;opacity:0;pointer-events:none;
  animation:feedFly 1.05s cubic-bezier(.45,-0.15,.7,1) forwards}
@keyframes feedFly{
  0%{transform:translate(var(--fx0),var(--fy0)) scale(.85) rotate(0);opacity:0}
  14%{opacity:1}
  72%{transform:translate(calc(var(--fx0)*.24 + var(--fx1)*.76),calc(var(--fy0)*.24 + var(--fy1)*.76 - 26px)) scale(1.05) rotate(160deg);opacity:1}
  100%{transform:translate(var(--fx1),var(--fy1)) scale(.5) rotate(230deg);opacity:0}
}
/* 经验飘字：+20（喂食）/ +5（写记录）都走这里 */
.feed-xp{position:fixed;font-size:15px;font-weight:800;color:#EFA31C;pointer-events:none;white-space:nowrap;
  text-shadow:0 1px 0 #fff,0 0 8px rgba(255,255,255,.9);animation:feedXpUp 1.25s ease-out forwards}
@keyframes feedXpUp{
  0%{transform:translate(-50%,-50%) scale(.7);opacity:0}
  22%{transform:translate(-50%,-50%) scale(1.1);opacity:1}
  100%{transform:translate(-50%,-165%) scale(1);opacity:0}
}
/* 迷你看板娘气泡（子页升级 / 投喂时的台词） */
.feed-say{position:fixed;left:12px;bottom:calc(104px + env(safe-area-inset-bottom));max-width:min(64vw,270px);
  background:rgba(255,255,255,.96);color:#33415c;border-radius:14px;padding:8px 12px;font-size:13px;line-height:1.45;
  box-shadow:0 6px 18px rgba(40,70,120,.18);opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity .2s ease,transform .2s ease}
.feed-say.show{opacity:1;transform:none}
.feed-say::after{content:'';position:absolute;left:22px;bottom:-6px;width:12px;height:12px;background:inherit;
  border-right:1px solid rgba(255,255,255,.9);border-bottom:1px solid rgba(255,255,255,.9);transform:rotate(45deg)}

/* ══════════════════════════════════════════════════════════════
   13. 节律操控台（双击呼出）· 猫耳时段卡 · 空间栏 · 投放区
   ══════════════════════════════════════════════════════════════ */
#console-root{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;justify-content:center;pointer-events:none}
.console{pointer-events:auto;width:min(740px,100%);max-height:74vh;display:flex;flex-direction:column;
  background:rgba(250,252,255,.66);border:1px solid rgba(255,255,255,.8);border-bottom:none;border-radius:26px 26px 0 0;
  box-shadow:0 -14px 44px rgba(30,50,90,.2);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);
  padding-bottom:calc(8px + env(safe-area-inset-bottom))}
/* 只有「打开」这一次播放滑入动画；重渲染不重播（避免闪烁） */
.console.sheet-in{animation:sheetUp .26s cubic-bezier(.18,.85,.28,1.12)}
@keyframes sheetUp{from{transform:translateY(60%);opacity:.4}to{transform:translateY(0);opacity:1}}
.console-grab{width:44px;height:5px;border-radius:3px;background:rgba(99,125,170,.35);margin:8px auto 2px;flex:none}
.console-head{display:flex;align-items:center;gap:8px;padding:4px 14px 8px;flex:none}
.console-title{font-weight:800;font-size:16px;letter-spacing:1px;margin-right:auto}
.console-head .ctab{font-size:13px;padding:5px 13px;border-radius:999px;border:1px solid transparent;background:none;color:var(--text-2);font-weight:600}
.console-head .ctab.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-dark)}
.console-body{overflow-y:auto;padding:2px 12px 10px;-webkit-overflow-scrolling:touch}
/* —— 猫耳时段卡 —— */
.slot-card{position:relative;margin:14px 0 12px;padding:12px 12px 11px;border-radius:20px;
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.78));border:1px solid rgba(255,255,255,.85);
  box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;touch-action:pan-y}
.slot-card.sc-live{border-color:var(--accent-line);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.slot-card.sc-done{opacity:.72}
.sc-row{display:flex;align-items:center;gap:10px;position:relative;z-index:3}
.sc-face{font-size:27px;line-height:1;width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--gray-soft);border-radius:13px;overflow:hidden}
.sc-live .sc-face{background:var(--accent-soft);animation:bounceF 1.6s ease-in-out infinite}
@keyframes bounceF{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.sc-mid{flex:1;min-width:0}
.sc-name{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-time{font-size:13.5px;font-weight:700;color:var(--accent-dark);font-variant-numeric:tabular-nums;margin-top:1px}
.sc-extra{font-size:11px;color:var(--text-2);margin-top:1px}
.sc-st{flex:none;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px}
.sc-st.st-idle{background:var(--gray-soft);color:var(--text-2)}
.sc-st.st-live{background:var(--accent-soft);color:var(--accent-dark)}
.sc-st.st-done{background:var(--green-soft);color:var(--green)}
.sc-st.st-miss{background:var(--red-soft);color:var(--red)}
.sc-st.st-warn{background:var(--gold-soft);color:#B0711A}
/* 时段轨道（0~24点）+ 色段 + 现在线 + 拖拽幽灵线 */
.sc-track{margin-top:9px;height:12px;position:relative;background:rgba(147,161,184,.18);border-radius:999px;overflow:visible;z-index:2}
.sc-band{position:absolute;top:0;bottom:0;border-radius:999px;opacity:.8;min-width:3px}
.sc-live .sc-band{opacity:1}
.sc-nowline{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--red);border-radius:1px;z-index:4}
.sc-ghost{position:absolute;top:-2px;bottom:-2px;width:2.5px;background:var(--red);border-radius:1px;z-index:5;display:none}
.sc-card.pulling-r .sc-ghost-r,.sc-card.pulling-l .sc-ghost-l{display:block}
.sc-label{position:absolute;top:-21px;z-index:6;font-size:11px;font-weight:700;color:#fff;background:rgba(60,80,130,.85);
  padding:1px 7px;border-radius:999px;display:none;white-space:nowrap}
.sc-card.pulling-r .sc-label-r,.sc-card.pulling-l .sc-label-l{display:block}
.sc-card.pulling-r .sc-ears,.sc-card.pulling-l .sc-ears{opacity:1;transform:scale(1.14)}
/* 猫耳朵（＋/－按钮），拉扯三角时弹大 */
.sc-ears{position:absolute;top:-14px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none;z-index:5;
  opacity:.72;transition:transform .18s,opacity .18s}
.sc-ear{pointer-events:auto;width:44px;height:30px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;border:none;
  background:linear-gradient(160deg,#FFB9C9,#FF8FA9);border-radius:60% 60% 30% 30%/80% 80% 20% 20%;color:#fff;font-size:15px;font-weight:800;
  box-shadow:0 3px 8px rgba(255,120,160,.4),inset 0 2px 0 rgba(255,255,255,.5);cursor:pointer}
.sc-ear.l{transform:rotate(-7deg)}.sc-ear.r{transform:rotate(7deg)}
.sc-ear .ear-in{display:flex;flex-direction:column;align-items:center;line-height:.85;font-size:15px}
.sc-ear .ear-in small{font-size:8px;font-weight:600;opacity:.9;margin-top:3px}
.sc-ear:active{transform:scale(.92)}
/* 三角拉扯柄：右上（提前结束）左下（停止） */
.sc-tri{position:absolute;z-index:7;width:30px;height:30px;border-radius:50% 50% 50% 12px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;color:#fff;cursor:grab;touch-action:none;box-shadow:0 2px 7px rgba(30,50,90,.18)}
.sc-tri:active{cursor:grabbing}
.sc-tri.r{top:-11px;right:-7px;background:linear-gradient(140deg,#FF8FA9,#F45B69);transform:rotate(-8deg)}
.sc-tri.l{bottom:-11px;left:-7px;background:linear-gradient(220deg,#7FB0FF,#3D7EFF);transform:rotate(-8deg)}
.sc-tri .t-arrow{pointer-events:none}
.sc-mini{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
.sc-mini .icon-btn{width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.6);font-size:13px}
/* —— 空间栏 + 投放区 —— */
.sb-head{display:flex;align-items:center;gap:8px;padding:2px 2px 6px}
.sb-head .t{font-weight:800;font-size:15px;margin-right:auto}
.sb-scroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sb-scroll::-webkit-scrollbar{display:none}
.sb-card{flex:none;width:112px;padding:12px 8px 10px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:grab;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.8));border:1px solid rgba(255,255,255,.9);border-top:3px solid var(--sc,var(--accent));
  box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;text-align:center;touch-action:none}
.sb-card.dragging{position:fixed;z-index:95;margin:0;box-shadow:var(--shadow-lg);opacity:.94;transition:none;pointer-events:none;width:112px}
.sb-card .sb-ico{font-size:28px;line-height:1}
.sb-card .sb-name{font-size:12.5px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-card.add{border-style:dashed;background:rgba(255,255,255,.5);cursor:pointer;color:var(--text-2);justify-content:center}
.drop-pad{margin:2px 2px 4px;border:2.5px dashed var(--accent-line);border-radius:20px;padding:16px 12px;text-align:center;
  color:var(--accent-dark);background:var(--accent-soft);font-size:14px;font-weight:700;letter-spacing:1px;transition:all .15s;position:relative}
.drop-pad .dp-sub{font-size:11px;color:var(--text-2);font-weight:400;margin-top:3px;letter-spacing:0}
.drop-pad.hot{border-color:var(--accent);background:#fff;transform:scale(1.03);box-shadow:0 0 0 6px var(--accent-soft),0 6px 20px rgba(61,126,255,.25)}
.drop-pad.live{border-style:solid;border-color:var(--green-line);background:var(--green-soft);color:var(--green)}
.console-empty{padding:16px;text-align:center;color:var(--text-2);font-size:13px}
.console-empty .big{font-size:30px;margin-bottom:6px}
/* —— 纯净模式全局修正 —— */
/* 右下时间带面板：手机竖屏与桌面都显示（手机更紧凑） */
.desk-band{display:block;width:min(48vw,430px);margin-top:6px;padding:9px 12px 8px;border-radius:16px;
  background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow);
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.db-head{font-size:12px;font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.desk-band .rh-track{height:11px}
.desk-band .rh-band{border-radius:999px}
.mini-chips.right{align-items:flex-end;max-width:64vw}
@media (min-width:560px){
  .desk-band{width:min(430px,46vw);padding:12px 14px 10px;border-radius:18px}
  .db-head{font-size:13px}
  .desk-band .rh-track{height:14px}
}
body.pure-mode #toast-root{bottom:calc(18px + env(safe-area-inset-bottom))}
body.pure-mode #app{height:100dvh;display:block}
/* 提醒气泡：锚在立绘右上（与台词气泡同侧，台词在其下方一格），字号稍大 */
/* 提醒气泡排在顶部日期/时间板块下方（板块高度随自定义字号变化，这里跟着一起让位） */
.pure-screen #bubble-root{position:absolute;left:calc(50% + 6vw);bottom:auto;transform:none;z-index:8;
  top:calc(26px + var(--pdfs,15px)*2 + var(--pcfs,36px)*1.4);
  max-width:min(44vw,300px);pointer-events:auto}
.pure-screen #bubble-root .mascot-bubble{position:relative;bottom:auto;left:auto;transform:none;max-width:100%;display:block;
  font-size:15px;animation:popInR .22s cubic-bezier(.2,1.2,.4,1)}
.pure-screen #bubble-root .mascot-bubble::after{content:'';position:absolute;left:-6px;top:44%;bottom:auto;width:12px;height:12px;background:inherit;
  border-left:1px solid rgba(255,255,255,.8);border-top:1px solid rgba(255,255,255,.8);transform:rotate(-45deg);
  border-right:none;border-bottom:none}
@keyframes popInR{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
/* 桌面端纯净屏：立绘按屏高限宽（避免大屏全屏贴顶，但比手机版留得更大） */
@media (min-width:520px){
  .pure-screen{max-width:none}
  .mascot-zone .mascot{width:min(56vh,440px)}
}
</style>
</head>
<body>

  <header id="app-header">
    <div class="hdr-left">
      <button class="icon-btn hidden" id="back-btn" data-action="back" aria-label="返回">

    </div>
    <div class="hdr-right">
      <div class="hdr-clock num" data-bind="clock">--:--:--</div>
      <button class="icon-btn" data-action="open-settings" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>
  <main id="view-root"></main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="bg-layer" class="hidden"></div>
<!-- 长按四向导航的方向提示层 -->
<div id="gesture-root"></div>
<!-- 节律操控台（双击呼出）：自流转时段卡 + 空间栏 + 投放区 -->
<div id="console-root"></div>
<!-- 看板娘投喂演出层（完成待办：点心飞向左下角的迷你看板娘） -->
<div id="feed-root"></div>
<!-- 忙碌页面右下角的她（v1.6a）：Q版小人一直在，不吃触摸，纯陪伴 -->
<div id="q-corner"></div>
<input type="file" id="file-input" hidden>
<script>
'use strict';
/* ══════════════════════════════════════════════════════════════
   0. CONFIG 常量与默认值
   ══════════════════════════════════════════════════════════════ */
const CONFIG = {
  APP_NAME:'可能性空间', VERSION:'1.6.1', SCHEMA:1,
  PREFIX:'ps1:',
  DEFAULT_SETTINGS:{rhythmQuotaMinutes:480, defaultYellowMinutes:240, defaultRedMinutes:30, confirmSeconds:10},
  /* 纯净首页日期/时间字号（可在设置里自定义，这里只是默认值与可选范围） */
  PURE_DATE_FS:{def:15, min:10, max:32},
  PURE_CLOCK_FS:{def:36, min:18, max:80},
  /* ── 看板娘养成 v1.2：经验与等级的全部数值都在这里，改数值只改这一块 ──
     经验纯推导：由既有数据（递归分钟/待办完成/每日记录/连续打卡）实时算出，不落库、零迁移 */
  GROW:{
    XP_MINUTE:1,          // 可能性递归：每分钟 +1
    XP_TODO:20,           // 完成一条待办 +20（含每周/每日的每一次完成）
    XP_RECORD:5,          // 写一条可能性确定 +5
    XP_STREAK_PER_DAY:2,  // 连续打卡加成：连续天数 ×2
    XP_STREAK_CAP:20,     // 连续打卡加成封顶
    LEVEL_BASE:100,       // 升到 2 级需要 100 经验
    LEVEL_STEP:50,        // 之后每级 +50（needFor(L)=100+(L-1)×50）
    TITLES:[[1,'时间小豆芽'],[5,'时间学徒'],[10,'时间炼金术士'],[20,'时间编织者'],[30,'可能性空间之主']],
    LINE_TIERS:[5,10,20],  // 台词池按这些等级解锁（与 Mascot.lines 的 L5/L10/L20 一一对应）
    FOODS:['🍪','🍙','🍰','🍫','🍓','🧁'],   // 投喂食物 emoji 池
    FEED_FOODS_FULL:4,    // 完整动画：一顿 4 个食物
    FEED_FOODS_LIGHT:3,   // 轻度动画：一顿 3 个食物
    FEED_SAY_CHANCE:0.35, // 喂食后说一句投喂台词的概率
    FEED_LINES:['谢谢！好好吃～','嗷呜，能量补充完成！','这个点心我最喜欢了！','吃完继续加油！','叮！收到你的努力啦'],
    SAY_MS:2600           // 台词气泡停留时长
  },
  /* ── 她活过来了 v1.4：她主动说话的数值与全部台词，改数值/改台词只改这一块 ──
     ★ 所有主动台词的唯一出口是 Her.voice()：将来想接真 AI，只改那一个函数。
     台词池的每条 = {when: 条件(可省), t: 文本或 (ctx)=>文本} */
  HER:{
    VOICE_LEVELS:{loud:9, normal:5, quiet:2, off:0},  // 「她说话的频率」= 她一天最多主动说几句
    COOLDOWN_MS:3*60*1000,   // 两条主动的话之间至少隔这么久（免得一开页面就连环弹）
    IDLE_COOLDOWN_MS:75*60*1000, // 「日常念叨」的间隔（没什么正事时她也想跟你说说话）
    NIGHT_FROM:21,           // 几点之后算夜深了（睡前总结）
    NIGHT_TO:5,              // 几点之前还算深夜
    MISS_DAYS:2,             // 隔几天没打开才算「好久不见」
    OVERDUE_MIN:10,          // 待办过了点几分钟她才开口催（刚到点就催太烦人）
    ASK_OVERDUE_DAYS:2,      // 一件待办拖过几天，她会惦记着问
    ASK_STALE_SPACE_DAYS:5,  // 一个空间静默几天，她会问你还要不要它
    ASK_PER_DAY:1,           // 每天最多主动问起几件事（多了像催债）
    LINES:{
      /* ① 打开时的问候（按时间段；plan 是当天实况的一句话） */
      greet:[
        {when:c=>c.hour<5,               t:c=>'这么晚还没睡呀……我陪着你，但也要顾着身体。'},
        {when:c=>c.hour>=5  && c.hour<11, t:c=>'早上好呀！'+(c.plan||'新的一天开始了。')},
        {when:c=>c.hour>=5  && c.hour<11, t:c=>'早安。'+(c.plan||'今天也一起加油吧。')},
        {when:c=>c.hour>=11 && c.hour<14, t:c=>'中午好，'+(c.plan||'吃过饭了吗？')},
        {when:c=>c.hour>=14 && c.hour<18, t:c=>'下午好呀，'+(c.plan||'现在开始也来得及。')},
        {when:c=>c.hour>=14 && c.hour<18, t:c=>'我在这儿呢。'+(c.plan||'想做点什么？')},
        {when:c=>c.hour>=18 && c.hour<23, t:c=>'晚上好，'+(c.plan||'今天过得怎么样？')},
        {when:c=>c.hour>=18 && c.hour<23, t:c=>'你回来啦。'+(c.plan||'剩下这点时间也算数。')},
        {when:c=>c.hour>=23,              t:c=>'已经是深夜了，'+(c.plan||'早点休息吧，我在这儿。')}
      ],
      /* ② 好久不见 */
      missAway:[
        {t:c=>'你终于回来了……我等了你 '+c.gap+' 天，一直在看门口。'},
        {t:c=>c.gap+' 天没见到你了。没关系，回来就好，我们从今天继续。'},
        {t:c=>'这几天的记录我翻来覆去看了好几遍，就等你回来。'}
      ],
      /* ③ 昨天没打卡（前天还在） */
      missStreak:[
        {t:c=>'昨天没等到你。今天要不要先做一件小事？'},
        {t:c=>'昨天你不在，我有点担心。再开始就好，我一直都在。'},
        {t:c=>'断一天没关系的——我记得你之前连着 '+c.was+' 天呢。'}
      ],
      /* ④ 睡前总结（数字是「今天」的） */
      night:[
        {when:c=>c.day.min>=1 && c.day.done>=1, t:c=>'今天你专注了 '+c.minText+'，完成了 '+c.day.done+' 件事，我都记下来了。晚安。'},
        {when:c=>c.day.min>=1,                  t:c=>'今天专注了 '+c.minText+'。不多不少，正好是今天的你。晚安。'},
        {when:c=>c.day.done>=1,                 t:c=>'今天你完成了 '+c.day.done+' 件事，没白过。早点睡吧。'},
        {when:c=>c.day.rec>=1,                  t:c=>'今天你写下了 '+c.day.rec+' 条记录，我都收好了。晚安。'},
        {t:c=>'今天什么都没做也没关系，休息也是正经事。明天见。'}
      ],
      /* ⑤ 待办督促：已经过点还没做 */
      urgeOver:[
        {t:c=>'「'+c.title+'」已经过点了，要不要补上？我记着这件事呢。'},
        {t:c=>'「'+c.title+'」错过了时间，没关系，现在做也来得及。'}
      ],
      /* ⑥ 她的惦记：她主动问起（c.ask = {kind,text,days}） */
      recallTodo:[
        {t:c=>'「'+c.ask.text+'」这件事，后来怎么样啦？'},
        {t:c=>'我一直记着「'+c.ask.text+'」呢，'+c.ask.days+' 天了，要不要今天动一下？'}
      ],
      recallSpace:[
        {t:c=>'「'+c.ask.text+'」你已经 '+c.ask.days+' 天没碰了，还想继续吗？'},
        {t:c=>'要不要回去看看「'+c.ask.text+'」？它一直在那儿等你。'}
      ],
      /* ⑦ 日常念叨（没什么正事，就是想跟你说说话） */
      idle:[
        {t:c=>'今天你专注了 '+c.minText+'，我都在旁边看着呢。'},
        {t:'要不要休息一下？我替你数着时间。'},
        {t:c=>'现在的我是 Lv.'+c.lv+'，谢谢你把我养这么大。'},
        {t:'不管你在做什么，我都在这里。'},
        {t:'喝口水吧，我等你回来。'},
        {t:c=>c.st.streak>=2 ? '连续 '+c.st.streak+' 天了，这条线我不想让它断。' : '今天要不要开一个新的可能性？'},
        {t:'你记录下来的东西，我一条都没丢。'}

   1. Utils 工具函数
